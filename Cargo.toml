[workspace]
resolver = "2"
members = [
    # Wire-protocol types — bottom of the dep graph.
    "oicp-client",
    "oicp-types",
    # The NEUTRAL kernel — identity + provenance owned by no product domain.
    # Minted 2026-08-20 (noun-convergence rung nc-1-kernel) because the 23
    # types all three domains spoke were 22-owned by corpus-engine. A second
    # layer-0 membrane beside oicp-types, deliberately NOT merged with it:
    # oicp is what a node advertises, this is what content IS.
    "kernel-types",

    # Knowledge layer (LanceDB + Tantivy + extractors + chunkers).
    "corpus-engine",
    "corpus-engine/xtask",
    # SCIP call graph + per-language exporter dispatch. Carved out of
    # corpus-engine 2026-05-23 to cut the rebuild blast radius for scip
    # changes from 20 crates to ~6.
    "corpus-engine-scip",
    # ATOS state — FeatureStore + plan_items + DESIGN.md design_signals.
    # Step 2 of the corpus-engine decomposition (see DECOMPOSITION.md).
    "corpus-engine-atos",
    # NoteStore + project_docs + notes_sync. Step 3 of the corpus-engine
    # decomposition. notes.rs (2781 LOC) cleared from the §3.1 list.
    "corpus-engine-notes",
    # Git archaeology — commit-history mining, rough-edge surfacing,
    # atom-provenance evaluation. Step 4 of the decomposition.
    "corpus-engine-archaeology",
    # YieldHook — the cooperative foreground-yield contract shared by
    # the data plane and the watchers. Tier-0 leaf extracted during
    # Step 1 (watchers) so both crates share one trait identity.
    "corpus-engine-yield",
    # Lint/test/project-index watchers + result stores. Step 1 of the
    # decomposition — cuts watcher-edit rebuild blast from 18 crates to
    # ~6. See DECOMPOSITION.md.
    "corpus-engine-watchers",
    # Section detectors (SectionDetector/DetectedSection/ChapterRegexDetector/
    # TocAnchoredDetector) — corpus-engine's own segmentation vocabulary,
    # carved into a `regex`-only leaf so the studio SectionTool can share the
    # ONE implementation by reaching DOWN instead of corpus-engine reaching up
    # into sovereign-contracts (noun-convergence rung 2).
    "corpus-engine-sections",

    # Sovereign — local agent runtime + CLI + desktop + server.
    "sovereign/crates/sovereign-contracts",
    "sovereign/crates/sovereign-core",
    "sovereign/crates/sovereign-inference",
    "sovereign/crates/sovereign-store",
    "sovereign/crates/sovereign-time",
    "sovereign/crates/sovereign-tools",
    # GLiNER (ONNX) per-chunk entity extraction — carved out of sovereign-tools
    # 2026-07-17 so the fragile ort=rc.9 stack is a mandatory dep of only the
    # four binaries that need it, not an optional feature on a shared crate
    # (which Cargo unification compiled two ways, breaking -p builds).
    "sovereign/crates/sovereign-gliner",
    # The enrichment catalog — the on-disk store's layout, its `config.json`
    # schema and its inventory, below every host that touches it. Minted
    # 2026-08-20 (noun-convergence rung nc-16-shared-capability) after the
    # schema was found implemented three times because it lived in a binary.
    "sovereign/crates/sovereign-enrichment-catalog",
    # THE recipe that commissions a `Runtime` — the router stack, the turn
    # tool registry and the enrichment lane, below every host. Minted
    # 2026-08-25 (TOPOLOGY.md §10 phase 5c) after the same recipe was found
    # implemented three times, for the same reason as the catalog above: it
    # needs sovereign-tools + sovereign-gliner, and every crate that could
    # already see both was a host binary.
    "sovereign/crates/sovereign-runtime-recipe",
    "sovereign/crates/sovereign-turn-client",
    "studio/crates/sovereign-tools-base",
    "studio/crates/sovereign-recipe-author",
    # Workflow substrate — Step · Artifact · Runner (a typed dataflow over
    # local-model steps; the general form of corpus-ingest/enrichment/agent).
    "studio/crates/sovereign-workflow",
    # Daemon-runnable workflow host — the registry assembly + in-process runner +
    # catalog, hoisted out of the CLI so the daemon can run workflows (the living
    # trigger's prerequisite).
    "studio/crates/sovereign-workflow-host",
    # Headless studio CLI — authors + tests recipes and runs workflows against any
    # OICP daemon, linking ONLY the studio crates + shared leaves (no corpus-engine,
    # no sovereign-core). The proof the studio package is independently usable.
    "studio/crates/sovereign-studio",
    # MeshApp explorer ops — pure path-in/DTO-out projections shared by the
    # desktop Tauri host and the `sovereign meshapp dev` CLI server.
    "sovereign/crates/sovereign-meshapp",
    "sovereign/crates/sovereign-mesh",
    # Supervised compute-child process boundary (DISTRIBUTED_PILOT_READINESS.md
    # P1) — child-process supervisor (extracted from sovereign-desktop) + the
    # native lossless wire + child server/entrypoint + daemon-side provider
    # facade & replica pool.
    "sovereign/crates/sovereign-compute",
    "sovereign/crates/sovereign-server",
    "sovereign/crates/sovereign-desktop/src-tauri",
    "sovereign/crates/sovereign-cli",
    "sovereign/crates/sovereign-cli-shared",
    "sovereign/crates/sovereign-cli-dev",
    "sovereign/crates/sovereign-cli-daemon",
    "sovereign/crates/sovereign-cli-llm",
    "sovereign/crates/sovereign-atos",
    "sovereign/crates/sovereign-eval",
    "sovereign/crates/sovereign-authoring-harness",
    "sovereign/crates/sovereign-pipeline",
    "sovereign/crates/sovereign-work-atlas",
    "sovereign/crates/sovereign-agent-bench",
    "sovereign/crates/commonwealth-agent-tools",
    # TDD-machine backend (red-green-refactor solver registry).
    # See sovereign/docs/TDD_MACHINE_DESIGN.md.
    "sovereign/crates/commonwealth-tdd",

    # Commonwealth — symmetric mesh daemon.
    "commonwealth/crates/commonwealth-core",
    # PeerTransport seam — (peer, traffic class) → dialable endpoints.
    # IP overlay today; iroh slots in behind the same trait later.
    "commonwealth/crates/commonwealth-transport",
    "commonwealth/crates/commonwealth-discovery",
    "commonwealth/crates/commonwealth-inference",
    "commonwealth/crates/commonwealth-api",
    "commonwealth/crates/commonwealth-knowledge",
    "commonwealth/crates/commonwealth-test-harness",
    "commonwealth/crates/commonwealth-app",
    "commonwealth/crates/commonwealth-state",
    # Standalone OICP v0.4 conformance tester — minimal deps (oicp-types + HTTP),
    # liftable by any third party certifying their own host.
    "commonwealth/crates/oicp-conformance",

    # Quality program (2026-07-11) — schema + evaluator for the declared
    # layer map (quality/ARCH_LAYERS.toml). One parser shared by the xtask
    # layer-gate (Cargo-declared edges) and the code-intel arch_report
    # (SCIP-observed edges) so the two halves can't drift.
    "quality/arch-layers",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
# Minimum supported Rust version. While every crate is unpublished the pinned
# toolchain (rust-toolchain.toml) IS the MSRV; the liftable leaf crates
# (oicp-types, oicp-client, sovereign-contracts, oicp-conformance) inherit
# this so the contract they export carries an explicit floor.
rust-version = "1.95"
# Single license across the monorepo: GNU AGPL-3.0-or-later. Sovereign is
# source-available for audit; the AGPL network-use clause is the point for a
# mesh/daemon system. (Pre-monorepo, corpus-engine + commonwealth were
# Apache-2.0 and sovereign was MIT; consolidated to AGPL-3.0-or-later for the
# open-source launch — full text in /LICENSE.)
license = "AGPL-3.0-or-later"

# Workspace lint policy (tech-debt clean-start, 2026-06-03). Members opt in
# with `[lints]\nworkspace = true`. These clippy lints flag subjective
# design/shape choices and cosmetic doc formatting — NOT bugs — and are
# allowed as deliberate policy: the codebase has many-arg constructors and
# complex closure types by design. Substantive lints (dead_code, unused,
# correctness) are intentionally left at warn/deny and fixed, not allowed.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
module_inception = "allow"
enum_variant_names = "allow"
should_implement_trait = "allow"
new_without_default = "allow"
len_without_is_empty = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
items_after_test_module = "allow"
# `let mut x = T::default(); x.a = ..;` then accumulate `x` across the fn —
# clippy itself marks the struct-literal rewrite MaybeIncorrect here because
# the value is mutated downstream; the sequential form is clearer.
field_reassign_with_default = "allow"

# ── Ratcheted lints (quality program, 2026-07-11) ────────────────────────
# These WARN (never deny) and are enforced as a per-(crate, lint) count
# ratchet by `cargo xtask lint-gate` against quality/baselines/
# clippy_counts.tsv: today's counts are grandfathered; a count may never
# grow. Burn-down happens crate by crate; the baseline shrinks weekly via
# the --tighten automation.
dbg_macro = "deny" # zero occurrences at adoption — free to deny outright
# Path SSOT. Burned 123 → 0 on 2026-08-10 (the svrnmesh sweep), so this
# graduates from the count ratchet to a hard deny: a hand-rolled
# `dirs::home_dir().join(".sovereign")` now fails the build rather than
# adding a warning nobody reads. The banned list is in clippy.toml; the
# handful of legitimate raw uses (tilde-expanding user input, ~/.claude,
# ~/Library/LaunchAgents, third-party caches) carry an `#[allow]` naming
# the reason. NOTE: this cannot catch `std::env::var("HOME")` — clippy
# matches paths, not string arguments — so that channel was swept by hand
# in the same commit and stays a review concern.
disallowed_methods = "deny"
todo = "warn" # 96 sites at adoption
unwrap_used = "warn" # panic-ratchet (tests exempt via clippy.toml)
expect_used = "warn" # panic-ratchet (tests exempt via clippy.toml)
# Function-level complexity budgets — the complement of the arch-gate's
# 1200-line FILE ceiling. Thresholds in clippy.toml.
too_many_lines = "warn"
cognitive_complexity = "warn"

