[workspace]
resolver = "2"
members = [
    # Wire-protocol types — bottom of the dep graph.
    "oicp-client",
    "oicp-types",

    # Knowledge layer (LanceDB + Tantivy + extractors + chunkers).
    "corpus-engine",
    "corpus-engine/xtask",
    # SCIP call graph + per-language exporter dispatch. Carved out of
    # corpus-engine 2026-05-23 to cut the rebuild blast radius for scip
    # changes from 20 crates to ~6.
    "corpus-engine-scip",
    # ATOS state — FeatureStore + plan_items + DESIGN.md design_signals.
    # Step 2 of the corpus-engine decomposition (see DECOMPOSITION.md).
    "corpus-engine-atos",
    # NoteStore + project_docs + notes_sync. Step 3 of the corpus-engine
    # decomposition. notes.rs (2781 LOC) cleared from the §3.1 list.
    "corpus-engine-notes",
    # Git archaeology — commit-history mining, rough-edge surfacing,
    # atom-provenance evaluation. Step 4 of the decomposition.
    "corpus-engine-archaeology",

    # Sovereign — local agent runtime + CLI + desktop + server.
    "sovereign/crates/sovereign-contracts",
    "sovereign/crates/sovereign-core",
    "sovereign/crates/sovereign-inference",
    "sovereign/crates/sovereign-store",
    "sovereign/crates/sovereign-tools",
    # Workflow substrate — Step · Artifact · Runner (a typed dataflow over
    # local-model steps; the general form of corpus-ingest/enrichment/agent).
    "sovereign/crates/sovereign-workflow",
    # Daemon-runnable workflow host — the registry assembly + in-process runner +
    # catalog, hoisted out of the CLI so the daemon can run workflows (the living
    # trigger's prerequisite).
    "sovereign/crates/sovereign-workflow-host",
    # MeshApp explorer ops — pure path-in/DTO-out projections shared by the
    # desktop Tauri host and the `sovereign meshapp dev` CLI server.
    "sovereign/crates/sovereign-meshapp",
    "sovereign/crates/sovereign-mesh",
    "sovereign/crates/sovereign-server",
    "sovereign/crates/sovereign-desktop/src-tauri",
    "sovereign/crates/sovereign-cli",
    "sovereign/crates/sovereign-cli-shared",
    "sovereign/crates/sovereign-cli-dev",
    "sovereign/crates/sovereign-cli-daemon",
    "sovereign/crates/sovereign-cli-llm",
    "sovereign/crates/sovereign-atos",
    "sovereign/crates/sovereign-eval",
    "sovereign/crates/sovereign-authoring-harness",
    "sovereign/crates/sovereign-pipeline",
    "sovereign/crates/sovereign-work-atlas",
    "sovereign/crates/sovereign-agent-bench",
    "sovereign/crates/commonwealth-agent-tools",
    # TDD-machine backend (red-green-refactor solver registry).
    # See sovereign/docs/TDD_MACHINE_DESIGN.md.
    "sovereign/crates/commonwealth-tdd",

    # Commonwealth — symmetric mesh daemon.
    "commonwealth/crates/commonwealth-core",
    # PeerTransport seam — (peer, traffic class) → dialable endpoints.
    # IP overlay today; iroh slots in behind the same trait later.
    "commonwealth/crates/commonwealth-transport",
    "commonwealth/crates/commonwealth-discovery",
    "commonwealth/crates/commonwealth-inference",
    "commonwealth/crates/commonwealth-api",
    "commonwealth/crates/commonwealth-knowledge",
    "commonwealth/crates/commonwealth-daemon",
    "commonwealth/crates/commonwealth-test-harness",
    "commonwealth/crates/commonwealth-app",
    "commonwealth/crates/commonwealth-state",
]

[workspace.package]
version = "0.1.18"
edition = "2021"
# Single license across the monorepo: GNU AGPL-3.0-or-later. Sovereign is
# source-available for audit; the AGPL network-use clause is the point for a
# mesh/daemon system. (Pre-monorepo, corpus-engine + commonwealth were
# Apache-2.0 and sovereign was MIT; consolidated to AGPL-3.0-or-later for the
# open-source launch — full text in /LICENSE.)
license = "AGPL-3.0-or-later"

# Workspace lint policy (tech-debt clean-start, 2026-06-03). Members opt in
# with `[lints]\nworkspace = true`. These clippy lints flag subjective
# design/shape choices and cosmetic doc formatting — NOT bugs — and are
# allowed as deliberate policy: the codebase has many-arg constructors and
# complex closure types by design. Substantive lints (dead_code, unused,
# correctness) are intentionally left at warn/deny and fixed, not allowed.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
module_inception = "allow"
enum_variant_names = "allow"
should_implement_trait = "allow"
new_without_default = "allow"
len_without_is_empty = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
empty_line_after_doc_comments = "allow"
items_after_test_module = "allow"
# `let mut x = T::default(); x.a = ..;` then accumulate `x` across the fn —
# clippy itself marks the struct-literal rewrite MaybeIncorrect here because
# the value is mutated downstream; the sequential form is clearer.
field_reassign_with_default = "allow"

[workspace.dependencies]
# ── Internal crates (paths are relative to the workspace root) ──────────
oicp-client = { path = "oicp-client" }
oicp-types = { path = "oicp-types" }
corpus-engine = { path = "corpus-engine" }
corpus-engine-scip = { path = "corpus-engine-scip" }
corpus-engine-atos = { path = "corpus-engine-atos" }
corpus-engine-notes = { path = "corpus-engine-notes" }
corpus-engine-archaeology = { path = "corpus-engine-archaeology" }
sovereign-contracts = { path = "sovereign/crates/sovereign-contracts" }
sovereign-core = { path = "sovereign/crates/sovereign-core" }
sovereign-inference = { path = "sovereign/crates/sovereign-inference" }
sovereign-store = { path = "sovereign/crates/sovereign-store" }
sovereign-tools = { path = "sovereign/crates/sovereign-tools" }
sovereign-workflow = { path = "sovereign/crates/sovereign-workflow" }
sovereign-workflow-host = { path = "sovereign/crates/sovereign-workflow-host" }
sovereign-meshapp = { path = "sovereign/crates/sovereign-meshapp" }
sovereign-mesh = { path = "sovereign/crates/sovereign-mesh" }
sovereign-atos = { path = "sovereign/crates/sovereign-atos" }
sovereign-cli-shared = { path = "sovereign/crates/sovereign-cli-shared" }
sovereign-pipeline = { path = "sovereign/crates/sovereign-pipeline" }
sovereign-work-atlas = { path = "sovereign/crates/sovereign-work-atlas" }
sovereign-agent-bench = { path = "sovereign/crates/sovereign-agent-bench" }
sovereign-eval = { path = "sovereign/crates/sovereign-eval" }
sovereign-authoring-harness = { path = "sovereign/crates/sovereign-authoring-harness" }
commonwealth-agent-tools = { path = "sovereign/crates/commonwealth-agent-tools" }
commonwealth-tdd = { path = "sovereign/crates/commonwealth-tdd" }
commonwealth-core = { path = "commonwealth/crates/commonwealth-core" }
commonwealth-transport = { path = "commonwealth/crates/commonwealth-transport" }
commonwealth-discovery = { path = "commonwealth/crates/commonwealth-discovery" }
commonwealth-inference = { path = "commonwealth/crates/commonwealth-inference" }
commonwealth-api = { path = "commonwealth/crates/commonwealth-api" }
commonwealth-knowledge = { path = "commonwealth/crates/commonwealth-knowledge" }
commonwealth-app = { path = "commonwealth/crates/commonwealth-app" }
commonwealth-state = { path = "commonwealth/crates/commonwealth-state" }

# ── Shared external deps ────────────────────────────────────────────────
# Versions match the strictest of the pre-monorepo sub-workspace
# declarations; features are union'd across them so no consumer
# loses a feature it relied on. Future bumps live here so all
# consumers move together.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Spreadsheet reader — used by the `xlsx` described-asset sub-extractor
# (architecture-over-Enron Phase 1). Pure Rust; XLSX/XLSM/XLSB/XLS/ODS.
calamine = "0.26"

# RFC-5322 / MIME parser — used by the `email_rfc5322` extractor
# (architecture-over-Enron Phase 2). Pure Rust; handles encoded
# headers + multipart bodies + transfer-encoding.
mailparse = "0.15"

thiserror = "2"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io", "io-util"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# HTTP — reqwest "rustls-tls" + "json" union; axum "ws" + "macros" union.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Chat-template rendering (Gemma 3/4 macros, Qwen3.5-9B macros/sets/
# includes). The llama-cpp-4 0.2.x binding dropped the
# `apply_chat_template_oaicompat` path that previously routed full-
# Jinja2 templates through llama.cpp's bundled minja renderer. We
# re-implement that path in Rust with minijinja so models whose
# `tokenizer.chat_template` uses macros/sets/includes don't fall
# through to plain-text concat (lossy: role markers hallucinate,
# stop tokens drift). Lean — no GIL, no JSON serialisation step
# between Rust and the renderer.
minijinja = { version = "2", features = ["loader"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Identity / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Node identity keys (mesh trust ring; the seed doubles as a future
# iroh SecretKey). Hoisted 2026-06-10 from sovereign-mesh's inline
# decl so commonwealth-transport tracks the same version.
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
# Dial-by-key transport (QUIC by Ed25519 key, hole-punch + relays).
# iroh 1.0 shipped 2026-06-15 with a committed, wire-stable protocol
# (any v1 endpoint interops with any other v1 endpoint). Compiled
# behind commonwealth-transport's `iroh` feature and sovereign-mesh's
# `iroh-experimental`; all iroh symbol use is confined to
# `commonwealth-transport/src/iroh.rs`, so a future minor bump is a
# one-file change. Spike e2e: `cargo test -p sovereign-mesh
# --features iroh-experimental`.
iroh = "1.0"

# Concurrency
dashmap = "6"
arc-swap = "1.7"

# Networking helpers
hostname = "0.4"

# Text utilities — hoisted 2026-05-24 so the eight crates that each
# declared `regex = "1"` track one version. Used heavily in bench's
# search runner output parsing and now by `commonwealth-tdd`.
regex = "1"

# Filesystem scratch space — used by every test that needs an
# isolated workdir (bench candidate snapshots, commonwealth-tdd
# workdir gate tests, atos lifecycle tests, …).
tempfile = "3"

# Persistence
rusqlite = { version = "0.35", features = ["bundled"] }

# Hashing — used by 9+ crates (sha2 specifically); hoisted to lock
# one version per ARCH §8.2.
sha2 = "0.10"

# Columnar / vector storage — corpus-engine is the primary consumer
# but sovereign-tools also reaches into arrow + parquet directly. The
# arrow 55-vs-57 cross-crate skew was the exact failure mode cited in
# ARCH §8.2; hoisting these locks one version per workspace.
arrow = "57"
arrow-array = "57"
arrow-schema = "57"
parquet = "57"
lancedb = "0.27"

# Markdown (sovereign-atos charter parsing)
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }

# Grammar-constrained sampling: llguidance is the upstream
# Microsoft/Guidance constraint engine. We re-adopt it (after the
# 2026-04 dismissal that traced to the llama-cpp-4 binding dropping
# its `LlamaSampler::llguidance` shim) by using llguidance directly
# from Rust — bypasses llama-cpp's grammar API entirely, same
# pattern as our existing in-house `JsonConstraint` mask but with
# Lark + JSON-Schema + top-level alternation support out of the
# box. Lets us pin a `tool_envelope | plain_text` grammar so the
# model can either emit a parseable tool call OR plain text "done"
# — closes the parse_failed_envelope + loop_trap failure classes
# surfaced by the agent-bench sweep on 2026-05-21.
llguidance = "1.7"

# ── Build profile ────────────────────────────────────────────────────────
# Skip debug symbols on dev builds — biggest single speedup for `cargo
# check` per the prior sub-workspace settings; preserved here so
# consolidating into one workspace doesn't slow incremental builds.
[profile.dev]
debug = 0

# Release builds ship in the desktop bundle. The desktop binary is ~397 MB
# unstripped (835k symbols) because cargo's default release profile keeps the
# full symbol table and Tauri's bundler does NOT strip Rust binaries for you.
# `strip = "symbols"` reclaims ~80 MB off the on-disk binary with zero runtime
# change. `lto = "thin"` + `codegen-units = 1` lets the linker prune dead code
# across crate boundaries (notably the static llama/ggml/lance surface) at the
# cost of slower release link times — release builds are cut rarely (tagged
# `desktop-v*`), so the trade favours a smaller artifact. `panic = "abort"` is
# deliberately NOT set: the desktop's daemon supervisor and OCR pipeline rely
# on catching/propagating panics across the in-process boundary.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# The "release builds are cut rarely" assumption above is true for tagged
# releases but NOT for the local deployed-daemon loop, which also builds
# release — and pays thin-LTO + CGU=1 on every one-line change (measured
# 7m29s for a one-line loop, 2026-07-02). A custom `[profile.release-dev]`
# is NOT usable here: llama-cpp-sys-4's build script resolves the target
# dir by matching a path component against cargo's `PROFILE` env, which
# reports the BASE profile ("release") while the directory is named after
# the custom profile — the build script panics "not found" under any
# custom profile. Instead, `scripts/dev-release.sh` builds --release with
# cargo's per-knob env overrides (LTO off, codegen-units 16, incremental),
# collapsing the loop to seconds while keeping opt-level 3. Tagged
# releases and CI build plain --release and keep the shipping settings.

# ── Patches ──────────────────────────────────────────────────────────────
# Vendored `llama-cpp-4` (currently 0.3.1) carries THREE sovereign divergences
# from the published crate. When re-vendoring a newer upstream version, re-apply
# all three — `diff` stock-vs-vendored to confirm none were dropped (the upstream
# deltas to these files have so far been doc-comment-only, so the patches port
# cleanly, but verify rather than trust a fuzzy `patch`):
#   1. `LlamaContextParams::with_n_seq_max` (+ `n_seq_max` getter) in
#      src/context/params.rs. Upstream 0.2.x/0.3.x retired the builder but the C
#      field is load-bearing — without it FastShort continuous-batched decode
#      fails "Decode Error -1: n_tokens == 0" the moment a batch carries
#      seq_id > 0 (forensically traced in the marathon bench, 2026-05-18).
#   2. `LlamaModelParams::{with_tensor_split, with_devices,
#      with_tensor_buft_overrides}` (+ their backing-storage fields) in
#      src/model/params.rs — the explicit device list + `-ot` per-tensor
#      placement the RPC distributed-inference path drives from
#      embedded/model_slot.rs. Dropping these silently breaks distribution.
#   3. `dynamic-link` removed from the crate's `default` features in Cargo.toml,
#      so ggml/llama static-link and every sovereign binary is self-contained
#      (the daemon's relocatability + the desktop .deb/.rpm/AppImage). See
#      RELEASING.md and [[project_desktop_linux_build_deps]].
[patch.crates-io]
llama-cpp-4 = { path = "vendor/llama-cpp-4" }
