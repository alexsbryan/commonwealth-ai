[workspace]
resolver = "2"
members = [
    # Wire-protocol types — bottom of the dep graph.
    "oicp-types",

    # Knowledge layer (LanceDB + Tantivy + extractors + chunkers).
    "corpus-engine",
    "corpus-engine/xtask",
    # SCIP call graph + per-language exporter dispatch. Carved out of
    # corpus-engine 2026-05-23 to cut the rebuild blast radius for scip
    # changes from 20 crates to ~6.
    "corpus-engine-scip",
    # ATOS state — FeatureStore + plan_items + DESIGN.md design_signals.
    # Step 2 of the corpus-engine decomposition (see DECOMPOSITION.md).
    "corpus-engine-atos",
    # NoteStore + project_docs + notes_sync. Step 3 of the corpus-engine
    # decomposition. notes.rs (2781 LOC) cleared from the §3.1 list.
    "corpus-engine-notes",
    # Git archaeology — commit-history mining, rough-edge surfacing,
    # atom-provenance evaluation. Step 4 of the decomposition.
    "corpus-engine-archaeology",

    # Sovereign — local agent runtime + CLI + desktop + server.
    "sovereign/crates/sovereign-core",
    "sovereign/crates/sovereign-inference",
    "sovereign/crates/sovereign-store",
    "sovereign/crates/sovereign-tools",
    "sovereign/crates/sovereign-mesh",
    "sovereign/crates/sovereign-server",
    "sovereign/crates/sovereign-desktop/src-tauri",
    "sovereign/crates/sovereign-cli",
    "sovereign/crates/sovereign-cli-shared",
    "sovereign/crates/sovereign-cli-dev",
    "sovereign/crates/sovereign-cli-daemon",
    "sovereign/crates/sovereign-cli-llm",
    "sovereign/crates/sovereign-atos",
    "sovereign/crates/sovereign-eval",
    "sovereign/crates/sovereign-pipeline",
    "sovereign/crates/sovereign-work-atlas",
    "sovereign/crates/sovereign-agent-bench",
    "sovereign/crates/commonwealth-agent-tools",
    # TDD-machine backend (red-green-refactor solver registry).
    # See sovereign/docs/TDD_MACHINE_DESIGN.md.
    "sovereign/crates/commonwealth-tdd",

    # Commonwealth — symmetric mesh daemon.
    "commonwealth/crates/commonwealth-core",
    "commonwealth/crates/commonwealth-discovery",
    "commonwealth/crates/commonwealth-inference",
    "commonwealth/crates/commonwealth-api",
    "commonwealth/crates/commonwealth-knowledge",
    "commonwealth/crates/commonwealth-daemon",
    "commonwealth/crates/commonwealth-test-harness",
    "commonwealth/crates/commonwealth-app",
    "commonwealth/crates/commonwealth-state",
]

[workspace.package]
version = "0.1.12"
edition = "2021"
# Pre-monorepo: corpus-engine + commonwealth shipped Apache-2.0;
# sovereign shipped MIT. One license under one repo from now on —
# Apache-2.0 was the majority and is what corpus-engine (the
# foundational shared crate) used.
license = "Apache-2.0"

[workspace.dependencies]
# ── Internal crates (paths are relative to the workspace root) ──────────
oicp-types = { path = "oicp-types" }
corpus-engine = { path = "corpus-engine" }
corpus-engine-scip = { path = "corpus-engine-scip" }
corpus-engine-atos = { path = "corpus-engine-atos" }
corpus-engine-notes = { path = "corpus-engine-notes" }
corpus-engine-archaeology = { path = "corpus-engine-archaeology" }
sovereign-core = { path = "sovereign/crates/sovereign-core" }
sovereign-inference = { path = "sovereign/crates/sovereign-inference" }
sovereign-store = { path = "sovereign/crates/sovereign-store" }
sovereign-tools = { path = "sovereign/crates/sovereign-tools" }
sovereign-mesh = { path = "sovereign/crates/sovereign-mesh" }
sovereign-atos = { path = "sovereign/crates/sovereign-atos" }
sovereign-cli-shared = { path = "sovereign/crates/sovereign-cli-shared" }
sovereign-pipeline = { path = "sovereign/crates/sovereign-pipeline" }
sovereign-work-atlas = { path = "sovereign/crates/sovereign-work-atlas" }
sovereign-agent-bench = { path = "sovereign/crates/sovereign-agent-bench" }
commonwealth-agent-tools = { path = "sovereign/crates/commonwealth-agent-tools" }
commonwealth-tdd = { path = "sovereign/crates/commonwealth-tdd" }
commonwealth-core = { path = "commonwealth/crates/commonwealth-core" }
commonwealth-discovery = { path = "commonwealth/crates/commonwealth-discovery" }
commonwealth-inference = { path = "commonwealth/crates/commonwealth-inference" }
commonwealth-api = { path = "commonwealth/crates/commonwealth-api" }
commonwealth-knowledge = { path = "commonwealth/crates/commonwealth-knowledge" }
commonwealth-app = { path = "commonwealth/crates/commonwealth-app" }
commonwealth-state = { path = "commonwealth/crates/commonwealth-state" }

# ── Shared external deps ────────────────────────────────────────────────
# Versions match the strictest of the pre-monorepo sub-workspace
# declarations; features are union'd across them so no consumer
# loses a feature it relied on. Future bumps live here so all
# consumers move together.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

thiserror = "2"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io", "io-util"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# HTTP — reqwest "rustls-tls" + "json" union; axum "ws" + "macros" union.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Chat-template rendering (Gemma 3/4 macros, Qwen3.5-9B macros/sets/
# includes). The llama-cpp-4 0.2.x binding dropped the
# `apply_chat_template_oaicompat` path that previously routed full-
# Jinja2 templates through llama.cpp's bundled minja renderer. We
# re-implement that path in Rust with minijinja so models whose
# `tokenizer.chat_template` uses macros/sets/includes don't fall
# through to plain-text concat (lossy: role markers hallucinate,
# stop tokens drift). Lean — no GIL, no JSON serialisation step
# between Rust and the renderer.
minijinja = { version = "2", features = ["loader"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Identity / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
dashmap = "6"
arc-swap = "1.7"

# Networking helpers
hostname = "0.4"

# Text utilities — hoisted 2026-05-24 so the eight crates that each
# declared `regex = "1"` track one version. Used heavily in bench's
# search runner output parsing and now by `commonwealth-tdd`.
regex = "1"

# Filesystem scratch space — used by every test that needs an
# isolated workdir (bench candidate snapshots, commonwealth-tdd
# workdir gate tests, atos lifecycle tests, …).
tempfile = "3"

# Persistence
rusqlite = { version = "0.35", features = ["bundled"] }

# Hashing — used by 9+ crates (sha2 specifically); hoisted to lock
# one version per ARCH §8.2.
sha2 = "0.10"

# Columnar / vector storage — corpus-engine is the primary consumer
# but sovereign-tools also reaches into arrow + parquet directly. The
# arrow 55-vs-57 cross-crate skew was the exact failure mode cited in
# ARCH §8.2; hoisting these locks one version per workspace.
arrow = "57"
arrow-array = "57"
arrow-schema = "57"
parquet = "57"
lancedb = "0.27"

# Markdown (sovereign-atos charter parsing)
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }

# Grammar-constrained sampling: llguidance is the upstream
# Microsoft/Guidance constraint engine. We re-adopt it (after the
# 2026-04 dismissal that traced to the llama-cpp-4 binding dropping
# its `LlamaSampler::llguidance` shim) by using llguidance directly
# from Rust — bypasses llama-cpp's grammar API entirely, same
# pattern as our existing in-house `JsonConstraint` mask but with
# Lark + JSON-Schema + top-level alternation support out of the
# box. Lets us pin a `tool_envelope | plain_text` grammar so the
# model can either emit a parseable tool call OR plain text "done"
# — closes the parse_failed_envelope + loop_trap failure classes
# surfaced by the agent-bench sweep on 2026-05-21.
llguidance = "1.7"

# ── Build profile ────────────────────────────────────────────────────────
# Skip debug symbols on dev builds — biggest single speedup for `cargo
# check` per the prior sub-workspace settings; preserved here so
# consolidating into one workspace doesn't slow incremental builds.
[profile.dev]
debug = 0

# ── Patches ──────────────────────────────────────────────────────────────
# Vendored `llama-cpp-4` re-introduces the `LlamaContextParams::with_n_seq_max`
# builder method that upstream 0.2.x retired. The underlying C field is still
# load-bearing — without it the FastShort continuous-batched decode fails
# with "Decode Error -1: n_tokens == 0" the moment a batch carries seq_id > 0.
# Forensically traced in the marathon bench, 2026-05-18.
[patch.crates-io]
llama-cpp-4 = { path = "vendor/llama-cpp-4" }
