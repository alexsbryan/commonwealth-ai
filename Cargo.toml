# ── Shared external deps ────────────────────────────────────────────────
# Versions match the strictest of the pre-monorepo sub-workspace
# declarations; features are union'd across them so no consumer
# loses a feature it relied on. Future bumps live here so all
# consumers move together.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Spreadsheet reader — used by the `xlsx` described-asset sub-extractor
# (architecture-over-Enron Phase 1). Pure Rust; XLSX/XLSM/XLSB/XLS/ODS.
calamine = "0.26"

# RFC-5322 / MIME parser — used by the `email_rfc5322` extractor
# (architecture-over-Enron Phase 2). Pure Rust; handles encoded
# headers + multipart bodies + transfer-encoding.
mailparse = "0.15"

thiserror = "2"
anyhow = "1"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io", "io-util"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# HTTP — reqwest "rustls-tls" + "json" union; axum "ws" + "macros" union.
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Chat-template rendering (Gemma 3/4 macros, Qwen3.5-9B macros/sets/
# includes). The llama-cpp-4 0.2.x binding dropped the
# `apply_chat_template_oaicompat` path that previously routed full-
# Jinja2 templates through llama.cpp's bundled minja renderer. We
# re-implement that path in Rust with minijinja so models whose
# `tokenizer.chat_template` uses macros/sets/includes don't fall
# through to plain-text concat (lossy: role markers hallucinate,
# stop tokens drift). Lean — no GIL, no JSON serialisation step
# between Rust and the renderer.
minijinja = { version = "2", features = ["loader"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Identity / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Node identity keys (mesh trust ring; the seed doubles as a future
# iroh SecretKey). Hoisted 2026-06-10 from sovereign-mesh's inline
# decl so commonwealth-transport tracks the same version.
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
# Dial-by-key transport (QUIC by Ed25519 key, hole-punch + relays).
# iroh 1.0 shipped 2026-06-15 with a committed, wire-stable protocol
# (any v1 endpoint interops with any other v1 endpoint). Compiled
# behind commonwealth-transport's `iroh` feature and sovereign-mesh's
# `iroh-experimental`; all iroh symbol use is confined to
# `commonwealth-transport/src/iroh.rs`, so a future minor bump is a
# one-file change. Spike e2e: `cargo test -p sovereign-mesh
# --features iroh-experimental`.
iroh = "1.0"

# Concurrency
dashmap = "6"
arc-swap = "1.7"

# Networking helpers
hostname = "0.4"

# Text utilities — hoisted 2026-05-24 so the eight crates that each
# declared `regex = "1"` track one version. Used heavily in bench's
# search runner output parsing and now by `commonwealth-tdd`.
regex = "1"

# Filesystem scratch space — used by every test that needs an
# isolated workdir (bench candidate snapshots, commonwealth-tdd
# workdir gate tests, atos lifecycle tests, …).
tempfile = "3"

# Persistence
rusqlite = { version = "0.35", features = ["bundled"] }

# Hashing — used by 9+ crates (sha2 specifically); hoisted to lock
# one version per ARCH §8.2.
sha2 = "0.10"

# Columnar / vector storage — corpus-engine is the primary consumer
# but sovereign-tools also reaches into arrow + parquet directly. The
# arrow 55-vs-57 cross-crate skew was the exact failure mode cited in
# ARCH §8.2; hoisting these locks one version per workspace.
arrow = "57"
arrow-array = "57"
arrow-schema = "57"
parquet = "57"
lancedb = "0.27"

# Markdown (sovereign-atos charter parsing)
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }

# Grammar-constrained sampling: llguidance is the upstream
# Microsoft/Guidance constraint engine. We re-adopt it (after the
# 2026-04 dismissal that traced to the llama-cpp-4 binding dropping
# its `LlamaSampler::llguidance` shim) by using llguidance directly
# from Rust — bypasses llama-cpp's grammar API entirely, same
# pattern as our existing in-house `JsonConstraint` mask but with
# Lark + JSON-Schema + top-level alternation support out of the
# box. Lets us pin a `tool_envelope | plain_text` grammar so the
# model can either emit a parseable tool call OR plain text "done"
# — closes the parse_failed_envelope + loop_trap failure classes
# surfaced by the agent-bench sweep on 2026-05-21.
llguidance = "1.7"

# ── Build profile ────────────────────────────────────────────────────────
# Skip debug symbols on dev builds — biggest single speedup for `cargo
# check` per the prior sub-workspace settings; preserved here so
# consolidating into one workspace doesn't slow incremental builds.
[profile.dev]
debug = 0

# Release builds ship in the desktop bundle. The desktop binary is ~397 MB
# unstripped (835k symbols) because cargo's default release profile keeps the
# full symbol table and Tauri's bundler does NOT strip Rust binaries for you.
# `strip = "symbols"` reclaims ~80 MB off the on-disk binary with zero runtime
# change. `lto = "thin"` + `codegen-units = 1` lets the linker prune dead code
# across crate boundaries (notably the static llama/ggml/lance surface) at the
# cost of slower release link times — release builds are cut rarely (tagged
# `desktop-v*`), so the trade favours a smaller artifact. `panic = "abort"` is
# deliberately NOT set: the desktop's daemon supervisor and OCR pipeline rely
# on catching/propagating panics across the in-process boundary.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# The "release builds are cut rarely" assumption above is true for tagged
# releases but NOT for the local deployed-daemon loop, which also builds
# release — and pays thin-LTO + CGU=1 on every one-line change (measured
# 7m29s for a one-line loop, 2026-07-02). A custom `[profile.release-dev]`
# is NOT usable here: llama-cpp-sys-4's build script resolves the target
# dir by matching a path component against cargo's `PROFILE` env, which
# reports the BASE profile ("release") while the directory is named after
# the custom profile — the build script panics "not found" under any
# custom profile. Instead, `scripts/dev-release.sh` builds --release with
# cargo's per-knob env overrides (LTO off, codegen-units 16, incremental),
# collapsing the loop to seconds while keeping opt-level 3. Tagged
# releases and CI build plain --release and keep the shipping settings.

# ── Patches ──────────────────────────────────────────────────────────────
# Vendored `llama-cpp-4` (currently 0.5.1) carries TWO sovereign divergences
# from the published crate. When re-vendoring a newer upstream version, re-apply
# both, then `diff -rq vendor/llama-cpp-4 <stock>` and confirm those two files
# are the ONLY ones listed:
#   1. `LlamaModelParams::{with_tensor_split, with_devices,
#      with_tensor_buft_overrides}` (+ their backing-storage fields, + their
#      initializers in `impl Default`) in src/model/params.rs — the explicit
#      device list + `-ot` per-tensor placement the RPC distributed-inference
#      path drives from embedded/model_slot.rs. Dropping these silently breaks
#      distribution.
#      DO NOT copy our whole params.rs across a re-vendor. That advice held
#      while the file was byte-identical 0.3.1→0.4.2; it stopped being true at
#      0.5.1, which reworked the file around the new `LlamaLoadMode` enum
#      (`params.use_mmap`/`use_mlock` became `params.load_mode`, and
#      `with_load_mode`/`with_load_mtp` were added). Copying the old file
#      forward would have silently reverted all of that. PORT THE THREE METHODS
#      ONTO THE NEW FILE.
#   2. `dynamic-link` removed from the crate's `default` features in Cargo.toml,
#      so ggml/llama static-link and every sovereign binary is self-contained
#      (the daemon's relocatability + the desktop .deb/.rpm/AppImage). See
#      RELEASING.md and [[project_desktop_linux_build_deps]].
# RETIRED divergences (do NOT re-add):
#   - `LlamaContextParams::with_n_seq_max` (+ getter) was re-introduced UPSTREAM
#     in 0.4.0 (context/params/mod.rs). The 0.4.x module split moved
#     context/params.rs → context/params/{mod,advanced,types}.rs.
#   - src/quantize.rs's `as c_char` in place of `.cast_signed()` (c_char is i8
#     on x86_64 but u8 on aarch64/Android). Upstream landed the equivalent
#     `as _` in 0.5.1. This one was never recorded here when it was applied,
#     which is why it is called out now: an undocumented divergence is one a
#     re-vendor drops by accident.
#
# Vendored `llama-cpp-sys-4` (0.5.1) carries NO sovereign divergence — it is the
# published crate verbatim, with ONE exception that is itself pure upstream: its
# bundled llama.cpp is fast-forwarded from the 221f0f63 the crate ships to
# 1464c62d88 ("metal: implement DSv4 Lightning Indexer", the direct child
# commit). Without it, Metal's supports_op rejects GGML_OP_LIGHTNING_INDEXER
# while the RPC backend's supports_op unconditionally returns true, so a
# distributed DeepSeek-V4 run hands the Metal worker an op it cannot execute and
# aborts mid-graph. Provenance and the re-pin procedure are in
# vendor/llama-cpp-sys-4/LLAMA_CPP_COMMIT; the claim is checkable with
# `./scripts/verify-vendored-llama-cpp.sh` (1552/1552 files identical as of
# 2026-08-03). We vendor the sys crate at all ONLY to hold that pin: the moment
# a published llama-cpp-rs bundles llama.cpp at or past 1464c62d88, this whole
# directory can be deleted and the crates.io dependency restored.
# Vendored `lance-linalg` (4.0.0) carries ONE divergence: build.rs compiles the
# AVX-512 dist_table kernel with -march=x86-64-v4 instead of upstream's
# -march=native. Upstream's flag breaks cross-compiles (arm64 host → x86_64
# target) and any x86_64 build machine without AVX-512 (Rosetta VMs, pre-Zen4):
# the f16 avx512 compile still succeeds and sets the SAME shared
# kernel_support="avx512" cfg, so the Rust extern references
# sum_4bit_dist_table_32bytes_batch_avx512 which was never compiled → link
# error (hit on the desktop-v0.1.19 Intel cut, 2026-07-10). Runtime dispatch
# (SimdSupport) already gates execution, so pinning the arch level is safe on
# non-AVX-512 CPUs. Re-apply when re-vendoring; upstream fix would be separate
# cfgs per kernel.
[patch.crates-io]
llama-cpp-4 = { path = "vendor/llama-cpp-4" }
llama-cpp-sys-4 = { path = "vendor/llama-cpp-sys-4" }
lance-linalg = { path = "vendor/lance-linalg" }
