[commonwealth]
url = "http://localhost:9741"

# Watchers are OFF here on purpose. This declares it, so `doctor` and the
# status tools report a supported posture instead of a standing warning
# advising you to restore a config that was removed deliberately. Flip to
# `true` (and uncomment a runner below) if you want them back.
[watchers]
enabled = false

# ── lint/test watchers DISABLED (2026-05-31) ──
# The parallel `cargo test`/`cargo check` fan over three workspaces
# (corpus-engine + sovereign + commonwealth) spikes 10-15GB of rustc.
# Stacked on the eager-pinned 27B primary (~30GB RSS) it jetsam-kills
# the daemon — observed repeatedly while running the Enron QA synth
# bench (each .rs edit re-triggers the watcher mid-run, OOM mid-synth).
# Disabled so synth measurements are stable.
# RESTORE with: cp .sovereign/sovereign.toml.with-watchers .sovereign/sovereign.toml
# then `sovereign daemon restart`.
#
# [test_runner]
# command = "scripts/sovereign-test.sh"
# working_dir = "."
# timeout_secs = 240
# debounce_ms = 2000
#
# [lint_runner]
# command = "scripts/sovereign-lint.sh"
# working_dir = "."
# timeout_secs = 240
# debounce_ms = 800
