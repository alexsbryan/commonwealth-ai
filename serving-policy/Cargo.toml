[package]
name = "serving-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The serving cluster's re-export of the shared serving-policy arithmetic (serving-policy-core) at its historical paths. The arithmetic itself lives in the serving-policy-core [[package_leaf]], which the daemon names directly; this shim keeps `sovereign-inference` and `sovereign-serving-host` on their pre-existing `serving_policy::` paths."

# The contract, restated 2026-09-22 (FIVE_PROGRAMS fp-17): the fair-sched
# arithmetic and the pipeline_aliases table moved DOWN to `serving-policy-core`
# so the daemon (a member of the `svrn` package) stops naming a [cmnwlth]
# package crate. This shim names only `serving-policy-core`, which names only
# `oicp-types`, the family-neutral floor — never `sovereign-*` or
# `commonwealth-*`, which the two [[forbid]] rows below (ARCH_LAYERS.toml)
# still pin structurally. The crate exists because `fair_sched` sat in
# `commonwealth-core` while its consumers were `sovereign-inference` and
# `sovereign-server` — two runtime-tier crates whose ENTIRE reference to
# commonwealth was this one module.
[dependencies]
serving-policy-core = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
