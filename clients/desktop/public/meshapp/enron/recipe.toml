# Stage C — wide cross-origin substrate exerciser.
#
# Four mailbox slices (Lay's _sent + Lay's inbox + Skilling's sent +
# Skilling's inbox, ~3170 messages) under a single staging dir. The
# inbox folders exist specifically to capture *correspondents* of the
# mailbox owners — pre-2026-05-29 benches over `_sent` alone matched
# at most one surface form per gold canonical because outbound mail
# rarely echoes back the sender's own name, and inbound mail is where
# `Andy Fastow`, `Andersen`, `J. Skilling` actually appear as full
# alias sets. Pairs with the `email`+`aliases` schema extension on
# `PersonEntity` / `OrganizationEntity` and the BusinessEmailDomain
# prompt that explicitly enumerates alias forms.
#
# Counterparty substrate (added 2026-06-02). The Lay+Skilling executive
# slices establish the cast (Lay/Skilling/Fastow) and exec-level deals
# (the Dynegy merger), but they do NOT carry the granular trading
# counterparties — Calpine, El Paso, Williams as power-trade counterparts
# live in the *traders'* mailboxes, not the executives'. The
# `counterparty_network` demo question scored 1/5 purely because that
# substrate was never ingested (the answer named the real exec-visible
# rivals — Dynegy/Reliant/TXU — none of the trade-desk counterparties).
# Fix: add four targeted symes-k (Kevin Symes, power trader) folders that
# carry the trade substrate without the 28k-message whole-mailbox blowup:
#   ctpy_contacts (the literal counterparty contact list), confirms (trade
#   confirmations), deal_communication, power_marketer. ~1280 messages.
#
# Operator setup: extend the symlink dir at
# `~/.svrnmesh/corpora-staging/enron-multi-wide/` so each slice is a
# sibling:
#   lay-k_sent_link                 → enron/maildir/lay-k/_sent
#   lay-k_inbox_link                → enron/maildir/lay-k/inbox
#   skilling-j_sent_link            → enron/maildir/skilling-j/sent
#   skilling-j_inbox_link           → enron/maildir/skilling-j/inbox
#   symes-k_power_marketer_link     → enron/maildir/symes-k/power_marketer
#   symes-k_deal_communication_link → enron/maildir/symes-k/deal_communication
#   symes-k_confirms_link           → enron/maildir/symes-k/confirms
#   symes-k_ctpy_contacts_link      → enron/maildir/symes-k/ctpy_contacts

[corpus]
id = "enron-sample-multi-wide"
name = "Enron Email (Lay+Skilling exec + symes-k trade desk)"
description = "Stage C cross-origin substrate exerciser — Lay + Skilling sent+inbox exec slices plus four symes-k trade-desk folders (counterparty substrate: ctpy_contacts/confirms/deal_communication/power_marketer). ~4450 messages, 8 X-Origin folds."
license = "public-domain"
schema_version = 1
mesh_sharing = true
size_compressed_gb = 0.025
size_indexed_gb = 0.35

[acquire]
type = "local_file"
path = "~/.svrnmesh/corpora-staging/enron-multi-wide"

[extract]
type = "email"
max_body_bytes = 4194304
max_attachment_bytes = 0

[[filter]]
type = "boilerplate"
strip_signatures = true
strip_quoted_replies = true
strip_disclaimers = true
min_body_chars_after_strip = 20

[chunk]
type = "paragraph"
max_chars = 2000
overlap_chars = 200

[index]
fts = true
vector = true

[enrichment]
enabled = true
type = "atlas"
domain = "business_email"
prompt_version = "enron-v2"

[enrichment.reconciliation]
name_similarity_threshold = 0.85
cross_origin_required_signals = 2
judge_when_uncertain = true
judge_trials = 3

[enrichment.reconciliation.column_aware]
max_entities_per_column = 5000

[enrichment.reconciliation.column_aware.column_headers]
person_headers = ["employee", "person", "name", "trader", "owner", "contact", "attendee"]
organization_headers = ["counterparty", "customer", "vendor", "supplier", "company", "organization", "client", "broker"]
place_headers = ["city", "state", "country", "location"]

[display]
category = "email"
icon = "mail"

# Prebuilt cold-start: `sovereign corpus install enron-sample-multi-wide` restores the
# enriched index (chunks + the 6,101-atom atlas + reconciliation graph, B³ P=1.0 / F1 0.835)
# from HuggingFace in seconds — no re-enrich. The mesh `corpus pull` path is blocked on a
# stale canonical fingerprint after the atlas-resolve mutations; the snapshot manifest
# carries its own sha256, so this install sidesteps that. Snapshot built 2026-06-05.
[prebuilt]
hf_repo = "svrnmesh/enron-sample-multi-wide"
hf_filename = "enron-sample-multi-wide-qwen-embedding-0.6b-2026-06-05.tar.zst"
sha256 = "27b664ee33e4c8829b0c18ac75818e0821c3a7e2eb2c47adb4334e395ae8e080"
compatible_embedding_model = "qwen-embedding-0.6b"
