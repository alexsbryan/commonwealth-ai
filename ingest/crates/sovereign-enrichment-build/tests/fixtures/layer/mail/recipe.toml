# A mail-shaped fixture for the ontology layer's default path (order
# ontology-layer-2-one-path): five messages of a furniture workshop with its
# customers. The fourth repeats a line of the third word for word, in the same
# section, as a fresh statement: equal text is not the same occurrence. The
# `layer-default-path` contract journey installs it and runs the default
# commands; the C1-C6 contract tests read the same files. Neutral domain on
# purpose: no word here comes from a test system.

[corpus]
id = "layer-mail"
name = "Layer fixture: a workshop's mail with its customers"
description = "Five messages: one order quoted and confirmed in a thread, one cancelled."
license = "private"
schema_version = 1
mesh_sharing = false

# The messages as the mail extractor's fields: every field the jsonl extractor
# does not consume passes through as document metadata.
[acquire]
type = "local_file"
path = "documents.jsonl"

[extract]
type = "jsonl"
content_field = "body"
title_field = "subject"

[chunk]
type = "paragraph"
max_chars = 2000
overlap_chars = 0

[index]
fts = true
vector = false

[enrichment]
enabled = true
type = "atlas"

[enrichment.ontology]
version = 1

[[enrichment.ontology.types]]
name = "person"
kind = "entity"
attributes = [
  { name = "email", type = "text" },
  { name = "employer", type = "ref", of = "company" },
  { name = "full_name", type = "text", description = "The display name a header pairs with the address." },
]
identity = ["email"]
source = { metadata = ["from", "to", "cc"], attributes = { email = "address", full_name = "display_name" }, refs = { employer = { of = "company", reader = "domain" } } }

[[enrichment.ontology.types]]
name = "company"
kind = "entity"
attributes = [{ name = "web_domain", type = "text" }]
identity = ["web_domain"]
source = { metadata = ["from", "to", "cc"], attributes = { web_domain = "domain" } }

[[enrichment.ontology.types]]
name = "order"
kind = "entity"
description = "one piece of work a customer asks the workshop to make"
identity_criterion = "Two mentions are one order when they are about the same piece of work for the same customer, however it is worded and whoever writes."
identity_bar = 0.9
attributes = [
  { name = "customer", type = "ref", of = "company", derived = "customer_of_order" },
  { name = "stage", type = "text", values = ["asked", "quoted", "confirmed", "cancelled"], derived = "order_stage" },
  { name = "piece", type = "text", description = "what is to be made" },
]

[[enrichment.ontology.types]]
name = "order_update"
kind = "claim"
description = "a statement of where an order stands: asked for, priced, agreed or called off"
force = "assertive"
subject = "order"
attributes = [
  { name = "stage", type = "text", values = ["asked", "quoted", "confirmed", "cancelled"] },
  { name = "party", type = "ref", of = "company", derived = "party_of_message" },
  { name = "price", type = "quantity", unit = "USD" },
  { name = "due", type = "time", description = "when the work is to be delivered" },
  { name = "named_customer", type = "ref", of = "company", description = "the customer the statement names" },
]

[enrichment.ontology.change]
document = { date = "date", thread = "thread_id", id = "id", author = "from" }

[[enrichment.ontology.sets]]
id = "ours"
type = "company"
where = { web_domain = { suffix = "alderpine.example" } }

[[enrichment.ontology.paths]]
id = "outside_parties"
path = "document / (from | to | cc) / employer [!ours]"

[[enrichment.ontology.folds]]
id = "party_of_message"
by = "first"
from = ["outside_parties"]

[[enrichment.ontology.folds]]
id = "customer_of_order"
by = "most"
from = ["^subject / party"]

[[enrichment.ontology.folds]]
id = "order_stage"
by = "protocol"
from = ["^subject"]

[enrichment.ontology.folds.protocol]
identity = "stage"

[[enrichment.ontology.folds.protocol.rules]]
id = "asked"
claim_kind = "order_update"
state = "asked"
when = { stage = "asked" }

[[enrichment.ontology.folds.protocol.rules]]
id = "quoted"
claim_kind = "order_update"
state = "quoted"
when = { stage = "quoted" }

[[enrichment.ontology.folds.protocol.rules]]
id = "confirmed"
claim_kind = "order_update"
state = "confirmed"
when = { stage = "confirmed" }

[[enrichment.ontology.folds.protocol.rules]]
id = "cancelled"
claim_kind = "order_update"
state = "cancelled"
when = { stage = "cancelled" }
