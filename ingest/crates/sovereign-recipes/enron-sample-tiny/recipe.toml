# Smallest Enron variant — fast end-to-end smoke target.
#
# Scoped to Kenneth Lay's `_sent` subfolder alone (~261 messages,
# ~75-100 entity-extraction batches at BATCH_SIZE=4). Designed to
# complete Phase 1-5 in under an hour on a primary-only daemon
# (no fast slot), so the first baseline measurement of the
# architecture-over-Enron substrate lands the same session it
# starts. Promote to `enron-sample-onemailbox` once the reconciliation
# policy stops moving.
#
# Same pipeline as `enron-sample-onemailbox` — only the source
# path narrows.

[corpus]
id = "enron-sample-tiny"
name = "Enron Email (Lay _sent slice)"
description = "Smoke-size variant of the Enron substrate — Kenneth Lay's `_sent` folder alone (~261 messages). Used to land the first end-to-end Phase 1-5 baseline before committing to the full one-mailbox or full-corpus run."
license = "public-domain"
schema_version = 1
mesh_sharing = false
size_compressed_gb = 0.002
size_indexed_gb = 0.03

[acquire]
type = "local_file"
path = "~/.svrnmesh/corpora-staging/enron/maildir/lay-k/_sent"

[extract]
type = "email"
max_body_bytes = 4194304
max_attachment_bytes = 0

[[filter]]
type = "boilerplate"
strip_signatures = true
strip_quoted_replies = true
strip_disclaimers = true
min_body_chars_after_strip = 20

[chunk]
type = "paragraph"
max_chars = 2000
overlap_chars = 200

[index]
fts = true
vector = true

[enrichment]
enabled = true
type = "atlas"
domain = "conversational"
prompt_version = "enron-v0"

[enrichment.reconciliation]
name_similarity_threshold = 0.85
cross_origin_required_signals = 2
judge_when_uncertain = true
judge_trials = 3

[enrichment.reconciliation.column_aware]
max_entities_per_column = 5000

[enrichment.reconciliation.column_aware.column_headers]
person_headers = ["employee", "person", "name", "trader", "owner", "contact", "attendee"]
organization_headers = ["counterparty", "customer", "vendor", "supplier", "company", "organization", "client", "broker"]
place_headers = ["city", "state", "country", "location"]

[display]
category = "email"
icon = "mail"
