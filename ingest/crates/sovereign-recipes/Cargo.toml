[package]
name = "corpus-engine-recipes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The bundled recipe definitions: every recipe.toml, the registry catalog, the ontology-v1 templates, the Vital-Articles lists and the mailbox-provider list, as static data."

# The DIRECTORY keeps its name; the PACKAGE may not be `sovereign-*`, because
# `[[forbid]] corpus-engine* -> sovereign-*` in quality/ARCH_LAYERS.toml would
# redden corpus-engine's edge to it (five-programs-52). Data only: no build.rs,
# no fs, every entry an `include_str!`/`include_bytes!` inside this crate root.

[dependencies]
workspace-hack = { version = "0.1", path = "../../../shared/crates/workspace-hack" }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
