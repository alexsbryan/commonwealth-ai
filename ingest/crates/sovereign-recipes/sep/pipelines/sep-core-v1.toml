# SEP core ingestion — `sovereign pipeline` recipe.
#
# Each work unit is one SEP slug (e.g. `compatibilism`). The driver
# shells out to:
#
#   sovereign enrich sep-ingest <slug> --force
#   sovereign enrich build sep-<slug>
#
# Idempotence comes from sovereign's own enrichment layer (`enrich
# build` resumes from the last-completed sub-stage on a partial atlas)
# plus the worklist's `done` state. Re-running this recipe is safe —
# already-completed slugs are skipped at the worklist level; previously
# half-built slugs (atoms present but configurations missing — a crash
# state from older pipeline runs) get re-queued and resumed on the
# next pass because the source filter now gates on
# `configurations.json` (the final-stage marker) rather than
# `atoms.json` (a first-stage marker that lied about completeness).
#
# ## Operational defaults
#
# - `concurrency = 1` keeps a single laptop honest. Mesh-distributed
#   runs should override at the driver level (concurrency = number of
#   mesh slots) — the work itself is per-slug-atomic so there's no
#   coordination across drivers.
# - `max_attempts = 3` covers transient peer drops and brief mesh
#   capacity squeezes. A unit that fails three times is almost
#   always a data bug (404 slug, broken parquet row) not a peer issue.
# - `timeout_secs = 7200` (2h) — long SEP articles (e.g. set-theory)
#   can take 20+ min per phase on commodity hardware.
# - `[schedule.active_hours]` is left commented; uncomment to make
#   the driver auto-pause during waking hours.

[recipe]
id      = "sep-core-v1"
version = 1

[source]
# Default: enumerate every SEP slug available from the cached parquet.
# Batteries-included — `sovereign pipeline run sep-core-v1.toml` Just
# Works regardless of corpus state. If the parquet isn't acquired yet
# the command fails with a clear "run `sovereign corpus acquire sep`"
# message at seed time.
#
# To run against a curated subset instead, pass `--slugs <file>` or
# `--key <slug>` to `pipeline run`. The recipe-level default stays
# the full corpus so partial-run usage is purely additive.
type    = "command"
# Emit one bare slug per line, restricted to slugs whose atlas isn't
# fully built. Three stages:
#   1. `--list` produces `<header>\n<count>  <slug>` rows
#   2. `awk 'NR>1 {print $2}'` drops the header + count, leaving the slug
#   3. `while read … [ -f .../configurations.json ] || echo` skips slugs
#      whose atlas/configurations.json already exists on disk.
#
# **Gate choice: `configurations.json`, not `atoms.json`.** Atom extraction
# is the FIRST stage of `enrich build`; configurations is one of the LAST
# (writes after atoms + edges + resolution_failures + trajectories). A
# build that crashes mid-pipeline leaves atoms.json behind but no
# configurations.json — gating on atoms.json silently treats those
# half-baked atlases as done. Audited 2026-05-17: ~514/1306 atlases
# were in this state ("semi-failed"); switching the gate to
# configurations.json self-heals them on the next pipeline run.
#
# `enrich build` is itself idempotent — re-running on a partial atlas
# resumes from where it left off (verified by replaying sep-holes:
# enrich build wrote configurations + gaps + schema_validation +
# tension_candidates without touching the prior atoms/edges files).
# So the source filter only needs to identify "did the full build
# ever finish?"; the worker handles the rest.
command = "sovereign enrich sep-ingest --list | awk 'NR>1 {print $2}' | while IFS= read -r s; do [ -f \"$HOME/.svrnmesh/indexes/sep-$s/atlas/configurations.json\" ] || echo \"$s\"; done"

[enrich]
# `&&` short-circuits — if sep-ingest fails (404 slug, missing
# parquet, etc.), enrich build is never invoked and the unit fails
# fast with a clear stderr.
command      = "sovereign enrich sep-ingest {key} --force && sovereign enrich build sep-{key}"
timeout_secs = 7200

# Built-in classifier covers timeout / refused / vram_thrash /
# model_missing / mismatch / unknown. The two custom rules below tag
# SEP-specific failure modes so the failure-bucket histogram is
# actionable instead of a sea of `unknown`.
[[enrich.failure_classifier]]
bucket          = "sep_phase_validation"
stderr_pattern  = "Phase \\d+ validation failed|atom schema violation"

[[enrich.failure_classifier]]
bucket          = "parquet_missing"
stderr_pattern  = "sep\\.parquet.*not found|run `sovereign corpus acquire sep`"

# Catches exit-127 cascades — the typical cause is a `cargo build` racing
# against in-flight pipeline subprocess spawns (cargo's atomic-rename of
# target/release/sovereign-cli exposes a window where new shell-outs
# can't resolve `sovereign` on PATH). Bucketing this loudly means a
# future cascade self-diagnoses instead of pooling into `unknown`.
[[enrich.failure_classifier]]
bucket          = "binary_missing"
stderr_pattern  = "sovereign: command not found|sovereign: No such file"

[dispatch]
max_attempts = 3
lease_secs   = 7200
concurrency  = 1

# Uncomment + tune to auto-pause during the day. The driver finishes
# in-flight units before sleeping, so a `pipeline run` left running
# under `tmux` will silently park and resume on schedule.
#
# [schedule]
# active_hours = "22:00-07:00"
