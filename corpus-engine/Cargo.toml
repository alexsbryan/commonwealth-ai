[workspace]
members = [".", "xtask"]

[package]
name = "corpus-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared corpus ingestion and index management for Sovereign and Commonwealth"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Logging
tracing = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["gzip", "brotli", "stream", "json"] }

# Vector database
lancedb = "0.27"

# Arrow (version driven by lancedb)
arrow = "57"
arrow-array = "57"
arrow-schema = "57"

# XML
quick-xml = "0.36"

# HTML
scraper = "0.20"

# JSON
jsonpath-rust = "0.7"

# Data formats
parquet = "57"
csv = "1.3"

# Compression
flate2 = "1"
bzip2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Text
regex = "1"
glob = "0.3"

# Misc
tempfile = "3"

# Hashing
blake3 = "1"
sha2 = "0.10"

# Clustering
hdbscan = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Unique IDs (used by NoteStore)
uuid = { version = "1", features = ["v4"] }

# Code intelligence (gated on `treesitter` feature). Tree-sitter and its
# grammar crates are heavy, so default builds skip them. Enable with
# `--features treesitter` when indexing source code.
tree-sitter            = { version = "0.26", optional = true }
tree-sitter-language   = { version = "0.1",  optional = true }
tree-sitter-rust       = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go         = { version = "0.25", optional = true }
tree-sitter-python     = { version = "0.25", optional = true }
streaming-iterator     = { version = "0.1",  optional = true }
walkdir                = { version = "2",    optional = true }
notify                 = { version = "8",    optional = true }

# SCIP call graph (gated on `treesitter` feature alongside the code
# intelligence stack). rusqlite stores the symbol graph, prost parses
# SCIP protobuf exports, which detects exporter binaries on PATH.
rusqlite               = { version = "0.35", features = ["bundled"], optional = true }
prost                  = { version = "0.13", optional = true }
which                  = { version = "7",    optional = true }
# Cross-process file locking for the SCIP rebuild guard. Cheaper than a
# lockfile + PID dance; kernel releases the lock automatically on process
# death so we can't leak a stale lock from a crashed writer.
fs4                    = { version = "0.12", optional = true }

[features]
default = []
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-language",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-python",
    "dep:streaming-iterator",
    "dep:walkdir",
    "dep:notify",
    "dep:rusqlite",
    "dep:prost",
    "dep:which",
    "dep:fs4",
]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

# Fast dev builds: skip debug symbols (biggest single speedup for cargo check).
[profile.dev]
debug = 0
