[package]
name = "corpus-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared corpus ingestion and index management for Sovereign and Commonwealth"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# HTTP — workspace baseline ["json", "rustls-tls"]; engine adds streaming + compression.
reqwest = { workspace = true, features = ["gzip", "brotli", "stream"] }

# Server-Sent Events client — used by the newsworthy watcher to
# subscribe to Wikimedia EventStreams (`stream.wikimedia.org`) for
# push-based article freshness instead of polling MediaWiki's API.
# Handles SSE framing, `Last-Event-ID` resumption, and auto-reconnect.
reqwest-eventsource = "0.6"

# Vector database
lancedb = { workspace = true }
# Lance is the on-disk format under lancedb. We pull it in directly
# so `snapshot::publish_snapshot` can enumerate fragments from the
# manifest (transactional view) instead of via a `readdir` of
# `chunks.lance/data/`. readdir races with LanceDB background
# compaction — empirically dropped 9/3021 fragments on the first
# wikipedia publish. See `project_snapshot_publish_consistency.md`.
# `lance` itself stays inline — corpus-engine is the only consumer.
lance = "4"
lance-index = "4"
lance-table = "4"

# Arrow (version driven by lancedb)
arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

# XML
quick-xml = "0.36"

# HTML
scraper = "0.20"

# JSON
jsonpath-rust = "0.7"

# Directed-multigraph cycle detection — used by the investigation
# enrichment pipeline's `circular_flow` pattern detector. Pinned at
# 0.6 (current stable as of 2026-04). Default features include the
# graph algorithms we need (Tarjan SCC + simple cycle enumeration).
petgraph = "0.6"

# Data formats
parquet = { workspace = true }
csv = "1.3"

# Compression
flate2 = "1"
bzip2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 7z used by the Internet Archive Stack Exchange dump (one .7z per
# community). Default features are heavier than we need (aes256, ppmd,
# encoder) — disable them; SE archives are LZMA2 (decoder always
# available via the lzma-rust2 hard dep) + occasional bzip2 entries.
# `util` exposes the `decompress_file` convenience used by the SE
# extractor's lazy-extract step.
sevenz-rust2 = { version = "0.21", default-features = false, features = ["bzip2", "util"] }

# Text
regex = { workspace = true }
glob = "0.3"

# Misc
tempfile = { workspace = true }

# Hashing
blake3 = "1"
sha2 = { workspace = true }

# Canonical-sync packing: tar over zstd for cross-peer canonical
# transfers. Both are mature pure-Rust impls; tar handles directory
# walks + sparse files, zstd gives ~3-5× compression on LanceDB
# fragment files in practice.
tar = "0.4"
zstd = "0.13"

# Clustering
hdbscan = "0.12"

# Time
chrono = { workspace = true }

# Unicode normalization — used by the atlas resolver's `fold()` to
# strip Latin combining diacritics so `Karámazov` and `Karamazov`
# collapse to the same folded key. NFD decomposes the precomposed
# á into a + U+0301 (combining acute accent); dropping marks
# afterwards yields plain a. Small, pure-Rust, widely used.
unicode-normalization = "0.1"

# Unique IDs (used by NoteStore). Workspace declares ["v4", "serde"];
# the extra `serde` feature is harmless here.
uuid = { workspace = true }

# Code intelligence (gated on `treesitter` feature). Tree-sitter and its
# grammar crates are heavy, so default builds skip them. Enable with
# `--features treesitter` when indexing source code.
tree-sitter            = { version = "0.26", optional = true }
tree-sitter-language   = { version = "0.1",  optional = true }
tree-sitter-rust       = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-go         = { version = "0.25", optional = true }
tree-sitter-python     = { version = "0.25", optional = true }
streaming-iterator     = { version = "0.1",  optional = true }
walkdir                = { version = "2",    optional = true }
notify                 = { version = "8",    optional = true }

# rusqlite stays here for the non-scip stores (NoteStore, FeatureStore,
# wikipedia_graph, lint/test results, plan_items, project_docs, notes_sync).
# Scip's own rusqlite usage now lives in corpus-engine-scip.
rusqlite               = { version = "0.35", features = ["bundled"], optional = true }
# Markdown AST. Used by `extractors/markdown.rs` (and used to be used
# by design_signals.rs, which moved to corpus-engine-atos 2026-05-23).
# Same version sovereign-atos and corpus-engine-atos use — one version
# per workspace, per ARCH_PRINCIPLES.md §8.1.
pulldown-cmark         = { version = "0.12", default-features = false, features = ["simd"], optional = true }

# SCIP call graph + exporter dispatch — moved to its own crate
# (2026-05-23, ARCH §3.1/§3.3 carve-out). corpus-engine still uses
# scip from `update::watch::CodeWatcher` and
# `enrichment::atlas::strategies::code_walk`, so we pull it back in
# behind the same `treesitter` feature gate the scip modules used to
# carry.
corpus-engine-scip     = { workspace = true, optional = true }

# NoteStore + project_docs + notes_sync — also carved out 2026-05-23.
# corpus-engine still references the NoteStore from `alignment_projector`,
# `extractors::alignment_workspace`, and `update::project_index_watcher`,
# so pull it back in behind the `stores` feature (same gate the modules
# used to carry).
corpus-engine-notes    = { workspace = true, optional = true }

[features]
# `stores` is in the default set because every downstream sovereign +
# commonwealth crate touches at least one rusqlite-backed module
# (NoteStore / FeatureStore / ProjectDocsStore / lint_results /
# test_results / wikipedia_graph). Pre-2026-05-22 these lived under
# `treesitter` because rusqlite happened to be declared there — that
# wart forced 5 tree-sitter grammar crates into every binary that
# only needed a notes table. The two are split now: `stores` is the
# SQLite layer, `treesitter` is grammars + SCIP.
default = ["markdown", "stores"]
markdown = ["dep:pulldown-cmark"]
# `stores` unlocks every rusqlite-backed module (NoteStore,
# FeatureStore, ProjectDocsStore, lint_results, test_results,
# wikipedia_graph, plan_items, notes_sync). Cheap to enable —
# rusqlite is bundled (no system dep) and SQLite itself is small.
stores = ["dep:rusqlite", "dep:notify", "dep:walkdir", "dep:corpus-engine-notes"]
treesitter = [
    "stores",
    "dep:tree-sitter",
    "dep:tree-sitter-language",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-python",
    "dep:streaming-iterator",
    "dep:pulldown-cmark",
    # scip is its own crate now; pulling it in behind the same feature
    # gate keeps the corpus-engine surface backwards-compatible with
    # consumers that opt into `treesitter`.
    "dep:corpus-engine-scip",
]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# In-process HTTP fake for the http_api acquirer e2e tests. Pinned
# at 0.6 (current stable as of 2026-04). Used only in tests.
wiremock = "0.6"
# Encoder side is `compress` — only needed in tests, so pulled in
# additively here to keep the library binary lean.
sevenz-rust2 = { version = "0.21", default-features = false, features = ["bzip2", "util", "compress"] }

