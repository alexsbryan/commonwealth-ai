[package]
name = "corpus-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared corpus ingestion and index management for Sovereign and Commonwealth"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", features = ["gzip", "brotli", "stream", "json"] }

# Database
rusqlite = { version = "0.35", features = ["bundled", "vtab"] }
sqlite-vec = "0.1"

# XML
quick-xml = "0.36"

# HTML
scraper = "0.20"

# JSON
jsonpath-rust = "0.7"

# Data formats
arrow = "55"
parquet = "55"
csv = "1.3"

# Compression
flate2 = "1"
bzip2 = "0.5"

# Text
regex = "1"
glob = "0.3"

# Misc
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
