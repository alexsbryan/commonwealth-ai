[package]
name = "corpus-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared corpus ingestion and index management for Sovereign and Commonwealth"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Logging
tracing = "0.1"

# HTTP
reqwest = { version = "0.12", features = ["gzip", "brotli", "stream", "json"] }

# Vector database
lancedb = "0.27"

# Arrow (version driven by lancedb)
arrow = "57"
arrow-array = "57"
arrow-schema = "57"

# XML
quick-xml = "0.36"

# HTML
scraper = "0.20"

# JSON
jsonpath-rust = "0.7"

# Data formats
parquet = "57"
csv = "1.3"

# Compression
flate2 = "1"
bzip2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Text
regex = "1"
glob = "0.3"

# Misc
tempfile = "3"

# Hashing
blake3 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
