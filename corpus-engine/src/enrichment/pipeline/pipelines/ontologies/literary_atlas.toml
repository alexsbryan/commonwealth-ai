# The literary atlas's map, written down (EPISTEMIC_INDEX.md §2.1): the body of
# a `[enrichment.ontology]` block under version 1, parsed by the same language a
# recipe author's block goes through. `name` is the `entity_type` the atoms
# actually carry; `label` is the genre's own noun for it. Vocabulary terms and
# the configuration flag are NOT written here — the pipeline fills them from
# its one decider each (`vocabulary()`, `runs_configuration_phase()`).

[[types]]
name = "concept"
kind = "entity"
label = "theme"
description = "A named theme, motif, condition or load-bearing literary term the work is about. Phase 1 lifts these generously as concept entities; there is no finer subtype."

[[types]]
name = "person"
kind = "entity"
label = "character"
description = "A character — any named person in the work, single-mention included. The narrator and the author are never entities."

[[types]]
name = "work"
kind = "entity"
description = "A cited work — a book, poem or play the text names."

[[types]]
name = "place"
kind = "entity"
description = "A named setting."

[[types]]
name = "institution"
kind = "entity"
description = "A named organisation, order or household."

[voices]
not_entities = ["the narrator", "the author"]

[derive]
# Phase 1's section-extraction schema carries `argument_reconstructions`.
arguments = true

# ── Navigation (EPISTEMIC_INDEX.md §2.2; map-conversion rung 2, 2026-09-08) ──
# The rows this genre walks under, written against what its build EMITS
# (`Pipeline::emits`) and ratcheted by
# `builtin_navigation_rows_name_only_kinds_the_pipeline_emits`. Kinds the
# pre-registered table lists and no built-in build produces are absent on
# purpose: `Position`/`Opposition` atoms, `Causes` and `OpposesIn` edges, and
# `Grounds`, which the resolvers write from an atom to a CHUNK — it has no
# seat in the atom CSR and a row walking it walks nothing. Exemplars describe
# question SHAPES this genre's readers ask, never a bank's sentences.

[navigation.thematic]
seed = { kinds = ["Configuration", "Entity", "Summary"], entity_types = ["concept"], budgets = { Summary = 8 } }
walk = ["Involves", "Tension", "Configures"]
hops = 2
budget = 12
summary_sources = ["atoms", "raptor"]
exemplars = [
  "what is this work about",
  "what are its main themes",
  "what does the work say as a whole",
  "how does the work treat this theme",
]

[navigation.tension]
seed = { kinds = ["Claim", "ArgumentReconstruction"] }
walk = ["Tension", "Involves"]
hops = 1
budget = 12
summary_sources = []
exemplars = [
  "where does the work contradict itself",
  "which claims are in tension",
  "what conflicts does it set up",
  "where do two characters' views collide",
]

[navigation.trajectory]
seed = { kinds = ["Entity", "State"] }
walk = ["Transition"]
hops = 2
budget = 12
exemplars = [
  "how does this character change",
  "how does it develop over the course of the book",
  "trace the arc of this relationship",
  "what happens to them over time",
]

[navigation.enumeration]
seed = { declared = true }
walk = []
hops = 0
budget = 12
exemplars = [
  "which characters are there",
  "list all the places",
  "how many themes does it record",
  "enumerate the works it cites",
]

[navigation.lookup]
# Event and Relation join Entity here (2026-09-09). A lookup is "give me the
# entry for this thing", and in a section-extracted corpus the thing asked
# about is as often something that HAPPENED or a way two entities STAND as it
# is a named entity. They were emitted by every build and named by no row, so
# `seed_population` derived a table without them and no walk could reach one:
# on `chaos-secret-agent`, 75 of 226 atoms had no vector, and the atom that
# answers the bench's killer-weapon probe was one of them.
seed = { kinds = ["Entity", "Event", "Relation"] }
walk = ["Involves"]
hops = 1
budget = 12
exemplars = [
  "who is this character",
  "tell me about this place",
  "what is this thing",
  "give me the entry for it",
]
