# The conversation atlas's map (EPISTEMIC_INDEX.md §2.1) — see literary_atlas.toml
# for the conventions. Chat transcripts: the user is the voice, the assistant
# is a generation surface; neither is ever a Person atom.

[[types]]
name = "person"
kind = "entity"
description = "A person the user names. The user and the assistant are never entities."

[[types]]
name = "concept"
kind = "entity"
description = "An idea, topic or named thing the conversation turns on."

[[types]]
name = "institution"
kind = "entity"
description = "An organisation, team or company."

[[types]]
name = "work"
kind = "entity"
description = "A document, project or artefact named in the conversation."

[[types]]
name = "place"
kind = "entity"
description = "A named location."

[voices]
self = "the user"
not_entities = ["the user", "the assistant"]
attributed_to = ["user", "assistant"]

[derive]
# Phase 1 shares the literary section-extraction schema, which carries
# `argument_reconstructions`.
arguments = true

# ── Navigation (EPISTEMIC_INDEX.md §2.2; map-conversion rung 2, 2026-09-08) ──
# The rows this genre walks under, written against what its build EMITS
# (`Pipeline::emits`) and ratcheted by
# `builtin_navigation_rows_name_only_kinds_the_pipeline_emits`. Kinds the
# pre-registered table lists and no built-in build produces are absent on
# purpose: `Position`/`Opposition` atoms, `Causes` and `OpposesIn` edges, and
# `Grounds`, which the resolvers write from an atom to a CHUNK — it has no
# seat in the atom CSR and a row walking it walks nothing. Exemplars describe
# question SHAPES this genre's readers ask, never a bank's sentences.

[navigation.thematic]
seed = { kinds = ["Configuration", "Entity", "Summary"], entity_types = ["concept"], budgets = { Summary = 8 } }
walk = ["Involves", "Tension", "Configures"]
hops = 2
budget = 12
summary_sources = ["atoms", "raptor"]
exemplars = [
  "what have we talked about most",
  "what is this conversation about",
  "summarize what I said on this topic",
  "what themes run through these chats",
]

[navigation.tension]
seed = { kinds = ["Claim", "ArgumentReconstruction"] }
walk = ["Tension", "Involves"]
hops = 1
budget = 12
summary_sources = []
exemplars = [
  "where did I change my mind",
  "which of my statements contradict each other",
  "where did we disagree",
  "what objections came up",
]

[navigation.trajectory]
seed = { kinds = ["Entity", "State"] }
walk = ["Transition"]
hops = 2
budget = 12
exemplars = [
  "how did my thinking on this evolve",
  "how did this project develop over the conversations",
  "trace how this idea changed",
  "what happened to this plan over time",
]

[navigation.enumeration]
seed = { declared = true }
walk = []
hops = 0
budget = 12
exemplars = [
  "which people have I mentioned",
  "list the projects we discussed",
  "how many places come up",
  "enumerate the documents I named",
]

[navigation.lookup]
# Event and Relation join Entity here (2026-09-09). A lookup is "give me the
# entry for this thing", and in a section-extracted corpus the thing asked
# about is as often something that HAPPENED or a way two entities STAND as it
# is a named entity. They were emitted by every build and named by no row, so
# `seed_population` derived a table without them and no walk could reach one:
# on `chaos-secret-agent`, 75 of 226 atoms had no vector, and the atom that
# answers the bench's killer-weapon probe was one of them.
seed = { kinds = ["Entity", "Event", "Relation"] }
walk = ["Involves"]
hops = 1
budget = 12
exemplars = [
  "who is this person I mentioned",
  "what is this project",
  "tell me about this thing we discussed",
  "give me what I said about it",
]
