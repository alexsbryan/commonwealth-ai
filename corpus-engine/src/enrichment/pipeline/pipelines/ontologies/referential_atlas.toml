# The referential atlas's map (EPISTEMIC_INDEX.md §2.1) — encyclopedias, wikis,
# reference works described in editorial third person. See literary_atlas.toml
# for the conventions.

[[types]]
name = "person"
kind = "entity"
description = "A person the section describes or cites; split from the works they wrote."

[[types]]
name = "place"
kind = "entity"
description = "A named location."

[[types]]
name = "concept"
kind = "entity"
description = "A named idea, term or theory the section explains."

[[types]]
name = "institution"
kind = "entity"
description = "An organisation, body or school."

[[types]]
name = "work"
kind = "entity"
description = "A cited or described work."

[[types]]
name = "event"
kind = "entity"
description = "A historical event the section treats as a thing in its own right — an entity of type `event`, distinct from the Event atom that carries participants and a section position."

[derive]
# Phase 1 uses the shared section-extraction schema, which carries
# `argument_reconstructions`.
arguments = true

# ── Navigation (EPISTEMIC_INDEX.md §2.2; map-conversion rung 2, 2026-09-08) ──
# The rows this genre walks under, written against what its build EMITS
# (`Pipeline::emits`) and ratcheted by
# `builtin_navigation_rows_name_only_kinds_the_pipeline_emits`. Kinds the
# pre-registered table lists and no built-in build produces are absent on
# purpose: `Position`/`Opposition` atoms, `Causes` and `OpposesIn` edges, and
# `Grounds`, which the resolvers write from an atom to a CHUNK — it has no
# seat in the atom CSR and a row walking it walks nothing. Exemplars describe
# question SHAPES this genre's readers ask, never a bank's sentences.
# Referential skips Phase 8, so no Configuration seed and no Configures edge.

[navigation.thematic]
seed = { kinds = ["Entity", "Summary"], entity_types = ["concept"], budgets = { Summary = 8 } }
walk = ["Involves", "Tension"]
hops = 2
budget = 12
summary_sources = ["atoms", "raptor"]
exemplars = [
  "what is this topic about",
  "give an overview of this subject",
  "what are the main aspects of this",
  "summarize the entry as a whole",
]

[navigation.tension]
seed = { kinds = ["Claim", "ArgumentReconstruction"] }
walk = ["Tension", "Involves"]
hops = 1
budget = 12
summary_sources = []
exemplars = [
  "where do accounts of this disagree",
  "what is disputed about this",
  "which claims about it conflict",
  "what are the competing explanations",
]

[navigation.trajectory]
seed = { kinds = ["Entity", "State"] }
walk = ["Transition"]
hops = 2
budget = 12
exemplars = [
  "how did this develop over time",
  "what caused this to change",
  "trace the history of this",
  "what happened to it afterwards",
]

[navigation.enumeration]
seed = { declared = true }
walk = []
hops = 0
budget = 12
exemplars = [
  "which events are recorded",
  "list the people involved",
  "how many places does it name",
  "enumerate the works cited",
]

[navigation.lookup]
# Event and Relation join Entity here (2026-09-09). A lookup is "give me the
# entry for this thing", and in a section-extracted corpus the thing asked
# about is as often something that HAPPENED or a way two entities STAND as it
# is a named entity. They were emitted by every build and named by no row, so
# `seed_population` derived a table without them and no walk could reach one:
# on `chaos-secret-agent`, 75 of 226 atoms had no vector, and the atom that
# answers the bench's killer-weapon probe was one of them.
seed = { kinds = ["Entity", "Event", "Relation"] }
walk = ["Involves"]
hops = 1
budget = 12
exemplars = [
  "who was this person",
  "what is this thing",
  "tell me about this place",
  "give me the entry for it",
]
