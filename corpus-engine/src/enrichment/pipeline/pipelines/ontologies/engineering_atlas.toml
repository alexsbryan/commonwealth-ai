# The engineering atlas's map (EPISTEMIC_INDEX.md §2.1). Phase 1 emits claims
# with code anchors and nothing else — no entity type to declare, so no
# `[[types]]` — and the map exists for its navigation rows.

[derive]
arguments = false

# ── Navigation (EPISTEMIC_INDEX.md §2.2; map-conversion rung 2, 2026-09-08) ──
# The rows this genre walks under, written against what its build EMITS
# (`Pipeline::emits`) and ratcheted by
# `builtin_navigation_rows_name_only_kinds_the_pipeline_emits`. Kinds the
# pre-registered table lists and no built-in build produces are absent on
# purpose: `Position`/`Opposition` atoms, `Causes` and `OpposesIn` edges, and
# `Grounds`, which the resolvers write from an atom to a CHUNK — it has no
# seat in the atom CSR and a row walking it walks nothing. Exemplars describe
# question SHAPES this genre's readers ask, never a bank's sentences.
# Claims only: the tension row is the one row a claims-only atlas can fire;
# the other four are switched OFF by name (no exemplars, so no centroid).
# Measured: `drift-target-*` carry 93 and 567 Claims and not one Entity.

[navigation.thematic]
exemplars = []

[navigation.tension]
seed = { kinds = ["Claim"] }
walk = ["Tension"]
hops = 1
budget = 12
summary_sources = ["atoms", "raptor"]
exemplars = [
  "where do these documents contradict each other",
  "which statements are in tension",
  "what does the doc claim that another source disputes",
  "where do two sources disagree about the design",
]

[navigation.trajectory]
exemplars = []

[navigation.enumeration]
exemplars = []

[navigation.lookup]
exemplars = []
