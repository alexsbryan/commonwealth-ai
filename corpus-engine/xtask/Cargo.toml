[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

# The gates use std + the arch-layers policy crate (schema + evaluator for
# quality/ARCH_LAYERS.toml; brings serde + toml). The std-only stance ended
# deliberately with the layer-gate (quality program, 2026-07-11): the policy
# parser must be SHARED with the code-intel arch_report, or the two
# enforcement halves drift on what the layer map means.
[dependencies]
arch-layers = { workspace = true }
# instrument-gate reads quality/instruments.toml through the ONE parser for
# that schema (ARCH §10.6) — the same file `svrn quality map` and `svrn
# posture` read. The feature keeps the kernel's default dep budget intact for
# anyone lifting that leaf.
kernel-types = { workspace = true, features = ["quality-registry"] }
# lint-gate parses `cargo clippy --message-format=json` — a hand-rolled
# string scan mis-read diagnostics whose children precede the top-level
# `level` field (every clippy lint with a help child), so: real parser.
serde_json = { workspace = true }
# env-gate parses quality/env-flags.toml (registry) and censuses the
# workspace's env-var read sites (multiline-tolerant literal patterns).
toml = { workspace = true }
regex = { workspace = true }

# The two workspace-hygiene generators in `tests/` (2026-09-04). They live
# here, and not in the crate whose vocabulary they speak, because both read
# the REPO ROOT — one parses `research/clean-room/REQUIREMENTS.md`, the other
# shells `git ls-files` over the whole tree — and their old home
# (`kernel-types`) is a GLOBAL `[[package_leaf]]` that must build standalone
# with its tests. `xtask` is in no package, so nothing lifts it. DEV-only, so
# `cargo build -p xtask` (what the CI ratchets job runs) is unaffected.
[dev-dependencies]
# The `covers:` tag scanner's AST reader. Same version/features as
# corpus-engine's and kernel-types' were (ARCH §8.2 — one version per
# third-party crate across the workspace).
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"

[lints]
workspace = true
