[corpus]
id = "sep"
name = "Stanford Encyclopedia of Philosophy"
description = """
Peer-reviewed encyclopedia entries from the Stanford Encyclopedia of Philosophy. \
Includes claim and relationship enrichment for the epistemic-research skill.\
"""
# SEP entries are authored under Stanford copyright. Use is permitted for
# educational and research purposes. Do NOT redistribute raw text commercially.
license = "Copyright Stanford University (educational/research use)"
# mesh_sharing is disabled because SEP's license does not permit redistribution.
mesh_sharing = false
size_compressed_gb = 1.4
size_indexed_gb = 6.0

# Sourced from AiresPucrs/stanford-encyclopedia-philosophy on HuggingFace,
# which mirrors SEP entries as a single parquet file. This avoids scraping
# plato.stanford.edu directly (slow, fragile, and impolite to Stanford's servers).
# The parquet has columns: title, text, url.
[acquire]
type = "bulk_download"
url = "https://huggingface.co/datasets/AiresPucrs/stanford-encyclopedia-philosophy/resolve/main/data/train-00000-of-00001.parquet"
resume = true

[extract]
type = "parquet"
content_column = "text"
label_column = "title"
url_column = "url"

[chunk]
type = "paragraph"
max_chars = 2048
overlap_chars = 256

[index]
fts = true
vector = true
embedding_model = "nomic-embed-text-v2"
embedding_dimensions = 768

# SEP's distinctive hedging vocabulary ("it is widely accepted", "there is ongoing
# debate") makes it ideal for epistemic enrichment. Claim + relationship extraction
# powers the epistemic-research skill's stance graph.
[enrichment]
enabled = true
extract_relationships = true
relationship_similarity_threshold = 0.55
max_relationship_candidates = 50000

claim_extraction_prompt = '''
You are extracting philosophical claims from Stanford Encyclopedia of Philosophy passages.

JSON ONLY. No explanation, no preamble, no chain-of-thought.

RULES:
- Extract AT MOST 3 claims per passage.
- Return [] if the passage lacks 2+ substantive philosophical claims. Do not pad.
- DO NOT extract from: thought experiments or illustrative examples with fictional agents
  (Tim, Harry, Mary, Jones, Smith, or any "suppose"/"imagine"/"consider a case"/"assume that"
  framing), purely historical or biographical statements, logical formalizations, or statements
  about the article itself.
- A claim must be falsifiable or debatable. "Aristotle was a philosopher" fails.
  "Aristotle's virtue ethics grounds moral evaluation in character rather than consequences" passes.

For each claim provide:
- "claim": a single declarative statement capturing the position.
- "epistemic_status": one of "consensus", "majority", "contested", "minority", "established",
  "unclear". SEP hedging cues: "widely accepted"→consensus, "most philosophers"→majority,
  "remains controversial"→contested, "some argue"→minority, "it is uncontroversial"→established.
- "hedging_language": exact words from the text signalling epistemic status, or null.
- "attributed_to": philosopher name, school of thought, or null if the article's own framing.
'''

relationship_extraction_prompt = '''
Given two claims from different encyclopedia entries, determine
their epistemic relationship.

Claim A: {claim_a}
  From: {source_a}
  Attributed to: {attributed_a}

Claim B: {claim_b}
  From: {source_b}
  Attributed to: {attributed_b}

What is the relationship?
- "contradicts": Claim A directly opposes Claim B.
- "supports": Claim A provides evidence or argument for Claim B.
- "refines": Claim A qualifies or adds nuance to Claim B.
- "competing_answers": Both claims answer the same question differently.
- "presupposes": Claim A depends on or assumes Claim B.
- "none": No meaningful epistemic relationship.

Also provide:
- "connecting_issue": The question or topic that connects them.
  Null if the relationship is "none".
- "confidence": 0.0 to 1.0, how confident you are in this classification.

Return ONLY a JSON object. No other text.
'''
