[corpus]
id = "wikipedia-catalog"
name = "Wikipedia Catalog"
description = """
Catalog of all ~6.8M English Wikipedia articles (titles + abstracts \
+ section anchors only — no full text). Lets the system know *of* \
every article without indexing each one. When a query lands on a \
catalog hit, retrieval surfaces an honest "I haven't read this \
yet — want me to fetch it?" offer and on-demand single-article \
ingest is one click away. Pairs with the existing `wikipedia` \
chunk corpus (Vital Articles L5) so atlas grounding fires on \
both the curated head AND the dynamic long tail.\
"""
license = "CC-BY-SA-4.0"
kind = "catalog"
mesh_sharing = true
size_compressed_gb = 0.3
size_indexed_gb = 4.0

# The catalog JSONL is produced offline by
# `sovereign-recipes/wikipedia-catalog/scripts/build_catalog.py` from
# the Wikimedia abstract dump (~1 GB XML → ~70 MB JSONL.gz with all
# ~6.8M articles). Once the JSONL is built, `bulk_download` fetches
# it from wherever it's hosted (the eventual `sovereign-recipes`
# release URL); the extractor then streams it.
[acquire]
type = "bulk_download"
url = "https://huggingface.co/datasets/svrnmesh/wikipedia-catalog/resolve/main/wikipedia_abstracts.jsonl.gz"

[extract]
type = "wikipedia_catalog"

[chunk]
type = "passthrough"

[index]
fts = true
vector = true
# embedding_model + dimensions auto-detected from the loaded model.

# Pairs the catalog with the on-demand single-article content recipe
# (`wikipedia-article`). When a catalog hit fires, the
# CatalogIngestService takes the title from id_field, formats the
# Action-API URL via download_url_template, and runs the content
# recipe inline. id_field = "title" because the catalog's source_id
# IS the article title; the per-article recipe uses the title to
# compose the MediaWiki Action API URL whose JSON the
# `wikipedia_api_article` extractor consumes (wikitext + sections +
# links + properties).
[catalog]
id_field = "title"
download_url_template = "https://en.wikipedia.org/w/api.php?action=parse&page={id}&prop=wikitext%7Csections%7Clinks%7Cproperties&format=json&formatversion=2&redirects=1"
content_recipe = "wikipedia-article"
ingest_estimate_wpm = 12000
enrich_estimate_wpm = 600
# Single shared corpus for fetched articles. Every wikipedia_fetch
# call appends into `wikipedia-fetched` rather than spawning a new
# per-work corpus. Scales to thousands of long-tail articles
# without polluting installed_indexes() with one entry per fetch.
target_corpus_id = "wikipedia-fetched"
# One-hop "minesweeper" expansion: after fetching the requested
# article, eagerly queue its outgoing links for follow-up fetch.
# The user has expressed interest in that neighbourhood, so we
# pre-load the next-most-likely-relevant articles.
expansion_enabled = true
expansion_link_cap = 20
