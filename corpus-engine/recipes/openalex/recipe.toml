[corpus]
id = "openalex"
name = "OpenAlex"
description = "Open scholarly metadata from the OpenAlex catalogue."
license = "CC0-1.0"
mesh_sharing = true
size_compressed_gb = 63.0
size_indexed_gb = 500.0

# Sourced from open-index/open-alex on HuggingFace, a ZSTD-compressed
# parquet mirror of the OpenAlex snapshot (~250M works, 62.8 GB total).
# The works subset contains title, abstract_inverted_index, DOI, citation
# counts, authorship, and topic metadata.
[acquire]
type = "huggingface_dataset"
repo = "open-index/open-alex"
subset = "works"

[extract]
type = "parquet"
content_column = "abstract_inverted_index"
content_transform = "openalex_inverted_index"
label_column = "title"

[chunk]
type = "paragraph"
max_chars = 2048
overlap_chars = 256

[index]
fts = true
vector = true
