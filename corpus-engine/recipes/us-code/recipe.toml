# ─── Extraction ──────────────────────────────────────────────────────
#
# Each downloaded ZIP contains a single USLM XML file with the title
# body. `xml_sections` matches on local-name "section" — the basic
# statutory unit — and pulls the `identifier` attribute as the doc
# title (e.g. `/us/usc/t15/s1`). The local-name match is
# namespace-agnostic so USLM 1.x (xml.house.gov namespace) and 2.0
# (schemas.gpo.gov namespace) both round-trip through the same
# recipe — important because GPO and OLRC are mid-transition.
#
# Nested `<section>` elements (USLM uses these for sub-sections) are
# absorbed into the parent section's content rather than emitted as
# separate docs — citation granularity is whole-section, not sub-clause.
[extract]
type = "xml_sections"
element = "section"
title_attr = "identifier"

[chunk]
type = "paragraph"
max_chars = 2048
overlap_chars = 256

[index]
fts = true
vector = true
# No `[prebuilt]` block yet — the first build publishes the snapshot.

# ─── Enrichment ──────────────────────────────────────────────────────
#
# Off by default — the U.S. Code has ~150k sections; atlas enrichment
# at default settings is hours of LLM work and Layer-1 time-to-grounded
# matters more than atom-level depth for the first install. Re-enable
# in a derived recipe or via `sovereign enrich build us-code`.
[enrichment]
enabled = false
type = "atlas"
pipeline = "referential_atlas"
domain = "legal"
prompt_version = "1.0.0-legal"

[enrichment.clustering]
min_cluster_size = 50
epsilon = 0.10
label_sample_size = 5

[enrichment.alignment]
alignment_threshold = 0.65
min_chunks_for_discovery = 80

[enrichment.fault_lines]
proximity_threshold = 0.60
min_confidence = 0.70
