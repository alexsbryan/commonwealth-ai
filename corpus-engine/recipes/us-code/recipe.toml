[corpus]
id = "us-code"
name = "United States Code"
description = """
The codification of federal statutes — every active title of the U.S. \
Code as a citable annual edition. Sourced from govinfo's USCODE bulk \
data in USLM XML form (the same XML the Office of Law Revision Counsel \
produces; govinfo's annual editions are year-end snapshots of that \
work). License: 17 USC §105 — federal works are not subject to copyright \
in the United States.\
"""
license = "Public Domain (17 USC §105)"
# Mesh-shareable: federal works, no licensing constraint on redistribution.
mesh_sharing = true
query_sharing = true
# 54 titles × ~5–400 MB each. Title 26 (Internal Revenue Code) is the
# heavyweight. Compressed total ~1 GB across all 54 titles; indexed
# (chunks + FTS) ~0.5 GB at the configured chunker setting.
size_compressed_gb = 1.0
size_indexed_gb = 0.5

# ─── Build-time parameters ───────────────────────────────────────────
#
# Year selects which annual edition of the Code to ingest. govinfo
# publishes one immutable USLM snapshot per year at year-end; older
# editions stay reachable forever, so a downstream consumer asking
# "what did 15 USC §1 say when this OLC opinion was issued in 2019?"
# can install the 2019 edition alongside the current one. The
# alternative — OLRC's continuously-updated USLM at
# uscode.house.gov/download/ — gives latest text but no historical
# snapshots; that's a v2 hybrid (govinfo for stable editions + OLRC
# for currency markers since the most recent edition).
[parameters.year]
type = "string"
description = "Annual edition year of the U.S. Code to ingest (govinfo publishes one per calendar year)."
default = "2024"

# ─── Acquisition ─────────────────────────────────────────────────────
#
# govinfo's bulk-data package URLs follow a fixed pattern:
#   https://www.govinfo.gov/content/pkg/USCODE-{year}-title{N}/zip/USCODE-{year}-title{N}.zip
# Each ZIP contains a single USLM XML file (`USCODE-{year}-title{N}.xml`)
# at the archive root. We list every active title (1–54). Reserved /
# repealed-only titles still ship as placeholder packages so the
# whole-Code recipe stays a single URL list rather than a per-year
# title-filtering exercise.
#
# Bulk download supports `{year}` interpolation against
# `[parameters.year]` so swapping editions is a one-line install-time
# override:
#   sovereign corpus install us-code --param year=2023
[acquire]
type = "bulk_download"
resume = true
urls = [
    "https://www.govinfo.gov/content/pkg/USCODE-{year}-title1/zip/USCODE-{year}-title1.zip",
    "https://www.govinfo.gov/content/pkg/USCODE-{year}-title2/zip/USCODE-{year}-title2.zip",
    "https://www.govinfo.gov/content/pkg/USCODE-{year}-title3/zip/USCODE-{year}-title3.zip",
    "https://www.govinfo.gov/content/pkg/USCODE-{year}-title4/zip/USCODE-{year}-title4.zip",
