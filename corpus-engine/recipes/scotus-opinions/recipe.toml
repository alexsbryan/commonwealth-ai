[corpus]
id = "scotus-opinions"
name = "Supreme Court of the United States — Opinions"
description = """
Comprehensive Supreme Court opinions, 1791-present (~37k cases). \
Sourced from CourtListener (Free Law Project), which has consolidated \
supremecourt.gov slip opinions, govinfo's USCOURTS-SCT bound volumes, \
the FLITE 1937-1975 historical set, and the Library of Congress \
pre-1937 material into a single deduplicated, citation-graphed corpus. \
Public-distribution path is `[prebuilt]` from HuggingFace — end users \
install in seconds with no API token. Building locally from scratch \
requires a paid CourtListener membership tier; see README.\
"""
license = "Public Domain (17 USC §105)"
mesh_sharing = true
query_sharing = true
size_compressed_gb = 0.50
size_indexed_gb = 1.50

# ─── Build-time parameters ───────────────────────────────────────────
#
# Same CourtListener API token used by olc-opinions. Register once at
# https://www.courtlistener.com/sign-in/; reuse the token across both
# corpora. Free tier is ~5,000 requests/day — plenty for the ~370
# paginated requests SCOTUS needs.
[parameters.api_token]
type = "string"
description = "CourtListener API token. Free; register at https://www.courtlistener.com/sign-in/. Required — the opinions endpoint rejects unauthenticated requests."
required = true

# Optional date floor for slicing a smaller subset locally. Default
# 1791-01-01 is the comprehensive scope (every SCOTUS opinion in
# CourtListener) — the shape the maintainer's `[prebuilt]` build
# uses. Power users who don't want the full corpus can scope down
# via `--param start_date=YYYY-MM-DD`.
[parameters.start_date]
type = "date"
description = "Earliest cluster.date_filed to ingest (YYYY-MM-DD). Default 1791-01-01 = comprehensive. Scope down with later dates if running a slice locally."
default = "1791-01-01"

# ─── Acquisition ─────────────────────────────────────────────────────
#
# CourtListener v4 REST: /opinions/ filtered by court=scotus. Each
# result carries `plain_text` (full opinion text) inline; no follow
# step needed.
#
# Scale: SCOTUS has ~37,000 opinions in CourtListener (covers slip
# opinions, bound volumes, per curiams, FLITE-source historical, LoC
# pre-1937). At 100 per page that's ~370 paginated requests; at 1
# req/sec the API pull takes ~6 minutes.
#
# Why CourtListener over the ERD's three-tier (supremecourt.gov +
# govinfo USCOURTS + govinfo SCD): (1) a single source eliminates the
# tier-boundary stitching work; (2) CourtListener has already built
# the citation graph the ERD §3.4 specifies as net-new; (3) the
# corpus is deduplicated against the same SCOTUS-quality merge rules
# Resource.org and Caselaw Access Project apply. The trade-off is
# provenance: CourtListener is a nonprofit redistributor, not a
# federal-domain source. The redistribution is on solid public-domain
# footing (17 USC §105 + CC0 bulk license) but if the consumer needs
# "served from a federal domain" — re-source from govinfo USCOURTS
# directly. See README for the v2 fallback plan.
[acquire]
type = "http_api"
base_url = "https://www.courtlistener.com/api/rest/v4"
user_agent = "commonwealth-ai/0.1 (scotus-opinions via CourtListener)"
rate_limit_per_second = 1.0

[acquire.headers]
Authorization = "Token {api_token}"

[[acquire.requests]]
url = "{base_url}/opinions/?cluster__docket__court=scotus&cluster__date_filed__gte={start_date}&page_size=100&order_by=date_created"

[acquire.pagination]
type = "next_url"
response_path = "$.next"

# ─── Extraction ──────────────────────────────────────────────────────
#
# Per-page JSON: `{count, next, previous, results: [...]}`. Each
# result has `plain_text` (full opinion text, OCR'd where the source
# was image-only) and `absolute_url` (canonical citation anchor).
[extract]
type = "json"
document_path = "$.results[*]"
content_field = "plain_text"
title_field = "absolute_url"
url_field = "absolute_url"
id_field = "id"

[chunk]
# `semantic` would be the ideal chunker for opinions — section
# structure (Syllabus, Opinion of the Court, Concurring, Dissenting)
# is load-bearing for retrieval. v1 ships with paragraph for cross-
# corpus consistency; revisit once SCOTUS retrieval evaluation
# surfaces section-boundary signal.
type = "paragraph"
max_chars = 4096
overlap_chars = 512

[index]
fts = true
vector = true

# ─── Enrichment ──────────────────────────────────────────────────────
#
# Atlas enrichment is high-value for opinions — entities are prior
# cases, constitutional provisions, statutes; relations are
# `cites_for`, `distinguishes`, `overrules`. CourtListener has
# already pre-computed much of the citation graph (their opinion
# objects carry citation arrays). For v1 atlas stays off; v2
# enrichment would benefit from a pre-pass that imports
# CourtListener's citations into Phase 1 atoms rather than
# re-extracting them from prose.
[enrichment]
enabled = false
type = "atlas"
pipeline = "referential_atlas"
domain = "legal"
prompt_version = "1.0.0-legal"

[enrichment.clustering]
min_cluster_size = 50
epsilon = 0.10
label_sample_size = 5

[enrichment.alignment]
alignment_threshold = 0.65
min_chunks_for_discovery = 100

[enrichment.fault_lines]
proximity_threshold = 0.60
min_confidence = 0.70
