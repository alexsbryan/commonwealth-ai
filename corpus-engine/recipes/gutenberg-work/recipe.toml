[corpus]
# Templated. The CatalogIngestService overrides this id at runtime to
# `gutenberg-<work_id>` (e.g. gutenberg-2701 for Moby Dick) via
# CorpusSpec::Inline before passing the recipe to CorpusEngine::ingest.
# A direct ingest of this recipe by id is refused — see the on_demand
# guard in engine/ingest.rs.
id = "gutenberg-work"
name = "Project Gutenberg — Single Work"
description = "On-demand single-work ingest from Project Gutenberg. Triggered by a catalog hit on the `gutenberg` corpus."
license = "Public Domain"
kind = "knowledge"
on_demand = true
mesh_sharing = true
size_compressed_gb = 0.002
size_indexed_gb = 0.05

# `url` is a placeholder. The CatalogIngestService overrides it at
# runtime by substituting the work id into the catalog recipe's
# download_url_template. The plain ingest path refuses to run an
# on_demand recipe whose id has not been overridden, so the
# placeholder URL never reaches the network.
[acquire]
type = "bulk_download"
url = "https://www.gutenberg.org/cache/epub/PLACEHOLDER/pgPLACEHOLDER.txt"

[extract]
type = "plaintext"

# Sentence-level chunking with a sane character cap. The Gutenberg
# plaintext distribution mixes long chapter blocks with short verse
# stanzas; sentence chunking keeps stanzas intact and slices long
# chapters at clean boundaries for the embed model.
[chunk]
type = "sentence"
max_chars = 2048

[index]
fts = true
vector = true

[enrichment]
enabled = true
type = "field_model"
domain = "literary"
prompt_version = "v1"
