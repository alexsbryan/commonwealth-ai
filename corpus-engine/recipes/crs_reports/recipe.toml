[corpus]
id = "crs_reports"
name = "Government Reports"
description = "Congressional Research Service and Government Accountability Office reports from the GovReport dataset."
license = "Public Domain"
mesh_sharing = true
size_compressed_gb = 1.2
size_indexed_gb = 5.0

# Sourced from launch/gov_report on HuggingFace. Contains ~19.5k CRS and
# GAO reports with full document text and executive summaries. The
# plain_text subset provides raw text without structural markup.
[acquire]
type = "huggingface_dataset"
repo = "launch/gov_report"
subset = "plain_text"

[extract]
type = "parquet"
content_column = "document"
label_column = "id"

[chunk]
type = "paragraph"
max_chars = 2048
overlap_chars = 256

[index]
fts = true
vector = true
