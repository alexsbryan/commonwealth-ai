[corpus]
id = "stackexchange"
name = "Stack Exchange"
description = "Questions and answers from the Stack Exchange network."
license = "CC-BY-SA-4.0"
mesh_sharing = true
size_compressed_gb = 39.0
size_indexed_gb = 120.0

# Sourced from common-pile/stackexchange on HuggingFace, which mirrors the
# December 2024 Stack Exchange data dump. Each document is a pre-composed
# question with its comments, answers, and answer comments. ~30.4M rows
# across multiple parquet shards (~39 GB compressed).
[acquire]
type = "huggingface_dataset"
repo = "common-pile/stackexchange"

[extract]
type = "parquet"
content_column = "text"
label_column = "id"

[chunk]
type = "paragraph"
max_chars = 2048
overlap_chars = 256

[index]
fts = true
vector = true
