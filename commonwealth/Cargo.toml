[workspace]
resolver = "2"
members = [
    "crates/commonwealth-core",
    "crates/commonwealth-discovery",
    "crates/commonwealth-scheduler",
    "crates/commonwealth-orchestrator",
    "crates/commonwealth-api",
    "crates/commonwealth-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/commonwealth-rs/commonwealth"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = { version = "0.8", features = ["macros"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Internal crates
commonwealth-core = { path = "crates/commonwealth-core" }
commonwealth-discovery = { path = "crates/commonwealth-discovery" }
commonwealth-scheduler = { path = "crates/commonwealth-scheduler" }
commonwealth-orchestrator = { path = "crates/commonwealth-orchestrator" }
commonwealth-api = { path = "crates/commonwealth-api" }
