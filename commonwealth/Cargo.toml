[workspace]
resolver = "2"
members = [
    "crates/commonwealth-core",
    "crates/commonwealth-discovery",
    "crates/commonwealth-inference",
    "crates/commonwealth-api",
    "crates/commonwealth-knowledge",
    "crates/commonwealth-daemon",
    "crates/commonwealth-test-harness",
    "crates/commonwealth-app",
    "crates/commonwealth-state",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/commonwealth-rs/commonwealth"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = { version = "0.8", features = ["macros"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# External
corpus-engine = { path = "../corpus-engine" }
# Portable hostname resolution for mDNS / node-name defaults.
hostname = "0.4"

# Internal crates
commonwealth-core = { path = "crates/commonwealth-core" }
commonwealth-discovery = { path = "crates/commonwealth-discovery" }
commonwealth-inference = { path = "crates/commonwealth-inference" }
commonwealth-api = { path = "crates/commonwealth-api" }
commonwealth-knowledge = { path = "crates/commonwealth-knowledge" }
commonwealth-app = { path = "crates/commonwealth-app" }
commonwealth-state = { path = "crates/commonwealth-state" }

# Platform layer dependencies
bytes = "1.0"
rusqlite = { version = "0.35", features = ["bundled"] }

# Fast dev builds: skip debug symbols (biggest single speedup for cargo check).
[profile.dev]
debug = 0
