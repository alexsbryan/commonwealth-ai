[package]
name = "commonwealth-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commonwealth-core = { path = "../commonwealth-core" }
commonwealth-state = { path = "../commonwealth-state" }
corpus-engine = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
# `toml` went with the forked `model_aliases` / `oicp_registry` modules
# (nc-22c): the TOML parsing lives in `commonwealth-core`, which this crate
# now re-exports rather than re-declares.
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
tokio-util = { workspace = true }
# `libc::kill` for SIGTERM-before-SIGKILL in `orchestrator::process::stop`.
# tokio's `Child::start_kill` is SIGKILL on unix, which makes a graceful
# window unreachable. Same usage pattern as commonwealth-api's
# `pipeline_pause` handler. Unix-only; the `#[cfg(unix)]` arm is the only
# reader.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
