[package]
name = "commonwealth-api"
description = "Axum HTTP server with OpenAI-compatible and OICP endpoints for Commonwealth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serving-policy = { workspace = true }
kernel-types = { workspace = true }
commonwealth-core = { workspace = true }
commonwealth-transport = { workspace = true }
commonwealth-discovery = { workspace = true }
commonwealth-inference = { workspace = true }
commonwealth-knowledge = { workspace = true }
# The ring rail, named DIRECTLY since cw-lift 1c. It used to be reached
# through `commonwealth_knowledge::rail`, which was 1b's re-export facade;
# the whole point of the split is that a rail consumer does not link the
# knowledge layer to get one. This crate still needs `commonwealth-knowledge`
# for grants, the work queue and the shard manager — that is a separate edge.
commonwealth-rail = { workspace = true }
commonwealth-app = { workspace = true }
commonwealth-state = { workspace = true }
# `treesitter` is REQUIRED, not incidental: `next_edit_syntax` reads the
# language registry (and its grammar handles) to filter next-edit sites
# by syntactic kind. Enabling it here also matches how the workspace
# already resolves corpus-engine everywhere the daemon is built, so this
# does not add a feature-unification flip.
corpus-engine = { workspace = true, features = ["treesitter"] }
# Parser for `next_edit_syntax`. The GRAMMARS come from corpus-engine's
# registry — this is only the engine that runs them, so there is one
# place where `.tsx` vs `.ts` is decided.
tree-sitter = "0.27"
corpus-engine-notes = { workspace = true }
# The SCIP call graph, for `next_edit_symbols` (call-site navigation).
# A DIRECT dep by the carve-out's own rule: corpus-engine deliberately
# ships no re-export shim for it ("external consumers import directly
# from `corpus_engine_scip::*`", corpus-engine/src/lib.rs), precisely so
# two crates cannot end up on different versions of one logical type
# (ARCH §8.3). Not a `sovereign-*` edge, so the layer gate's
# commonwealth-api forbid rule does not reach it.
corpus-engine-scip = { workspace = true }
# Staging recipe TOML to a throwaway file for the OICP recipe-test route
# (the engine's `test_recipe` reads from a path). Also used in dev-deps.
tempfile = "3"
# ATOS feature-lifecycle subsystem (the served middleware pipeline:
# approval-gate / artifact-surface / session-briefing + the session store).
# OFF by default behind the `atos` feature so the product mesh daemon carries
# zero ATOS; the harness-protocol chat path (plain `primary`/`fast`/concrete
# models) does not route through this pipeline.
corpus-engine-atos = { workspace = true, optional = true }
# ATOS orchestrator library — middleware stack references it for
# session state, approval lookups, and note-store access.
sovereign-atos = { path = "../../../sovereign/crates/sovereign-atos", optional = true }
# Shared tool manifest — the tool_injector middleware pulls the
# canonical ATOS tool descriptors from here so schemas can't drift
# from the tool implementations.
# `treesitter` feature dropped 2026-05-22 (Option B refactor). The
# previous reason — `sovereign_tools::manifest::atos_critical_descriptors`
# constructs every tool including the treesitter-gated code-intel
# tools — went away when tool_injector + context_injector moved to
# constructor-injected descriptors. commonwealth-api's remaining
# sovereign-tools usages (atlas_peer_advice, atlas_postinstall,
# atlas_status, notes::response_mine) are not treesitter-gated.
sovereign-tools = { path = "../../../sovereign/crates/sovereign-tools" }
sovereign-core  = { path = "../../../sovereign/crates/sovereign-core" }
# Tool-descriptor vocabulary for the two injector middlewares. Layer 0, so the
# injectors name what a tool IS without the layer-1 -> layer-2 reach they used
# to make through `sovereign_core::types` (noun-convergence rung 2c, family A).
oicp-types = { workspace = true }
axum = { workspace = true }
# `http_body::Body` trait for the admission middleware's TallyBody
# wrapper (peer-request tally on /status, order seat-resource-commons).
# Same 1.x line axum 0.8 and http-body-util 0.1 already resolve.
http-body = "1"
# Frontdoor hardening: `RequestBodyTimeoutLayer` (slow-loris guard on the
# request-body read). The `DefaultBodyLimit` size cap is in axum core.
tower-http = { workspace = true, features = ["timeout"] }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Used by `spawn_corpus_install_with_parameters` to bridge the API's
# JSON wire format into the TOML values that
# `Recipe::resolve_parameters` validates against the recipe's
# declared `[recipe.parameters]` schema.
toml = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
# RFC3339 `created_at` timestamps for the Ollama-native `/api/*` shim.
chrono = { workspace = true }
hex = "0.4"
# `libc::kill` for the `pipeline_pause` handler — needs to SIGTERM
# local `sovereign pipeline run` PIDs found via `/proc/`. Same usage
# pattern as `sovereign-cli/src/pipeline_cmd.rs`.
libc = "0.2"
reqwest = { workspace = true }
# `LocalInferenceService` is an async trait with streaming return
# types; needs async-trait for the sugar and futures for the
# Stream alias used in the handler's SSE wrapper.
async-trait = "0.1"
futures = "0.3"
# Used to swap `AppStateInner.self_node_id` after the join handshake
# adopts a founder-assigned ID. Cheap reads (Arc clone), single
# atomic swap on adoption, no async lock contention.
arc-swap = "1.7"
sha2 = { workspace = true }
# Phase 6 canonical-sync: server side packs the canonical index dir
# into a tar.zst stream, client side unpacks and validates fingerprint
# before atomic rename. Both crates have stable C/Rust impls.
tar = "0.4"
zstd = "0.13"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
# ReceiverStream — used by routes_responses.rs to turn a tokio mpsc
# of translated SSE events into an `axum::response::sse::Sse` body.
# Three other workspace crates already depend on the same minor;
# centralising under [workspace.dependencies] is filed against §8.1
# but not done in the same PR as the route addition.
tokio-stream = "0.1"
# Home-dir lookup for the alignment projector hook in auto_recover
# and corpus_sync. Already a transitive dep via sovereign-cli; pulling
# it in directly here avoids reaching across crates for a single call.
dirs = "6"

[features]
default = []
# The ATOS served-middleware pipeline (approval-gate, artifact-surface,
# session-briefing, context-injector spec/charter/artifact injection) + the
# session store. Reached only by pipeline-alias requests (e.g.
# `commonwealth/sovereign-coder`); plain chat bypasses it. Enabled in an
# atos build via `sovereign-cli-daemon --features atos` → `sovereign-mesh/atos`.
atos = ["dep:sovereign-atos", "dep:corpus-engine-atos"]

[dev-dependencies]
# `rail_e2e` installs a real ring signer, so the ops it writes
# verify the way a daemon's would. A stub signer would prove the route
# and not the signature.
ed25519-dalek = { workspace = true }
commonwealth-discovery = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
tower = "0.5"
http-body-util = "0.1"

[lints]
workspace = true
