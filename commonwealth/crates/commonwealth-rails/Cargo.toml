[package]
name = "commonwealth-rails"
description = "The minimal rails daemon — the process that IS your address on the mesh, with media registered on it and nothing else. Package-closure clean: no sovereign runtime, no corpus engine, no api crate."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cw-rails"
path = "src/main.rs"

[dependencies]
commonwealth-core = { workspace = true }
# `iroh` for the endpoint, the acceptor and the dial-by-key transport;
# `fanout` because the media catalogue half runs on it.
commonwealth-transport = { workspace = true, features = ["iroh", "fanout"] }
commonwealth-media = { workspace = true }
# `deep_link::parse_join_argument` for the invite, and
# `membership::validate_join_key_format` for the bare-key form.
commonwealth-discovery = { workspace = true }
# The ring rail's journal half (five-programs fp-44): `/v1/rail/{append,log,
# live}` are DURABLE doors — seq/signature/timestamp/id assigned on disk — and
# rail-core performs no I/O by its own oath, so the journal crate is the one
# to name. The lift is exactly three packages (rail, rail-core, oplog; comm
# over the two `cargo tree --edges normal` closures); the forbid row for this
# daemon carries the exception with the same commit.
commonwealth-rail = { workspace = true }
# The node key's type. Already in commonwealth-transport's closure, so
# naming it here adds nothing a lift has to carry.
ed25519-dalek = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
hostname = { workspace = true }
hex = "0.4"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
