[package]
name = "commonwealth-transport"
description = "PeerTransport seam — resolves (peer, traffic class) to dialable endpoints; IP overlay today, iroh-ready"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commonwealth-core = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.4"
hex = "0.4"
# Dial-by-key transport (feature `iroh`). Pinned to iroh 1.0 stable
# (shipped 2026-06-15, wire-protocol-stable). Optional so a build that
# doesn't need the iroh path doesn't compile it; all iroh symbol use is
# confined to src/iroh.rs, so version churn is a one-file change.
iroh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# `fanout` only: the per-peer rows are what a route serialises.
serde = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[features]
iroh = ["dep:iroh", "dep:tokio", "dep:rustls"]
# The generic peer fan-out (`fanout` module). Its own feature so a build that
# only wants the `PeerTransport` seam links neither tokio nor serde.
fanout = ["dep:tokio", "dep:serde"]
# Bench/measurement-only: a PathSelector that pins traffic to the relay even
# when hole-punching would succeed — the deterministic "relay floor" for the
# distributed-inference path characterization (tunnel_bench --relay-only).
# Rides iroh's unstable-custom-transports API; never enable in production.
iroh-relay-only = ["iroh", "iroh/unstable-custom-transports"]
# Enables iroh's in-process relay test server for the UDP-blocked
# relay-carried-connectivity test (H-plan item c). Test-only; pulls in
# `iroh/test-utils`. Run: cargo test -p commonwealth-transport
#   --features iroh-test-utils --test relay_tcp_only
iroh-test-utils = ["iroh", "iroh/test-utils"]

[dev-dependencies]
tokio = { workspace = true }
# Examples only: without a subscriber, `RUST_LOG=iroh=debug` on a bench run is
# silently a no-op — which is how a "no connections were established" reading
# gets believed. media_bridge_bench counts QUIC connections from iroh's own
# events, so the subscriber is load-bearing evidence, not decoration.
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# Path-characterization bench for the distributed-inference tunnel work
# (QWEN122B_DISTRIBUTED_HANDOFF §7). Run on two machines: `serve` on the
# worker, `dial --tcp/--iroh` on the host.
[[example]]
name = "tunnel_bench"
required-features = ["iroh"]

# Media-plane bench for the federated-library capstone (WORK_PLANE.md
# "Distance to the capstone"). Sibling to tunnel_bench: same tunnel, but the
# questions HTTP asks — Range/206 byte-exactness across the splice, sustained
# rate WITH a stall distribution, and N simultaneous viewers.
[[example]]
name = "media_bridge_bench"
required-features = ["iroh"]

[lints]
workspace = true
