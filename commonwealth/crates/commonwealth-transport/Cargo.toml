[package]
name = "commonwealth-transport"
description = "PeerTransport seam — resolves (peer, traffic class) to dialable endpoints; IP overlay today, iroh-ready"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commonwealth-core = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.3"
hex = "0.4"
# Dial-by-key transport (feature `iroh`). Pinned to iroh 1.0 stable
# (shipped 2026-06-15, wire-protocol-stable). Optional so a build that
# doesn't need the iroh path doesn't compile it; all iroh symbol use is
# confined to src/iroh.rs, so version churn is a one-file change.
iroh = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[features]
iroh = ["dep:iroh", "dep:tokio", "dep:rustls"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
