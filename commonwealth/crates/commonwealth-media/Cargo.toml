[package]
name = "commonwealth-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Federated media on the mesh rails — who offers a library, who may reach it, the viewer URL, and the catalogue fan-out. Package-closure clean: no sovereign runtime, no corpus engine, no api crate."

[dependencies]
commonwealth-core = { workspace = true }
# `iroh` for the acceptor's `Forward` (the holder half decides what a
# member's dial is forwarded to); `fanout` for the one attributed row per
# member the catalogue half returns.
commonwealth-transport = { workspace = true, features = ["iroh", "fanout"] }
# `MemberIdentity` + `verified_headers` live at the neutral kernel since
# five-programs fp-46 (§12 decision 3); this crate re-imports them at their
# historical paths.
kernel-types = { workspace = true }
# The origin registration wire (`Admit`, `Framing`, `OriginRegistration`,
# `OriginClaim`) is oicp's since pb-serve-distributes-standalone; `origins`
# re-exports it at its historical paths.
oicp-types = { workspace = true }
serde = { workspace = true }
# The fan-out row hands back the origin's JSON already parsed beside the raw
# body, so every shim does not re-parse it as its first line.
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = "0.4"
reqwest = { workspace = true }
tokio = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }

[lints]
workspace = true
