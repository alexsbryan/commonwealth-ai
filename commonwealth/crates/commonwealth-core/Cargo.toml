[package]
name = "commonwealth-core"
description = "Shared types, mesh state, shard plans, and ledger for Commonwealth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The neutral kernel (layer 0). `NodeId` and the `define_id!` macro live there
# since noun-convergence rung nc-1-kernel — see src/ids.rs for why.
kernel-types = { workspace = true }
oicp-types = { workspace = true }
# Keyed BLAKE3 for `Mesh::mesh_proof` — proof-of-possession of `mesh_secret`
# so the raw credential stops riding every gossip round. Same crate and same
# version as `commonwealth-discovery`, which derives the secret itself.
blake3 = "1"

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
getrandom = "0.4"
hex = "0.4"
tracing = "0.1"
ed25519-dalek = { workspace = true }

# `toml` is a DEV-dependency only, since 2026-09-04. `model_aliases` was this
# crate's ONLY production TOML parser and it left for `oicp-types`; the three
# remaining `toml::from_str` calls are all in `config.rs`'s `#[cfg(test)]`
# module, which round-trips the shipped `DaemonConfig` / `MeshConfig` shapes.
# Declared here rather than dropped: `commonwealth/BOUNDARY.md` counts dev
# edges too, so this is a visible line, not a silent one.
[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
