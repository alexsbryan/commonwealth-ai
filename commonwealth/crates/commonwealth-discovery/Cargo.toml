[package]
name = "commonwealth-discovery"
description = "mDNS discovery, gossip protocol, and latency probing for Commonwealth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commonwealth-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Join key generation
blake3 = "1"
getrandom = "0.4"
hex = "0.4"

# mDNS
mdns-sd = "0.21"
hostname = { workspace = true }

# TLS certificate generation
rcgen = "0.14"

# Gossip peer selection
rand = "0.10"

# Hardware detection
sysinfo = "0.38"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true
