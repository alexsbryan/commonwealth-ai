[package]
name = "commonwealth-state"
description = "MeshStore — a small gossip-replicated SQLite key/value store shared by every node in a mesh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
commonwealth-core = { workspace = true }
# The rail's FOLD, and only the fold — `Payload`, `Admission`, admission's one
# definition of "surviving". NOT `commonwealth-rail`, which is the journal on
# disk: this crate has no filesystem opinion and the pump that appends lives in
# `sovereign-mesh`. Both crates sit in `mesh-foundation` and both are members
# of the `commonwealth` package, so this is a sideways edge inside the
# substrate; the forbidden direction is the reverse one (rail -> state), which
# quality/ARCH_LAYERS.toml blocks by name.
commonwealth-rail-core = { workspace = true }
# `store_adapter`'s test names `Capability`/`CapabilityProfile`; a global
# `[[package_leaf]]`, so it costs the `commonwealth` closure no new leaf.
oicp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.35", features = ["bundled"] }
bytes = "1.0"
# A store value is `Bytes` and JSON has no byte string. 0.22 matches the one
# other first-party direct dependant (`sovereign-mesh`), so the workspace keeps
# one version of it in the graph (ARCH §8.2).
base64 = "0.22"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
# The rail's ONE set of op fixtures, from the crate that declares them. The
# projection tests fold REAL signed ops through REAL admission, so what they
# prove is the fold and not a hand-built `Admission` that agrees with itself.
commonwealth-rail-core = { workspace = true, features = ["test-support"] }

# The work atlas's real-store proofs, relocated beside the store they
# exercise 2026-09-22 (`tests/work_atlas_store.rs`, from
# sovereign-work-atlas/tests/cross_node.rs plus its store.rs gossip-exclusion
# mirror pin): they drive `WorkAtlasStore` over the REAL `MeshStore`
# outbox→projection path, the only honest way to assert what replication
# does with a Private record. Dev-only — the atlas does NOT depend back on
# this crate; its port is `sovereign_contracts::peer::ReplicatedKv`.
sovereign-work-atlas = { workspace = true }
# The port the relocated tests adapt `MeshStore` into, and the identity
# vocabulary their cross-instance fixtures key on.
sovereign-contracts = { workspace = true }
kernel-types = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
