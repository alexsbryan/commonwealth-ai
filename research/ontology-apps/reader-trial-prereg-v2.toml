[trial]
id = "reader-comparison-20261007-v2"
date = "2026-10-07"
model = "commonwealth/primary"
embed_model = "qwen3-embedding-0.6b"
chapter_word_limit = 2000
minimum_section_body_words = 0
run_order = ["uv-reader-v2-legacy", "uv-reader-v2-narrow", "ward-reader-v2-legacy", "ward-reader-v2-narrow"]

[revision]
v1 = "reader-comparison-20261007-v1 (reader-trial-prereg.toml) is the first run: legacy arms died creating atlas/derived_decisions.jsonl in a missing parent; narrow arms died on a decoder that offered the union of every claim kind's fields and on chapter-fatal evidence refusals."
changed_for_v2 = "The production decoder now binds each claim kind to exactly its own fields and each outcome status to its own branch; a claim whose citation does not verify is refused by name and kept beside the read instead of failing the chapter; a claim may cite the document's own declared identity fields by exact match; decision JSONL files create their parent directory; stamping uses an accountable read's own document identity. Source selection, model, batching, identity policy and scorers are unchanged, so v2 remains the same paired comparison."

[acceptance]
uv_primary = ["membership_coverage", "recovery_b_cubed.f1"]
ward_primary = ["deals.recall", "stage.recall"]
uv_controls = ["no_case_documents_placed", "documents_in_several_records"]
ward_controls = ["made_up.stage_updates", "made_up.commitments", "deal_atoms_unmatched"]
rule = "The narrow arm must strictly improve both UV primary measures and both Ward primary measures, with no increase in any available paired control. Any regression in either application rejects adoption. One paired trial is not an adoption verdict."
cost = "Report exact calls, prompt/completion/total tokens by available phase log or token snapshot, plus total scoped-build wall time; cost is not an acceptance target."
extrapolation = "Results apply only to these frozen tune inputs. Extrapolate only after a full-mailbox trial."

