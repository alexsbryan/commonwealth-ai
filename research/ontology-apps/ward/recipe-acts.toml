[corpus]
id = "crm-ward-acts"
name = "CRM from a mailbox, acts arm: Kim Ward (1,000-message sample)"
description = "ONTOLOGY_PRIMITIVES.md §8 prototype: Phase 1 extracts per-message deal acts only; deals are composed afterwards (compose.toml, compose.py). Same sample as crm-ward."
license = "personal-data"
schema_version = 1
mesh_sharing = false
size_compressed_gb = 0.0
size_indexed_gb = 0.3

[acquire]
type = "local_file"
path = "~/.svrnmesh/bench-corpora/enron-ward/sample"

[extract]
type = "email"
max_body_bytes = 4194304
max_attachment_bytes = 0

[[filter]]
type = "boilerplate"
strip_signatures = true
strip_quoted_replies = true
strip_disclaimers = true
min_body_chars_after_strip = 20

[chunk]
type = "paragraph"
max_chars = 2000
overlap_chars = 200

[index]
fts = true
vector = true

[enrichment]
enabled = true
type = "atlas"

[enrichment.ontology]
version = 1

[[enrichment.ontology.types]]
name = "person"
kind = "entity"
attributes = [{ name = "email", type = "text" }, { name = "employer", type = "ref", of = "company" }]
identity = ["email"]

[[enrichment.ontology.types]]
name = "company"
kind = "entity"
attributes = [{ name = "domain", type = "text" }]
identity = ["domain"]

[[enrichment.ontology.types]]
name = "deal_act"
kind = "claim"
force = "commissive"
description = "One step this message takes toward or away from a sale or purchase with one counterparty: asking for a price, sending an indication or offer, countering, accepting, declining, or confirming a trade."
attributes = [
  { name = "act", type = "text", values = ["request", "offer", "counter", "accept", "decline", "confirm"], description = "what this message does to the deal" },
  { name = "counterparty", type = "ref", of = "company", description = "the company on the other side of the trade, not Enron" },
  { name = "commodity", type = "text", description = "what is traded, e.g. natural gas, power, a swap" },
  { name = "delivery_point", type = "text", description = "where it is delivered, e.g. PG&E Citygate, Malin" },
  { name = "period", type = "text", description = "the term as written, e.g. Jan'02-Dec'03, five years" },
  { name = "price", type = "text", description = "the price as written, e.g. $4.12/MMBtu" },
  { name = "deal_ref", type = "text", description = "a deal number, RFP or contract name the message gives, if any" },
]

[[enrichment.ontology.types]]
name = "commitment"
kind = "claim"
force = "commissive"
subject = "person"
attributes = [{ name = "due", type = "time" }]
