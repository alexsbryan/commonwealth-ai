# Orientation-intent bank v1 — corpus-engine scope. See README.md for protocol.
#
# AUTHORING DISCIPLINE (recorded for the audit):
# - Drafted 2026-07-09, BEFORE any rollup node summary exists (the ordering is
#   the anti-contamination mechanism).
# - Questions written from week-1-developer intent, in user vocabulary, no
#   function names in N/S/P shapes. Module `//!` headers and the code-intel
#   leaf cache were used ONLY to verify gold paths, never for question phrasing.
# - Gold paths are repo-relative prefixes; a directory prefix matches anything
#   under it. Multi-home golds where the answer genuinely lives in >1 place.
# - frozen=false until Alex's review pass; set true at freeze. Post-freeze
#   edits require a note in FINDINGS.md.

[meta]
name = "orientation-bench-v1"
scope_prefix = "corpus-engine/"
authored = "2026-07-09"
frozen = true  # frozen 2026-07-09 after review (Alex: lgtm)

# Scoring rules (deterministic, encoded here so spike.py has no policy of its own):
#  navigation/purpose: hit@5 = any top-5 item whose path starts with any gold prefix
#  structure:          hit@5 = >=2 distinct gold prefixes covered within top-5
#  guardrail:          hit@5 = gold file present in top-5; ALSO record rank per arm —
#                      the G2 gate metric is rank shift C vs A (displacement)
#  negative:           report-only; flag if any rollup NODE ranks in top-3 (arm C)
[meta.scoring]
hit_k = 5
structure_min_distinct = 2
negative_node_flag_k = 3

