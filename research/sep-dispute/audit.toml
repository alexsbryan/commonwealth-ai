# Reading of census.py's lexical hits against sep-kant-transcendental-idealism (atoms.json of
# 2026-05-22). census.py joins these and reports `read` counts beside the lexical ones; a
# lexical hit with no row here is reported as `unread`, never as true.
# reader = "agent, 2026-10-03, provisional": the operator's reading replaces it (principle 7: the
# judge here is the operator; this file is the instrument check, not the verdict).
#
# verdict: true | false | via-reading  (the claim's attributed_to is a concept named after the
#          holders, e.g. "Feder-Garve interpretation": the reading-not-holder defect)
# kind = "attributed": the (position, holder) pair's attributed_right hit, per claim
# kind = "missed": a claim found on reading that carries the pair but the lexical match missed
# kind = "tension": a Tension edge matched to an opposing pair

