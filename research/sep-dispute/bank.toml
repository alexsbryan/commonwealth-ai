class = "dispute"
neutral = false
question = "Can Kant's theoretical philosophy settle whether appearances are identical to things in themselves? Who says it cannot, and who disagrees?"
hedge_required = true
hedges = [
  {chunk = 105497, quote = 'It is not clear that within the theoretical use of reason we can give any content to the claim of the numerical identity (or distinctness) of appearances and things in themselves, nor any warrant for asserting or denying  it.'},
]
collapse = []
neutral_holders = [
  {name = "Walker", match = ['\bWalker\b'], why = "cited only as 'cf. Walker 2010' (105499)"},
]

[[questions.positions]]
id = "undecidable"
label = "no content or no warrant outside practical contexts; Kant must be agnostic"
required = true
match = ['no (clear )?content', 'contentless', 'no warrant', 'agnostic', 'cannot (be )?(settle|settled|decided|known)', 'outside (of )?(moral|practical) contexts']
witnesses = [
  {chunk = 105497, quote = 'As Henry Allison and others have pointed out, it is not clear that there is any content to the question of whether an appearance is numerically identical to a thing in itself, outside of moral  contexts.'},
  {chunk = 105499, quote = 'many interpreters (notably Adams 1997: 822) think that we can have no warrant for asserting the identity or non-identity of appearances and things in themselves in general, and thus think the identity/non-identity debate (at least in theoretical contexts) concerns something about which Kant must be agnostic'},
]
