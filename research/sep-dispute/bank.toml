  {name = "Allison", match = ['\bAllison(ian)?\b'], witnesses = [{chunk = 105431, quote = 'The next two sub-sections explore the epistemological interpretation of Henry Allison.'}]},
  {name = "Prauss, Bird", match = ['\bPrauss\b', '\bBird\b'], witnesses = [{chunk = 105432, quote = 'In modern Kant scholarship, the epistemic reading was first put forward by Gerold Prauss, Henry Allison, and Graham Bird.'}]},
