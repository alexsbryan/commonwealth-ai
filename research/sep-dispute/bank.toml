  {name = "Allais, Rosefeldt, McDaniel, Marshall", match = ['\bAllais\b', '\bRosefeldt\b', '\bMcDaniel\b', '\bMarshall\b'], witnesses = [{chunk = 105459, quote = 'These metaphysical “dual aspect” interpretations differ in exactly how they understand the distinction between these different sets of properties (see also Allais (2004, 2006, 2007, 2015); Rosefeldt (2007, 2013); McDaniel (ms); and Marshall (2013)).'}]},
]

