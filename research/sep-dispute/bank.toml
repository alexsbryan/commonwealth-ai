[[questions]]
id = "d01-phenomenalist-vs-dual-aspect"
class = "dispute"
neutral = false
question = "Is Kant's transcendental idealism a form of phenomenalism? What are the competing readings, and who holds each?"
hedge_required = true
hedges = [
  {chunk = 105306, quote = 'There is probably no major interpretive question in Kant’s philosophy on which there is so little consensus.'},
  {chunk = 105551, quote = 'this debate shows no sign of abating any time soon.'},
]
collapse = ['\bkant (was|is) (simply |clearly |plainly )?a (berkeleyan )?phenomenalist\b', 'phenomenalist (reading|interpretation) (is|was|has been) (simply |clearly )?(wrong|refuted|mistaken)']

[[questions.positions]]
id = "phenomenalist"
label = "phenomenalist (Berkeleyan, subjectivist) reading"
required = true
match = ['phenomenalis', 'berkeleyan', 'subjectivis']
witnesses = [
  {chunk = 105331, quote = 'The first published review of the Critique of Pure Reason, by Feder and Garve (1782), accuses Kant of holding a basically Berkeleyan phenomenalist conception of objects in space.'},
  {chunk = 105423, quote = 'In the twentieth century, the phenomenalist (or “Berkeleyan”) interpretation of transcendental idealism is associated with P.F. Strawson'},
]
holders = [
  {name = "Feder and Garve", match = ['\bFeder\b', '\bGarve\b'], witnesses = [{chunk = 105331, quote = 'by Feder and Garve (1782), accuses Kant of holding a basically Berkeleyan phenomenalist conception'}]},
  {name = "P.F. Strawson", match = ['\bStrawson\b'], witnesses = [{chunk = 105423, quote = 'the phenomenalist (or “Berkeleyan”) interpretation of transcendental idealism is associated with P.F. Strawson'}]},
  {name = "Mendelssohn, Eberhard, Hamann, Jacobi, Fichte, Schelling", match = ['\bMendelssohn\b', '\bEberhard\b', '\bHamann\b', '\bJacobi\b', '\bFichte\b', '\bSchelling\b'], witnesses = [{chunk = 105331, quote = 'many of the key figures in German philosophy in 1781 and after (e.g., Mendelssohn, Eberhard, Hamann, Jacobi, Fichte, Schelling) take the phenomenalist or “subjectivist” reading of Kant for granted'}]},
  {name = "Guyer", match = ['\bGuyer\b'], witnesses = [{chunk = 105364, quote = 'While the identity phenomenalist interpretation has found few defenders among contemporary readers (Guyer 1987: 333–336 is a notable exception'}]},
  {name = "Adickes, Westphal", match = ['\bAdickes\b', '\bWestphal\b'], witnesses = [{chunk = 105518, quote = 'the identity version of phenomenalism (Adickes 1924; Westphal 1968)'}]},
  {name = "Aquila, Van Cleve", match = ['\bAquila\b', 'Van Cleve'], witnesses = [{chunk = 105518, quote = 'the non-identity version of phenomenalism (Aquila 1983; Van Cleve 1999)'}]},
]

[[questions.positions]]
id = "dual-aspect"
label = "non-phenomenalist dual-aspect (two-aspect) reading"
required = true
match = ['dual[- ]aspect', 'two[- ]aspect', 'non-phenomenalis', 'anti-phenomenalis', 'two (different )?(standpoints|perspectives|ways of considering)']
witnesses = [
  {chunk = 105424, quote = 'In the 1960s and 1970s a group of scholars, in some cases in direct opposition to Strawson, developed a non-phenomenalist, anti-metaphysical reading of transcendental idealism'},
]
holders = [
  {name = "Allison, Prauss, Bird", match = ['\bAllison(ian)?\b', '\bPrauss\b', '\bBird\b'], witnesses = [{chunk = 105551, quote = 'was challenged in twentieth century Anglophone scholarship by, among others, Graham Bird, Gerold Prauss, and Henry Allison.'}]},
  {name = "Langton", match = ['\bLangton\b'], witnesses = [{chunk = 105460, quote = 'Perhaps the most influential metaphysical but non-phenomenalist interpretation of Kant’s idealism has been Langton (1998).'}]},
  {name = "Allais, Rosefeldt, McDaniel, Marshall", match = ['\bAllais\b', '\bRosefeldt\b', '\bMcDaniel\b', '\bMarshall\b'], witnesses = [{chunk = 105459, quote = 'These metaphysical “dual aspect” interpretations differ in exactly how they understand the distinction between these different sets of properties (see also Allais (2004, 2006, 2007, 2015); Rosefeldt (2007, 2013); McDaniel (ms); and Marshall (2013)).'}]},
]

