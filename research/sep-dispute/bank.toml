[[questions]]
id = "d02-epistemic-vs-metaphysical-dual-aspect"
class = "dispute"
neutral = false
question = "Among 'dual aspect' readings of the distinction between appearances and things in themselves, what are the two main kinds, and whose interpretation exemplifies each?"
