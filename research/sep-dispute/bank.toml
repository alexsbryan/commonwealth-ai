# SEP dispute bank, first fixture: "Kant's Transcendental Idealism" (Stang, SEP 2016).
# feature-fidelity campaign, dispute half (.sovereign/features/feature-fidelity/campaign.md,
# Decisions 2026-10-03: fixture rule; autonomy (2)).
#
# THE RULE, fixed before any census number existed:
# * Gold comes from the chunk text only. Every position and every holder carries at least one
#   VERBATIM witness {chunk, quote}; `chunk` is the `id` in ~/.svrnmesh/indexes/sep/chunks.lance
#   (url .../entries/kant-transcendental-idealism/). census.py refuses to run if any quote is not
#   in its chunk (whitespace-collapsed, nothing else normalised) and records each witness's atlas
#   section (sec_NNNN, from sep-kant-transcendental-idealism/chapters.json).
# * A holder is gold for a position only when the text names that person as holding, defending,
#   or putting forward that position. "cf."/"see also" citations of a view's neighbours, people
#   who only supply an example, and a holder the text itself places on both sides are NEUTRAL:
#   a scorer neither requires nor penalises them. Holders cited only in footnotes absent from the
#   chunk text do not exist for this bank.
# * An item whose positions cannot each be credited to a named holder is `neutral = true`
#   (kept as a probe, never scored).
# * `required = false` marks a position the text states but an answer need not name; if the
#   answer does name a holder for it, misattribution rules still apply.
# * `targets` on an objection position: persons the objection is ABOUT (Allison, for the
#   objections to his reading); their co-mention is neither credit nor misattribution.
# * `match` lists are regexes over the answer: positions case-insensitive, holders
#   case-sensitive. They were written from the text's own vocabulary; census.py checks that each
#   pattern list matches its own witness quotes (an instrument check, not a tuning step).
#
# Scoring (implemented in score.py; `python3 score.py --selftest` shows each check failing on a
# known-bad answer):
#   positions_named  every required position has a `match` hit somewhere in the answer
#   holders_credited every required position has >= 1 gold holder named in a window of two
#                    consecutive sentences that also names that position (pronoun follow-ons)
#   misattribution   a sentence naming position P and holder H, where H is gold only for another
#                    position Q of this item, and the sentence names no position H holds; exempt
#                    when the sentence also credits P to its own gold holder or carries an
#                    [scoring].opposition_cue ("Robinson objects to Allison's ...")
#   collapse         a required position is missing, or a [scoring].collapse / item collapse
#                    pattern hits (one side asserted as settled)
#   hedge_kept       when hedge_required: >= 1 hedge marker present and no item `forbidden`
#                    pattern hits (e.g. a reply the text only says Allison "might" make, stated
#                    as made)
#   item passes      all five hold. Empty answer = could-not-judge, not failed.

[meta]
entry = "kant-transcendental-idealism"
title = "Kant's Transcendental Idealism"
author = "Nicholas F. Stang"
url = "https://plato.stanford.edu/entries/kant-transcendental-idealism/"
text_corpus = "sep"
text_chunks = "105306-105560"
atlas_corpus = "sep-kant-transcendental-idealism"
atlas_pipeline = "philosophy_atlas (enrich sep-ingest; no enrichment config on disk)"
drafted = "2026-10-03"

[scoring]
sentence_split = '(?<=[.!?;])\s+|\n+'
normalise = "NFKC; curly quotes and apostrophes to straight; en/em dash to hyphen; whitespace collapsed"
collapse = [
  '\b(scholars|interpreters|commentators|kantians) (now |all |generally )?(agree|concur)\b',
  '(?<!no )(?<!little )\bconsensus (is|view|reading)\b',
  '\bthe (correct|right|true|definitive|settled) (reading|interpretation|view)\b',
  '\b(settles?|settled|resolves?|resolved) (the|this) (debate|dispute|question|controversy)\b',
  '\bdefinitively\b',
]
opposition_cue = '\b(objects? to|objected|objections?|against|critici[sz]e[sd]?|critics?|critical of|reject(s|ed)?|challenge[sd]?|den(y|ies|ied)|oppos(e|es|ed)|opposition|contra|disagree[sd]?|repl(y|ies|ied)|respond(s|ed)?|response)\b'
hedge_markers = [
  'unclear', 'not (always |entirely )?clear', 'controvers', 'debated?', 'disput', 'contested',
  '\bmay\b', '\bmight\b', '\bperhaps\b', '\bprobably\b', 'arguabl', 'charitabl', 'not conclusive',
  'no consensus', 'little consensus', 'agnostic', 'open question',
]

