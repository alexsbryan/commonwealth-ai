witnesses = [
  {chunk = 105430, quote = 'The main difference is between epistemological and metaphysical “dual aspect” interpretations (Allison 2004: 52). On the epistemological reading, the distinction between appearances and things in themselves is simply a distinction in the standpoint from which we consider them.'},
]
