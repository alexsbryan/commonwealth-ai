[[questions]]
id = "arc-anarchism"
category = "k4_whole_story"
question = "Across the whole of the novel, how do anarchism and revolutionary politics play out — the competing ideologies, every character who embodies them, and the central plot they drive?"
expected_facts = ["anarchist", "bomb"]
answer1 = "The novel sets four incompatible revolutionary temperaments against one another. Michaelis, the ticket-of-leave apostle, preaches an optimistic historical determinism from a cottage lent by a patroness. Karl Yundt, toothless, rehearses a fantasy of a merciless band of men. Comrade Ossipon peddles Lombrosian degeneracy pamphlets and lives off women. The Professor, a walking bomb with an india-rubber ball in his pocket, wants a perfect detonator so that destruction may begin. Verloc, paid by a foreign embassy, hosts them in his parlour while informing on them, and Mr Vladimir uses their reputation to force the Greenwich outrage."
notes = "converts present-maximal-anarchism"

[[questions]]
id = "arc-statepower"
category = "k4_whole_story"
question = "Across the whole of the novel, how does it depict state power, policing, and espionage — every relevant figure and institution, traced through the whole plot?"
expected_facts = ["police", "agent"]
answer1 = "State power appears as rival departments rather than one authority. Chief Inspector Heat protects his private informant and would rather charge Michaelis than disturb the arrangement. The Assistant Commissioner, restless behind a desk and married into society, goes out to the Italian restaurant in Soho to break that arrangement himself. Sir Ethelred receives the case as parliamentary business and the fatuous Toodles ushers it along. Against them the foreign embassy, Privy Councillor Wurmt and Mr Vladimir, buys an agent provocateur to provoke the English police into repression."
notes = "converts present-maximal-statepower"

[[questions]]
id = "arc-tragedy"
category = "k4_whole_story"
question = "Across the whole of the novel, what happens in its domestic tragedy — the Verloc household, Stevie, and Winnie's arc from beginning to end?"
expected_facts = ["Winnie", "Stevie"]
answer1 = "Winnie marries Adolf Verloc because his shop shelters her mother and her brother Stevie, and her whole scheme of things is that they do not bear looking into. Her mother removes herself to an almshouse to secure Stevie's place. Verloc takes Stevie to Greenwich and the boy is blown to pieces on a tree root. When Winnie learns it she stabs her husband with the carving knife, flees with Ossipon, is abandoned on the Channel boat with her money taken, and drowns in the channel."
notes = "converts present-maximal-tragedy"

[[questions]]
id = "arc-bombing"
category = "k4_whole_story"
question = "Across the whole of the novel, what happens in the Greenwich bombing plot — its conception at the embassy, Verloc's role, how it was carried out, and its aftermath?"
expected_facts = ["Greenwich", "Stevie"]
answer1 = "Mr Vladimir summons Verloc to the embassy and demands an outrage against science, naming the Observatory, on pain of losing his pay. Verloc obtains explosives from the Professor and takes Stevie, wearing a coat with an address sewn inside, toward Greenwich Park. The boy stumbles on a tree root and is blown to fragments. Chief Inspector Heat recovers the address label and goes to Brett Street, the Assistant Commissioner reaches Verloc first, and Verloc is stabbed by his wife before any charge is laid."
notes = "converts present-maximal-bombing"

[[questions]]
id = "arc-verloc"
category = "k4_whole_story"
question = "Across the whole of the novel, what happens to Adolf Verloc — his secret double life, his shop, his marriage, and his downfall?"
expected_facts = ["Verloc", "shop"]
answer1 = "Verloc keeps a shabby shop of shady wares in Brett Street, sells to furtive customers, and is by turns a secret agent paid by a foreign embassy, an informant of Chief Inspector Heat, and a trusted comrade of the anarchists who meet in his parlour. He is indolent, fat, and attached to domestic comfort. Vladimir's demand for an outrage destroys the arrangement; he uses Stevie, loses him, and is killed at home with a carving knife by the wife who married him for her brother's sake."
notes = "converts present-maximal-verloc"

[[questions]]
id = "arc-london"
category = "k4_whole_story"
question = "Across the whole of the novel, how does it portray the city of London and its political/anarchist underworld?"
expected_facts = ["London", "anarchist"]
answer1 = "London is rendered as a town of marvels and mud, a monstrous cruelty of a cold and brooding sky where the sun hangs bloodshot without rays. Its underworld is domestic and shabby rather than heroic: a Brett Street shop of dubious wares, a parlour of talkers, the Silenus beer-hall where the Professor is met, an Italian restaurant in Soho of no particular nationality, cabs and omnibuses and the long walk through Hyde Park. The Professor walks its crowded pavements unsuspected, and the Greenwich Observatory stands at the edge of it."
notes = "converts present-maximal-london"
