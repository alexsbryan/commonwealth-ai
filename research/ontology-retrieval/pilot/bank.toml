[bank]
name = "ontology-pilot-secret-agent-v1"
corpus = "chaos-secret-agent"
description = "24 questions over the installed 316-chunk chaos-secret-agent corpus, for the\ncustom-ontology/RAPTOR study's stage-0c pilot. The pilot is instrument\nevidence only: it exists so that checks I1-I6 have arms to judge and planted\nfaults to catch, and no bar is read from it.\n\nThree shapes are aimed for, and which kind each lands in is the corpus's\nanswer, not this file's: single-passage lookups, four enumerations, and the\nsix whole-story prompts the chaos-monkey bank calls `maximal`.\n"

[[questions]]
id = "lookup-wife"
category = "k0_look_it_up"
question = "In the novel, who is the wife of Adolf Verloc?"
expected_facts = ["Winnie|Mrs Verloc|Winnie Verloc"]
answer1 = "Winnie Verloc"
notes = "converts present-wife"

