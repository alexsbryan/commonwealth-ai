id = "lookup-megara-obverse-dies"
question = "In Thompson's study of the Agrinion hoard, how many obverse dies are on record for the 101 coins of the Megarian Achaean League series?"
expected_facts = ["Fifty-four obverse dies"]
notes = "nnan73727.md:2267 — 'Fifty-four obverse dies are on record for 101 coins'"

