# 15 K0 lookups, hand-written, all from the nine-work subset (text-subset/). Each fact is
# copied from ONE line; `notes` opens with <work>.md:<line> of text-subset/, and make_bank.py
# refuses a row whose fact is not on that line or occurs in more than one paragraph of the
# subset. Facts avoid bare 1-2 digit numbers: the Rust scorer ignores tokens under 3 chars.
# Re-drawn 2026-09-21 when the corpus was cut to the subset: 6 rows carried over, 9 new.

[[questions]]
id = "lookup-agrinion-acquired"
question = "When did the American Numismatic Society finally acquire the coins of the Agrinion hoard?"
expected_facts = ["summer of 1962"]
notes = "nnan73727.md:29 — 'the coins themselves were not acquired until the summer of 1962'"

