[bank]
name = "ontology-proof-dev-v1"
corpus = "spike-fineprint-census"
description = "K1 lists and K0 lookups over Reddit, Spotify, LinkedIn, gold from each service's own policy text (make_bank.py). DEVELOPMENT services: reported as their own row, never pooled with held-out."

[[questions]]
id = "list-reddit-collects"
category = "unattested"
question = "According to Reddit's privacy policy, what categories of personal data does Reddit collect?"
expected_facts = ["Account Information", "Public Content You Submit", "Non-Public Content You Submit", "Actions You Take", "Transactional Information", "Logs Data", "Usage Information", "Information Collected From Cookies and Similar Technologies", "Location Information", "Public Information Related to You", "Inferred Information", "Linked Services", "Information Collected From Integrations", "Reddit Ads Users", "Reddit Pro Users", "Reddit Program Participants and Potential Participants", "Embedded Content", "Audience Measurement"]
notes = "data_type; spikes/fineprint-data/ota-pga-versions/Reddit/Privacy Policy.md lines 48-48; gold/Reddit-collects.json"

[[questions]]
id = "list-reddit-shares"
category = "unattested"
question = "According to Reddit's privacy policy, with whom does Reddit share personal data?"
expected_facts = ["With your consent", "With linked services", "With our service providers", "To comply with the law", "In an emergency", "With our affiliates", "Aggregated or de-identified information"]
notes = "recipient; spikes/fineprint-data/ota-pga-versions/Reddit/Privacy Policy.md lines 109-116; gold/Reddit-shares.json"

[[questions]]
id = "list-spotify-collects"
