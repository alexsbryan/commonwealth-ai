[package]
name = "sovereign-cli-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cmnwlth's CLI verbs: mesh, ring, job, media, meshapp, run, publish."

[dependencies]
clap = { workspace = true }
sovereign-contracts = { workspace = true }
# The server shell `ring show` serves through (phase-b pb-shell), and the
# per-user unit writer `svrn mesh up`'s cw-rails boot unit goes through
# (rails_unit.rs, pb-mesh-exit-transport).
host-kit = { workspace = true, features = ["shell", "service"] }
sovereign-time = { workspace = true }
commonwealth-media = { workspace = true }
oicp-types = { workspace = true }
mesh-join-vocab = { workspace = true }
mesh-reach = { workspace = true, features = ["guest"] }
commonwealth-discovery = { path = "../commonwealth-discovery" }
# The client half of the daemon's HTTP surface: `ServingHost` decides "is a
# daemon answering", `TurnClient` speaks `/v1/mesh/*` (create/join). Added
# when the last in-process daemon constructions left this crate.
# `bundled-backend`: `svrn mesh up` brings cw-rails up through
# `ServingHost::bringing_up` (rails_up.rs, pb-rails-untether). The feature
# gates code only, so it moves no dependency edge.
sovereign-turn-client = { workspace = true, features = ["bundled-backend"] }
sovereign-cli-base = { workspace = true, features = ["rail-client"] }
commonwealth-core = { path = "../commonwealth-core" }
# `kv-export` (fp-87): the legacy SQLite stores' migration reads through
# commonwealth-state's own backend — the one schema decider, in this package.
commonwealth-state = { path = "../commonwealth-state", features = ["sqlite"] }
commonwealth-rail = { workspace = true }
commonwealth-work = { workspace = true, features = ["process"] }
commonwealth-transport = { path = "../commonwealth-transport" }
# `svrn mesh up`'s identity handover writes the daemon's key, node id and
# meshes through cw-rails' own store writers (identity_handover.rs,
# pb-mesh-exit-transport): one decider for cw-rails' disk format.
commonwealth-rails = { workspace = true }
bytes = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# `svrn mesh up` reports the rings handover's warn on stderr (rails_up.rs).
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
uuid = { workspace = true }
dirs = "5"
sha2 = { workspace = true }
tar = "0.4"
zstd = "0.13"
which = "7"
hostname = { workspace = true }
hex = "0.4"
workspace-hack = { version = "0.1", path = "../../../shared/crates/workspace-hack" }
libc = "0.2"
rqrr = { version = "=0.11.0", default-features = false }
serde_json = { workspace = true }
toml_edit = { workspace = true }
sovereign-pods = { path = "../sovereign-pods" }
# `mesh pod` (mesh_pod/provider.rs): the owner key and the vastai error type.
ed25519-dalek = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rand = "0.9"
fast_qr = { version = "=0.14.0", default-features = false, features = ["svg"] }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# identity_handover's tests found meshes the way cw-rails' own tests do.
commonwealth-discovery = { path = "../commonwealth-discovery" }

[lints]
workspace = true
