# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "oicp-conformance"
description = "A self-contained conformance tester for OICP v0.4/v0.5 hosts. Points at a --host URL and checks its manifest, inference, constraint, embed, knowledge, ingest, evidence and auth surfaces against the spec — the exact minimal dependency budget (oicp-types + serde/reqwest/tokio/sha2) a third party can lift to certify their own implementation."
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "oicp-conformance"
path = "src/main.rs"

# The dependency budget IS the point: only the wire types + serde/HTTP/async,
# plus sha2, because v0.5's evidence checks recompute a text's name and a
# library digest from the bytes served. No clap (args are hand-rolled), no
# jsonschema crate (probe schemas are hand-checked). A conforming third-party
# host can copy this crate wholesale.
[dependencies]
oicp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../shared/crates/workspace-hack" }

# The host fakes each check is watched red against (v0.5 §6). Test-only: the
# lifted binary never links them. The lawful fake aligns with the reference
# aligner, so the fixture's planted word is found the way a host finds it.
[dev-dependencies]
axum = { workspace = true }
quote-align = { workspace = true }

[lints]
workspace = true
