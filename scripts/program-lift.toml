# SPDX-License-Identifier: AGPL-3.0-or-later
#
# The lifts `scripts/program-lift.sh` can run, one [lift.<id>] per program
# (phase-b-2: each program's "runs alone" proof is its RUN smoke, and it is
# DATA here, never a per-row process harness). A later row adds its program's
# smoke as a `[lift.<id>.run]` table; it does not write a script.
#
# Per lift:
#   package  the [[package]] in quality/ARCH_LAYERS.toml whose rule judges the
#            closure. The forbidden set is that map's package rule plus its
#            [[forbid]] rows, read at run time; nothing here restates it.
#   seeds    the member crates the closure is walked from. Absent = every crate
#            the package declares. Each must be a member of `package`.
#   build    `cargo build` args; absent = `-p <seed>` for each seed.
#   test     `cargo test` args; absent = `-p <seed>` for each seed.
#   binary   the built artifact the RUN step starts, relative to the target dir.
#   carry    { ENV_VAR = "<repo-relative dir>" }: data the program ships, copied
#            into the sandbox and named by ENV_VAR for the build, tests and RUN.
#   tree     { ENV_VAR = "<sandbox-relative dir>" }: names a directory of the
#            lifted sandbox itself, for tests that read the source tree.
#   run      the RUN smoke: `inputs`, `steps`, `finally` and `pass`. With no
#            `run`, a closure that builds and tests is never-ran, not passed.
#
# Step vocabulary (scripts/lib/program_lift.py `STEPS` is the interpreter).
# Every string takes ${VAR}; SANDBOX, TARGET and BIN are always set.
#   input    var from `env`, else `path` read from GET `get`, else `value`, else
#            `default`; `strip` drops a suffix; `abstain` if empty (omit
#            `abstain` and an empty value is allowed)
#   require  `value` must match regex `match`, else `abstain` or `fail`
#   unexpired  the `param`=<unix secs> query parameter of `value` is in the future
#   ports    a free loopback port for each name in `vars`
#   write    `text` to `path`
#   spawn    start `argv` in the background as `id`; `log` under the sandbox
#   exec     run `argv`; rc 0 continues, rc 3 abstains, any other rc is `fail`
#            (or `abstain` when `on_error = "abstain"`); `expect = "fail"`
#            inverts it, for a control that must fail on the bare host
#   exists   `path` exists, else `fail`
#   poll     GET `url` each second up to `timeout` until `path` yields a value;
#            stores it in `var` and the document as `doc`; `alive` names a spawn
#            that must stay up. On timeout, `second` reads another route: empty
#            abstains, a hit fails. Without `second` a timeout is `fail`.
#   select   `path` over a stored `doc` into `var`; `all` + `all_var` keep the
#            unfiltered list for the message; empty abstains
#   get      one GET; `var` = `path` of the body, `status_var` = the HTTP status.
#            The body is kept on a refusal (never `curl -f`); `fail` on no answer
#            or, with `path`, on a non-2xx or an empty value
#   call     one POST of `json` to `url`; `var` = `path` of the body. `fail` on
#            no answer, a non-2xx or an empty value (BODY keeps the answer).
#            Without `path` it only records: `status_var` = the HTTP status,
#            and only no answer fails, for a refusal the smoke then requires
#   count    lines of `file` matching `pattern` into `var`; below `min` fails
#   post     (finally only) POST `json` to `url` when every var in `needs` is
#            set; its outcome is reported beside the verdict and never changes it
#   remove   (finally only) delete `paths`, unless --keep
#
# Path syntax for `path`: dotted keys, each optionally filtered as
# `key[field=value]` or `key[field!=value]`; lists fan out; the first value wins.

# ── svrn — the knowledge server ─────────────────────────────────────────────
[lift.svrn]
package = "svrn"
build = ["-p", "sovereign-daemon", "--bin", "sovereign-daemon", "--features", "treesitter"]
binary = "debug/sovereign-daemon"

[lift.svrn.run]
# svrn ALONE dials a configured serve (pb-stock-binary; phase-b-29 Q2): it
# brings nothing up, so this smoke starts serve itself, on a free port it
# names to the daemon through SOVEREIGN_SERVE_PORT
# (sovereign_contracts::venue::serve_port, the one reader both programs call),
# so a host whose own serve holds 9748 still judges the default-base loopback
# mode rather than borrowing that serve. The serve binary comes from
# SOVEREIGN_SERVE_BIN or `--set SERVE_BIN=<path>`, and the smoke abstains
# without one. The stock install (serve hosted in svrn's process) is proven
# by sovereign-stock's own e2e, not here. The mock engine loads no weights,
# and cw-rails is pointed at a closed port. FIM needs an edit model, so it is
# not asserted here. `--features treesitter`: the daemon's bin requires it.
pass = "booted on a temp root, dialed the serve the smoke started (status 'serving: ${SERVING}'), answered a chat turn ('${CHAT}') and a rerank (score ${SCORE}) through it and a next-edit request (engine ${NES}), with cw-rails pointed at a closed port; with serve stopped, a turn reported the absence (HTTP ${ABSENT})"
steps = [
  { do = "input", var = "SERVE_BIN", env = "SOVEREIGN_SERVE_BIN", value = "${SERVE_BIN}", abstain = "svrn dials serve: set SOVEREIGN_SERVE_BIN, or --set SERVE_BIN=<path>, to a sovereign-serve binary" },
  { do = "exists", path = "${SERVE_BIN}", fail = "no sovereign-serve at ${SERVE_BIN}" },
  { do = "ports", vars = ["PORT", "INTERNAL_PORT", "DEAD_RAILS_PORT", "SERVE_PORT"] },
  { do = "write", path = "${SANDBOX}/root/config.toml", text = "[engine]\nkind = \"mock\"\n\n[models]\nprimary = \"${SANDBOX}/root/mock.gguf\"\nembed = \"${SANDBOX}/root/mock-embed.gguf\"\n\n[daemon]\nclient_port = ${PORT}\ninternal_port = ${INTERNAL_PORT}\nrails_base = \"http://127.0.0.1:${DEAD_RAILS_PORT}\"\n\n[data]\ndir = \"${SANDBOX}/root\"\n" },
  { do = "spawn", id = "serve", argv = ["${SERVE_BIN}", "--data-dir", "${SANDBOX}/root", "--listen", "127.0.0.1:${SERVE_PORT}"], log = "serve.log", env = { RUST_LOG = "info" } },
  { do = "poll", url = "http://127.0.0.1:${SERVE_PORT}/health", path = "state", var = "HEALTH", timeout = 60, alive = "serve", fail = "the smoke's serve never answered /health within 60s (see ${SANDBOX}/serve.log)" },
  { do = "spawn", id = "daemon", argv = ["${BIN}", "run", "--config", "${SANDBOX}/root/config.toml"], log = "daemon.log", env = { HOME = "${SANDBOX}/home", SVRNMESH_DATA_DIR = "${SANDBOX}/svrnmesh", CW_RAILS_DIR = "${SANDBOX}/rails", SOVEREIGN_SERVE_PORT = "${SERVE_PORT}", RUST_LOG = "info" } },
  { do = "poll", url = "http://127.0.0.1:${PORT}/status", path = "serving", var = "SERVING", timeout = 120, alive = "daemon", fail = "the daemon never reported where it serves from within 120s (see ${SANDBOX}/daemon.log)" },
  { do = "require", value = "${SERVING}", match = "^serve$", fail = "the daemon booted without dialing serve: serving = ${SERVING}" },
  { do = "call", url = "http://127.0.0.1:${PORT}/v1/chat/completions", json = { messages = [{ role = "user", content = "hello" }] }, path = "choices.message.content", var = "CHAT", fail = "POST /v1/chat/completions gave no answer through serve: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${PORT}/v1/rerank", json = { query = "hello", documents = ["hello world", "other"] }, path = "results[index=0].relevance_score", var = "SCORE", fail = "POST /v1/rerank gave no score through serve: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${PORT}/v1/edit_predictions", json = { history = [], text = "let x = 1;\nlet y = x + 1;\n", cursor = 10, path = "a.rs" }, path = "engine", var = "NES", fail = "POST /v1/edit_predictions gave no answer: ${BODY}" },
  # serve stops mid-run: a turn must report the absence, never an empty answer.
  { do = "exec", argv = ["sh", "-c", "pkill -f '[s]overeign-serve --data-dir ${SANDBOX}/root'"], log = "serve-kill.log", fail = "could not stop serve mid-run (see ${SANDBOX}/serve-kill.log)" },
  { do = "call", url = "http://127.0.0.1:${PORT}/v1/chat/completions", json = { messages = [{ role = "user", content = "hello" }] }, status_var = "ABSENT", fail = "the daemon did not answer once serve stopped" },
  { do = "require", value = "${ABSENT}", match = "^503$", fail = "with serve stopped a chat turn answered HTTP ${ABSENT}, not a named absence: ${BODY}" },
  { do = "require", value = "${BODY}", match = "\"error\"", fail = "with serve stopped the 503 named no error: ${BODY}" },
]

# ── ingest — the recipe pipeline and its one CLI, svrn-ingest ───────────────
[lift.ingest]
package = "ingest"
build = ["-p", "sovereign-pipeline", "--bin", "svrn-ingest"]
binary = "debug/svrn-ingest"
# The recipes tree corpus-engine's tests read (tests/main/source_tree.rs
# `recipes_root`: "a third party who lifts this package carries these tests").
carry = { CORPUS_ENGINE_RECIPES_DIR = "sovereign-recipes" }
# The source tree corpus-engine's source gates read (recipe_schema, the
# enrichment_type census): the lift's own crates/, which holds each closure
# crate by name as the repo root does. Never the monorepo (program_lift.py).
tree = { SOVEREIGN_WORKSPACE_ROOT = "crates" }

[lift.ingest.run]
# The "ingest in CI" developer (pb-ingest): an index builds with ONLY an
# embeddings endpoint. The stub serves `/v1/models` and `/v1/embeddings` and
# nothing else; its one model id is an embedder, so a chat-model resolution
# refuses, and any chat request it receives fails the smoke. No daemon, no
# chat model, no cw-rails.
pass = "indexed a fixture folder as a non-empty '${CORPUS}' against an embeddings-only stub with --no-enrich, wrote ${META}, and the stub was asked ${EMBED_CALLS} embedding call(s) and no chat"
steps = [
  { do = "input", var = "CORPUS", value = "lift-ingest-fixture" },
  { do = "ports", vars = ["EMBED_PORT"] },
  { do = "write", path = "${SANDBOX}/stub.py", text = "import http.server, json, sys, zlib\nclass H(http.server.BaseHTTPRequestHandler):\n    def send(self, code, doc):\n        b = json.dumps(doc).encode()\n        self.send_response(code)\n        self.send_header('content-type', 'application/json')\n        self.send_header('content-length', str(len(b)))\n        self.end_headers()\n        self.wfile.write(b)\n    def do_GET(self):\n        if self.path == '/v1/models':\n            self.send(200, {'data': [{'id': 'Qwen3-Embedding-0.6B'}]})\n        else:\n            self.send(404, {'error': 'embeddings-only stub'})\n    def do_POST(self):\n        body = json.loads(self.rfile.read(int(self.headers.get('content-length', 0))) or b'{}')\n        if self.path != '/v1/embeddings':\n            self.send(404, {'error': 'embeddings-only stub'})\n            return\n        inputs = body.get('input', [])\n        inputs = [inputs] if isinstance(inputs, str) else inputs\n        vec = lambda s: [((zlib.crc32(s.encode()) >> k) & 255) / 255.0 + 0.01 for k in range(0, 32, 4)]\n        self.send(200, {'data': [{'index': i, 'embedding': vec(s)} for i, s in enumerate(inputs)]})\nhttp.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), H).serve_forever()\n" },
  { do = "write", path = "${SANDBOX}/fixture/harbour.txt", text = "The harbour master keeps two ledgers and admits to one.\n\nThe second is not secret, only inconvenient to explain.\n" },
  { do = "write", path = "${SANDBOX}/fixture/tides.txt", text = "Both ledgers agree about the tides and about nothing else.\n\nThe tide tables are printed each spring and pinned by the door.\n" },
  { do = "write", path = "${SANDBOX}/recipe.toml", text = "[corpus]\nid = \"${CORPUS}\"\nname = \"lift fixture\"\ndescription = \"program-lift ingest smoke\"\nlicense = \"CC0\"\nmesh_sharing = false\n\n[acquire]\ntype = \"local_file\"\npath = \"${SANDBOX}/fixture\"\n\n[extract]\ntype = \"plaintext\"\n\n[chunk]\ntype = \"paragraph\"\nmax_chars = 512\noverlap_chars = 64\n\n[index]\nfts = true\nvector = true\n" },
  { do = "spawn", id = "embed", argv = ["python3", "-u", "${SANDBOX}/stub.py", "${EMBED_PORT}"], log = "embed.log" },
  { do = "poll", url = "http://127.0.0.1:${EMBED_PORT}/v1/models", path = "data.id", var = "EMBED_MODEL", timeout = 30, alive = "embed", fail = "the embeddings stub never answered (see ${SANDBOX}/embed.log)" },
  { do = "exec", argv = ["${BIN}", "ingest", "${SANDBOX}/recipe.toml", "--base-url", "http://127.0.0.1:${EMBED_PORT}/v1", "--no-enrich", "--data-dir", "${SANDBOX}/data"], log = "ingest.log", env = { HOME = "${SANDBOX}/home", SOVEREIGN_DATA_DIR = "${SANDBOX}/data", SVRNMESH_DATA_DIR = "${SANDBOX}/svrnmesh" }, fail = "svrn-ingest did not index the fixture against an embeddings-only endpoint (see ${SANDBOX}/ingest.log)" },
  { do = "count", file = "${SANDBOX}/ingest.log", pattern = "^indexed: [1-9][0-9]* chunks", var = "INDEXED", min = 1, fail = "svrn-ingest exited 0 without reporting a non-empty index (see ${SANDBOX}/ingest.log)" },
  { do = "input", var = "META", value = "${SANDBOX}/data/indexes/${CORPUS}/_corpus_meta.json" },
  { do = "exists", path = "${META}", fail = "svrn-ingest reported an index and wrote no ${META}" },
  { do = "exists", path = "${SANDBOX}/data/indexes/${CORPUS}/chunks.lance", fail = "svrn-ingest reported an index and wrote no chunks.lance" },
  { do = "count", file = "${SANDBOX}/embed.log", pattern = "POST /v1/embeddings", var = "EMBED_CALLS", min = 1, fail = "the index exists but the stub embedder was never asked" },
  { do = "exec", argv = ["sh", "-c", "! grep -q 'chat/completions' '${SANDBOX}/embed.log'"], log = "no-chat.log", fail = "svrn-ingest sent a chat request under --no-enrich (see ${SANDBOX}/embed.log)" },
]

# ── cmnwlth — the endpoint router with a roster: the cw-rails daemon ────────
# The closure is cw-rails', not the whole package's: sovereign-mesh still
# reaches corpus-engine (boundary-gate, 2026-09-27; sovereign-grants left for
# [svrn] at pb-meshapp-grants), and
# the binary a developer takes is this one (FIVE_PROGRAMS §2, "lifted").
[lift.cmnwlth]
package = "cmnwlth"
seeds = ["commonwealth-rails"]
build = ["-p", "commonwealth-rails", "--bin", "cw-rails"]
test = ["-p", "commonwealth-rails"]
binary = "debug/cw-rails"

[lift.cmnwlth.run]
# The run grows its OWN two-node mesh inside the sandbox (phase-b
# pb-membership): a founder cw-rails that declares a fixture media origin,
# and the lifted joiner. Nothing touches the operator's mesh, so nothing has
# to be retired from its roster afterwards. Both run --local-only: no n0
# relay, no n0 DNS, the two reach each other on direct addresses. It is two
# processes, so it is not the mesh of one that could pass by having nobody to
# disagree with.
pass = "founded '${MESH}', joined it by the founder's invite, converged a roster with '${PEER}', reached '${OFFERER}' as an online library, a GET through ${URL} answered HTTP ${THROUGH}, an act the joiner signed reached the founder through cw-rails' round, relay candidates answered (${RELAY_KIND} recommended); after a rotate the old invite answered ${OLD_JOIN} and the new one admitted a third node to '${JOINED}', which created, switched back to '${SWITCHED}', forgot '${FORGOT}' and left '${LEFT}'; after the joiner was killed the founder rebuilt its endpoint (${REBUILDS} rebuild(s)); the founder, upgraded with [work_offer], kept a '${OFFERED}' offer on the fold and its own donor completed a donated unit inside ${IMAGE} (${VERDICT}, stdout '${RAN}')"
steps = [
  { do = "input", var = "MESH", value = "cw-rails-lift-mesh" },
  # The donor's boundary (pb-work-donor): the image a donated process:v1 unit
  # runs inside. The operator's declaration, as in [lift.cw-work].
  { do = "input", var = "IMAGE", env = "CW_WORK_IMAGE", default = "localhost/sovereign-work:latest" },
  { do = "ports", vars = ["ORIGIN_PORT", "FOUNDER_PORT", "LISTEN_PORT"] },
  # A tiny file, so a GET through the bridge has something real to fetch.
  { do = "write", path = "${SANDBOX}/library/index.html", text = "program-lift origin\n" },
  # The fixture origin authenticates NOTHING, which is why the holder's
  # admission decision has to be right.
  { do = "spawn", id = "origin", argv = ["python3", "-m", "http.server", "${ORIGIN_PORT}", "--bind", "127.0.0.1", "--directory", "${SANDBOX}/library"], log = "origin.log" },
  { do = "write", path = "${SANDBOX}/founder/rails.toml", text = "name = \"cw-rails-founder\"\nlisten = ${FOUNDER_PORT}\n\n[media]\norigin = \"127.0.0.1:${ORIGIN_PORT}\"\n\n[work_offer]\nkinds = [\"process:v1\"]\nmax_concurrent = 1\nyield_to_foreground = false\naccept = \"anyone\"\nimage = \"${IMAGE}\"\n" },
  { do = "exec", argv = ["${BIN}", "found", "${MESH}", "--data-dir", "${SANDBOX}/founder"], log = "found.log", fail = "the lifted binary could not found a mesh (see ${SANDBOX}/found.log)" },
  # The founder's watchdog polls every second with a one-second grace and no
  # rebuild cooldown, so the self-heal step at the end is seconds past the loss.
  { do = "spawn", id = "founder", argv = ["${BIN}", "run", "--local-only", "--data-dir", "${SANDBOX}/founder"], log = "founder.log", env = { RUST_LOG = "info,commonwealth_rails::ring_sync=debug", SOVEREIGN_MESH_WATCHDOG_POLL_SECS = "1", SOVEREIGN_MESH_WATCHDOG_GRACE_SECS = "1", SOVEREIGN_MESH_WATCHDOG_COOLDOWN_SECS = "0" } },
  # The invite is served once the founder's endpoint has an address to name.
  { do = "poll", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/mesh/status", path = "join_link", var = "INVITE", doc = "founder", timeout = 60, alive = "founder", fail = "the founder served no join_link within 60s (see ${SANDBOX}/founder.log)" },
  { do = "require", value = "${INVITE}", match = "iroh=", fail = "the founder's invite carries no iroh dial string: ${INVITE}" },
  { do = "write", path = "${SANDBOX}/data/rails.toml", text = "name = \"cw-rails-lift\"\nlisten = ${LISTEN_PORT}\n" },
  { do = "exec", argv = ["${BIN}", "join", "${INVITE}", "--data-dir", "${SANDBOX}/data", "--name", "cw-rails-lift"], log = "join.log", fail = "the lifted daemon was not admitted by the founder (see ${SANDBOX}/join.log and founder.log)" },
  { do = "exists", path = "${SANDBOX}/data/mesh.json", fail = "join reported success and wrote no mesh.json" },
  { do = "spawn", id = "daemon", argv = ["${BIN}", "run", "--local-only", "--data-dir", "${SANDBOX}/data"], log = "daemon.log", env = { RUST_LOG = "info,commonwealth_rails::ring_sync=debug" } },
  # The roster comes from the join snapshot, so it appears at once.
  { do = "poll", url = "http://127.0.0.1:${LISTEN_PORT}/v1/mesh/status", path = "members[is_self!=true].name", var = "PEER", doc = "status", timeout = 60, alive = "daemon", fail = "no member other than this one appeared on /v1/mesh/status within 60s (see ${SANDBOX}/daemon.log)" },
  # The catalogue rides a GOSSIP round, seconds after the roster (measured
  # 2026-09-11: a one-shot read here lost that race). The founder's own route
  # is the second reading.
  { do = "poll", url = "http://127.0.0.1:${LISTEN_PORT}/v1/mesh/media", path = "offering.peer", var = "ANY_OFFER", doc = "media", timeout = 60, alive = "daemon", second = { url = "http://127.0.0.1:${FOUNDER_PORT}/v1/mesh/media", path = "offering.peer", abstain = "the founder offers no media origin on its own route either, so the fixture never registered and there was no library to reach (see ${SANDBOX}/founder.log)", fail = "GET /v1/mesh/media listed no offering member within 60s while the founder lists '${SECOND}': the catalogue rides gossiped capabilities.origins and nothing arrived (see ${SANDBOX}/daemon.log)" } },
  { do = "select", doc = "media", path = "offering[status!=offline].peer", var = "OFFERER", all = "offering.peer", all_var = "OFFERERS", fail = "every member offering a library is offline (${OFFERERS}), yet the founder is running in this sandbox" },
  { do = "get", url = "http://127.0.0.1:${LISTEN_PORT}/v1/mesh/media?peer=${OFFERER}", path = "url", var = "URL", fail = "GET /v1/mesh/media?peer=${OFFERER} returned no URL: ${BODY}" },
  { do = "require", value = "${URL}", match = "^http://127\\.0\\.0\\.1:", fail = "the reach URL is not loopback (${URL}): the media class was routed off iroh, which is a hole rather than a fallback" },
  # Any status is the pass. What fails is no answer at all.
  { do = "get", url = "${URL}/", status_var = "THROUGH", timeout = 30, fail = "a GET through ${URL} got no HTTP answer: the bridge accepted and the far end never sent a byte" },
  # The ring round (pb-rails-parity): an act the joiner signs reaches the
  # founder through cw-rails' own round and its /internal/ring/sync route,
  # woken by the append door's nudge. Signed on the JOINER because it holds
  # the founder's dial string from the invite; the founder learns the
  # joiner's addresses by gossip, and a nudged round that runs before that
  # finds no address and waits for the interval (watched 2026-09-28: the
  # nudged round at +0s counted the joiner unreachable, the interval round at
  # +60s pushed the act). 90s covers that interval round too.
  { do = "call", url = "http://127.0.0.1:${LISTEN_PORT}/v1/rail/append?namespace=parity-proof", json = { op = "record", payload = { note = "parity" } }, path = "id", var = "APPENDED", fail = "the joiner's append door signed nothing: ${BODY}" },
  { do = "poll", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/rail/log?namespace=parity-proof", path = "ops[id=${APPENDED}].id", var = "REPLICATED", doc = "ring", timeout = 90, alive = "founder", fail = "the joiner's act ${APPENDED} never reached the founder's journal within 90s: cw-rails' round did not carry it (see ${SANDBOX}/daemon.log, founder.log)" },
  # Relay candidates answer from cw-rails (pb-rails-parity).
  { do = "get", url = "http://127.0.0.1:${LISTEN_PORT}/v1/mesh/relay-candidates", path = "candidates[recommended=true].kind", var = "RELAY_KIND", fail = "GET /v1/mesh/relay-candidates named no recommended candidate: ${BODY}" },
  # The membership doors (pb-rails-membership), each through cw-rails alone:
  # the founder rotates, and a third node, running solo, is refused on the
  # old invite, admitted on the new one, then creates, switches, forgets and
  # leaves, all on its running endpoint.
  { do = "call", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/mesh/rotate", json = {}, path = "join_link", var = "ROTATED", fail = "POST /v1/mesh/rotate on the founder minted no invite: ${BODY}" },
  { do = "ports", vars = ["LATE_PORT"] },
  { do = "write", path = "${SANDBOX}/late/rails.toml", text = "name = \"cw-rails-late\"\nlisten = ${LATE_PORT}\n" },
  { do = "spawn", id = "late", argv = ["${BIN}", "run", "--local-only", "--data-dir", "${SANDBOX}/late"], log = "late.log", env = { RUST_LOG = "info" } },
  { do = "poll", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/status", path = "self.node_id", var = "LATE_ID", doc = "late", timeout = 60, alive = "late", fail = "the third node's status never answered (see ${SANDBOX}/late.log)" },
  { do = "call", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/join", json = { key_or_url = "${INVITE}" }, status_var = "OLD_JOIN", fail = "POST /v1/mesh/join got no answer (see ${SANDBOX}/late.log)" },
  { do = "require", value = "${OLD_JOIN}", match = "^403$", fail = "the rotated-out invite answered HTTP ${OLD_JOIN}, not a refusal: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/join/preview", json = { link = "${ROTATED}" }, path = "mesh_name", var = "PREVIEWED", fail = "POST /v1/mesh/join/preview read no mesh from the rotated invite: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/join", json = { key_or_url = "${ROTATED}" }, path = "mesh_name", var = "JOINED", timeout = 60, fail = "the rotated invite did not admit the third node: ${BODY} (see ${SANDBOX}/late.log, founder.log)" },
  { do = "call", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/create", json = { name = "cw-rails-lift-second" }, path = "join_link", var = "SECOND_INVITE", fail = "POST /v1/mesh/create founded nothing: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/switch", json = { mesh = "${MESH}" }, path = "switched_to", var = "SWITCHED", fail = "POST /v1/mesh/switch did not resume '${MESH}': ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/forget", json = { mesh = "cw-rails-lift-second" }, path = "forgot", var = "FORGOT", fail = "POST /v1/mesh/forget did not drop the parked mesh: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${LATE_PORT}/v1/mesh/leave", json = {}, path = "left", var = "LEFT", fail = "POST /v1/mesh/leave did not leave: ${BODY}" },
  # The endpoint's self-heal (pb-rails-parity): the joiner is lost, and the
  # founder's watchdog, having held a path to it, rebuilds its endpoint. iroh
  # drops a lost peer's path record after its remote actor idles for 60s
  # (iroh 1.0.2 remote_state.rs:73), which is when the loss is visible; 150s
  # covers that and the escalation after it.
  { do = "kill", id = "daemon", fail = "the joiner was not running, so there was no peer to lose" },
  { do = "poll", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/mesh/status", path = "self_reachability.last_recovery[action=endpoint_rebuild].ok", var = "HEALED", timeout = 150, alive = "founder", fail = "the founder's watchdog did not attempt an endpoint rebuild within 150s of losing the joiner (see ${SANDBOX}/founder.log)" },
  { do = "require", value = "${HEALED}", match = "^True$", fail = "the founder's endpoint rebuild failed (ok=${HEALED}; see ${SANDBOX}/founder.log)" },
  # The count is published on the watchdog's next poll, healthy again once the
  # fresh endpoint re-armed the peer-path term.
  { do = "poll", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/mesh/status", path = "self_reachability[degraded=false].rebuilds", var = "REBUILDS", timeout = 10, alive = "founder", fail = "the founder stayed degraded after its rebuild (see ${SANDBOX}/founder.log)" },
  { do = "require", value = "${REBUILDS}", match = "^[1-9]", fail = "the founder recovered with ${REBUILDS} rebuilds on record" },
  # The one donor drive (pb-work-donor): cw-rails runs it. The founder's
  # rails.toml carries [work_offer] as `svrn mesh up`'s handover writes it, so
  # its offer is on the fold, and a process:v1 unit sealed and submitted
  # through its own doors completes inside the image. A host with no runtime
  # or no image has no boundary to run it in: could-not-judge, owed on the
  # host with podman.
  { do = "exec", argv = ["sh", "-c", "podman image exists ${IMAGE}"], log = "podman.log", on_error = "abstain", fail = "no container runtime or no image ${IMAGE} on this host, so a donated process:v1 unit has no boundary to run in; run this lift on the host with podman (see ${SANDBOX}/podman.log)" },
  { do = "get", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/rail/actor", path = "actor", var = "FOUNDER_ACTOR", fail = "the founder named no signing actor: ${BODY}" },
  { do = "poll", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/work/projection", path = "offers.${FOUNDER_ACTOR}.kinds", var = "OFFERED", doc = "work", timeout = 30, alive = "founder", fail = "the founder published no offer from its [work_offer] within 30s (see ${SANDBOX}/founder.log)" },
  { do = "require", value = "${OFFERED}", match = "^process:v1$", fail = "the founder's offer names ${OFFERED}, not process:v1" },
  { do = "call", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/work/seal", json = { kind = "process:v1", units = [{ payload = { argv = ["uname", "-s"], timeout_secs = 120, result = "stdout" }, requirements = {} }] }, path = "units.unit_hash", var = "UNIT", fail = "the seal door sealed nothing: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/work/submit", json = { kind = "process:v1", units = [{ kind = "process:v1", unit_hash = "${UNIT}", payload = { argv = ["uname", "-s"], timeout_secs = 120, result = "stdout" }, requirements = {} }] }, path = "seq", var = "SUBMITTED", fail = "the submit door appended nothing: ${BODY}" },
  { do = "poll", url = "http://127.0.0.1:${FOUNDER_PORT}/v1/rail/log?namespace=work", path = "ops.payload.outcome.verdict", var = "VERDICT", doc = "worklog", timeout = 120, alive = "founder", fail = "the donated unit ${UNIT} reached no report within 120s: cw-rails' donor did not take or finish it (see ${SANDBOX}/founder.log)" },
  { do = "require", value = "${VERDICT}", match = "^passed$", fail = "the donated unit reported ${VERDICT}, not a passed verdict (see ${SANDBOX}/founder.log)" },
  { do = "select", doc = "worklog", path = "ops.payload.result.stdout", var = "RAN", abstain = "the completion carried no stdout" },
]

# ── cw-work — cmnwlth's work peer, a package-only donor ─────────────────────
[lift.cw-work]
package = "cmnwlth"
seeds = ["commonwealth-work"]
build = ["-p", "commonwealth-work", "--features", "process", "--example", "work_peer"]
test = ["--workspace", "--features", "commonwealth-work/process"]
binary = "debug/examples/work_peer"

[lift.cw-work.run]
pass = "ran three heterogeneous units on a ${ACTS}-act rail and refused both escapes, outside the monorepo, inside `${IMAGE}`"
steps = [
  # The image is the DONOR OPERATOR's declaration. With none the peer publishes
  # no process:v1 offer and exits 3, which is the honest "no boundary here".
  { do = "input", var = "IMAGE", env = "CW_WORK_IMAGE" },
  # The rail is a SIBLING of the workdir, never a child: the workdir is the one
  # thing the boundary mounts, and a rail holds the donor's identity.
  { do = "input", var = "RAIL", value = "${SANDBOX}.rail" },
  # The boundary is --network=none with one mount, so the submitter ships the
  # package cache in the workdir (measured 2026-09-10: `no matching package
  # named blake3` without it).
  { do = "exec", argv = ["cargo", "vendor", "--offline", "--versioned-dirs", "vendor"], cwd = "${SANDBOX}", log = "vendor.log", on_error = "abstain", fail = "the closure's dependencies could not be vendored into the workdir (see ${SANDBOX}/vendor.log)" },
  { do = "write", path = "${SANDBOX}/.cargo/config.toml", text = "[source.crates-io]\nreplace-with = \"vendored-sources\"\n\n[source.vendored-sources]\ndirectory = \"vendor\"\n" },
  { do = "exec", argv = ["${BIN}", "--root", "${RAIL}", "--workdir", "${SANDBOX}", "--label", "cw-work-lift peer", "--image", "${IMAGE}", "--", "env", "CARGO_HOME=.cargo-home", "cargo", "test", "--offline", "-q", "-p", "commonwealth-rail-core"], cwd = "${SANDBOX}", log = "peer.log", fail = "the peer did not complete its three units (see ${SANDBOX}/peer.log)" },
  # The ledger's own watched red (DEFAULTS_LEDGER process:v1): a unit that
  # tries to open a socket or see the rail, and is refused.
  { do = "write", path = "${SANDBOX}/probe.sh", text = "if ! command -v python3 >/dev/null 2>&1; then echo 'PROBE BROKEN: no python3'; exit 1; fi\nif python3 -c 'import socket; socket.setdefaulttimeout(4); socket.create_connection((\"1.1.1.1\", 53))' 2>/dev/null; then echo 'ESCAPE: network'; exit 1; fi\nif [ -e \"${RAIL}\" ]; then echo 'ESCAPE: the donor rail is visible'; exit 1; fi\necho ok\n" },
  # The control comes first: with no boundary the probe MUST fail, or its
  # green means nothing.
  { do = "exec", argv = ["sh", "probe.sh"], cwd = "${SANDBOX}", log = "probe-control.log", expect = "fail", abstain = "the escape probe PASSED on the bare host, so it cannot detect an escape" },
  # A second rail: a peer handed the first finds every unit complete.
  { do = "exec", argv = ["${BIN}", "--root", "${RAIL}.probe", "--workdir", "${SANDBOX}", "--label", "cw-work-lift probe", "--image", "${IMAGE}", "--", "sh", "probe.sh"], cwd = "${SANDBOX}", log = "probe.log", fail = "a donated unit ESCAPED the boundary; reproduce with: cd ${SANDBOX} && sh probe.sh, then the same argv through the peer" },
  # A submit, an offer and three lease/report pairs is 8: the guard on the
  # peer's own decider.
  { do = "count", file = "${RAIL}/rings/work/ring_oplog.jsonl", pattern = "\"op\"", var = "ACTS", min = 8, fail = "the peer reported green with only ${ACTS} act(s) on the work rail" },
]
finally = [
  { do = "remove", paths = ["${RAIL}", "${RAIL}.probe"] },
]

# ── serve — the model server (sovereign-serve). Until pb-serve-package declares
# its own package (phase-b-20), it is judged under cmnwlth's rule, where the
# serving crates sit today.
[lift.serve]
package = "cmnwlth"
seeds = ["sovereign-serve"]
build = ["-p", "sovereign-serve", "--bin", "sovereign-serve"]
test = ["-p", "sovereign-serve", "-p", "sovereign-compute", "-p", "sovereign-serving-host"]
binary = "debug/sovereign-serve"

[lift.serve.run]
# The mock engine (`[engine] kind = "mock"`, sovereign_compute::mock) loads no
# weights, so the smoke proves the routes and the wiring, not a model. cw-rails
# is ABSENT by construction: `[daemon] rails_base` names a port nothing listens
# on, so a /v1/* answer that dialled cw-rails (this host runs one on :9747)
# would fail here rather than pass by borrowing the operator's.
pass = "served '${MODEL}' on /v1/models from its own manifest, advertised '${ADVERTISED}' on /oicp/v1/capabilities, answered a chat turn ('${CHAT}'), an embedding and a rerank (score ${SCORE}) on a temp root, with cw-rails pointed at a closed port"
steps = [
  { do = "ports", vars = ["PORT", "DEAD_RAILS_PORT"] },
  { do = "write", path = "${SANDBOX}/root/config.toml", text = "[engine]\nkind = \"mock\"\n\n[models]\nprimary = \"${SANDBOX}/root/mock.gguf\"\nembed = \"${SANDBOX}/root/mock-embed.gguf\"\n\n[daemon]\nrails_base = \"http://127.0.0.1:${DEAD_RAILS_PORT}\"\n" },
  { do = "spawn", id = "serve", argv = ["${BIN}", "--data-dir", "${SANDBOX}/root", "--listen", "127.0.0.1:${PORT}"], log = "serve.log", env = { RUST_LOG = "info" } },
  { do = "poll", url = "http://127.0.0.1:${PORT}/health", path = "state", var = "HEALTH", timeout = 60, alive = "serve", fail = "serve never answered /health within 60s (see ${SANDBOX}/serve.log)" },
  { do = "get", url = "http://127.0.0.1:${PORT}/v1/models", path = "data[owned_by=local].id", var = "MODEL", fail = "GET /v1/models listed no model this process holds: ${BODY}" },
  { do = "get", url = "http://127.0.0.1:${PORT}/oicp/v1/capabilities", path = "models.id", var = "ADVERTISED", fail = "GET /oicp/v1/capabilities advertised no model: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${PORT}/v1/chat/completions", json = { model = "${MODEL}", messages = [{ role = "user", content = "hello" }] }, path = "choices.message.content", var = "CHAT", fail = "POST /v1/chat/completions gave no answer: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${PORT}/v1/embeddings", json = { model = "${MODEL}", input = ["hello"] }, path = "data.index", var = "EMBEDDED", fail = "POST /v1/embeddings gave no vector: ${BODY}" },
  { do = "call", url = "http://127.0.0.1:${PORT}/v1/rerank", json = { model = "${MODEL}", query = "hello", documents = ["hello world", "other"] }, path = "results[index=0].relevance_score", var = "SCORE", fail = "POST /v1/rerank gave no score: ${BODY}" },
]

# ── code — the LSP for agents ───────────────────────────────────────────────
[lift.code]
package = "code"
build = ["-p", "sovereign-cli-dev", "--bin", "sovereign-cli-dev"]
binary = "debug/sovereign-cli-dev"

# ── bench — the evaluator ───────────────────────────────────────────────────
[lift.bench]
package = "bench"
build = ["-p", "sovereign-eval", "--bin", "sovereign-eval"]
binary = "debug/sovereign-eval"
# The banks and seed data sovereign-eval's tests read (bench_root.rs: "a
# lifted crate must set it itself").
carry = { SOVEREIGN_BENCH_ROOT = "sovereign/bench" }

[lift.bench.run]
# The evaluator's own verbs: `score` asks its LLM judge (sovereign-eval
# judge.rs) over `/v1/chat/completions`. The forced-choice judge is
# sovereign-cli-llm's (live_runner.rs), not this binary's. Two stub OpenAI
# servers stand in for the judge model: one answers a report, so `score`
# grades a fixture run; one answers prose twice, so `score` must report it
# could not judge and write no report, never a score on an unreadable answer.
pass = "graded a fixture run through a stub judge (judge_report total 10, ${OK_CALLS} judge call), and against a judge that answered prose it asked ${BAD_CALLS} times, wrote no judge_report and exited naming the unparseable answer"
steps = [
  { do = "ports", vars = ["OK_PORT", "BAD_PORT"] },
  { do = "write", path = "${SANDBOX}/stub.py", text = "import http.server, json, sys\nport, mode = int(sys.argv[1]), sys.argv[2]\naxes = {k: {'score': 2, 'justification': 'fixture'} for k in ['spec_fidelity', 'api_congruence', 'internal_coherence', 'idiomatic_rust', 'decision_discipline']}\ncontent = json.dumps({'axes': axes, 'total': 10, 'notes_for_reviewer': 'lift fixture'}) if mode == 'ok' else 'The code looks fine to me overall.'\nclass H(http.server.BaseHTTPRequestHandler):\n    def send(self, doc):\n        b = json.dumps(doc).encode()\n        self.send_response(200)\n        self.send_header('content-type', 'application/json')\n        self.send_header('content-length', str(len(b)))\n        self.end_headers()\n        self.wfile.write(b)\n    def do_GET(self):\n        self.send({'state': 'ready'})\n    def do_POST(self):\n        self.rfile.read(int(self.headers.get('content-length', 0)))\n        self.send({'choices': [{'message': {'role': 'assistant', 'content': content}}]})\nhttp.server.HTTPServer(('127.0.0.1', port), H).serve_forever()\n" },
  { do = "write", path = "${SANDBOX}/repo/spec.md", text = "# spec\n\n`add(a, b)` returns the sum of two u32s.\n" },
  { do = "write", path = "${SANDBOX}/repo/Cargo.toml", text = "[package]\nname = \"fixture\"\nversion = \"0.1.0\"\nedition = \"2021\"\n" },
  { do = "write", path = "${SANDBOX}/repo/src/lib.rs", text = "pub fn add(a: u32, b: u32) -> u32 {\n    a + b\n}\n" },
  { do = "write", path = "${SANDBOX}/data/runs/graded/manifest.json", text = '{"schema_version":1,"run":{"run_id":"graded","feature_id":"lift","milestone_id":"m0","driver":"lift","started_at":0,"mode":"lift"},"experiment_repo":{"root":"${SANDBOX}/repo","spec_shas":[]},"models":[],"tool_calls":[],"notes":{"decisions":[],"invariants":[],"uncertainties":[],"attempts":[],"deviations":[],"reflections":[],"redteam_findings":[],"other":[]},"generated_at_unix":0}' },
  { do = "write", path = "${SANDBOX}/data/runs/unreadable/manifest.json", text = '{"schema_version":1,"run":{"run_id":"unreadable","feature_id":"lift","milestone_id":"m0","driver":"lift","started_at":0,"mode":"lift"},"experiment_repo":{"root":"${SANDBOX}/repo","spec_shas":[]},"models":[],"tool_calls":[],"notes":{"decisions":[],"invariants":[],"uncertainties":[],"attempts":[],"deviations":[],"reflections":[],"redteam_findings":[],"other":[]},"generated_at_unix":0}' },
  { do = "spawn", id = "judge-ok", argv = ["python3", "-u", "${SANDBOX}/stub.py", "${OK_PORT}", "ok"], log = "judge-ok.log" },
  { do = "spawn", id = "judge-bad", argv = ["python3", "-u", "${SANDBOX}/stub.py", "${BAD_PORT}", "bad"], log = "judge-bad.log" },
  { do = "poll", url = "http://127.0.0.1:${OK_PORT}/", path = "state", var = "OK_UP", timeout = 30, alive = "judge-ok", fail = "the stub judge never answered (see ${SANDBOX}/judge-ok.log)" },
  { do = "poll", url = "http://127.0.0.1:${BAD_PORT}/", path = "state", var = "BAD_UP", timeout = 30, alive = "judge-bad", fail = "the prose stub judge never answered (see ${SANDBOX}/judge-bad.log)" },
  { do = "exec", argv = ["${BIN}", "--data-dir", "${SANDBOX}/data", "score", "graded", "--experiment-repo", "${SANDBOX}/repo", "--daemon-url", "http://127.0.0.1:${OK_PORT}", "--no-mechanical", "--no-scope", "--no-regression", "--no-grade-tools"], log = "score-graded.log", env = { HOME = "${SANDBOX}/home" }, fail = "`score` did not grade the fixture run through the stub judge (see ${SANDBOX}/score-graded.log)" },
  { do = "count", file = "${SANDBOX}/data/runs/graded/judge_report.json", pattern = "\"total\": 10,", var = "TOTALS", min = 1, fail = "`score` wrote no judge_report.json carrying the stub judge's total 10 (see ${SANDBOX}/data/runs/graded)" },
  { do = "count", file = "${SANDBOX}/judge-ok.log", pattern = "POST /v1/chat/completions", var = "OK_CALLS", min = 1, fail = "the judge report exists but the stub judge was never asked" },
  { do = "exec", argv = ["sh", "-c", "if '${BIN}' --data-dir '${SANDBOX}/data' score unreadable --experiment-repo '${SANDBOX}/repo' --daemon-url 'http://127.0.0.1:${BAD_PORT}' --no-mechanical --no-scope --no-regression --no-grade-tools; then echo 'SCORED an unreadable judge answer'; exit 1; fi; test ! -e '${SANDBOX}/data/runs/unreadable/judge_report.json' || { echo 'a judge_report.json exists for an unreadable answer'; exit 1; }"], log = "score-unreadable.log", env = { HOME = "${SANDBOX}/home" }, fail = "`score` reported a grade from a judge that answered prose (see ${SANDBOX}/score-unreadable.log)" },
  { do = "count", file = "${SANDBOX}/score-unreadable.log", pattern = "unparseable JSON twice", var = "NAMED", min = 1, fail = "`score` failed on the prose judge without naming the unparseable answer (see ${SANDBOX}/score-unreadable.log)" },
  { do = "count", file = "${SANDBOX}/judge-bad.log", pattern = "POST /v1/chat/completions", var = "BAD_CALLS", min = 2, fail = "`score` gave up on the prose judge without its one retry" },
]
