[package]
name = "sovereign-studio"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Headless CLI that authors + tests recipes and runs workflows against any OICP daemon."

[[bin]]
name = "sovereign-studio"
path = "src/main.rs"

# Boundary: this crate links ONLY the studio package + the shared leaves. No
# sovereign-core, no corpus-engine. Enforced by `cargo xtask boundary-gate`.
[dependencies]
sovereign-workflow = { workspace = true }
sovereign-workflow-host = { workspace = true }
sovereign-recipe-author = { workspace = true }
sovereign-tools-base = { workspace = true }
sovereign-contracts = { workspace = true }

async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
