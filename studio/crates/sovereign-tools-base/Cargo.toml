[package]
name = "sovereign-tools-base"
description = "The pure, leaf-dependency workflow tools (shell, web, chunk, section, file/json/csv/zip/vector, MCP client) — the tool set the extractable studio package builds on"
version = "0.1.0"
edition = "2021"
license.workspace = true

# The dependency budget IS the point of this crate: the contract vocabulary
# (Tool, ToolRegistry, StepOutput, Error/Result, SetupConfig, McpServerConfig)
# plus ordinary async/HTTP/serde leaves — no llama.cpp, no mesh. Tools that need
# those (extract, corpus_store/search, atlas_*) stay in `sovereign-tools` and
# are injected via `extra_tools`.
#
# THE BUDGET IS WHOLE AGAIN (sv-surface svt-7, 2026-09-12). It reads "no
# corpus-engine" and it means every crate of that family — the amendment that
# stood here from 2026-08-20 permitting `corpus-engine-sections` is gone with
# the module that needed it.
#
# Not because the amendment's reasoning was wrong: `corpus-engine-sections` IS
# a `regex` + `tracing` leaf and reaching DOWN to it was the right direction.
# What the amendment could not see is that this crate is on
# `[thin_surfaces].may_reach` — the ONE runtime-layer crate a thin client may
# link — so anything it reaches, every thin surface reaches too, by
# reachability rather than by intent. `sovereign-desktop` uses nothing from
# `rag`, and `corpus-engine-sections` was the last `from = "sovereign-desktop"`
# row in quality/ARCH_LAYERS.toml, held open by this edge alone.
#
# Operator call 2026-09-12: MOVE, not allowlist. The `chunk` and `section`
# workflow tools went back to `sovereign-tools`, beside `rag::{ingest, parse}`,
# where the path `sovereign_tools::rag::{chunk, section}` already resolved.
# A client-safe seam holds what a CLIENT needs; these are workflow tools and
# no client runs them.

[dependencies]
sovereign-contracts = { workspace = true }

async-trait = { workspace = true }
# `McpError` (mcp/transport.rs) derives thiserror::Error.
thiserror = { workspace = true }
csv = "1.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
# ~/.svrnmesh resolution for the MCP secret store.
dirs = "5"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
