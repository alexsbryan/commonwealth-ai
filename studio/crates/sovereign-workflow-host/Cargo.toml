[package]
name = "sovereign-workflow-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Daemon-runnable workflow host — assembles the standard tool registry, resolves the workflow catalog, and runs workflows in-process (sovereign-workflow engine + sovereign-tools-base tools + daemon-routed inference over oicp-client). The piece that lets the daemon run a workflow, not just the CLI. Depends only on the studio contract crates so it can be distributed with the authoring package."

[dependencies]
sovereign-contracts = { workspace = true }
sovereign-workflow = { workspace = true }
sovereign-tools-base = { workspace = true }
oicp-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# A fake `/v1` for `daemon_models`' probe tests — the embed resolver's
# verdict is a real HTTP round-trip, so the test serves one.
axum = { workspace = true }

[lints]
workspace = true
