# SPDX-License-Identifier: AGPL-3.0-or-later
# Literary-atlas PHASE 3 (name) as a chained workflow — facet-naming each atlas
# cluster, faithful to the bespoke `enrich` facet-naming loop. The bespoke
# compose_phase3_facet / parse_phase3_facet / render_excerpts / select_top_k_facet
# are reused VERBATIM (via pipeline_compose / pipeline_parse /
# atlas_cluster_excerpts / exemplar_select), and the NamedCluster struct +
# ncl_NNNN ids come from the domain's own assemble_phase_output (via
# pipeline_assemble). Only the model call is lifted to a `model:` step.
#
# Shape — a for_each CHAIN over the clusters, zips stitching parallel collections:
#   clusters → excerpts(map) → zip → exemplars(map) → zip → compose(map)
#            → model(map) → zip-with-clusters → parse+stamp(map) → assemble → write
#
# Run (daemon up; the corpus extract+cluster'd so cache/questions.json +
# cache/atlas-clusters.json exist):
#   sovereign workflow run studio/crates/sovereign-workflow/examples/atlas-name.toml --no-cache
#   # -> out/<corpus>.named-clusters.json  (diff against cache/atlas-named-clusters.json)

[workflow]
name = "atlas-name"

[source]
type = "inline"
items = ["chaos-secret-agent"]

# The corpus's Phase-2 atlas clusters (AtlasCluster[]) — the for_each collection.
[[step]]
id = "clusters"
uses = "tool:atlas_clusters"
params = { corpus = "{item.name}" }

# map: per-cluster excerpts + the joined query_text (reuses render_excerpts over
# the Phase-1 section map — the same excerpts the bespoke name loop renders).
[[step]]
id = "excerpts"
uses = "tool:atlas_cluster_excerpts"
for_each = "clusters"
params = { corpus = "{item.name}", cluster = "{element}" }

# zip: pair each cluster with its rendered excerpts.
[[step]]
id = "ce"
uses = "tool:zip"
params = { a = "{clusters.output}", b = "{excerpts.output}", a_key = "cluster", b_key = "prep" }

# map: facet-filtered exemplar selection — the cluster's facet steers the bank
# (select_top_k_facet), query = the joined excerpts, exactly as the bespoke does.
[[step]]
id = "exemplars"
uses = "tool:exemplar_select"
for_each = "ce"
params = { corpus = "{item.name}", phase = "name", query = "{element.prep.query_text}", facet = "{element.cluster.facet}", k = 5 }

# zip: add the exemplars alongside {cluster, prep}.
[[step]]
id = "cee"
uses = "tool:zip"
params = { a = "{ce.output}", b = "{exemplars.output}", a_key = "base", b_key = "exemplars" }

# map: compose the phase-3 facet-naming prompt (reuses compose_phase3_facet).
[[step]]
id = "prompts"
uses = "tool:pipeline_compose"
for_each = "cee"
params = { pipeline = "literary_atlas", phase = "name", facet = "{element.base.cluster.facet}", input = { cluster = "{element.base.cluster}", excerpts = "{element.base.prep.excerpts}", exemplars = "{element.exemplars}" } }

# map: the model — grammar-constrained to the naming schema, raw text out so the
# bespoke parse_phase3_facet runs over the exact response.
[[step]]
id = "responses"
uses = "model:extended"
for_each = "prompts"
system = "{element.system}"
prompt = "{element.user}"
structured_output = "{element.schema}"
raw_output = true

# zip: re-attach each response to its cluster (recover cluster_id + facet to stamp).
[[step]]
id = "paired"
uses = "tool:zip"
params = { a = "{responses.output}", b = "{clusters.output}", a_key = "response", b_key = "cluster" }

# map: parse each response (reuses parse_phase3_facet) + stamp cluster_id + facet.
# No id stamp — the domain assembler assigns ncl_NNNN over the successes.
[[step]]
id = "atoms"
uses = "tool:pipeline_parse"
for_each = "paired"
stamp = { cluster_id = "{element.cluster.id}", facet = "{element.cluster.facet}" }
params = { pipeline = "literary_atlas", phase = "name", facet = "{element.cluster.facet}", response = "{element.response}" }

# assemble: the canonical Phase3AtlasOutput, built by the DOMAIN's assembler
# (assigns ncl_NNNN + stamps written_at exactly as the runner does).
[[step]]
id = "assembled"
uses = "tool:pipeline_assemble"
params = { pipeline = "literary_atlas", phase = "name", atoms = "{atoms.output}" }

# write: the named-clusters artifact (diff against cache/atlas-named-clusters.json).
[[step]]
id = "write"
uses = "tool:write_json"
params = { path = "out/{item.name}.named-clusters.json", json = "{assembled.output}" }
