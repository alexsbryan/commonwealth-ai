# SPDX-License-Identifier: AGPL-3.0-or-later
# Literary-atlas PHASE 8 (configure) as a chained workflow — detect interpretive
# Configuration atoms over the resolved atlas. A SINGLE-call LLM phase (one
# summary, one prompt, one model call), faithful to the bespoke
# `enrich atlas-configuration`: the LOAD (summarise_atlas) and the WRITE
# (parse_configurations + write_atlas_full merge) are domain I/O leaves
# (atlas_summary / atlas_write_configurations), while compose / model / parse are
# the lifted LLM core (reusing compose_phase8_configuration / parse_phase8_configuration).
#
# Run (daemon up; the corpus resolved so atlas/atoms.json + edges.json exist):
#   sovereign workflow run studio/crates/sovereign-workflow/examples/atlas-configure.toml --no-cache

[workflow]
name = "atlas-configure"

[source]
type = "inline"
items = ["chaos-secret-agent"]

# Summarise the resolved atlas for the Phase-8 prompt (reuses summarise_atlas).
[[step]]
id = "summary"
uses = "tool:atlas_summary"
params = { corpus = "{item.name}" }

# Compose the Phase-8 configuration prompt (reuses compose_phase8_configuration).
# `input` is the bare AtlasSummary (the configure arm deserializes it directly).
[[step]]
id = "prompt"
uses = "tool:pipeline_compose"
params = { pipeline = "literary_atlas", phase = "configure", input = "{summary.output}" }

# The model — grammar-constrained, raw text out for the bespoke parser.
[[step]]
id = "response"
uses = "model:extended"
system = "{prompt.system}"
prompt = "{prompt.user}"
structured_output = "{prompt.schema}"
raw_output = true

# Parse the Phase-8 response into items (reuses parse_phase8_configuration).
[[step]]
id = "items"
uses = "tool:pipeline_parse"
params = { pipeline = "literary_atlas", phase = "configure", response = "{response.output}" }

# Finalize: validate items against the atlas + merge Configuration atoms into
# configurations.json + atoms.json (reuses parse_configurations + write_atlas_full).
[[step]]
id = "write"
uses = "tool:atlas_write_configurations"
params = { corpus = "{item.name}", items = "{items.output}" }
