[package]
name = "oicp-client"
description = "Open Inference Capabilities Protocol (OICP) — pure-HTTP client (OpenAI-compatible + OICP manifest routing)"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The contract vocabulary (InferenceProvider, CompletionRequest/Response,
# Error/Result) and the OICP protocol types. These two are the entire
# non-leaf dependency budget — the point of the crate.
sovereign-contracts = { workspace = true }

async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tracing = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }

[dev-dependencies]
# `daemon_models`' tests stand up a fake daemon (`/v1/models`,
# `/v1/embeddings`) on a loopback port.
axum = { workspace = true }
# `openai_passthrough`'s forwarding test reads the trait's methods from the
# contracts crate, which reads its own source (`double`, test-fixtures).
sovereign-contracts = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
