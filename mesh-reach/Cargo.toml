[package]
name = "mesh-reach"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "How a program reaches a mesh peer — TrafficClass, PeerContact, PeerEndpoint and the PeerTransport port, the generic peer fan-out, and RailsTransport, which resolves a peer's origin through cw-rails' reach door. Layer 0; no fs, no store."

# Minted 2026-09-27 (phase-b pb-rails-reach, decision phase-b-30 Group 3; leaf
# count 22 → 23). svrn and serve dial peers through cw-rails and must name the
# same dial vocabulary cmnwlth speaks, and neither may link
# commonwealth-transport (a cross-package edge). The workspace budget is
# kernel-types (for `NodeId`/`NodePubkey`) and nothing else; third-party deps
# come as the contents need them, each behind the feature that needs it
# (phase-b-33 item 6). A workspace dependency beyond kernel-types means this is
# a mechanism, not vocabulary, and the leaf is wrong.

[features]
# The generic peer fan-out — tokio-shaped, so its own feature.
fanout = ["dep:tokio", "dep:serde"]
# The reach door's wire (`door`), which cw-rails serves.
wire = ["dep:serde"]
# `RailsTransport`: `PeerTransport::endpoints` over cw-rails' reach door.
rails = ["wire", "dep:reqwest"]

[dependencies]
kernel-types = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }

[lints]
workspace = true
