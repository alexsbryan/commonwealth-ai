[package]
name = "corpus-engine-watchers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Background reactive layer: lint/test/project-index watchers + their SQLite result stores + the coordinator. Carved out of corpus-engine for blast-radius control (R4 Step 1)."

# Step 1 of the corpus-engine decomposition (see
# corpus-engine/DECOMPOSITION.md). These watchers spawn `cargo`
# subprocesses and persist their results to SQLite; the `lint_status`
# / `test_status` tools read those stores. Pre-carve-out they lived in
# corpus-engine, so editing a watcher rebuilt ~18 crates. corpus-engine
# has NO internal consumer of any watcher symbol, so the arrow is
# one-way (this crate depends on corpus-engine-notes + -yield, never
# the reverse) and no `From<Error> for corpus_engine::Error` bridge is
# needed.
#
# The old `treesitter` feature gate on these modules was vestigial —
# none of them touch tree-sitter/SCIP (that's the CodeWatcher, which
# stays in corpus-engine). This crate compiles unconditionally.

[dependencies]
# ProjectDocsStore (project_index_watcher re-indexes the docs corpus).
corpus-engine-notes = { workspace = true }
# YieldHook — the shared cooperative-yield trait the lint/test watchers
# poll during subprocess runs. Same trait identity the daemon installs
# on the CorpusEngine.
corpus-engine-yield = { workspace = true }

# The per-project state machine (`projects.rs`) derives serde and reads the
# `rebrand::projects_json()` path SSOT. `sovereign-contracts` is a shared
# `[[package_leaf]]`, so this reach stays inside the code-intel closure.
serde = { workspace = true }
sovereign-contracts = { workspace = true }
# Registry timestamps in `projects.rs` and rebuild timestamps in
# `reindexer.rs`.
chrono = { workspace = true }

# ── `reindexer` only (behind the `treesitter` feature) ──────────────────────
# SCIP call graph + exporter dispatch. The code-intel package's own member;
# `corpus-engine` deliberately ships no re-export shim for it (ARCH §8.3).
corpus-engine-scip = { workspace = true, optional = true }
# The deterministic fact base (`facts` + `facts_store`) the overlay merge
# writes to. `treesitter` supplies the extraction loops, `stores` the SQLite
# `FactStore` — the same two features `corpus-engine` forwarded before this
# module moved here.
code-facts = { workspace = true, optional = true }
# Holds the Arc<ArcSwap<ScipGraph>> in the Reindexer.
arc-swap = { workspace = true, optional = true }
# .gitignore-aware walk in the reindexer's freshness scan.
ignore = { version = "0.4", optional = true }

# SQLite-backed result stores (bundled — no system dep).
rusqlite = { version = "0.35", features = ["bundled"] }
# Filesystem change notifications for the watchers.
notify = "8"

tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
# The SCIP rebuild pipeline (`reindexer`). The gate `sovereign-mesh` carried
# on the module before domains REVIEW-build-mesh-workbench-deferred moved it
# here, preserved so the tree-sitter grammars and the SCIP graph do not enter
# the closure of every `corpus-engine-watchers` consumer. `projects` is
# unconditional.
treesitter = [
    "dep:corpus-engine-scip",
    "dep:code-facts",
    "code-facts/treesitter",
    "code-facts/stores",
    "dep:arc-swap",
    "dep:ignore",
]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
