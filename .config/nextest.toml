# cargo-nextest config. Picked up automatically when nextest runs
# from this repo root. Per-machine overrides go in
# ~/.config/nextest.toml.
#
# Profiles:
# - default : interactive dev runs (you typing `cargo nextest run`)
# - ci      : full regression gates (longer slow-timeout, retries on)
# - quick   : tight-loop iteration (fail-fast on, short slow-timeout)

[profile.default]
# Don't bail on first failure — surface every red test in one run.
fail-fast = false

# Mark a test "slow" after 60s and kill after 3 slow strikes (180s wall).
# A handful of integration tests (mesh discovery, llama-cpp model load)
# legitimately need longer — override per-test via [[profile.default.overrides]]
# below as you find them.
slow-timeout = { period = "60s", terminate-after = 3 }

# Per-test stdout/stderr only printed when the test fails — less noise.
failure-output = "immediate-final"
success-output = "never"

# Status reporter density. "fail" keeps output tight during long runs.
status-level = "fail"
final-status-level = "slow"

[profile.default.junit]
# Drop a junit.xml so CI surfaces individual test names in PR UI.
path = "junit.xml"

# ── CI profile ─────────────────────────────────────────────────────────────
# Triggered by `cargo nextest run --profile ci`.
[profile.ci]
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }
retries = { backoff = "exponential", count = 2, delay = "2s", jitter = true }
failure-output = "immediate-final"
success-output = "never"
status-level = "all"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# ── Quick profile ──────────────────────────────────────────────────────────
# `cargo nextest run --profile quick` — for tight-loop debugging.
[profile.quick]
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 1 }
failure-output = "immediate"
status-level = "pass"

# ── Per-test overrides ─────────────────────────────────────────────────────
# Long-running integration tests that need more headroom. Add entries
# here as you discover legitimately-slow tests; default to fixing the
# test before extending the timeout.
#
# Example:
# [[profile.default.overrides]]
# filter = "test(/mesh::discovery::/)"
# slow-timeout = { period = "180s", terminate-after = 2 }

# THE TRYBUILD SUITES — the compile-fail proofs (`*_reds`). A trybuild suite is
# a SECOND BUILD: trybuild pins CARGO_TARGET_DIR to target/tests/trybuild and
# supplies its own rustflags, so nothing already built in the workspace's
# target/ can be reused, and the project it generates inherits the whole
# [dependencies] table of the crate under test. For corpus-engine that is
# lance, arrow, parquet, lancedb, bundled rusqlite and zstd — ~2.5 GB of
# artifacts compiled before the first fixture is judged.
#
# Measured 2026-08-30 on 4 cores with CARGO_BUILD_JOBS=3 (the CI shape):
# evidence_reds cold 240.9s, warm 2.3s end to end. The default budget is 180s
# (60s x 3 strikes), and on CI the tree is ALWAYS cold — rust-cache prunes
# unrecognized dirs under target/ — so evidence_reds was TERMINATED mid-build
# on every run and reported as a failure. It was never a flake and never a red
# proof: the suite was killed before it could return a verdict.
#
# The two kernel-types suites are the same shape and were merely under the wire
# (80.7s / 154.5s cold in the same run). Covering all three by binary, not just
# the one that happened to cross first, is the point: the cost of this ceiling
# is zero whenever the tree is warm.
[[profile.default.overrides]]
filter = "binary(evidence_reds) + binary(judgement_reds) + binary(answer_reds)"
slow-timeout = { period = "300s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = "binary(evidence_reds) + binary(judgement_reds) + binary(answer_reds)"
slow-timeout = { period = "300s", terminate-after = 4 }
