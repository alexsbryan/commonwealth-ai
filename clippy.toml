# Workspace clippy configuration.
#
# Panic-ratchet (tech-debt PR4): `clippy::unwrap_used` / `clippy::expect_used`
# are enabled per-crate (each gated crate carries `#![warn(...)]` /
# `#![deny(...)]` in its lib.rs) as the panic surface is burned down. A
# panic in a production request handler surfaces as an opaque 500; the
# lints push that code toward `?` / typed errors / graceful fallbacks.
#
# Test code keeps the `unwrap()` / `expect()` idiom — a panic inside a
# test is the correct, loud failure mode, not a launch risk — so the
# lints are suppressed there workspace-wide.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
