# Supply-chain policy (cargo-deny). Landed 2026-07-11 as part of the quality
# program; runs as an ADVISORY lane in ci.yml during its burn-in month.
#
# Lanes and how they gate:
#   licenses / bans / sources — deterministic against Cargo.lock; the ones
#     intended to eventually block merges.
#   advisories — depends on the moving RustSec DB, so a brand-new CVE can
#     turn red with zero repo changes. It runs non-blocking on PRs and in the
#     weekly lane: it should page the owner, never red-X a contributor's
#     unrelated PR.
#
# Iterate locally with `cargo deny check` (metadata-only, no compile).

[graph]
# Resolve with every feature on so optional stacks (postgres, atos, dst,
# iroh-experimental, …) are still policy-checked even though default builds
# skip them.
all-features = true

[licenses]
# The workspace itself is AGPL-3.0-or-later (see [workspace.package]); the
# allow list is "permissive licenses compatible with AGPL" plus AGPL for our
# own crates. The classes this lane exists to catch arriving in the tree:
# SSPL, CDDL/EPL, GPL-incompatible or source-unavailable terms.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MIT-0",
    "0BSD",
    "NCSA",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[advisories]
# v2 semantics: any advisory = error unless ignored. Yanked crates warn —
# a yank alone shouldn't page anyone, the weekly run surfaces it.
yanked = "warn"
ignore = [
    # (empty — add RustSec IDs here with a reason + revisit date)
]

[bans]
# Duplicate-version ENFORCEMENT lives in the xtask lock-gate ratchet (it can
# grandfather today's duplicates; a hard deny here would red-X immediately).
# This lane just makes duplicates visible in the report.
multiple-versions = "warn"
# `foo = "*"` version requirements are what this exists to catch (none today).
# Warn, not deny: cargo-deny counts our internal version-less path deps as
# wildcards too, and allow-wildcard-paths only exempts `publish = false`
# crates — which ours aren't marked as. Flip to deny if the workspace ever
# gains publish=false markers (or starts publishing with real versions).
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# Everything must come from crates.io. The vendored llama-cpp-4 is a
# [patch.crates-io] *path* source, which this lane does not restrict.
unknown-registry = "deny"
unknown-git = "deny"
