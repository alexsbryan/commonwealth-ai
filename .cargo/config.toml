# Workspace-root cargo config. Applies whenever cargo is invoked from this
# repo or any subdirectory.
#
# ---------------------------------------------------------------------------
# Per-triple linker overrides.
#
# macOS: lld (via Homebrew). Falls back gracefully if lld absent — comment
# the line out and Cargo will use the system ld64. If Xcode CLT >= 15 the
# default ld_prime is comparable in speed; lld stays here for the older CLT
# on this machine.
#
# macOS rpath: lld's macOS backend does NOT inject the implicit @loader_path
# rpath that ld64 adds by default. llama-cpp-sys-4 ships libggml-*.dylib
# co-located with the binary in target/<profile>/; without explicit rpath
# args here, `sovereign-cli` crashes at startup with
# `dyld: Library not loaded: @rpath/libggml-base.0.dylib (no LC_RPATH's found)`.
# See `invariant_macos_lld_rpath.md` in project memory. Don't strip these.
#
# Linux: mold (via dnf/apt). Requires clang as the linker driver because
# gcc's -fuse-ld passthrough is finicky across distros.
#
# sccache is intentionally NOT set here as rustc-wrapper — it would break
# on any machine without sccache installed. Set RUSTC_WRAPPER=sccache in
# your shell profile per machine.
# ---------------------------------------------------------------------------

[target.aarch64-apple-darwin]
rustflags = [
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,-rpath,@loader_path",
  "-C", "link-arg=-Wl,-rpath,@executable_path",
]

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-Wl,-rpath,@loader_path",
  "-C", "link-arg=-Wl,-rpath,@executable_path",
]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",
]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=mold",
]

# ---------------------------------------------------------------------------
# macOS deployment target.
#
# llama-cpp-sys-4's bundled ggml (ggml-backend-dl.cpp) uses
# std::filesystem::path, which Apple marks `unavailable: introduced in
# macOS 10.15`. The `cc` crate (used by llama-cpp-sys-4's build script,
# directly and via the `cmake` crate) computes the deployment target as:
#   1. MACOSX_DEPLOYMENT_TARGET env var, else
#   2. the Xcode SDK's DefaultDeploymentTarget  ← 10.13 on Xcode 15.4, else
#   3. arch default (11.0 arm64 / 10.7 x86_64).
# (See cc-1.2.62 src/lib.rs ~line 4171.) With the env var unset, cc fell
# through to the SDK's 10.13 and the C++ compile failed with
#   error: 'path'/'string' is unavailable: introduced in macOS 10.15.
#
# So we pin step 1. `force = true` is LOAD-BEARING: a plain
# `MACOSX_DEPLOYMENT_TARGET = "10.15"` is NOT applied by cargo when the
# variable is already present in the environment (cargo defers unless
# forced), and on the CI runners it was effectively unset/empty so cc kept
# using the SDK default. `force = true` makes cargo set it for every build
# script regardless, so cc's step 1 returns 10.15. Ignored on non-Apple
# targets; arm64's own baseline (11.0) is higher so 10.15 is harmless there.
# NB this is a COMPILE-time floor — a rustflags link-arg cannot fix it.
# `cargo xtask <gate>` from anywhere in the workspace. It lived in
# corpus-engine/.cargo/config.toml, so it resolved only from inside that crate.
[alias]
xtask = "run -p xtask --"

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "10.15", force = true }
# The bench tree, absolute, resolved from this file's directory. Lets
# sovereign-eval's bank tests name their data without climbing out of the
# crate root, which boundary-gate rule 3c forbids for a liftable package.
SOVEREIGN_BENCH_ROOT = { value = "bench/lanes", relative = true }
# The CLI contract, absolute: sovereign-cli-shared's `manifest_path` reads it
# at compile time instead of climbing out of its crate (pb-distribution-svrn-lift).
SOVEREIGN_CLI_CONTRACT = { value = "svrn/docs/cli-contract.toml", relative = true }
# The monorepo source tree, absolute, so corpus-engine's workspace-wide gates
# can name sibling-crate sources without climbing out of the crate root.
SOVEREIGN_WORKSPACE_ROOT = { value = ".", relative = true }
# The canonical recipes tree, read at runtime by the recipe gates
# (corpus-engine tests/main/source_tree.rs, sovereign-pipeline shipped_recipes).
CORPUS_ENGINE_RECIPES_DIR = { value = "ingest/crates/sovereign-recipes", relative = true }
