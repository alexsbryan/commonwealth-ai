# Workspace-root cargo config. Applies whenever cargo is invoked
# from `/home/alexbryan/dev/commonwealth-ai/` or any subdirectory.
#
# Linker-search-path override for llama.cpp .so resolution.
#
# Some Linux toolboxes ship a stale `libllama.so` / `libggml*.so` /
# `libmtmd.so` in /usr/lib64 (often older than what llama-cpp-sys-4
# bundles). With those present, the linker picks them up via
# `-L /usr/lib64` (emitted as a search path by other sys crates)
# BEFORE the freshly-built bundled .so's under
# `target/llama-cmake-cache/*/lib64`, and the build fails with
# `undefined symbol: common_speculative_*` (the bundled tree has
# the 3-arg `common_speculative_begin`; the stale one has the older
# 2-arg version).
#
# Operator-installed fix: drop bundled .so's into /usr/local/lib64
# and arrange ldconfig to search it FIRST (so the dynamic loader
# also finds the right versions at runtime). The rustflags below
# tells rustc to add /usr/local/lib64 to the link-time search path
# before any build-script-emitted ones — cargo prepends RUSTFLAGS-
# supplied -L args, so the bundled-matching .so's there win over
# /usr/lib64. Empty effect on systems where /usr/local/lib64 is
# absent — the path is just skipped.
#
# See `feedback_system_libllama_masks_bundled.md` in the project
# memory for the full story + the one-time `cp + ldconfig` recipe.
[build]
rustflags = ["-L", "native=/usr/local/lib64"]
