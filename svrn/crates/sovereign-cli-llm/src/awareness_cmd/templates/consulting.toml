# Consulting scenario template — solo consultant managing a portfolio
# of clients across one month. Stress-tests the entity-extraction +
# canonicalization + suggestion pipeline:
#
#   * Cross-batch alias drift: short-form ("Mike", "Sarah", "Raj") vs
#     long-form ("Mike Torres", "Sarah Chen", "Raj Patel") emitted
#     across many conversations the model batches separately.
#   * Possessive prefixes: chunks contain phrases like "Acme's
#     procurement", "Helios's HIPAA review" — tests that the model
#     emits canonical initiative names, not prefixed variants.
#   * Sub-tasks vs initiatives: chunks reference tactics like
#     "parallel migration path", "sandbox env", "phase 2 rollout" —
#     tests that the model doesn't elevate these to initiatives.
#   * Distractors: chunks musing about sabbaticals, ergonomic chairs,
#     etc. — tests the "active effort vs casual reflection" rule.
#   * Person without affiliation: a referrer (Marcus Reid) appears
#     across multiple conversations with no employer.
#   * Single-name organizations: "Meridian" never appears with a
#     suffix — tests the org definition.
#
# Day offsets are negative integers counted from today. day_offset =
# -29 means 29 days ago. Run with --days 30 to keep the spread
# realistic.

[meta]
name = "consulting"
description = "Solo consultant, one month — multi-client portfolio with cross-batch aliases, sub-task discipline, and distractor topics"
days = 30

