# Records by identifier (OICP v0.6 §2.16): which CSL variable this host looks
# up, with which resolver, and what a reply may add to a record. Read by
# `records_by_identifier::ResolverTable`. Every key is required; an unknown
# key, a reply shape or a normalisation outside its closed set fails the
# crate's tests and the lookup, never a default. A lookup leaves this host
# only for an install whose request said `allow_lookups: true`.

# The CSL variables a resolver's reply may add to a record, where the
# recipe declared none. Everything else a reply carries (Crossref's
# reference list, license, indexing dates; Open Library's subjects and
# covers) is not a citation field and stays out, so a record on every
# progress reply is a catalogue entry, not a mirror of the registry.
# `abstract` is left out on the same ground: it is the text's, not its
# citation's.
keep = [
    "type", "title", "title-short", "container-title", "container-title-short",
    "collection-title", "collection-number", "author", "editor", "translator",
    "issued", "original-date", "publisher", "publisher-place", "volume",
    "issue", "page", "number", "number-of-pages", "edition", "chapter-number",
    "DOI", "ISBN", "ISSN", "URL", "language", "genre", "medium", "version",
    "event-title", "event-place",
]

# Distinct identifiers asked at once during one install's lookups.
concurrency = 4

# CSL 1.0.2's shapes (§2.16: `csl` is CSL-JSON as CSL 1.0.2 defines it).
# A reply's field is made CSL's on the way in: a name keeps only CSL's name
# fields and a date only CSL's date fields; any other variable is one string
# or number, so a list (Crossref's `ISSN`, print first) is read at its first
# item, and what is still neither is left out. A reply's `type` is read
# through its resolver's `types`, and one outside `types` here is left out.
# Platform row PB1b: Crossref's `transform` reply kept as sent (`type`
# journal-article, `ISSN` a list, names with `affiliation`, `role` and
# `sequence`) was a record pandoc 3.7.0.2 refused.
[csl]
types = [
    "article", "article-journal", "article-magazine", "article-newspaper",
    "bill", "book", "broadcast", "chapter", "classic", "collection",
    "dataset", "document", "entry", "entry-dictionary", "entry-encyclopedia",
    "event", "figure", "graphic", "hearing", "interview", "legal_case",
    "legislation", "manuscript", "map", "motion_picture", "musical_score",
    "pamphlet", "paper-conference", "patent", "performance", "periodical",
    "personal_communication", "post", "post-weblog", "regulation", "report",
    "review", "review-book", "software", "song", "speech", "standard",
    "thesis", "treaty", "webpage",
]
names = ["author", "editor", "translator"]
name_fields = [
    "family", "given", "dropping-particle", "non-dropping-particle",
    "suffix", "comma-suffix", "static-ordering", "literal", "parse-names",
]
dates = ["issued", "original-date"]
date_fields = ["date-parts", "season", "circa", "literal", "raw"]

# One row per CSL variable this host has a resolver for. `url` names the
# identifier's place as `{value}`, the declared value normalised
# (`normalize`: `doi` drops a `https://doi.org/` or `doi:` prefix, `isbn`
# drops hyphens and spaces) and percent-encoded. `reply` is the shape the
# resolver answers in, from the closed set `csl` (a CSL-JSON object) |
# `open_library_books` (Open Library's Books API, `jscmd=data`). `types`
# reads the resolver's own item types as CSL's; a type it does not name is
# kept only when it is CSL's.

[[resolver]]
variable = "DOI"
name = "crossref"
normalize = "doi"
url = "https://api.crossref.org/works/{value}/transform/application/vnd.citationstyles.csl+json"
reply = "csl"

# Crossref's types (api.crossref.org/types) that are not CSL's; `book`,
# `dataset`, `report` and `standard` are both.
[resolver.types]
journal-article = "article-journal"
book-chapter = "chapter"
book-section = "chapter"
book-part = "chapter"
book-track = "chapter"
proceedings-article = "paper-conference"
posted-content = "article"
dissertation = "thesis"
monograph = "book"
edited-book = "book"
reference-book = "book"
book-set = "book"
book-series = "book"
reference-entry = "entry"
report-series = "report"
journal = "periodical"
journal-issue = "periodical"
journal-volume = "periodical"
peer-review = "review"
component = "document"

[[resolver]]
variable = "ISBN"
name = "open_library"
normalize = "isbn"
url = "https://openlibrary.org/api/books?bibkeys=ISBN:{value}&format=json&jscmd=data"
reply = "open_library_books"
# Its reader writes CSL's `book` itself.
types = {}
