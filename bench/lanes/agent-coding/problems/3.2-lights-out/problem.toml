[meta]
id = "3.2-lights-out"
title = "Light's Out — minimum-press solve over GF(2)"
category = "CodeTest"
tier = "Scaffolded"
version = "v0"
notes = """
Light's Out on an n×n grid. Pressing a cell toggles it and its 4
orthogonal neighbors; goal is all lights off. The naive 2^(n^2)
brute force is infeasible past n=5; the canonical solution models
the problem as a linear system over GF(2) and solves with Gaussian
elimination — O(n^6), instant at n=20.

Tier=Scaffolded: harness pre-installs Cargo.toml + src/lib.rs stub.
Agent's job is the algorithm only. Project-scaffolding fluency is
measured by a separate Tier=FromScratch problem.

Scoring is meaningful on all three dimensions: correctness lands
cleanly via the held-out test grids; approach (judge) discriminates
GF(2) vs brute force vs heuristic; efficiency (hybrid) lifts the
auto floor when the implementation is also concise and uses
appropriate types.
"""

[prompt]
file = "prompt.md"

[witness]
kind = "Hybrid"
language = "Rust"
fixture_subdir = "fixtures"
scaffold_subdir = "scaffold"
verify_cmd = "cargo test --quiet --test integration"
# Bucketing for pass_fraction → 0..=3.
score_buckets = [
  [0.0,  0.25,  0],
  [0.25, 0.6,   1],
  [0.6,  0.85,  2],
  [0.85, 1.001, 3],
]

[budget]
# Output-token cap. Generous on the first pass — narrower caps land
# in PR 2 once we observe real pi spend on this problem.
token_cap = 16000
wall_seconds_cap = 900

[scoring.dim_a]
name = "Correctness"
mode = "AutoTestPassFraction"

[scoring.dim_b]
name = "Algorithmic insight"
mode = "JudgeRubric"
rubric_id = "dim_b"

[scoring.dim_c]
name = "Code quality and efficiency"
mode = "HybridAutoFloor"
rubric_id = "dim_c"
