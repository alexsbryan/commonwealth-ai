[meta]
id = "h.1-run-length-encoding"
title = "Run-length encoding — encode/decode (HOLDOUT)"
category = "CodeTest"
tier = "Scaffolded"
version = "v0"
notes = """
HOLDOUT problem (generalization protocol, 2026-07-07): derived from
the Exercism canonical run-length-encoding exercise. Holdout
receipts are READ-ONLY — no harness change may cite this problem's
receipts as motivation. Mirrors the 1.x/2.x single-function class in
a fresh domain.
"""

[prompt]
file = "prompt.md"

[witness]
kind = "Hybrid"
language = "Python"
fixture_subdir = "fixtures"
scaffold_subdir = "scaffold"
verify_cmd = "python3 -m pytest -q tests/test_integration.py 2>&1"
score_buckets = [
  [0.0,  0.25,  0],
  [0.25, 0.6,   1],
  [0.6,  0.85,  2],
  [0.85, 1.001, 3],
]

[budget]
token_cap = 8000
wall_seconds_cap = 900

[scoring.dim_a]
name = "Correctness"
mode = "AutoTestPassFraction"

[scoring.dim_b]
name = "Algorithmic clarity"
mode = "JudgeRubric"
rubric_id = "dim_b"

[scoring.dim_c]
name = "Code quality and efficiency"
mode = "HybridAutoFloor"
rubric_id = "dim_c"
