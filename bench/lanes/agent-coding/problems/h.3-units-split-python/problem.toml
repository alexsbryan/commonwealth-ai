[meta]
id = "h.3-units-split-python"
title = "Units — split a working module (HOLDOUT)"
category = "CodeTest"
tier = "Scaffolded"
version = "v0"
notes = """
HOLDOUT problem (generalization protocol, 2026-07-07): structural
refactor with a gradient ladder, fresh domain (unit conversion).
Holdout receipts are READ-ONLY. Mirrors the 3.3 refactor class.
"""

[prompt]
file = "prompt.md"

[witness]
kind = "AutoTestPass"
language = "Python"
fixture_subdir = "fixtures"
scaffold_subdir = "scaffold"
verify_cmd = "python3 -m pytest -q tests/test_integration.py 2>&1"
score_buckets = [
  [0.0,   0.5,   0],
  [0.5,   0.85,  1],
  [0.85,  0.999, 2],
  [0.999, 1.001, 3],
]

[budget]
token_cap = 24000
wall_seconds_cap = 900

[scoring.dim_a]
name = "Behavior preserved"
mode = "AutoTestPassFraction"

[scoring.dim_b]
name = "Refactor coherence"
mode = "JudgeRubric"
rubric_id = "dim_b"

[scoring.dim_c]
name = "File organization"
mode = "JudgeRubric"
rubric_id = "dim_c"
