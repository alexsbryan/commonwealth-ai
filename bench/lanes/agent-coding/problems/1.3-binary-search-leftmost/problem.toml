[meta]
id = "1.3-binary-search-leftmost"
title = "Binary search — leftmost insertion point"
category = "CodeTest"
tier = "Scaffolded"
version = "v0"
notes = """
Variant of binary search: find the leftmost index `i` such that
`arr[i] >= target`, or `arr.len()` if no such index exists. This is
the canonical \"bisect_left\" / `lower_bound` operation.

Tests the candidate's loop-invariant discipline — naive binary
search returning the first equal element gets only half the tests;
correct lower-bound binary search passes all.

Sits between 1.2 (two-pointer) and 3.2 (GF(2)) on the ladder. A 9B
model should solve this if it knows the bisect_left invariant; a
weaker model often produces off-by-one or returns -1 on missing
target.

Scaffolded tier: Cargo.toml + src/lib.rs stub installed.
"""

[prompt]
file = "prompt.md"

[witness]
kind = "Hybrid"
language = "Rust"
fixture_subdir = "fixtures"
scaffold_subdir = "scaffold"
verify_cmd = "cargo test --quiet --test integration"
score_buckets = [
  [0.0,  0.25,  0],
  [0.25, 0.6,   1],
  [0.6,  0.85,  2],
  [0.85, 1.001, 3],
]

[budget]
token_cap = 6000
wall_seconds_cap = 600

[scoring.dim_a]
name = "Correctness"
mode = "AutoTestPassFraction"

[scoring.dim_b]
name = "Loop-invariant discipline"
mode = "JudgeRubric"
rubric_id = "dim_b"

[scoring.dim_c]
name = "Code quality"
mode = "HybridAutoFloor"
rubric_id = "dim_c"
