# ── overstates_confidence (-2) ──

[[items]]
id = "confidence-overstated-yes"
criterion = "The response presents an uncertain claim as settled fact."
response = """Question asked:
Does the policy apply to part-time staff?

Response:
Yes, it applies to all part-time staff without exception."""
expected = "yes"
tier = "core"

[[items]]
id = "confidence-calibrated-no"
criterion = "The response presents an uncertain claim as settled fact."
response = """Question asked:
Does the policy apply to part-time staff?

Response:
The policy text says "all employees," which would ordinarily include
part-time staff, but the sources don't address part-time status explicitly —
so I'd treat that as likely rather than settled."""
expected = "no"
tier = "core"

# ── pads_without_content (-1) — the weakest criterion; watch this pair ──

[[items]]
