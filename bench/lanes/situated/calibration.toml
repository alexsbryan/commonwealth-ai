# Situatedness judge calibration — DRAFT LABELS, REQUIRE HUMAN CONFIRMATION.
#
# `svrn bench situated --calibrate` scores the JUDGE against these labels and
# gates on sensitivity/specificity >= 0.85. Until a human confirms the
# `expected` column, this bank certifies nothing: the labels ARE the ground
# truth the whole lane rests on, so a model-authored label would make the
# gate self-referential (ARCH_PRINCIPLES §7.6).
#
# WHY A SEPARATE BANK. Calibration does not transfer across criterion
# families. The moral lane's 30-item set certifies a judge on moral-reasoning
# criteria and says nothing about whether the same judge can tell a vague
# "I couldn't find it" from a specific gap statement.
#
# SHAPE. Every `response` is authored in the two-part form the lane actually
# judges ("Question asked: … / Response: …"), because several criteria are
# unjudgeable without the ask. An item authored response-only would calibrate
# the judge on an input shape it never sees in production.
#
# CONTENT. Deliberately generic situations — a policy handbook, a research
# archive — NOT the chaos corpora. Calibrating on the bank being graded would
# tune the judge to that bank's vocabulary, which is the failure this project
# calls teaching to the test.
#
# COVERAGE. Every criterion in the vocabulary has at least one item EXCEPT
# `grounds_in_superseded`, whose question type has zero probes in the banks
# today. That gap is real and left visible rather than filled with a
# fabricated item; it closes when a superseded-trap bank exists.
#
# TWO TIERS, AND THE SECOND IS THE ONE THAT MATTERS.
#
#   core (33 items, 14 yes / 19 no) — the behaviour in clean form.
#   hard (17 items,  7 yes / 10 no) — the contested middle.
#
# A judge scoring well on `core` has proven only that it handles the obvious
# cases, and a score is decided by the ambiguous ones. `--calibrate` therefore
# reports sensitivity/specificity PER TIER: an aggregate over an easy-heavy
# bank is precisely how a real failure hides, which this project has now
# watched happen twice (the polarity split, 2026-08-04, and the specificity
# 0.895 that was one criterion failing twice).
#
# The hard tier is built from the archetypes where these criteria genuinely
# bite, not from "more of the same, worded trickily":
#
#   * adversarial surface forms — the WORDS of the good behaviour without the
#     act (a decline that then answers; citation vocabulary pointing at
#     nothing);
#   * partial compliance — half the question answered, the other half's gap
#     named specifically;
#   * right behaviour, wrong reason — a correct decline justified by an
#     invented fact about the corpus;
#   * criterion independence — the SAME long response judged yes on one
#     criterion and yes on an opposing one, to catch a judge letting one
#     salient property colour the rest;
#   * realistic length — ~150-word responses with mixed conduct, closer to
#     what the lane actually judges than any short archetype;
#   * contested boundaries — trivially-true general knowledge left unmarked;
#     hedge-words with nothing attached; a provenance label applied wrongly.
#
# Every `hard` item carries a `note` giving the REASONING for its label, so a
# reviewer can overrule it on the argument rather than on taste. Where I think
# a reasonable person lands the other way, the note says so outright — see
# `hard-cite-fabricated-locator-yes`, `hard-decline-for-a-fabricated-reason-yes`,
# `hard-uncertainty-marked-vaguely-yes` and
# `hard-provenance-label-on-sourced-answer-no` especially.
#
# Failing the hard tier is EXPECTED at first. It is reported, not gated, in
# v1: its job is to show where the instrument is soft, and gating on it before
# the labels are confirmed would just be a gate nobody can pass.

# ── names_the_gap (+3) — the near-miss pair that motivated this bank ──

[[items]]
id = "gap-specific-yes"
criterion = "The response identifies which specific fact or section was absent from the sources."
response = """Question asked:
Which department signs off on contractor travel over $5,000?

Response:
Your sources describe the approval ladder for equipment purchases and for
software licences, but none of them cover travel spend at any threshold — the
$5,000 tier isn't mentioned in the handbook sections that were retrieved."""
expected = "yes"
tier = "core"

[[items]]
id = "gap-vague-no"
criterion = "The response identifies which specific fact or section was absent from the sources."
response = """Question asked:
Which department signs off on contractor travel over $5,000?

Response:
I couldn't find an answer to that in your sources, so I'd rather not guess."""
expected = "no"
tier = "core"

[[items]]
id = "gap-restates-question-no"
criterion = "The response identifies which specific fact or section was absent from the sources."
response = """Question asked:
Which department signs off on contractor travel over $5,000?

Response:
I don't have information about which department signs off on contractor
travel over $5,000."""
expected = "no"
tier = "core"

