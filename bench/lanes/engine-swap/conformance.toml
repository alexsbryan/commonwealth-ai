predict = "fail:differs"
basis = "unverified"
note = "Embedded rewrites absent additionalProperties to false (llguidance_constraint.rs:188-197). Server, built with llguidance, emits '%json <schema>' with no rewrite (LS common/json-schema-to-grammar.cpp:1234-1236). Differs for every schema that omits additionalProperties."
fix = "oicp-client: apply the same default_additional_properties_false before sending (move it to contracts: one decider)"

[[row]]
id = "decode.json-object"
layer = "decode"
covers = ["structured_output"]
callers = "response_format json_object from external clients (inference_adapter.rs:1018)"
check = "output constrained to a JSON object on both"
judge = [{ kind = "scenario", what = "language parity of {} against {type: object} (llg-parity, milestone 5)" }]
predict = "fail:silent"
basis = "unverified"
note = "Default JsonSchema mode sends {type:object} as a schema; in JsonObject mode llama-server gets json_schema={} and the Qwen3 template path requires a non-empty schema (LS chat.cpp:1199)."

[[row]]
id = "decode.forced-choice"
layer = "decode"
covers = ["structured_output"]
callers = "grounding judge judge.rs:170; atlas select.rs:570, read.rs:155"
