# Engine conformance inventory: embedded engine vs llama-server through the
# remote client. Method, configurations and verdict rules:
# PREREG_CONFORMANCE_20261010.md. Read at 3be34324b; citations are paths at
# that commit (LS = target/llama-server-vanilla/llama.cpp-035e227…/).
#
# Row keys:
#   id        layer.name, stable
#   layer     prompt | decode | compute | projection | cost | host
#   covers    CompletionRequest fields, InferenceProvider methods, or response
#             fields the row exercises (the coverage guard reads this)
#   callers   production callers that reach it
#   check     the exact oracle, in words
#   judge     the same oracle as the checks the judge applies; every one must
#             pass (svrn bench engine-conformance judge; kinds in
#             sovereign-cli-bench/src/bench_cmd/engine_conformance/check.rs)
#   pairs     [reference, target] pairs compared; default embedded against
#             every other target
#   predict   pass | fail:silent | fail:refused | fail:differs
#   basis     read | measured | unverified
#   fix       what would make it pass, and whose it is

# ── prompt ──────────────────────────────────────────────────────────────

[[row]]
id = "prompt.templated-no-thinking"
layer = "prompt"
covers = ["prompt", "system_message", "prompt_shape:Templated", "think_budget", "enable_thinking"]
callers = "grounding judges, router, planner, memory, title, documents: think_budget Some(0) and/or enable_thinking Some(false), ~37 sites"
check = "rendered token ids equal, system + one user turn, no tools"
judge = [{ kind = "prompt-ids" }]
predict = "pass"
basis = "unverified"
note = "Embedded renders through minijinja with enable_thinking=false (prompt_helpers.rs:574-579) then enforce_think_suppression (:353). Remote sends chat_template_kwargs.enable_thinking=false (chat_wire.rs:211). Unverified: minijinja and llama.cpp's jinja agree byte for byte on whitespace."

[[row]]
id = "prompt.templated-thinking-default"
layer = "prompt"
covers = ["think_budget", "enable_thinking"]
callers = "synthesis with InferenceConfig.think_budget 512 and enable_thinking None: synthesis_common.rs:47, knowledge_query.rs:1402, streaming.rs:2916, collaboration.rs:353"
check = "rendered token ids equal"
judge = [{ kind = "prompt-ids" }]
predict = "fail:differs"
basis = "read"
note = "Embedded renders enable_thinking.unwrap_or(false), so thinking is closed in the prompt (prompt_helpers.rs:578). Remote sends no kwarg when think_budget > 0 (chat_wire.rs:210), and llama-server defaults thinking on for a thinking template (LS server-context.cpp:1382)."
fix = "decided 2026-10-10: behaviour-preserving. The client sends enable_thinking=false when the request leaves it None, as the engine renders today; think_budget > 0 has been inert on jinja templates, and whether synthesis should think is a separate, measured change"

[[row]]
id = "prompt.templated-tools"
layer = "prompt"
covers = ["tools", "prompt_shape:Templated"]
callers = "executor.rs:503,1184; recipe_author.rs:242; Hermes-path passthrough (inference_adapter.rs:416)"
check = "rendered token ids equal"
judge = [{ kind = "prompt-ids" }]
predict = "fail:differs"
basis = "read"
note = "Embedded appends the daemon's '# Tools … <tools>' block to the system message (prompt_helpers.rs:476-505). llama-server renders the template's native tool block (LS common/chat.cpp:946)."
fix = "decided 2026-10-10: tool callers move to the Conversation shape and the model's native tool format, as every OpenAI-compatible server serves them; the daemon's Hermes tool block retires. This row then becomes prompt.conversation."

[[row]]
id = "prompt.conversation"
layer = "prompt"
covers = ["prompt_shape:Conversation", "tools", "enable_thinking"]
callers = "serving-host into_conversation (conversation.rs:61-71): external OpenAI clients, the e2e-swe agents"
check = "rendered token ids equal, with and without tools, last message user or tool"
judge = [{ kind = "prompt-ids" }]
predict = "pass"
basis = "unverified"
note = "Both render the model's own template with add_generation_prompt and thinking on by default (chat_template.rs:38-49; LS server-common.cpp:1262). Arm D's 1.02x and 100% tool-call rate agree but do not check bytes."

[[row]]
id = "prompt.conversation-trailing-assistant"
layer = "prompt"
covers = ["prompt_shape:Conversation"]
callers = "external clients that end on an assistant message (passthrough)"
check = "rendered token ids equal"
judge = [{ kind = "prompt-ids" }]
predict = "fail:differs"
basis = "read"
note = "llama-server prefills a trailing assistant message (prefill_assistant, LS server-common.cpp:1272-1278); embedded always appends a fresh generation prompt (chat_template.rs:48). The server is the one doing what the client asked."
fix = "embedded engine, not the client"

[[row]]
id = "prompt.assistant-prefix"
layer = "prompt"
covers = ["assistant_prefix"]
callers = "title.rs:116; gk_rescue.rs:155; knowledge_query.rs:569,841,1454; streaming.rs:363 (refusal retry), :423 (continue truncated synthesis), :2938; longform.rs:384; metalingual.rs:527; sovereign-tdd model.rs:68"
check = "rendered token ids equal, and returned text excludes the prefix on both sides"
judge = [{ kind = "prompt-ids" }]
predict = "fail:silent"
basis = "read"
note = "Remote sends an 'assistant_prefix' key (lib.rs:797) that llama-server copies and never reads (LS server-common.cpp:1386-1391). The model starts fresh; continue-truncated-synthesis restarts instead of continuing. The 2026-10-09 R1b arm went through engine_proxy.py, which translated it (engine_proxy.py:169-172), so that measurement did not see this."
fix = "oicp-client: send the prefix as a trailing assistant message"

[[row]]
id = "prompt.raw-fim"
layer = "prompt"
covers = ["prompt_shape:Raw", "edit_slot_info"]
callers = "fim_adapter.rs:240 (/v1/completions); next-edit serve_dial.rs"
check = "token ids equal: verbatim prompt, no template, no BOS"
judge = [{ kind = "prompt-ids" }]
predict = "fail:refused"
basis = "read"
note = "edit_slot_info() is None on the engine client (lib.rs:1864), so FIM answers 503 (fim_adapter.rs:164-166) before any request is sent."
fix = "oicp-client: route Raw to llama-server /completion with the prompt verbatim and add_special false"

# ── decode ──────────────────────────────────────────────────────────────

[[row]]
id = "decode.sampler-hermes-defaults"
layer = "decode"
covers = ["temperature", "top_k", "top_p", "sampling_mode"]
callers = "every Templated request that leaves any sampler field None; InferenceConfig temperature 0.7 (types/mod.rs:84)"
check = "effective sampler tuple and chain order equal (temp, top_k, top_p, min_p, presence, frequency, DRY, penalty window)"
judge = [{ kind = "sampler", order = false }]
predict = "fail:differs"
basis = "read"
note = "Embedded Hermes chain: DRY → penalties(128) → top_k → min_p → top_p → temp, values from ModelQuirks (sampler.rs:486-579). Server: penalties, DRY, top_n_sigma, top_k, typical, top_p, min_p, xtc, temp, values from GGUF/CLI (LS common.h:260-270)."
fix = "oicp-client: send every parameter explicitly from the same ModelQuirks the engine reads (one decider); chain order is the server's and becomes a named difference"

[[row]]
id = "decode.sampler-conversation"
layer = "decode"
covers = ["temperature", "top_k", "top_p"]
callers = "Conversation-shape turns"
check = "effective sampler tuple and chain order equal"
judge = [{ kind = "sampler" }]
predict = "pass"
basis = "unverified"
note = "Embedded server_sampling.rs mirrors llama-server's defaults (0.8 → GGUF general.sampling.* → request, :28-76); its chain is penalties(64) → top_k → top_p → min_p → temp (:96-113), which omits DRY/typical/xtc, all of them no-ops at their defaults."

[[row]]
id = "decode.greedy-is-argmax"
layer = "decode"
covers = ["temperature"]
callers = "temperature 0.0: grounding judges, router, planner, memory, yes_no, frontdoor"
check = "greedy token sequence equal over 64 tokens on the Templated shape"
judge = [{ kind = "greedy-tokens" }]
predict = "fail:differs"
basis = "read"
note = "At T=0 the embedded Hermes chain still runs DRY (0.8/1.75) and a 128-token penalty window before greedy (sampler.rs:557-573); llama-server is plain argmax. Diverges only where DRY or the penalty fires (repetitive output)."
fix = "decided 2026-10-10: the client sends the whole sampler tuple, DRY and penalties included, from the ModelQuirks the engine reads (one decider). The server's chain order is accepted as a named difference."

[[row]]
id = "decode.sampling-mode"
layer = "decode"
covers = ["sampling_mode"]
callers = "fim_adapter.rs:241 (Code), recipe_author.rs:245 (Instruct), passthrough"
check = "effective sampler tuple equal to the mode's profile"
judge = [{ kind = "sampler", order = false }]
predict = "fail:silent"
basis = "read"
note = "Sent as 'sampling_mode' (lib.rs:794), unknown to llama-server."
fix = "oicp-client: expand the mode to explicit parameters from ModelQuirks"

[[row]]
id = "decode.split-sampler"
layer = "decode"
covers = ["tools"]
callers = "Hermes path with tools: content inside JSON strings at SOVEREIGN_CONTENT_TEMPERATURE 0.0"
check = "per-role temperature applied"
judge = [{ kind = "sampler", order = false }]
predict = "fail:differs"
basis = "read"
note = "Embedded switches temperature inside JSON string content (sampler.rs:536-584). llama-server has one sampler per request."
fix = "decided 2026-10-10: dropped. Its quality effect was never measured; a caller that wants deterministic arguments sets temperature."

[[row]]
id = "decode.max-tokens"
layer = "decode"
covers = ["max_tokens"]
callers = "~115 sites; judges 1-5, synthesis 2048"
check = "completion stops at n with finish length; prompt >= n_ctx errors on both"
judge = [{ kind = "finish" }, { kind = "usage" }]
predict = "pass"
basis = "read"
note = "Embedded clamps to headroom up front (prompt_helpers.rs:184-213); server stops at the context wall. Differ only when n exceeds headroom: finish reason length on both, counts may differ by the clamp."

[[row]]
id = "decode.think-budget-positive"
layer = "decode"
covers = ["think_budget"]
callers = "synthesis think_budget 512 where thinking is on (Conversation, or once prompt.templated-thinking-default is fixed)"
check = "the think block closes at the budget on both sides"
judge = [{ kind = "reasoning-within", slack = 2 }]
predict = "fail:silent"
basis = "read"
note = "Remote sends think_budget and an Anthropic-style 'thinking' object (chat_wire.rs:204-209); llama-server reads neither on chat completions. It honours reasoning_budget_tokens (LS server-common.cpp:1360)."
fix = "oicp-client: send reasoning_budget_tokens"

[[row]]
