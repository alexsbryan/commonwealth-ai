basis = "unverified"
fix = "if it fails: llama-server slot save/restore (/slots/:id?action=save|restore) at the declared boundary, then checkpoint placement upstream"
note = "The engine restores a checkpoint at the declared boundary (prefix_pin.rs:166-193). llama-server ignores the field. On Qwen3.5/3.6 (recurrent layers) it can only restore a context checkpoint at or below the common prefix (LS server-context.cpp:3344-3356), and it places checkpoints near the end of each previous prompt, past the shared prefix, so a judge call would re-evaluate the whole prefix."

[[row]]
id = "cost.concurrent-fast"
layer = "cost"
covers = ["complete", "complete_batch"]
callers = "enrichment and judges at max_tokens <= 512 (FastShort coalescer, engine.rs:816-855)"
check = "aggregate tokens/s, 8 concurrent fast calls, within 10% (the only timed row)"
judge = [{ kind = "throughput", ratio = 0.9 }]
predict = "pass"
basis = "unverified"
note = "llama-server --parallel batches continuously; the default is 4 slots."

[[row]]
id = "cost.resident-bytes"
layer = "cost"
covers = ["resident_slots"]
callers = "admission, status"
check = "resident bytes for the same three models within 5%"
judge = [{ kind = "resident-bytes", ratio = 1.05 }]
predict = "pass"
basis = "unverified"
note = "Router mode runs a process per model; the three models are distinct GGUFs, so no weights were shared to begin with."

[[row]]
id = "cost.admission"
layer = "cost"
covers = ["admission"]
callers = "admission::stamp, streaming.rs:985,1392,2959; call_census.rs:258"
check = "under predicted overload, an admitted call parks and an unadmitted one is shed"
judge = [{ kind = "scenario", what = "an admitted call parks and an unadmitted one is shed under predicted overload" }]
predict = "fail:differs"
basis = "read"
fix = "decided 2026-10-10: admission belongs to the scheduler above the engine (ARCH 12); it sheds from the server's /slots occupancy rather than an engine-internal prediction"
note = "The engine parks admitted calls and sheds the rest past 30 s predicted wait (model_slot.rs:1316-1403). The engine client never sends turn_admission (outbound.rs:359-386), and llama-server queues everything without shedding."

