predict = "pass"
basis = "measured"
note = "Mapped to enable_thinking=false; restored routing to 26/27 on 2026-10-09 (DAEMON_ENGINE_INVENTORY Measured)."

[[row]]
id = "decode.json-schema"
layer = "decode"
covers = ["structured_output"]
callers = "~35 sites: router, planner, memory, pipeline, atom_enum, typed_call, deep_research, enrichment"
