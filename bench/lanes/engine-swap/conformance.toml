judge = [{ kind = "label-probs", tol = 1e-3 }, { kind = "prompt-ids" }]
predict = "pass"
basis = "measured"
note = "70 of 70 calls found the labels, minimum label mass 0.964 (2026-10-09). A label outside the server's top 20 gets 0 where the engine computes it (forced_choice.rs:131-139)."

[[row]]
id = "decode.lark"
