note = "The Hermes path installs the envelope as structured_output (inference_adapter.rs:546); the client then sends response_format beside tools, and the Qwen3 template path lets response_format win over tools (LS chat.cpp:1199-1247), so the server constrains to the envelope schema and parses no tool call. cmd_prefix lives inside that schema as a pattern."

[[row]]
id = "decode.tool-choice-named"
layer = "decode"
