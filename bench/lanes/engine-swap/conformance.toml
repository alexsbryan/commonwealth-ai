# ── compute ─────────────────────────────────────────────────────────────

[[row]]
id = "compute.logits"
layer = "compute"
covers = ["complete"]
callers = "all"
check = "matched config: top-20 logprobs equal at each of the first 64 greedy positions, greedy tokens equal, for the fast and primary models"
judge = [{ kind = "logprobs", tol = 0.0 }, { kind = "greedy-tokens" }]
pairs = [["embedded", "llama-server-matched"]]
predict = "pass"
basis = "read"
note = "Same commit 035e227 on both; patches 0003-0008 change no math; n_ubatch 512 on both, and n_batch boundaries are multiples of it, so the ubatch splits coincide."

[[row]]
id = "compute.embeddings"
layer = "compute"
covers = ["embed", "embed_batch", "embed_query"]
callers = "~60 embed, ~20 embed_batch, ~30 embed_query sites; /v1/embeddings"
check = "min cosine >= 0.9995 over 20 questions + 20 chunks, and identical top-10 retrieval sets on the retrieval-prod bank"
judge = [{ kind = "embedding", min_cos = 0.9995 }]
predict = "pass"
basis = "measured"
note = "With embed_inputs=client, min cosine 0.9996 (9785cfe5a). Not bit-equal: the engine's embed slot batches 16 sequences per decode (embed_slot.rs:208)."

[[row]]
id = "compute.embeddings-default-inputs"
layer = "compute"
covers = ["embed_query"]
callers = "as compute.embeddings"
check = "as compute.embeddings, with embed_inputs left at its default"
judge = [{ kind = "embedding", min_cos = 0.9995 }]
pairs = [["embedded", "llama-server-default-embed"]]
predict = "fail:silent"
basis = "measured"
note = "Default embed_inputs=server sends bare text (engine_config.rs:245); cosine 0.84 against the engine's index, and embed_query equals embed (lib.rs:415)."
fix = "decided 2026-10-10: input preparation belongs to the embedding model (EmbedQuirks), applied by one decider whichever engine serves; client is the default for kind=remote"

[[row]]
id = "compute.rerank"
layer = "compute"
covers = ["rerank_batch"]
callers = "corpus/mod.rs:188 search_with_rerank; /v1/rerank served_kind.rs:238; inner_chaos recall.rs:780"
check = "same order and the same refusal class when no reranker is configured"
judge = [{ kind = "rerank-order" }]
predict = "fail:differs"
basis = "read"
fix = "decided 2026-10-10: reranking is its own --reranking model in the router with its own endpoint; callers that threshold scores are checked against probabilities"
note = "The engine client sends rerank to the CHAT server (lib.rs:1840), which refuses /rerank without --reranking (LS server-context.cpp:5021): an HTTP error where the engine returns NotImplemented. With a dedicated --reranking server the 8-document order matched (2026-10-09), but llama-server scores by rank pooling and the engine generatively (rerank_slot.rs:88-119, 217)."

[[row]]
id = "compute.count-tokens"
layer = "compute"
covers = ["count_tokens"]
callers = "streaming.rs:2968; knowledge_query.rs:1470; history.rs:366,376,381 (prompt budgets)"
check = "count equals llama-server /tokenize on the same text"
judge = [{ kind = "token-count" }]
predict = "fail:differs"
basis = "read"
fix = "decided 2026-10-10: budget callers are async; they get an exact async count from /tokenize, and the sync method stays an estimate named as one"
note = "Remote uses the trait default chars/4 (traits.rs:578); the engine uses the fast model's tokenizer. count_tokens is sync, so the fix cannot be a per-call HTTP request."

