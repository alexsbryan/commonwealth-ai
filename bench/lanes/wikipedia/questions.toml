    "Niels Bohr",
    "Werner Heisenberg",
]

# ─── Contested / atlas-relevant ─────────────────────────────────

[[questions]]
id = "contested_atomic_bombings_morality"
category = "contested"
question = "What are the major arguments for and against the morality of the atomic bombings of Hiroshima and Nagasaki?"
expected_facts = [
    "ended the war sooner",
    "saved lives by avoiding invasion",
    "civilian casualties",
    "alternatives existed",
    "demonstration",
    "Soviet entry",
]
expected_sources = [
    "Atomic bombings of Hiroshima and Nagasaki",
]
notes = "Atlas fault-line territory — should surface multiple positions, ideally with Wikipedia POV-flagged sections."

[[questions]]
id = "contested_colonialism_legacy"
category = "contested"
question = "How is the legacy of European colonialism in Africa contested today?"
expected_facts = [
    "Scramble for Africa",
    "extraction",
    "borders",
    "slavery",
    "decolonization",
    "underdevelopment",
    "exploitation",
]
expected_sources = [
    "Colonialism",
    "Scramble for Africa",
    "Decolonization",
]
notes = "Atlas fault-line in postcolonial history; tests whether retrieval surfaces multiple positions on a non-WWII contested topic."

[[questions]]
id = "contested_globalization_effects"
category = "contested"
question = "What are the major arguments for and against globalization's economic effects?"
expected_facts = [
    "free trade",
    "inequality",
    "development",
    "poverty",
    "labor",
    "competition",
    "growth",
    "outsourcing",
]
expected_sources = [
    "Globalization",
    "Free trade",
    "Capitalism",
]
notes = "Economic-policy fault-line; canonical articles surface multiple positions on benefits vs. costs."

[[questions]]
id = "contested_quantum_determinism"
category = "contested"
question = "How did Heisenberg's uncertainty principle reshape philosophical debate about determinism?"
expected_facts = [
    "indeterminism",
    "Laplace's demon",
    "hidden variables",
    "Bohr",
    "Einstein",
    "free will",
]
expected_sources = [
    "Uncertainty principle",
    "Determinism",
    "Werner Heisenberg",
    "Hidden-variable theory",
]
notes = "Bridges physics → philosophy → free will; tests cross-domain retrieval and whether atlas Question/Position atoms surface."
