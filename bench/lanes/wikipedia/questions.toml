question = "What was Ada Lovelace's contribution to computing, and how did it relate to Babbage's Analytical Engine?"
expected_facts = [
    "Analytical Engine",
    "Charles Babbage",
    "algorithm",
    "1843",
    "Bernoulli numbers",
    "first computer programmer",
    "notes",
]
expected_sources = [
    "Ada Lovelace",
    "Analytical Engine",
    "Charles Babbage",
]
notes = "History of computing; tests boundary retrieval on a 19th-century biographical pair where both Lovelace and Babbage articles exist on L5."

[[questions]]
id = "boundary_emmy_noether"
category = "boundary_coverage"
question = "Who was Emmy Noether and what is the significance of Noether's theorem?"
expected_facts = [
    "abstract algebra",
    "ring theory",
    "symmetry",
    "conservation laws",
    "Göttingen",
    "1918",
]
expected_sources = [
    "Emmy Noether",
    "Noether's theorem",
]
notes = "Edge case — Noether is in Vital Articles L5 but mathematicians of her era are sparsely represented; tests how far the recall extends beyond highest-traffic subjects."

[[questions]]
id = "boundary_copenhagen_interpretation"
