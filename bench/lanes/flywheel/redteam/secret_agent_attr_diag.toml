# Tiny diagnostic bank — 3 probes to instrument the gate path fast (gate-ON,
# SOVEREIGN_AGENTIC_KQ_DEBUG=1). NOT for scoring (underpowered by design); the
# point is the per-probe [gate] dbg trace: entity_anchored, claim, violation_prob.
[meta]
corpus = "chaos-secret-agent"
description = "3-probe gate-path diagnostic (2 absent + 1 present contrast)."

[[questions]]
id = "diag-absent-heat-firstname"
qtype = "absent_adjacent"
question = "What is Chief Inspector Heat's first name?"
rationale = "ABSENT: never named. Should abstain; baseline fabricates 'Vernon'."

[[questions]]
id = "diag-absent-embassy-country"
qtype = "absent_adjacent"
question = "Which specific country's embassy employs Mr Vladimir?"
rationale = "ABSENT: country never named (Russia 0x). Baseline fabricates 'Russian'."

[[questions]]
id = "diag-present-verloc-firstname"
qtype = "present"
question = "What is Mr Verloc's first name?"
gold_keywords = ["Adolf"]
rationale = "PRESENT contrast: Adolf appears 11x. Should answer/keep."
