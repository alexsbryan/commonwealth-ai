# Routing eval — paraphrases of cells_v1 designed to defeat the
# heuristic floor.
#
# Each row holds the same expected_intent as the cells_v1 sibling,
# but phrased to NOT match any of the heuristic trigger lists in
# router.rs (`looks_like_conation`, `looks_like_commissive`,
# `looks_like_expressive`, `looks_like_factual_lookup`,
# `looks_like_comparison`, `looks_like_memory_reference`,
# `needs_deep_reasoning`, `looks_like_content_processing`).
#
# When this bank is run with --routing-only, ~all questions should
# fall through to the LLM Pass 1 classifier. That is the point:
# this bank measures Pass-1 quality, not heuristic coverage. The
# `cells_v1` bench, by contrast, mostly measures whether the
# heuristic floor still fires on the surface forms it was tuned
# against (~22 of 27 questions on the 2026-05-12 baseline).
#
# Per `feedback_no_teaching_to_test.md`, these paraphrases are
# written without consulting the heuristic trigger lists for
# wording — only their negation. If a paraphrase accidentally
# matches a trigger phrase, the bench will surface it as a sub-second
# response time and we'll rephrase.

[bank]
name = "routing-cells-v1-paraphrases"
corpus = "wikipedia"
description = """
Paraphrase variants of cells_v1. Same intents; surfaces designed to
fall through the heuristic floor and exercise Pass 1.
"""

[bank.latency_budget]
default_p95_ms = 30000
max_per_question_ms = 60000

