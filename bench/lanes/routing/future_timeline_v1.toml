# ─── Edge: bare-"expected" without trailing "to" ──────────────────
#
# The M5-Mac-Studio rebuttal case from 2026-05-19. The first-pass
# heuristic matched "expected to" / "expected at" but missed bare
# "expected?" — proving the keyword approach was brittle and not
# generalizable. Under corpus-first this just routes to KQ like the
# others; the gap check handles the "no info" case.

[[questions]]
id = "future_m5_mac_studio_bare_expected"
category = "factual_recall"
question = "When is the M5 Mac Studio expected?"
expected_intent = "knowledge_query"
expected_facts = ["stub"]
expected_sources = []

# ─── Edge: astronomically-computable but practically fresh-info ───
#
# Could be in the corpus (eclipse dates are deterministic). The bank
# accepts knowledge_query — the gap check decides whether the corpus
# actually delivered.

[[questions]]
id = "future_eclipse"
category = "factual_recall"
question = "When is the next solar eclipse visible from the US?"
expected_intent = "knowledge_query"
expected_facts = ["stub"]
expected_sources = []
