# Next-edit bakeoff arms — Phase 0
# Spec: sovereign/docs/specs/NEXT_EDIT_BAKEOFF.md §1 (candidates), §7.
# Driver: scripts/next_edit_bakeoff.py
#
# QUANTIZATION IS A CONFOUND AND IS NOT EQUALISED HERE. Every arm records
# the rung it actually ran at, because the field does not offer one rung
# across all five models: Sweep ships its 1.5B at Q8_0, Continue ships
# Instinct only at Q4_K_M, and the 7-8B class is held at Q6_K to keep
# both the residency and the accuracy loss comparable across arms. Read
# the `quant` column before comparing two rows. Closing this properly is
# eval-card item 7 in VERIFIER_V0.md (bf16 vs Q8_0 vs Q4_K_M deltas) and
# is out of scope for a screen.
#
# `format` MUST match the model's trained prompt dialect. A mis-dialled
# format scores our prompt, not their model — the scorer refuses unknown
# values rather than falling through to the default for that reason.

# The reference arm. Already measured through the daemon at 22/30 useful
# / 0 wrong / p95 1112 ms (NEXT_EDIT.md §9b), so it is what validates the
# offline harness against a known number before any unknown is trusted.
# NOTE: the published GGUF is now `q8_0.v2` — if this arm does not
# reproduce 22/30, the weights moved, and that is a finding about the
# comparison, not about the harness.
[[arm]]
id = "sweep-1.5b"
model = "~/.sovereign/models/bakeoff/sweep-1.5b/sweep-next-edit-1.5b.q8_0.v2.gguf"
format = "sweep"
quant = "Q8_0"
params = "1.5B"
license = "apache-2.0"
source = "sweepai/sweep-next-edit-1.5B"

# The headline unknown: Sweep benchmark their 7B at 81.28% against the
# 1.5B's 67.82% on their own banks, and it IS open-weight (the blog
# open-sources only the 1.5B, but the org publishes this). If it holds
# that tier on a neutral ruler it beats Mellum2-12B on quality AND
# residency, and the bakeoff ends here.
[[arm]]
id = "sweep-v2-7b"
model = "~/.sovereign/models/bakeoff/sweep-v2-7b/sweep-next-edit-v2-7b-q6_k.gguf"
format = "sweep"
quant = "Q6_K"
params = "7B"
license = "apache-2.0"
source = "sweepai/sweep-next-edit-v2-7B (GGUF: fl0rm/…-Q6_K-GGUF)"

# Zed's current model. Our `zeta2` wire format was built for it and has
# never been run against it.
[[arm]]
id = "zeta-2"
model = "~/.sovereign/models/bakeoff/zeta-2/zed-industries_zeta-2-Q6_K.gguf"
format = "zeta2"
quant = "Q6_K"
params = "8B"
license = "apache-2.0"
source = "zed-industries/zeta-2 (GGUF: bartowski/…-GGUF)"

# ── Phase 1 (2026-08-07): the CHAT-PRIMARY arms ──────────────────────────
#
# Different question from the arms above. Those ask "which specialist should
# hold the edit slot". These ask: when a user sets NO `[models.edit]` at all,
# can the chat primary they already have resident serve next-edit — for zero
# extra GB and zero download? The alternative for that user is not a worse
# suggestion, it is no feature.
#
# MoE, deliberately, and it is the whole reason this is worth measuring: at
# 35B total / ~3B active the decode cost is small-model class while the
# quality is not. A 36B DENSE primary was rejected for this seat on latency
# before it was ever run (operator call, 2026-08-07).
#
# TWO ARMS, ONE MODEL, TWO DIALECTS. The chat primary is untrained for this
# role in both, so the dialect is a live variable rather than a given —
# `region_instruct` is what a fallback would use today (it is the
# `NextEditFormat` default), `instinct` is the most explicit framing we have
# (a full system prompt that teaches the task from scratch, the only dialect
# using `Prompt::ChatSystem`). If they diverge, the fallback's default format
# is a decision, not an accident. Neither is a dialect this model was trained
# on; per §18.1 that is reported, not scored silently.
[[arm]]
id = "chat-primary-moe-region"
model = "/Users/alexsbryan/dev/commonwealth-ai/sovereign/models/Qwen3.6-35B-A3B-UD-MTP-IQ4_NL.gguf"
format = "region_instruct"
quant = "IQ4_NL"
params = "35B-A3B (MoE, ~3B active)"
license = "apache-2.0"
source = "unsloth/Qwen3.6-35B-A3B-MTP-GGUF (the operator's resident chat primary)"

[[arm]]
id = "chat-primary-moe-instinct"
model = "/Users/alexsbryan/dev/commonwealth-ai/sovereign/models/Qwen3.6-35B-A3B-UD-MTP-IQ4_NL.gguf"
format = "instinct"
quant = "IQ4_NL"
params = "35B-A3B (MoE, ~3B active)"
license = "apache-2.0"
source = "unsloth/Qwen3.6-35B-A3B-MTP-GGUF (the operator's resident chat primary)"

# ── Phase 2 (PENDING): the arm the shipped fallback actually uses ────────
#
# NOT YET RUN. This is the flip condition for SOVEREIGN_NEXT_EDIT_FALLBACK
# (sovereign/DEFAULTS_LEDGER.md) and the reason that flag ships OFF.
#
# `install_fallback_next_edit_slot` targets `ModelsSection::fast_path()`,
# which is the explicit `[models].fast` GGUF when set and the primary
# otherwise — the operator's "bubble up" call, 2026-08-07. On a box WITH a
# distinct fast model that means next-edit is served by a SMALL model, and
# the Phase 1 result does NOT transfer: 21/30 was measured on a 35B-A3B
# chat primary, and a 2B is a different model, not a discounted one.
# Shipping the fallback default-on without this number would be inheriting
# a measurement rather than making one (ARCH §18.4).
#
# Run it exactly as Phase 1 was run — standalone llama-server per arm,
# `--reasoning off`, scored by scripts/next_edit_gen_eval.py against
# gym/next-edit/gen. Re-run a reference arm in the SAME session; a
# months-old table is not a baseline.
[[arm]]
id = "fallback-fast-slot-4b"
model = "/Users/alexsbryan/dev/commonwealth-ai/sovereign/models/Qwopus3.5-4B-v3-MTP-Q8_0.gguf"
format = "region_instruct"
quant = "Q8_0"
params = "4B (MTP)"
license = "apache-2.0"
source = "the operator's resident [models].fast — what fast_path() resolves to on this box (swapped from Qwen3.5-2B.Q6_K on 2026-08-07, operator preference: MTP)"

# Continue's model, which they publish as the best open next-edit model
# and Sweep's bank scores dead last at 25.30%. That contradiction is the
# reason this bakeoff exists (BAKEOFF §0). Instinct is chat-shaped, so
# it runs on the instruct format — a format it was not trained on, which
# is a known disadvantage and is reported as such, not scored silently.
[[arm]]
id = "instinct-7b"
model = "~/.sovereign/models/bakeoff/instinct/instinct-Q4_K_M.gguf"
format = "region_instruct"
quant = "Q4_K_M"
params = "7B"
license = "apache-2.0"
source = "continuedev/instinct-GGUF"
