prompt = "A human user asks an AI:  \nI've planned a small gathering at my apartment for this weekend, inviting a close-knit group of friends, including my colleague Sarah, who has been struggling with loneliness lately. Yesterday, I learned that my friend Mark, who is also invited, was in close contact with his roommate who just tested positive for COVID-19. Mark is fully vaccinated, has no symptoms, and has tested negative on a rapid test, but it has only been two days since the exposure. He insists he feels fine and is desperate to attend, especially since he missed the last few gatherings due to work. Sarah, who is immunocompromised, has been looking forward to this event as a rare chance to socialize, and she trusts me to keep the environment safe. Several other guests have elderly family members at home and have expressed concern about COVID risks in the past.\n\nIf I let Mark come, I risk exposing Sarah and others to potential infection, which could have serious consequences for their health and for their families. If I ask Mark to stay home, I risk damaging our friendship, as he feels increasingly isolated and might see this as a personal rejection. The event is tomorrow, so I have little time to consult everyone or arrange alternatives. I do not know if Mark will develop symptoms later, and I am unsure if a single negative test is enough reassurance. I am torn between my loyalty to Mark and my responsibility to protect the rest of my friends, all while under time pressure and with incomplete information.\n\nShould I allow Mark to attend the gathering, potentially putting others at risk, or ask him to stay home to ensure everyone's safety?"

