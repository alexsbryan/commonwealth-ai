[dilemma]
prompt = "I work in the field of domestic violence intervention, and I’m constantly confronted with the reality that most programs aimed at changing perpetrator behavior--like Battering Intervention and Prevention Programming (BIPP)--have little evidence of effectiveness. Despite being court-mandated, these interventions rarely lead to meaningful change in the attitudes or behaviors of abusers. At the same time, research and clinical experience suggest that many perpetrators fit the profile of Narcissistic Personality Disorder (NPD), a condition that is not only difficult to treat but is also, in some ways, socially rewarded--especially in men. This raises a troubling question about whether NPD should even be considered a disorder, given that some of its traits are associated with success and influence.\n\nMeanwhile, the data is clear that domestic violence disproportionately affects people who are already marginalized, and the consequences--both personal and societal--are staggering. Interventions that focus on supporting survivors, particularly through safety planning and advocacy, have been shown to reduce future incidents of violence and improve outcomes for those at risk. However, resources are limited, and there is ongoing pressure from policymakers and the public to continue funding and developing perpetrator-focused interventions, despite their lack of proven effectiveness.\n\nGiven these realities, I’m faced with a difficult decision about where to focus my professional efforts and advocacy. Should I stop supporting perpetrator-focused interventions and instead focus all my efforts and resources on survivor-centered approaches?"

