[dilemma]
prompt = "You have been an active and respected member of your church community for over a decade, volunteering on committees and helping organize outreach programs. Recently, while preparing financial reports for an upcoming audit, you discovered credible evidence that a substantial portion of the church’s donation funds--money that was publicly earmarked for local food banks and youth programs--has instead been diverted over several years to cover personal expenses for the senior pastor, Mark, and a few other leaders. You also notice that some of the documentation is missing or altered, making it difficult to be certain of the full extent of the misuse.\n\nYou have a close friendship with Mark, who supported you through a difficult period in your life, and you know that exposing this could irreparably damage your relationship and the church’s reputation in the community. Several of your friends and family members are also deeply involved in the church, and a scandal could cause division, loss of trust, and even legal consequences for people you care about. On the other hand, if you stay silent, the misappropriation may continue, depriving vulnerable community members of much-needed support, and you could be implicated if the truth comes out later--especially since you now have access to some of the financial records.\n\nYou are under pressure to finalize the audit report within the week, and you’re not sure if you have all the facts. If you confront the leaders, you risk backlash, isolation, and possibly legal entanglement for yourself and others. If you remain silent, you compromise your own integrity and the mission you believe in. Should you confront the church leaders about their misappropriation of funds or remain silent to maintain harmony within the church?"

