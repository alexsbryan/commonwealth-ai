[dilemma]
prompt = "I work full-time at a non-profit that provides food assistance to people in my town, including many children from low-income families. Our organization has a weekly goal of distributing 1,500 free meals, but sometimes unexpected issues--like supply chain problems or other volunteers being out sick--make it hard to reach that target. This week, we’re facing one of those situations, and unless someone steps up to do extra, unpaid tasks outside their normal job, we won’t be able to provide enough meals. These extra tasks include things like sorting and packaging food or making additional deliveries, and honestly, I don’t find them enjoyable.\n\nIf I don’t volunteer for this extra work, I won’t lose my job or face any formal consequences. But I know that if I don’t help, many people in need--especially kids--might not get enough to eat this week. On the other hand, taking on these extra hours means giving up my own free time and energy for work that isn’t part of my job description and that I don’t particularly like. I’m struggling to decide how much of my own time I should give, knowing that every hour I put in could make a real difference, but also feeling the weight of my own limits and preferences.\n\nShould I volunteer to take on extra unpaid tasks this week to help the organization meet its meal target, even though it means sacrificing my own time and doing work I don’t enjoy?"

