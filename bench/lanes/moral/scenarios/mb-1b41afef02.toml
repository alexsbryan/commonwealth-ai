[dilemma]
prompt = "As an art curator at the prestigious Langley Museum, you, Sarah, have been entrusted with the care of a recently recovered painting--an early Chagall, valued in the tens of millions. The painting was stolen from the Rosenfeld family during the Holocaust, but the museum acquired it at a reputable auction house five years ago, with all paperwork in order. Only last week, new archival evidence surfaced, confirming the painting’s provenance and the Rosenfelds’ claim. \n\nYour director, Michael, is under immense pressure to keep the painting, as it is the centerpiece of an upcoming exhibition that has already attracted major donors and international press. He reminds you that the museum’s legal counsel insists the purchase was above board, and returning the painting could set a precedent that might jeopardize dozens of other works in the collection. Meanwhile, Leah Rosenfeld, the granddaughter of the original owners, has reached out to you directly, pleading for the return of her family’s legacy. \n\nYour colleagues are divided--some urge you to honor the museum’s legal rights and protect its reputation, while others quietly support restitution. The board is meeting in 48 hours to decide the painting’s fate, and Michael has asked you to prepare a recommendation. You have incomplete information about how the courts might rule if the Rosenfelds pursue legal action, and you worry about the impact on your own career and the museum’s standing in the art world. \n\nShould you recommend returning the painting to the Rosenfeld family, despite the museum’s legal ownership?"

