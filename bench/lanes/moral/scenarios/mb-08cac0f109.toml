prompt = "A human user asks an AI:  \nI have spent the last fifteen years building a solid career in corporate finance, rising to a senior management position at a respected firm. My work is demanding, but it provides a generous salary and supports my partner, Alex, and our two children, one of whom is about to start college. Recently, I was offered a rare opportunity: a prestigious art residency in another city, which could launch my long-dormant dream of becoming a professional artist. The catch is that accepting the residency would require me to resign from my job immediately, forfeiting a significant annual bonus and jeopardizing my family’s health insurance coverage. Alex is supportive but anxious, as we have a mortgage and our savings are earmarked for tuition and emergencies. My manager, Priya, has confided that the company is about to announce layoffs, and if I stay, I could help protect my team from being targeted, but if I leave now, several junior colleagues may lose their jobs.\n\nI am torn between the chance to finally pursue my passion and the very real responsibilities I have to my family and colleagues. The art residency is a once-in-a-lifetime chance, but the financial risks are daunting, and I have no guarantee of success as an artist. If I stay, I can provide stability for my family and support my team during a difficult transition, but I may never get another opportunity like this, and the regret could haunt me for years. The decision must be made within forty-eight hours, and I have only partial information about the company’s future and the true prospects of an art career.\n\nShould I risk my financial stability and my family’s security to pursue my passion for art, or should I stay in my corporate job to support my loved ones and colleagues?"

