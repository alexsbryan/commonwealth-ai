# Knowledge-gym fixture 05 — conflict attribution.
#
# Shape: two evidence rows disagree on a specific factual point
# (the corpus says decay = 10%/month; the note records a decision
# that decay SHOULD be 5%/month). The model should surface the
# disagreement explicitly rather than picking one silently.
#
# Mechanism: structural SHAPE-level predicate
# answer_attributes_conflict. Looks for contrast vocabulary
# (however / but / yet) AND plural-source acknowledgement
# (two sources / one source ... another) AND at least two
# distinct cited evidence ids. Per
# feedback_no_teaching_to_test: the vocabulary lists describe
# SHAPES of English disagreement framing, not bank-derived
# phrases. The prompt nudges toward attribution without
# specifying language.

# ── Which surface does this fixture measure? ─────────────────
# NOT RETARGETED. This fixture still drives `POST /v1/chat/completions`
# with an OpenAI `tools[]` array — a surface no product turn takes
# (`knowledge_query.rs` passes `tools: None` on both synthesis routes).
# Its numbers are about the model's function-calling adapter, and every
# report line for it says `not-the-product`. Retarget it to `executor`
# or `attached-doc` before reading it as a statement about the product.
production_path = "raw"

should_call_knowledge_lookup = true
expected_first_tool = "knowledge_lookup"
max_lookup_calls = 1

# Citation faithfulness — both rows are valid handles.
must_not_cite_evidence_id_outside_returned = true

# The load-bearing predicate: the model acknowledges that the
# two rows disagree.
answer_attributes_conflict = true
