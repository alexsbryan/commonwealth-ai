[package]
name = "corpus-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A corpus-index MCP host that needs nothing but an OpenAI-compatible endpoint — cited chunk search and atlas atom lookup over stdio, with no local inference stack linked."

# The proof that enrichment is a PLUGIN of the recipe pipeline and not fused to
# it (enrichment-as-plugin Step 5): this binary reads what the pipeline wrote
# through the read leaves (`corpus-index`, `corpus-engine-atlas-reader`,
# `understanding-vocab`) + an HTTP `EmbedFn`, and links NOTHING that carries
# llama.cpp, ort or iroh — nor, since pb-corpus-mcp-reads, `corpus-engine`
# itself. `quality/xtask/tests/no_inference_stack.rs` asserts both against `cargo tree`;
# `quality/ARCH_LAYERS.toml` declares the closure as a `[[package]]` so
# boundary-gate keeps it honest.
#
# Shape borrowed from `docs/CODE_TOOLING_BOUNDARY.md` §5: `--base-url` is the
# only mandatory flag, host capability is DETECTED via `GET
# /oicp/v1/capabilities` and never configured, a 404 gets the baseline path,
# and every degradation is printed rather than silent.

[[bin]]
name = "corpus-mcp"
path = "src/main.rs"

[dependencies]
corpus-engine-atlas-reader = { workspace = true }
understanding-vocab = { workspace = true, features = ["read"] }
# The retrieval read-port leaf (domains REVIEW-build-index-read-port): the
# `CorpusIndex` / `ScoredChunk` / `EmbedFn` surface `serve`, `ask`, `host` and
# the `corpus_search` tool read through, so the host no longer reaches those
# read-only types through `corpus-engine`. Its `FsIndexSource` lists and
# opens the installed indexes (pb-corpus-mcp-reads); the `ingest` verb moved
# to svrn-ingest (sovereign-pipeline) at pb-ingest-cli, and serve's pull
# became `svrn-ingest pull` at pb-corpus-mcp-reads.
corpus-index = { workspace = true }
# `CorpusId`, the neutral identity leaf, named directly since `ask` stopped
# reaching it through corpus-engine's re-export (pb-corpus-mcp-reads).
kernel-types = { workspace = true }
# The one locator of a sibling program's binary (`reach::locate_sibling`):
# `serve --corpus <absent>` execs ingest's `svrn-ingest pull` through it,
# with `SOVEREIGN_INGEST_BIN` as the override (pb-corpus-mcp-reads). A leaf.
sovereign-turn-client = { workspace = true }
# The one MCP dispatcher (phase-b pb-mcp): the stdio loop and the JSON-RPC
# envelope are the kit's, and `Server` is its tool-host port.
host-kit = { workspace = true, features = ["mcp"] }
# `sovereign_contracts::rebrand::data_dir()` is the ONE derivation of the data
# root (quality/env-flags.toml: SOVEREIGN_DATA_DIR); already in corpus-engine's
# closure, and a declared package leaf.
sovereign-contracts = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
