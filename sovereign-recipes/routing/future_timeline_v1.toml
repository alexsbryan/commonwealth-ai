# ─── Edge: future-tense without an explicit shape marker ──────────
#
# These exercise the boundary. "When will the eclipse happen" is
# astronomically computable — corpus-answerable in principle — but
# in practice users asking it want the next-occurrence date, which
# is fresh-info. Accepting either knowledge_query OR simple_action
# would let the heuristic legitimately defer to the LLM classifier.

[[questions]]
id = "future_eclipse"
category = "factual_recall"
question = "When is the next solar eclipse visible from the US?"
expected_intent = "simple_action"
expected_facts = ["stub"]
expected_sources = []
