# Routing-only test bank — framework cells coverage.
#
# Purpose: validate that the situated router classifies messages from
# each populated cell of the 5×6 framework grid (Searle's illocutionary
# act × Jakobson's function) correctly. The heuristic pre-checks should
# catch the surface-clear cases; the situated Pass 1 prompt should
# catch the Gricean cases (surface ≠ intent); the tail-case refiner
# (when wired) catches the residual ambiguity.
#
# All examples are out-of-bank for prior cells per
# `feedback_no_teaching_to_test.md` — the heuristic phrases were
# designed against generic shapes, not these specific test inputs.
#
# Categories used:
#   - conation       (Intent::ConationQuery)
#   - commissive     (Intent::CommissiveQuery)
#   - expressive     (Intent::ExpressiveQuery)
#   - metalingual    (Intent::MetalingualQuery, regression)
#   - comparative    (Intent::ComparisonQuery, regression)
#   - factual_recall (Intent::KnowledgeQuery, regression)
#   - multi_article_synthesis (Intent::DeepQuery, regression)

[bank]
name = "routing-cells-v1"
corpus = "wikipedia"
description = """
Cell-coverage bank for the framework's 5×6 routing grid. Each new cell
gets 5 fixtures spanning surface-clear and Gricean cases; regression
cells get 3 fixtures each to ensure the new heuristics don't steal
traffic from already-shipped routes.
"""

[bank.latency_budget]
default_p95_ms = 30000
max_per_question_ms = 60000

