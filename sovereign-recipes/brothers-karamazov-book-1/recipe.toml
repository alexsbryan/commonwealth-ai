# Brothers Karamazov, Book I — the literary-atlas bench corpus.
#
# Backs the `literary/bk-book-1` enrichment lane in
# scripts/sovereign-ci-bench.sh: a HARD, baseline-diffed gate that scores the
# resolved atlas (entities / events / states / relations / claims / questions)
# against the hand-authored golden at sovereign/bench/literary/bk-book-1.toml.
#
# WHY THIS RECIPE EXISTS. Until 2026-08-07 the lane's corpus was a hand-built
# atlas that existed on exactly one machine, enriched from a personal
# `~/Downloads/Brothers_Karamazov.txt`. Everywhere else the lane discovered no
# corpus, reported `1 stale`, and sovereign-ci-bench.sh graded that
# `PASS(warn:setup)` (see its status mapping) — so a HARD gate silently
# measured nothing on every box but one. This recipe makes the corpus
# installable, which is what makes the gate a gate.
#
# WHY BOOK I AND NOT THE WHOLE NOVEL. The golden is built around leakage
# anti-tests — `forbidden_event_atoms` for "Mitya's trial" ("The trial happens
# in Book XII... surfacing it from Book I would mean the extractor leaked
# context from outside the section") and `forbidden_relation_atoms` for
# Alyosha/Lise/Grushenka/Katerina. Enrich the full novel and every one of those
# inverts: the extractor gets penalised for correctly reading the text. The
# scoping has to live in the SOURCE DOCUMENT rather than in a flag, because the
# weekly rebuild tier shells `svrn enrich build <corpus_id>` with no chapter
# selection (bench_cmd/all.rs::rebuild_corpus) — anything in the document is
# fair game for extraction.

[corpus]
id = "brothers-karamazov-book-1"
name = "The Brothers Karamazov — Book I"
description = "Dostoevsky's The Brothers Karamazov, Book I: 'The History Of A Family' (chapters I-V, Constance Garnett translation, Project Gutenberg #28054). Bench corpus for the literary-atlas enrichment gate."
license = "Public Domain"
kind = "knowledge"
mesh_sharing = false
size_compressed_gb = 0.001
size_indexed_gb = 0.005

# The source document is hosted alongside the prebuilt snapshot in the same HF
# dataset repo, so `svrn corpus install brothers-karamazov-book-1` needs no setup
# script and no $HOME-relative path (the schema does not expand `~`, which is
# why the chaos-secret-agent recipe has to be rewritten by a shell script).
#
# It is a byte-exact line slice of Gutenberg #28054 — lines 175..1288, i.e. the
# "Book I. The History Of A Family" heading through the line before "Book II.
# An Unfortunate Gathering". sha256
# cddb992e50a21c3dd4ba5da5e205722f1c568ee315e93bc0437788f64b1b81b6.
# scripts/setup-literary-corpus.sh re-derives it from Gutenberg and fails on a
# hash mismatch, so an upstream re-issue surfaces as an error rather than as
# silent bench drift.
[acquire]
type = "bulk_download"
url = "https://huggingface.co/datasets/svrnmesh/brothers-karamazov-book-1/resolve/main/brothers-karamazov-book-1.txt"

[extract]
type = "plaintext"

# Paragraph chunking with overlap — same shape as `sep` and
# `chaos-secret-agent`. Keeps prose paragraphs intact and slices the long
# chapter blocks at clean boundaries for the embed model.
[chunk]
type = "paragraph"
max_chars = 2048
overlap_chars = 256

[index]
fts = true
vector = true

# The atlas IS the thing under test here, so enrichment is declared — but
# `type` MUST be "atlas", not "field_model".
#
# `domain` here names an ATLAS PIPELINE (`literary` -> LiteraryAtlasPipeline),
# which is a different registry from the field-model domains
# (philosophy / personal / conversational / business_email / institutional —
# `enrichment/domain_registry.rs`). Install only skips the field-model engine
# when it sees `type == "atlas"` (engine/ingest.rs ~1808); with
# `type = "field_model"` it falls through to `FieldModelEngine::from_recipe`,
# which does not know `literary` and returns `UnknownEnrichmentDomain`.
#
# That is not a cosmetic error. It fails the WHOLE ingest *after* chunks,
# vectors and FTS are already built, so `finalise_solo_ingest` — reached only
# on `Ok` — never runs and the finished work is stranded in
# `<id>-partition-node-<hash>/` with no canonical. `corpus install` still
# exits 0 and the CLI prints "spawned"; the only evidence is a WARN in
# ~/.sovereign/logs/daemon.err. Diagnosed 2026-08-07 after it happened twice.
#
# The atlas itself is NOT built by install either way — it comes from the
# [prebuilt] snapshot below, or from `svrn enrich init <id> --pipeline
# literary_atlas` + `svrn enrich build <id>` for a local re-extraction.
[enrichment]
enabled = true
type = "atlas"
domain = "literary"
prompt_version = "v1"

# Prebuilt snapshot: 41 chunks + FTS + vectors + the resolved literary atlas,
# 237 KB. Restoring it skips both the ingest and the ~15min of LLM enrichment,
# which is what lets a peer run the enrichment lane the day they clone.
#
# THIS IS THE ARTIFACT THE COMMITTED BASELINE WAS MINTED FROM
# (sovereign/bench/literary/baselines/bk-book-1/2026-08-07.json). That pairing
# is the whole point: an enrichment lane is only a REGRESSION gate if every box
# scores the same reference atlas. A box that wants to measure its OWN model
# instead runs the lane with `--rebuild`, which re-extracts in place — and a
# box that re-extracts should expect its own numbers, not this baseline's.
#
# MUST match [recipes.prebuilt] in sovereign-recipes/registry.toml — the same
# artifact is named in two places and a snapshot bump has to touch BOTH.
[prebuilt]
hf_repo = "svrnmesh/brothers-karamazov-book-1"
hf_filename = "brothers-karamazov-book-1-qwen-embedding-0.6b-2026-08-07.tar.zst"
sha256 = "924bb44768072bef80aca917420838d8c5132a49647a6bf3282f271f62be1c2a"
compatible_embedding_model = "qwen-embedding-0.6b"
