# ── B4: negative controls — the failing inputs, by name (ARCH §18.1) ─────────
# Constructed so a lazy resolver has a TEMPTING near-neighbour to substitute.
# The correct behaviour is a refusal that states why (ARCH §18.3).

[[b4]]
concept = "services_revenue"
period = "FY2025"
expect = "refusal"
why_absent = "Services revenue ($109,158M) exists in the filing's disaggregation table as a DIMENSIONAL fact; the companyfacts API carries consolidated facts only. 'services_revenue' is deliberately NOT in the concept map — an unmapped concept is reported, never defaulted."
tempting_wrong_answer = "total revenue 416161000000 (the consolidated near-neighbour)"

[[b4]]
concept = "revenue"
period = "2025-01-01..2025-12-31"
expect = "refusal"
why_absent = "Apple has no calendar-year-2025 revenue fact; its fiscal year ended 2025-09-27. NOTE the trap: the FY2025 fact carries XBRL frame 'CY2025' — the frame label is SEC's nearest-calendar bucketing, NOT calendar alignment, and must never be used to satisfy a calendar-period request."
tempting_wrong_answer = "the FY2025 value 416161000000 presented as calendar 2025"

[[b4]]
concept = "advertising_expense"
period = "FY2025"
expect = "refusal"
why_absent = "The concept IS mapped and us-gaap:AdvertisingExpense IS present in Apple's companyfacts — but its latest fact is FY2015 (period ended 2015-09-26). Apple stopped disclosing it. Concept available, period absent: refuse naming the last available period."
tempting_wrong_answer = "the FY2015 value 1800000000 presented as current"
