# Pre-registered verification set — AAPL FY2025 (order sec-filings-template, slice 1).
#
# FROZEN BEFORE the retrieval run (2026-08-14). Every expected value below was
# hand-read from the filing's financial statements text (Form 10-K, accession
# 0000320193-25-000079, filed 2025-10-31, period ended 2025-09-27), NOT from the
# companyfacts API — companyfacts is the system under test, so verifying against
# it would be circular.
#
# B2: all 10 triples must resolve to exactly these values with unit and period
# basis. 10/10 or the bar fails.
# B4 (outranks B2): each refusal question must be REFUSED with a stated reason.
# A confident number on any of them fails the order regardless of B2.

schema = 1

[subject]
ticker = "AAPL"
cik = "0000320193"
form = "10-K"
accession = "0000320193-25-000079"
fiscal_year = 2025
# Apple's FY2025: a 52-week fiscal year ended the last Saturday of September.
period_duration = { start = "2024-09-29", end = "2025-09-27" }
period_instant = "2025-09-27"

# ── B2: ten frozen (concept, period, value) triples ──────────────────────────
# Statement figures are "In millions" in the filing; expected_value is raw USD.

