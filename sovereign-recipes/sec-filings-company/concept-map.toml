# Concept-normalization map — SEC XBRL (us-gaap) -> canonical concepts.
#
# This is DATA, not code (ARCH §2/§4): the mapped concepts are a registry with
# an open tail. Exactly ONE decider consumes it — scripts/sec_facts.py — which
# turns (company, concept, period) into a figure or a refusal. Nothing else may
# interpret this file (§10.6: one decider, one name).
#
# Resolution rule: for a canonical concept, the decider walks `tags` in order
# and takes the FIRST tag present in the filer's companyfacts, unless a
# [filers.<cik>] override names a tag chain for that concept — the override
# wins whole (it replaces the global chain, never merges). Which alias fired is
# logged at debug; a concept with NO entry here is UNMAPPED and is reported by
# name, never defaulted to a near neighbour (ARCH §18.3).
#
# kind: "duration" (income statement / cash flow) or "instant" (balance sheet).
# Deliberately absent: any dimensional concept (e.g. services_revenue,
# products_revenue) — the companyfacts API carries consolidated facts only, so
# no tag chain could serve them. They stay unmapped so requests for them are
# refused, not approximated.

schema = 1

[concepts.revenue]
label = "Total revenue (net sales)"
kind = "duration"
tags = [
  "RevenueFromContractWithCustomerExcludingAssessedTax",
  "Revenues",
  "SalesRevenueNet",
]

[concepts.cost_of_revenue]
label = "Total cost of revenue (cost of sales)"
kind = "duration"
tags = ["CostOfRevenue", "CostOfGoodsAndServicesSold"]

[concepts.gross_profit]
label = "Gross profit (gross margin)"
kind = "duration"
tags = ["GrossProfit"]

[concepts.research_and_development_expense]
label = "Research and development expense"
kind = "duration"
tags = ["ResearchAndDevelopmentExpense"]

[concepts.selling_general_and_administrative_expense]
label = "Selling, general and administrative expense"
kind = "duration"
tags = ["SellingGeneralAndAdministrativeExpense"]

[concepts.operating_income]
label = "Operating income"
kind = "duration"
tags = ["OperatingIncomeLoss"]

[concepts.income_before_taxes]
label = "Income before provision for income taxes"
kind = "duration"
tags = [
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest",
  "IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments",
]

[concepts.income_tax_provision]
label = "Provision for income taxes"
kind = "duration"
tags = ["IncomeTaxExpenseBenefit"]

[concepts.net_income]
label = "Net income"
kind = "duration"
tags = ["NetIncomeLoss"]

[concepts.eps_basic]
label = "Earnings per share, basic"
kind = "duration"
tags = ["EarningsPerShareBasic"]

[concepts.eps_diluted]
label = "Earnings per share, diluted"
kind = "duration"
tags = ["EarningsPerShareDiluted"]

[concepts.total_assets]
label = "Total assets"
kind = "instant"
tags = ["Assets"]

[concepts.total_liabilities]
label = "Total liabilities"
kind = "instant"
tags = ["Liabilities"]

[concepts.stockholders_equity]
label = "Total shareholders' equity"
kind = "instant"
tags = [
  "StockholdersEquity",
  "StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest",
]

[concepts.cash_and_equivalents]
label = "Cash and cash equivalents"
kind = "instant"
tags = ["CashAndCashEquivalentsAtCarryingValue"]

[concepts.inventories]
label = "Inventories"
kind = "instant"
tags = ["InventoryNet"]

[concepts.accounts_payable]
label = "Accounts payable"
kind = "instant"
tags = ["AccountsPayableCurrent"]

[concepts.operating_cash_flow]
label = "Cash generated by operating activities"
kind = "duration"
tags = [
  "NetCashProvidedByUsedInOperatingActivities",
  "NetCashProvidedByUsedInOperatingActivitiesContinuingOperations",
]

[concepts.capital_expenditures]
label = "Payments to acquire property, plant and equipment (capex)"
kind = "duration"
tags = ["PaymentsToAcquirePropertyPlantAndEquipment"]

[concepts.advertising_expense]
label = "Advertising expense"
kind = "duration"
tags = ["AdvertisingExpense"]

# ── Per-filer overrides (keyed by 10-digit CIK — the SEC identity; a ticker is
# an alias). An override REPLACES the global tag chain for that concept.
# Apple needs none today; the section exists so slice 2's custom extension tags
# land as data rows, not code.

[filers.cik0000320193]
ticker = "AAPL"
name = "Apple Inc."
# no overrides — standard us-gaap chains resolve
