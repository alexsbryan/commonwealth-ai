# SEC Filings Corpus — single company (Form 10-K + XBRL facts).
#
# The numbers and the narrative answer together, or the answer says why not:
# for one public company, the latest 10-K's prose AND its XBRL companyfacts
# figures in one corpus, so a financial figure and what management said about
# it are retrievable in the same answer.
#
# TWO INSTALL PATHS, one corpus shape.
#
#   1. BY TICKER, from the catalog (the product path). The user's only
#      input is a ticker: `[parameters.ticker]` renders into the
#      `sec_edgar` acquirer, which resolves ticker -> CIK, selects the
#      10-K, and fetches the bytes. Installs SINGLE-INSTANCE under this
#      recipe's own id — there is no per-install id derivation in the
#      engine (no `id_template` exists), so installing a second company
#      REPLACES the first. The acquirer states that replacement naming
#      both companies rather than swapping silently.
#
#   2. BY SCRIPT, several companies at once (the power-user path).
#      `scripts/setup-sec-corpus.sh <ticker-or-cik>` materializes a
#      per-company override at `~/.svrnmesh/recipes/sec-cik<10-digit>/`
#      with a `local_file` acquire pointing at what it downloaded. Its
#      ids are CIK-derived, so the two paths' namespaces are disjoint by
#      construction and no company can land under both.
#
# Multi-company from the catalog is a follow-on that must mint id
# derivation across the install route, progress, status, uninstall and
# mesh-sharing — priced as the seam it is, not smuggled in here.
#
# Two document populations under one docs/ root, both plain text:
#   prose/  — the 10-K primary document, pre-cleaned by the setup script
#             exactly as proxy-company does (strip tags, drop >=40-char
#             non-space runs of inline-XBRL/URL garbage), split into
#             ~2600-char parts with 300-char overlap so each part is ONE
#             chunk: the engine prepends the doc title to every chunk after
#             the chunker bounds content, and recipe test's size gate counts
#             the prepended result (chunk_doc, engine/ingest_helpers.rs) —
#             full-size chunks from titled docs are structurally over-limit.
#             See setup-proxy-corpus.sh's header for why local_file beats
#             the http_api acquirer for EDGAR documents.
#   facts/  — per-concept XBRL fact files rendered by scripts/sec_facts.py
#             (THE one decider) from data.sec.gov companyfacts via the
#             concept-map.toml registry. Rendered, not extracted in-engine:
#             the `json` extractor cannot carry companyfacts (content_field
#             must be a string field on each matched object; a fact's `val`
#             is a number and its concept id is a parent map key), and the
#             extractor layer is a shared seam this recipe does not touch.
#             Every rendered line carries value, unit, fiscal period basis
#             (start..end dates — never the XBRL frame label), form and
#             accession, so a retrieved chunk answers with its citation.
#             The unmapped-concept list lands beside them as
#             facts/_unmapped_concepts.json (glassbox deliverable; json
#             files are not ingested by the plaintext extractor).

[corpus]
id = "sec-filings-company"
name = "SEC Filings — Single Company"
description = "One public company's SEC Form 10-K prose plus its XBRL companyfacts figures. Pick the company by ticker at install time."
license = "Public Domain (17 USC §105 — SEC filings)"
# Installable directly: the ticker parameter is what makes one recipe
# serve any company, so there is nothing left to template. The script
# path still materializes CIK-keyed overrides for multi-company use.
on_demand = false
mesh_sharing = true
query_sharing = true
schema_version = 1

[display]
category = "Finance"
icon = "chart"

# ─── Build-time parameters ───────────────────────────────────────────
#
# The user's SOLE input. A ticker is a label the SEC can reassign; the
# CIK it resolves to is the company, and the acquirer records that CIK so
# a later install of a different company is a NAMED replacement rather
# than a silent swap.
[parameters.ticker]
type = "string"
description = "Stock ticker of the company to install, e.g. AAPL. A bare CIK also works. Resolved against SEC's company_tickers.json — an unknown symbol is refused by name, never matched to a near neighbour."
required = true

# ─── Acquisition ─────────────────────────────────────────────────────
#
# `sec_edgar` (sovereign-tools, registered on the engine at
# daemon bootstrap) rather than a built-in acquirer, because
# ticker -> filing is RESOLUTION, not substitution: the document URL must
# be COMPOSED from three parallel arrays in the submissions JSON, which
# no `{placeholder}` and no JSONPath can express. See the module docs on
# `sovereign-tools/src/sec_edgar.rs` and setup-proxy-corpus.sh's header.
#
# BYTES ONLY. The acquirer never interprets companyfacts — a figure's
# concept/period selection has ONE decider, and a second implementation
# in the acquisition path would fork it (ARCH §10.6).
[acquire]
type = "custom"
kind = "sec_edgar"
params = { ticker = "{ticker}" }

# Authority declaration (FINANCIAL_CORPORA §7.3): the `sec_facts` tool is
# AUTHORITATIVE for this corpus's figures. Its typed store answers with
# basis + accession or refuses naming what IS available; the prose carries
# lookalike values (comparatives, roundings) that are NOT authoritative.
# Declared by the recipe, never a user setting (§7.4) — the materialized
# per-company override keeps this block verbatim.
[authority]
tool = "sec_facts"

[extract]
type = "plaintext"

# Same bounded chunking rationale as proxy-company: fixed runs to a word
# boundary <= max_chars; overlap repeats the boundary region so a figure or a
# claim straddling a cut still appears whole in one chunk. Fact files are one
# line per fiscal year, far under max_chars, so each fact chunk carries its
# full citation by construction.
[chunk]
type = "fixed"
max_chars = 3000
overlap_chars = 300

[index]
fts = true
vector = true

# No [enrichment] table: the product bars are carried elsewhere (order
# sec-filings-harden, FINANCIAL_CORPORA.md §6). Figures reach the user via the
# `sec_facts` tool (sovereign-tools) reading the typed sidecar sec_facts.json
# that scripts/sec_facts.py render writes and setup-sec-corpus.sh installs
# into the corpus INDEX dir; explanations (F4) ride retrieval over prose/ with
# quote_verification's verbatim-or-demoted bar. Atom-level `investigation`
# enrichment (SCHEMA.md:114) remains a later-order candidate.
