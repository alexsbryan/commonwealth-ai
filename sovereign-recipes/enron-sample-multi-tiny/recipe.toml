# Stage B — first cross-origin smoke for the architecture-over-Enron
# substrate.
#
# Two mailboxes (Lay's _sent + Skilling's sent, ~537 messages total)
# under a single staging dir so the email walker sees two distinct
# X-Origin values (`LAY-K`, `SKILLING-J`). That lights up Phase 4's
# multi-origin reconciliation paths that `enron-sample-tiny` (single
# X-Origin) leaves cold: cross-origin alias merge, cross-origin
# conflict resolution, and the calibrated business_entity_v1 judge
# firing on near-duplicate person/org candidates seen from each
# mailbox's vantage.
#
# Operator setup: a one-shot symlink dir at
# `~/.sovereign/corpora-staging/enron-multi-tiny/`:
#   lay-k_sent_link      → enron/maildir/lay-k/_sent
#   skilling-j_sent_link → enron/maildir/skilling-j/sent
# The email walker traverses symlinks (std::fs::is_dir follows by
# default), so the two source folders show up as siblings without
# copying data.
#
# Attachments stay off here (same as `enron-sample-tiny`); Stage D
# enables `max_attachment_bytes > 0` plus the asset-store path on a
# larger 4-mailbox corpus where the trader mailboxes actually carry
# .doc / .xls inline.

[corpus]
id = "enron-sample-multi-tiny"
name = "Enron Email (Lay+Skilling _sent slice)"
description = "Stage B cross-origin smoke for the architecture-over-Enron substrate. Lay's _sent + Skilling's sent (~537 messages, 2 X-Origin values). First baseline that exercises Phase 4 multi-origin reconciliation."
license = "public-domain"
schema_version = 1
mesh_sharing = false
size_compressed_gb = 0.004
size_indexed_gb = 0.06

[acquire]
type = "local_file"
path = "~/.sovereign/corpora-staging/enron-multi-tiny"

[extract]
type = "email"
max_body_bytes = 4194304
max_attachment_bytes = 0

[[filter]]
type = "boilerplate"
strip_signatures = true
strip_quoted_replies = true
strip_disclaimers = true
min_body_chars_after_strip = 20

[chunk]
type = "paragraph"
max_chars = 2000
overlap_chars = 200

[index]
fts = true
vector = true

[enrichment]
enabled = true
type = "atlas"
domain = "business_email"
prompt_version = "enron-v1"

[enrichment.reconciliation]
name_similarity_threshold = 0.85
cross_origin_required_signals = 2
judge_when_uncertain = true
judge_trials = 3

[enrichment.reconciliation.column_aware]
max_entities_per_column = 5000

[enrichment.reconciliation.column_aware.column_headers]
person_headers = ["employee", "person", "name", "trader", "owner", "contact", "attendee"]
organization_headers = ["counterparty", "customer", "vendor", "supplier", "company", "organization", "client", "broker"]
place_headers = ["city", "state", "country", "location"]

[display]
category = "email"
icon = "mail"
