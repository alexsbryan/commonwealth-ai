[corpus]
id = "wikipedia-simple"
name = "Simple English Wikipedia"
description = """
Simple English Wikipedia — ~230K articles in plain language. Layer 0 of the layered Wikipedia stack: \
designed to be ready for chat in 2–3 min on first launch so the user gets grounded responses while \
Wikipedia Core indexes in the background. Distinct corpus_id from `wikipedia` (different HF subset, \
different vocabulary distribution) so they never have to share an embedding space. Often outranked \
by Core on overlapping topics once Core lands; kept around because simpler prose sometimes produces \
cleaner synthesis from small models.\
"""
license = "CC-BY-SA-4.0"
# Layer 0 satellite of `wikipedia`. The desktop picker hides children
# with a `parent_corpus_id` from the top-level list and renders them as
# toggles under the parent's row instead. Data layer is unchanged —
# own id, own index, own mesh-sharing rules.
parent_corpus_id = "wikipedia"
mesh_sharing = true
size_compressed_gb = 0.4
size_indexed_gb = 1.0

# Simple English ships as parquet shards on HF, unlike the full English
# dump which is a single ZIP. So we use the HF dataset acquirer.
[acquire]
type = "huggingface_dataset"
repo = "wikimedia/wikipedia"
subset = "20231101.simple"

# `wikimedia/wikipedia` ships a *flat* parquet schema (id, url, title,
# text) — distinct from `wikimedia/structured-wikipedia` which carries
# nested sections + abstract + identifier columns. We use the generic
# `parquet` extractor here; `wikipedia_structured` would silently
# produce zero chunks against the flat schema.
[extract]
type = "parquet"
content_column = "text"
label_column = "title"
url_column = "url"

[chunk]
type = "paragraph"
max_chars = 1024
overlap_chars = 128

[index]
fts = true
vector = true

# No filter — Simple English is already small (~230K articles) and the
# whole point of Layer 0 is "ingest the lot, don't slice it further".

# No enrichment — Layer 0 is for fast grounding, not atlas depth.
[enrichment]
enabled = false
