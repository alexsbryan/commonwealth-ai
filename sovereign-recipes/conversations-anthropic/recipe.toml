[corpus]
id = "conversations-anthropic"
name = "Claude conversations"
description = "Local-only ingest of the user's claude.ai chat export. Settings → Imports installs this recipe by unzipping the Anthropic export the user picks and dropping its `conversations.json` at the canonical path below. NEVER share — third parties the user discussed have not consented to gossip."
license = "private"
mesh_sharing = false
size_compressed_gb = 0
size_indexed_gb = 0

# Canonical landing zone. The desktop's Settings → Imports tab
# (`sovereign-desktop/src-tauri/src/import_commands.rs::import_anthropic_zip`)
# extracts the `conversations.json` entry from the user-picked
# Anthropic export zip and writes it here before kicking off the
# install. CLI users may symlink manually:
#
#   ln -sf ~/Downloads/data-<uuid>-*/conversations.json \
#          ~/.sovereign/conversations/conversations.json
#
[acquire]
type = "local_file"
path = "~/.sovereign/conversations/conversations.json"

[extract]
type = "anthropic_export"

[chunk]
type = "threaded_turns"

[index]
fts = true
vector = true

# Tiered retrieval port (Phase B; spec
# `sovereign/docs/specs/CONV_TIERED_PORT.md`). Replaces the legacy
# atlas field-model pipeline that wedged in a Phase 1b parse-fail
# loop on the 16k-chunk import (see project memory
# `project_conv_anthropic_tiered_port_handoff`). The tiered runner
# (`corpus-engine/src/enrichment/tiered.rs`) runs per-conversation
# T2 entity-graph + T3 RAPTOR + motifs against the SQLite sidecar
# tables `conv_skeletons` / `conv_raptor_nodes` / `conv_motifs`.
[enrichment]
enabled = true
type = "tiered"
domain = "conversational"

# Atlas View rail groups corpora sharing this category under one
# "Conversations" header so the user's Sovereign-internal chats
# (`conversation-history`) and their imported Claude chats live
# side by side regardless of source.
[display]
category = "conversation"
icon = "chat-bubble"
