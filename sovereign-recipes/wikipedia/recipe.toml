[corpus]
id = "wikipedia"
name = "Wikipedia (English)"
description = """
English Wikipedia — Core scope: ~51K Wikipedia Vital Articles Level 5. The community-curated set of \
articles "an encyclopedia should cover" — stable across years, low maintenance burden compared to a \
pageview-based filter that would age out in months. Indexes in ~5–8 min on a M-series MacBook. Expand \
to the full ~6.7M-article dump from Settings → Knowledge once you've validated retrieval quality on \
the Core. Delta updates via monthly revision manifest.\
"""
license = "CC-BY-SA-4.0"
mesh_sharing = true
size_compressed_gb = 13.0
size_indexed_gb = 2.5

# The wikimedia/structured-wikipedia dataset ships as ZIP+JSONL rather than parquet
# shards. HuggingFace's parquet conversion API fails on this dataset (schema casting
# error), so we use BulkDownload directly to the September 2024 English snapshot.
#
# Note: Core scope still downloads the full 13GB ZIP — the filter applies at extract
# time. Embedding cost (the dominant cost) scales with what gets indexed, not what
# gets downloaded, so this is fine: ~51K accepted articles → ~5–8 min embed
# time instead of ~hours for the full 6.7M.
[acquire]
type = "bulk_download"
url = "https://huggingface.co/datasets/wikimedia/structured-wikipedia/resolve/main/20240916.en/enwiki_namespace_0.zip"
resume = true

# WikipediaJsonlExtractor streams articles from inside the ZIP, emitting one
# ExtractedDoc per section with full WikipediaChunkMetadata (section type,
# revision ID, Wikidata QID, page ID, outgoing links).
[extract]
type = "wikipedia_jsonl"
# controversy_patterns and factual_patterns default to the built-in pattern lists.

# ─── Core scope ──────────────────────────────────────────────────────
# Vital Articles Level 5 — community-curated list of ~51K mainspace
# articles editorially deemed "what an encyclopedia should cover."
# Stable across years (curator-pace, not viral-pace), so the bundled
# asset doesn't decay and the Core stays defensible without a
# regeneration cadence. Pageview-based filtering was considered but
# any specific month's data ages out within ~6 months — the freshness
# debt outweighed the small popularity-coverage gain.
#
# The list lives in sovereign-recipes/wikipedia/data/ and is copied
# into corpus-engine's OUT_DIR by build.rs at compile time,
# so this scope works fully offline. Removing the filter block (or
# running `expand_corpus` from the UI) promotes the corpus to the full
# 6.7M-article scope; the existing Core index is preserved and only
# the new articles run through embedding.
[[filter]]
type = "title_list"
list_file = "@bundled:vital_articles_l5"

[chunk]
type = "paragraph"
max_chars = 1024
overlap_chars = 128

[index]
fts = true
vector = true
# embedding_model and embedding_dimensions are auto-detected from the
# loaded model at ingest time.

# Pre-built snapshot — cold-start onboarding short-circuit. When a
# user's node loads `qwen-embedding-0.6b` and runs
# `sovereign corpus install wikipedia`, the engine downloads the
# 7.79 GB .tar.zst from HuggingFace and extracts it into
# ~/.svrnmesh/indexes/wikipedia/ instead of running the full
# acquire → extract → chunk → embed pipeline (~5–8 min on M-series,
# longer on other hardware). Atlas is included in the archive under
# indexes/wikipedia/atlas/.
#
# On embedding-model mismatch the restore is skipped with a clear log
# line and the normal pipeline runs — Option B is automatic.
[prebuilt]
# Snapshot 2026-09-09 (7.79 GB, 1,896,488 chunks). What changed from
# 2026-08-05 is the atlas: `atlas/` now carries the columnar store —
# articles.lance + edges.lance + atoms_ann.lance — in place of the SQLite link
# graph retired 2026-09-04. A restorer gets the graph the current code reads
# rather than one it would have to migrate.
#
# THIS ARCHIVE DECLARES NO EMBEDDER CONFIG, deliberately. Its chunk vectors are
# the 2026-04 mean-pooled set. They probe at cosine 0.7173 against this host's
# embedder under the family config (pooling=last) — below the 0.92 bar — so the
# publisher declined to name a space the vectors are not in and published with
# --publish-unverified-space (the probe landed in 38ebf8157; before it, the
# archive would have carried a false declaration). Restorers have only the
# cosine probe to judge this archive by and will refuse by name on mismatch.
# The fix is a re-embed on the current stack and a republish that declares;
# `sep` went through exactly that.
#
# NOTE ON WHAT THIS REPLACES: this field pointed at the 2026-05-23
# snapshot until 2026-08-05, even though a 2026-06-29 archive had been
# published to the same repo on 29 June — so every cold-start install for
# five weeks pulled a stale archive nobody intended to serve. If you
# publish a new snapshot, update this block IN THE SAME COMMIT — and
# `sovereign-recipes/registry.toml` `[recipes.prebuilt]` with it.
#
# The superseded 2026-08-05 snapshot was the first built from an index that had
# been through `corpus_engine::index::maintain`. That compaction is a
# cold-start user's search latency, not a cosmetic difference: lancedb
# flat-scans everything appended since the last index build, which had reached
# 2218ms per search, and one maintenance pass took end-to-end search 5.33s ->
# 2.96s (-43%).
hf_repo = "svrnmesh/wikipedia-index"
hf_filename = "wikipedia-qwen-embedding-0.6b-2026-09-09.tar.zst"
sha256 = "c767ab6861a4d40cf18484b66d42955391d47b9159535ac4e7befb20ce798522"
compatible_embedding_model = "qwen-embedding-0.6b"

# Delta updates: the manifest at manifest_url maps article URL → revision_id.
# A manifest-generation job reads omarkamali/wikipedia-monthly (latest.en,
# ~7M articles) and publishes the manifest. CorpusUpdater uses it to
# add/update/delete articles incrementally.
[update]
manifest_url = "https://updates.sovereign.dev/manifests/wikipedia-en.json"
auto_update = true

# Enrichment is OFF for Core — Layer 1 prioritises time-to-grounded over
# atlas depth. Re-enable once expanded to Full or by overriding via a
# user recipe.
[enrichment]
enabled = false
type = "field_model"
domain = "multi"
prompt_version = "1.0.0"

[enrichment.clustering]
min_cluster_size = 100
epsilon = 0.08
label_sample_size = 5

[enrichment.alignment]
alignment_threshold = 0.58
min_chunks_for_discovery = 150

[enrichment.fault_lines]
proximity_threshold = 0.55
min_confidence = 0.65
