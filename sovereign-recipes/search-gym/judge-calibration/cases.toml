ground_truth = "PASS"
ground_truth_rationale = "Has 'what is' but reads as a natural search query — humans type queries with leading 'what is' all the time. Adversarial: borderline phrasing that's still valid search behaviour."

[[case]]
id = "reformulation_adversarial_02"
category = "reformulation"
assertion = "The search query consists of key entities or noun phrases rather than echoing the user's full prompt verbatim."
