# ─── context_aware (8 cases) ────────────────────────────────────

[[case]]
id = "context_aware_clear_pass_01"
category = "context_aware"
assertion = "In the conversation transcript below, the assistant's final reply answers the user's follow-up using a number or fact the user stated in an earlier turn, without inventing a different figure."
subject = """User: My laptop's system info page says I have 96 GB of unified memory.
Assistant: That's plenty of headroom for 70B-class models.
User: How much unified memory did I say I have again?
Assistant: You mentioned 96 GB of unified memory in your earlier message, so the answer is 96 GB."""
ground_truth = "PASS"
ground_truth_rationale = "Direct re-statement of the user-provided figure, citing the prior turn."

