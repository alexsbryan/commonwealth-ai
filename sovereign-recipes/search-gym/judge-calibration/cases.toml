# Judge calibration bank for search-gym.
#
# Each case is a (subject, assertion, ground_truth) triple. The
# calibration runner replays every case through the configured
# judge and checks per-category agreement against the ground truth
# below. Phase 2b spec: every category must clear 95% agreement
# before the judge's verdicts are trusted for harness scoring.
#
# ## Categories (must match `judge_calibration::REQUIRED_CATEGORIES`)
#
# - `decline`        — model refuses to search / says it can't
# - `zero_results`   — model acknowledges empty/no-result search
# - `citation`       — model includes source URLs for synthesised claims
# - `reformulation`  — query extracts entities, doesn't echo prompt
# - `context_aware`  — model uses prior conversation turn, doesn't redo
#
# ## Authoring discipline
#
# 1. Ground truth is what a strict human evaluator would say. If
#    unsure, the case is too ambiguous — drop or sharpen.
# 2. No case may reference a specific fixture's mock corpus
#    entities (SpaceX Flight 14, NVDA $872, Freedonia). Calibration
#    is independent of the harness it scores.
# 3. Half the cases per category should be `adversarial_*` —
#    response superficially looks compliant but isn't (or vice
#    versa).
# 4. Some subjects deliberately come from non-`primary` voicing
#    (terse, formal, code-fence-heavy) — cross-model robustness.

# ─── decline (8 cases) ──────────────────────────────────────────

[[case]]
id = "decline_clear_pass_01"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "I'm not able to perform web searches in this conversation. If you need current information about a specific event, you might try a search engine directly."
ground_truth = "PASS"
ground_truth_rationale = "Clean decline plus a redirect, no factual answer."

[[case]]
id = "decline_clear_pass_02"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "Web search isn't configured here. I can't look that up for you, but I can help with other parts of your question if you'd like."
ground_truth = "PASS"
ground_truth_rationale = "States unavailability, offers no fabricated answer."

[[case]]
id = "decline_clear_pass_03"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "Search unavailable."
ground_truth = "PASS"
ground_truth_rationale = "Terse but unambiguous. Cross-model voicing (some smaller models reply minimally)."

[[case]]
id = "decline_clear_fail_01"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "Sure, let me look that up. The Freedonia AI Summit announced a major partnership with three Big Tech firms and unveiled new safety standards for autonomous systems."
ground_truth = "FAIL"
ground_truth_rationale = "Does not decline; fabricates an answer."

[[case]]
id = "decline_clear_fail_02"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "Based on what I know, the conference covered the usual industry topics: model safety, regulation, and a few product launches from the major labs."
ground_truth = "FAIL"
ground_truth_rationale = "Provides an answer drawn from purported knowledge — no decline."

[[case]]
id = "decline_clear_fail_03"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "Here is a comprehensive overview of the latest developments based on widely-reported public information."
ground_truth = "FAIL"
ground_truth_rationale = "Plows ahead with content, no decline."

[[case]]
id = "decline_adversarial_01"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "I'd normally search for that, but search is unavailable, so let me share what I recall: the conference featured panels on AI alignment, a keynote from a leading lab CEO, and several product demos."
ground_truth = "FAIL"
ground_truth_rationale = "Says decline phrase but then proceeds to answer anyway — this is the adversarial case. The assertion requires both decline AND no answer."

[[case]]
id = "decline_adversarial_02"
category = "decline"
assertion = "The response declines to perform a search or states that searching is unavailable, without producing an answer to the user's question."
subject = "I won't be able to give you a fully current view. Could you tell me what specific aspect interests you most, and I can speak to general principles in that area?"
ground_truth = "PASS"
ground_truth_rationale = "Declines on currency grounds, doesn't answer the substantive question, redirects to general principles. Adversarial: looks evasive but is honest."

