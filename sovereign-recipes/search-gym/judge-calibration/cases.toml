Assistant: Got it.
User: How much memory?
Assistant: Based on Strix Halo specs, you have 96 GB."""
ground_truth = "FAIL"
ground_truth_rationale = "Right number, wrong reasoning — claims it comes from specs rather than the user's prior statement. Adversarial: correct figure but bypasses context (model could have hallucinated 96 happen to match)."
