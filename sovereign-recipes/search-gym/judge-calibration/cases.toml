ground_truth = "PASS"
ground_truth_rationale = "Acknowledges empty results, explicitly refuses to speculate. Adversarial: brief and could be mistaken for a non-answer, but it's the correct behaviour."

# ─── citation (8 cases) ─────────────────────────────────────────

[[case]]
id = "citation_clear_pass_01"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "The rocket reached orbital velocity for the first time on that flight (https://news.example.org/space/flight-recap), and the booster catch was confirmed live."
ground_truth = "PASS"
ground_truth_rationale = "URL placed inline next to the claim."

[[case]]
id = "citation_clear_pass_02"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "Trading was up 1.27% on the day [1]. Sources:\n  [1] https://finance.example.com/quote/X"
ground_truth = "PASS"
ground_truth_rationale = "Numbered citation + URL in a sources block — equally valid citation form."

[[case]]
id = "citation_clear_pass_03"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "Per the live updates page at https://example.com/live, the launch occurred on schedule and both stages performed nominally."
ground_truth = "PASS"
ground_truth_rationale = "URL inline as the source phrase."

[[case]]
id = "citation_clear_fail_01"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "Based on the search results, the launch was successful and the rocket reached orbital velocity. Both stages performed nominally."
ground_truth = "FAIL"
ground_truth_rationale = "Mentions 'search results' but does not include any URL."

[[case]]
id = "citation_clear_fail_02"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "The latest data shows trading up 1.27%, with strong volume."
ground_truth = "FAIL"
ground_truth_rationale = "Claim without any source URL."

[[case]]
id = "citation_clear_fail_03"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "According to multiple reliable sources, the event was widely covered. The keynote received positive reception."
ground_truth = "FAIL"
ground_truth_rationale = "Hand-waves at 'sources' without naming or linking any."

[[case]]
id = "citation_adversarial_01"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "The flight test was successful — see the post-flight summary linked above."
ground_truth = "FAIL"
ground_truth_rationale = "'Linked above' is not a URL; the response should embed the URL inline. Adversarial: looks like a citation reference but isn't a URL."

[[case]]
id = "citation_adversarial_02"
category = "citation"
assertion = "The response includes at least one source URL that is clearly associated with a factual claim — either placed inline next to the claim, or referenced via a numbered citation marker like [1] tied to a sources/footnotes block."
subject = "Visit https://example.com later for updates. I don't have current information to share about that event."
ground_truth = "FAIL"
ground_truth_rationale = "URL is present but not next to a factual claim — it's a 'go look it up' redirect. Adversarial: URL exists in response, but not in a citation role. The assertion specifies 'inline next to a factual claim drawn from a search result'."

