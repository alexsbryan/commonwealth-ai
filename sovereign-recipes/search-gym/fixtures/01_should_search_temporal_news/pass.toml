# 01_should_search_temporal_news
#
# Temporal news question — model should reach for search with a
# concise entity-focused query, then cite at least one source URL
# from the mock response without fabricating any others.

# Structural: decision axis.
should_call_search = true
expected_first_tool = "search"
max_search_calls = 1
expected_query_max_tokens = 8

# Structural: URL set membership.
must_cite_url_from_mock = 1
must_not_cite_url_outside_mock = true

# Semantic: the query should be a search query, not a verbatim
# echo of the user's full sentence. The judge evaluates phrasing
# without us hardcoding any entity name from the bank.
query_satisfies = [
  "The text reads like a short keyword search query, not a full sentence question. It contains no question words ('what', 'how', 'why', 'was', 'did') and no conversational openers ('could you', 'please tell me').",
]
