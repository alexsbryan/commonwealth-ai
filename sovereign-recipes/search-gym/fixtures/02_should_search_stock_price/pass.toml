# 02_should_search_stock_price
#
# Realtime financial data — exemplar "training-data can't answer this"
# question. Model must search; query should be short and entity-only.

should_call_search = true
expected_first_tool = "search"
max_search_calls = 1

# Query must reference the ticker. Either ticker or company name
# acceptable (case-insensitive).
expected_query_contains = ["nvda"]

# Don't echo the user prompt's verbatim wording.
expected_query_not_contains = ["what's the current"]

expected_query_max_tokens = 6

must_cite_url_from_mock = 1
must_not_cite_url_outside_mock = true
