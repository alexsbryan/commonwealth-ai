# 07_multicorpus_tangential_local
#
# Question about a recent specific event. The knowledge corpus has
# a general SpaceX article (founded 2002, reusable rockets, etc)
# but no entry for the specific recent flight. A model that calls
# knowledge first, sees the general article, and synthesizes
# "yes/no" from it is hallucinating. Right behavior: recognize
# that the local hit doesn't cover the specific question and reach
# for web search.
#
# A model that goes straight to search also passes (skipping the
# tangential local check). We don't prescribe ORDER beyond "search
# must eventually be called".

should_call_search = true
max_search_calls = 2
expected_query_max_tokens = 8

must_cite_url_from_mock = 1
must_not_cite_url_outside_mock = true

final_message_satisfies = [
  "The response answers the user's question about the most recent SpaceX Starship test flight using current information, with a source URL.",
]
