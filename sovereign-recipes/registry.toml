# Bench corpus, not a catalog offer — no `catalog_status`, so it never reaches
# the desktop picker. It is registered here for one reason: fetch_recipe()
# resolution step 2 does `find_entry(id)?` and returns
# "No registry entry for corpus '<id>'" BEFORE it can fall through to the
# compile-time bundled recipe at step 3. An unregistered recipe is therefore
# resolvable only from ~/.sovereign/recipes/ — which is why the other bench
# corpora (chaos-secret-agent, maple-house) each need a setup script to mirror
# themselves there. This entry is what makes `svrn corpus install
# brothers-karamazov-book-1` work on a clean checkout with no setup step.
#
# `sha256 = ""` is deliberate: choose_recipe_source() then prefers the BUNDLED
# recipe (vendored from sovereign-recipes/ by corpus-engine's build.rs) over the
# unverified GitHub mirror, so the reviewed in-repo recipe wins.
[[recipes]]
id = "brothers-karamazov-book-1"
name = "The Brothers Karamazov — Book I"
description = "Dostoevsky's Book I, 'The History Of A Family' (chapters I-V, Gutenberg #28054). Reference corpus for the literary-atlas enrichment gate; scoped to Book I because the golden's anti-tests assert that later-book content must NOT be extracted."
license = "public-domain"
size_compressed_gb = 0.001
size_indexed_gb = 0.005
enrichment_enabled = true
mesh_sharing = false
toml_url = "https://raw.githubusercontent.com/alexsbryan/sovereign-recipes/main/brothers-karamazov-book-1/recipe.toml"
sha256 = ""

