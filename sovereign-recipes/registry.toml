# sovereign-recipes registry — the canonical corpus catalog.
#
# SINGLE SOURCE OF TRUTH. corpus-engine vendors this file at build time
# (build.rs → OUT_DIR) as the offline bundled fallback — there is no
# separate hand-maintained snapshot to keep in sync. To add or change a
# corpus: edit its recipe under sovereign-recipes/<id>/recipe.toml and
# update the matching [[recipes]] entry here. Each entry's catalog_status
# drives the desktop picker bucket: featured | preview | hidden.
#
schema_version = 1
registry_url = "https://raw.githubusercontent.com/alexsbryan/sovereign-recipes/main/registry.toml"

