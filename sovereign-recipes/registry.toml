# sovereign-recipes registry — the canonical corpus catalog.
#
# SINGLE SOURCE OF TRUTH. corpus-engine vendors this file at build time
# (build.rs → OUT_DIR) as the offline bundled fallback — there is no
# separate hand-maintained snapshot to keep in sync. To add or change a
# corpus: edit its recipe under sovereign-recipes/<id>/recipe.toml and
# update the matching [[recipes]] entry here. Each entry's catalog_status
# drives the desktop picker bucket: featured | preview | hidden.
#
schema_version = 1
registry_url = "https://raw.githubusercontent.com/alexsbryan/sovereign-recipes/main/registry.toml"

[[recipes]]
id = "wikipedia"
name = "Wikipedia (English)"
description = "Wikipedia Core scope: ~51K Vital Articles Level 5 (community-curated, ~2.5 GB indexed). Cold-start onboarding now downloads an 8.7 GB pre-built snapshot from HuggingFace and extracts in seconds — no local embedding. Expandable to the full 6.7M-article dump in-place via Settings → Knowledge."
license = "CC-BY-SA-4.0"
size_compressed_gb = 13.0
size_indexed_gb = 2.5
enrichment_enabled = false
mesh_sharing = true
toml_url = "https://raw.githubusercontent.com/alexsbryan/sovereign-recipes/main/wikipedia/recipe.toml"
sha256 = ""
catalog_status = "featured"

[recipes.prebuilt]
hf_repo = "svrnmesh/wikipedia-index"
hf_filename = "wikipedia-qwen-embedding-0.6b-2026-05-23.tar.zst"
