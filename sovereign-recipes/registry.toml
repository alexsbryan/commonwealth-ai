size_indexed_gb = 2.5
enrichment_enabled = false
mesh_sharing = true
toml_url = "https://raw.githubusercontent.com/alexsbryan/sovereign-recipes/main/wikipedia/recipe.toml"
sha256 = ""
catalog_status = "featured"

[recipes.prebuilt]
