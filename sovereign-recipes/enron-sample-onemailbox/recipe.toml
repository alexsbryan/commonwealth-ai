# Single-mailbox Enron variant — fast iteration target.
#
# Same extractor + filter + atlas pipeline as `enron-sample` but
# scoped to Kenneth Lay's mailbox (`maildir/lay-k/`, ~6k messages,
# 1-2 hour ingest vs 8-12 hours for the full 500k-message corpus).
# Used to tune the reconciliation policy on the train split before
# committing to a full-corpus run.
#
# Operator setup: same tarball as `enron-sample`. This recipe just
# points at the lay-k subdirectory.

[corpus]
id = "enron-sample-onemailbox"
name = "Enron Email (Kenneth Lay mailbox)"
description = "Iteration target for the architecture-over-Enron Phase 5 measurement loop. Lay's mailbox alone covers ~6k messages and most of the canonical entities in `sovereign/bench/enron/questions.toml` train split, so reconciliation-policy tuning converges fast."
license = "public-domain"
schema_version = 1
mesh_sharing = false
size_compressed_gb = 0.02
size_indexed_gb = 0.3

[acquire]
type = "local_file"
path = "~/.sovereign/corpora-staging/enron/maildir/lay-k"

[extract]
type = "email"
max_body_bytes = 4194304
max_attachment_bytes = 0

[[filter]]
type = "boilerplate"
strip_signatures = true
strip_quoted_replies = true
strip_disclaimers = true
min_body_chars_after_strip = 20

[chunk]
type = "paragraph"
max_chars = 2000
overlap_chars = 200

[index]
fts = true
vector = true

[enrichment]
enabled = true
type = "atlas"
domain = "conversational"
prompt_version = "enron-v0"

[enrichment.reconciliation]
name_similarity_threshold = 0.85
cross_origin_required_signals = 2
judge_when_uncertain = true
judge_trials = 3

[enrichment.reconciliation.column_aware]
max_entities_per_column = 5000

[enrichment.reconciliation.column_aware.column_headers]
person_headers = ["employee", "person", "name", "trader", "owner", "contact", "attendee"]
organization_headers = ["counterparty", "customer", "vendor", "supplier", "company", "organization", "client", "broker"]
place_headers = ["city", "state", "country", "location"]

[display]
category = "email"
icon = "mail"
