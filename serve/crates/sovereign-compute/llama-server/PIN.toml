# The llama-server the daemon ships: the llama.cpp it is built from, whether
# llguidance is on, and the patches applied on top, each by its sha256.
#
# build.sh builds from this and copies it into llama-server.manifest.toml
# beside the binary. The daemon compiles this file in
# (sovereign_compute::llama_router::build_pin) and refuses a shipped binary
# whose manifest says anything else, so changing a line here means rebuilding
# the server.
#
# The commit is a pull request head: it was held equal to the vendored
# llama-cpp-sys-4's LLAMA_CPP_COMMIT while the conformance battery compared
# the embedded engine with this server. Both went in ENGINE_SWAP_PLAN G2/G3.

llama_cpp_commit = "035e22731a7fd70b9854b3a2d64ec68e9b1a45d3"
llguidance = true
# Installed side by side, all built with the RPC backend on: the router, and
# the server a peer runs to lend its tensors to another node's router.
binaries = ["llama-server", "ggml-rpc-server"]

# Applied in this order with `patch -p1` from the source root. A test holds
# this list equal to patches/, file for file and digest for digest.
[[patches]]
file = "ggml-vulkan-alias-dependency.patch"
sha256 = "a39fc31da3824f9ab2ca64623e6ef81395f815077a0fcbbe1e007d9fe6445685"

[[patches]]
file = "pooled-context-skips-lm-head.patch"
sha256 = "60e5568c9860cc8a3c8aad81e31db0445002ff6ade094ceaf77a9e74829f6e73"

[[patches]]
file = "rank-pooling-reuses-prompt-prefix.patch"
sha256 = "0ec4a56b8f19bf868b9a10eadd634eea9b45671f8e1e9aca92b59b0fb71762af"
