[package]
name = "sovereign-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sovereign-contracts = { workspace = true }
sovereign-time = { workspace = true }
# The pure-HTTP OICP client (RemoteApiProvider / SplitInferenceProvider) was
# extracted here; re-exported at `sovereign_inference::remote::*`.
oicp-client = { workspace = true }
oicp-types = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
sysinfo = "0.34"
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../shared/crates/workspace-hack" }

# No code in this crate calls llama.cpp since the engine was deleted
# (ENGINE_SWAP_PLAN G2). The per-OS llama-cpp dependencies and the
# `windows-*` features below stay until G3 drops them with the vendored
# crates and the toolchain, in one step.
#
# llama.cpp's GPU backend is picked per-OS. Linux uses Vulkan because
# ROCm crashes in `ggml_cpu_extra_work_size` during Qwen3-A3B MoE
# inference on gfx1151 — a secondary CPU SEGV after a primary GPU
# memory fault. Upstream regression tracked at
# https://github.com/ggml-org/llama.cpp/issues/20176 (introduced by
# PR #20087); maintainer-acknowledged workaround in #19880 is to use
# the Vulkan backend, which is GPU-accelerated on the same hardware
# and bypasses the buggy ROCm+MoE path entirely. Revisit once #20176
# lands a fix in a llama-cpp-2 release we can pin to.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# llama-cpp-4 0.5.1 (bumped from 0.4.2 on 2026-08-03). The crate bundles
# llama.cpp 221f0f63, 253 commits past 0.4.2's 99f3dc3 / tag b9982; our
# vendored copy is fast-forwarded one further commit to 1464c62d88 — see
# vendor/llama-cpp-sys-4/LLAMA_CPP_COMMIT.
#
# WHY THIS BUMP. Metal's supports_op rejected the F16 `csa_top_k_mask` ADD
# that DeepSeek-V4's build_top_k_mask emits, so a distributed DSv4 run aborted
# on the Metal worker. Upstream #26465 ("metal : add F16 support for bin ops",
# 2026-08-02) widened the ADD/SUB/MUL/DIV/ADD_ID predicate from F32-only to
# F32-or-F16-with-matching-src-types, which is exactly that node. Landing with
# it: #26459 (Metal kernels for GGML_OP_DSV4_HC_{PRE,POST,COMB}) and, via the
# one-commit fast-forward, #25893 (Metal GGML_OP_LIGHTNING_INDEXER).
#
# Retains everything 0.4.2 was pinned for — MTP single-file self-speculation
# (PR #22673, our original reason for leaving llama-cpp-2 0.1.146), the GLM-5
# long-context dense-mask fix (#23610), and the two-model `draft-mtp` path with
# Gemma-4 drafter support (#23398).
#
# API SHAPE CHANGE at 0.5.1: `llama_model_params.{use_mmap,use_mlock}` collapsed
# into `load_mode` (`LlamaLoadMode`), and `with_load_mtp` arrived for DSv4 MTP
# weights. `LlamaModelParams::{use_mmap,use_mlock}()` survive as derived getters.
# The vendored crate still carries exactly TWO sovereign divergences — the
# tensor-split/devices/-ot model-param builders and the static-link default —
# and the aarch64 `c_char` cast we used to carry is now upstream. Root Cargo.toml
# holds the full ledger. See `crate::llama` for the migration shim that absorbs
# API shape changes.
#
# default-features = false drops the vendored default `openmp` on macOS.
# Apple clang ships no OpenMP runtime, so the `openmp` feature makes
# llama-cpp-sys-4 hunt for a Homebrew libomp and build ggml with
# -DGGML_OPENMP=ON — which then links libomp.dylib, a NON-self-contained
# runtime dep the .app would have to bundle (the same -dylib trap the
# static-link cutover closed; see [[project_desktop_linux_build_deps]]).
# ggml's native pthread threadpool covers CPU ops without it, and Metal
# does the real work. We re-add `mtmd` (the other half of the vendored
# default). Linux keeps openmp below — libgomp is a standard system lib
# there, so it's a packageable dep, not a bundling problem.
#
# ── Metal is aarch64-ONLY. Do not re-add it to the x86_64 leg. ──────────
# `hardware.rs::detect_gpu` already refuses to offload on Intel Macs ("Metal +
# llama.cpp on discrete AMD GPUs produces garbage output"), so Metal was compiled
# in, unusable, and able only to hurt. It is not merely useless there — it is
# fatal, because REGISTERING the backend is enough: ggml's own scheduler offloads
# ops to any registered device once a batch reaches `op_offload_min_batch_size`
# (32), regardless of n_gpu_layers. Our "no GPU" verdict governs sovereign's
# choices, never ggml's scheduler.
#
# On a Mac without unified memory (`MTLDevice.hasUnifiedMemory == false` — any
# Intel Mac) ggml sets `use_shared_buffers = false`, and the resulting non-shared
# buffer paths wrap HOST pointers via `newBufferWithBytesNoCopy:`, which returns
# nil unless the pointer is page-aligned. Two mirror-image failure modes, both
# observed in the field on a MacBookPro16,1 (2026-07-27):
#   ggml-metal-device.m:1743  GGML_ASSERT(buf_src)  -> abort()  "exited by signal"
#   ggml-metal-device.m:1800  GGML_ASSERT(buf_dst)  -> abort()
#   ggml-metal-device.m:1776  dispatch_semaphore_wait(.., FOREVER) -> wedged thread
#                                                    "stopped responding (3 failed heartbeats)"
# Six daemon deaths in one morning; the crash stack ran through
# ggml_backend_sched_graph_compute_async under EmbedSlot::run_embed_batch_sync,
# i.e. a slot that had loaded cleanly as "cpu+accelerate".
#
# Verified on that host, same binary, same workload: with the Metal backend
# registered the daemon SIGABRTs inside embed_batch within ~5 minutes; with
# `GGML_METAL_DEVICES=0` (zero Metal devices registered) it serves the same embed
# batches indefinitely with zero asserts. Dropping the feature is the build-time
# form of that, so no user has to know an env var exists.
#
# Apple Silicon is untouched below. Nothing outside macOS-x86_64 changes.
llama-cpp-4 = { version = "0.5.1", default-features = false, features = ["metal", "mtmd"] }
# RPC distributed inference: enable the sys crate's `rpc` feature directly
# (builds ggml with GGML_RPC=ON + binds ggml_backend_rpc_add_server) rather
# than llama-cpp-4's `rpc` feature, whose binding module targets an older
# llama.cpp API (ggml_backend_rpc_add_device / 1-arg init) that no longer
# exists in the pinned llama.cpp. We call the sys symbols directly from
# embedded/model_slot.rs instead.
llama-cpp-sys-4 = { version = "0.5.1", features = ["rpc"] }

# macOS x86_64 (Intel). Same as the aarch64 leg MINUS `metal` — see the block
# above for why registering that backend here is fatal, not merely wasteful.
# CPU via ggml's pthread pool + Accelerate, which is what these hosts already ran.
[target.'cfg(all(target_os = "macos", not(target_arch = "aarch64")))'.dependencies]
llama-cpp-4 = { version = "0.5.1", default-features = false, features = ["mtmd"] }
llama-cpp-sys-4 = { version = "0.5.1", features = ["rpc"] }

[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-4 = { version = "0.5.1", features = ["vulkan"] }
llama-cpp-sys-4 = { version = "0.5.1", features = ["rpc"] }

# Windows is the first OS that wants more than one backend, so unlike macOS
# (metal) / Linux (vulkan) — which hardcode their single backend above — the
# Windows backend is a CPU BASELINE plus feature-selected GPU layers (see the
# `[features]` block). CPU is the portable, SDK-free default that builds on the
# stock windows-2022 runner (preinstalled MSVC + CMake). Mirrors macOS's
# default-features=false + mtmd (CPU via ggml's pthread pool, no openmp dylib
# hunt); keeps the sys `rpc` feature so embedded/model_slot.rs's direct
# ggml_backend_rpc_add_server FFI links here too.
[target.'cfg(target_os = "windows")'.dependencies]
llama-cpp-4 = { version = "0.5.1", default-features = false, features = ["mtmd"] }
llama-cpp-sys-4 = { version = "0.5.1", features = ["rpc"] }

# Windows GPU backends layer onto the CPU baseline; the release matrix builds
# one variant per leg via `--features`. No-ops on macOS/Linux (which never pass
# them). `vulkan-1.dll` ships with the user's GPU driver, so the GPU loader is
# not bundled — only the BUILD needs the matching SDK (Vulkan SDK / CUDA Toolkit).
#   (default)                 -> CPU, universal
#   --features windows-vulkan -> NVIDIA + AMD + Intel GPU
#   --features windows-cuda   -> NVIDIA-optimized (deferred until benchmarks justify)
[features]
windows-vulkan = ["llama-cpp-4/vulkan"]
windows-cuda = ["llama-cpp-4/cuda"]

[dev-dependencies]
# `engine_capture`'s test records through `double::TestProvider`.
sovereign-contracts = { workspace = true, features = ["test-fixtures"] }
# `llguidance_parity`'s F3 fixture proves the plan schema compiles under the
# real engine; the schema moved to `sovereign-contracts::planner_schema`
# 2026-09-21, so the dev-dep on the runtime hub is gone.
tempfile = "3"
# `llguidance_parity` pins that the schemas our callers send compile under
# llguidance; nothing in the library links it since the engine went (es-g2).
llguidance = { workspace = true }

[lints]
workspace = true
