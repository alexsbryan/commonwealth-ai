[workspace]
resolver = "2"
members = [
    "crates/sovereign-core",
    "crates/sovereign-inference",
    "crates/sovereign-store",
    "crates/sovereign-tools",
    "crates/sovereign-mesh",
    "crates/sovereign-server",
    "crates/sovereign-desktop/src-tauri",
    "crates/sovereign-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sovereign-core = { path = "crates/sovereign-core" }
sovereign-inference = { path = "crates/sovereign-inference" }
sovereign-store = { path = "crates/sovereign-store" }
sovereign-tools = { path = "crates/sovereign-tools" }
sovereign-mesh = { path = "crates/sovereign-mesh" }
corpus-engine = { path = "../corpus-engine" }

# Shared dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
toml = "0.8"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
