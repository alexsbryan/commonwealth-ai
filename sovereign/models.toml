# models.toml — Sovereign Model Manifest
#
# Source of truth for slot configuration per hardware profile.
# The hardware detector selects a profile; the setup/download flow reads
# this file to know which files to fetch and which family to assign.
#
# Each slot entry specifies:
#   repo        HuggingFace repo ID (for download)
#   file        Exact GGUF filename within that repo
#   family      ModelFamily variant (drives default quirks)
#   quant       Quantisation label (informational, for display)
#   size_gb     Approximate on-disk size after download
#   thinking    Whether this slot uses thinking mode (bool)
#               Fast slot: always false
#               Thoughtful slot: true unless family is AlwaysOn or None
#   hf_url      Direct link for the developer/user
#
# Optional [profiles.X.Y.quirks_override] tables override individual
# fields from the family's default_quirks(). Only specify what differs.
#
# Optional [profiles.X.Y.capabilities] tables declare the slot's OICP
# capability profile (per spec §2.4, levels 0..=4 = none/basic/moderate/
# strong/exceptional). Consumed by `sovereign-mesh` to score backends
# when routing synthesis across a Commonwealth mesh — a Joiner running
# a 1.7B picks the Founder's 27B for `Analysis ≥ 3` requests, etc.
# Absent = BYOM / legacy: mesh routing falls back to conservative
# defaults. Capabilities: general, code, analysis, math, creative,
# instruction, multilingual, vision, long_context (snake_case keys).
#
# Optional `base_name` field identifies the model across quantisation
# and repo variants. A slot declaring `base_name = "Qwen3.5-27B"` will
# be used for ANY GGUF whose filename contains that string — so the
# same capability row covers Q4_K_M, Q8_0, Q5_K_S, bartowski's
# `Qwen_Qwen3.5-27B-*.gguf`, and a local `Qwen3.5-27B.Q8_0.1.gguf`.
# Longest base_name match wins when multiple would apply (so
# `"Qwen3.5-35B-A3B"` outranks `"Qwen3.5-35B"`).
#
# ── Fast slot notes ──────────────────────────────────────────────────────────
# Stays on Qwen3 (not Qwen3.5) across all profiles. Reasons:
#   1. Qwen3.5 small models (0.8B, 2B) show thinking-loop instability
#      even with /no_think. Not acceptable for a <200ms classification call.
#   2. Qwen3.5 carries vision encoder weights. The Fast slot does routing
#      only — no multimodal input ever arrives here.
#   3. Qwen3-1.7B is well-validated for structured JSON output at this size.
# The Fast slot does NOT scale up with hardware. A larger router buys
# nothing for classification quality and wastes always-resident VRAM.
#
# ── Thoughtful slot notes ────────────────────────────────────────────────────
# Switches to Qwen3.5 at low_mem/default/high/very_high. Qwen3.5-9B
# measurably outperforms Qwen3-8B on GPQA Diamond and tool calling (BFCL-V4).
# The 35B-A3B surpasses Qwen3-235B-A22B with only 3B active parameters.
#
# The high profile uses Qwen3.5-27B, which requires ~16.5 GB VRAM at Q4_K_M.
# The hardware detector must confirm ≥20 GB free VRAM before selecting this
# profile. If VRAM is 16–19 GB, fall through to default (Qwen3.5-9B).
#
# ── Embed slot notes ─────────────────────────────────────────────────────────
# Qwen3-Embedding is purpose-built for retrieval. Qwen3.5 is generative with
# a vision backbone — not a replacement. The 0.6B model is used as
# always-resident for cpu_only/low_mem/default; 4B for high/very_high.
# ─────────────────────────────────────────────────────────────────────────────

[profiles.cpu_only]

[profiles.cpu_only.fast]
repo     = "Qwen/Qwen3-0.6B-GGUF"
file     = "Qwen3-0.6B-Q4_K_M.gguf"
family   = "Qwen3"
quant    = "Q4_K_M"
size_gb  = 0.4
thinking = false
hf_url   = "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF"
# Fast slot only does intent classification + JSON routing. We don't
# advertise it as a synthesis candidate; mesh routing filters it
# out as a "no peer should ever prefer this" floor.
base_name = "Qwen3-0.6B"
[profiles.cpu_only.fast.capabilities]
general     = 1
instruction = 2

[profiles.cpu_only.thoughtful]
repo     = "Qwen/Qwen3-4B-GGUF"
file     = "Qwen3-4B-Q4_K_M.gguf"
family   = "Qwen3"
quant    = "Q4_K_M"
size_gb  = 2.6
thinking = false  # thinking=false on CPU: latency renders it unusable
hf_url   = "https://huggingface.co/Qwen/Qwen3-4B-GGUF"
# 4B at Q4 on CPU — competent floor for general Q&A but below
# the threshold where it measurably outperforms bigger quants.
base_name = "Qwen3-4B"
[profiles.cpu_only.thoughtful.capabilities]
general     = 2
analysis    = 1
code        = 1
instruction = 2
math        = 1

[profiles.cpu_only.embed]
repo    = "Qwen/Qwen3-Embedding-0.6B-GGUF"
file    = "Qwen3-Embedding-0.6B-Q4_K_M.gguf"
family  = "Qwen3Embedding"
quant   = "Q4_K_M"
size_gb = 0.4
thinking = false
hf_url  = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF"
[profiles.cpu_only.embed.quirks_override]
"embed.output_dimensions" = 1024

# ─────────────────────────────────────────────────────────────────────────────

[profiles.low_mem]

[profiles.low_mem.fast]
repo     = "Qwen/Qwen3-0.6B-GGUF"
file     = "Qwen3-0.6B-Q8_0.gguf"
family   = "Qwen3"
quant    = "Q8_0"
size_gb  = 0.6
thinking = false
hf_url   = "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF"
base_name = "Qwen3-0.6B"
[profiles.low_mem.fast.capabilities]
general     = 1
instruction = 2

[profiles.low_mem.thoughtful]
repo     = "Qwen/Qwen3.5-4B-GGUF"
file     = "Qwen3.5-4B-Q4_K_M.gguf"
family   = "Qwen35"
quant    = "Q4_K_M"
size_gb  = 2.6
thinking = true
hf_url   = "https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF"
# Qwen3.5-4B with thinking-mode on a GPU: solid small-model
# reasoning. Outpaces Qwen3-4B on instruction following.
base_name = "Qwen3.5-4B"
[profiles.low_mem.thoughtful.capabilities]
general     = 2
analysis    = 2
code        = 2
instruction = 2
math        = 1

[profiles.low_mem.embed]
repo    = "Qwen/Qwen3-Embedding-0.6B-GGUF"
file    = "Qwen3-Embedding-0.6B-Q8_0.gguf"
family  = "Qwen3Embedding"
quant   = "Q8_0"
size_gb = 0.6
thinking = false
hf_url  = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF"
[profiles.low_mem.embed.quirks_override]
"embed.output_dimensions" = 1024

# ─────────────────────────────────────────────────────────────────────────────

[profiles.default]   # 8–19 GB VRAM (RTX 3080/3090, RTX 4070, M2 Pro 16-32 GB)

[profiles.default.fast]
repo     = "Qwen/Qwen3-1.7B-GGUF"
file     = "Qwen3-1.7B-Q4_K_M.gguf"
family   = "Qwen3"
quant    = "Q4_K_M"
size_gb  = 1.1
thinking = false
hf_url   = "https://huggingface.co/Qwen/Qwen3-1.7B-GGUF"
base_name = "Qwen3-1.7B"
[profiles.default.fast.capabilities]
general     = 1
instruction = 2

[profiles.default.thoughtful]
repo     = "bartowski/Qwen_Qwen3.5-9B-GGUF"
file     = "Qwen_Qwen3.5-9B-Q4_K_M.gguf"
family   = "Qwen35"
quant    = "Q4_K_M"
size_gb  = 5.5
thinking = true
hf_url   = "https://huggingface.co/bartowski/Qwen_Qwen3.5-9B-GGUF"
# Qwen3.5-9B at Q4_K_M: measurably outperforms Qwen3-8B on
# GPQA Diamond and BFCL-V4 (per Qwen's own evals). Strong
# general + analysis; competent code + math.
base_name = "Qwen3.5-9B"
[profiles.default.thoughtful.capabilities]
general     = 3
analysis    = 3
code        = 3
instruction = 3
math        = 2

[profiles.default.embed]
repo    = "Qwen/Qwen3-Embedding-0.6B-GGUF"
file    = "Qwen3-Embedding-0.6B-Q8_0.gguf"
family  = "Qwen3Embedding"
quant   = "Q8_0"
size_gb = 0.6
thinking = false
hf_url  = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF"
[profiles.default.embed.quirks_override]
"embed.output_dimensions" = 1024

# ─────────────────────────────────────────────────────────────────────────────

[profiles.high]   # 20–23 GB VRAM (RTX 4080, M2/M3 Max 36-48 GB)
                  # Requires ≥20 GB free VRAM. If <20 GB, hardware detector
                  # must fall through to profiles.default.

[profiles.high.fast]
repo     = "Qwen/Qwen3-1.7B-GGUF"
file     = "Qwen3-1.7B-Q8_0.gguf"
family   = "Qwen3"
quant    = "Q8_0"
size_gb  = 1.9
thinking = false
hf_url   = "https://huggingface.co/Qwen/Qwen3-1.7B-GGUF"
base_name = "Qwen3-1.7B"
[profiles.high.fast.capabilities]
general     = 1
instruction = 2

[profiles.high.thoughtful]
repo     = "bartowski/Qwen_Qwen3.5-27B-GGUF"
file     = "Qwen_Qwen3.5-27B-Q4_K_M.gguf"
family   = "Qwen35"
quant    = "Q4_K_M"
size_gb  = 16.5
thinking = true
hf_url   = "https://huggingface.co/bartowski/Qwen_Qwen3.5-27B-GGUF"
# Qwen3.5-27B with thinking: flagship open-weight reasoning
# model below the 70B tier. Strong across analysis + math +
# code; creative writing and long-form instruction are
# reliably coherent. This is the tier where the mesh starts
# paying off — a Joiner should route here for DeepQuery.
base_name = "Qwen3.5-27B"
[profiles.high.thoughtful.capabilities]
general     = 3
analysis    = 4
code        = 3
instruction = 4
math        = 3
creative    = 3

[profiles.high.embed]
repo    = "Mungert/Qwen3-Embedding-4B-GGUF"
file    = "Qwen3-Embedding-4B-Q4_K_M.gguf"
family  = "Qwen3Embedding"
quant   = "Q4_K_M"
size_gb = 2.5
thinking = false
hf_url  = "https://huggingface.co/Mungert/Qwen3-Embedding-4B-GGUF"
[profiles.high.embed.quirks_override]
"embed.output_dimensions" = 2560

# ─────────────────────────────────────────────────────────────────────────────

[profiles.very_high]   # ≥24 GB VRAM (RTX 4090, M2/M3/M4 Ultra 64-192 GB)

[profiles.very_high.fast]
repo     = "Qwen/Qwen3-1.7B-GGUF"
file     = "Qwen3-1.7B-Q8_0.gguf"
family   = "Qwen3"
quant    = "Q8_0"
size_gb  = 1.9
thinking = false
hf_url   = "https://huggingface.co/Qwen/Qwen3-1.7B-GGUF"
base_name = "Qwen3-1.7B"
[profiles.very_high.fast.capabilities]
general     = 1
instruction = 2

[profiles.very_high.thoughtful]
repo     = "bartowski/Qwen_Qwen3.5-35B-A3B-GGUF"
file     = "Qwen_Qwen3.5-35B-A3B-Q4_K_M.gguf"
family   = "Qwen35"
quant    = "Q4_K_M"
size_gb  = 18.5
thinking = true
hf_url   = "https://huggingface.co/bartowski/Qwen_Qwen3.5-35B-A3B-GGUF"
# Qwen3.5-35B-A3B: sparse MoE that matches Qwen3-235B-A22B on
# benchmarks with only 3B active params. Analysis exceptional,
# everything else strong. Top tier for federated synthesis.
# `Qwen3.5-35B-A3B` wins over a hypothetical `Qwen3.5-35B`
# substring match because the longer base_name is preferred.
base_name = "Qwen3.5-35B-A3B"
[profiles.very_high.thoughtful.capabilities]
general     = 4
analysis    = 4
code        = 3
instruction = 4
math        = 3
creative    = 3

[profiles.very_high.embed]
repo    = "Mungert/Qwen3-Embedding-4B-GGUF"
file    = "Qwen3-Embedding-4B-Q8_0.gguf"
family  = "Qwen3Embedding"
quant   = "Q8_0"
size_gb = 4.3
thinking = false
hf_url  = "https://huggingface.co/Mungert/Qwen3-Embedding-4B-GGUF"
[profiles.very_high.embed.quirks_override]
"embed.output_dimensions" = 2560

# ─────────────────────────────────────────────────────────────────────────────
# BYOM EXAMPLES
# Users replace any slot by dropping a [[user_slots]] entry. The family field
# drives all defaults; quirks_override patches only what differs.
# ─────────────────────────────────────────────────────────────────────────────

[profiles.byom_qwen25.thoughtful]                                                                             
file = "qwen2.5-3b-instruct-q4_k_m.gguf"           
base_name = "Qwen2.5-3B"                                                                                      
[profiles.byom_qwen25.thoughtful.capabilities]                                                              
general     = 2                                                                                               
analysis    = 1                                                                                               
instruction = 2  

