# Reasoning stays usable with GPU offload. MTP = the multi-token-
# prediction build: the chat slot's MtpSession speculative-decodes it
# for faster generation (the FastShort router path ignores MTP, so only
# the thoughtful slot benefits). NOTE: the MTP repo names the file
# identically to the non-MTP repo (`Qwen3.5-4B-Q4_K_M.gguf`, just
# ~0.2 GB larger) — the repo/hf_url is what selects the MTP build.
base_name = "Qwen3.5-4B"
