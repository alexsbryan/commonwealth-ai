# Qwen3.5-35B-A3B at UD-IQ4_XS (~16.3 GB): the 3.5-generation MoE — the
# SAME model very_high runs at Q4_K_M, one quant tier down so this tier
# stays ≥4-bit (IQ4_XS ≈ 4.25 bpw — an i-quant, NOT a sub-4-bit quant)
# while fitting a 20 GB card. Budget: thoughtful 16.3 + always-resident
# fast (~2) + embed (~2.5) ≈ 20.8 GB — the same slight over-subscription
# the old 30B-A3B Q4 pick relied on (17.5 → ~22 GB total), and less than
# it, which is why the tier targets 20–23 GB and leans on MoE residency
# tolerance. 3B active params keeps generation fast on unified memory —
# the reason high holds an i-quant MoE here rather than a dense Q4. This
# is where mesh routing starts paying off; a Joiner routes here for
# Analysis ≥ 3.
#
# Shares base_name "Qwen3.5-35B-A3B" with very_high (Q4). Safe: the
# catalog dedups by base_name walking very_high→high (so a very_high
# user keeps the Q4 row), and high-tier users never see very_high, so
# each tier still surfaces its own quant. The capability row below
# MUST equal very_high's (same model) so `capabilities_for_file`
# resolves unambiguously across the two quant variants.
