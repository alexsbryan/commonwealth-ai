# models.toml — Sovereign Model Manifest
#
# Source of truth for slot configuration per hardware profile.
# The hardware detector selects a profile; the setup/download flow reads
# this file to know which files to fetch and which family to assign.
#
# Each slot entry specifies:
#   repo        HuggingFace repo ID (for download)
#   file        Exact GGUF filename within that repo
#   family      ModelFamily variant (drives default quirks)
#   quant       Quantisation label (informational, for display)
#   size_gb     Approximate on-disk size after download
#   thinking    Whether this slot uses thinking mode (bool)
#               Fast slot: always false
#               Thoughtful slot: true unless family is AlwaysOn or None
#   hf_url      Direct link for the developer/user
#
# Optional [profiles.X.Y.quirks_override] tables override individual
# fields from the family's default_quirks(). Only specify what differs.
#
# Optional [profiles.X.Y.capabilities] tables declare the slot's OICP
# capability profile (per spec §2.4, levels 0..=4 = none/basic/moderate/
# strong/exceptional). Consumed by `sovereign-mesh` to score backends
# when routing synthesis across a Commonwealth mesh — a Joiner running
# a 1.7B picks the Founder's 30B-A3B for `Analysis ≥ 3` requests, etc.
# Absent = BYOM / legacy: mesh routing falls back to conservative
# defaults. Capabilities: general, code, analysis, math, creative,
# instruction, multilingual, vision, long_context (snake_case keys).
#
# Optional `base_name` field identifies the model across quantisation
# and repo variants. A slot declaring `base_name = "Qwen3.5-35B-A3B"` will
# be used for ANY GGUF whose filename contains that string — so the same
# capability row covers Q4_K_M (very_high), Q3_K_M (high), and a local
# re-quant of that model. Longest base_name match wins when multiple apply.
#
# ── Curation philosophy (2026-05) ────────────────────────────────────────────
# Cross-platform speed reference informed this revision: Strix Halo 128GB
# (unified memory), Mac M2 Max 64GB (unified memory), and an RTX 4060 8GB
# (discrete, hard 8GB VRAM wall). The discrete-GPU case is what shapes
# the `default` profile's choice — MoE models like 30B-A3B spill across
# the PCIe bus on 8GB GPUs and lose their speed advantage, so dense 8B
# is the right thoughtful pick for that tier.
#
# We standardise on `unsloth/*-GGUF` for chat/instruct GGUFs (preferred
# over bartowski for fresh re-quants; fixes for tokenizer issues land
# there first). Embeddings stay on the official `Qwen/Qwen3-Embedding-*`
# repos — no quality reason to re-host.
#
# ── Fast slot notes ──────────────────────────────────────────────────────────
# Fast does intent classification + JSON routing, not synthesis. We don't
# scale it up with hardware — a larger router buys nothing for routing
# quality and wastes always-resident VRAM. Sits on Qwen3.5 0.8B/2B across
# all profiles (bumped from Qwen3 0.6B/1.7B in the 2026-07 3.5 refresh; the
# 3.5 line has no 0.6B/1.7B, so 0.8B/2B are the nearest sizes).
# TODO(router-validation): Qwen3-1.7B was the *validated* choice for
# structured JSON output at this size; Qwen3.5-2B/0.8B is NOT yet re-verified
# for grammar-constrained routing output. Re-validate the router's JSON
# compliance (recipe eval + a routing-accuracy pass) before this ships.
#
# ── Thoughtful slot notes ────────────────────────────────────────────────────
# `default` (8–19 GB VRAM): Qwen3.5-9B Q4_K_M (~5.9 GB, MTP build). The
# universal daily driver — fits fully in any 8GB+ GPU's VRAM, strong JSON
# grammar compliance under llama.cpp. /no_think mode (`thinking = false`)
# eliminates wasted reasoning tokens for the structured tasks that dominate
# routing-mediated chat. `low_mem` likewise uses the Qwen3.5-4B MTP build.
# MTP = multi-token prediction: the chat slot speculative-decodes it for
# faster generation; the FastShort router path ignores MTP, so only the
# thoughtful slot benefits (cpu_only stays non-MTP — no speculative-decode
# win without a GPU).
#
# `high`/`very_high` (≥20 GB VRAM, unified memory tier): Qwen3.5-35B-A3B,
# the 3.5-generation MoE. very_high runs Q4_K_M (~20.5 GB); high runs the
# SAME model at UD-IQ4_XS (~16.3 GB, still ≥4-bit) so it fits a 20 GB card
# alongside the always-resident fast+embed slots. 3B active params →
# ~30B-A3B-class generation speed on unified memory (the reason high holds
# an i-quant MoE rather than a dense Q4). We only select these profiles when
# ≥20 GB free is detected, otherwise fall through to default to avoid the
# PCIe-spill failure mode that kills MoE perf on 8GB discrete GPUs.
#
# ── Embed slot notes ─────────────────────────────────────────────────────────
# Qwen3-Embedding is purpose-built for retrieval. The 0.6B model is used
# always-resident for cpu_only/low_mem/default; 4B for high/very_high.
# Stays on the official `Qwen/Qwen3-Embedding-*` repos.
# ─────────────────────────────────────────────────────────────────────────────

[profiles.cpu_only]

[profiles.cpu_only.fast]
repo     = "unsloth/Qwen3.5-0.8B-GGUF"
file     = "Qwen3.5-0.8B-Q4_K_M.gguf"
family   = "Qwen35"
quant    = "Q4_K_M"
size_gb  = 0.5
thinking = false
hf_url   = "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF"
# Fast slot only does intent classification + JSON routing. We don't
# advertise it as a synthesis candidate; mesh routing filters it
# out as a "no peer should ever prefer this" floor.
# TODO(router-validation): 3.5-0.8B replaces the validated Qwen3-0.6B —
# re-verify JSON grammar compliance before shipping (see fast-slot notes).
base_name = "Qwen3.5-0.8B"
[profiles.cpu_only.fast.capabilities]
general     = 1
instruction = 2

[profiles.cpu_only.thoughtful]
repo     = "unsloth/Qwen3.5-4B-GGUF"
file     = "Qwen3.5-4B-Q4_K_M.gguf"
family   = "Qwen35"
quant    = "Q4_K_M"
size_gb  = 2.6
thinking = false  # thinking=false on CPU: latency renders it unusable
hf_url   = "https://huggingface.co/unsloth/Qwen3.5-4B-GGUF"
# 3.5-gen 4B at Q4 on CPU — competent floor for general Q&A. /no_think
# avoids the multi-second think-tag preamble that makes thinking
# mode unusable without GPU acceleration.
base_name = "Qwen3.5-4B"
[profiles.cpu_only.thoughtful.capabilities]
general     = 2
analysis    = 1
code        = 1
instruction = 2
math        = 1

# Q8_0, NOT Q4_K_M: (a) the upstream repo publishes only Q8_0 + f16 — the
# Q4_K_M file this used to prescribe does not exist ("Entry not found"), so
# cpu_only setups hit a dead download; (b) the baked router-embed cache is
# built from the repo's f16 and the sentinel probe measures f16↔Q8_0 cosine
# at 1.000000 (HIT) while a re-quant like Q4 lands below the 0.98 threshold
# (MISS) — so Q8_0 is also what spares CPU-only machines the "re-embedding
# ~303 exemplars, minutes on a CPU-only embed slot" first launch.
# Forensics: desktop-v0.1.19 Intel first-launch investigation, 2026-07-10.
[profiles.cpu_only.embed]
repo    = "Qwen/Qwen3-Embedding-0.6B-GGUF"
file    = "Qwen3-Embedding-0.6B-Q8_0.gguf"
family  = "Qwen3Embedding"
quant   = "Q8_0"
size_gb = 0.6
thinking = false
hf_url  = "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF"
[profiles.cpu_only.embed.quirks_override]
"embed.output_dimensions" = 1024

