# ─────────────────────────────────────────────────────────────────────────────
# CURATED ALTERNATIVES (opt-in, never auto-selected)
#
# These are NOT hardware ProfileName variants, so hardware detection never
# selects them and `recommended_primary` never returns them.
# `build_primary_catalog` appends them as NON-recommended options in the
# Settings → Models picker for tiers that can run them (Default and up), so
# users can opt in without leaving Settings. The auto-default stays Qwen
# (proven llama.cpp JSON-grammar compliance, which the router + extraction
# pipeline depend on).
#
# Gemma 4 12B (Google, released 2026-06-03; Apache 2.0): the strongest
# reasoning model that fits the 12–16 GB GPU / 24 GB Mac envelope (vendor
# GPQA Diamond ~78.8%, not yet independently verified). Kept opt-in — NOT the
# default — because the llama.cpp `--json-schema` path for Gemma 4 is
# unconfirmed, and Sovereign leans on grammar-constrained output for routing
# and extraction. Promote it to a profile's thoughtful slot once grammar
# compliance is verified in our bundled llama.cpp. (Multimodal needs an
# mmproj file; the text slot below is text-only, which is all chat needs.)
[profiles.alt_gemma_12b.thoughtful]
repo      = "ggml-org/gemma-4-12B-it-GGUF"
file      = "gemma-4-12B-it-Q4_K_M.gguf"
family    = "Gemma4"
quant     = "Q4_K_M"
size_gb   = 7.38
thinking  = false  # disable thinking for the structured tasks that dominate
                   # the chat surface (per the Gemma 4 model-card guidance)
hf_url    = "https://huggingface.co/ggml-org/gemma-4-12B-it-GGUF"
base_name = "gemma-4-12B"
[profiles.alt_gemma_12b.thoughtful.capabilities]
general     = 3
analysis    = 3
instruction = 3
math        = 3
code        = 2
creative    = 2

