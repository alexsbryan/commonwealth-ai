[item]
id = "tu_019_bash_du_top_dirs"
title = "Bash + du: find disk-hungry subdirectories"
category = "tool_use"

[prompt]
system = """You select tools from the menu below. Output exactly one JSON object. No prose around it. No markdown fences.

{{menu}}"""
user = """Task: a user reports their `~/.sovereign/` directory has grown to 200 GB. Identify which top-level subdirectories inside it are using the most disk space, sorted by size descending."""

[[context_blocks]]
name = "menu"
file = "sovereign/inquiries/cognitive/tool_use/_tool_menu.md"

[scoring]
kind = "tool_use"
expected_tool = "Bash"
must_contain = ["du", "~/.sovereign", "sort"]
