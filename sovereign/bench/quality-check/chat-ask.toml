# chat-ask.toml — the focus lane's bank.
#
# One turn, asked the way a user asks it, against a corpus the lane ingests
# from source on every run. It exists because of issue #57: a fully
# answerable two-part question came back with the first half answered and
# the second half refused ("The passages do not answer: Role of the
# grounding gate"), and nothing in the bench suite could see that — the
# suites either score a bank of short questions or judge answers with no
# access to what the turn DID.
#
# Every number below is PRE-REGISTERED, and they are NOT to be edited to fit
# a run that failed them — that is the whole point of writing them down
# first (ARCH §18.4). Raising one is an operator decision, made in this
# file, with the reason.
#
# The ceilings were re-set once, on 2026-09-04, from a measured quiet-host
# run under a rule fixed BEFORE the numbers were read (1.5x the median per
# stage) — not to accommodate a failure. The old figures came from issue
# #57's single 26.6 s turn, which is one run, and one run is not a
# measurement (ARCH §18.5). The full derivation is in the ceilings block.

schema_version = 1

# ── The formula, declared ONCE ───────────────────────────────────────
# ceiling = max(1.5 x median, median + ceiling_floor_ms)
#
# The multiplier alone has no floor, and on a small stage that is not a bar
# but a coin toss: `retrieval` has a 193 ms median, so 1.5x put the ceiling at
# 290 ms and run 2 failed the whole lane on `retrieval 298 ms > 290` — eight
# milliseconds, on a stage whose own run-to-run spread is larger than that.
# The additive term is what a ceiling on a fast stage needs; the multiplicative
# term is what a slow one needs. `max` takes whichever is the weaker claim,
# because a bar is a promise not to fire on noise.
#
# 250 ms is ~1.3x the retrieval median — chosen so the smallest stage gets a
# band wider than its observed jitter, and small enough to be invisible on
# every stage above ~500 ms. It binds ONLY on retrieval today: at the medians
# below the derived ceilings are retrieval 443 (was 290), draft 33,860,
# citation 11,601, audit 13,431, total 47,592 — four unchanged to within
# rounding, which is the check that this replaced the arithmetic and not the
# bars.
#
# One number, one place. The five hand-computed `*_ms` ceilings this replaced
# were the same formula applied five times by hand (ARCH §10.6), and the one
# that mattered was the one where 1.5x was the wrong rule.
ceiling_floor_ms = 250

# ── The precondition the ceilings row declares ───────────────────────
# A wall-clock bar measured on a contended host is could-not-judge, never
# failed (ARCH §18.3): the same binary and the same bank decoded at 50.7
# tok/s at 1-minute load 3.7 and 17.8 tok/s at load 32 on this machine — a
# 2.8x spread no threshold absorbs without going blind on the quiet case.
#
# Declared HERE rather than in `quality/check-lanes.toml` because it guards
# ONE ROW. The lane's other sixteen rows — route, gate outcome, both halves
# answered, not abstained, useful — are claims about the ANSWER, and a busy
# machine does not change them; making the whole lane could-not-judge under
# load would throw away the signal the lane exists for. `throughput`, whose
# every row IS wall-clock, declares `host-quiet:4` at lane level instead.
# Two scopes, one rule — read against the same
# `sovereign_cli_shared::host_load` number.
#
# 4.0 is the bound the quiet measurement was taken under (1-min load 3.69).
host_quiet_max_load = 4.0

[bank]
id = "chat-ask"
# Ingested FROM SOURCE each run into `qc-arch-tour-<fingerprint8>`, which is
# deleted first. The desktop's upload of this same file makes 10 chunks and
# this path makes 40 — the lane says which path it measures, and asserting
# the count is how a silent chunker change is caught.
fixture = "docs/ARCHITECTURE_TOUR.md"
corpus_prefix = "qc-arch-tour"
declared_chunks = 40
# `corpus search <id> <probe>` must return the fixture. A corpus that
# ingested and cannot be found is `ready` and useless.
search_probe = "what does the grounding gate guard"
search_must_hit = "ARCHITECTURE_TOUR"
# Warm runs per question, plus one warm-up that is DISCARDED. Three is the
# minimum that gives a spread; one run is not a measurement (ARCH §18.5).
runs = 3
warmup = 1

# ── The usefulness judge ────────────────────────────────────────────
# The gate's own forced-choice A/B probe, reused rather than re-derived
# (ARCH §19): POST /v1/chat/completions with max_tokens 1, temperature 0,
# and a `{"type":"string","enum":["A","B"],"x_forced_choice":true}` schema,
# which the engine routes to PRIMARY for calibrated logprobs and answers as
# `{"A":p,"B":p}`. Same register as `bench_cmd/live_runner.rs::forced_choice_ab`,
# which is the function this lane calls.
#
# THE TWO CONTROLS RUN EVERY TIME. A judge whose separation nobody checked
# is not an instrument (ARCH §18.4), and a usefulness score is exactly the
# kind of number that keeps reading plausible while the probe has drifted.
# If the controls do not separate by `control_gap`, the `useful` row is
# could-not-judge — never a pass, and never a failure attributed to the
# answer.
[judge]
model = "primary"
threshold = 0.80
control_gap = 0.60
control_good_min = 0.80
control_flat_max = 0.20
# Measured 2026-09-04 on Qwen3.6-35B-A3B-UD-MTP-IQ4_NL, before any lane
# code existed: good 0.9998 · flat abstention 0.00004 · gap 0.9998.
control_good = """
The runtime pipeline is router -> policy -> retrieval -> synthesis -> grounding gate. \
The router classifies the ask, policy sets the route, retrieval searches local corpora \
and mesh peers, synthesis drafts an answer, and the grounding gate extracts each claim \
and checks it against the sealed evidence before release. Its three outcomes are: \
release with citations, rewrite the unsupported spans and re-check, or abstain honestly.\
"""
control_flat = "I don't have enough information in the provided passages to answer that question."

# ── Pre-registered per-stage ceilings, PER MODEL STEM ────────────────
# A latency ceiling without a model is not a ceiling. A stem with no table
# here is could-not-judge, not a pass — running a different model is not
# evidence that this one got faster.
#
# RE-SET 2026-09-04 from a MEASURED run, replacing the order's opening
# figures (which were derived from issue #57's single 26.6 s turn). Rule,
# fixed before the numbers were read: **ceiling = 1.5x the measured median
# for that stage.**
#
# The measurement: `svrn quality check --lane chat-ask` on a QUIET host —
# `uptime` 1-min load 3.69, no cargo/rustc/nextest and no other chat
# workload — three warm runs per question after one discarded warm-up, so
# six turns in all. Medians (ms), from the run's own minted stage baseline:
#
#            q1      q2      ceiling basis
#   retrieval    193     174   max 193  -> 290
#   draft     14,249  22,573   max 22,573 -> 33,860
#   citation   7,734       —   q1 only (q2 took the audit exit) -> 11,600
#   audit      5,994   8,954   max 8,954 -> 13,430
#   total     28,199  31,728   sum of stage medians, max -> 47,590
#
# `draft_calls` and `audit_calls` are NOT re-set: they are counts, not
# times, this run recorded no fresh call figure, and 1.5x has no meaning on
# a call count. They stay at the order's pre-registered values.
#
# WHAT THIS BAR DOES NOT TOLERATE, said plainly rather than discovered
# later: 1.5x a quiet-host median is tight against this machine's real
# variance. The run before this one — same lane, same bank, with a peer's
# cargo build resident — measured `retrieval 2,979 ms` on q2, ten times the
# new ceiling. So a loaded host WILL redden `per-stage ceilings`, and that
# is a property of the bar as specified, not a defect in the lane. Raising
# one is an operator decision, made here, with the reason.
# ── Pre-registered MEDIANS, per model stem ───────────────────────────
# The measurement, not the bar: the bar is derived from these by the formula
# above. Re-set here is re-setting what was MEASURED, which is a claim a run
# can contradict — editing a ceiling directly was not.
[ceilings."Qwen3.6-35B-A3B-UD-MTP-IQ4_NL"]
retrieval_median_ms = 193
draft_median_ms = 22573
draft_calls = 1
citation_median_ms = 7734
audit_median_ms = 8954
audit_calls = 12
total_median_ms = 31728

# ── The two questions ───────────────────────────────────────────────

[[question]]
id = "q1"
# Issue #57, verbatim. Answerable in full from the tour: the pipeline is in
# the §"the journey" prose and the gate's role is row 1 of the gate table,
# which ranks #1 on `corpus search` and sits at index 1 of the 20 retrieved
# chunks. Half of it was refused anyway.
text = """\
According to the Architecture Tour, what is the runtime pipeline, and what \
role does the grounding gate play? Answer concisely but with enough detail \
to explain the full flow.\
"""
expected_route = "DeepQuery"
# Any release-family action. `abstain*` is failed by the `not abstained`
# row, which reads the production gate's own decision.
allowed_gate_actions = [
    "citation_grounded",
    "released",
    "annotated_marked",
    "verified",
    "rewritten",
]
# The SECOND half — the one issue #57 refused. Spans an answer covering the
# gate's ROLE has to reach, taken from the tour's own gate-table row
# ("claims verified against the sealed corpus before release; deterministic
# vetoes; rewrite or grounded abstention").
#
# STEMS, not whole words. The first run of this lane failed here on
# `abstention` against an answer that said "the model must honestly
# abstain" — a wording coupling, not a missing half, and exactly the defect
# `scripts/lib/ci-bench-verdict.sh` is made of.
#
# The fix went half way: `abstain` is not a substring of `abstention`
# (a-b-s-t-a-i-n vs a-b-s-t-e-n-t-i-o-n — they diverge at the fifth letter),
# so the row still failed on any answer that used the noun. `abst` is the
# actual common prefix and matches both, at the cost of also matching
# `abstract` — accepted, because a tour answer that says "abstract" while
# saying nothing about the gate's refusal path is a far less likely shape
# than one that picks the noun over the verb. The row still discriminates:
# `both_halves_answered_rejects_the_issue_57_shape` runs it against the #57
# answer verbatim.
must_locate = [
    "sealed",
    "abst",
]

[[question]]
id = "q2"
# Chosen to make the AUDIT pass fire — the per-claim judge fan-out, which
# is where the latency cliff lived and which q1 does not reach. CONFIRMED
# on the first instrumented run, 2026-09-04: gate action `annotated_marked`,
# mode `per_claim`, `audit 26,842 ms over 7 calls`. The order allowed for
# tuning the wording until audit fired; none was needed, and this is the
# wording that fired it.
text = """\
Explain every stage of the runtime pipeline in order and what each gate in \
the ladder guards.\
"""
expected_route = "DeepQuery"
allowed_gate_actions = [
    "citation_grounded",
    "released",
    "annotated_marked",
    "verified",
    "rewritten",
]
must_locate = [
    "sealed",
    "audit",
]
