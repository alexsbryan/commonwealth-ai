# Q/A retrieval bank for Alex Bryan's personal vault root essays.
#
# Schema mirrors `sovereign/bench/sep/questions.toml`
# (consumed by `eval_cmd::runner::run_bank`).
#
# Same vault scope as `golden.toml`: root essays only, COMMONWEALTH/
# and _sovereign-index/ excluded.
#
# Questions are authored against verifiable content (specific named
# entities, numbers, claims) so the retrieval scorer's keyword match
# isn't doing semantic guesswork.

# NOTE: `corpus` points at the watched-folder index ID (opaque
# auto-generated when the desktop "Connect obsidian vault" flow
# registers a vault). The semantic name is "obsidian-vault" and
# the enrichment-eval golden in `golden.toml` targets a separate
# atlas-only install under that name. Retrieval scoring needs the
# chunks.lance + _corpus_meta.json combo which only lives under
# the watched-folder corpus_id. Once both surfaces share one
# corpus install, this can flip back to `obsidian-vault`.
[bank]
name = "obsidian-real-vault-v1"
corpus = "watched-959ee8a8f330"
description = """
12-question retrieval bank for Alex's personal vault. Covers the
heterogeneous topic range of the root essays: institutional
economics, NFL as designed system, urban planning, AI investment
stack, pharmacy benefit managers, land value tax, music criticism.

Authored 2026-05-14 against verbatim content in the author's vault.
Drifts over time as essays are revised; treat as a snapshot bank,
not a permanent canon.
"""

# ── institutional economics ─────────────────────────────────────────

[[questions]]
id = "ostrom_valencia_water_court"
category = "concept_lookup"
subject = "personal-vault"
question = """
What is the Tribunal de las Aguas, and what role does Ostrom give it in
her analysis of long-running commons?
"""
expected_facts = [
    "Valencia",
    "water court",
    "Thursday",
    "cathedral",
    "irrigators",
    "elected",
]
expected_sources = [
    "Ostrom Summary",
]
notes = "Single-source recall. Tribunal is the iconic example in the Ostrom essay."

[[questions]]
id = "ostrom_nested_governance"
category = "concept_lookup"
subject = "personal-vault"
question = """
Why does the author argue that nested governance structures explain why
Ostrom's commons are robust, and what counter-example illustrates the
point?
"""
expected_facts = [
    "local",
    "centralized",
    "Soviet",
    "Aral",
    "Moscow",
    "knowledge",
]
expected_sources = [
    "Ostrom Summary",
]
notes = "Tests cross-paragraph synthesis within a single long-form essay."

[[questions]]
id = "hardin_vs_ostrom_method"
category = "argument_reconstruction"
subject = "personal-vault"
question = """
What is the methodological contrast the author draws between Hardin's
1968 paper and Ostrom's body of work?
"""
expected_facts = [
    "thought experiment",
    "model",
    "data",
    "empirical",
    "Hardin never studied",
]
expected_sources = [
    "Ostrom Summary",
]
notes = "The 'model vs data' framing is the essay's closing line."

