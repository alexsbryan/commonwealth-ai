# ────────────────────────────────────────────────────────────────────
# v2 — Routed Phase 1 typed-extension axes (Argumentative discourse)
# ────────────────────────────────────────────────────────────────────
#
# These axes score the `type_extensions` field on the Phase 1 cache —
# atoms the routed dispatcher (`sovereign enrich extract-typed`)
# produces when the Phase 0 classifier's discourse-mode vector
# surfaces `argumentative` above the routing threshold. Match
# semantics:
#
#   * `name_contains_any` / `label_contains_any` /
#     `content_contains_any` — case-insensitive substring of the
#     candidate atom's named field; ANY listed substring satisfies.
#   * Optional `*_contains_any` filters (`domain`, `content`,
#     `proponent`, `axis`, `supports`, `addresses`) tighten the
#     match when supplied; empty = unconstrained.
#   * Discriminator fields (`stance`, `kind`, `outcome`) require
#     exact case-insensitive match against the canonical enum
#     literal; absent = unconstrained.
#
# A `description_keywords_any` divergence (mechanism only) is
# informational — it lands in the report notes but does not move
# the F1 score, mirroring the `expected_*_atoms` semantics above.

