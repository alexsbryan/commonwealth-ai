# Golden set for Alex Bryan's personal vault at
# /Users/user/Documents/Obsidian Vault (root essays, COMMONWEALTH/
# work tree deliberately excluded — see [meta].excluded_paths).
#
# Schema mirrors `bench/literary/{bk-book-1,dubliners-3}.toml` (consumed
# by `sovereign enrich eval`, see `enrich_cmd/eval.rs:240+`).
#
# This is a "live" golden — every expected_* entry below references
# concrete entities, concepts, or claims that appear verbatim in the
# author's vault as of the file's most recent edit. When a note is
# rewritten enough that an entry no longer holds, the entry comes out
# of the golden — drift over time is the cost of grounding in real
# content, and worth paying for measurement that reflects the actual
# tuning surface.
#
# Authoring date: 2026-05-14. Sampled ~10 root essays
# (Ostrom Summary, Joan Robinson, The Rules Are The Game,
# Pharmacy Benefit, AI Bullcase, Beyond GDP, Jane Jacobs Urban Ranking,
# LVT, Stock Buybacks, Incompleteness) to ground entries.
#
# Match semantics:
#   * `canonical_name_contains_any` — case-insensitive substring of the
#     candidate atom's display name; ANY listed substring satisfies.
#   * `description_keywords_any` — case-insensitive substring of the
#     atom's description / claim / crux text; informational only.
#   * `participants_any` — ANY listed name appears in the participants
#     list (resolved through entity_name_by_id).
#   * `forbidden_*` blocks count as anti-tests.

[meta]
template = "obsidian-real-vault-2026-05-14"
corpus_id = "obsidian-vault"
description = "Golden set for Alex Bryan's personal vault — root essays only. Heterogeneous topic range: institutional economics, urban planning, market design, NFL as designed system, AI investment stack, pharmacy benefit managers, land value tax, philosophy of music."
vault_path = "/Users/user/Documents/Obsidian Vault"
excluded_paths = [
    "COMMONWEALTH/",
    "_sovereign-index/",
    ".obsidian/",
    "Untitled.md",
    "Untitled 1.md",
]

