# ── Notes on the held-out posture ──────────────────────────────────
#
# v1 of this golden does NOT define a held-out subset. Reason: the
# author of the vault (Alex) is the author of the golden, which is
# exactly the unconscious-bias risk the literary pressure-test
# flagged. A held-out subset addresses it only if a second pair of
# eyes authors part of the golden — meaningless when the bench is
# tuned by the same person. The right v2 move is to invite a peer
# to author entries for ~5 root essays we both consider
# representative; until then, the bench acceptance is "non-decreasing
# F1 across prompt revisions" rather than "above absolute
# threshold."
