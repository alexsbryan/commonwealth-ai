# Chaos-Monkey HELD-OUT bank — "The Saltgrass Ledger" (original novella,
# written 2026-06-11 for this bench; corpus id chaos-saltgrass).
#
# GENERALIZATION CONTRACT: this bank was authored from the novella's outline
# fact-ledger (/tmp/saltgrass/OUTLINE_FACT_LEDGER.md at authoring time) BEFORE
# any system run against the corpus, and no prompt or code in the runtime was
# tuned against it. The corpus is contamination-free by construction (original
# work): present answers cannot come from pretraining, and absent facts cannot
# be accidentally guessed right.
#
# Every PRESENT gold_keyword and every PROVENANCE supporting_quote was
# grep-verified verbatim against saltgrass-ledger.txt at authoring time.
# Every ABSENT-adjacent fact was verified absent by construction AND by grep
# (the rationale records what was checked).

[meta]
corpus = "chaos-saltgrass"
description = "Held-out grounded calibration on an original sealed novella: answer + cite when present, abstain honestly when absent. Zero training-data contamination."

# ── PRESENT ──

[[questions]]
id = "present-victim"
qtype = "present"
question = "Who is found drowned in the lock basin at Glasswater Stave?"
gold_keywords = ["Pellow"]
rationale = "Corwin Pellow, the harbormaster, is the victim; stated in chapter I and throughout."

[[questions]]
id = "present-victim-office"
qtype = "present"
question = "What office did Corwin Pellow hold in Glasswater Stave?"
gold_keywords = ["harbormaster"]
rationale = "Pellow is the harbormaster (21 years); stated repeatedly."

[[questions]]
id = "present-killer"
qtype = "present"
question = "Who killed the harbormaster Corwin Pellow?"
gold_keywords = ["Quenholt"]
rationale = "Severin Quenholt confesses in the inn's back parlor; the search and evidence chapters establish it."

[[questions]]
id = "present-weapon"
qtype = "present"
question = "With what implement was Corwin Pellow struck before he drowned?"
gold_keywords = ["boat-hook"]
rationale = "A salvage-pattern boat-hook with a riveted iron head, dredged from the silt grate; Fosk matches it to the wound."

[[questions]]
id = "present-stolen-object"
qtype = "present"
question = "What object was stolen from the harbormaster's office on the night of the murder?"
gold_keywords = ["chronometer"]
rationale = "The Lyle-Hannett chronometer is missing from its walnut case; recovered later in the salt barrel."

[[questions]]
id = "present-hiding-place"
qtype = "present"
question = "Where was the stolen chronometer eventually found hidden?"
gold_keywords = ["salt barrel"]
rationale = "Under a hand's depth of coarse salt in a barrel in the net-loft (chapter on the search)."

[[questions]]
id = "present-forged-document"
qtype = "present"
question = "Which document was forged after the murder, and what did the forged line claim?"
gold_keywords = ["ledger"]
rationale = "A fifth entry forged into the tide ledger's night page for the fourteenth, claiming a sluice-opening to scour the basin."

[[questions]]
id = "present-ink-tell"
qtype = "present"
question = "What about the ink showed that the fifth entry in the tide ledger was forged?"
gold_keywords = ["logwood"]
rationale = "The forged line is in logwood ink (sits on the page, blooms violet under acid); the office uses iron-gall."

[[questions]]
id = "present-tide-tell"
qtype = "present"
question = "Why did the tide itself prove the forged scouring order was nonsense?"
gold_keywords = ["neap"]
rationale = "The fourteenth was a neap tide — no head of water to scour with; Maren's central deduction."

[[questions]]
id = "present-body-finder"
qtype = "present"
question = "Who found the harbormaster's body in the lock basin?"
gold_keywords = ["Tabb"]
rationale = "Tabb Orrison, the lock-keeper's apprentice, finds the body at dawn in chapter I."

[[questions]]
id = "present-motive"
qtype = "present"
question = "What was Severin Quenholt's motive for killing the harbormaster?"
gold_keywords = ["survey"]
rationale = "Pellow's salvage survey would have opened the Merrow Bell's empty hold and exposed the insurance fraud; the true accounts in the tobacco-tin prove it."

[[questions]]
id = "present-wreck-name"
qtype = "present"
question = "What was the name of the sunken ketch at the center of the salvage fraud?"
gold_keywords = ["Merrow Bell"]
rationale = "The Merrow Bell, lost on the Saltgrass shoals, named ~20 times."

[[questions]]
id = "present-registrar"
qtype = "present"
question = "What is Maren Ashquill's official role in the village?"
gold_keywords = ["registrar"]
rationale = "Maren is the tide-registrar, keeper of the tide ledger; stated in chapter I."

[[questions]]
id = "present-sister"
qtype = "present"
question = "What does the harbormaster's sister Lessa Pellow do for a living?"
gold_keywords = ["light"]
rationale = "Lessa keeps the Wrack Point light(house); 'Lessa Pellow kept it... been keeper there for six years'."

[[questions]]
id = "present-doctor-verdict"
qtype = "present"
question = "What did Doctor Fosk conclude about how Corwin Pellow died?"
gold_keywords = ["drown"]
rationale = "Drowning, with a wound at the temple got BEFORE the water, struck by an iron edge — Fosk's examination and inquest testimony."

[[questions]]
id = "present-last-entry"
qtype = "present"
question = "What did the harbormaster's last entry in his own harbor book say?"
gold_keywords = ["sluice"]
rationale = "'Sluice gate ironwork wants seeing to.' — quoted verbatim in the final chapter."

[[questions]]
id = "present-inn"
qtype = "present"
question = "At which inn was Severin Quenholt arrested?"
gold_keywords = ["Cold Lantern"]
rationale = "The Cold Lantern, kept by Widow Hetch; the confrontation chapter opens there."

[[questions]]
id = "present-maximal-exposure"
qtype = "present"
question = "Give a complete account of how the forgery in the tide ledger was exposed, covering every piece of evidence involved."
gold_keywords = ["logwood"]
rationale = "Maximal synthesis: the neap tide, the logwood-vs-iron-gall ink test at Fosk's surgery, the hand-copy analysis. Any complete answer must name the ink."

[[questions]]
id = "present-maximal-fraud"
qtype = "present"
question = "Explain the Merrow Bell insurance fraud from the wreck to the murder: what was done, by whom, and why the salvage survey threatened it."
gold_keywords = ["cargo"]
rationale = "Maximal synthesis: the insured cargo stripped quietly and sold up the coast, the survey that would open an empty hold. Any complete answer must discuss the cargo."

