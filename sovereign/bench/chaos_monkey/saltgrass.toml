rationale = "His lugger is mentioned but never named — verified by construction and grep."

[[questions]]
id = "absent-story-year"
qtype = "absent_adjacent"
question = "In what year is the story set?"
rationale = "No year appears anywhere in the text (verified: no 18xx/19xx digits); the era is deliberately vague."

[[questions]]
id = "absent-hetch-firstname"
qtype = "absent_adjacent"
question = "What is Widow Hetch's first name?"
rationale = "She is only ever 'Widow Hetch' — no given name in the text."

[[questions]]
