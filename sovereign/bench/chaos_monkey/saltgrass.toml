# ── PROVENANCE-trap ──

[[questions]]
id = "prov-forged-ink"
qtype = "provenance_trap"
question = "What kind of ink was the forged ledger entry written in?"
gold_keywords = ["logwood"]
supporting_quote = "logwood ink"
rationale = "The forged line is in 'logwood ink' (pocket-bottle dye-black). The near-miss is the office's own 'iron-gall ink', which appears more often; a grounded answer must retrieve the logwood passage."

[[questions]]
id = "prov-tide-state"
qtype = "provenance_trap"
question = "What state was the tide in on the night of the fourteenth, making the forged scouring order impossible?"
gold_keywords = ["neap"]
supporting_quote = "neap tide"
rationale = "'A neap tide — the moon at her quarter, the slackest water of the month.' Ordinary tide-table talk elsewhere is the near-miss; the answer must ground in the neap-tide passages."

[[questions]]
id = "prov-crown"
qtype = "provenance_trap"
question = "What small broken piece of the chronometer was found caught in the basin's silt grate?"
gold_keywords = ["winding-crown"]
supporting_quote = "winding-crown"
rationale = "'the winding-crown of a chronometer, snapped off at the stem' — found in the silt grate. General chronometer description in the office chapter is the near-miss."

[[questions]]
id = "prov-barrel-tell"
qtype = "provenance_trap"
question = "What detail about the salt barrel's lid showed it had been opened recently?"
gold_keywords = ["hinges"]
supporting_quote = "salt-crusted hinges"
rationale = "'the salt-crusted hinges of its lid-hasp had been broken and re-set, the crust... split along the seam'. Generic salt-spray imagery elsewhere is the near-miss."

# ── DISTRACTOR ──

[[questions]]
id = "distract-forger"
qtype = "distractor"
question = "Who forged the fifth entry in the tide ledger?"
gold_keywords = ["Quenholt"]
distractor_quote = "Tabb"
rationale = "Quenholt forged it at his loft desk (his confession). Tabb Orrison — the apprentice with ledger access whom the constable suspected — is the plausible-but-wrong answer."

[[questions]]
id = "distract-finder"
qtype = "distractor"
question = "Who was the first person to find the harbormaster's body?"
gold_keywords = ["Tabb"]
distractor_quote = "Maren"
rationale = "Tabb Orrison found the body at dawn. Maren Ashquill — who heard the bell and came to the platform, and who drives the investigation — is the plausible-but-wrong conflation."

[[questions]]
id = "distract-hook-origin"
qtype = "distractor"
question = "From whose equipment did the murder weapon, the boat-hook, originally come?"
gold_keywords = ["Merrow Bell"]
distractor_quote = "lugger"
rationale = "The boat-hook was stamped M.B. — the Merrow Bell's own salvage gear from the net-loft stores. Quenholt's lugger is the plausible-but-wrong source for his weapon."
