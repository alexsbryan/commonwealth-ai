[meta]
id = "h.2-roman-numerals-bugs"
title = "Roman numerals — multi-bug fix (HOLDOUT)"
category = "CodeTest"
tier = "Scaffolded"
version = "v0"
notes = """
HOLDOUT problem (generalization protocol, 2026-07-07): classic
domain (Exercism/MBPP canon), four seeded single-section bugs.
Holdout receipts are READ-ONLY. Mirrors the 4.x attention-tier
multi-bug class in a fresh domain.
"""

[prompt]
file = "prompt.md"

[witness]
kind = "Hybrid"
language = "Python"
fixture_subdir = "fixtures"
scaffold_subdir = "scaffold"
verify_cmd = "python3 -m pytest -q tests/test_integration.py 2>&1"
score_buckets = [
  [0.0,  0.25,  0],
  [0.25, 0.6,   1],
  [0.6,  0.85,  2],
  [0.85, 1.001, 3],
]

[budget]
token_cap = 16000
wall_seconds_cap = 900

[scoring.dim_a]
name = "Correctness"
mode = "AutoTestPassFraction"

[scoring.dim_b]
name = "Diagnosis discipline"
mode = "JudgeRubric"
rubric_id = "dim_b"

[scoring.dim_c]
name = "Correct-by-contract behavior"
mode = "HybridAutoFloor"
rubric_id = "dim_c"
