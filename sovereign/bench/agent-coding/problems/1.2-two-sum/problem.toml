[meta]
id = "1.2-two-sum"
title = "Two-sum on a sorted array"
category = "CodeTest"
tier = "Scaffolded"
version = "v0"
notes = """
Classic interview problem: given a sorted array and a target sum,
find the indices of two distinct elements whose values sum to the
target. Returns None if no such pair exists.

Sits between 1.1 (trivial Unicode reversal) and 3.2 (GF(2) linear
algebra) on the difficulty ladder. A 9B coder model should solve
this comfortably with either the two-pointer O(n) approach or the
HashMap O(n) approach.

Scaffolded tier: Cargo.toml + src/lib.rs stub installed.
"""

[prompt]
file = "prompt.md"

[witness]
kind = "Hybrid"
language = "Rust"
fixture_subdir = "fixtures"
scaffold_subdir = "scaffold"
verify_cmd = "cargo test --quiet --test integration"
score_buckets = [
  [0.0,  0.25,  0],
  [0.25, 0.6,   1],
  [0.6,  0.85,  2],
  [0.85, 1.001, 3],
]

[budget]
token_cap = 6000
wall_seconds_cap = 600

[scoring.dim_a]
name = "Correctness"
mode = "AutoTestPassFraction"

[scoring.dim_b]
name = "Algorithmic choice"
mode = "JudgeRubric"
rubric_id = "dim_b"

[scoring.dim_c]
name = "Code quality"
mode = "HybridAutoFloor"
rubric_id = "dim_c"
