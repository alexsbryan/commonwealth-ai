[meta]
id = "3.3-calc-split-python"
title = "Calc — split a 97-line module into ≤30-line files (Python)"
category = "CodeTest"
tier = "Scaffolded"
version = "v0"
notes = """
Multi-file refactor probe — first non-Green problem in the agent
bench. A 97-line `calc.py` module exposes three public functions
(`evaluate`, `solve_linear`, `statistics`) backed by three private
helpers (`_tokenize`, `_to_rpn`, `_eval_rpn`). The task: split the
module into files where every source file is ≤ 30 lines, keeping
all 6 tests in `tests/test_calc.py` green.

This problem is the validation target for `commonwealth-tdd`'s
multi-file sequencer (the v2 wedge). Distinct from the Green-phase
problems in 1.x / 2.x / 3.2 / 4.x because there's no bug to fix —
the code is correct on baseline. Success is structural improvement
under a tests-still-pass gate, not a tests-pass-where-they-failed
gate.

Baseline state: 97 lines max, 6/6 tests passing.
Goal:          ≤ 30 lines per source file, 6/6 tests still passing.

Bench-runner integration is pending — for now the problem is driven
by the `probe_multi_file` example binary in `commonwealth-tdd`. A
`--agent multi_file` bench runner would slot the same fixture into
the standard run pipeline.
"""

[prompt]
file = "prompt.md"

[witness]
kind = "AutoTestPass"
language = "Python"
fixture_subdir = "fixtures"
scaffold_subdir = "scaffold"
# pytest auto-discovers tests/test_calc.py. No-op build (interpreted).
verify_cmd = "python3 -m pytest -q tests/test_calc.py 2>&1"
# Refactor problem — dim_a grades BEHAVIOR PRESERVATION against the
# held-out fixtures (full marks only when nothing broke). The
# structural goal (every file <= 30 lines) lives in the scaffold's
# ladder tests during iteration and is judged by dims b/c on the
# final layout. (The original buckets capped dim_a at 1 "pending v1
# bench-runner integration" — that out-of-band metric never landed,
# which silently made 9/9 unreachable for this problem.)
score_buckets = [
  [0.0,   0.5,   0],
  [0.5,   0.85,  1],
  [0.85,  0.999, 2],
  [0.999, 1.001, 3],
]

[budget]
token_cap = 24000
wall_seconds_cap = 900

[scoring.dim_a]
name = "Tests still pass"
mode = "AutoTestPassFraction"

# Refactor problems don't have an algorithmic-insight rubric the
# way Green-phase problems do — but the bench's schema requires
# dim_b + dim_c. Stub them with judge rubrics that will produce
# minimal signal; the meaningful gate is dim_a (tests pass) plus
# the structural metric the multi-file solver reports out-of-band.
[scoring.dim_b]
name = "Refactor coherence"
mode = "JudgeRubric"
rubric_id = "dim_b"

[scoring.dim_c]
name = "File organization"
mode = "JudgeRubric"
rubric_id = "dim_c"
