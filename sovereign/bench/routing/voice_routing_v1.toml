# Routing eval — voice contract distribution.
#
# Extracted from `sovereign/bench/voice/` + `sovereign/bench/voice/hard/`.
# Each row's `question` is the user-turn from the corresponding voice
# scenario; expected routing is the intent that the voice contract
# requires for the witness path to fire.
#
# These are real-world, natural-language phrasings — not the synthetic
# trigger shapes that the heuristic floor was tuned against. The point
# of this bank is to exercise the Pass-1 LLM classifier on inputs where
# the heuristics SHOULD NOT short-circuit. Per
# `feedback_no_teaching_to_test.md`: heuristic phrases must describe
# shapes, not bank vocabulary. This bank tests whether that discipline
# holds.
#
# Most voice scenarios route to `expressive_query` — that's the
# witness/relational handler. A few rows are genuinely ambiguous on
# surface (H03 fitness advice, H08 meta-question, 07 planning request)
# but the contract still needs them on the EXPRESSIVE path; misrouting
# breaks the voice eval. We mark them expressive_query and let bench
# misses surface the real routing risk.

[bank]
name = "voice-routing-v1"
corpus = "wikipedia"  # field required by bank loader; unused under --routing-only
description = """
User-turn-only routing bank derived from the voice-eval scenarios.
Validates that the router delivers each turn to the handler the voice
contract expects (almost always expressive_query for inner-work). Real
distribution, not heuristic-tuned phrasings.
"""

[bank.latency_budget]
default_p95_ms = 30000
max_per_question_ms = 60000

