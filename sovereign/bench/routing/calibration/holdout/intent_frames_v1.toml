# Intent-axis GENERALISATION holdout — v1.
#
# Run:  sovereign router fit --bank sovereign/bench/routing/calibration/holdout/intent_frames_v1.toml --axis intent
#
# ── Why this file exists, and why it is not in the parent directory ──
#
# `router fit`'s directory scan is non-recursive (`collect_banks`,
# router_fit_cmd.rs:228-232), so this bank is deliberately one level
# down: it must NOT join the default `sovereign router fit` run. The
# parent bank `axes_v1.toml` is the CALIBRATION set — it fits the
# gate, and its digest feeds the drift baseline. Merging a second bank
# into that run would change `bank_digest` and silently invalidate
# every stored baseline.
#
# This bank measures something the calibration set structurally cannot:
# GENERALISATION to surface frames nobody wrote an exemplar for.
#
# ── The problem it was built to solve (2026-08-04) ──
#
# The intent axis was found owning 3 of 40 calibration cases — 7.5%
# coverage, 35% accuracy — with the remaining 92.5% falling through to
# the LLM Pass-1 classifier, whose tie-break rule made `knowledge_query`
# an attractor for 18 of 32 observed misroutes. The fix under test is
# exemplar FRAME coverage for the sparse classes (`commissive_query` 8,
# `complex_task` 4, `simple_query` 6, against `knowledge_query` 35).
#
# That fix cannot be honestly scored on any pre-existing artifact:
#
#   * `bench/routing/cells_v1_paraphrases.toml` — five of its commissive
#     items and three of its expressive items share a surface FRAME with
#     exemplars the fix adds ("on my list", "up next", "don't let me
#     forget", "back to square one", "starting point"). After the change
#     those items are close to in-sample. Their delta measures coverage
#     of five frames, NOT generalisation, and must not be reported as
#     the latter.
#
#   * `calibration/axes_v1.toml` — its two commissive, two complex_task
#     and one simple case likewise sit in frames the fix targets
#     ("how many ounces in three cups", "take my reading list, drop…,
#     and group…"). It remains the right A/B instrument BECAUSE it is
#     frozen across the change, but it is a coverage measure too.
#
# So: this bank was authored BEFORE a single exemplar was written, and
# its frames were then declared off-limits to the exemplar set. Nothing
# below may be added to `sovereign/router/exemplars.toml`. If a future
# change needs one of these frames as an exemplar, RETIRE the case here
# and say so — do not quietly cover both sides.
#
# ── Authoring rules (inherited from axes_v1.toml) ──
#
# * EVERY CASE CARRIES A `note` stating what it probes.
# * `expect = "abstain"` is a real answer: the query is genuinely
#   under-determined by its surface form and firing on it is a false
#   positive. The abstains are each authored ADJACENT to a class this
#   bank covers, so a change that over-broadens a centroid is caught
#   here rather than in production. (The first four are
#   commissive/expressive-adjacent, from when this bank covered only
#   those classes; see the full-axis coverage block below.)
# * Frames only, never strings: no case restates an exemplar or a
#   `bench/routing/` question.

[bank]
name = "intent-frames-holdout-v1"
description = """
Held-out generalisation probe for the intent axis. Frames deliberately
disjoint from sovereign/router/exemplars.toml and from every bank under
sovereign/bench/routing/. Measures whether the exemplar set generalises
past the surfaces it was written against.
"""

# ══════════════════════════════════════════════════════════════════
# commissive_query — first-person future commitment
#
# Held-out frames: imperative-to-assistant-expressing-speaker-commitment,
# negative-exclusion ownership, "count on me", refusal-to-slip, and
# unconditional-promise. NONE of these use the "I'll / I'm going to /
# remind me to" markers the shipped exemplars are built from, and none
# use the ownership / queue-membership / debt frames the fix adds.
# ══════════════════════════════════════════════════════════════════

[[case]]
id = "hold_comm_consider_handled"
axis = "intent"
query = "Consider the migration handled by the end of the week."
expect = "commissive_query"
note = "Imperative SURFACE, commissive FORCE — the speaker orders the hearer to treat their own future action as settled. The single hardest commissive frame because every surface cue points at conation (bare imperative, no first-person pronoun, no modal). If the class has learned the speech act rather than the pronoun, this is where it shows."

[[case]]
id = "hold_comm_nobody_else"
axis = "intent"
query = "Nobody else needs to pick up the release notes."
expect = "commissive_query"
note = "Commitment by negative exclusion: the speaker claims the task by ruling everyone else out, never naming themselves. Probes whether commissive is an OWNERSHIP centroid or merely a first-person-future-tense one."

[[case]]
id = "hold_comm_count_on_me"
axis = "intent"
query = "Count on me for the Q3 numbers."
expect = "commissive_query"
note = "Canonical promise idiom, and the only case here with an explicit self-reference — included as the class's easy anchor so a total failure is distinguishable from a frame-specific one. If even this misses, the problem is the gate, not the frames."

[[case]]
id = "hold_comm_not_letting_slip"
axis = "intent"
query = "I'm not letting this one slip past Friday."
expect = "commissive_query"
note = "Negated-failure framing of a deadline commitment. Surface is emotional (determination), force is commissive — sits directly on the commissive/expressive boundary this change moves, so it doubles as a guard that widening expressive does not swallow commitments."

[[case]]
id = "hold_comm_tests_this_sprint"
axis = "intent"
query = "Whatever else happens, the tests get written this sprint."
expect = "commissive_query"
note = "Agentless passive with a concessive clause: no pronoun, no modal, no time-imperative. Nearly all commitment force is carried by 'whatever else happens'. The frame a plain keyword or first-person heuristic cannot reach."

# ══════════════════════════════════════════════════════════════════
# expressive_query — disclosure with implicit help-request
#
# Held-out frames: social-comparison inadequacy, behavioural avoidance,
# ironic self-contradiction, counterfactual-self, and stated apathy.
# The shipped exemplars are high-arousal and explicitly emotional
# ("overwhelmed", "drained", "grieving"); the fix adds indirect
# task-fatigue ("nothing to show for it", "fighting me"). These five
# are neither.
# ══════════════════════════════════════════════════════════════════

[[case]]
id = "hold_expr_everyone_else"
axis = "intent"
query = "Everyone else seems to find this obvious."
expect = "expressive_query"
note = "Inadequacy by social comparison. Contains no emotion word, no first-person feeling verb, and is grammatically a claim ABOUT OTHER PEOPLE — a factual-lookup surface. If expressive is really an emotion-keyword centroid this routes to knowledge_query, which is exactly the attractor under investigation."

[[case]]
id = "hold_expr_opening_closing"
axis = "intent"
query = "I keep opening the file and closing it again."
expect = "expressive_query"
note = "Avoidance reported as bare behaviour. The whole affective content is inferential — nothing in the sentence names a feeling. Probes whether the class covers disclosure-by-description, the register users actually type when they are stuck."

[[case]]
id = "hold_expr_its_fine"
axis = "intent"
query = "It's fine. It's obviously not fine."
expect = "expressive_query"
note = "Self-contradiction as affect. Short, no content nouns, no question — the shape most likely to be captured by simple_query small talk. Guards the simple_query additions this change makes."

[[case]]
id = "hold_expr_version_of_me"
axis = "intent"
query = "There's a version of me that would have finished this by now."
expect = "expressive_query"
note = "Counterfactual self-comparison — reflective register with an existential-'there is' surface. Adjacent to deep_query (it looks like a proposition to reason about), which is where 8 of the observed expressive misroutes landed."

[[case]]
id = "hold_expr_dont_care"
axis = "intent"
query = "I don't even care if it's right anymore."
expect = "expressive_query"
note = "Stated apathy — the terminal stage of task fatigue, and the point at which a user most needs the witness path rather than an answer. Surface asserts an absence of a preference, which is not obviously a help-request."

# ══════════════════════════════════════════════════════════════════
# complex_task — chained operations over a supplied source
#
# Held-out frames: transcript→decision-log, notes→table, and
# two-source reconciliation. The shipped exemplars are all
# "read/map/summarise/review this <artifact>"; the fix adds
# filter+rank, cluster+count and audit+explain. These three are
# transformation-into-a-STRUCTURE, which neither set covers.
# ══════════════════════════════════════════════════════════════════

[[case]]
id = "hold_complex_decision_log"
axis = "intent"
query = "Go through the transcript and produce a decision log with who agreed to what and when."
expect = "complex_task"
note = "Extraction plus role attribution plus temporal ordering into a named output artifact. complex_task is the sparsest class (4 exemplars) and BOTH its axes_v1 cases currently misroute to commissive_query — so any change that strengthens commissive must be checked here or it makes a known defect worse."

[[case]]
id = "hold_complex_notes_table"
axis = "intent"
query = "Turn these meeting notes into a table of owners, dates, and open questions."
expect = "complex_task"
note = "Unstructured-to-tabular with three named columns. 'Owners' and 'dates' are commissive-adjacent vocabulary while the MOVE is a transformation — the specific confusion that makes int_task_commitments misroute today."

[[case]]
id = "hold_complex_reconcile"
axis = "intent"
query = "Reconcile the two spreadsheets and tell me which rows only appear in one."
expect = "complex_task"
note = "Two-source set difference. Surface has the bounded-contrast shape of comparison_query ('the two X'), but the operation is mechanical over supplied data rather than a contrast of entities — pins the complex_task/comparison_query boundary, which nothing else does."

[[case]]
id = "hold_complex_thread_owners"
axis = "intent"
query = "Work back through this thread, pull out every unanswered question, and say who is waiting on whom."
expect = "complex_task"
note = "Fourth complex case so the class clears MIN_CASES_PER_CLASS on this bank. Chained filter plus relational attribution over the conversation itself — deliberately overlapping metalingual_query's in-conversation locator to check the multi-step operation still dominates."

[[case]]
id = "hold_complex_proposal_conflicts"
axis = "intent"
query = "Read all three proposals and list every place they contradict each other, with the page each claim came from."
expect = "complex_task"
note = "Fifth complex case. Multi-source contradiction hunt with provenance — the closest complex_task gets to deep_query, separated only by the fact that the sources are supplied rather than retrieved."

# ══════════════════════════════════════════════════════════════════
# simple_query — closed-form, no retrieval
#
# Held-out frames: primality, square root, recipe scaling, ordering,
# and elapsed-time arithmetic. The shipped exemplars are five social
# greetings plus one multiplication; the fix adds percentage, unit
# conversion and syllogism. These five are none of those.
# ══════════════════════════════════════════════════════════════════

[[case]]
id = "hold_simple_prime"
axis = "intent"
query = "Is 91 a prime number?"
expect = "simple_query"
note = "Closed-form number theory. Surface is a yes/no factual question — indistinguishable from knowledge_query without knowing the answer is COMPUTED rather than looked up. That distinction is the entire simple/knowledge boundary and no shipped exemplar teaches it."

[[case]]
id = "hold_simple_sqrt"
axis = "intent"
query = "What's the square root of 144?"
expect = "simple_query"
note = "Bare arithmetic in 'what's the X of Y' form — the same frame as a great many knowledge lookups. Probes whether the class generalises past the one multiplication exemplar it currently owns."

[[case]]
id = "hold_simple_recipe_half"
axis = "intent"
query = "If I halve a recipe that calls for three-quarters of a cup, how much is that?"
expect = "simple_query"
note = "Conditional word problem with domestic content. Long and content-rich, so it reaches the similarity band where the gate actually commits — most simple_query surfaces are too short to get there, which is why the class looks healthier than it is."

[[case]]
id = "hold_simple_ordering"
axis = "intent"
query = "Which is bigger, three-fifths or two-thirds?"
expect = "simple_query"
note = "Fraction ordering. Carries comparison_query's exact surface signal ('which is bigger, X or Y') over operands that are not entities — pins the simple/comparison boundary, and guards against the comparison class capturing closed-form arithmetic."

[[case]]
id = "hold_simple_elapsed"
axis = "intent"
query = "If something starts at quarter past two and runs for fifty minutes, when is it over?"
expect = "simple_query"
note = "Fifth simple case so the class clears MIN_CASES_PER_CLASS here. Elapsed-time arithmetic phrased without digits, which removes the numeric surface cue and leaves only the computational move."

# ══════════════════════════════════════════════════════════════════
# abstain — the guard on THIS change
#
# Every case below is commissive- or expressive-ADJACENT and genuinely
# under-determined: the correct intent turns on who is meant to act, or
# on what the previous turn was, neither of which this axis can see.
# Firing on any of them is a false positive. These exist because the
# fix under test WIDENS two centroids, and a widening that is not
# bounded by abstains is indistinguishable from over-firing.
# ══════════════════════════════════════════════════════════════════

[[case]]
id = "hold_abstain_auth_thing"
axis = "intent"
query = "we should probably get the auth thing sorted at some point"
expect = "abstain"
note = "'We' with no deictic anchor: commissive (I will do it), conation (you do it), or expressive (venting about accumulated debt)? The hedges 'probably' and 'at some point' remove the commitment force that would settle it. Directly adjacent to the commissive frames this change adds."

[[case]]
id = "hold_abstain_deploy_tomorrow"
axis = "intent"
query = "the deploy is tomorrow"
expect = "abstain"
note = "A bare state of affairs. Could be knowledge recall (you told me this), commissive (and I am doing it), or expressive (and I am dreading it). Nothing in the surface chooses. Short, so it also checks that a widened commissive centroid does not start capturing bare temporal statements."

[[case]]
id = "hold_abstain_third_time"
axis = "intent"
query = "that's the third time this week"
expect = "abstain"
note = "Expressive complaint or metalingual observation about the conversation's own history? The referent is in the prior turn. Guards the expressive widening specifically: indirect task-fatigue is the frame being added, and this is what an over-broad version of it would wrongly capture."

[[case]]
id = "hold_abstain_i_could_or_you"
axis = "intent"
query = "I could do the writeup, or you could"
expect = "abstain"
note = "An offer and a request in one sentence with the agent left open — the commissive/conation boundary made explicitly undecidable. If any gate commits this, it is committing a turn whose speaker has stated they have not chosen."

# ══════════════════════════════════════════════════════════════════
# Full-axis coverage (2026-08-04)
#
# WHY. As first authored this bank held only the four classes the D6
# exemplar work targeted (commissive, expressive, complex_task,
# simple_query). That was right for the question it was built to
# answer, and wrong for the question it is now being used for: the
# embedding-instruction bake-off and the gate calibration are
# WHOLE-AXIS decisions, and a bank covering four of eleven classes
# silently evaluated none of the other seven. Cross-bank validation
# in particular — fit on `axes_v1`, evaluate here — was scoring a gate
# against a third of the label space.
#
# The seven missing classes are added below at five cases each.
#
# THE HOLD-OUT CONTRACT IS UNCHANGED AND STILL BINDING. Nothing here
# may restate a row in `sovereign/router/exemplars.toml` OR a case in
# `../axes_v1.toml`. This bank's job is to answer "does the axis work
# on frames nobody wrote for it", and it can only do that while it
# stays disjoint from both. If a future change needs one of these
# frames as an exemplar, RETIRE the case here and say so.
# ══════════════════════════════════════════════════════════════════

# ── knowledge_query — atomic fact, held-out frames ────────────────

[[case]]
id = "hold_know_apollo_payload"
axis = "intent"
query = "which of the Apollo missions carried the heaviest payload?"
expect = "knowledge_query"
note = "Superlative over a closed set — resolves to one mission, but the 'which of' frame invites a survey. Probes whether ranking language drags an atomic lookup toward deep_query."

[[case]]
id = "hold_know_no_city_wall"
axis = "intent"
query = "which European capital never had a city wall?"
expect = "knowledge_query"
note = "A fact stated as an ABSENCE. Negative facts are rare in every exemplar bank and are the shape most likely to be read as a research question."

[[case]]
id = "hold_know_trench_depth"
axis = "intent"
query = "how deep does the Mariana Trench actually go?"
expect = "knowledge_query"
note = "Quantity with a unit, carrying the mild challenge particle 'actually'. Checks that conversational hedging does not move a plain lookup off the class."

[[case]]
id = "hold_know_serendipity_coinage"
axis = "intent"
query = "who's credited with coining the term 'serendipity'?"
expect = "knowledge_query"
note = "Attribution fact ABOUT A WORD — quoted term and all, which is exactly the surface metalingual_query owns. The discriminator is that the answer lives in the world, not in our exchange."

[[case]]
id = "hold_know_reykjavik_population"
axis = "intent"
query = "population of Reykjavik?"
expect = "knowledge_query"
note = "Bare noun phrase, no verb, no question word. The most compressed possible lookup, and the length at which every class starts to look alike."

# ── deep_query — synthesis, held-out frames ───────────────────────

[[case]]
id = "hold_deep_antibiotic_speed"
axis = "intent"
query = "how did antibiotic resistance get ahead of us so quickly?"
expect = "deep_query"
note = "Mechanism-over-time with an embedded surprise. Multi-source causal synthesis with no named entities to contrast, which is what keeps it out of comparison_query."

[[case]]
id = "hold_deep_concorde_counterfactual"
axis = "intent"
query = "would the Concorde have survived if fuel had stayed cheap?"
expect = "deep_query"
note = "Counterfactual — no exemplar covers the 'would X have, if Y' frame at all, and its yes/no surface makes it look answerable as a lookup."

[[case]]
id = "hold_deep_green_revolution_credit"
axis = "intent"
query = "who actually deserves credit for the Green Revolution, and why is that contested?"
expect = "deep_query"
note = "Opens with 'who', the strongest lookup cue in the bank, then turns to contested multi-actor attribution. Deliberately adversarial against the knowledge centroid."

[[case]]
id = "hold_deep_city_growth"
axis = "intent"
query = "why do cities keep growing even when living costs make no sense?"
expect = "deep_query"
note = "Open 'why' over an economic puzzle with no named place. Tests the class on abstraction rather than on historical narrative, which is what the shipped exemplars lean on."

[[case]]
id = "hold_deep_standard_oil_verdict"
axis = "intent"
query = "was the breakup of Standard Oil actually good for consumers?"
expect = "deep_query"
note = "Evaluative synthesis behind a yes/no surface. The judgment is the answer, so a gate that reads the surface commits it as a lookup."

# ── comparison_query — bounded contrast, held-out frames ──────────

[[case]]
id = "hold_cmp_solar_nuclear_land"
axis = "intent"
query = "solar and nuclear on land use per megawatt"
expect = "comparison_query"
note = "Two entities and a named axis, with NO verb and no comparison connective. Comparison stripped to its bare structure."

[[case]]
id = "hold_cmp_espresso_filter"
axis = "intent"
query = "espresso or filter — what actually changes in the cup?"
expect = "comparison_query"
note = "Disjunctive 'X or Y' framing over an everyday domain. Every shipped comparison exemplar is technical or philosophical; this checks the class is not domain-bound."

[[case]]
id = "hold_cmp_three_unixes"
axis = "intent"
query = "Linux, BSD and Solaris on licensing philosophy"
expect = "comparison_query"
note = "THREE entities, not two. The class is documented as a two-entity contrast, so this probes whether a third operand pushes it into deep_query — a real boundary nobody has tested."

[[case]]
id = "hold_cmp_heatpump_boiler"
axis = "intent"
query = "which is more efficient, a heat pump or a gas boiler?"
expect = "comparison_query"
note = "Superlative-between-two, the frame that shares its opening with simple_query's closed-form ordering questions. Pins that boundary from the comparison side."

[[case]]
id = "hold_cmp_ottoman_habsburg"
axis = "intent"
query = "how did the Ottomans and the Habsburgs each handle governing minorities?"
expect = "comparison_query"
note = "Parallel treatment of two entities signalled only by 'each' — no 'compare', no 'versus', no 'differ'. The contrast is structural rather than lexical."

# ── metalingual_query — about OUR usage, held-out frames ──────────

[[case]]
id = "hold_meta_what_counts_as_done"
axis = "intent"
query = "what counts as 'done' in the way you've been using it?"
expect = "metalingual_query"
note = "Asks for the operative definition of a term IN THIS EXCHANGE. 'Done' is an ordinary word, so the anchor phrase has to carry the whole route."

[[case]]
id = "hold_meta_index_two_things"
axis = "intent"
query = "you've used 'index' for two different things — which is which?"
expect = "metalingual_query"
note = "Flags an ambiguity in the assistant's own vocabulary. Metalingual in the strict Jakobson sense; nothing in the world is being asked about."

[[case]]
id = "hold_meta_atlas_provenance"
axis = "intent"
query = "is 'atlas' our word or does it come from somewhere?"
expect = "metalingual_query"
note = "Provenance of a term: local jargon or borrowed? Sits on the metalingual/knowledge line, since the answer could be a real etymology."

[[case]]
id = "hold_meta_should_strength"
axis = "intent"
query = "when you say 'should', is that a recommendation or a requirement?"
expect = "metalingual_query"
note = "Asks about the FORCE of a modal the assistant used — the most purely metalingual question in either bank, and one no exemplar resembles."

[[case]]
id = "hold_meta_corpus_scope"
axis = "intent"
query = "does 'corpus' include the conversation history here?"
expect = "metalingual_query"
note = "Scope-of-term question with a yes/no surface. Adjacent to code_query because 'corpus' is also a system component; the discriminator is that it asks how the WORD is used."

# ── code_query — this codebase's structure, held-out frames ───────

[[case]]
id = "hold_code_search_return_shape"
axis = "intent"
query = "what shape is the thing that comes back from search?"
expect = "code_query"
note = "Return-type question in colloquial register, with no identifier named. Every shipped code exemplar names a component; this one describes it."

[[case]]
id = "hold_code_retry_limits_set"
axis = "intent"
query = "where do the retry limits get set?"
expect = "code_query"
note = "Configuration location rather than logic location — a distinct code question, and one that shades toward metalingual because it is about a setting's name."

[[case]]
id = "hold_code_file_to_index"
axis = "intent"
query = "what happens between a file changing and the index updating?"
expect = "code_query"
note = "End-to-end flow across components, framed as a narrative gap. The shape most likely to be captured by deep_query, which also answers 'what happens' questions."

[[case]]
id = "hold_code_partial_writes"
axis = "intent"
query = "is there anything that handles partial writes?"
expect = "code_query"
note = "Existence check over the codebase. A yes/no surface with no component named — tests the class on the weakest possible lexical signal."

[[case]]
id = "hold_code_stale_chunk_owner"
axis = "intent"
query = "what's responsible for deciding a chunk is stale?"
expect = "code_query"
note = "Ownership by BEHAVIOUR rather than by name. Probes whether the class generalises past the identifier-lookup frame its exemplars are built on."

# ── conation_query — act on the prior turn, held-out frames ───────

[[case]]
id = "hold_con_stop_bullets"
axis = "intent"
query = "stop using bullet points"
expect = "conation_query"
note = "Negative durative instruction — the teachable-capture frame stated as a prohibition rather than a preference."

[[case]]
id = "hold_con_more_concrete"
axis = "intent"
query = "more concrete, less abstract"
expect = "conation_query"
note = "Two comparative adjectives, no verb at all. The most elliptical conation possible and the one most likely to fall under any similarity floor."

[[case]]
id = "hold_con_lose_last_paragraph"
axis = "intent"
query = "lose the last paragraph"
expect = "conation_query"
note = "Deletion targeting a specific span of the prior output. Distinct from the redo frames the exemplars cover — nothing is being regenerated."

[[case]]
id = "hold_con_as_a_table"
axis = "intent"
query = "put that in a table instead"
expect = "conation_query"
note = "Format transformation of existing output. Shares 'put that in' with complex_task's transform-into-a-structure frame; the discriminator is that the source is the PRIOR TURN, not supplied material."

[[case]]
id = "hold_con_assume_basics"
axis = "intent"
query = "keep going but assume I know the basics"
expect = "conation_query"
note = "Continue-with-a-changed-assumption. Compound: a continuation imperative plus a standing audience constraint, and no exemplar carries the pairing."

# ── generative_query — produce an artifact, held-out frames ───────

[[case]]
id = "hold_gen_six_words"
axis = "intent"
query = "write six words that could be a whole story"
expect = "generative_query"
note = "Extreme length constraint with no subject given. The numeral plus 'write' reads like a formatting instruction, which is where conation could steal it."

[[case]]
id = "hold_gen_geologist_rainstorm"
axis = "intent"
query = "describe a rainstorm the way a geologist would"
expect = "generative_query"
note = "Persona-constrained description. 'Describe' is the verb knowledge_query and deep_query both use, so the creative move rests entirely on the persona clause."

[[case]]
id = "hold_gen_novel_opening_weather"
axis = "intent"
query = "give me an opening line for a novel that starts with weather"
expect = "generative_query"
note = "Single-line creative fragment under a content constraint. Short creative asks are the ones the routing bench showed leaking to knowledge_query."

[[case]]
id = "hold_gen_fake_constellations"
axis = "intent"
query = "invent three plausible-sounding but fake constellations"
expect = "generative_query"
note = "Invention explicitly marked as NOT factual. Adversarial against knowledge_query, which owns the same subject matter and would answer with real constellations."

[[case]]
id = "hold_gen_grocery_list_poem"
axis = "intent"
query = "turn my grocery list into a poem"
expect = "generative_query"
note = "Creative transformation of supplied material — sits exactly between generative_query and complex_task, and the artifact being a poem is what decides it."

# ── four more abstains, adjacent to the newly covered classes ─────

[[case]]
id = "hold_abstain_whats_the_difference"
axis = "intent"
query = "what's the difference"
expect = "abstain"
note = "Comparison's canonical opening with NO operands and no question mark. Guards the comparison cases added above: the frame alone must not be enough to fire."

[[case]]
id = "hold_abstain_whole_thing"
axis = "intent"
query = "is that the whole thing?"
expect = "abstain"
note = "Completeness check that could be knowledge (is the fact complete), metalingual (did you show me everything), or conation (give me the rest). Nothing chooses."

[[case]]
id = "hold_abstain_you_know"
axis = "intent"
query = "say that again but, you know"
expect = "abstain"
note = "Conation with the constraint left unsaid. The move is clear and the PARAMETER is missing, so committing narrows the turn on a guess about what the user wanted changed."

[[case]]
id = "hold_abstain_way_thats_written"
axis = "intent"
query = "something about the way that's written"
expect = "abstain"
note = "A reaction with no verdict and no request: expressive (mild unease), conation (rewrite it), or metalingual (a remark about register). Guards all three."
