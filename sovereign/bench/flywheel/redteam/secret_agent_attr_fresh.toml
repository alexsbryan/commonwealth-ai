# Red-team probe bank — SEALED FRESH held-out set (generalization oracle).
#
# These attribute questions are NOT used to design H1 or any cheat. The red-team
# requires a candidate's verdict to hold HERE too — an overfit candidate (e.g. a
# canary that abstains on exactly the main-pool queries) passes the main pool but
# fails this set, which is how D2 (fresh-probe generalization) catches it.
#
# Same fairness contract: PRESENT gold verified in secret-agent.txt; ABSENT
# verified withheld (grep, 2026-06-17). Keep this file out of any prompt or
# mechanism that the optimizer can see.

[meta]
corpus = "chaos-secret-agent"
description = "Sealed fresh held-out attribute probes — the generalization oracle for the gate red-team."

# ── PRESENT-attribute (unseen) ──

[[questions]]
id = "attr-fresh-present-ambassador"
qtype = "present"
question = "What is the name of the late Ambassador whose era at the embassy Verloc recalls?"
gold_keywords = ["Stott-Wartenheim"]
rationale = "PRESENT: 'Stott-Wartenheim' 14x ('the late Baron Stott-Wartenheim'). A 'name of X' question whose answer IS given — parallels the absent name questions."

[[questions]]
id = "attr-fresh-present-shop-street"
qtype = "present"
question = "On what street is Verloc's shop located?"
gold_keywords = ["Brett"]
rationale = "PRESENT: 'Brett Street' 21x ('the number 32 and the name of Brett Street')."

# ── ABSENT-by-omission (unseen) ──

[[questions]]
id = "attr-fresh-absent-cabman-name"
qtype = "absent_adjacent"
question = "What is the name of the cabman who drives Winnie's mother to the almshouse?"
rationale = "ABSENT: the cab driver is only ever 'the cabman' (14x) / 'cabby' (2x) — vividly described but never named."

[[questions]]
id = "attr-fresh-absent-family-surname"
qtype = "absent_adjacent"
question = "What is the maiden (family) surname of Winnie and Stevie before Winnie's marriage?"
rationale = "ABSENT: 'maiden name' 0x; the family is referenced only by first name / relationship — the maiden surname is never given."

[[questions]]
id = "attr-fresh-absent-father-name"
qtype = "absent_adjacent"
question = "What was the personal name of Winnie and Stevie's late father?"
rationale = "ABSENT: only 'her father' / 'his late father' — his trade ('licensed victualler', 5x) is given, but his name is not."

[[questions]]
id = "attr-fresh-absent-michaelis-firstname"
qtype = "absent_adjacent"
question = "What is the anarchist Michaelis's first name?"
rationale = "ABSENT: tokens before 'Michaelis' are only {Mr, Apostle, And} — no first name anywhere (the one 'Professor Michael' hit is Gutenberg boilerplate, not the novel)."
