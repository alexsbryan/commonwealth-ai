# Cross-corpus eval bank — SEP × Wikipedia "stereo view".
#
# Each question is answerable WELL only with BOTH corpora: SEP supplies the
# argument structure (premises, objections, positions, reconstructions),
# Wikipedia the encyclopedic framing (who, when, named developers, dates,
# canonical works). The whole-game test for the meta-atlas bridge is whether
# routing the SEP↔Wikipedia bridge edges (SOVEREIGN_META_BRIDGE=1) lifts
# source + fact coverage over the bridge-off baseline.
#
# expected_sources span BOTH corpora: SEP article slugs (lowercase) AND
# Wikipedia article titles (title-case). A bridge-off run that only reaches
# the sealed driver corpus should under-cover the other side's sources.
#
# RUN (see README.md): run WITHOUT `--isolate` so retrieval reaches all
# installed corpora (both sep + wikipedia). --isolate would seal to one.

[bank]
name = "cross-corpus-v1"
corpus = "sep"
description = """
8-question SEP × Wikipedia bridge bank. Argument structure (SEP) fused with
encyclopedic framing (Wikipedia). Scored bridge-on vs bridge-off for the
meta-atlas stereo-view lift. Driver corpus = sep; the right side = wikipedia.
"""

[[questions]]
id = "consequence_argument_van_inwagen"
category = "cross_corpus"
question = """
Reconstruct van Inwagen's consequence argument against compatibilism, and
state who Peter van Inwagen is and when the argument was formulated.
"""
expected_facts = [
    "consequence argument",
    "no choice about",
    "rule beta",
    "van Inwagen",
    "incompatibilism",
    "1983",
]
expected_sources = [
    "incompatibilism-arguments",
    "compatibilism",
    "freewill",
    "Compatibilism",
    "Free will",
]

