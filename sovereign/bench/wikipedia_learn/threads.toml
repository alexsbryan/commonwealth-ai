# ── Thread 15 ────────────────────────────────────────────────────────
# Tool-Mastery Phase 5 — cross-turn dossier surface.
#
# T0 reaches into a region the corpus cannot answer (a date
# beyond the snapshot's horizon) → `outcome = no-results` lands
# in the tool-decision NoteStore for this conversation.
# T1 chains a coref-only follow-up ("the year before that") that
# is adjacent in time and likely also outside the snapshot. The
# dossier pre-pass on T1 should surface the prior `no-results`
# attempt, and the tutor's answer should reference that prior
# failure rather than silently retrying or fabricating.
#
# Headline assertion: the dossier is load-bearing — without it,
# the model has no per-conversation memory of failed lookups and
# either re-fabricates or treats each turn as fresh. With it,
# the tutor's T1 answer surfaces the prior attempt explicitly.

[[threads]]
