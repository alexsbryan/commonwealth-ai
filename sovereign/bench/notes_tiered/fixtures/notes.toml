# Notes fixture for the notes_tiered bench.
#
# Synthesised from the 2026-05-25 audit table in
# `sovereign/docs/specs/NOTES_TIERED.md` (the "Problem (measured)"
# section). Each note here exercises a specific FTS5 failure mode
# that the audit surfaced — synonym mismatch, stem mismatch,
# paraphrase miss — so the T1 semantic blend can be measured
# against a baseline whose recall is known to be poor.
#
# These notes are FIXTURES, not the literal 38 notes from the
# audit session (those live in `~/.svrnmesh/notes.db` of the
# operator running the audit). The fixture proxies the audit
# pattern: same FTS5 misses, same expected T1 wins, but
# committable + reproducible across machines.
#
# Schema: each `[[notes]]` entry feeds directly into
# `NoteStore::write_note_full_v9(...)`.

[bank]
name = "notes-tiered-v0"
description = """
12-note fixture covering the 8 audit query patterns from the
2026-05-25 NoteStore retrieval audit (NOTES_TIERED.md). Includes
the synonym pairs (wiki ↔ wikipedia), stem variants (regress ↔
regresses, tokenize ↔ tokenizer), and paraphrase classes (EOS
bypass / empty-bytes / force_continue, speculative decoding)
that FTS5 alone misses.

Authored 2026-05-25 as scaffolding for the notes_tiered bench.
"""

# ── EOS bypass / empty-bytes (paraphrase class) ─────────────────────

[[notes]]
id = "n1"
kind = "invariant"
content = "Decoder must accept every emitted token; naive EOS check via byte length skips empty-bytes tokens. Use force_continue=true to bypass."
symbols = ["embedded.rs", "decoder"]
files = ["sovereign/crates/sovereign-core/src/embedded.rs"]
session_id = "audit-2026-05-25"

