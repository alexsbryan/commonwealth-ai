[bank]
name = "wikipedia-summarize-pilot-v1"
corpus = "wikipedia"
description = """
Whole-article SUMMARIZATION bank for the RAPTOR-on-Wikipedia due-diligence
pilot (2026-06-08). Mirrors sovereign/bench/sep/summarize.toml: comprehensive
"give me an overview of the whole topic" prompts whose `expected_facts` are the
article's major canonical themes, scored as THEME COVERAGE under --synth
(facts-judge, paraphrase-tolerant, is the headline). Run A/B on
SOVEREIGN_RAPTOR_GROUNDING (0 vs 1) with --isolate (scope to wikipedia).

Restricted to the 8 pilot articles that built level-1 (cross-section) RAPTOR
nodes — i.e. the richest trees, exactly where whole-work summarization is
hardest for chunk-RAG and where RAPTOR is supposed to lift. The A/B is RELATIVE
(same themes both arms) so any slightly-off-corpus theme depresses both arms
equally and cancels out of the delta.

NOTE: RAPTOR was built per-article via `enrich raptor wikipedia --group-by-article
--titles-file` on these 12 pilot articles only; the other ~51k articles have no
RAPTOR nodes, so this bank must stay scoped to these articles.
"""

[bank.latency_budget]
default_p95_ms = 90000
max_per_question_ms = 180000

[[questions]]
id = "summary_einstein"
category = "comprehensive_summary"
subject = "physics-biography"
question = """
Provide a comprehensive overview of Albert Einstein. Cover his major scientific
contributions, the key ideas and how they changed physics, his role in the
quantum debates, and the main arc of his personal and political life. Aim for
breadth across the whole topic rather than depth on any single point.
"""
expected_facts = [
    "special relativity (1905)",
    "general relativity",
    "mass-energy equivalence E=mc^2",
    "photoelectric effect and the quantum/photon",
    "Brownian motion",
    "Nobel Prize in Physics",
    "Bose-Einstein statistics",
    "EPR paradox and debates with Niels Bohr over quantum mechanics",
    "fled Nazi Germany and emigrated to the United States",
    "pacifism, civil-rights advocacy, and the letter to Roosevelt",
]

