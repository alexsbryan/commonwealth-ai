# Enron entity-resolution bench bank.
#
# Schema:
#   [bank] — bench-wide metadata (name, corpus, description).
#   [[questions]] — one canonical entity per entry. Each carries:
#     id              : stable bench-scoped id
#     canonical_id    : the canonical entity id (chosen at author time)
#     entity_type     : "person" | "organization" | "place"
#     canonical_name  : reader-facing label
#     surface_forms   : array of accepted surface forms the reconciler
#                       should collapse under canonical_id
#     split           : "train" | "test" | "holdout"
#     notes           : optional rationale for the choice / corner case
#
# Holdout entries are SEALED: their surface_forms field intentionally
# carries only 1-2 entries so a passing eye scanning this file doesn't
# pre-leak the holdout shape. The full surface set unseals via the
# CLI flag.

[bank]
name = "enron-entity-resolution-v0"
corpus = "enron-sample"
description = """
Seed ground-truth set for Enron entity reconciliation. Sourced from
the public Enron organisational record + the counterparty mentions
attested in the released email corpus.

This is the floor + iteration target for Phase 4's multi_origin_merge
primitive. The architecture-over-Enron push ships the substrate;
public release (recipe publish, full curation, holdout unseal) lives
in a separate follow-up plan.
"""

# ── Train split — tune against these freely ───────────────────

[[questions]]
id = "person_ken_lay"
canonical_id = "person-ken-lay"
entity_type = "person"
canonical_name = "Kenneth L. Lay"
surface_forms = [
  "Ken Lay",
  "Kenneth Lay",
  "Kenneth L. Lay",
  "K. Lay",
  "klay@enron.com",
  "kenneth.lay@enron.com",
]
split = "train"
notes = "Founding executive. Email-address surface forms are decisive signals."

