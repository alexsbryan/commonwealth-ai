# ── Holdout — SEALED. Surface forms intentionally minimal ─────
#
# Adding entries here is fine; populating their `surface_forms`
# beyond 1-2 entries leaks the holdout. The full ground truth
# unseals via `--unseal-holdout` and the canonical store at
# `~/.svrnmesh/bench/enron/holdout.jsonl` (gitignored).

[[questions]]
id = "person_holdout_1"
canonical_id = "person-holdout-1"
entity_type = "person"
canonical_name = "<sealed>"
surface_forms = ["<sealed>"]
split = "holdout"
notes = "Sealed Enron executive — unseal via CLI."

