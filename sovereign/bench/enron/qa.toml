# Enron question-answering bench — the "could a prosecutor use this?" surface.
#
# This is the ANSWER-quality bank (retrieval + synthesis, LLM-judged),
# distinct from `questions.toml` which is the entity-RESOLUTION ground
# truth (B³). Discovered by `sovereign bench all` as a RetrievalJudge
# surface ([bank] + [[questions]]); run it scoped to one corpus with
#   sovereign bench all --synth --isolate --filter enron/qa
#
# Schema (mirrors sovereign/bench/sep/questions.toml):
#   [[questions]] id, category, subject, question,
#     expected_facts   — verifiable strings the answer should contain
#                        (strict diagnostic; the LLM judge / answer-
#                        equivalence is the canonical score).
#     expected_sources — entity / topic anchors retrieval should surface
#                        (diagnostic; email corpora lack clean titles, so
#                        source_recall here is a soft signal, not a gate).
#     split            — train | test | holdout.
#
# Anti-coaching discipline: every question is a prosecutor-plausible ask
# answerable from THIS corpus (Lay+Skilling sent+inbox). Each topic was
# verified present in the atlas before authoring — LJM≈11, Raptor≈3,
# Dynegy≈25, California≈82, Venezuela/Orimulsion≈110/2, mark-to-market≈21,
# off-balance≈15, Azurix≈24, NewPower≈21, broadband≈36 mentions. The
# test split is held aside; do not tune against it. expected_facts are
# public-record facts that must also be attested in the correspondence,
# not phrasings reverse-engineered from a model's output.

[bank]
name = "enron-qa-v0"
corpus = "enron-sample-multi-wide"
description = """
First Enron answer-quality bank: 10 prosecutor-style questions over the
two-custodian (Lay + Skilling) correspondence, spanning executive roles,
the LJM/Raptor off-balance-sheet vehicles, the Dynegy merger, the
California energy crisis, counterparty exposure, financial condition, new
ventures, and workforce actions. Authored 2026-05-31 against verified
atlas content; entity-anchored answers exercise the Phase-4 reconciliation
(canonical Lay/Skilling/Fastow rather than scattered aliases).
"""

# ── Train split — tune retrieval/synthesis against these freely ──

[[questions]]
id = "exec_roles"
category = "network"
subject = "organization"
question = """
Who are the senior Enron executives in this correspondence, and what role
did each hold?
"""
expected_facts = [
  "Kenneth Lay",
  "chairman",
  "Jeffrey Skilling",
  "chief executive",
  "Andrew Fastow",
  "chief financial officer",
]
expected_sources = ["Kenneth L. Lay", "Jeffrey K. Skilling", "Andrew S. Fastow"]
split = "train"
notes = "Baseline identity/role grounding; leans directly on reconciled canonical execs."

[[questions]]
id = "ljm_raptor_vehicles"
category = "financial_structure"
subject = "off_balance_sheet"
question = """
What do the communications reveal about the LJM and Raptor partnership
vehicles, and which executive is associated with them?
"""
expected_facts = ["LJM", "Raptor", "Fastow", "partnership", "off-balance-sheet"]
expected_sources = ["Andrew S. Fastow"]
split = "train"
notes = "The fraud-core structures. Verified present (LJM≈11, Raptor≈3, off-balance≈15)."

[[questions]]
id = "dynegy_transaction"
category = "deal"
subject = "merger"
question = """
Describe the proposed Dynegy–Enron transaction as it appears in the
correspondence.
"""
expected_facts = ["Dynegy", "Enron", "merger", "transaction"]
expected_sources = ["Dynegy"]
split = "train"
notes = "Major late-2001 event; multiple initiative atoms ('the Dynegy transaction')."

[[questions]]
id = "california_energy_crisis"
category = "topic"
subject = "markets"
question = """
What do the executives' communications say about the California energy
crisis?
"""
expected_facts = ["California", "energy", "prices", "crisis"]
expected_sources = ["California"]
split = "train"
notes = "California≈82 mentions; concept atom 'California electricity crisis'."

[[questions]]
id = "counterparties"
category = "network"
subject = "counterparties"
question = """
Which energy-sector companies appear as counterparties or peers in the
executives' mail?
"""
expected_facts = ["Dynegy", "Calpine", "Pacific Gas", "El Paso", "Williams"]
expected_sources = ["Dynegy", "Calpine Corporation", "Pacific Gas and Electric Co."]
split = "train"
notes = "Counterparty network; all verified as reconciled org atoms."

[[questions]]
id = "financial_condition"
category = "financial_structure"
subject = "solvency"
question = """
What references are there to Enron's financial condition — credit ratings,
mark-to-market accounting, or off-balance-sheet exposure?
"""
expected_facts = ["credit rating", "mark-to-market", "off-balance-sheet", "bankruptcy"]
expected_sources = []
split = "train"
notes = "Solvency signals (credit rating≈10, mark-to-market≈21, bankruptcy≈22)."

# ── Test split — SEALED for tuning; score once per tuned policy ──

[[questions]]
id = "fastow_position"
category = "network"
subject = "organization"
question = """
What was Andrew Fastow's position at Enron, and what financial structures
is he linked to in the correspondence?
"""
expected_facts = ["Fastow", "chief financial officer", "LJM", "partnership"]
expected_sources = ["Andrew S. Fastow"]
split = "test"

[[questions]]
id = "new_ventures"
category = "topic"
subject = "diversification"
question = """
What new-business ventures — such as broadband, NewPower, Azurix, or
international exploration and production — surface in the correspondence?
"""
expected_facts = ["broadband", "NewPower", "Azurix", "Venezuela"]
expected_sources = []
split = "test"

[[questions]]
id = "workforce_actions"
category = "topic"
subject = "organization"
question = """
What workforce or organizational changes are discussed in the mail?
"""
expected_facts = ["workforce reduction", "reduction", "employees"]
expected_sources = []
split = "test"

[[questions]]
id = "lay_skilling_comms"
category = "network"
subject = "communication"
question = """
Characterize the communication between Kenneth Lay and Jeffrey Skilling in
this corpus — what topics do they exchange on?
"""
expected_facts = ["Lay", "Skilling", "Enron"]
expected_sources = ["Kenneth L. Lay", "Jeffrey K. Skilling"]
split = "test"
notes = "Cross-custodian comms; reconciliation makes both endpoints single canonical entities."
