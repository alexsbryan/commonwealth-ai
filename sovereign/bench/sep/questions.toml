# SEP evaluation question bank — 21 questions calibrated for the Harvard
# undergrad-philosophy-essay bar. Used by `sovereign eval run` to measure
# retrieval quality before/after atlas enrichment. Drives `triage-candidates`
# selection of which SEP articles to deeply enrich first.
#
# Schema (mirrors wikipedia/eval/wikipedia_questions.toml):
#   - `id`               stable identifier; used in run-output filenames + diffs
#   - `category`         eval-shape rollup: position_summary, argument_reconstruction,
#                        concept_distinction, dialectical, comparative, contested
#   - `subject`          subject-area tag (ethics, metaphysics, epistemology, mind,
#                        language, logic, political, science, history, continental,
#                        non_western, applied) — for breadth audit, not rollup
#   - `question`         the literal question, written as an essay prompt
#   - `expected_facts`   keyword-fuzzy substrings expected in retrieved chunks
#                        or synthesized answer. Lean on named positions, named
#                        thinkers, named arguments, technical distinctions.
#   - `expected_sources` SEP article slugs (canonical, validated against parquet
#                        catalog 2026-05-04). Match is case-insensitive and
#                        underscore-folded by `corpus_engine::filters::normalize_title`.
#   - `notes`            optional human commentary
#
# Designing for the bar:
#   - Each question can't be answered with one paragraph from one article
#   - References at least one specific thinker or named argument
#   - Forces correct use of technical vocabulary so fact-scoring grades on it
#   - Has a defensible dialectical answer — multiple legitimate positions
#
# Subject coverage (v1 = 21 questions):
#   ethics: 2, metaphysics: 3, epistemology: 2, mind: 3, language: 2,
#   logic: 1, political: 2, science: 1, history: 2, continental: 1,
#   non_western: 1, applied: 1
#
# Category coverage (v1):
#   argument_reconstruction: 6, comparative: 4, position_summary: 4,
#   dialectical: 3, concept_distinction: 2, contested: 2

[bank]
name = "sep-core-v1.1"
corpus = "sep"
description = """
21-question philosophy-undergrad-essay bank spanning ethics, metaphysics,
epistemology, mind, language, logic, political philosophy, philosophy
of science, history, continental, non-Western, and applied ethics. Each
question is calibrated to the Harvard-PHIL-major-essay bar: requires
at least one named distinction or argument moved between articles, uses
technical vocabulary correctly, and has a defensible dialectical answer.

v1 (2026-05-04): authored against the parquet's 1,770-slug catalog;
every expected_source is verified to exist as a SEP entry. Drives the
initial triage-candidates selection for SEP atlas enrichment.

v1.1 (2026-05-04): five Bucket-A patches after baseline spot-check
caught wrong/non-canonical slugs:
  - kant_hume_causation: causation-metaphysics → kant-hume-causality
    (specific entry literally named for the topic; was 0/3 sources)
  - locke_reid_personal_identity: added locke-personal-identity +
    reid-memory-identity (canonical specific entries)
  - kripke_reference: natural-kinds → reference + descriptions
    (the actual SEP entries on reference theory)
  - godel_incompleteness: added the broader goedel entry
  - trolley_doctrine_double_effect: added doing-allowing +
    philippa-foot (canonical entries that retrieved cleanly)
Total expected_sources: 60 → 67 (5 added, 1 removed via swap, 1 swap kept count).
"""

# Latency budgets are intentionally looser than the wikipedia bank because
# SEP questions tend to require more synthesis-class routing (philosophy
# arguments rarely answer in one chunk).
[bank.latency_budget]
default_p95_ms = 45000
max_per_question_ms = 90000

[bank.latency_budget.by_category.position_summary]
p50_ms = 18000
p95_ms = 30000

[bank.latency_budget.by_category.argument_reconstruction]
p50_ms = 25000
p95_ms = 45000

[bank.latency_budget.by_category.concept_distinction]
p50_ms = 22000
p95_ms = 35000

[bank.latency_budget.by_category.dialectical]
p50_ms = 28000
p95_ms = 50000

[bank.latency_budget.by_category.comparative]
p50_ms = 28000
p95_ms = 50000

[bank.latency_budget.by_category.contested]
p50_ms = 30000
p95_ms = 55000

# ─── Metaphysics ────────────────────────────────────────────────

[[questions]]
id = "argument_consequence_against_compatibilism"
category = "argument_reconstruction"
subject = "metaphysics"
question = """
Reconstruct van Inwagen's consequence argument and explain the strongest
compatibilist response to it.
"""
expected_facts = [
    "consequence argument",
    "van Inwagen",
    "no choice about",
    "rule beta",
    "compatibilism",
    "Frankfurt",
    "alternative possibilities",
]
expected_sources = [
    "incompatibilism-arguments",
    "compatibilism",
    "freewill",
]
notes = "Canonical free-will-and-determinism prompt; rule-beta is the load-bearing inference."

