[bank]
name = "sep-summarize-v1"
corpus = "sep"
description = """
Whole-work SUMMARIZATION bank — the axis RAPTOR is actually built for.

The sibling `questions.toml` measures source-coverage breadth (which specific
SEP entries got retrieved) — a metric that structurally penalizes doc-level
summaries, because a summary trades article-breadth for whole-work synthesis.
This bank measures the opposite and correct axis for RAPTOR: given a "summarize
the whole topic" prompt, does the answer COVER the major themes of the work, or
just the corner the leaf chunks happened to retrieve?

Mechanism under test: a chunk-collage summary covers only the ~K leaf chunks it
pulled (one section of a long entry); RAPTOR's collapsed-tree root/intermediate
summaries are designed to represent the WHOLE entry. So theme-coverage is the
discriminating measure.

Method (zero new harness code): the questions are "comprehensive overview"
prompts; `expected_facts` are the work's major canonical themes. Under
`--synth`, the strict + LLM-judge fact scorers then measure *theme coverage* of
the generated summary — facts-judge (paraphrase-tolerant) is the headline
number. Run A/B on `SOVEREIGN_RAPTOR_GROUNDING` (0 vs 1), same as the SEP bench.

Theme authoring note: themes are canonical for each topic, not corpus-derived.
That's fine — the A/B is RELATIVE (same themes both arms), so any theme that is
slightly off-corpus depresses both arms equally and cancels out of the delta.
Works chosen for the richest RAPTOR trees (longest, most-multi-section entries,
16–23 nodes) — exactly where chunk-RAG whole-work summarization is hardest.

v1 (2026-06-08): 8 works, ~10 themes each. Faithfulness/hallucination scoring
is a v2 gap (the strict+judge scorers measure coverage, not grounding).
"""

[bank.latency_budget]
default_p95_ms = 60000
max_per_question_ms = 120000

[[questions]]
id = "summary_idealism"
category = "comprehensive_summary"
subject = "metaphysics"
question = """
Provide a comprehensive overview of idealism as a philosophical position.
Cover its central claims, the major varieties and the figures associated with
them, the principal arguments for it, and the main lines of criticism. Aim for
breadth across the whole topic rather than depth on any single point.
"""
expected_facts = [
    "mind-dependence of reality",
    "Berkeley",
    "esse est percipi",
    "Kant transcendental idealism",
    "Hegel absolute idealism",
    "German idealism",
    "Fichte",
    "subjective versus objective idealism",
    "rejection of mind-independent matter",
    "realism as the opposing view",
]
expected_sources = ["idealism"]
notes = "Broad metaphysics entry; tests breadth across Berkeley/Kant/Hegel varieties."

