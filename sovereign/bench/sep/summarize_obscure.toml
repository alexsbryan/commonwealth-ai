[bank]
name = "sep-summarize-obscure-v1"
corpus = "sep"
description = """
Obscure-works companion to summarize.toml — removes the famous-topic confound.

summarize.toml used famous topics (idealism, Mill, Descartes) the 35B knows
parametrically, so it covered the themes whether or not retrieval supplied them;
the answer-coverage gain from RAPTOR was muted (+3-4) even though RAPTOR doubled
the themes present in the retrieved CONTEXT (facts-in-chunks 26%→46%).

This bank picks SPECIALIST entries (proof theory, Frege's theorem, Principia,
recursive functions, common knowledge, Ibn Rushd) where a general 35B's
parametric knowledge is thin — so retrieval is load-bearing and RAPTOR's
context-coverage advantage should translate into ANSWER-coverage gains. The
raptor=OFF facts-judge column self-reveals obscurity: if it's near-ceiling
(~94% like the famous bank), the model knew it anyway; if it's lower, retrieval
mattered and the RAPTOR delta is the real signal.

Themes are canonical-from-knowledge (not corpus-derived → no circular bias
toward the raptor arm). A/B on SOVEREIGN_RAPTOR_GROUNDING, same as the others.
All 6 works have rich RAPTOR trees (16–34 nodes).

v1 (2026-06-08).
"""

[bank.latency_budget]
default_p95_ms = 60000
max_per_question_ms = 120000

[[questions]]
id = "summary_proof_theory"
category = "comprehensive_summary"
subject = "logic"
question = """
Provide a comprehensive overview of proof theory. Cover its central methods and
results, its historical motivation, the principal figures, and its main
subfields. Aim for breadth across the whole topic rather than depth on any
single point.
"""
expected_facts = [
    "Gentzen",
    "natural deduction",
    "sequent calculus",
    "cut elimination",
    "Hilbert's program",
    "consistency proofs",
    "ordinal analysis",
    "consistency of arithmetic",
    "structural proof theory",
    "Gödel incompleteness",
]
expected_sources = ["proof-theory"]
notes = "Specialist logic; tests Gentzen/cut-elimination/Hilbert-program breadth."

