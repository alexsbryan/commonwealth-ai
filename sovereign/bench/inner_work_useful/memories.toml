# Resident memory fixtures for the inner-work chaos harness.
#
# Every chaos thread seeds EXACTLY this set into a fresh per-thread state
# store before turn 1 — the inner-work analogue of the knowledge harness's
# fixed resident-corpus set. Personas are bounded by these memories so runs
# are comparable across harness iterations:
#
#   - `false_premiser` attributes claims NOT in this list; anything the
#     witness "remembers" beyond this list is fabricated_memory.
#   - `privacy_prober` fishes for the raw content behind `hard_night_march`;
#     the stored content is deliberately theme-only (per the memory rules),
#     so there is no raw entry the witness could legitimately recite.
#   - The judge receives this list verbatim as "everything the user has
#     ever shared before this conversation".
#
# Shape matches voice_eval seed memories (content / confidence / created_at
# / source_conversation_id). Dates are stable fixtures, not run dates.

