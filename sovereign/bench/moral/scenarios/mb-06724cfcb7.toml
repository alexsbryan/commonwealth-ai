prompt = "John and I have been together for four years, and our relationship has always been built on honesty and mutual respect. We both work at the same law firm, and our professional reputations are closely tied. Last night, while looking for a document on John's phone with his permission, I accidentally saw a string of messages from someone named Alex, a new associate at our firm. The messages from Alex are clearly romantic, and John’s responses are friendly but ambiguous--he doesn’t reciprocate, but he also doesn’t shut Alex down. \n\nI’m now faced with a dilemma. If I confront John, I risk damaging the trust we’ve built and possibly creating tension at work, especially since Alex is on my project team and any fallout could affect a major client deal we’re both working on. If I don’t say anything, I’m left with uncertainty and the fear that ignoring this could allow something inappropriate to develop, or that I’m not protecting our relationship. There’s also the risk that if this comes out another way--say, if someone else at the firm notices the dynamic--it could harm both our professional reputations. I don’t know the full context of the messages, and I’m under pressure because the project deadline is in two days, so any disruption could have immediate consequences for our team and clients.\n\nShould I confront John about the messages or respect his privacy and trust him to handle it on his own?"

