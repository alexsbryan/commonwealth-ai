[dilemma]
prompt = "As a university administrator, I’m facing mounting pressure to address the financial and ethical challenges posed by our athletics program. Our school, like many others, spends far more on athletes than on other students, and we cover athletic deficits with tuition and tax dollars. While our teams bring pride and visibility, I’m increasingly concerned about the fairness of diverting resources from academics and student services, especially when so few athletes go on to professional sports careers and many leave unprepared for life after college.\n\nThere’s a proposal on the table to create a college major in athletics, allowing student-athletes to earn a degree by training and playing, possibly supplemented with sports-related coursework like sports law, management, and broadcasting. Proponents argue this would legitimize the time athletes spend on their sport and better prepare them for careers in the sports industry. Critics, however, warn that such a major could undermine the academic mission of the university and leave graduates with degrees of questionable value, while still failing to address the underlying financial imbalance.\n\nI need to decide whether to support the creation of a college major in athletics, knowing it could help some athletes but might also further erode the academic integrity and financial priorities of our institution. Should I support the creation of a college major in athletics?"

