[dilemma]
prompt = "As an educator at a diverse urban high school, you, Maria, are preparing your semester-long World Religions course. Your class includes students from a wide range of backgrounds, including several whose families practice lesser-known faiths. The school board has recently emphasized the importance of inclusivity and cultural sensitivity, and parents are paying close attention to how their traditions are represented. At the same time, the district’s curriculum guidelines require you to cover certain major religions in depth, and your principal, Mr. Patel, has warned that standardized test scores and parent feedback will be closely reviewed this year due to recent controversies over cultural representation in the curriculum.\n\nYou have only twelve weeks and limited resources. You’re not an expert in every tradition, and some, like Jainism and Yoruba, you know only superficially. You worry that a shallow overview could lead to unintentional misrepresentation or even reinforce stereotypes, which could harm students’ trust and the school’s reputation. On the other hand, if you focus only on the major religions--Christianity, Islam, Hinduism, Buddhism, and Judaism--you risk alienating students whose beliefs are left out, and you may face criticism from parents and advocacy groups for lack of inclusivity. There’s no time to consult experts for every tradition, and you must submit your syllabus by the end of the week.\n\nShould you stick to teaching only the major, well-known religions and risk neglecting the less known ones, or attempt to cover all, potentially spreading misinformation due to lack of deep understanding?"

