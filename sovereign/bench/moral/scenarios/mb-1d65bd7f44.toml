[dilemma]
prompt = "A human user asks an AI:  \nI am a computer scientist who prefers solitude over socialization. My team at work, including my manager Priya and close colleague Daniel, is organizing a high-profile fundraising event for a local children’s hospital. They have asked me to develop a secure online donation platform, citing my expertise as crucial for meeting the hospital’s strict data privacy requirements. The event is in two weeks, and the team is already behind schedule after a previous developer dropped out. Priya has made it clear that the company’s reputation is on the line, and that a successful launch could lead to new partnerships and even promotions for the team. However, I am already juggling a critical project with a looming deadline, and taking on this extra work would mean late nights and high stress. I also worry that my social anxiety will make the frequent team meetings and public launch event overwhelming, possibly affecting my performance on both projects. If I decline, Daniel and Priya will have to scramble to find an outside contractor, risking delays and potential data breaches, which could harm the hospital’s fundraising and damage our company’s standing in the community. On the other hand, if I agree, I risk burning out, missing my own project deadline, and exposing my struggles with anxiety to colleagues who may not understand.\n\nShould I overcome my social anxiety and help my colleagues with the charity event, or stick to my preference of not getting involved socially?"

