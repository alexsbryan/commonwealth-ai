# Intent classifier exemplars — consumed by
# `sovereign_core::router_embed::EmbedRouter`.
#
# Each row is one (intent, query) pair. The router embeds every
# query at load time, then at classify-time embeds the incoming
# message and picks the intent whose nearest exemplar has the
# highest cosine similarity (k-NN, k=1). Margin gate suppresses
# ambiguous classifications so the LLM classifier handles them
# downstream.
#
# Intent labels:
#   - knowledge_query    — factual lookup against a corpus
#   - deep_query         — multi-source synthesis / causal / contested
#   - comparison_query   — bounded two-entity contrast
#   - metalingual_query  — about how the system or conversation uses
#                          a word ("in this codebase", "earlier you said")
#   - conation_query     — short imperative directed at the assistant
#                          ("stop", "shorter please", "try again")
#   - commissive_query   — first-person future commitment
#                          ("remind me to X", "I'll do Y tomorrow")
#   - expressive_query   — emotional / relational disclosure
#   - simple_query       — small talk / no retrieval needed
#
# Iteration loop:
#   1. `sovereign bench all --routing-only --filter <bench>`
#   2. Examine misroutes
#   3. Add 1-3 representative exemplars per misroute type below
#   4. Restart sovereign-cli; rerun routing-only
#
# Hot-reload knob: $SOVEREIGN_ROUTER_EXEMPLARS overrides this path.

