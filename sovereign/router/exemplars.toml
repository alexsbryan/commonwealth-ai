# ── Creative / generative requests (GENERATIVE, 2026-06-26) ──
# Asks for the model to PRODUCE a creative artifact — story, poem, song,
# letter, dialogue, brainstormed names. These need NO corpus retrieval and
# NO grounding gate; routed to the GenerativeQuery streaming handler (neutral
# prompt, no working-memory). Before these exemplars existed they mis-routed
# to coarse REASONING → DeepQuery → retrieval over every corpus + the gate
# buffering every token → a 1.5-3.5min blank screen (breaker finding). Kept
# verb- and form-diverse (tell/write/compose/pen/spin/make up/brainstorm/
# come up with/invent/draft × story/poem/sonnet/limerick/song/dialogue/names/
# metaphor/folktale/haiku) so the embedding generalises past any one phrasing,
# and disjoint from the bench/breaker texts per this file's discipline.

[[example]]
intent = "generative_query"
query = "Tell me a story about a clockmaker who slowly loses track of time."

