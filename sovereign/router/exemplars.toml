# ── Conation centroid expansion (2026-05) ──
# When the substring-based looks_like_conation heuristic was
# retired, these were added so the embed-router centroid for
# CONATION covers the shapes the substring list used to catch:
# pace-modifiers (slower / faster), length-modifiers (longer /
# expand / elaborate), abort-shapes (cancel / abort / halt),
# and walk-through-shapes. Each entry is a representative
# imperative — when a user says something semantically nearby,
# the embed router picks CONATION without any code change.

[[example]]
intent = "conation_query"
query = "Slower, walk me through that piece."

[[example]]
intent = "conation_query"
query = "Walk through what you just did, step by step."

[[example]]
intent = "conation_query"
query = "Expand on that last part."

[[example]]
intent = "conation_query"
query = "Make it longer with more detail."

[[example]]
intent = "conation_query"
query = "Elaborate on the second point."

[[example]]
intent = "conation_query"
query = "Cancel that, start over."

# Short-dismissal shape (2026-06-10): retract/abandon directives
# ("forget it", "drop that") are CONATION (steering the assistant),
# not expressive disclosure. Added when the long-form expressive
# exemplars below shifted the boundary and "never mind"-class
# dismissals started falling through to a zero-confidence coarse
# EXPRESSIVE verdict (caught by cells_v1_paraphrases).

[[example]]
intent = "conation_query"
query = "Scratch that, let's move on."

[[example]]
intent = "conation_query"
query = "Eh, drop it — doesn't matter."

[[example]]
intent = "conation_query"
query = "Never mind, it's not important."

[[example]]
intent = "conation_query"
query = "Halt — wrong direction."

[[example]]
intent = "conation_query"
query = "Faster, just the headline."

# ── Durative-coaching shape (2026-07-11, TEACHABLE P0) ──
# Standing preferences about HOW the assistant answers ("from now
# on…", "always…", "stop …ing") are CONATION — the same conative
# frame as the one-shot imperatives above, just durative aspect.
# The cell previously held only deictic shapes, so a real coaching
# sentence ("From now on, keep your answers short — a paragraph at
# most unless I ask for more.") embedded closer to knowledge asks
# and routed DeepQuery (caught live by preflight-lessons.mjs leg 2,
# 2026-07-11) — which meant the TEACHABLE capture spawn in
# handle_conation_query never saw coaching at all. Shapes only —
# worded apart from both the routing bench items and the coach
# harness bank.

[[example]]
intent = "conation_query"
query = "From now on, keep your answers shorter."

[[example]]
intent = "conation_query"
query = "Keep it to one paragraph from now on unless I ask for more."

[[example]]
intent = "conation_query"
query = "Always give me more detail unless I say otherwise."

[[example]]
intent = "conation_query"
query = "Stop mentioning your sources every time you answer."

[[example]]
intent = "conation_query"
query = "Never use technical jargon with me."

[[example]]
intent = "conation_query"
query = "Going forward, explain things like I'm five."

# ── Memory-reference shape (expressive cluster) ──
# When the substring looks_like_memory_reference heuristic was
# retired, these were added so the expressive centroid covers
# the "Remember when..." / "Last time we talked" / "You mentioned
# X" recall framings that route to EXPRESSIVE (relational), not
# COMMISSION or METALINGUAL.

[[example]]
intent = "expressive_query"
query = "Last time we talked about my old job — I wanted to circle back to that."

[[example]]
intent = "expressive_query"
query = "You mentioned my brother before; I keep thinking about that."

[[example]]
