# ── conversation-history KQ — content recall against the user's
#    own chat corpus. Disambiguates from `metalingual_query`
#    (which is about how WE NAME things in our system) by
#    pointing at CONTENT the user discussed in past sessions.
#
# Misroute sources fixed by these (per routing-only bench
# 2026-05-17, conversation/questions):
#   - "When did I decide to pause hiring..." was routed
#     ExpressiveQuery via "Why is this job decision feeling so
#     heavy?" — that's emotional disclosure, this is content recall.
#   - "Have I ever talked about <topic>" was routed
#     MetalingualQuery via "What did we discuss earlier about
#     routing?" — routing is a system word; <topic> is content.
#   - "What did I work through in chats over the past week" was
#     routed MetalingualQuery via the same exemplar.

# Each of these carries `scope = "personal"` — an orthogonal axis
# the embed router forwards to RouterClassification.scope.
# Downstream retrieval (prepare_knowledge_context +
# apply_atlas_grounding) reads scope to restrict to user-owned
# corpora instead of competing in the global cosine race against
# wikipedia / SEP / etc.
#
# Design principle: this set is intentionally small (one exemplar
# per query-shape axis) and uses domains DISJOINT from the
# conversation-history bench so the router learns the SHAPE rather
# than memorising bench wording. When adding to this set, ask:
# does this exemplar cover a new query shape, or is it a paraphrase
# of an existing one? Only the former earns a slot.
#
# Axes covered (one exemplar each):
#   A. First-person possessive + factual recall on a content area
#      that's mine ("what did I say about my X")
#   B. Explicit conversational referent ("in our chats / past
#      conversations / we've discussed")
#   C. Existential negation / has-it-ever-come-up
#   D. Reflexive pattern over time ("what have I been struggling
#      with / drawn to / wrestling with")
#   E. View evolution ("how has my thinking about X changed")
#   F. Recurring / aggregation ("what tensions keep showing up")
#
# Intent labels mix knowledge_query (single-shot recall) and
# deep_query (multi-conversation synthesis) — but the scope tag is
# the load-bearing signal, so both intents enter the same
# personal-corpus retrieval filter downstream.

# A. first-person possessive + factual recall
[[example]]
intent = "knowledge_query"
scope = "personal"
query = "What did I say about my houseplant care routine?"

# B. explicit conversational referent
[[example]]
intent = "knowledge_query"
scope = "personal"
query = "Across our past conversations, which hiking trails have I mentioned?"

# C. existential negation / has-it-ever-come-up
[[example]]
intent = "knowledge_query"
scope = "personal"
query = "Have I ever brought up sourdough bread baking in any chat?"

# D. reflexive pattern over time
[[example]]
intent = "deep_query"
scope = "personal"
query = "What have I been wrestling with creatively over the last few months?"

# E. view evolution
[[example]]
intent = "deep_query"
scope = "personal"
query = "How has my thinking about commuting changed since I moved?"

# F. recurring / aggregation
[[example]]
intent = "deep_query"
scope = "personal"
query = "What tensions keep showing up in how I describe my mornings?"

# G. recall of MY OWN PAST QUESTIONS across the archive.
#
# A genuinely new shape for this set, not a paraphrase: A/B/C/D/E/F all
# recall what the user SAID, MENTIONED, or THINKS. None covers what the
# user ASKED. That gap is load-bearing, because the locator axis's
# ordinal row ("What did I ask you at the very start of this chat?") is
# the single strongest attractor in the whole bank for archive-recall
# phrasings — it produced BOTH locator false positives
# (loc_abstain_last_week 0.668, loc_abstain_across_all_chats 0.660),
# and the locator hard-commits at Pre-check -2.5, ABOVE the archive
# classifier at -2.4, so nothing downstream can undo it.
#
# Deliberately avoids "first"/"start"/"this chat": the negative has to
# compete for the question-asking surface WITHOUT stealing
# loc_first_thing_this_chat, which is a true positive sitting on the
# same words.
[[example]]
intent = "knowledge_query"
scope = "personal"
query = "What kinds of things was I asking you about last summer?"


# ─────────────────────────────────────────────────────────────────
# Migrated from the retired skill `routing.trigger_phrases` lists.
# Skills-as-menu was retired in favour of intent-keyed policy;
# the trigger phrases that pointed users at the right "skill"
# now seed the router's classification directly. Each exemplar
# below is a SHAPE of query the corresponding retired skill
# wanted to handle — not a literal trigger phrase, because the
# embed router classifies whole user queries, not isolated
# keywords.
# ─────────────────────────────────────────────────────────────────

# ── codebase-navigator → code_query / metalingual_query ──
# These shapes all ask about the codebase as a coded system, so the
# in-system locator ("in this codebase", "in our project", "in our
# code") appears on BOTH sides and cannot be the discriminator. The
# migration that first landed this block treated the locator as
# load-bearing and filed every shape under metalingual_query; that put
# structural questions on a route with no call graph, and because
# `metalingual_query`'s nearest exemplar then won the k-NN, the
# code route became unreachable for the exact question CODE_INTEL_CHAT.md
# calls the "pop" test ("Where is tool dispatch implemented, and what
# calls it?" classified MetalingualQuery, sim=0.786 — measured
# 2026-07-25).
#
# The discriminator is the INTERROGATIVE SHAPE — what the user wants
# back, not what the question is about:
#
#   code_query        WHERE it lives · WHAT CALLS it · HOW it runs
#                     -> answered from the SCIP call graph
#   metalingual_query what a term MEANS in our system · what CHANGED
#                     -> answered from prose, docs, notes, code-as-text
#
# Both routes read the same code corpora (`IndexInfo::is_code_corpus`),
# so a misroute now costs precision rather than the answer.

[[example]]
intent = "code_query"
query = "Where is the function that handles tool dispatch in this codebase?"

[[example]]
intent = "code_query"
query = "Who calls KnowledgeViewManager::splice_into in our code?"

[[example]]
intent = "code_query"
query = "Find the implementation of the URL-allowlist constraint."

[[example]]
intent = "code_query"
query = "What's the call chain from handle_message_stream to the inference provider?"

# Re-filed from metalingual_query, 2026-07-29. Both predate the rule stated
# above and violate it outright: each asks WHERE something lives / HOW it is
# implemented, which is the call-graph side of the boundary. The 2026-07-25
# migration wrote the rule and added the four exemplars above it, but never
# swept the pre-existing metalingual block for shapes the new rule reclassified
# — so `metalingual_query` kept two of the strongest "where does it live"
# magnets in the bank. Measured cost before this move: they were the winning
# rival on `int_code_chunker_type` (mislabelled code_query -> metalingual at
# sim 0.623) and the runner-up suppressing the margin on `int_code_retry_owner`.
#
# SIDE EFFECT — MEASURED, NOT REASONED. A/B'd on 2026-07-29 by flipping these
# two tags back, rebuilding the cache, and re-fitting: consolidating two classes
# that shared a neighbourhood INFLATES THE MARGIN for everything in it, because
# margin is a RELATIVE measure and the absorbed class was the runner-up
# suppressing it. Nothing about the queries or their embeddings changed — only
# which class claimed the win:
#
#   int_abstain_chunker_overlap_hunch   +0.043 -> +0.128   (should ABSTAIN)
#   int_code_retry_owner                +0.058 -> +0.127
#   int_code_chunker_type               +0.214 -> +0.223
#   int_code_tokenizer_handoff          +0.110 -> +0.116
#
# The first line is the warning: an under-determined query got 3x more
# confident without becoming any more correct. At the margin of 0.100 that
# shipped at the time, this move CREATED that false positive — it did not
# merely relabel a pre-existing one, which is what a plausible-sounding
# argument from "the same exemplar wins either way" predicted. It is harmless
# at the 0.206 margin shipped now (0.128 is well below the gate) and the move
# is a clear net win there: 2 correct/1 mislabel -> 3 correct/0 mislabel.
#
# GENERAL RULE: after re-filing exemplars BETWEEN classes, re-check the ABSTAIN
# cases, not just the positives. Merging classes cannot change any similarity,
# but it can and does raise confidence across the whole shared region.
[[example]]
intent = "code_query"
query = "Where is the chunking strategy defined here?"

[[example]]
intent = "code_query"
query = "How is rerank implemented here?"

# Stays metalingual: asks what a term MEANS here, not where it lives.
[[example]]
intent = "metalingual_query"
query = "What does `IntentPolicy` mean in this project?"

# Stays metalingual: asks what CHANGED, which the call graph cannot
# answer — this is history over the repo, served by `recent_changes`.
[[example]]
intent = "metalingual_query"
query = "What recent changes touched the router classification pipeline?"

