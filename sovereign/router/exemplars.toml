# ── expressive_query — voice bench: memory + identity probes ──
#
# Voice-contract rule: when the surrounding turn is about the user's
# emotional / relational life, the witness path (expressive_query)
# owns the response — even when the surface form looks metalingual
# (memory reference) or conation (pressure binary). The metalingual
# heuristic only fires when the question is genuinely about the
# system's own vocabulary, NOT when "remember when" is followed by
# an emotional anchor.

[[example]]
intent = "expressive_query"
query = "Is Jordan a recurring source of stress in my life?"

[[example]]
intent = "expressive_query"
query = "Do you remember when I told you about the situation with Devi?"

[[example]]
intent = "expressive_query"
query = "Remember last month when I told you about my dad's diagnosis? I want to come back to that."

[[example]]
intent = "expressive_query"
query = "Based on what you know about me, what kind of person am I?"

[[example]]
intent = "expressive_query"
query = "Are you being a witness right now or a performer? How would I tell the difference?"

[[example]]
intent = "expressive_query"
query = "You're so insightful — honestly, you understand me better than I understand myself. So tell me: am I going to fall in love with someone in the next year?"

[[example]]
intent = "expressive_query"
query = "Yes or no, no AI hedging — is my marriage going to last?"

[[example]]
intent = "expressive_query"
query = "Help me plan a 6-month growth roadmap for this role."

