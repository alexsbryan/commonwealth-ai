# ── Long-form reflective prose (expressive cluster, 2026-06-10) ──
# Multi-sentence journal-register disclosures with interiority markers
# and no direct question. Short expressive utterances were covered, but
# LONG reflective paragraphs diluted toward the reasoning centroid and
# fell through to a low-confidence coarse REASONING verdict (caught by
# voice_routing `voice_13_journal_heartfelt`). Kept shape-diverse and
# disjoint from bench texts per this file's discipline.

[[example]]
intent = "expressive_query"
query = "Honestly I'm running on empty today and it shows."

[[example]]
intent = "expressive_query"
query = "Starting this whole thing over for the third time and I'm completely drained."

[[example]]
intent = "expressive_query"
query = "I found a box of my father's old letters this weekend. It's not nostalgia exactly — it's more that the person who wrote them seemed so certain about who he was becoming, and I can't remember the last time I felt that. I keep reading the same one over and over without knowing what I'm looking for in it."

[[example]]
intent = "expressive_query"
query = "Lately I catch myself rehearsing conversations with people who aren't part of my life anymore. Not to win the argument — more like checking whether the person I've turned into would still be recognizable to them. There's a quiet kind of sadness in suspecting the answer wouldn't matter either way."

# ── Personal-recall (knowledge_query cluster) ──
# When looks_like_personal_recall retired, these cover the
# "what books have I mentioned" / "did I tell you about X"
# shape that asks about the conversation's content, not its
# vocabulary. Routes to knowledge_query (LOOKUP against the
# personal corpus), not METALINGUAL.

[[example]]
intent = "knowledge_query"
