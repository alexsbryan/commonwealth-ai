# ── comparison_query — bounded two-entity contrast ──
#
# EVERY exemplar here opens with an explicit marker verb (compare / contrast /
# differ / difference), so the class cannot distinguish having learned the
# stated SHAPE from having learned the vocabulary. That confound is real and
# still open — but DO NOT try to close it by adding marker-free exemplars.
# That was tried on 2026-07-29 and refuted: three were added (imperative
# "Set Darwin against Lamarck…", confusion-framing "I keep mixing up Freud and
# Jung…", and "Where does Hobbes leave off and Rousseau begin…"), the cache was
# rebuilt, and every single calibration case came back BYTE-IDENTICAL —
# `int_cmp_rawls_nozick` still at sim 0.577 / margin +0.120, still beaten by
# the same deep_query exemplar, with comparison's best still the pre-existing
# "Compare the act and rule formulations of utilitarianism." at 0.457.
#
# The reason is that this axis is k=1 nearest-neighbour and TOPIC dominates
# surface: `int_cmp_rawls_nozick` loses to a deep_query exemplar about RAWLS,
# and no exemplar about Darwin, Freud or Hobbes can reach it however well it
# matches the shape. The control case `int_cmp_hawk_dove` lands at 0.357 with
# comparison_query not even the runner-up. The only exemplar that could win
# the Rawls case is one about Rawls — which is coaching to the bank, not a fix.
# See `int_cmp_hawk_dove` in the calibration bank for the full record.

[[example]]
intent = "comparison_query"
query = "Compare Locke and Reid on personal identity."

[[example]]
