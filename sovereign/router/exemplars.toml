query = "Trace how a chat message becomes a streamed response."

[[example]]
intent = "code_query"
query = "Which function decides whether to show or withhold a generated answer?"

[[example]]
intent = "code_query"
query = "How does the router classify a query into an intent in the code?"

[[example]]
intent = "code_query"
query = "What's the call graph around select_route?"

[[example]]
intent = "code_query"
query = "Where in the code does the system pick which GPU slot to use?"

[[example]]
