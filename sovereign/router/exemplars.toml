# ── cells_v1 regression patches ──
# Two SHAPES under-represented in the cluster centroids surfaced
# as nearest-neighbour misroutes on the cells_v1 routing bench.
# Per `feedback_no_teaching_to_test`, each addition uses
# different surface vocabulary than the failing bench question —
# the cluster should generalise across subject matter.

# Source-attribution metalingual: "According to <named external
# source>, what does <term> mean?" — the question is about how
# a specific source uses a term, not the term's free-form
# meaning. Distinct from the existing "in this codebase / in
# our project" metalingual cluster (which is self-referential).
# Source-attribution metalingual is still about HOW SOMEONE
# USES A WORD, just with the someone being an external named
# document rather than the conversation itself.

[[example]]
intent = "metalingual_query"
query = "According to Wikipedia, what does 'recursion' mean?"

[[example]]
intent = "metalingual_query"
query = "What does the IPCC define as a climate tipping point?"

[[example]]
