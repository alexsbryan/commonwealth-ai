query = "What does the rulebook define as a 'foul' in this context?"

# Generic-concept comparison: "What's the difference between X
# and Y?" where X and Y are well-known concepts (programming
# constructs, scientific phenomena, protocols) rather than
# symbols in this codebase. The metalingual "in our codebase"
# variant has been pulling these into metalingual via nearest-
# neighbour drift; these additions reweight the comparison
# centroid toward generic-concept asks.

[[example]]
intent = "comparison_query"
query = "What's the difference between SQL and NoSQL databases?"

[[example]]
intent = "comparison_query"
query = "How do TCP and UDP differ as transport protocols?"

[[example]]
intent = "comparison_query"
query = "What's the difference between a function and a method in object-oriented code?"

# ── code_query — how THIS codebase works (Inc 4, first-class code route) ──
# Retrieval rides the intent-summary bridge (plain-English -> symbol) and the
# answer is grounded in the SCIP call-graph trace, scoped to code corpora.
# Distinct from metalingual (vocabulary — "what does X *mean* here") and
# deep_query (open-ended reasoning). The separating signal is the CODE-STRUCTURE
# locator: "what calls X", "where is Y implemented", "trace the flow", "which
# function does Z", "call graph". Keep these phrasings code-structural so the
# cluster does not steal general "how does X work" knowledge questions — the
# routing bench (`bench --routing-only`) guards that boundary.

[[example]]
intent = "code_query"
query = "How does inference actually run when I send a chat message?"

[[example]]
intent = "code_query"
query = "What calls gate_answer?"

[[example]]
intent = "code_query"
query = "Where is the retrieval pipeline implemented in the code?"

[[example]]
