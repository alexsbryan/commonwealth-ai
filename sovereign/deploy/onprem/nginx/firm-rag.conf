# nginx front door for the on-prem legal pilot.
#
#   lawyers ──TLS──▶ nginx :443 ──loopback──▶ sovereign-onprem :9741
#
# This file is an ALLOWLIST. Every client route is named explicitly, with
# the methods it takes, and everything else returns 404. It is exactly
# the route list acceptance.sh exercises (CLIENT_ROUTES there), pinned
# equal by corpus-engine/xtask/tests/onprem_kit_allowlist.rs, and
# every route in it is one a lawyer's key may reach (the daemon's
# KEY_SCOPE, sovereign-daemon api_keys.rs).
#
# Why an allowlist when the daemon already decides by key: the on-prem
# binary does not compose the shell, web or MCP surfaces at all, and the
# daemon refuses every admin route to a lawyer's key. This file is the
# third lock. If someone ever installs the wrong binary or hands out IT's
# key, the admin and ingest routes are still unreachable from the
# network. `acceptance.sh` check 0 proves the first two locks at the
# daemon's own port; this file is what holds if that proof is skipped.
#
# What this file deliberately does NOT do: authenticate. The daemon owns
# API keys (`svrn daemon key`), and a second decider here would be a
# second place to get it wrong. nginx's job is to pass the
# `Authorization` header through untouched — which it does by default,
# and which nothing below overrides. Behind nginx every request arrives
# from loopback, and on a daemon holding keys loopback grants nothing.
#
# ── Before you reload ────────────────────────────────────────────────
#   1. Replace firm-rag.example.com with the real hostname.
#   2. Put real certs at the two ssl_certificate paths.
#   3. `nginx -t`  — then `systemctl reload nginx`.
#   4. Run `acceptance.sh` with BASE_URL=https://<hostname> as well as
#      against the daemon's port. Testing only the backend bypasses this
#      file and proves nothing about what a lawyer's laptop can reach.

upstream sovereign_daemon {
    server 127.0.0.1:9741;
    keepalive 16;
}

# Plain HTTP exists only to bounce to TLS. No route is served here.
server {
    listen 80;
    listen [::]:80;
    server_name firm-rag.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name firm-rag.example.com;

    ssl_certificate     /etc/ssl/firm-rag/fullchain.pem;
    ssl_certificate_key /etc/ssl/firm-rag/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # No route below takes an upload: documents arrive through the
    # watched share, never over HTTP.
    client_max_body_size 1m;

    # This is the access log the firm's security team will ask for. It
    # records who reached what and when; it does NOT record prompt or
    # answer bodies.
    access_log /var/log/nginx/firm-rag.access.log;
    error_log  /var/log/nginx/firm-rag.error.log;

    # ── Shared proxy settings ────────────────────────────────────────
    # Included by every allowed location below. Kept in a snippet so a
    # timeout fix cannot land on 13 of 14 routes.
    #
    # `limit_except` names the methods each route takes; any other
    # method is refused here (403) before it reaches the daemon.

    # ── DENY: exact matches that would otherwise hit an allow pattern ──
    # Exact (`=`) and `^~` matches are evaluated before regex, so these
    # win over the allowlist patterns further down.

    # IT's legacy-document route reads as a document id to the pattern
    # below. The daemon refuses it to a lawyer's key too.
    location = /v1/documents/legacy { return 404; }

    # Not composed in the on-prem binary (a named 503 there); never
    # proxied. Listed so the intent survives an edit to the patterns.
    location ^~ /mcp      { return 404; }
    location ^~ /v1/solve { return 404; }

    # Unauthenticated status: model names, ports, the node id. /health
    # below is the probe to use.
    location = /status { return 404; }

    # ── ALLOW: exactly the client routes ─────────────────────────────

    # Liveness for the firm's own monitoring. Returns the literal `ok`,
    # and is the one route that needs no key.
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
        access_log off;
    }

    # Conversations: list (the caller's own) + create.
    location = /v1/conversations {
        limit_except GET POST { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Search the caller's own conversations.
    location = /v1/conversations/search {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Streaming turn (WebSocket upgrade). The upgrade request carries the
    # bearer header and nothing else.
    location ~ ^/v1/conversations/[^/]+/stream$ {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        # The headers only: the shared snippet's version, timeouts and
        # buffering are set below, and nginx refuses a directive set twice.
        include /etc/nginx/snippets/firm-rag-proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A long turn can go minutes between frames. Idle-closing the
        # socket mid-answer is indistinguishable to the user from the
        # model failing.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # Post a turn (non-streaming).
    location ~ ^/v1/conversations/[^/]+/messages$ {
        limit_except POST { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Fetch or delete one conversation.
    location ~ ^/v1/conversations/[^/]+$ {
        limit_except GET DELETE { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # The hardening probe and the corpus list.
    location = /v1/tools {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location = /v1/corpora {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Read a cited chunk with its neighbours. This is what makes a
    # citation clickable.
    location ~ ^/v1/corpora/[^/]+/chunks/[^/]+$ {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Documents: list and read, ingest progress, ask about one, and poll
    # the ask (the daemon answers an ask 202 + a job id).
    location = /v1/documents {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/documents/[^/]+/progress$ {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/documents/[^/]+/ask$ {
        limit_except POST { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/documents/[^/]+/ask/[^/]+$ {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/documents/[^/]+$ {
        limit_except GET { deny all; }
        proxy_pass http://sovereign_daemon;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # ── Everything else ──────────────────────────────────────────────
    # 404, not 403: an unlisted route should not confirm it exists.
    location / { return 404; }
}
