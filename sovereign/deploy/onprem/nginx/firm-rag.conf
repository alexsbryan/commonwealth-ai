# nginx front door for the on-prem legal pilot.
#
#   lawyers ──TLS──▶ nginx :443 ──loopback──▶ sovereign-server :8080
#
# This file is an ALLOWLIST. Every client route is named explicitly and
# everything else returns 404. That is deliberate and not paranoia:
#
#   * `sovereign-server` decides trust by peer address in one place
#     (`routes_mcp.rs` gates on `ip.is_loopback()`), and nginx running on
#     the same host satisfies that check on behalf of EVERY remote caller.
#     A loopback check is not a security boundary once a reverse proxy
#     sits in front of it.
#   * The `--no-default-features` build already compiles the dangerous
#     routes out. The explicit `return 404` blocks below are the second
#     lock: if someone ever installs a default-features binary by mistake,
#     the shell-reaching and absolute-path-ingesting routes are still
#     unreachable from the network. `acceptance.sh` check 0 proves the
#     first lock; this file is what holds if that proof is skipped.
#
# What this file deliberately does NOT do: authenticate. `sovereign-server`
# owns bearer auth per tenant (`auth.rs`), and a second decider here would
# be a second place to get it wrong. nginx's job is to pass the
# `Authorization` header through untouched — which it does by default, and
# which nothing below overrides.
#
# ── Before you reload ────────────────────────────────────────────────
#   1. Replace firm-rag.example.com with the real hostname.
#   2. Put real certs at the two ssl_certificate paths.
#   3. `nginx -t`  — then `systemctl reload nginx`.
#   4. Run `acceptance.sh` against https://<hostname>, not against
#      127.0.0.1:8080. Testing the backend directly bypasses this file
#      and proves nothing about what a lawyer's laptop can reach.

upstream sovereign_server {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Plain HTTP exists only to bounce to TLS. No route is served here.
server {
    listen 80;
    listen [::]:80;
    server_name firm-rag.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name firm-rag.example.com;

    ssl_certificate     /etc/ssl/firm-rag/fullchain.pem;
    ssl_certificate_key /etc/ssl/firm-rag/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # An OCR'd discovery PDF is not a small upload. Raise if the firm
    # ingests via HTTP rather than the mounted share (the runbook uses
    # the share, so this is headroom, not a hot path).
    client_max_body_size 64m;

    # This is the access log the firm's security team will ask for. It
    # records who reached what and when; it does NOT record prompt or
    # answer bodies.
    access_log /var/log/nginx/firm-rag.access.log;
    error_log  /var/log/nginx/firm-rag.error.log;

    # ── Shared proxy settings ────────────────────────────────────────
    # Included by every allowed location below. Kept in a snippet so a
    # timeout fix cannot land on 12 of 13 routes.
    #
    # proxy_read_timeout is 600s because a grounded turn on a 35B model
    # is minutes, not seconds, and the REST (non-WebSocket) path gives
    # the caller no queue signal while it waits — only the WebSocket
    # route emits QueuePosition. A stingy timeout here shows up as an
    # unexplained 504 mid-answer.
    #
    # NOTE: `proxy_set_header Authorization` is deliberately absent.
    # nginx forwards the client's header unchanged unless told otherwise;
    # naming it here would risk clobbering it.

    # ── DENY: compiled out of the hardened build, blocked here anyway ──
    # Exact (`=`) and `^~` matches are evaluated before regex, so these
    # win over the allowlist patterns further down — including the case
    # where "upload" would otherwise match a document-id pattern.

    # Client-supplied `test_command` reaches `sh -c` inside the
    # AUTHENTICATED router: any valid tenant key would be a shell.
    location = /v1/solve      { return 404; }
    location = /v1/cycle/bdd  { return 404; }

    # Ingest an absolute SERVER-side path — any tenant could read any
    # file the process can, including the config holding every other
    # tenant's key, into their own queryable corpus.
    location = /v1/documents/upload { return 404; }
    location = /v1/corpora/upload   { return 404; }

    # Registered OUTSIDE the auth layer; its only guard is
    # `ip.is_loopback()`, which this proxy satisfies for every caller on
    # the internet. Also carries TddState — a second path to the shell.
    location ^~ /mcp { return 404; }

    # Unauthenticated, and echoes the iroh dial string. Harmless with
    # `[iroh] enabled = false`, but it is a pairing surface and no client
    # needs it. /health below is the probe to use.
    location = /status { return 404; }

    # ── ALLOW: exactly the client routes ─────────────────────────────

    # Liveness for the firm's own monitoring. Returns the literal `ok`.
    location = /health {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
        access_log off;
    }

    # Conversations: create + list.
    location ~ ^/v1/conversations$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Streaming turn (WebSocket upgrade). Must come before the generic
    # `/v1/conversations/<id>` pattern — nginx takes the FIRST matching
    # regex in file order, not the most specific.
    #
    # The upgrade request carries the bearer header and nothing else:
    # `ws_handler` reads its tenant from the extension the shared auth
    # middleware inserts, so there is no WS-specific token to forward.
    location ~ ^/v1/conversations/[^/]+/stream$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A long turn can go minutes between frames. Idle-closing the
        # socket mid-answer is indistinguishable to the user from the
        # model failing.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # Post a turn (non-streaming).
    location ~ ^/v1/conversations/[^/]+/messages$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Fetch or delete one conversation.
    location ~ ^/v1/conversations/[^/]+$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Answer a pending approval step.
    location ~ ^/v1/tasks/[^/]+/approve$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    location = /v1/tools {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # List corpora, and read a cited chunk. The chunk route is what makes
    # a citation clickable — without it the UI can show a citation but
    # not the passage it points at.
    location = /v1/corpora {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/corpora/[^/]+/chunks/[^/]+$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    location = /v1/search {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # Documents: list, read/delete one, ask about one, ingest progress.
    location = /v1/documents {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/documents/[^/]+/ask$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/documents/[^/]+/state$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }
    location ~ ^/v1/documents/[^/]+$ {
        proxy_pass http://sovereign_server;
        include /etc/nginx/snippets/firm-rag-proxy.conf;
    }

    # ── Everything else ──────────────────────────────────────────────
    # 404, not 403: an unlisted route should not confirm it exists.
    location / { return 404; }
}
