# Shared proxy settings for every allowed location in firm-rag.conf.
#
# Installed to /etc/nginx/snippets/firm-rag-proxy.conf by install.sh.
# It lives in one file so a timeout or header fix cannot land on 12 of
# the 13 proxied routes and be "fixed" while still broken on the 13th.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# `Authorization` and `X-API-Key` are NOT named here on purpose. nginx
# forwards client request headers unchanged; naming one risks clobbering
# it, and sovereign-server's auth.rs reads both. Auth is decided there,
# once — see the header comment in firm-rag.conf.

proxy_http_version 1.1;
proxy_set_header Connection "";

# A grounded turn on a 35B model is minutes. The REST path emits no queue
# signal while the caller waits (only the WebSocket route sends
# QueuePosition), so a short read timeout surfaces as an unexplained 504
# in the middle of an answer.
proxy_connect_timeout 10s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;

# Answers can be large and are streamed by the backend; buffering them
# to disk adds latency and writes response text to the proxy's spool.
proxy_buffering off;
