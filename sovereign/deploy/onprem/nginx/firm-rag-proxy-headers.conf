# The forwarding headers every proxied location sends, the REST routes
# through firm-rag-proxy.conf and the WebSocket stream route directly.
#
# Installed to /etc/nginx/snippets/firm-rag-proxy-headers.conf by
# install.sh. A file of its own because the stream route sets its own
# http version, timeouts and buffering, and nginx refuses a block that sets
# one of those twice (`directive is duplicate`): it cannot include
# firm-rag-proxy.conf whole (quality/xtask/tests/onprem_kit_allowlist.rs
# reads the config for that).

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# `Authorization` is NOT named here on purpose. nginx forwards client
# request headers unchanged; naming it risks clobbering it, and the
# daemon identifies every caller by the bearer key it carries. Auth is
# decided there, once — see the header comment in firm-rag.conf.
