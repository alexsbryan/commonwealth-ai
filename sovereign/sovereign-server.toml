# Sovereign Server Configuration
# Copy this file and adjust for your deployment.

[server]
# Loopback by default — only this machine can reach the API. To serve other
# devices (a phone on your tailnet, LAN clients), widen the bind AND configure
# [auth] below: the server refuses a non-loopback bind with auth disabled
# unless you explicitly opt in.
bind = "127.0.0.1:8080"
# bind = "0.0.0.0:8080"               # remote access — requires [auth] keys
# allow_unauthenticated_remote = true  # last resort: open bind, no auth (deliberate trust boundary only)
# cors = "auto"                        # "auto" (permissive iff auth on) | "permissive" | "off"

[auth]
# "api_key" or "none"
mode = "none"
# API key → tenant ID mapping (when mode = "api_key")
# keys = { "sk-your-key-here" = "tenant-1", "sk-another-key" = "tenant-2" }

[inference]
# Path to GGUF model file (required)
model = "models/fast.gguf"
# Optional: larger model for deep reasoning
# primary_model = "models/primary.gguf"
context_size = 2048

# Multi-backend routing. Declaring [[inference.backends]] OVERRIDES the
# single-model form above entirely. Backends compose into a health-checked
# router that falls back by priority (lower wins), so a remote GPU box can
# serve the heavy model while a local GGUF covers it when that box is down.
#
# This is the only place an external OpenAI-compatible server (vLLM, SGLang,
# llama.cpp's server, TGI, Ollama, a LiteLLM proxy) can be wired in — the
# main `svrn daemon` is embedded-only. See docs/INTEROP.md §9.
#
# [[inference.backends]]
# name          = "local"
# type          = "embedded"                 # "embedded" | "remote"
# primary_model = "models/primary.gguf"
# priority      = 1
#
# [[inference.backends]]
# name          = "vllm-box"
# type          = "remote"
# endpoint      = "http://gpu-host:8000/v1"  # default http://localhost:8000/v1
# api_key       = "sk-..."                   # optional
# model_id      = "Qwen3-32B"                # default "default"
# context_size  = 32768
# priority      = 2
#
# An unrecognised `type` only warns — it does not fail startup, so a typo
# silently drops that backend.

[store]
mode = "sqlite"
path = "data/sovereign.db"

