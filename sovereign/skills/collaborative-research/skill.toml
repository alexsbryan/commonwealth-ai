[skill]
id = "collaborative-research"
name = "Collaborative Research"
version = "0.1.0"
description = """
Research mode that pairs the agent's local corpus knowledge with your ability
to find specific primary sources. The agent searches what it has, identifies
the precise gap that would most sharpen its answer, and surfaces a structured
information request — a card showing what it knows, what it needs, why it
matters, and where to look. You paste a passage from a paper, statistic, or
primary source; the agent re-synthesises with your contribution attributed.

Use this when:
  - The corpus is thin on the specific empirical claim that decides the answer
  - The question hinges on recent (post-corpus) evidence
  - You have access to a paper, dataset, or expert source the agent cannot reach

Skip this when you just want a quick answer — collaboration adds a turn of
back-and-forth.
"""

[routing]
trigger_phrases = [
    "research collaboratively",
    "collab mode",
    "let's collaborate on",
    "inquire deeply into",
    "let's research together",
]
default_intent = "ComplexTask"
min_confidence = 0.75

[[planner.templates]]
name = "collaborative_inquiry"
trigger = "User asks a research question and wants to fill in gaps as the agent identifies them"
steps = """
1. reason_with_tools[search+claim_search+epistemic_landscape, max_iter:8]
   Search the local corpus thoroughly for the question. Build the strongest
   possible answer from existing material before deciding anything is missing.
2. reason[speed:fast, structured_output:gap_schema]
   Audit the answer for the single most valuable missing piece of evidence.
   If the corpus is already strong, return {"has_gap": false} and proceed
   to step 5. Otherwise emit a populated InformationRequest.
3. await_user_info[from:step_2]
   Present the gap to the user. Wait for them to paste relevant content,
   or to skip if they don't have anything to add.
4. reason[speed:slow, inputs:[step_1.output, step_3.output]]
   Re-synthesise. Integrate the user-provided content with clear attribution:
   what came from the indexed corpus vs. what came from the user's source.
   Be explicit about what remains uncertain.
5. reason[speed:slow, inputs:[step_1.output]]
   Synthesise from corpus-only evidence (used when no gap was identified).
"""

[tools]
required = ["search"]
optional = ["claim_search", "epistemic_landscape", "document"]

[tools.search]
prefer_local = true

[prompts]
synthesis = """When integrating user-provided content from an AwaitUserInfo step,
clearly distinguish three sources in your answer:
  - What came from the indexed corpus (cite by source name as usual)
  - What came from the user's contribution (label as "from your source")
  - What remains uncertain (state explicitly; do not paper over gaps)

Treat the user's contribution as primary evidence — they vouched for it by
providing it — but flag it visibly so the reader knows the provenance.
"""

[evaluation]
gap_schema = """Audit the agent's answer to the user's question. Identify the
single most valuable external piece of information that would materially
sharpen the answer. Return JSON only:
{
  "has_gap": true|false,
  "current_understanding": "what the agent now believes",
  "gap": "a precise question or claim to verify",
  "relevance": "how resolving the gap would change the answer",
  "satisfying_source": "what kind of source would satisfy the request",
  "search_hints": ["specific journal", "specific term", "specific database"]
}
If the corpus evidence is strong enough that no single external item would
materially improve the answer, return {"has_gap": false}.
"""

[inference]
privacy = "MeshAllowed"
min_context_tokens = 16384

[inference.preferred_capabilities]
analysis = 3
general = 3

[memory]
extract_prompt_addendum = """For collaborative research conversations, extract:
  - Sources the user contributed and what they were used to support
  - Gaps the agent surfaced and how (or whether) the user filled them
  - The user's areas of demonstrated source expertise (so future requests
    can be more targeted to where they already know to look)
"""
confidence_decay_per_month = 0.05
prune_threshold = 0.1
