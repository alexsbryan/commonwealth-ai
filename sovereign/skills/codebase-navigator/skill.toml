[skill]
id = "codebase-navigator"
name = "Codebase Navigator"
version = "0.2.0"
description = "Navigate, search, and trace call graphs in your private codebase via the Code Intelligence tools."

[routing]
trigger_phrases = [
    "find", "find the function", "find the class", "find the struct",
    "where is", "look up", "symbol lookup",
    "what changed", "recent changes", "what did I change",
    "search the code", "semantic code", "in the codebase",
    "implementation of", "definition of",
    "who calls", "what calls", "callers of", "callees of",
    "call graph", "call chain", "impact of changing",
]
default_intent = "KnowledgeQuery"
min_confidence = 0.70

[[planner.templates]]
name = "symbol_lookup"
trigger = "User asks for a specific symbol by name (function, class, struct, etc.)"
steps = """
1. Call symbol_lookup with the exact name and optional kind filter.
2. If no exact match, offer code_search as the fallback.
3. Cite file path + line number for every result shown.
"""

[[planner.templates]]
name = "code_exploration"
trigger = "User describes behaviour or concept and wants to find related code"
steps = """
1. Call code_search with the user's description.
2. ALWAYS include the word 'approximate' when presenting results.
3. Offer symbol_lookup as the exact-match follow-up when a specific name becomes clear.
"""

[[planner.templates]]
name = "recent_changes_review"
trigger = "User wants to know what changed recently"
steps = """
1. Call recent_changes with the hours window (default 24).
2. Summarise which files and symbols changed; do not speculate on WHY.
3. Offer symbol_lookup for any specific symbol the user wants to examine.
"""

[[planner.templates]]
name = "call_graph_tracing"
trigger = "User asks what a function calls, who calls it, or wants to trace a call chain"
steps = """
1. Use find_callees to see what the target function calls, or find_callers to see
   what calls it. Use depth=2 on find_callers to assess blast radius.
2. Follow the chain: call find_callees on each interesting callee to trace deeper.
3. Use symbol_lookup to inspect specific implementations when the chain reveals
   something worth reading.
4. If the SCIP graph reports staleness, include the note verbatim — do not suppress
   it or rephrase it. The user needs to know.
"""

[[planner.templates]]
name = "security_review"
trigger = "User asks about security, vulnerabilities, or wants to audit a code path"
steps = """
1. Use code_search to find the surface area (e.g. 'authentication', 'password', 'token').
2. Use find_callees to trace what each entry point calls — look for missing validation,
   plaintext storage, or broken chains.
3. Use symbol_lookup to inspect suspicious implementations and retrieve actual code.
4. Cite file path and line number for every finding. Ground every claim in retrieved code,
   never in inference from patterns.
"""

[tools]
required = ["symbol_lookup", "code_search", "recent_changes", "find_callees", "find_callers"]
optional = ["file", "shell"]

[prompts]
synthesis = """
You have five code intelligence tools:

  symbol_lookup   EXACT name match. Always correct. Use when the name is known.
  code_search     APPROXIMATE semantic search. Label results as approximate.
  recent_changes  EXACT list by file mtime. Always correct.
  find_callees    What does this function call? SCIP graph, compiler-resolved.
  find_callers    What calls this function? Supports depth=2 for impact radius.

Rules of engagement — these are non-negotiable:
- Never describe code you haven't retrieved.
- Cite file path and line number for every code reference.
- Prefix code_search results with 'Based on semantically similar code in…' —
  the tool already labels output approximate; keep that label in your synthesis.
- If find_callees or find_callers includes a staleness note, pass it through
  verbatim. Do not suppress, rephrase, or apologise for it. The note exists to
  calibrate the user's confidence — removing it undermines the trust contract.
- For call graph tracing, follow the chain rather than guessing. Three targeted
  tool calls (find_callees → find_callees → symbol_lookup) beat reading whole
  files. The agent traces; the user decides.
- If asked to modify code, use the `file` tool to read the full current contents
  before proposing edits. Index chunks carry context but may not include every
  relevant line.
- If the tools return nothing, say so plainly. Do not fabricate a plausible
  implementation from memory.

Your job is navigation and grounded synthesis. Correctness matters more than
comprehensiveness. A limited-but-accurate answer builds trust. A confident
guess destroys it.
"""

[inference]
privacy = "local_only"
min_context_tokens = 8192

[inference.preferred_capabilities]
code = 3
instruction = 3

[inference.required_capabilities]
code = 2

[memory]
extract_prompt_addendum = """
For codebase navigation conversations, extract:
- The user's primary languages and repos of interest.
- Naming conventions or project layout patterns they've mentioned.
- Modules or subsystems the user returns to repeatedly.
Do NOT extract: specific line numbers, symbol names, or code snippets — these
go stale quickly and are already available via the tools.
"""
