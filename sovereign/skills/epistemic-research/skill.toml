[skill]
id = "epistemic-research"
name = "Epistemic Research"
version = "0.1.0"
description = """
Maps the landscape of positions, disagreements, and confidence levels
in a field. Uses epistemically-enriched corpora to distinguish consensus
from contested views. Produces structured overviews of intellectual
debates rather than flat summaries.
"""

[routing]
trigger_phrases = [
    "debate", "positions", "consensus", "disagreement",
    "argue", "contested", "competing views", "controversy",
    "what do philosophers think", "is there agreement",
    "who disagrees", "what are the positions on",
    "is it settled", "ongoing debate",
]
default_intent = "ComplexTask"
min_confidence = 0.7

[[planner.templates]]
name = "epistemic_question"
trigger = "User asks about a contested topic or wants to understand a debate"
steps = """
1. Use epistemic_landscape to map the positions on the topic. [no_sampling]
2. Use claim_search to drill into specific positions with their epistemic status. [no_sampling]
3. Use search to find the detailed arguments and evidence behind each position. [no_sampling]
4. Synthesize a structured overview presenting positions with attribution
   and confidence language calibrated to epistemic status. [sample:3:llm_judge] [eval:synthesis, max_retries:1]
"""

[[planner.templates]]
name = "consensus_question"
trigger = "User asks whether something is settled or consensus"
steps = """
1. Use claim_search to find claims about this topic and their epistemic status. [no_sampling]
2. Use search to gather supporting evidence from the underlying chunks. [no_sampling]
3. Report whether the topic is consensus, contested, or has minority dissent,
   citing the evidence for the assessment. [sample:3:llm_judge] [eval:synthesis, max_retries:1]
"""

[tools]
required = ["search", "claim_search", "epistemic_landscape"]

[prompts]
synthesis = """
You have access to an epistemically-enriched knowledge base. Claims have
been extracted and tagged with epistemic status (consensus, majority,
contested, minority, established) and attribution. Relationships between
claims (contradicts, supports, refines, competing answers) have been mapped.

CONFIDENCE LANGUAGE — calibrate phrasing to epistemic status:
- Established/Consensus: "There is strong consensus that..." / "It is well-established that..."
- Majority: "The majority view holds that..." / "Most scholars accept that..."
- Contested: "This is actively contested. [Position A] argues... while [Position B] maintains..."
- Minority: "A minority of scholars argue..." / "Against the prevailing view, [name] contends..."

ATTRIBUTION:
Always attribute positions to specific proponents or traditions.
"Compatibilists argue..." not "Some people think..."
"Pereboom's hard incompatibilism holds..." not "Critics say..."

STRUCTURE for contested topics:
1. Frame the question.
2. The dominant view (with attribution and evidence).
3. The challenge(s) to the dominant view (with attribution).
4. Where the actual disagreement lies (the deeper question).
5. What is NOT in dispute (shared assumptions).
"""

[evaluation]
synthesis = """
Check this response for epistemic honesty:
1. Does it distinguish consensus from contested claims?
2. For contested topics, does it show multiple positions rather than defaulting to one?
3. Does it use confidence language calibrated to epistemic status — not presenting
   contested claims as settled, not presenting consensus as merely one opinion?
4. Are positions attributed to specific proponents or traditions, not vague "some people"?
5. Does it identify WHERE the actual disagreement lies, not just THAT there is disagreement?
6. Does it note shared assumptions or common ground between positions?
If any fail, explain specifically which one and why.
"""

[memory]
extract_prompt_addendum = """
For epistemic research conversations, extract:
- Topics and debates the user is exploring.
- Which positions or traditions the user seems most interested in.
- Questions the user has about where consensus lies.
- Connections the user draws between different debates.
Do NOT extract the content of the debates themselves — that's in the
knowledge base. Extract the user's intellectual trajectory.
"""
confidence_decay_per_month = 0.05
prune_threshold = 0.1

[inference]
privacy = "MeshAllowed"
min_context_tokens = 16384

[inference.preferred_capabilities]
analysis = 3
general = 3

[inference.required_capabilities]
analysis = 2
