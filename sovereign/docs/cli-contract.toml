# Code intelligence — NO LONGER wholly dev-tools-gated. As of 2026-08-06
# `project register|unregister|list|watch` ship in every build and
# `code index` / `refresh` ship behind `code-intel`, which the release build
# passes. The MCP server on :9741 is still how code intel is *consumed*; these
# verbs are how a repo gets indexed in the first place, which is why they had
# to stop being developer-only. As of 2026-08-07 `project init` joined them
# behind `code-intel`; only the ANALYSIS subcommands remain dev-tools (exit 2
# in the shipped binary).
[[command]]
path = "project init"
binary = "dispatcher"
feature = "code-intel"
flags = [
  { name = "--name", takes_value = true },
  { name = "--no-scip" },
  { name = "--no-hooks" },
  { name = "--no-claude-config" },
  { name = "--workspace-root", takes_value = true },
  { name = "--port", takes_value = true },
]
[[command]]
path = "project design"
binary = "dev"
feature = "dev-tools"
flags = [
  { name = "--import", takes_value = true },
  { name = "--via", takes_value = true },
  { name = "--solo" },
  { name = "--stopgap" },
  { name = "--port", takes_value = true },
]
[[command]]
path = "project plan"
binary = "dev"
feature = "dev-tools"
flags = [{ name = "--allow-open" }]
[[command]]
path = "project charter"
binary = "dev"
feature = "dev-tools"
flags = [{ name = "--print" }]
[[command]]
path = "project status"
binary = "dev"
feature = "dev-tools"
[[command]]
path = "project refresh"
