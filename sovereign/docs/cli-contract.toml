the step a test of the lane. What changed 2026-08-14: refresh no longer \
prints an unverified ✓. It polls the daemon to a named verdict (completed / \
failed / crashed / wedged / daemon-gone), prints `✓ SCIP graph at HEAD` or a \
loud ✗ reason, and falls back to a one-writer local export — so the journey's \
`exit = 0` now means "no named failure", which the old `✓ Rebuild nudged` \
silent success line did not."""

