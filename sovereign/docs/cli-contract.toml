[[journey]]
id = "agent-notes"
title = "Leave durable decisions and read them back"
persona = "agent"
experience = "agent-session-protocol"
tier = 4
doc = "docs/GROUND_YOUR_AGENT.md#durable-notes"
[[journey.step]]
run = "notes add --kind decision -m {content}"
mutates = true
note = """`notes` is declared bare; add/promote/gc have no rows. The shape is \
`add --kind <k> -m <body>` per `svrn notes --help`; this row previously read \
`notes add {content} --kind decision`, which exits 2 (`unknown flag`).

`stdout_non_empty` is a REAL assertion here, unusually: the entire stdout of \
`notes add` is the new note's id and nothing else (notes_cmd.rs:446), so empty \
stdout means no row was minted. There is no literal to match — which is why this \
is the one step in the manifest where non_empty is the strongest available \
assertion rather than the weakest."""
[journey.step.expect]
exit = 0
stdout_non_empty = true
[[journey.step]]
run = "notes --query {content}"
note = """the actual read-back — the journey's whole title. This step was RED \
when first run for real (2026-07-28) and the fix was to the PRODUCT, not the \
assertion: `notes add` committed the row but the CLI had no way to see it \
back. Bare `svrn notes` renders only the 30-day reflection SUMMARY, and \
`--query` was not a flag — it printed "Unknown flag: --query" and dumped \
`svrn reflect` help, while the only working search lived on the MCP `notes` \
tool. `svrn notes list` now exposes NoteStore::read_notes (the same query the \
MCP tool uses) and a filter flag routes there. Assert on `{content}`, never \
`stdout_non_empty` — the reflection banner satisfies non-empty on its own, \
which is exactly why the gap went unseen.

Since 2026-08-12 (order commons-fluency fix 5) both `notes list` and \
`notes add` are daemon-first when the daemon is reachable: the CLI calls the \
daemon's `notes`/`note` tools and renders their payload (the daemon store is \
the gossiped one). The repo-local store is the named fallback — daemon \
unreachable prints a warning, daemon-rejected writes exit non-zero without \
falling back, and `--id`/`--include-retired`/`--data-dir`/`--source` have no \
daemon route and answer from the repo-local store with a named line.

The daemon's D4 guard withholds OPERATIONAL-RECORD anchors from ordinary \
reads and reports it (fix 6, same commit stream): the CLI prints the \
withheld count + anchors as a `note:` line on stderr, and an all-withheld \
read says `no non-withheld notes matched` rather than the silent \
`no notes matched`. Naming the anchor in `--query` opts back in."""
[journey.step.expect]
exit = 0
stdout_contains = "{content}"
