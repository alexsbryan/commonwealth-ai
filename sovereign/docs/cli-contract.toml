note = """The five read tools are the promise CODE_INTELLIGENCE.md opens with \
— "exact symbol lookup, compiler-resolved call graphs, and semantic search, \
every answer pointing at a file and a line". Until code-intel-answer was \
written (2026-07-29) not one of them was named by any journey; the only \
