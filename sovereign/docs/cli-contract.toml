tier = 3
doc = "sovereign/docs/CODE_INTELLIGENCE.md#staying-fresh"
[[journey.step]]
run = "status"
note = "the flat alias of `project status`; the `Watched` line is what distinguishes this failure from a healthy index"
[journey.step.expect]
stdout_non_empty = true
[[journey.step]]
run = "doctor"
note = "watcher_freshness = Failed means the registry is empty and nothing is watching anything"
[journey.step.expect]
stdout_non_empty = true
[[journey.step]]
run = "project register --root {project_root} --corpus-id {project}"
mutates = true
note = """one per orphan; doctor prints the exact commands. {project} is NOT \
{corpus}: a knowledge-corpus id and a project id are different namespaces, and \
sharing one token made this step register the DERIVED id while step [3] \
asserted an id nothing had created. `--root` is explicit because the registry \
refuses a second name against an already-registered root \
(ProjectRegistry::nested_conflict), so reusing this repo would make the \
journey depend on whether code-intel-lifecycle ran first. Until 2026-07-29 \
`--corpus-id` was not parsed at all and the catch-all arm swallowed it."""
[journey.step.expect]
exit = 0
[[journey.step]]
run = "project list"
note = "prove the registration LANDED under the id asked for, not a derived one"
[journey.step.expect]
exit = 0
stdout_contains = "{project}"

[[journey]]
id = "daemon-triage"
title = "Diagnose and recover a sick daemon"
persona = "operator"
experience = "daemon-operations"
tier = 1
visibility = "public"
doc = "sovereign/docs/RUNBOOK.md"
[[journey.step]]
run = "path root --explain"
note = """the first triage question, before any daemon reading: WHICH root is \
this install using. A daemon that looks freshly installed — no models, no \
corpora, empty notes — is usually not broken; it is resolving a different root \
than the one holding the data, which happens when something creates \
`~/.svrnmesh` on a machine whose data is still in `~/.sovereign`. \
`--explain` names the arm that fired on stderr; stdout stays a bare path so \
the operator can paste it. Asserting `/` rather than a brand token is \
deliberate and has a named failing input: an unresolvable HOME makes the \
getter return `.`, which is the one answer that is always wrong here. A brand \
token would instead fail on every legitimately-unmigrated machine."""
[journey.step.expect]
exit = 0
stdout_contains = "/"
[[journey.step]]
run = "daemon status"
note = """the BEFORE reading, and it asserts the same fact as [3] on purpose — a \
triage journey that cannot tell "was up, restarted, still up" from "was down the \
whole time" is not triage. Every lane that reaches this journey has already \
probed the daemon (the runner refuses to run otherwise), so the up-text is the \
honest expectation rather than a hopeful one."""
[journey.step.expect]
exit = 0
stdout_contains = "daemon running at"
[[journey.step]]
run = "doctor"
note = "exit code reflects system health, not conformance — assert output only"
[journey.step.expect]
stdout_non_empty = true
[[journey.step]]
run = "daemon restart"
mutates = true
note = "confirmation is stderr (lifecycle.rs:859); the restart is proven by [3]"
[journey.step.expect]
exit = 0
[[journey.step]]
run = "daemon status"
note = """the proof the restart WORKED, which is the whole journey. This \
asserted `exit = 0` alone until 2026-07-29, so the step that carried the \
meaning was the weakest in the sequence — and it is why `daemon restart` could \
not be listed as a capability of this experience: a mutation is proven by a \
LATER step asserting OUTPUT, and there was none. `stdout_non_empty` narrowed to \
the actual up-text 2026-07-30 — not because non_empty was passing wrongly (the \
down-path exits 1, which `exit = 0` already caught) but because it left the exit \
code carrying the meaning again: the down-path paragraph is exactly as non-empty \
as the up-path, so the OUTPUT assertion was decorative. Now it names the fact."""
[journey.step.expect]
exit = 0
stdout_contains = "daemon running at"

