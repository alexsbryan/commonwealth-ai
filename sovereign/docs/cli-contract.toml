# ── Arc B — knowledge ────────────────────────────────────────────────────

[[journey]]
id = "corpus-lifecycle"
title = "Install a knowledge corpus, query it, remove it, prove it is gone"
persona = "end-user"
experience = "knowledge-corpora"
tier = 1
visibility = "public"
doc = "sovereign/docs/KNOWLEDGE_BASES.md"
[[journey.step]]
run = "corpus list"
note = """asserts a catalog ROW, not the `Available built-in corpora:` header — \
the header prints whether or not the catalog behind it has any entries, which is \
the same vacuous shape as asserting non-empty. `sep` is the smallest permanent \
entry (inventory.rs); if the catalog is ever made dynamic this is the step that \
should go red."""
[journey.step.expect]
exit = 0
stdout_contains = "sep"
[[journey.step]]
run = "corpus install {corpus}"
mutates = true
note = """exit code only: the stdout line is `Install requested:` on a fresh \
request and `Already in progress:` when one is in flight (inventory.rs:171/177), \
and both are correct outcomes here. The install is proven by [2]."""
[journey.step.expect]
exit = 0
[[journey.step]]
run = "corpus status"
note = "the assertion the four legacy smoke probes lacked: prove the install LANDED"
# `corpus install` POSTs to the daemon and returns immediately; the ingest runs
# in a spawned task. Asserting instantly here asserted something install never
# promised — the fixture corpus indexes in under a second, but not before the
# next process has started. The assertion is unchanged; it is allowed the
# system's own latency, and the runner prints how long it actually waited.
settle_secs = 120
[journey.step.expect]
exit = 0
stdout_contains = "{corpus}"
[[journey.step]]
run = "chat inspect --corpus {corpus} {question}"
[journey.step.expect]
exit = 0
stdout_non_empty = true
[[journey.step]]
run = "corpus remove {corpus} --yes"
mutates = true
note = """`--yes` is REQUIRED, not tidiness. `corpus remove` prompts, and on EOF \
`read_line` returns Ok(0) rather than an error — so the answer parses as empty, \
the removal ABORTS, and it still exits 0. Without `--yes` this step passed \
while removing nothing, and step [5] then correctly reported the corpus still \
present. Before the runner closed stdin (2026-07-29) the prompt was instead \
being answered by the PLAN ROWS on the loop's stdin, which is what made the \
whole thing invisible."""
[journey.step.expect]
exit = 0
[[journey.step]]
run = "corpus status"
note = """prove the mutation REVERSED — an exit-code-only gate cannot see this. \
Asserted against `corpus status`, NOT `corpus list`: list prints the static \
built-in CATALOG (the six installable ids), so `stdout_absent` against it was \
a false proof — it held whether or not the removal did anything. status is \
the installed-set surface, and is what step 2 uses to prove the install \
landed, so the pair is now symmetric."""
[journey.step.expect]
exit = 0
stdout_absent = "{corpus}"

[[journey]]
id = "folder-to-corpus"
title = "Turn a folder of documents into a queryable corpus with a workflow"
persona = "end-user"
experience = "knowledge-corpora"
tier = 2
visibility = "public"
doc = "docs/WRITE_A_WORKFLOW.md"
[[journey.step]]
run = "workflow list"
note = "`workflow` is declared bare; its list/run/copy/new subcommands have no rows yet"
[journey.step.expect]
exit = 0
stdout_non_empty = true
[[journey.step]]
run = "workflow copy notebook {workflow}"
mutates = true
note = """same: `workflow copy` has no row of its own. `Created {path}` is \
unconditional on the success path (workflow_cmd.rs:540), so this one CAN assert \
its own effect and does."""
[journey.step.expect]
exit = 0
stdout_contains = "Created"
[[journey.step]]
run = "workflow run {workflow} --folder {folder} --corpus {corpus}"
mutates = true
note = """same: `workflow run` has no row of its own. Exit code only: stdout \
carries the per-item output blocks and the `— {workflow} — N ok, M failed` \
summary is STDERR (workflow_cmd.rs:579), so there is no stable stdout string for \
a folder whose contents the fixture chooses. The payoff is asserted at [3] — if \
the ingest did nothing, `chat inspect` has nothing to answer from."""
[journey.step.expect]
exit = 0
[[journey.step]]
run = "chat inspect --corpus {corpus} {question}"
[journey.step.expect]
exit = 0
stdout_non_empty = true

[[journey]]
id = "enrich-atlas"
title = "Enrich an installed corpus into an atlas and query it"
persona = "author"
experience = "knowledge-corpora"
tier = 3
doc = "sovereign/docs/ENRICH_A_CORPUS.md"
# SELF-CONTAINED ON PURPOSE. This journey enriches an INSTALLED corpus, and it
# used to assume one was already there — which held only because some earlier
# journey had installed it. `corpus-lifecycle` (tier 1, so it runs first) ends by
# REMOVING the fixture corpus and proving it is gone, that being its whole point,
# so by the time this journey ran the index was deliberately absent and
# `enrich init` exited 1 saying exactly that. A journey is an INDEPENDENT claim
# about a use case; depending on the order of the manifest is the same defect
# `watcher-repair` was fixed for when it needed its own repo root.
[[journey.step]]
run = "corpus install {corpus} --wait"
mutates = true
note = """`--wait` IS THE BARRIER, and a bare `corpus install` cannot be one. \
Install POSTs to the daemon and returns the moment the request is ACCEPTED; \
the ingest writes `{corpus}-partition-<node>/` and the canonical \
`indexes/{corpus}/` that `enrich init` opens is materialised only by the \
finalise step ~20s later (`CorpusEngine::partition_path`, engine/mod.rs:564). \
So exit 0 from a bare install means "requested", never "installed" — which is \
how this journey reported two green ticks and then died on step [2] with \
`Index not found` (nightly 2026-08-12T081749, order corpus-install-green-lie). \
`--wait` polls the one readiness decider and exits non-zero if the index never \
becomes usable, so exit 0 here means the index EXISTS."""
[journey.step.expect]
exit = 0
stdout_contains = "installed"
[[journey.step]]
run = "corpus status {corpus}"
note = """The second, independent check that the install landed — and it is \
now falsifiable. It used to be `corpus status` unfiltered asserting only \
`stdout_contains = "{corpus}"`, which was VACUOUS: status listed one row per \
DIRECTORY under indexes/, so the in-flight partition directory \
`{corpus}-partition-node-<id>` carries the corpus id as a prefix and satisfied \
the substring at t+0 with zero chunks committed. Two things changed so this \
step can fail: rows are keyed by the `corpus_id` in the meta (there is no \
corpus named `…-partition-node-…`), and each row carries an explicit \
`ready`/`building`/`absent` state from `corpus_readiness`. The `{corpus}` \
FILTER is load-bearing too — unfiltered, some OTHER corpus being `ready` would \
satisfy the assertion. Retires backlog item 7a67a495 ("strengthen the \
enrich-atlas barrier: step[1]'s `corpus status` + stdout"), open since \
2026-08-03. `settle_secs` is kept as a belt-and-braces margin; step [0] should \
already have waited."""
settle_secs = 120
[journey.step.expect]
exit = 0
stdout_contains = "ready"
[[journey.step]]
run = "enrich init {corpus} --from-corpus {corpus} --pipeline {pipeline}"
mutates = true
note = """`--pipeline` is REQUIRED here, not decoration: init's default is the \
legacy `literary` pipeline, and `enrich build` refuses a non-atlas pipeline \
outright ("`build` only supports atlas pipelines"). This journey's title is \
"enrich into an ATLAS", so a legacy pipeline was the journey contradicting \
itself — found once step [0] was made falsifiable and the failure stopped \
landing on `enrich status`. `exit = 0` added 2026-07-29 because this step \
DECLARED NOTHING and so \
could not fail. On the sandbox lane it reported ✓ while writing no enrichment \
directory at all, `enrich build` reported ✓ after it, and the journey then died \
on step [2] (`enrich status`, the first step that asserts anything) — two steps \
past the real breakage, reading as "status is broken" when init had never run. \
An unfalsifiable step does not just fail to prove its own command; it \
misattributes the failure of the whole sequence."""
[journey.step.expect]
exit = 0
[[journey.step]]
run = "enrich build {corpus} --full"
mutates = true
[journey.step.expect]
exit = 0
[[journey.step]]
run = "enrich status {corpus}"
[journey.step.expect]
exit = 0
stdout_non_empty = true
[[journey.step]]
run = "enrich query {corpus} {question}"
[journey.step.expect]
exit = 0
stdout_non_empty = true
[[journey.step]]
run = "atlas status {corpus}"
note = "the structural view of what enrich built — atlas and enrich write the same corpus"
[journey.step.expect]
exit = 0
stdout_non_empty = true

