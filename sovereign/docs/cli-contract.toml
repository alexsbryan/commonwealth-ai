visibility = "public"
classification = "daemon"
# Partial by design (`flags` is lenient): only the flag the contract itself
# leans on is declared. `--wait` is what turns this command's exit 0 from
# "the daemon accepted the request" into "the index exists", and the
# `enrich-atlas` journey's first step depends on that distinction.
flags = [
  { name = "--wait", takes_value = false },
]
