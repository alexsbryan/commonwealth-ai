# journal — the read + consent surface over the LOCAL JOURNALS the daemon
# writes (docs/NEXT_EDIT.md §9d for the first stream, next-edit). One row
# for the verb, not one per stream: the command dispatches over a stream
# registry (`journal_cmd::VIEWS`), so `journal <stream> <sub>` is one
# grammar and adding a feature's journal adds no CLI surface to track
# here. NOT dev-gated: it ships in the DEFAULT build on purpose, because
# an end-user binary that records how a feature behaved with no way to
# read, bundle, or switch it off would be indefensible. Filed internal
# rather than public only because the public bar is the
# inference/mesh/knowledge surface the top-level READMEs promise; it is
# documented in CLI_REFERENCE.md and advertised in `svrn --help`.
# Offline — reads and writes files under the journal dir, never the daemon.
[[command]]
path = "journal"
binary = "dispatcher"
visibility = "internal"
classification = "offline"
flags = [
  { name = "--last", takes_value = true },
  { name = "--out", takes_value = true },
  { name = "--yes" },
]

# contract — this manifest, rendered. Dev-gated because it reads
# docs/cli-contract.toml, which only a source checkout has; the views are
# positional rather than flags because each is a different report, not a
# different formatting of one.
[[command]]
path = "contract"
binary = "dispatcher"
feature = "dev-tools"
[[command]]
