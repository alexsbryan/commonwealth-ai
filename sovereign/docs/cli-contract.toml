# CLI contract — the single source of truth for the commands `sovereign`
# promises. The QA harness reconciles this three ways:
#   - cli_contract_code test : manifest <-> the real binaries
#   - cli_contract_docs test : manifest <-> CLI_REFERENCE.md / README.md
#   - cli-contract-live-verify.sh : read-only smoke against a live daemon
# Adding a command = add a [[command]] row here first.
#
# Fields (defaults in parens, omit a field to take its default):
#   path           REQUIRED. argv path minus `sovereign`, space-joined.
#   binary         REQUIRED. dispatcher | dev | llm | daemon (routing + sibling-gating).
#   classification (offline) offline = --help/parse testable | daemon = needs :9741 + models.
#   feature        (default) default | dev-tools | awareness  (cargo build gate).
#   visibility     (internal) public | internal. public = inference + mesh + knowledge
#                  bases, the surface the top-level READMEs promise; held to the strictest
#                  bar. internal = dev/advanced tooling (documented in CLI_REFERENCE, the
#                  full reference, but not required in the READMEs).
#   probe          (help) help | no-args | skip  (how the offline code-probe verifies it).
#   flags          [] flags the command promises (checked leniently against the docs).
#   hidden         (false) intentionally undocumented surface (still tracked; exempt from docs).
#   alias_of       synonym spelling of the named canonical path.
#   [command.smoke] read-only live probe (Phase 3; only for classification="daemon").
#
# INVARIANT (enforced by cli_contract_code): a `visibility = "public"` command must
# NOT be `feature = "dev-tools"` — it would exit 2 in the shipped binary, breaking a
# public promise. This is why code intelligence (project/code/tools) is internal.
#
# SCOPE (v1): this manifest covers the *documented* surface (everything in
# CLI_REFERENCE.md) plus the public surface. The large internal-only surface that
# dispatches but is undocumented (corpus watch-*, enrich phases/legacy, atlas
# internals, the atos delegator arms, voice/meta-atlas/router-cache/etc., and the
# unrouted proxy/portfolio) is enumerated in docs/cli-audit-findings.md and is added
# here in Phase 2, driven by the `__dump-commands` reverse check (which runs with a
# compile loop). Until then the reverse code-check is report-only for untracked paths.

schema_version = 1

# ─────────────────────────────────────────────────────────────────────
# PUBLIC SURFACE — local inference + mesh + knowledge bases.
# What the top-level READMEs promise. Strictest conformance bar.
# ─────────────────────────────────────────────────────────────────────

[[command]]
path = "setup"
binary = "daemon"
visibility = "public"
flags = [
  { name = "--yes" },
  { name = "--reset" },
  { name = "--data-dir", takes_value = true },
]

# `svrn model` — see/change the [models] config and hot-apply via the daemon's
# admin reload (no manual config edit, no restart). Subcommand-shaped (list /
# set / unset / set-extra / rm-extra / context), so no top-level flags.
[[command]]
path = "model"
binary = "daemon"
visibility = "public"

[[command]]
path = "doctor"
binary = "daemon"
visibility = "public"
flags = [
  { name = "--fix" },
  { name = "--watch" },
  { name = "--json" },
]
# No smoke block: `doctor`'s exit code reflects system health (non-zero when
# checks fail), not command conformance — a poor behavioral probe. doctor is
# fully covered offline by the docs + code conformance tests.

[[command]]
path = "install-service"
binary = "daemon"
visibility = "public"

# `sovereign daemon` — bare invocation runs the daemon in the foreground.
[[command]]
