run = "eval run --bank {bank} --synth"
[[journey.step]]
run = "voice --all"
note = "`voice` is declared bare; its only action is `eval`"

[[journey]]
id = "gym-fixture-loop"
title = "Add a failing gym fixture, fix it, prove no regressions"
persona = "developer"
tier = 5
doc = "sovereign/docs/CORRECTNESS_TOOLING.md"
skip_live = "mock-replay gyms need their fixture banks and a judge model"
[[journey.step]]
run = "knowledge-gym run --fixture {fixture}"
note = "step 1 must FAIL before the fix — polarity is the point of the loop"
[[journey.step]]
run = "knowledge-gym run --replays 3"
[[journey.step]]
run = "search-gym calibrate-judge"
note = "CLI_REFERENCE is explicit that calibration precedes the run"
[[journey.step]]
run = "search-gym run --replays 5"

[[journey]]
id = "alignment-migrate"
title = "Migrate the alignment workspace onto the mesh"
persona = "operator"
tier = 5
doc = "sovereign/docs/PLAN_ALIGNMENT.md"
skip_live = "ingests the operator's real ~/.claude and notes.db"
[[journey.step]]
run = "alignment migrate --dry-run"
note = "preview before the mutating form — the doc leads with it"
[journey.step.expect]
exit = 0
[[journey.step]]
run = "alignment migrate"
mutates = true
[[journey.step]]
run = "alignment status"
[journey.step.expect]
exit = 0
stdout_non_empty = true

[[journey]]
id = "git-archaeology"
title = "Mine commit history for atom provenance and evaluate it"
persona = "developer"
tier = 5
doc = "sovereign/docs/GIT_ARCHAEOLOGY.md"
skip_live = "walks the full git history of a real code corpus"
[[journey.step]]
run = "enrich ingest {atlas} --source-corpus {corpus}"
mutates = true
note = "REAL but UNDECLARED: `enrich ingest` has no [[command]] row"
[[journey.step]]
run = "git-archaeology {atlas}"
mutates = true
[[journey.step]]
run = "archaeology-eval {atlas} --inquiry {inquiry}"
[journey.step.expect]
stdout_non_empty = true

[[journey]]
id = "governance"
title = "Surface tensions in a corpus and resolve them into common law"
persona = "developer"
tier = 5
doc = "sovereign/docs/CLI_REFERENCE.md"
skip_live = "event-sourced resolution drives long inference over a corpus"
[[journey.step]]
run = "govern seed {corpus}"
mutates = true
[[journey.step]]
run = "govern tensions {corpus}"
[journey.step.expect]
stdout_non_empty = true
[[journey.step]]
run = "govern resolve {corpus}"
mutates = true
[[journey.step]]
run = "govern accept {corpus}"
mutates = true
[[journey.step]]
run = "govern ask {question}"
[journey.step.expect]
stdout_non_empty = true

[[journey]]
id = "pipeline-pods"
title = "Drive a durable ingestion pipeline across ephemeral pods"
persona = "operator"
tier = 5
doc = "sovereign/docs/PINNED_WORKER_AS_INFERENCE_PEER.md"
skip_live = "provisions paid cloud GPU pods"
[[journey.step]]
run = "pipeline pod up"
mutates = true
[[journey.step]]
run = "pipeline pod list"
[journey.step.expect]
stdout_non_empty = true
[[journey.step]]
run = "pipeline run {recipe}"
mutates = true
[[journey.step]]
run = "pipeline status {recipe}"
[journey.step.expect]
stdout_non_empty = true
[[journey.step]]
run = "pipeline pod down {pod_id}"
mutates = true
note = "prove the mutation reverses — an orphaned pod bills until it is torn down"

# ═════════════════════════════════════════════════════════════════════════
# STRANDED — verbs that belong to no journey.
#
# This ledger exists so "stranded" is a TRACKED, SHRINKING quantity. The
# ratchet in cli_contract_journeys forbids it growing: a new verb must
# either join a journey or be added here on purpose, with a reason.
#
# disposition: promote (a real journey nobody wrote down)
#              fold    (belongs under an existing verb — see fold_into)
#              demote  (internal tooling; should be hidden + out of --help)
#              park    (an experiment behind a build gate)
# ═════════════════════════════════════════════════════════════════════════

[[stranded]]
verb = "mobile"
reason = "serve/status/pair is a real product surface (the phone-facing API) with no documented sequence anywhere — CLI_REFERENCE has only a subcommand table"
disposition = "promote"

[[stranded]]
verb = "portfolio"
reason = "FR-11 gossip-excluded local corpus sets — a real privacy feature whose only mention in the repo is a stale audit finding calling it unreachable (it is reachable; main.rs:934-936)"
disposition = "promote"

[[stranded]]
verb = "proxy"
reason = "cite-or-abstain QA over a filing; reachable, but `proxy --help` exits 2 because proxy_cmd/mod.rs:29 matches --help as a subcommand name"
disposition = "promote"

[[stranded]]
verb = "reading-diag"
reason = "validates the desktop reading chain without the UI — a correctness gate, not a standalone verb"
disposition = "fold"
fold_into = "correctness-gates"

[[stranded]]
verb = "rough-edges"
reason = "FIXME/TODO/HACK scanner over a code corpus; belongs with the other code-intelligence surfaces"
disposition = "fold"
fold_into = "code"

[[stranded]]
verb = "nudge"
reason = "one subcommand (`dismiss`) whose only purpose is suppressing ATOS audit nudges"
disposition = "fold"
fold_into = "atos"

[[stranded]]
verb = "recipe-agent"
reason = "agent-driven recipe authoring; overlaps the recipe-author journey end to end"
disposition = "fold"
fold_into = "recipe"

[[stranded]]
verb = "maintainer"
reason = "single `inbox` subcommand for recipe maintainers; no doc, not in --help"
disposition = "demote"

[[stranded]]
verb = "newsworthy"
reason = "tracked-set lifecycle summary over MeshStore; one passing mention, no documented sequence"
disposition = "demote"

[[stranded]]
verb = "router-cache"
reason = "check/rebuild of the router exemplar embedding cache — maintenance, arguably belongs behind `doctor --fix`"
disposition = "demote"

[[stranded]]
verb = "meta-atlas"
reason = "cross-corpus canonical atoms; documented only in a bench README, no user-facing sequence"
disposition = "demote"

[[stranded]]
verb = "awareness"
reason = "12 subcommands behind a cargo feature that is not built by default; an experiment, not a promise"
disposition = "park"
