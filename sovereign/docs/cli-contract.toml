# ── Arc H — the contract itself ───────────────────────────────────────────

[[journey]]
id = "contract-audit"
title = "Ask what the CLI promises and how much of it is actually proven"
persona = "developer"
experience = "cli-quality"
tier = 3
doc = "sovereign/docs/TESTING_SURFACE.md"
# THE CHEAPEST JOURNEY IN THE MANIFEST, alongside code-intel-answer: pure file
# I/O over this very file, no daemon, no models, no network, no mutation. It runs
# in every lane and costs milliseconds.
#
# It asserts FACTS about its own output rather than `stdout_non_empty`, for the
# reason this whole axis exists — a report that failed to load the manifest would
# still print its section headers, and non_empty is exactly what a broken render
# looks like. The strings chosen are the ones that carry meaning: a census ROW
# (not the banner above it), and the words a promise is counted in.
[[journey.step]]
run = "contract census"
note = """the census row, not the `── what can actually fail ──` banner. A row \
means the walk over the journeys produced numbers; the banner prints regardless."""
[journey.step.expect]
exit = 0
stdout_contains = "a lane RUNS"
[[journey.step]]
run = "contract map"
note = "the promise-level rollup line, which only prints after every experience is walked"
[journey.step.expect]
exit = 0
stdout_contains = "steps assert output"
[[journey.step]]
run = "contract nightly"
note = """asserts the section, because the CONTENT is legitimately either a \
verdict or "no report on this host" — and both are correct answers that a \
developer needs to see. What must never happen is this view printing nothing at \
all, which is what a missing/renamed report directory used to look like."""
[journey.step.expect]
exit = 0
stdout_contains = "last contact with reality"
[[journey.step]]
run = "contract"
note = """the bare form is the front door, and it must end with the commands that \
re-derive it — a report that tells you the coverage is 41% and not how to change \
that is where a quality tool starts dying."""
[journey.step.expect]
exit = 0
stdout_contains = "run it yourself"
[[journey.step]]
run = "posture"
note = """the cross-subsystem sibling of `contract nightly`: one table of artifact \
age per quality subsystem, added 2026-07-30 because drift AND arch had been weeks \
stale with nothing anywhere aggregating that fact. Asserts the drift ROW (a \
subsystem the registry walked), not the header — the header prints before any \
source is read, so it is exactly what a broken walk still looks like. On a host \
that has never run drift the row still renders (`never_run`), so this assertion \
is lane-independent."""
[journey.step.expect]
exit = 0
stdout_contains = "drift"


# ═════════════════════════════════════════════════════════════════════════
# STRANDED — verbs that belong to no journey.
#
# This ledger exists so "stranded" is a TRACKED, SHRINKING quantity. The
# ratchet in cli_contract_journeys forbids it growing: a new verb must
# either join a journey or be added here on purpose, with a reason.
#
# disposition: promote (a real journey nobody wrote down)
#              fold    (belongs under an existing verb — see fold_into)
#              demote  (internal tooling; should be hidden + out of --help)
#              park    (an experiment behind a build gate)
# ═════════════════════════════════════════════════════════════════════════

[[stranded]]
verb = "mobile"
reason = "serve/status/pair is a real product surface (the phone-facing API) with no documented sequence anywhere — CLI_REFERENCE has only a subcommand table"
disposition = "promote"

[[stranded]]
verb = "portfolio"
reason = "FR-11 gossip-excluded local corpus sets — a real privacy feature whose only mention in the repo is a stale audit finding calling it unreachable (it is reachable; main.rs:934-936)"
disposition = "promote"

[[stranded]]
verb = "proxy"
reason = "cite-or-abstain QA over a filing; reachable, but `proxy --help` exits 2 because proxy_cmd/mod.rs:29 matches --help as a subcommand name"
disposition = "promote"

[[stranded]]
verb = "reading-diag"
reason = "validates the desktop reading chain without the UI — a correctness gate, not a standalone verb"
