run = "reflect"
note = """asserts the report's own banner: `reflect` renders a fixed-shape summary \
(counts, improvement signals, open todos) even with zero sessions analysed, so the \
banner proves it RENDERED — and a read whose only gate is `exit = 0` proves \
nothing at all here."""
[journey.step.expect]
exit = 0
stdout_contains = "Session Reflection Summary"

