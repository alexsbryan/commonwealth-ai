[[command]]
path = "daemon run"
binary = "daemon"
visibility = "public"
[[command]]
path = "daemon start"
binary = "daemon"
visibility = "public"
[[command]]
path = "daemon stop"
binary = "daemon"
visibility = "public"
[[command]]
