binary = "dispatcher"
feature = "dev-tools"
# deep-research — the thin local-only research loop (T1): gated corpus +
# web search, custody-stamped fetch, gap-audited rounds. In-process in the
# dispatcher under dev-tools; needs the local daemon's embed + draft
# surface (classification "daemon"), but talks to it over loopback HTTP
# only — no egress beyond the budgeted DDG search + page fetches.
[[command]]
path = "deep-research"
binary = "dispatcher"
feature = "dev-tools"
classification = "daemon"
flags = [
  { name = "--run-dir", takes_value = true },
  { name = "--max-rounds", takes_value = true },
  { name = "--corpora", takes_value = true },
  { name = "--code-set-k", takes_value = true },
  { name = "--eps-quota", takes_value = true },
  { name = "--search", takes_value = true },
  { name = "--fetch", takes_value = true },
]

