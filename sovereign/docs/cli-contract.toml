note = """THE SURFACE THIS FILE IS, made reachable. Every layer of it existed \
before 2026-07-30 and none of it was findable: the experience map lived inside a \
cargo test invocation nobody would guess, the lanes are two scripts under \
scripts/, and the nightly's verdict is a latest.json under ~/.svrnmesh. This \
repo's own history says what happens next — the harness this one replaced was \
written, documented as safe to call in CI, and then called by nothing, its \
env-var switch appearing nowhere but inside the script that read it.

So `svrn contract` is a promise like any other, and it is journeyed like any \
other. The self-reference is the point: a quality surface that is not itself \
covered is asking for an exemption it has not earned."""


# ═════════════════════════════════════════════════════════════════════════
# JOURNEYS — the sequenced use cases the CLI promises.
#
# The [[command]] rows above prove each verb EXISTS. They cannot prove that
# any ordered sequence of them WORKS: before this section, install→query→
# remove was unverified anywhere in the repo, and the only behavioural probes
# were four read-only commands asserting `exit == 0` (and never executed,
# because nothing set SOVEREIGN_LIVE_CONTRACT).
#
# Every journey below is DERIVED from a sequence the docs already teach —
# `doc` cites where, and cli_contract_journeys checks the citation resolves.
# Journeys were not invented for the harness.
#
# Fields:
#   id          REQUIRED. stable kebab-case key.
#   title       REQUIRED. what the person is trying to accomplish.
#   persona     REQUIRED. end-user | operator | developer | author | agent.
#   experience  REQUIRED. the [[experience]] id this journey serves. A journey
#               that serves no named promise is a command enumeration, which
#               is the drift the experience axis exists to stop.
#   needs       ([]) what this journey needs from the LANE that runs it:
#               operator-home | indexed-repo. Distinct from skip_live (a
#               property of the journey) and --exclude (a property of one
#               run). The sandbox lane passes `--lacks` for what a throwaway
#               HOME cannot have and the read-only operator lane runs exactly
#               what the sandbox skipped, so the two lanes partition this
#               manifest from one source instead of a hardcoded array.
#   tier        REQUIRED. 1 (product is broken without it) .. 5 (specialist).
#               Drives live-run ordering and triage severity.
#   visibility  (internal) public journeys may not contain dev-tools steps.
#   doc         repo-relative path (optionally #anchor) that teaches it.
#   skip_live   set = statically checked + dispatch-replayed, but not run
#               live (needs a second machine, paid infra, or is destructive).
#   [[journey.step]] run / command / mutates / expect / skip_live / note
#
# A step's `run` binds to a [[command]] by longest prefix, stopping at the
# first `-flag` or `{placeholder}`. Three outcomes (StepBinding):
#   Exact      — a declared path matched.
#   VerbOnly   — the verb is tracked but this subcommand has no row yet.
#                ALLOWED, but the step must carry a `note` saying so. Grep
#                `note =` here for the list of subcommands still to declare.
#   Unresolved — neither path nor verb exists. Always a hard failure. This
#                is the check that catches a doc teaching a dead command.
