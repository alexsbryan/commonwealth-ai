# ── Arc F — bank it, rank it ─────────────────────────────────────────────

[[journey]]
id = "backlog-intake"
title = "Bank a discovery, and have the same producer's next filing update it instead of duplicating"
persona = "operator"
experience = "ranked-backlog"
tier = 3
visibility = "internal"
doc = "scripts/BACKLOG.md"
[[journey.step]]
run = "backlog add {backlog_text} --no-score --create --db {backlog_db} --key journey-probe"
mutates = true
note = """Runs OFFLINE: --no-score is the documented no-daemon half, so this \
journey proves the write path and the identity rule on any lane with no model \
resident. The SCORED path is deliberately not journeyed — it needs a chat \
model, and it would make a deterministic lane depend on what a model said.
--create is required and deliberate: the verb refuses to create a store, so \
the first step of a lane on a throwaway HOME has to say it means it. The db is \
a journey-only file, never the operator's notes.db."""
[journey.step.expect]
exit = 0
stdout_contains = "filed"
[[journey.step]]
run = "backlog add {backlog_text} --no-score --db {backlog_db} --key journey-probe"
mutates = true
note = """The proof of step [1], and of the identity rule in one assertion: \
`updated` is printed ONLY when a live item already carried this key, so a \
write that never landed prints `filed` here and reddens the step. Identity is \
the producer key and nothing else (ARCH §7.5) — this is what stops a nightly \
gate from filing the same finding thirty times."""
[journey.step.expect]
exit = 0
stdout_contains = "updated"

# ── Arc A — get it running ───────────────────────────────────────────────

[[journey]]
id = "first-run"
title = "Install, set up, and get a grounded answer"
persona = "end-user"
experience = "install-and-run"
tier = 1
visibility = "public"
doc = "README.md"
[[journey.step]]
run = "setup --yes"
mutates = true
note = """writes config + downloads models into the hermetic HOME. Exit code \
only, and deliberately: the final line is `Wizard complete.` on a fresh HOME but \
`Already set up. Config at …` when a config exists (setup_cmd/mod.rs:152), and \
the sandbox lane seeds one — so asserting either string would make this step a \
test of which lane ran it. The mutation is proven downstream by [2]."""
[journey.step.expect]
exit = 0
[[journey.step]]
run = "daemon start"
mutates = true
note = """exit code only: every confirmation `daemon start` prints goes to STDERR \
(`✓ daemon ready at …`, lifecycle.rs:581) and stdout assertions read stdout \
ALONE, on purpose — see the stream note on the runner. That is the right stream \
for it (narration, not payload), so the proof is [2]."""
[journey.step.expect]
exit = 0
[[journey.step]]
run = "daemon status"
note = "the proof of [0] and [1] both: the daemon the setup wrote is answering"
[journey.step.expect]
exit = 0
stdout_contains = "daemon running at"
[[journey.step]]
run = "model list"
note = "`model` is declared subcommand-shaped; `model list` has no row of its own"
[journey.step.expect]
exit = 0
stdout_non_empty = true
[[journey.step]]
run = "chat ask {question}"
[journey.step.expect]
exit = 0
stdout_non_empty = true
[[journey.step]]
run = "install-service"
mutates = true
skip_live = "registers a real launchd/systemd unit on the host"
note = "README.md:14-24 teaches setup → install-service; this is the only PUBLIC verb that appears in no `--help` text"
[[journey.step]]
run = "daemon stop"
mutates = true
note = "stderr-only confirmation again (lifecycle.rs:53); the reversal is proven by [7]"
[journey.step.expect]
exit = 0
[[journey.step]]
run = "daemon status"
note = """PROVE THE STOP ACTUALLY STOPPED IT — the same shape as \
corpus-lifecycle's `stdout_absent` closing step, and the reason this journey has \
seven steps instead of six. `daemon status` exits 1 and prints `✗ daemon not \
reachable on …` when nothing answers (lifecycle.rs:930), so both halves of the \
assertion are load-bearing: exit 0 here would mean the daemon is still up. In \
read-only mode [6] is skipped, which marks the journey degraded and reports this \
step as unverifiable rather than failing it.

IT EARNED ITS KEEP ON THE FIRST RUN. `exit 0, want 1` — output \
`✓ daemon running at http://127.0.0.1:19741`. `daemon stop` had delegated to the \
HOST's systemd and stopped the operator's `sovereign.service`, leaving the \
sandbox's own daemon serving; the step before it reported ✓ because systemctl \
exited 0. Three "the daemon keeps dying under heavy lanes" incidents in the \
previous session were the same thing, read as flakiness. Fixed in \
service_install.rs `service_manager_is_addressed` (note ad55c138). A stop that \
stops the wrong daemon is invisible to any gate that does not ask what happened \
afterwards — which is the entire argument for this step existing."""
[journey.step.expect]
exit = 1
stdout_contains = "not reachable"

[[journey]]
