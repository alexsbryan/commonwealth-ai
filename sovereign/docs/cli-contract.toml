# ═════════════════════════════════════════════════════════════════════════
# EXPERIENCES — the promises the product makes, and what each is made of.
#
# WHY THIS EXISTS. Every ratchet below the journey layer is verb-driven:
# "every public verb belongs to a journey." That is a completeness check, and
# it worked — but it made COMMANDS the unit, so journeys grew into vehicles
# for verb coverage. `code-intel-lifecycle` is the tell: six steps
# (project init | list | status | refresh | serve | stop) that prove the index
# BUILDS and never once ask it a question. It is named for a capability and
# tests only plumbing.
#
# Measured 2026-07-29, against the 23 tools .claude/CLAUDE.md mandates for
# every agent session: 18 were named by NO journey step — including `symbols`,
# `callers`, `callees`, `blast` and `code_search`, the five the instructions
# say to use INSTEAD of reading files, on every node, every session. Nothing
# was failing. Nothing was watching, either. Finding that took a hand
# cross-reference of the instructions against this file, which is exactly the
# kind of audit a manifest is supposed to make unnecessary.
#
# So the unit of coverage is the EXPERIENCE: a promise a user would name,
# citing where it is promised, listing the capabilities it is made of. The
# ratchet then asks the question the verb ratchet cannot — "is each part of
# this promise actually exercised by something?" — and a promise with no
# journey at all becomes a DECLARED gap rather than a discovery.
#
# Fields:
#   id            REQUIRED. stable kebab-case key; journeys point at it.
#   title         REQUIRED. the promise in the user's words.
#   doc           REQUIRED. where the promise is made (checked to exist).
#                 Required here, unlike on a journey: an undocumented
#                 experience is not a promise, it is an intention.
#   capabilities  ([]) the named parts of the promise. Each must be exercised
#                 by a step of some journey serving this experience, in a step
#                 that asserts OUTPUT — see the rule below.
#   gap           set when NO journey serves this yet, saying why. Capped and
#                 shrink-only, like the [[stranded]] ledger.
#   note          free text, rendered in the experience map.
#
# THE CAPABILITY RULE (cli_contract_journeys::every_capability_is_exercised).
# A read proves itself INLINE; a mutation is proven DOWNSTREAM.
#   - a non-mutating step counts only if that step asserts output. Nothing
#     later can prove that `symbols` answered.
#   - a mutating step counts if any LATER step in the same journey asserts
#     output. `corpus install` returns before its ingest lands; the proof is
#     the `corpus status` that finds the corpus afterwards.
# Exit codes are never enough, and this is not pedantry: EVERY code-
# intelligence tool in this repo exits 0 when it finds nothing. `symbols` on
# an unknown name prints "No symbol named X found in any installed code
# corpus" and exits 0; so do `callers`, `callees` and `capability_map`
# (measured 2026-07-29). An exit-code-only step is satisfied by a tool that
# answered nothing at all.
#
# THE PATTERN THIS SURFACED, worth naming because it generalises: for most
# experiences there are two journeys, and only one of them is the experience.
# The PRODUCE half (project init, drift detect, enrich build) is expensive,
# mutating, often skip_live — and it is plumbing. The CONSULT half (symbols,
# drift_posture, enrich query) is cheap, read-only, deterministic — and it is
# what the user actually came for. Every experience that had only a produce
# journey was testing that the machine starts, not that it works.
# ═════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════
# DEPENDENCIES — the shared prerequisites journeys stand on.
#
# A dependency is a STATE of the machine a journey assumes rather than
# builds: a running daemon, a joined mesh, an installed corpus. Each row
# names the ONE canonical doc that gets a user there — the module a journey
# doc links instead of re-explaining its prerequisites inline. Measured
# 2026-07-31, before this axis existed: mesh create/join was re-explained in
# 15 docs, daemon setup in 10, corpus install in 13, repo indexing in 8.
#
# `verify` is the read-only command that proves the state exists, per the
# capability rule above: a read proves itself inline, so "do I have this?"
# is always one command away. Rendered by `svrn contract map`.
#
# `operator-home` and `indexed-repo` double as the lane-partition vocabulary
# (`needs` on a journey, `--lacks` on the runners); every Need variant must
# have a row here so a lane exclusion always carries a doc explaining the
# state the excluded journeys assumed
# (cli_contract_journeys::every_lane_need_has_a_dependency_module).
#
# Fields: id, title, doc (checked to exist), verify (non-empty), note.
# ═════════════════════════════════════════════════════════════════════════

