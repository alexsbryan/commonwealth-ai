name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 0.1.0). Must match crates/sovereign-desktop/src-tauri/tauri.conf.json"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create as draft (recommended — review before publishing)"
        required: false
        type: boolean
        default: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ inputs.version }}`,
              name: `Sovereign v${{ inputs.version }}`,
              body: `## Sovereign v${{ inputs.version }}\n\nDesktop app build.\n\n### Downloads\n\n- **macOS**: \`.dmg\` installer (Apple Silicon and Intel)\n- **Linux**: \`.AppImage\` and \`.deb\`\n- **Windows**: \`.msi\` installer\n\nSee the README for installation instructions.`,
              draft: ${{ inputs.draft }},
              prerelease: ${{ inputs.prerelease }},
            });
            return data.id;

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            label: Linux
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            label: Windows
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./crates/sovereign-desktop/src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            cmake \
            build-essential

      - name: Install CMake (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install cmake

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: crates/sovereign-desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: crates/sovereign-desktop
          tagName: v${{ inputs.version }}
          args: ${{ matrix.args }}
