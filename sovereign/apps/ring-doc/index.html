<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ring Doc</title>
    <style>
      :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 15%, transparent); }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
      main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
      .sub { opacity: .65; margin: 0 0 2rem; }
      #editor { margin: 2rem 0; }
      #editor .tiptap { outline: none; min-height: 18rem; border: 1px solid var(--line); border-radius: .4rem; padding: 1rem 1.1rem; }
      /* The caret extension sets only the COLOUR inline (see its `render`);
         position and label are the page's, and without them a cursor renders
         as a block that shoves the text it is pointing at out of the way. */
      .collaboration-carets__caret { position: relative; border-left: 1px solid; border-right: 1px solid; margin: 0 -1px; word-break: normal; pointer-events: none; }
      .collaboration-carets__label { position: absolute; top: -1.4em; left: -1px; font-size: .7rem; font-weight: 600; line-height: 1.3; color: #fff; padding: 0 .3em; border-radius: .2rem .2rem .2rem 0; white-space: nowrap; user-select: none; }
      #gaps { margin-top: 2rem; padding: .75rem 1rem; border: 1px solid var(--line); border-radius: .4rem; }
      #gaps[hidden] { display: none; }
      #gaps h2 { font-size: .9rem; margin: 0 0 .5rem; text-transform: uppercase; letter-spacing: .04em; }
      #gaps li { opacity: .8; }
      #err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ring Doc</h1>
      <p class="sub" id="scope"></p>
      <div id="editor"></div>
      <p id="err"></p>
      <section id="gaps" hidden>
        <h2>This total covers a subset</h2>
        <ul id="gaplist"></ul>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
