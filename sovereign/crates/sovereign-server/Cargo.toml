[package]
name = "sovereign-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dev-routes", "net-tools"]
# Developer/authoring surfaces. ON by default, so every existing build —
# desktop, mobile host, dev workstation — behaves exactly as before.
#
# Build with `--no-default-features` for a shared deployment where the
# operator is NOT the developer. That drops five things whose safety rests
# on the assumption "one person owns this box":
#
#   POST /v1/solve, /v1/cycle/bdd   client-supplied `test_command` reaching
#                                   `sh -c` (commonwealth-tdd), inside the
#                                   authed router — any tenant key is a shell
#   POST /v1/documents/upload       ingests an ABSOLUTE server-side path, so
#   POST /v1/corpora/upload         any tenant can read any file the process
#                                   can, including this config and its keys
#   /mcp, /mcp/message, /mcp/stats  outside the auth layer, guarded only by
#                                   `ip.is_loopback()` — which a loopback
#                                   reverse proxy satisfies for every caller
#   ShellTool                       registered on the agent runtime; its
#                                   approval grant is cached store-wide and a
#                                   pending approval can wedge a scheduler
#                                   permit (approval.rs)
#
# See sovereign/deploy/onprem/README.md.
dev-routes = []

# Agent tools that reach the open internet. ON by default, so every
# existing build behaves exactly as before. `--no-default-features`
# drops them, which is what makes a zero-egress deployment TRUE rather
# than merely intended.
#
#   search's web fallback   POST html.duckduckgo.com, then
#                           www.google.com when that is bot-blocked,
#                           then lite.duckduckgo.com. Fires on any chat
#                           turn where the top LOCAL retrieval score is
#                           below SCORE_SUFFICIENT — i.e. exactly when
#                           the corpus is thin, which is often.
#   web_fetch               ANY url the model emits. Scheme-only
#                           validation, no host allowlist, follows 5
#                           redirects.
#   wikipedia_fetch         en.wikipedia.org.
#
# Deliberately SEPARATE from `dev-routes`: those are developer surfaces
# whose risk is privilege (a shell, an arbitrary file read). These are
# ordinary product features whose risk is egress. One flag for two
# unrelated decisions would mean neither name is true.
#
# Note what is NOT a switch for these: `Permission::Network`. WebFetchTool
# declares it, but the permission is consulted at exactly one call site —
# the plan executor — and the chat/agent path calls `tool.execute()`
# directly. Without this feature there is no in-process control at all,
# which is why the on-prem systemd units also carry IPAddressDeny.
#
# Under `--no-default-features`, `search` is still registered — over the
# INSTALLED CORPORA only. Corpus search is the product; the web fallback
# is a different capability that happens to share a tool id.
net-tools = []

[dependencies]
sovereign-contracts = { workspace = true }
sovereign-core = { workspace = true }
sovereign-inference = { workspace = true }
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true, features = ["treesitter"] }
sovereign-gliner = { workspace = true }
# Workflow-author tools (Inc0) — register them on the runtime alongside the
# recipe-author tools so the agent loop can author workflows too.
sovereign-workflow-host = { workspace = true }
# Shared fair-scheduling policy (SchedCore) — backs both this server's
# turn scheduler and the commonwealth-api peer-admission gate, so both
# share identical fairness rules. Light crate (oicp-types only).
commonwealth-core = { workspace = true }
# TDD-machine backend — HTTP + MCP transports dispatch through this
# crate's SolverRegistry. See sovereign/docs/TDD_MACHINE_DESIGN.md
# phase 7e.
commonwealth-tdd = { workspace = true }
# Dial-by-key client access (Track M) — pulls the iroh feature into
# default builds of this binary; everything else stays runtime-gated
# behind `[iroh] enabled`.
commonwealth-transport = { workspace = true, features = ["iroh"] }
corpus-engine = { workspace = true, features = ["treesitter"] }
corpus-engine-notes = { workspace = true }
corpus-engine-scip = { workspace = true }
corpus-engine-watchers = { workspace = true }
dirs = "5"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
uuid = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
arc-swap = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
# WebSocket client for the streaming end-to-end test. Pinned to the
# version already in the tree (axum 0.8 pulls tokio-tungstenite 0.29).
tokio-tungstenite = "0.29"

[lints]
workspace = true
