[package]
name = "sovereign-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sovereign-core = { workspace = true }
sovereign-inference = { workspace = true }
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true, features = ["treesitter", "gliner-ner"] }
# TDD-machine backend — HTTP + MCP transports dispatch through this
# crate's SolverRegistry. See sovereign/docs/TDD_MACHINE_DESIGN.md
# phase 7e.
commonwealth-tdd = { workspace = true }
# Dial-by-key client access (Track M) — pulls the iroh feature into
# default builds of this binary; everything else stays runtime-gated
# behind `[iroh] enabled`.
commonwealth-transport = { workspace = true, features = ["iroh"] }
corpus-engine = { workspace = true, features = ["treesitter"] }
corpus-engine-notes = { workspace = true }
corpus-engine-scip = { workspace = true }
dirs = "5"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
uuid = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
arc-swap = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
# WebSocket client for the streaming end-to-end test. Pinned to the
# version already in the tree (axum 0.8 pulls tokio-tungstenite 0.29).
tokio-tungstenite = "0.29"

[lints]
workspace = true
