[package]
name = "sovereign-meshapp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[dependencies]
# Atoms, atlas readers, investigation graph, the corpus chunk index — the
# meshapp ops are projections over corpus-engine reads. No `treesitter`: these
# ops touch atoms/prose, never the SCIP code graph.
corpus-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Wrapped artifact builder: weekday/hour folds + read-only GLiNER
# chunk_entities reads from the sovereign state db.
chrono = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
