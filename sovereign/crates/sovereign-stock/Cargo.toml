[package]
name = "sovereign-stock"
version.workspace = true
edition.workspace = true
license.workspace = true

# The stock distribution (docs/FIVE_PROGRAMS.md §2c; phase-b-29 Q1, Q2, Q4):
# ONE process that runs svrn with serve and code hosted in it. A composition
# root in no package, held to its faces by boundary-gate (`[[distribution]] stock` in
# quality/ARCH_LAYERS.toml): svrn's process entry and serve's assembly. It
# names no sovereign-contracts, so it never raises that crate's fan-in.

[[bin]]
name = "sovereign-stock"
path = "src/main.rs"

[dependencies]
# `treesitter`: the daemon's process entry mounts `daemon_cmd`, gated on it.
sovereign-daemon = { workspace = true, features = ["treesitter"] }
sovereign-serve = { workspace = true }
# Code's face (`face::compose`), mounted on svrn's one `/mcp`
# (pb-code-daemon-exit).
sovereign-code = { workspace = true }
# Ingest's enrichment-config port, whose implementor is the catalog's
# (`port::CatalogEnrichConfig`); svrn links no catalog
# (pb-ingest-dial-tools-close).
sovereign-enrichment-catalog = { workspace = true }
# The grammar registry code's editor door takes as an input
# (`extractors::code::language_for_extension`, pb-meshapp-rest); code may not
# name corpus-engine, so the distribution supplies it.
corpus-engine = { workspace = true, features = ["treesitter"] }
host-kit = { workspace = true, features = ["shell"] }
tokio = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
# serve_latency_bars (moved from sovereign-daemon, pb-serve-distributes): the
# stream and embed calls, serve's readiness probe, and the laps' subscriber.
futures = { workspace = true }
sovereign-contracts = { workspace = true }
sovereign-turn-client = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
