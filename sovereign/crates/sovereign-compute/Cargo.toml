[package]
name = "sovereign-compute"
version.workspace = true
edition.workspace = true
license.workspace = true

# The supervised compute-child process boundary (DISTRIBUTED_PILOT_READINESS.md
# P1). Holds the child-process supervisor (extracted from sovereign-desktop so
# daemon crates can reuse it — desktop can't be a dep of the daemon), plus (in
# later increments) the native lossless wire contract, the child HTTP server +
# entrypoint, the client, and the daemon-side provider facade + replica pool.
#
# Layer: runtime (quality/ARCH_LAYERS.toml). Depends only on same-or-lower
# layers (sovereign-inference is same-layer; sovereign-contracts is lower).

[dependencies]
# The wire contract IS the contract crate's types — CompletionRequest /
# CompletionResponse / StreamFrame cross the process boundary verbatim, and
# the child server wraps an `Arc<dyn InferenceProvider>`.
sovereign-contracts = { workspace = true }
# The server shell the child serves through (phase-b pb-shell).
host-kit = { workspace = true, features = ["shell", "jobs"] }
# The compute child embeds the real engine: EmbeddedLlamaCpp (generate) /
# EmbedOnlyProvider (embed), plus fast_exit_skip_destructors on the abort path.
# Runtime-layer, same layer as this crate, so the direction is legal.
sovereign-inference = { workspace = true }
# The NER served kind's loader (`ner.rs`, phase-b pb-serving-ner). This crate's
# only dependent is sovereign-daemon, so the ONNX stack links nowhere new.
sovereign-gliner = { workspace = true }
# `RemoteNer`, the NER kind's client, re-exported at `ner::RemoteNer`
# (pb-cli-llm moved it beside rerank; a shared leaf).
oicp-client = { workspace = true }
# The mesh RPC-worker discovery loop (pb-serve-distributes): discovery and
# the eligibility gate it feeds, the mesh ports it reads (serving-host), the
# shared-model host election (commonwealth-core `partition::should_host`),
# node ids (kernel-types).
sovereign-serving-host = { workspace = true }
commonwealth-core = { workspace = true }
kernel-types = { workspace = true }
# The warm orchestrator's dial vocabulary (`PeerEndpoint`, `TrafficClass`;
# a package leaf), and the model-file URL both ends of a warm build
# (oicp-types `model_transfer`).
mesh-reach = { workspace = true }
oicp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
uuid = { workspace = true }
sha2 = { workspace = true }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

# Graceful child termination: SIGTERM (so the compute child can run
# `fast_exit_skip_destructors` and dodge the ggml teardown SIGABRT) before
# the bounded-grace SIGKILL fallback. tokio's `Child::kill` is SIGKILL only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
