[package]
name = "sovereign-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

# ingest's one CLI (phase-b pb-ingest-cli): `svrn ingest <recipe.toml>` execs
# it with the verb as its first argument. Moved from corpus-mcp's `ingest`
# verb; pb-cli-llm-ingest-move fills it with cli-llm's ingest half.
[[bin]]
name = "svrn-ingest"
path = "src/bin/svrn-ingest/main.rs"

[dependencies]
# The recipe pipeline (acquire → … → index) and the atlas build orchestrator
# the `ingest` verb drives; both are [[package]] ingest members with this
# crate, so neither crosses a package line.
# `treesitter`: the `code` extractor and `reindex_file`, which `index` runs
# for code's `code index` (pb-code-index).
corpus-engine = { workspace = true, features = ["treesitter"] }
sovereign-enrichment-build = { workspace = true }
# The one embeddings-endpoint decider (`host`) and the index read types.
corpus-index = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
# Zero-dep leaf: canonical Unix-epoch wall-clock helpers.
sovereign-time = { workspace = true }
# Path SSOT: per-user svrnmesh paths come from `rebrand` (never hand-rolled $HOME).
sovereign-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }
regex = { workspace = true }
dirs = "5"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
