# Chaos-monkey scenario template — same domain as the consulting
# template, but every chunk is deliberately awkward in a way real
# users actually produce. The expected_entities list is the *clean*
# ground truth (Sarah Chen, Mike Torres, ...); the conversations
# beat that ground truth up with:
#
#   * Typos / misspellings ("Sara Chen", "Achme Crop", "Stonwell")
#   * Voice-to-text artifacts ("AP I" for API, "to month's" for
#     "two months", "ducking" for fucking)
#   * Auto-correct mistakes ("migragion plan", "duck the deadline")
#   * Mid-sentence fragments and crisis tone ("ughhh Mike just—")
#   * Code names later revealed ("Project Tiger" = API migration)
#   * Mixed-language fragments ("OK saludos a Raj")
#   * Pronoun chains with no nearby referent
#   * Conflicting / corrected info ("scratch that, Mike is product
#     not engineering")
#   * Sarcasm and dark humor ("Sarah is killing it 💀")
#   * Heavy emoji and shorthand
#   * Email-thread paste artifacts ("On Mon, Sarah wrote: > ...")
#   * Bullet shorthand ("- M.T. blocked - pricing 4 Acme stuck @
#     procurement")
#   * Hypothetical / negated mentions ("if we win Stonewell we'd...",
#     "we lost Stonewell")
#   * Long buried mentions inside off-topic rants
#   * Org transitions ("Sarah's leaving Acme for Helios")
#
# Pipeline robustness on this fixture is the question, not absolute
# F1. The clean consulting fixture sits ~0.89; this one is expected
# to land lower. The interesting metric is *which* failure modes
# survive the parser hardening, canonicalization, fuzzy fold, and
# filter pass.

[meta]
name = "chaos-month"
description = "Chaos-monkey: same domain, deliberately noisy chunks (typos, fragments, code names, sarcasm, emoji, mixed languages, pronoun chains) — measures pipeline robustness under realistic friction"
days = 30

