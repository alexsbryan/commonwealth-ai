# dubliners-3 — three short stories from Joyce's *Dubliners*
# (Project Gutenberg #2814) as a literary fixture stress-testing
# adversarial cases the BK fixture leaves under-tested.
#
# Story selection: THE SISTERS / ARABY / EVELINE — the three
# child-protagonist stories that open the collection, plus Eveline
# (a young woman) for narrator-mode contrast. Together ~580 lines —
# small enough to iterate on with median-of-3 in minutes, structurally
# rich enough to surface real failure modes:
#
#   * **Unnamed first-person narrators.** "The Sisters" and "Araby"
#     are narrated in the first person by an unnamed boy. The narrator
#     is a *voice* with desires and observations, not an entity that
#     exists for the extractor — there must be no `canonical_name:
#     "the narrator"` Person atom. (Same hard rule as bk-book-1: the
#     extractor symmetrically must not promote the author either.)
#   * **Free indirect discourse.** "Eveline" is third-person but
#     filtered through Eveline's consciousness — sentences like "she
#     was tired" report her interior state directly, not the narrator's
#     observation. The extractor must treat these as Eveline's State
#     atoms, not narrator-voice claims.
#   * **Reference disambiguation.** "The Sisters" cycles between "the
#     priest" / "Father Flynn" / "old James" — same entity, three
#     names. Likewise "old Cotter" appears only by surname. Aliases
#     must collapse correctly without merging the two old men.
#   * **Cross-story concept.** "Paralysis" appears explicitly in
#     paragraph 1 of "The Sisters" and is the structural concept that
#     runs through the entire collection. The extractor should surface
#     it as a Concept atom even though it's a single word in passing.
#   * **Epiphany endings.** Each story ends with the protagonist's
#     moment of recognition — the boy's failure at Araby, Eveline's
#     paralysed clutch at the railing. The extractor should produce
#     a State atom marking the recognition, not collapse it into the
#     surrounding Event atoms.
#   * **Implicit setting as Place atom.** Each story is densely Dublin
#     — North Richmond Street, the bazaar Araby, the docks at the
#     North Wall, Buenos Ayres as a destination. Settings are Place
#     atoms; characters who appear only in setting description are
#     not Person atoms.
#   * **Single-mention secondary characters.** "Eveline" mentions her
#     mother (dead), her brothers Harry and Ernest (one dead, one
#     working), Miss Gavan (her boss), Frank (her would-be lover).
#     The extractor must extract all of them as Person atoms even when
#     they appear once or are deceased.
#
# Section delimiter: `## ` markdown h2 lines. The CLI passes
# `--chapter-regex '(?m)^##\s+'` when materialising this template.

