[package]
name = "sovereign-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Slim dispatcher binary. After slices 1–5 (2026-05-22), the only
# code that lives here is exec-dispatch (`dev_bin`, `llm_bin`),
# pure-FS delegators (notes, status, drift, audit, ...) and light
# commands that touch SQLite + filesystem only. The three archaeology
# verbs left for `sovereign-cli-dev` 2026-09-21 — they are `svrn code`'s
# and carried the only `corpus-engine-archaeology` edge. Every LLM-using surface
# (bench, chat, eval, atlas, daemon, ...) moved to
# `sovereign-cli-dev` or `sovereign-cli-llm` siblings.
#
# Dep surface shrank accordingly:
#   removed: sovereign-inference (llama-cpp-2), sovereign-tools,
#            sovereign-mesh, sovereign-pipeline, sovereign-work-atlas
#   kept:    sovereign-core (light traits + types), sovereign-store
#            (SqliteStateStore). corpus-engine left with pb-code-index:
#            `project init` execs the code program to index.
#   also removed 2026-09-21: sovereign-agent-bench — `agent-bench` execs
#            its own `[[bin]]` sibling instead (`agent_bench_bin`).

[dependencies]
sovereign-core = { workspace = true }
sovereign-store = { workspace = true }
# Bottom-layer `contract` crate (ARCH_LAYERS.toml). Needed for the shared
# frame combinators: the boot-time frame READER and the frame WRITER
# (sovereign-tools) must compute the carried-item advisory identically, and
# sovereign-cli cannot see sovereign-tools in a gated build.
sovereign-contracts = { workspace = true }
# The stale-sibling warning (`sibling::warn_if_stale`), shared with
# cli-daemon; host-kit is a shared leaf (pb-distribution-f11-daemon-twins).
host-kit = { workspace = true, features = ["sibling"] }
# The neutral kernel — `posture` renders every row as a `Judgement`, so the
# verdict vocabulary, the age format and the staleness band are one decider
# rather than seven (noun-convergence rung nc-10-judgement). Layer 0, so this
# edge points DOWN; it is not routed through sovereign-contracts because
# kernel-types is a membrane meant to be named directly (ARCH §8.3 is about
# re-exported types, not about the membrane itself).
# `quality-registry` is the parser + render for quality/instruments.toml, read
# here by `quality map` and by posture's coverage line. Feature-gated in the
# kernel so the four-dep budget holds for a lift of that leaf; `xtask` asks for
# the same feature, so the workspace resolves ONE variant of kernel-types.
kernel-types = { workspace = true, features = ["quality-registry"] }
sovereign-cli-shared = { workspace = true }
# ── The work plane (cw-lift 5e) ──────────────────────────────────────
# `svrn quality check --distribute` submits this venue's instrument rows as
# `process:v1` units on the `work` ring and merges the verdicts back. OPTIONAL
# and pulled by `dev-tools` ONLY: `quality` is a dev-gated verb, so the
# shipped end-user dispatcher links none of it.
#
#   oicp-types          the job vocabulary (`JobKind` / `JobRequirements` /
#                       `JobUnit`) and, since pb-work-doors, the work
#                       vocabulary in `oicp_types::work` — the acts' types,
#                       the folded queue, the refusal set, `ProcessPayload`.
#
# NO commonwealth-work (pb-work-doors): sealing, the signed Submit, `may_take`
# and the attribution method are decisions over the rail, and cw-rails runs
# the one implementation of each behind its `/v1/work/*` doors. The HTTP half
# is `sovereign-cli-shared/rail-client`, the one operator-side rail client.
oicp-types = { workspace = true, optional = true }
# Flag surfaces are declared as structs (`#[derive(clap::Parser)]`), not
# hand-rolled `while i < args.len()` loops: the dispatcher's own `--help` /
# `--version` globals and `notes retrieval-audit`. Rendering goes through
# `sovereign_cli_shared::flag_surface::parse`, which owns the one prefix rule.
# ~11 transitive crates on top of the 871 this binary already links.
clap = { workspace = true }
corpus-index = { workspace = true }
corpus-engine-scip = { workspace = true, optional = true }
# The pure-HTTP OICP client — `deep-research`'s loopback calls. Depended on
# directly rather than through `sovereign-inference`, which re-exports it while
# linking llama.cpp unconditionally.
oicp-client = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
dirs = "5"
hex = "0.4"
which = "7"
# `reach::locate_sibling` — the one sibling locator the `*_bin` exec
# dispatchers call. A [[package_leaf]], so the edge is free.
sovereign-turn-client = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
# `memory_cmd` reads the conversation db directly for one query. Production
# CLI paths go through StateStore. (`awareness_cmd` was the other reader until
# 2026-08-21; it moved to sovereign-cli-llm and took its own copy of this dep
# with it, so this stays non-optional for memory_cmd alone.)
rusqlite = { version = "0.35", features = ["bundled"] }
workspace-hack = { version = "0.1", path = "../../../shared/crates/workspace-hack" }
# `libc` is used by `serve_cmd` for `kill -TERM` via /bin/kill and by
# `stop_cmd` for `process_alive`. Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# Used by the cli_contract_* conformance tests to load + reconcile the CLI
# contract manifest (docs/cli-contract.toml) through the one shared parser.
sovereign-cli-shared = { workspace = true }

[features]
# The shipped build carries the deep-research verb (order
# deep-research-t3a graduated it out of the dev-tools-only surface).
# `--backend mock --mock-deck` stays visible/documented; the loop is
# local-only — the loop and its live port live in sovereign-core;
# this crate keeps only the verb (arg parsing, resume sidecar, estate
# ingest, summary) and reaches the daemon over loopback HTTP.
default = [
    "deep-research",
    # The notes/seat daemon routes are UNGATED by design (pin test
    # seat_watch_daemon_path_is_never_feature_gated; commons-fluency
    # fix 5) — the route must carry in every contract, never a silent
    # runtime refusal. reqwest is already a non-optional dep of this
    # crate, so this costs no new link; without it the default build
    # cannot compile at all (E0432, measured 2026-08-17 — the gate
    # only protected the sovereign-cli-daemon binary, which does not
    # depend on sovereign-cli-shared this way).
    "sovereign-cli-shared/mcp-client",
]
# `dev-tools` re-enables the developer-toolchain verb surface (project
# lifecycle, code intelligence, archaeology) that the default
# (end-user) build gates out. Most gated verbs exec the
# `sovereign-cli-dev` sibling at runtime; `deep-research` runs in-process
# and pulls oicp-client (a pure reqwest leaf — no llama.cpp).
dev-tools = [
    # `svrn quality check --distribute` (cw-lift 5e). See the dep block above;
    # `rail-client` is the ONE rail client.
    "dep:oicp-types",
    "sovereign-cli-shared/rail-client",
    "deep-research",
]
# The thin local-only research loop (T1): gated corpus + web search,
# custody-stamped fetch, gap-audited rounds. Talks to the daemon over
# loopback HTTP only (oicp-client) — no llama.cpp, no mesh.
deep-research = ["dep:oicp-client"]
# `project init` in the SHIPPED binary. Its index step, `svrn code index`
# and `svrn refresh` exec the code program, `sovereign-cli-dev`
# (pb-code-index); init itself reads/writes the SCIP db
# (`corpus-engine-scip` — rusqlite + prost, no grammars).
#
# Deliberately NOT pulling `sovereign-tools`/`-mesh`: neither is on the
# init path, and each would drag llama.cpp or LanceDB into an end-user
# binary.
code-intel = [
    "dep:corpus-engine-scip",
    # `project init` reaches the project model by exec'ing the code program
    # (`sovereign-cli-dev project-observe`, pb-code-cli-base), and probes `/mcp` at the end of its run. reqwest is already a
    # non-optional dep of this crate, so enabling this costs no new link.
    "sovereign-cli-shared/mcp-client",
]

[lints]
workspace = true
