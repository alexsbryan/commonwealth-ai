[package]
name = "sovereign-cli"
version.workspace = true
edition.workspace = true

# Slim dispatcher binary. After slices 1–5 (2026-05-22), the only
# code that lives here is exec-dispatch (`atos_bin`, `llm_bin`),
# pure-FS delegators (notes, status, drift, audit, ...), and a few
# light commands (archaeology-eval, git-archaeology, rough-edges)
# that touch SQLite + filesystem only. Every LLM-using surface
# (bench, chat, eval, atlas, daemon, ...) moved to
# `sovereign-cli-atos` or `sovereign-cli-llm` siblings.
#
# Dep surface shrank accordingly:
#   removed: sovereign-inference (llama-cpp-2), sovereign-tools,
#            sovereign-mesh, sovereign-pipeline, sovereign-work-atlas
#   kept:    sovereign-core (light traits + types), sovereign-store
#            (SqliteStateStore), sovereign-atos (approval helpers
#            used by audit_cmd), sovereign-agent-bench (subprocess
#            driver — light), corpus-engine (stores feature only).

[dependencies]
sovereign-core = { workspace = true }
sovereign-store = { workspace = true }
sovereign-atos = { workspace = true }
sovereign-agent-bench = { workspace = true }
# `awareness_cmd` (dev-tools only) needs the heavy `knowledge_view`
# surface from sovereign-tools. Default builds skip this.
sovereign-tools = { workspace = true, optional = true }
sovereign-cli-shared = { workspace = true }
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state" }
commonwealth-core  = { path = "../../../commonwealth/crates/commonwealth-core" }
corpus-engine = { workspace = true }
corpus-engine-archaeology = { workspace = true }
corpus-engine-notes = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
arc-swap = { workspace = true }
dirs = "5"
hex = "0.4"
hostname = { workspace = true }
tempfile = "3"
which = "7"
sha2 = { workspace = true }
chrono = { workspace = true }
regex = "1"
# Used by `awareness_cmd` (gated behind the `dev-tools` feature) for
# direct SQLite reads. Production CLI paths go through StateStore.
rusqlite = { version = "0.35", features = ["bundled"] }
# `libc` is used by `serve_cmd` for `kill -TERM` via /bin/kill and by
# `stop_cmd` for `process_alive`. Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# `dev-tools` gates the `sovereign awareness` development CLI.
# Pulls in `sovereign-tools` for its `knowledge_view` modules.
dev-tools = ["dep:sovereign-tools"]
