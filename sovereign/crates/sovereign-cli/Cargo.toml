[package]
name = "sovereign-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Slim dispatcher binary. After slices 1–5 (2026-05-22), the only
# code that lives here is exec-dispatch (`atos_bin`, `llm_bin`),
# pure-FS delegators (notes, status, drift, audit, ...), and a few
# light commands (archaeology-eval, git-archaeology, rough-edges)
# that touch SQLite + filesystem only. Every LLM-using surface
# (bench, chat, eval, atlas, daemon, ...) moved to
# `sovereign-cli-atos` or `sovereign-cli-llm` siblings.
#
# Dep surface shrank accordingly:
#   removed: sovereign-inference (llama-cpp-2), sovereign-tools,
#            sovereign-mesh, sovereign-pipeline, sovereign-work-atlas
#   kept:    sovereign-core (light traits + types), sovereign-store
#            (SqliteStateStore), sovereign-atos (approval helpers
#            used by audit_cmd), sovereign-agent-bench (subprocess
#            driver — light), corpus-engine (stores feature only).

[dependencies]
sovereign-core = { workspace = true }
sovereign-store = { workspace = true }
# Bottom-layer `contract` crate (ARCH_LAYERS.toml). Needed for the shared
# frame combinators: the boot-time frame READER and the frame WRITER
# (sovereign-tools) must compute the carried-item advisory identically, and
# sovereign-cli cannot see sovereign-tools in a gated build.
sovereign-contracts = { workspace = true }
# The neutral kernel — `posture` renders every row as a `Judgement`, so the
# verdict vocabulary, the age format and the staleness band are one decider
# rather than seven (noun-convergence rung nc-10-judgement). Layer 0, so this
# edge points DOWN; it is not routed through sovereign-contracts because
# kernel-types is a membrane meant to be named directly (ARCH §8.3 is about
# re-exported types, not about the membrane itself).
kernel-types = { workspace = true }
sovereign-agent-bench = { workspace = true, optional = true }
# `awareness_cmd` (the `awareness` feature only) needs the heavy
# `knowledge_view` surface from sovereign-tools. Default + `dev-tools`
# builds skip this; only `--features awareness` pulls it in.
sovereign-tools = { workspace = true, optional = true }
sovereign-cli-shared = { workspace = true }
corpus-engine = { workspace = true }
corpus-engine-archaeology = { workspace = true, optional = true }
corpus-engine-scip = { workspace = true, optional = true }
# The pure-HTTP OICP client — `RemoteApiProvider` for `code index`'s embed
# calls. Depended on directly rather than through `sovereign-inference`, which
# re-exports it while linking llama.cpp unconditionally.
oicp-client = { workspace = true, optional = true }
# The pure leaf web tools (DDG search + HTML extraction) the thin
# deep-research loop's `ResearchPort` uses. No corpus-engine/llama/mesh —
# same dependency budget as oicp-client. Optional + pulled by the
# `deep-research` feature only.
sovereign-tools-base = { workspace = true, optional = true }
corpus-engine-notes = { workspace = true }
# Only the opt-in `awareness` diagnostic CLI reads the ATOS FeatureStore
# (corpus_engine_atos). Optional + pulled by the `awareness` feature so the
# default `sovereign` dispatcher carries zero ATOS.
corpus-engine-atos = { workspace = true, optional = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
arc-swap = { workspace = true }
dirs = "5"
hex = "0.4"
hostname = { workspace = true }
tempfile = { workspace = true }
which = "7"
sha2 = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
# Used by `awareness_cmd` (gated behind the `awareness` feature) for
# direct SQLite reads. Production CLI paths go through StateStore.
rusqlite = { version = "0.35", features = ["bundled"] }
# `libc` is used by `serve_cmd` for `kill -TERM` via /bin/kill and by
# `stop_cmd` for `process_alive`. Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
# Used by the cli_contract_* conformance tests to load + reconcile the CLI
# contract manifest (docs/cli-contract.toml) through the one shared parser.
sovereign-cli-shared = { workspace = true }

[features]
# The shipped build carries the deep-research verb (order
# deep-research-t3a graduated it out of the dev-tools-only surface).
# `--backend mock --mock-deck` stays visible/documented; the loop is
# local-only (oicp-client + sovereign-tools-base are pure reqwest
# leaves — no llama.cpp, no corpus-engine extras beyond the
# non-optional dep).
default = [
    "deep-research",
    # The notes/seat daemon routes are UNGATED by design (pin test
    # seat_watch_daemon_path_is_never_feature_gated; commons-fluency
    # fix 5) — the route must carry in every contract, never a silent
    # runtime refusal. reqwest is already a non-optional dep of this
    # crate, so this costs no new link; without it the default build
    # cannot compile at all (E0432, measured 2026-08-17 — the gate
    # only protected the sovereign-cli-daemon binary, which does not
    # depend on sovereign-cli-shared this way).
    "sovereign-cli-shared/mcp-client",
]
# `dev-tools` re-enables the developer-toolchain verb surface (project
# lifecycle, ATOS, code intelligence, archaeology) that the default
# (end-user) build gates out. Most gated verbs exec the
# `sovereign-cli-dev` sibling at runtime; `deep-research` runs in-process
# and pulls oicp-client + sovereign-tools-base (both pure reqwest leaves
# — no llama.cpp, no corpus-engine extras beyond the non-optional dep).
dev-tools = [
    "dep:corpus-engine-archaeology",
    "dep:sovereign-agent-bench",
    "deep-research",
]
# The thin local-only research loop (T1): gated corpus + web search,
# custody-stamped fetch, gap-audited rounds. Talks to the daemon over
# loopback HTTP only (oicp-client) — no llama.cpp, no mesh.
deep-research = ["dep:oicp-client", "dep:sovereign-tools-base"]
# `svrn code index` / `svrn refresh` in the SHIPPED binary. Three lines is the
# entire cost: the index path talks to the daemon over loopback HTTP for
# embeddings (`oicp-client`, pure reqwest — no llama.cpp), reads/writes the
# SCIP db (`corpus-engine-scip` — rusqlite + prost, no grammars), and needs
# corpus-engine's `treesitter` for the `code` extractor, which is
# `#[cfg(feature = "treesitter")]`-gated and panics without it
# (`corpus-engine/src/engine/ingest_factories.rs:295-303`).
#
# Deliberately NOT pulling `sovereign-tools`/`-mesh`/`-atos`: none is on the
# index path, and each would drag llama.cpp or LanceDB into an end-user
# binary. The grammars are already in the shipped daemon and llm siblings, so
# this is not a new cost to the tarball — see SYSTEM_OVERVIEW.
code-intel = [
    "dep:oicp-client",
    "dep:corpus-engine-scip",
    "corpus-engine/treesitter",
    # The verb itself. One implementation, shared with the workbench, which
    # served a byte-drifting copy of it until 2026-08-20.
    "sovereign-cli-shared/code-index",
    # `project init` (2026-08-07) reads the project model — `observation` to
    # derive what the repo IS, `project_toml` to persist it. Both live in
    # sovereign-cli-shared because the workbench still reads what init writes.
    "sovereign-cli-shared/project-model",
    # …and probes `/mcp` at the end of its run. reqwest is already a
    # non-optional dep of this crate, so enabling this costs no new link.
    "sovereign-cli-shared/mcp-client",
]
# `awareness` builds the heavy `sovereign awareness` knowledge-view
# diagnostic CLI, which pulls `sovereign-tools`. Opt-in and independent
# of `dev-tools` so the common developer build stays light.
awareness = ["dep:sovereign-tools", "dep:corpus-engine-atos"]

[lints]
workspace = true
