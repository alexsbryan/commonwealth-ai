[package]
name = "sovereign-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The daemon↔package contract, extracted from sovereign-core so a package
# (workflow / recipe authoring) can build against the trait + type vocabulary
# WITHOUT dragging the runtime hub. Depends only on oicp-types + serde leaves —
# the exact dependency budget a third-party implementation can lift.

[dependencies]
oicp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Home-dir + platform config-dir resolution for setup_config's path helpers.
dirs = "6"
# Line-anchored section detection (recipe::sections). The detector half of
# corpus-engine's sectioned chunker lives here so the workflow SectionTool and
# the bespoke ingest path share ONE segmentation implementation — a pure-CPU
# contract, no document-shipping over MCP.
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
