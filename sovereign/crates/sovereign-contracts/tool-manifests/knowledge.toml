[[tool]]
id = "wikipedia_fetch"
name = "Wikipedia: Fetch Article"
description = "Fetch a specific Wikipedia article on demand and ingest it into the user's Wikipedia corpus. Use this when the catalog (`wikipedia-catalog`) surfaces a title that matches the user's question but the full article hasn't been indexed yet — the next retrieval will return the article's content directly. Takes 15-60 seconds per article (download + chunk + embed); always inform the user before calling. The fetched article carries `parent_corpus_id = wikipedia` so it surfaces under the user's existing Wikipedia corpus and is shared across the mesh like any other Wikipedia content."
effect = "readwrite"
idempotency = "idempotent"
latency = "slow"
scope = "persistent"
permissions = ["FileWrite", "Network"]

[tool.parameters]
type = "object"
required = ["title"]

[tool.parameters.properties]

[tool.parameters.properties.title]
type = "string"
description = "The exact article title from a catalog hit (e.g. \"Roman Empire\", \"Albert Einstein\"). Case-sensitive; pass the title verbatim from the CatalogHit metadata."

[tool.parameters.properties.enrich]
type = "boolean"
description = "If true, also build the per-article atlas (~1-2 minutes additional). Default false — atlas grounding still works without per-article enrichment because the article's chunks land in the wikipedia corpus's atlas grounding bag."
default = false

[tool.parameters.properties.expand_links]
type = "boolean"
description = "If true, queue a one-hop link-expansion (\"minesweeper\") after the primary fetch — top-N articles linked from this one are pre-loaded into the same shared corpus. Default true. Set false for batch / seed flows (e.g. Tier-1.5 placeholder seeding) where the caller wants exactly the requested article and no automatic neighbours."
default = true

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.new_corpus_id]
type = "string"

[tool.output_schema.properties.chunks_created]
type = "integer"

[tool.output_schema.properties.title]
type = "string"

