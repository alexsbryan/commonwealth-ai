description = "Recipient email (for send)"

[tool.parameters.properties.subject]
type = "string"
description = "Email subject (for send)"

[tool.parameters.properties.body]
type = "string"
description = "Email body (for send)"

[[tool]]
id = "epistemic_landscape"
name = "Epistemic Landscape"
description = "Map the landscape of positions, agreements, and disagreements on a topic. Returns the dominant view, contested positions, specific fault lines, and open questions. Use for contested philosophical, scientific, or policy questions."
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["topic"]

[tool.parameters.properties]

[tool.parameters.properties.topic]
type = "string"
description = "The topic or question to map"

[tool.output_schema]
type = "string"
description = "Markdown summary of the epistemic landscape — dominant view, contested positions, fault lines, open questions."

[[tool]]
id = "extract"
name = "extract"
description = "Extract a document's text by file type (PDF, Office, HTML, epub, Markdown, txt) and return it — e.g. params = { path = \"{item.path}\" }. Feed the output to tool:chunk."
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = ["path"]

[tool.parameters.properties]

[tool.parameters.properties.path]
type = "string"
description = "File to extract text from"

[[tool]]
id = "file"
name = "File"
description = "Read, write, list, and search files within allowed directories"
effect = "readwrite"
idempotency = "nonidempotent"
latency = "instant"
scope = "session"
permissions = ["FileRead", "FileWrite"]

[tool.parameters]
type = "object"
required = ["action", "path"]

[tool.parameters.properties]

[tool.parameters.properties.action]
type = "string"
enum = ["read", "write", "list", "search"]

[tool.parameters.properties.path]
type = "string"

[tool.parameters.properties.content]
type = "string"
description = "For write action"

[tool.parameters.properties.pattern]
type = "string"
description = "Glob pattern for search"

[[tool]]
id = "knowledge"
name = "Knowledge"
description = "Search your ingested documents for relevant information"
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["query"]

[tool.parameters.properties]

[tool.parameters.properties.query]
type = "string"
description = "The search query"

[tool.output_schema]
type = "string"
description = "Prose synthesis over local knowledge corpora, with inline citations to source chunks."

[[tool]]
id = "wikipedia_fetch"
name = "Wikipedia: Fetch Article"
description = "Fetch a specific Wikipedia article on demand and ingest it into the user's Wikipedia corpus. Use this when the catalog (`wikipedia-catalog`) surfaces a title that matches the user's question but the full article hasn't been indexed yet — the next retrieval will return the article's content directly. Takes 15-60 seconds per article (download + chunk + embed); always inform the user before calling. The fetched article carries `parent_corpus_id = wikipedia` so it surfaces under the user's existing Wikipedia corpus and is shared across the mesh like any other Wikipedia content."
effect = "readwrite"
idempotency = "idempotent"
latency = "slow"
scope = "persistent"
permissions = ["FileWrite", "Network"]

[tool.parameters]
type = "object"
required = ["title"]

[tool.parameters.properties]

[tool.parameters.properties.title]
type = "string"
description = "The exact article title from a catalog hit (e.g. \"Roman Empire\", \"Albert Einstein\"). Case-sensitive; pass the title verbatim from the CatalogHit metadata."

[tool.parameters.properties.enrich]
type = "boolean"
description = "If true, also build the per-article atlas (~1-2 minutes additional). Default false — atlas grounding still works without per-article enrichment because the article's chunks land in the wikipedia corpus's atlas grounding bag."
default = false

[tool.parameters.properties.expand_links]
type = "boolean"
description = "If true, queue a one-hop link-expansion (\"minesweeper\") after the primary fetch — top-N articles linked from this one are pre-loaded into the same shared corpus. Default true. Set false for batch / seed flows (e.g. Tier-1.5 placeholder seeding) where the caller wants exactly the requested article and no automatic neighbours."
default = true

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.new_corpus_id]
type = "string"

[tool.output_schema.properties.chunks_created]
type = "integer"

[tool.output_schema.properties.title]
type = "string"
