[[tool]]
id = "lint_status"
name = "Lint Status"
description = "Return lint/type-check status from the background watcher. NEVER run `cargo check` or `cargo build` via Bash — the watcher holds the Cargo file lock continuously; running cargo check alongside it causes BOTH processes to stall indefinitely waiting for the lock. This call reads cached results in microseconds with zero contention. Response fields to trust the result: `age_seconds` — how old the result is (typically < 30s after an edit; if large, the watcher may have been idle); `watched_scope` — the exact command the watcher runs (e.g. 'cargo check --workspace'), confirming which crates are covered; `watcher` — the liveness object `{live, reason, configured, heartbeat_age_secs, hint}`. Read it FIRST: when `live` is false the result below is orphaned (no watcher is running to keep it current), `reason` says why, `hint` says what to do. `watcher_active` mirrors `watcher.live` for back-compat. Status: 'fresh_passing' (clean, age_seconds shows recency), 'fresh_failing' (errors in response), 'stale' (files changed since last run — watcher will rerun automatically on next save), 'running' (in progress — check again in ~15s), 'watcher_down' (a completed run exists but NO live watcher — do not trust it; fall back to scripts/sovereign-lint.sh per `watcher.hint`), 'never_run' (no run yet — see `watcher.reason`)."
effect = "read"
idempotency = "idempotent"
latency = "instant"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.files]
type = "array"
description = "Filter freshness to a specific set of paths. The response gains a per-file `files[]` array with status (`fresh_passing | fresh_failing | stale | never_checked`), `checked_at_unix`, `mtime_unix`, and per-file error/warning counts. Top-level `errors[]` / `warnings[]` are filtered to these files too. Paths may be absolute or workspace-relative."

[tool.parameters.properties.files.items]
type = "string"

[tool.parameters.properties.changed]
type = "boolean"
description = "Shortcut for `files`: auto-derive the list from `git diff --name-only HEAD` + untracked `.rs` files. The killer query for active editing: 'are MY files clean?' Mutually-exclusive with `files`; if both provided, `files` wins."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.status]
type = "string"
enum = ["fresh_passing", "fresh_failing", "stale", "running", "watcher_down", "never_run"]

[tool.output_schema.properties.age_seconds]
type = "integer"

[tool.output_schema.properties.pass_count]
type = "integer"

