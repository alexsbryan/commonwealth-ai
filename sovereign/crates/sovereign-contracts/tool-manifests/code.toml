# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Code-intelligence tool manifests — the DECLARED half of every tool under
# `sovereign-tools/src/code/`: identity, behavioural properties, parameter
# schema, worked examples, required permissions.
#
# Adding a tool here is a DATA change. See `tool_manifest/mod.rs` for the
# schema and `ToolManifest::to_descriptor` for how a row becomes the
# `ToolDescriptor` the router, planner and MCP surface read.

[[tool]]
id = "arch_posture"
name = "Architecture Posture"
description = "Fast headline read of the persisted architecture report: top god-crate, hub crates, cross-crate coupling count, declared↔observed deltas, observed layer violations, file cycles, hidden temporal coupling — plus a freshness verdict (the report fingerprints its inputs; stale means Cargo.toml/Cargo.lock/ARCH_LAYERS.toml or the SCIP index changed since it was written). Use at session start; run `sovereign code arch-report` to refresh."
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.corpus_id]
type = "string"
description = "Code corpus id. Optional when exactly one persisted report exists."

[tool.output_schema]
type = "string"
description = "Markdown posture headline with freshness verdict."

[[tool.examples]]
situation = "Session start on a shared codebase — you want the architectural headlines (god-crates, coupling, violations) without paying for a full graph recompute."
call = {  }

[[tool]]
id = "arch_report"
name = "Architecture Report"
description = "The architectural posture of a codebase, from the SCIP graph: god-crate fan-in/instability table, the heaviest cross-crate coupling edges WITH the symbols that carry them (the input for interface extraction), declared-vs-observed dependency deltas (removable Cargo edges; re-export-hidden coupling), SCIP-observed layer-map violations, file fan-in hotspots, intra-crate file cycles, file-size offenders, feature-axis spread, and (when git history is enabled) temporal coupling — file pairs that change together without any structural edge. Deterministic, no model. Use before refactors that move boundaries, and to answer 'where is the coupling actually?'."
effect = "read"
idempotency = "idempotent"
latency = "slow"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.corpus_id]
type = "string"
description = "Code corpus id (an indexed repo). Optional when exactly one code corpus is indexed."

[tool.parameters.properties.include_git]
type = "boolean"
description = "Compute the temporal-coupling section from git history (adds seconds)."
default = false

[tool.output_schema]
type = "string"
description = "Markdown architecture report derived from the SCIP graph (+ cargo metadata + git when rooted)."

[[tool.examples]]
situation = "You're planning to split a hub crate or move a boundary and need to know which symbols actually carry the coupling between crates — do NOT grep imports one file at a time; the reference graph already knows."
call = { corpus_id = "commonwealth-ai", include_git = true }

[[tool]]
id = "archive_feature"
name = "Archive Feature"
description = "Mark an ATOS feature as archived. Notes tagged to the feature remain queryable via read_notes with scope=['feature'] + feature_id but stop being injected into fresh sessions. Use after the compliance review passes and any promotable notes have been promoted to global scope."
effect = "write"
idempotency = "idempotent"
latency = "instant"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["id", "reason"]

[tool.parameters.properties]

[tool.parameters.properties.id]
type = "string"
description = "Feature id (as returned by provision_feature)."

[tool.parameters.properties.reason]
type = "string"
description = "Why the feature is archived (e.g. 'shipped v0.5', 'abandoned in favor of <other>')."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.archived]
type = "boolean"

[tool.output_schema.properties.id]
type = "string"

[[tool.examples]]
situation = "Milestone 1 of the atos-version-flag feature passed review and the operator asked you to wrap it up. Archive it and move on."
call = { id = "atos-version-flag", reason = "shipped; --version flag lives in atos_cmd.rs" }

[[tool]]
id = "atos_plan_emit"
name = "ATOS plan emit (structured)"
description = "Emit a structured implementation plan for the ATOS Runner during PLAN or REASSESS phases. Pass `workdir` (the absolute path the runner gave you in the atos-context block) and `steps` (an array of step objects). The tool validates the schema, auto-increments the revision against any prior plan, and writes the canonical plan.json to <workdir>/.sovereign/. Use this tool INSTEAD of writing a JSON code block in your reply — free-form prose JSON is brittle for plan-shaped data and the runner's parser will struggle with it. The tool is the deterministic path."
effect = "write"
idempotency = "nonidempotent"
latency = "instant"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["workdir", "steps"]

[tool.parameters.properties]

[tool.parameters.properties.workdir]
type = "string"
description = "Absolute path to the workdir. Read from the atos-context block — it lists the canonical workdir path verbatim. Must be absolute (start with `/`)."

[tool.parameters.properties.steps]
type = "array"
minItems = 1
maxItems = 32
description = "Plan steps in execution order. 3-12 steps for a normal feature; 32 is a hard cap."

[tool.parameters.properties.steps.items]
type = "object"
required = ["id", "goal", "verify_cmd"]

[tool.parameters.properties.steps.items.properties]

[tool.parameters.properties.steps.items.properties.id]
type = "string"
description = "Stable id like `step-01`. The runner's merge logic keys execution state on this — keep ids consistent across REASSESS revisions."

[tool.parameters.properties.steps.items.properties.goal]
type = "string"
description = "One sentence describing what this step delivers in code terms."

[tool.parameters.properties.steps.items.properties.files_touched]
type = "array"
description = "Workdir-relative paths the step will write or edit. The hollow-file gate uses this to verify real work happened."

[tool.parameters.properties.steps.items.properties.files_touched.items]
type = "string"

[tool.parameters.properties.steps.items.properties.verify_cmd]
type = "string"
description = "Shell command that exits 0 when the step is complete. Runs from workdir root. Strict verification: a step is not done until this command passes."

[tool.parameters.properties.steps.items.properties.rationale]
type = "string"
description = "Why this step before/after others. Optional but surfaces in PLAN.md."

[tool.parameters.properties.feature_id]
type = "string"
description = "Optional. The runner carries it over from any prior plan; only set on first PLAN if you know the id."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.plan_path]
type = "string"

[tool.output_schema.properties.steps]
type = "integer"

[tool.output_schema.properties.revision]
type = "integer"

[tool.output_schema.properties.feature_id]
type = "string"

[[tool.examples]]
situation = "PLAN phase: the agent has read DESIGN.md and decomposed the work into 5 steps. Emit the plan as a tool call instead of prose JSON."
call = { workdir = "/Users/me/dev/myproject", steps = [{ id = "step-01", goal = "Scaffold Cargo.toml + src/lib.rs", files_touched = ["Cargo.toml", "src/lib.rs"], verify_cmd = "cargo check", rationale = "Phase 0 skeleton must build before any types" }, { id = "step-02", goal = "Define core wire types with serde annotations", files_touched = ["src/lib.rs"], verify_cmd = "cargo check", rationale = "Phase 1: types before behaviour" }] }

[[tool]]
id = "atos_verify"
name = "ATOS step verification"
description = "Run a step's verify command and check that the agent actually modified the files it claimed to. Three gates: (1) shell verify command exits zero, (2) touched files are not empty/near-empty (hollow), (3) at least one touched file was modified after `since_unix_ts` (untouched — gate is skipped unless the caller supplies a pre-iteration timestamp). Returns passed=true only when every applicable gate passes."
effect = "readwrite"
idempotency = "nonidempotent"
latency = "slow"
scope = "session"
permissions = ["Shell"]

[tool.parameters]
type = "object"
required = ["workdir", "verify_cmd"]

[tool.parameters.properties]

[tool.parameters.properties.workdir]
type = "string"
description = "Absolute path to the project workdir"

[tool.parameters.properties.verify_cmd]
type = "string"
description = "Shell command to run (e.g. 'cargo test --test test_foo -- bar')"

[tool.parameters.properties.files_touched]
type = "array"
description = "Workdir-relative paths the step was supposed to modify"

[tool.parameters.properties.files_touched.items]
type = "string"

[tool.parameters.properties.since_unix_ts]
type = "number"
description = "Optional. Epoch seconds snapshotted before the agent ran. When set, the untouched gate fires if no file in files_touched has an mtime newer than this."

[[tool.examples]]
situation = "After implementing step-02 (define CapabilityHint enum), verify the step"
call = { workdir = "/Users/user/dev/atos-experiment-oicp-types", verify_cmd = "cargo test --test test_capability_hint -- roundtrip", files_touched = ["src/lib.rs", "tests/test_capability_hint.rs"], since_unix_ts = 1715000000 }

[[tool]]
id = "blast"
name = "Blast Radius"
description = "Compute the transitive impact of changing a symbol: all callers at every depth level up to max_depth. Use before modifying a function signature, removing a method, or changing a trait definition. Separates production callers from test callers and groups by module. Backed by the SCIP call graph — compiler-resolved, not grep. IMPORTANT: Before using on a large refactor, call read_notes(kinds=[\"reflection\"], query=\"blast_radius\") to check for known limitations recorded by previous sessions (e.g. macro-generated call sites not traversed by SCIP)."
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["symbol"]

[tool.parameters.properties]

[tool.parameters.properties.symbol]
type = "string"
description = "Symbol name to analyse (function, method, struct, trait)"

[tool.parameters.properties.max_depth]
type = "integer"
default = 3
description = "BFS depth (1=direct callers, 2=callers of callers, …). Capped at 5."

[tool.parameters.properties.max_symbols]
type = "integer"
default = 100
description = "Maximum total callers to return. Capped at 200."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.symbol]
type = "string"

[tool.output_schema.properties.depth_reached]
type = "integer"

[tool.output_schema.properties.total_callers]
type = "integer"

[tool.output_schema.properties.levels]
type = "array"

[tool.output_schema.properties.levels.items]
type = "object"

[tool.output_schema.properties.macro_hints]
type = "array"

[tool.output_schema.properties.macro_hints.items]
type = "string"

[tool.output_schema.properties.concurrent]
type = "array"
description = "Live work-atlas claims on this symbol (present-but-possibly-empty)."

[tool.output_schema.properties.concurrent.items]
type = "object"

[tool.output_schema.properties.health]
type = "string"
enum = ["ok", "stale", "missing"]

[[tool.examples]]
situation = "You're about to modify a trait or widely-used function. Call this BEFORE touching any code — it tells you exactly how many things will break and whether a refactor is a 2-file change or a 20-file change."
call = { symbol = "InferenceProvider", max_depth = 2 }

[[tool.examples]]
situation = "You want to check if a function is safe to change. A total of 0 callers means it's safe; high counts mean you need a migration strategy."
call = { symbol = "execute_step_inner" }

[[tool.examples]]
situation = "You're auditing a type for hidden macro usages (derive, register_tool!, etc.) that the call graph wouldn't capture. The macro_hints field in the response covers these."
call = { symbol = "ToolRegistry", max_depth = 1 }

[[tool]]
id = "briefing"
name = "Session Briefing"
description = "Assemble the session-orientation brief for this repo: working set (from git), live peer work-in-flight, drift posture, area principles, active decision/invariant notes, structural atoms, and recent activity — one token-budgeted markdown document. Call at session start (or after a long gap) instead of reading files to orient. Same renderer as `svrn code brief`, so hook-injected briefs and this tool never disagree."
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.strategy]
type = "string"
enum = ["recent", "branch", "explicit"]
default = "recent"
