[[tool]]
id = "test_status"
name = "Test Status"
description = "Return test suite status from the background watcher. NEVER run `cargo test` via Bash — the watcher holds the Cargo file lock continuously; running cargo test alongside it causes BOTH processes to stall indefinitely waiting for the lock. This call reads cached results in microseconds with zero contention. Response fields to trust the result: `age_seconds` — how old the result is (if 0-60s, the watcher ran on your current changes); `watched_scope` — the exact command the watcher runs (e.g. 'cargo test --workspace'), confirming which crates are covered; `watcher` — the liveness object: `{live, reason, configured, heartbeat_age_secs, hint}`. Read this FIRST. When `live` is false the result below is orphaned (the watcher isn't running to keep it current); `reason` says why (not_configured / watcher_dead / unknown) and `hint` says what to do. `watcher_active` mirrors `watcher.live` for back-compat. Status: 'fresh_passing' (all pass — safe to proceed), 'fresh_failing' (failures in response), 'stale' (files changed since last run — call run_tests then poll), 'running' (in progress — check again in 30-60s), 'watcher_down' (a completed run exists but NO live watcher — do not trust it as current; fall back to scripts/sovereign-test.sh per `watcher.hint`), 'never_run' (no run yet — see `watcher.reason`)."
effect = "read"
idempotency = "idempotent"
latency = "instant"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.status]
type = "string"
enum = ["fresh_passing", "fresh_failing", "stale", "running", "watcher_down", "never_run"]

[tool.output_schema.properties.age_seconds]
type = "integer"

[tool.output_schema.properties.pass_count]
type = "integer"

[tool.output_schema.properties.fail_count]
type = "integer"

[tool.output_schema.properties.watcher_active]
type = "boolean"

[tool.output_schema.properties.watcher]
type = "object"
description = "Watcher liveness. Read before trusting `status`. When `live` is false the run below is orphaned."

[tool.output_schema.properties.watcher.properties]

[tool.output_schema.properties.watcher.properties.live]
type = "boolean"

[tool.output_schema.properties.watcher.properties.reason]
type = "string"
enum = ["live", "not_configured", "watcher_dead", "legacy_active", "inferred_from_age", "unknown"]

[tool.output_schema.properties.watcher.properties.configured]
type = "boolean"

[tool.output_schema.properties.watcher.properties.heartbeat_age_secs]
type = ["integer", "null"]

[tool.output_schema.properties.watcher.properties.hint]
type = ["string", "null"]

[tool.output_schema.properties.watched_scope]
type = "string"

[tool.output_schema.properties.failures]
type = "array"

[tool.output_schema.properties.run_id]
type = "integer"

[tool.output_schema.properties.output_truncated]
type = "boolean"

[tool.output_schema.properties.previous_run]
type = "object"

[tool.output_schema.properties.previous_run.properties]

[tool.output_schema.properties.previous_run.properties.status]
type = "string"
enum = ["fresh_passing", "fresh_failing"]

[tool.output_schema.properties.previous_run.properties.run_id]
type = "integer"

[tool.output_schema.properties.previous_run.properties.pass_count]
type = "integer"

[tool.output_schema.properties.previous_run.properties.fail_count]
type = "integer"

[tool.output_schema.properties.previous_run.properties.exit_code]
type = "integer"

[tool.output_schema.properties.previous_run.properties.age_seconds]
type = "integer"

[tool.output_schema.properties.previous_run.properties.looks_like_compile_failure]
type = "boolean"

[tool.output_schema.properties.previous_run.properties.failures]
type = "array"

[[tool.examples]]
situation = "You've made a change and want to know if tests pass. Do NOT run `cargo test` — it contends with the background watcher for the Cargo file lock. This reads the watcher's result instantly. If status is 'stale', call run_tests to force a fresh run, then poll back here in ~30s."
call = {  }

[[tool]]
id = "write_redteam_finding"
name = "Write Red-Team Finding"
description = "Record a red-team review finding. Structured around §5.3 of the ATOS design doc — {invariant, status, evidence, confidence}. The call must be made from a `mode=redteam` driver session against a provisioned feature_id; otherwise normal-mode `write_note` is the right tool."
effect = "write"
idempotency = "nonidempotent"
latency = "instant"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["feature_id", "invariant", "status", "confidence"]

[tool.parameters.properties]

[tool.parameters.properties.feature_id]
type = "string"
description = "Feature this finding applies to. Usually $SOVEREIGN_FEATURE_ID from the driver env."

[tool.parameters.properties.invariant]
type = "string"
description = "The spec invariant being checked. Quote it from the charter verbatim."

[tool.parameters.properties.status]
type = "string"
enum = ["violated", "potentially_violated", "not_found"]
description = "Whether the invariant is violated, possibly violated, or no evidence either way was found."

[tool.parameters.properties.evidence]
type = "string"
description = "The specific symbol, file, or line that led to the finding. Empty string for `status=not_found`."

[tool.parameters.properties.confidence]
type = "string"
enum = ["high", "medium", "low"]
description = "Reviewer confidence in the status verdict."

[tool.parameters.properties.files]
type = "array"
description = "Optional: file paths the evidence points at. Drives report grouping."

[tool.parameters.properties.files.items]
type = "string"

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.id]
type = "string"

[tool.output_schema.properties.feature_id]
type = "string"

[tool.output_schema.properties.invariant]
type = "string"

[tool.output_schema.properties.status]
type = "string"

[tool.output_schema.properties.confidence]
type = "string"

[[tool.examples]]
situation = "You found that ZoteroLibrary's factory method relies on a default for `scope=Local` when the charter said the field must be set explicitly. Medium confidence — the default currently happens to be correct but a refactor could silently flip it."
call = { feature_id = "zotero-acquirer", invariant = "LocalCorpusConfig::zotero_library MUST set scope=Local explicitly, not via default.", status = "violated", evidence = "corpus-engine/src/acquirers/zotero.rs::factory() line 42 omits the field.", confidence = "medium", files = ["corpus-engine/src/acquirers/zotero.rs"] }
