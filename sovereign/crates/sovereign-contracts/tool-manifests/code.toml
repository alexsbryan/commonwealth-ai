[[tool]]
id = "symbols"
name = "Symbol Lookup"
description = "Exact lookup of a named symbol (function, struct, trait, type). Use this when you know the name of what you are looking for. Returns definition location, signature, and doc comments. Faster and cheaper than grep or file search. If you do not know the exact name, use code_search instead."
