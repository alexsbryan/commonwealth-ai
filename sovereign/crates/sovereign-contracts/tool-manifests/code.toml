[[tool]]
id = "build"
name = "Build"
description = "Return the workspace's compile/lint status from the background watcher: pass/fail summary, top 5 errors with their output, and freshness markers. NEVER run `cargo check` or `cargo build` via Bash — the watcher holds the Cargo file lock continuously; running cargo alongside it stalls both processes indefinitely. This tool reads the cached run in microseconds with zero contention. Pass `full: true` to receive untruncated output for each error (use sparingly — long failures balloon the response). Read the `watcher` object first: `{live, reason, configured, heartbeat_age_secs, hint}`. When `live` is false the result is orphaned — no watcher is running to keep it current. Status: 'fresh_passing' (clean), 'fresh_failing' (errors in response), 'stale' (files changed since last run — watcher will rerun on next save), 'running' (in progress — check again in ~15s), 'watcher_down' (a completed run exists but NO live watcher — fall back per `watcher.hint`), 'never_run' (no run yet — see `watcher.reason`)."
effect = "read"
idempotency = "idempotent"
latency = "instant"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.full]
type = "boolean"
default = false
description = "Include untruncated output for every error in the response."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.status]
type = "string"
enum = ["fresh_passing", "fresh_failing", "stale", "running", "watcher_down", "never_run"]

[tool.output_schema.properties.age_seconds]
type = "integer"

[tool.output_schema.properties.summary]
type = "object"

[tool.output_schema.properties.errors]
type = "array"

[tool.output_schema.properties.warnings]
type = "array"

[tool.output_schema.properties.stale_since]
type = "array"

[tool.output_schema.properties.watcher_active]
type = "boolean"

[tool.output_schema.properties.watcher]
type = "object"
description = "Liveness {live, reason, configured, heartbeat_age_secs, hint}. Read before trusting status."

[tool.output_schema.properties.watched_scope]
type = "string"

[[tool.examples]]
situation = "You've edited one or more files and want to know if the code still compiles."
call = {  }

[[tool.examples]]
situation = "The default response truncated an error you need to read in full."
call = { full = true }

[[tool]]
id = "callees"
name = "Find Callees"
description = "Find all functions and methods that a given symbol calls, using the SCIP symbol graph. More precise than parsing function bodies — resolves trait dispatch and method calls that body-parsing misses. Staleness is communicated in the response when the graph is not fresh. Call `sovereign corpus scip <corpus-id>` to refresh."
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["symbol"]

[tool.parameters.properties]

[tool.parameters.properties.symbol]
type = "string"
description = "Exact symbol name"

[tool.output_schema]
type = "string"
description = "Markdown list of outbound call sites, one per line, with `file:line` locations. Empty-result line when the symbol has no outbound calls or is unknown."

[[tool.examples]]
situation = "You're about to read an entire function body to understand what it calls. Don't — this returns the exact outbound call graph, including trait dispatch that reading source would miss."
call = { symbol = "handle_tools_call" }

[[tool.examples]]
situation = "You need to understand what a function depends on before refactoring it. Knowing its callees tells you what interfaces must remain stable."
call = { symbol = "run_embed_batch_sync" }

[[tool]]
id = "callers"
name = "Find Callers"
description = "Find all call sites of a given symbol in the codebase, using the SCIP symbol graph. No false positives from string matching — results are compiler-resolved. Use depth=2 to find callers of callers (impact radius). Staleness is communicated in the response when the graph is not fresh."
effect = "read"
idempotency = "idempotent"
latency = "fast"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["symbol"]

[tool.parameters.properties]

[tool.parameters.properties.symbol]
type = "string"
description = "Exact symbol name"

[tool.parameters.properties.depth]
type = "integer"
description = "Traversal depth: 1 (direct callers only) or 2 (callers of callers). Default: 1."
default = 1

[tool.output_schema]
type = "string"
description = "Markdown list of inbound call sites, one per line, with `file:line` locations. Use depth=2 to see transitive callers; response groups by depth."

[[tool.examples]]
situation = "You're about to change a function signature and want to know all callers first. Do NOT grep — grep misses trait dispatch and dynamic calls entirely, giving false confidence about blast radius."
call = { symbol = "execute_step" }

[[tool.examples]]
situation = "You're removing a method and need to verify nothing calls it. grep would miss calls through trait objects. This is compiler-resolved — if it returns empty, the method is truly uncalled."
call = { symbol = "record_call" }

[[tool.examples]]
situation = "You want to understand the full impact of changing a low-level utility. Use depth=2 to see callers of callers — the full blast radius two hops out."
call = { symbol = "embed", depth = 2 }

[[tool]]
id = "capability_findings"
name = "Capability Findings"
description = "Query the capability-reconciliation findings without re-running the pipeline. Sibling to `capability_posture` (freshness gate) and `drift_findings`. Filter by `kind` (`drifted` — docs contradict the code; `undocumented` — code does it, no doc describes it; `corroborated` — docs and code agree; `any`) and/or a `query` substring matched against the capability label + evidence. Returns matches sorted drifted → undocumented → corroborated. Reads `~/.svrnmesh/capabilities/<corpus>/capability_findings.json`; returns `never_run` if no artifact exists — check `capability_posture` for freshness before acting on results."
effect = "read"
idempotency = "idempotent"
latency = "instant"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.kind]
type = "string"
enum = ["drifted", "undocumented", "corroborated", "any"]
description = "Filter by finding kind. Default `any`."

[tool.parameters.properties.query]
type = "string"
description = "Optional substring matched against the capability label + evidence."

[tool.parameters.properties.corpus]
type = "string"
description = "Corpus id (subdir under ~/.svrnmesh/capabilities). Defaults to the only corpus when unambiguous."

[tool.parameters.properties.limit]
type = "integer"
description = "Max findings to return (default 30), sorted drifted→undocumented→corroborated."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.status]
type = "string"
enum = ["ok", "never_run", "no_matches"]

[tool.output_schema.properties.corpus_id]
type = "string"

[tool.output_schema.properties.report_path]
type = ["string", "null"]

[tool.output_schema.properties.match_count]
type = "integer"

[tool.output_schema.properties.findings]
type = "array"

[tool.output_schema.properties.findings.items]
type = "object"

[tool.output_schema.properties.findings.items.properties]

[tool.output_schema.properties.findings.items.properties.kind]
type = "string"

[tool.output_schema.properties.findings.items.properties.label]
type = "string"

[tool.output_schema.properties.findings.items.properties.entries]
type = "integer"

[tool.output_schema.properties.findings.items.properties.core_fns]
type = "integer"

[tool.output_schema.properties.findings.items.properties.evidence]
type = "string"

[tool.output_schema.properties.findings.items.properties.docs]
type = ["string", "null"]

[[tool.examples]]
situation = "List the capabilities the architecture docs don't describe."
call = { kind = "undocumented" }

[[tool.examples]]
situation = "Does the reconcile say anything about corpus_search?"
call = { query = "corpus_search", kind = "any" }

[[tool]]
id = "capability_map"
name = "Capability Map"
description = "Derive a map of what a codebase DOES — its capabilities — from the SCIP call graph. A capability is a cluster of entry points (CLI verbs, HTTP routes, tools, handlers) that share a reachable call spine. Returns a markdown inventory: multi-entry capabilities with their core functions and the shared services they lean on, plus a standalone-by-module histogram. Organized by what the system does, not by file. Deterministic, no model. Pass corpus_id to pick a code corpus; omit it when only one is indexed."
effect = "read"
idempotency = "idempotent"
latency = "slow"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.corpus_id]
type = "string"
description = "Code corpus id (an indexed repo). Optional when exactly one code corpus is indexed."

[tool.parameters.properties.provider]
type = "string"
enum = ["heuristic", "fallback"]
description = "Entry-point detection: framework-aware heuristic (default) or the universal in-degree/dispatcher fallback."
default = "heuristic"

[tool.parameters.properties.jaccard]
type = "number"
description = "Reach-set overlap threshold for clustering entry points into capabilities. Default 0.5."
default = 0.5

[tool.output_schema]
type = "string"
description = "Markdown capability inventory derived from the SCIP call graph."

[[tool.examples]]
situation = "You want a high-level map of what this codebase does, organized by capability rather than by file — the entry points and the call spines behind them. Do NOT read files one by one to reconstruct this; the call graph already knows."
call = { corpus_id = "commonwealth-ai" }

[[tool]]
