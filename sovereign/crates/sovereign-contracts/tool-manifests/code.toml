[tool.parameters.properties.files.items]
type = "string"

[tool.parameters.properties.budget_tokens]
type = "integer"
default = 1500
description = "Token budget for the rendered brief."

[tool.parameters.properties.feature_id]
type = "string"
description = "Optional ATOS feature id to scope notes."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.markdown]
type = "string"
description = "The rendered brief."

[tool.output_schema.properties.working_set_size]
type = "integer"

[tool.output_schema.properties.work_in_flight_count]
type = "integer"

[tool.output_schema.properties.strategy]
type = "string"

[tool.output_schema.properties.budget_tokens]
type = "integer"

[[tool.examples]]
situation = "Session start — orient on what changed recently and who else is active."
