[[tool]]
id = "check_doc_paths"
name = "Check Doc Paths"
description = "Scan a markdown document for inline-code path references (backtick spans like `path/to/file`) and verify each one exists on disk. Returns three buckets: `valid` (path exists), `not_found` (path missing — likely stale after a rename or deletion), and `skipped` (URL, Rust qualified name, or otherwise unresolvable). Resolution tries project root first, then the workspace root one level up (for cross-project refs), then the document's own directory. Use this to audit SYSTEM_OVERVIEW.md, SOVEREIGN.md, or any architecture doc after a directory rename, module split, or file removal."
effect = "read"
idempotency = "idempotent"
latency = "instant"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = ["doc_path"]

[tool.parameters.properties]

[tool.parameters.properties.doc_path]
type = "string"
description = "Path to the markdown file to check. Relative to project root, or absolute."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.doc_path]
type = "string"

[tool.output_schema.properties.valid]
type = "array"

[tool.output_schema.properties.valid.items]
type = "string"

[tool.output_schema.properties.not_found]
type = "array"

[tool.output_schema.properties.not_found.items]
type = "string"

[tool.output_schema.properties.skipped]
type = "array"

[tool.output_schema.properties.skipped.items]
type = "string"

[[tool.examples]]
situation = "You just renamed a module, moved a file, or deleted dead code. Run this on SYSTEM_OVERVIEW.md to find any path references that are now stale — before someone else reads a doc that points at files that no longer exist."
