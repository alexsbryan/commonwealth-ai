description = "Return the freshness state of the capability-reconciliation artifact (`sovereign enrich capability-reconcile` output) without re-running the LLM pipeline. Sibling to `drift_posture`: cheap, idempotent, no model calls. Use to decide whether the corroborated/undocumented/drifted findings you're about to cite are current against the architecture docs (SYSTEM_OVERVIEW.md + ARCH_PRINCIPLES.md by default). Status: `fresh` (every narrative hash matches the recorded fingerprint), `stale` (a narrative was edited since the last reconcile — re-run it), `partial` (fingerprint missing a requested narrative), `never_run` (no artifact yet). When present, the response carries the corroborated/undocumented/drifted counts."
effect = "read"
idempotency = "idempotent"
latency = "instant"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.corpus]
type = "string"
description = "Corpus id (subdir under ~/.svrnmesh/capabilities). Defaults to the only corpus when unambiguous."

[tool.parameters.properties.narrative]
type = "array"
description = "Override the narrative-doc set. Defaults to sovereign/SYSTEM_OVERVIEW.md + sovereign/ARCH_PRINCIPLES.md relative to the workspace root."

[tool.parameters.properties.narrative.items]
type = "string"

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

