[[tool]]
id = "note"
name = "Write Note"
description = "Persist a working note that survives across sessions. Use to record decisions, failed attempts, known invariants, and open tasks. Notes tagged with symbols or files are retrieved by read_notes when you revisit that code. Use kind='todo' for cross-session tasks — they appear in the server startup summary."
effect = "write"
idempotency = "nonidempotent"
latency = "instant"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["kind", "content"]

[tool.parameters.properties]

[tool.parameters.properties.kind]
type = "string"
enum = ["decision", "attempt", "invariant", "todo", "commitment", "follow_up", "goal"]
description = "decision=architectural choice, attempt=failed approach, invariant=must-not-break constraint, todo=open task, commitment=promise made to a named person/org (relational), follow_up=temporal marker tied to a named entity (relational), goal=declared desired outcome with success criterion (strategic)"

[tool.parameters.properties.related_entity]
type = "string"
description = "Optional free-text name of the Person, Organization, or Initiative this note is anchored to. Surfaces in the relational/strategic digest when the entity is active. Required-shape (but not enforced) for kind=commitment | follow_up | goal."

[tool.parameters.properties.content]
type = "string"
description = "The note content. Be specific enough to be useful in a future session."

[tool.parameters.properties.symbols]
type = "array"
description = "Symbol names this note relates to (for filtered retrieval)"

[tool.parameters.properties.symbols.items]
type = "string"

[tool.parameters.properties.files]
type = "array"
description = "File paths this note relates to (for filtered retrieval)"

[tool.parameters.properties.files.items]
type = "string"

[tool.parameters.properties.session_id]
type = "string"
description = "Optional session identifier (defaults to 'mcp')"

[tool.parameters.properties.scope]
type = "string"
enum = ["global", "feature", "session"]
description = "ATOS scope. Defaults to 'global'. Pass 'feature' with a feature_id to tag this note to an ATOS feature."

[tool.parameters.properties.feature_id]
type = "string"
description = "Required when scope='feature'. The id returned by provision_feature (same value as $SOVEREIGN_FEATURE_ID in the ATOS driver env)."

[tool.parameters.properties.supersedes]
type = "string"
description = "Optional id of a prior note this one REPLACES. The superseded note is auto-retired (hidden from read_notes, with a 'superseded by <id>' reason) while its row is kept for the gossip-propagated supersedes chain. Use when a new decision/invariant reverses or updates an older one, so the two don't coexist and contradict."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.id]
type = "string"

[tool.output_schema.properties.kind]
type = "string"

[tool.output_schema.properties.scope]
type = "string"

[tool.output_schema.properties.feature_id]
type = ["string", "null"]

[tool.output_schema.properties.supersedes]
type = ["string", "null"]

[tool.output_schema.properties.retired]
type = ["string", "null"]

[[tool.examples]]
situation = "You've just discovered a non-obvious constraint — something that would take another session hours to re-derive. Record it now as an invariant so it surfaces the next time anyone touches this code."
call = { kind = "invariant", content = "EmbedSlot must use n_gpu_layers=0, offload_kqv=false, and op_offload=false. The GGML Metal scheduler crashes on embedding tensor graphs (GGML_ASSERT buf_src) without all three.", symbols = ["EmbedSlot", "EmbeddedLlamaCpp"], files = ["crates/sovereign-inference/src/embedded.rs"] }

[[tool.examples]]
situation = "You chose one implementation approach over others. Record the decision and reasoning so the next session doesn't relitigate it."
call = { kind = "decision", content = "Used Mutex<HashMap> for tool call counters in ToolRegistry rather than DashMap — avoids adding a dependency to sovereign-core for a non-hot path.", symbols = ["ToolRegistry"] }

[[tool.examples]]
situation = "You tried an approach that failed in a non-obvious way. Record it so the next session skips straight to what works."
call = { kind = "attempt", content = "Tried with_split_mode(LlamaSplitMode::None) to force CPU-only for embedding — has no effect on compute graph routing. op_offload=false is required.", symbols = ["EmbedSlot"] }

[[tool]]
id = "notes"
name = "Read Notes"
description = "Retrieve working notes written by write_note. Search by keyword (FTS), filter by symbol names, file paths, or note kind. Call at session start to recover context from previous sessions, and before modifying a symbol to find related decisions or invariants. Every note carries `author` (the machine that wrote it, e.g. \"BeefyMac (peer)\") and `author_relation` (self|peer|unknown|ambiguous|unattributed). Notes about MACHINE STATE — GPU load, a held daemon lock, a running job — apply only to the machine in `author`; notes about the CODE apply everywhere regardless of who wrote them. OPERATIONAL RECORD is withheld by default: notes anchored to the anchors registered in quality/operational-anchors.toml (an open registry; today: comaintainer-seat, order-seat, directive-log) are not returned unless your `query` names the anchor, you pass `related_to`, or you set `include_operational: true` (the seat's ambient read — ordinary sessions must not set it). When any are withheld the response says how many and names the anchor. Identical-content duplicate rows (same kind/content/related_entity — e.g. the same commit-message note harvested once per corpus session) are collapsed to one representative row; when any are collapsed the response names the count (`collapsed_duplicates`)."
effect = "read"
idempotency = "idempotent"
latency = "instant"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.parameters.properties.query]
type = "string"
description = "Full-text search query. Omit to retrieve recent notes."

[tool.parameters.properties.symbols]
type = "array"
description = "Return only notes mentioning any of these symbols"

[tool.parameters.properties.symbols.items]
type = "string"

[tool.parameters.properties.files]
type = "array"
description = "Return only notes mentioning any of these file paths"

[tool.parameters.properties.files.items]
type = "string"

[tool.parameters.properties.kinds]
type = "array"
description = "Return only notes of these kinds. decision/attempt/invariant/todo: classic working notes. reflection: tool calibration notes from prior sessions. uncertainty/postmortem_pointer/redteam_finding/deviation: ATOS notes. commitment/follow_up/goal: relational + strategic notes anchored to a Person, Organization, or Initiative."

[tool.parameters.properties.kinds.items]
type = "string"
enum = ["decision", "attempt", "invariant", "todo", "reflection", "uncertainty", "postmortem_pointer", "redteam_finding", "deviation", "commitment", "follow_up", "goal", "research_finding", "capability_request", "recipe_issue", "checkpoint", "checkpoint_restored", "deferred_question", "tool_decision"]

[tool.parameters.properties.limit]
type = "integer"
default = 10
description = "Maximum number of notes to return (capped at 100)"

[tool.parameters.properties.scope]
type = "array"
description = "ATOS scope filter. Omit for legacy behavior (all scopes). Common use: scope=['global','feature'] with feature_id returns globals plus one feature's notes."

[tool.parameters.properties.scope.items]
type = "string"
enum = ["global", "feature", "session"]

[tool.parameters.properties.feature_id]
type = "string"
description = "Feature id to pair with scope=['feature']. Notes in other features are excluded."

[tool.parameters.properties.related_to]
type = "string"
description = "When set, ignore query/symbols/files and return notes related to this symbol/file/entity via the T2 entity-graph (co-occurrence ranking). Use this to discover decisions, invariants, or attempts thematically connected to a symbol even when the symbol isn't mentioned in their content."

[tool.parameters.properties.semantic]
type = "boolean"
default = true
description = "When `query` is set and the daemon's embed slot is wired, blend BM25 with cosine similarity over the note embeddings (T1 retrieval). Default on; set false to force FTS5-only behavior."

[tool.parameters.properties.include_operational]
type = "boolean"
default = false
description = "When true, skip operational-record withholding entirely: anchored records are returned like any note and nothing is reported withheld. This is the SEAT's ambient read (UC-D4 inverse) — set it only when this session owns the coordination rail. Ordinary sessions must not set it; the withheld report is what keeps seat bookkeeping out of their context."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.notes]
type = "array"

[tool.output_schema.properties.notes.items]
type = "object"

[tool.output_schema.properties.notes.items.properties]

[tool.output_schema.properties.notes.items.properties.id]
type = "string"

[tool.output_schema.properties.notes.items.properties.kind]
type = "string"

[tool.output_schema.properties.notes.items.properties.content]
type = "string"

[tool.output_schema.properties.notes.items.properties.symbols]
type = "array"

[tool.output_schema.properties.notes.items.properties.symbols.items]
type = "string"

[tool.output_schema.properties.notes.items.properties.files]
type = "array"

[tool.output_schema.properties.notes.items.properties.files.items]
type = "string"

[tool.output_schema.properties.notes.items.properties.scope]
type = "string"

[tool.output_schema.properties.notes.items.properties.feature_id]
type = "string"

[tool.output_schema.properties.notes.items.properties.created_at]
type = "integer"

[tool.output_schema.properties.notes.items.properties.session_id]
type = "string"

[tool.output_schema.properties.notes.items.properties.author]
type = "string"
description = "Machine that wrote this note, e.g. \"RuggedFox (this machine)\" or \"BeefyMac (peer)\". \"unknown origin\" when the note predates author tracking."

[tool.output_schema.properties.notes.items.properties.author_relation]
type = "string"
enum = ["self", "peer", "unknown", "ambiguous", "unattributed"]
description = "Machine-readable form of `author`. Only \"self\" means this note was written on the machine now reading it — treat notes about machine state (GPU load, held locks, running jobs) as applying ONLY to the machine named in `author`."

[tool.output_schema.properties.total]
type = "integer"

[[tool.examples]]
situation = "You're starting work on a symbol and want to know if any previous session recorded a decision, invariant, or failed attempt about it. Do this BEFORE reading code — it can save you from re-discovering constraints the hard way."
