id = "retire_note"
name = "Retire Note"
description = "Retire a working note by its ID: hide it from read_notes without deleting the row (its history and supersedes chain are kept). Use when a note is no longer true but you want a durable record of why. Prefer this over delete_note. The hide is PEER-CONVERGING: retire also tombstones the note, which is the event peers gossip, so a retired note disappears from other machines' reads too (UC-D1). Note: write_note with 'supersedes' already retires the superseded note automatically — call this only for a note that is stale with no replacement."
effect = "write"
idempotency = "idempotent"
latency = "instant"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["id", "reason"]

[tool.parameters.properties]

[tool.parameters.properties.id]
type = "string"
description = "The note ID to retire (from write_note or read_notes)."

[tool.parameters.properties.reason]
type = "string"
description = "Why the note is retired (e.g. 'fixed in PR #88', 'the gate was removed'). Stored as retired_by and shown in history views."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.retired]
type = "boolean"

[tool.output_schema.properties.tombstoned]
type = "boolean"
description = "Always true on success — the peer-converging hide (UC-D1)."

[tool.output_schema.properties.id]
type = "string"

[[tool.examples]]
situation = "A prior invariant note no longer holds because the constraint was removed, and there's no single replacement note to supersede it with. Retire it with the reason so future sessions see why it's gone."
call = { id = "note_abc123", reason = "the native-grammar path was deleted; this no longer applies" }

[[tool]]
id = "run_tests"
name = "Run Tests"
description = "Force an immediate test run, cancelling any in-progress run. Returns immediately — do NOT block waiting for results. Call test_status after ~30-60s to check progress; call again until status is no longer 'running'. Only needed when test_status is 'stale' and you need a guaranteed fresh result (before a commit, after a targeted fix). The file watcher triggers runs automatically on changes — run_tests is only for when you want to force ahead of the watcher's debounce."
effect = "write"
idempotency = "idempotent"
latency = "instant"
scope = "session"
permissions = []

[tool.parameters]
type = "object"
required = []

[tool.parameters.properties]

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.triggered]
type = "boolean"

[tool.output_schema.properties.run_id]
type = "integer"

[tool.output_schema.properties.message]
type = "string"

[[tool.examples]]
situation = "test_status returned 'stale' and you need a guaranteed fresh result before proceeding. Trigger this, then wait ~30-60s and poll test_status. Do NOT run `cargo test` directly."
call = {  }

[[tool]]
id = "session_reflection"
name = "Session Reflection"
description = "Call this when a significant task is complete — a refactor lands, a bug is fixed, a feature is implemented. Record which tools helped, what you had to do manually that a tool should have handled, and what information would have saved steps if you had it earlier. This data surfaces to the developer as a product improvement backlog and is available to future agent sessions as tool calibration. Be specific — vague reflections are not useful. Future sessions can read these via: read_notes(kinds=[\"reflection\"], query=\"<tool_name>\")."
effect = "write"
idempotency = "nonidempotent"
latency = "instant"
scope = "persistent"
permissions = []

[tool.parameters]
type = "object"
required = ["task_summary"]

[tool.parameters.properties]

[tool.parameters.properties.task_summary]
type = "string"
description = "One-sentence description of what was accomplished."

[tool.parameters.properties.tool_name]
type = "string"
description = "The primary tool this reflection concerns (if any). Used as the grouping key in sovereign reflect output."

[tool.parameters.properties.tools_that_helped]
type = "array"
description = "Tool IDs that made the task faster or easier."

[tool.parameters.properties.tools_that_helped.items]
type = "string"

[tool.parameters.properties.manual_work_that_should_be_a_tool]
type = "string"
description = "Describe work you did manually (grep, file reads, etc.) that a tool should have handled. Be specific about what was missing."

[tool.parameters.properties.misleading_outputs]
type = "string"
description = "Describe any tool output that was incorrect, incomplete, or led you down the wrong path."

[tool.parameters.properties.wished_i_had_known]
type = "string"
description = "Information that would have saved steps if available at the start of the task."

[tool.output_schema]
type = "object"

[tool.output_schema.properties]

[tool.output_schema.properties.recorded]
type = "boolean"

[tool.output_schema.properties.id]
type = "string"

[[tool.examples]]
situation = "You just fixed a bug where a tool gave you incomplete or wrong information — record exactly what it missed so the developer can improve it and future sessions know to work around it."
call = { task_summary = "Fixed GGML_ASSERT crash in embedding context on Metal", tool_name = "code_search", tools_that_helped = ["find_callers", "symbol_lookup"], manual_work_that_should_be_a_tool = "Had to read llama-context.cpp source directly to find op_offload parameter — no tool surfaces llama.cpp context param semantics", wished_i_had_known = "op_offload=true (the default) routes compute ops to Metal even when n_gpu_layers=0. All three flags must be set: n_gpu_layers=0, offload_kqv=false, op_offload=false." }

[[tool.examples]]
situation = "A refactor touched many files and you want to record which tools were accurate, which were stale, and what you had to do by hand — so the next session starts calibrated."
call = { task_summary = "Wired IndexHealthChecker into all 6 MCP tools", tools_that_helped = ["blast_radius", "find_callers", "symbol_lookup"], misleading_outputs = "rust-analyzer diagnostics showed stale errors after edits — confirmed by reading file that the fixes were already applied", manual_work_that_should_be_a_tool = "Had to grep for all NodeCapabilities struct literal sites across 17 files after adding a field — blast_radius only covers call graph, not struct initialization sites" }

