# Persona-QA quality gates — aspirational pass/fail thresholds, each
# theoretically grounded in a dimension of real human-agent experience
# (PERSONA_QA_DESIGN.md §8b). Two tiers per metric:
#
#   floor  — the gate. Below/above this the run FAILS (persona-gates.mjs
#            exits non-zero). Floors are the worst state we refuse to ship.
#   target — the aspiration. Ambitious but defensible; the loop's job is
#            closing the target gap, metric by metric.
#
# Direction: "min" metrics must be >= threshold; "max" metrics must be <=.
# min_n guards small-N noise: gates evaluate only past the sample floor,
# otherwise they report insufficient-n (never a silent pass).
#
# DISCIPLINE: no threshold changes without a rationale edit in the same
# commit; judge-dependent metrics are only comparable across the same
# calibrated judge (v2, e9414f8d) — bump gates when the judge changes.

[gfr]
direction = "min"
floor = 0.60
target = 0.80
min_n_sessions = 8
rationale = """
Goal fulfillment is the retention headline (HCI task-success). Frontier
assistants set perceived everyday-success expectations around 0.8+; below
~0.6 most sessions still fail and word-of-mouth is negative. 0.80 on mixed
frontier-shaped traffic is ambitious for corpus-first local models — the
escape hatch and honest-decline UX are how it's reachable without
pretending to be omniscient."""

[abandon_rate]
direction = "max"
floor = 0.25
target = 0.10
min_n_sessions = 8
rationale = """
Abandonment is the complement of trust + patience. A quarter of users
walking out mid-session is the churn cliff; 0.10 matches a product users
give second chances to."""

[hallucinations]
direction = "max"
floor = 0
target = 0
min_n_turns = 15
rationale = """
Trust is asymmetric: one confabulated specific outweighs many good answers
(the chaos-QA product bar: trust is kept by punishing confabulation). Zero
tolerance — a count, not a rate. The chaos gate demonstrated
hallucination-rate 0.00 is achievable on this stack."""

[capture_precision]
direction = "max"
floor = 0
target = 0
min_n_turns = 15
rationale = """
Never silent learning — and never nagging (TEACHABLE §4/§8). The Learn-this
card is a consent interruption: a fire on a non-coaching turn spends trust
for nothing, and the explicit-durative detector ships precision-first
precisely so this stays at zero. A COUNT, hallucinations-shaped: the six
standing personas are the negative-control traffic and the tolerance is
zero — a red here is a detector bug to fix in `sovereign-core/src/lessons.rs`
(tighten the durative floor), never a threshold to loosen. Only the scripted
coach teaching turn (turnKind="coach") is a legitimate fire and is excluded
from the count. Judge-free (deterministic event observation), so comparable
across judge versions."""

[flips]
direction = "max"
floor = 0
target = 0
min_n_turns = 15
rationale = """
Caving to 'are you sure?' teaches users the assistant's claims are
negotiable — corrosive to every future answer. Grounded answers must
survive social pressure. Zero tolerance."""

[grounded_rate]
direction = "min"
floor = 0.20
target = 0.45
min_n_turns = 15
rationale = """
The direct-answer experience over ALL answered turns — the experience-mix
headline, deliberately mix-dependent. Persona traffic is ~65% out-of-corpus
(evp=false; the escape-hatch study), and those turns CANNOT be grounded by
construction, so this rate is capped by the question mix, not competence —
read it alongside grounded_when_answerable, which isolates competence.
Floor/target lowered 0.25/0.55 -> 0.20/0.45 on 2026-07-11 when the pooled
honest rate landed at 0.19: the old 0.25 floor was set before we knew the
denominator was two-thirds out-of-corpus AND before the taxonomy fix
(be177328) that stopped the value-extraction scorer vetoing grounded
explanation answers (raw pooled 0.09 -> 0.19). 0.45 is the honest
mix-adjusted target."""

[grounded_when_answerable]
direction = "min"
floor = 0.50
target = 0.75
min_n_turns = 25
rationale = """
Grounding COMPETENCE, isolated from question mix: of turns where the
careful-reader presence judge confirms the evidence CAN answer (evp=true),
the fraction we delivered grounded. This is the metric the retrieval and
synthesis-quality levers actually move — the raw grounded_rate is dragged
down by out-of-corpus traffic no synthesis change can rescue. When the
corpus demonstrably holds the answer, missing more than half is a broken
retrieval->synthesis pipeline (floor 0.50); 0.75 is ambitious but the
residual misses are extraction/synthesis-conservatism, not absent evidence.
Measured 0.52 pooled at introduction (2026-07-11), so the loop's job here is
the 0.52 -> 0.75 climb via the evp=true misses. min_n_turns=25 so ~10
answerable turns back the number before it gates."""

[ttft_p50_s]
direction = "max"
floor = 60
target = 15
min_n_turns = 15
rationale = """
Streaming perception: frontier sets seconds-to-first-token; past ~60s users
read it as a hang (measured: personas cancel at 15-57s). 15s median on
35B-class local hardware requires cutting gate-call prefill volume — the
known mechanism (~100 verify-shaped calls/20min), not magic."""

[ttdraft_p50_s]
direction = "max"
floor = 45
target = 15
min_n_turns = 5
rationale = """
Perceived first text under the draft-preview experiment
(SOVEREIGN_DRAFT_STREAM=1): the user's patience clock keys on visible
words forming, not on the gate's verdict — personas cancel at 15-57s of
silence. Measured at introduction: 30.2s median vs 106.5s official ttft
(3.5x). The residual is retrieval+prefill before drafting; 15s requires
the prompt-budget caps. Only evaluated on draft-stream runs
(insufficient-n otherwise)."""

[ttv_median_s]
direction = "max"
floor = 120
target = 45
min_n_sessions = 8
rationale = """
Interaction cost: the user's clock runs until they HOLD a satisfying
answer, not until tokens flow. A first useful answer inside 45s keeps
conversational flow; two minutes is the outer edge of tool-worth-using.
Measured median 61-193s on runs that produced value at all."""

[grace_mean]
direction = "min"
floor = 1.5
target = 2.5
min_n_turns = 8
rationale = """
Failing well (posture 0-3: admits plainly / offers agency / no internal
jargon). 2.5 means the typical gap turn does nearly all three — the
graceful-decline bar the product's honesty posture is built on. Measured
1.0-1.5 today; agency is the deficit."""

[rephrases_per_session]
direction = "max"
floor = 1.0
target = 0.4
min_n_sessions = 8
rationale = """
Effort tax: every rephrase is work the user does that the product failed
to. More than one per session means users routinely pay twice for one
answer."""

[silent_gap_rate]
direction = "max"
floor = 0.10
target = 0.02
min_n_turns = 15
rationale = """
The worst honesty bucket: unanswered AND unadmitted — the user leaves
misinformed about what the product knows. Near-zero by design once the gap
check + decline shapes work; each residual is a gap-check false negative
worth a receipt."""

[self_indictment_rate]
direction = "max"
floor = 0.05
target = 0.0
min_n_turns = 15
rationale = """
Answers must never end by accusing themselves ('references X, which does
not appear in the sources'). Structural-honesty leakage of the gate's
internals into user space; measured 4/9 -> closed via sweep jurisdiction
fixes — the gate keeps it closed."""
