[package]
name = "sovereign-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
sovereign-core = { workspace = true }
sovereign-inference = { workspace = true }
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true }
sovereign-mesh = { workspace = true }
corpus-engine = { workspace = true, features = ["treesitter"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
walkdir = "2"
dirs = "6"
hostname = { workspace = true }
# Used only by friendly_names.rs — entropy seed for the
# adjective+mascot generator. Workspace already pins this for
# commonwealth crates; keeping the same major.
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Used only by bootstrap.rs tests — stand up a tiny axum server so we
# can assert `is_daemon_live` correctly accepts an OpenAI-compatible
# responder and rejects an arbitrary HTTP server that happens to own
# the port.
axum = { workspace = true }
