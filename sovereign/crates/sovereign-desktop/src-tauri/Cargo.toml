[package]
name = "sovereign-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sovereign-core = { workspace = true }
sovereign-contracts = { workspace = true }
# The one client family for the daemon's wire (sv-one-client). Attach mode
# routes conversation search / memory / insight surfaces through it rather
# than re-deriving local deciders (sv-surface rung 6).
# `bundled-backend` is the desktop's half of sv-surface's
# `sv-no-daemon-management` bar: this build SHIPS a daemon (the
# `sovereign-cli-daemon` Tauri sidecar, staged by
# `scripts/stage-daemon-sidecar.sh` and declared in
# `tauri.release.conf.json`), so `ServingHost` may bring one up when nothing
# answers. Declaring it here is what flipped the DEFAULTS_LEDGER row out of
# DARK. It gates code only — no dependency hangs off it, so it cannot move a
# dependency edge.
sovereign-turn-client = { workspace = true, features = ["bundled-backend"] }
# The enrichment store the CLI and the daemon also read — `enrich_commands`
# lists it rather than re-deriving the layout and the schema (rung
# nc-16-shared-capability).
sovereign-enrichment-catalog = { workspace = true }
sovereign-inference = { workspace = true }
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true, features = ["treesitter"] }
sovereign-gliner = { workspace = true }
# Workflow authoring parity: the recipe-author workspace commands validate a
# workflow project's TOML via `Workflow::parse` (the same way they validate a
# recipe via `Recipe::from_toml`). Core-only crate — no inference/tool deps.
sovereign-workflow = { workspace = true }
# The workflow-author tool bundle (workflow_write/_structured/validate/test) the
# desktop runtime registers so a Workflow-kind project's chat can compose a
# workflow. Same agent loop as recipe authoring; only the tools + skill differ.
sovereign-workflow-host = { workspace = true }
# THE shared commissioning recipe. The desktop composes its tool bundles and
# hands its host inputs over rather than building a router, a registry and a
# lane of its own (TOPOLOGY §10 phase 7).
sovereign-runtime-recipe = { workspace = true }
# Explorer graph ops (atlas/investigation projections) — the meshapp Tauri
# commands are thin wrappers over this shared lib.
sovereign-meshapp = { workspace = true }
# `sovereign-cli-daemon` and `sovereign-compute` LEFT HERE at svt-2
# (2026-09-11). The desktop used to link the daemon entry as a library so
# `--daemon-child` could run the real daemon in this process, and the
# child-process supervisor so it could parent one. Both roles are gone:
# `main.rs` refuses every daemon argv form with `NOT_A_DAEMON`, and the
# daemon this app talks to is the Tauri SIDECAR, built as a separate binary
# by `scripts/stage-daemon-sidecar.sh`. Do not re-add either to reach a type
# — that is the dependency edge `cargo xtask layer-gate` exists to hold.
sovereign-mesh = { workspace = true, features = ["treesitter"] }
# `commonwealth-core` and `commonwealth-state` LEFT HERE at svt-3 chunk 3
# (2026-09-11). The Mesh Health surfaces — peer preferences and dimensional
# contributions — used to reach the in-process AppState's accessors directly,
# which meant the desktop held commonwealth's own types to spell a NodeId.
# Both now ask the daemon: `/internal/contribution/view` and
# `/internal/peer-preference/{set,clear,list}`, through `TurnClient`. The
# peer-preference route was the LAST thing holding these two.
corpus-engine = { workspace = true, features = ["treesitter"] }
sovereign-authoring-harness.workspace = true
corpus-engine-notes = { workspace = true }
corpus-engine-scip = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
# Auto-update via signed manifest. Endpoint configured in tauri.conf.json
# (`plugins.updater.endpoints`); the manifest is served from the landing
# site at svrnme.sh, which queries GitHub Releases for the latest desktop-v*
# tag. See RELEASING.md §"Auto-updates" for the keypair + secret setup.
tauri-plugin-updater = "2"
reqwest = { workspace = true, features = ["stream"] }
arc-swap = { workspace = true }
futures = { workspace = true }
walkdir = "2"
dirs = "6"
# Free-disk probe for the user-facing health check (commands/diagnostics.rs).
# Same major as commonwealth-discovery so no extra version enters the tree.
sysinfo = "0.35"
# Settings → Imports unzips Anthropic export archives into the
# `conversations-anthropic` canonical landing path before triggering
# install. Matches corpus-engine + sovereign-tools workspace pin —
# deflate-only mirrors the shipping zip variant Anthropic produces.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Provenance-preserving PDF export (`commands::export_answer`). Already in
# the lockfile transitively (pdf-extract) — promoted to a direct dep so the
# narrow answer+ledger PDF renderer can use it; no new crate, no system lib.
lopdf = "0.34"
# Used by `recipe_commands::corpus_import_recipe` to record a
# tamper-evident sha256 alongside each imported recipe in the
# user's local registry.
sha2 = { workspace = true }
hostname = { workspace = true }
# Used only by friendly_names.rs — entropy seed for the
# adjective+mascot generator. Workspace already pins this for
# commonwealth crates; keeping the same major.
rand = "0.8"
# Command bridge (src/command_bridge.rs) — debug-only loopback HTTP
# surface for the Playwright real-mode harness. The module is gated
# `#[cfg(debug_assertions)]` + SOVEREIGN_COMMAND_BRIDGE=1 at runtime;
# the deps compile in release but the code path is unreachable there.
axum = { workspace = true }
tower-http = { workspace = true }

[features]
# Default-on. Forwards to sovereign-tools so the `#[cfg(feature =
# "paddle-ocr")]` gates in src/local_corpus_commands.rs are meaningful —
# a desktop-local `#[cfg]` keys off THIS crate's features, not the dep's,
# so without this forwarding feature the paddle OCR branch would silently
# compile out. `--no-default-features` drops paddle and falls back to the
# tesseract path.
default = ["paddle-ocr"]
paddle-ocr = ["sovereign-tools/paddle-ocr"]

# Windows GPU backend selectors — forwarded to sovereign-inference, passed by
# the release matrix's Windows GPU legs (`cargo tauri build --features ...`).
# No-op on macOS/Linux (which hardcode their backend per-OS). See
# sovereign-inference/Cargo.toml for the backend matrix.
windows-vulkan = ["sovereign-inference/windows-vulkan"]
windows-cuda = ["sovereign-inference/windows-cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# bootstrap.rs tests stand up a tiny axum server to assert
# `is_daemon_live` accepts an OpenAI-compatible responder and rejects
# an arbitrary HTTP server on the port; axum is now a regular dep
# (command bridge) so no dev-dep entry is needed.
# Used by enrich_commands.rs tests for isolated tempdir fixtures
# (JSONL synthesizer smoke + future filesystem-touching tests).
tempfile = "3"
# Parses the `#[tauri::command]` surface for tests/command_surface.rs, which
# generates the typed frontend bridge. Dev-only: no runtime cost, and the
# commands carry no doc-gen derives.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"

[lints]
workspace = true
