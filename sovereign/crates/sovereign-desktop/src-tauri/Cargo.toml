[package]
name = "sovereign-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `sovereign-core` LEFT HERE at svt-7 (2026-09-12), and with it the LAST of
# the six. What it had been reduced to was contracts re-exports worn under the
# core name plus ONE real thing: `models_manifest::{SlotConfig,
# DEFAULT_MANIFEST}` — the bundled `models.toml`, read to render the setup
# picker and to derive an embedding model's query-instruction prefix. Both
# belonged to whoever loads the weights. `SlotConfig` moved DOWN to
# `sovereign_contracts::daemon_wire::setup_plan` (5d6d0a4d8), the catalog is
# `GET /v1/admin/setup/catalog` or `svrn setup --plan --json`, and the
# query-prefix derivation went with the provider that used it — a
# `SplitInferenceProvider` filling a slot NOTHING read (`state.rs`).
sovereign-contracts = { workspace = true }
sovereign-time = { workspace = true }
sovereign-tools-base = { workspace = true }
# The one client family for the daemon's wire (sv-one-client). Attach mode
# routes conversation search / memory / insight surfaces through it rather
# than re-deriving local deciders (sv-surface rung 6).
# `bundled-backend` is the desktop's half of sv-surface's
# `sv-no-daemon-management` bar: this build SHIPS a daemon (the
# `sovereign-cli-daemon` Tauri sidecar, staged by
# `scripts/stage-daemon-sidecar.sh` and declared in
# `tauri.release.conf.json`), so `ServingHost` may bring one up when nothing
# answers. Declaring it here is what flipped the DEFAULTS_LEDGER row out of
# DARK. It gates code only — no dependency hangs off it, so it cannot move a
# dependency edge.
sovereign-turn-client = { workspace = true, features = ["bundled-backend"] }
# `sovereign-inference` LEFT HERE at svt-7 (2026-09-12). Its 38 use sites were
# three jobs, each of which had an owner on the other side of the wire:
# `hardware::{detect_hardware, select_profile}` + `setup_planner::{
# build_primary_catalog, resolve_slot, hf_download_url}` answered "what can
# this machine run and what should it fetch" — which is the SERVING machine's
# question, now `GET /v1/admin/{hardware,setup/catalog,setup/slot}` and, before
# a daemon exists, a SPAWN of the sidecar's own `svrn setup --plan --json`
# (`src/setup_plan.rs`); `setup_planner::download_gguf` wrote into a models
# root this process does not own, now `POST /v1/admin/assets/download`; and
# `remote::SplitInferenceProvider` filled `AppState.inference`, a slot with
# zero readers. `fast_exit_skip_destructors` went with the C++ it existed to
# protect — no llama.cpp is linked here, so there are no static destructors to
# skip (`main.rs`, the `RunEvent` closure).
# `sovereign-store` LEFT HERE at thin-desktop R2 (2026-09-12). The app opened
# its OWN `SqliteStateStore` over `config.data_dir/sovereign.db` — a second
# opener beside the daemon's, running migrations on a data root it does not
# own, and on an attached boot a different file from the one every turn since
# sv-surface R5 has been written to. Five readers, five routes:
# `GET /v1/conversations/{id}` (widened with `enabled_corpora`, the field that
# had kept the store alive), `POST /v1/conversations/{id}/messages/record`
# (twice: `search_web`, `explore_insights`), `GET /v1/admin/chat-activity`,
# and the correction hint now riding `enrich/reenrich-note`. The crate is
# still REACHED transitively via `sovereign-gliner` and `sovereign-tools`
# (`cargo tree -p sovereign-desktop -i sovereign-store`), so its
# `[[exception]]` row in quality/ARCH_LAYERS.toml stands — the direct edge is
# what this rung cut, and `attach_construction_census.rs` pins the absence.
# `sovereign-tools` LEFT HERE at svt-6 (2026-09-12), and `corpus-engine` +
# `sovereign-authoring-harness` with it. What held all three was ONE thing
# wearing three names: a full in-process `CorpusEngine` whose builder chain
# paired `.with_*` for `.with_*` against the daemon's own
# (`sovereign-cli-daemon/src/daemon_cmd/bootstrap.rs:276-296`), over the same
# `~/.svrnmesh/{recipes,indexes}` root. `sovereign-tools` supplied its embed /
# batch-embed / inference adapters, its tiered-enrichment provider and its
# `sec_edgar` acquirer; `sovereign-authoring-harness` supplied the verdict
# ladder the recipe panel rendered. Four of the engine's five boot chores were
# the daemon's already and were deleted; the fifth (the vector-index readiness
# sweep) MOVED to the daemon's bootstrap; the one surface only it served —
# recipe validate / test / harness — is `POST /internal/corpus/recipes/test`
# and `POST /internal/corpus/recipes/harness` (`sovereign_mesh::recipe_http`).
# The fifteen `local_corpus` DTOs the app still spells moved DOWN to
# `sovereign_contracts::daemon_wire::local_corpus` rather than being reached
# through here. `attach_construction_census.rs` pins the absence of the
# constructions; `[thin_surfaces].may_not_reach` in quality/ARCH_LAYERS.toml
# pins the absence of the reach, and it is reachability over `cargo tree`, so
# a type reached through one of these is a red gate and not a shortcut.
# `sovereign-gliner` LEFT HERE at svt-7 (2026-09-12). Two call sites, both in
# `atlas_commands.rs`: a filesystem probe for the GLiNER export under
# `models_root()`, and a downloader that wrote there. The extractor loads in
# the DAEMON and that root is under the data dir the daemon owns, so both
# crossed — `GET /internal/ner/model` and the `kind: "gliner"` arm of
# `POST /v1/admin/assets/download`. The probe also stopped asking about a
# constant: the daemon answers for the id IT is configured to load
# (`SOVEREIGN_GLINER_MODEL_ID`), which the app had no way to know.
#
# With these three lines gone, `cargo tree -p sovereign-desktop -e normal`
# reaches none of corpus-engine, sovereign-core, sovereign-inference,
# sovereign-store, sovereign-tools or sovereign-gliner, and every
# `from = "sovereign-desktop"` row left quality/ARCH_LAYERS.toml.
# `sovereign-workflow-host`, `sovereign-runtime-recipe` and `sovereign-mesh`
# LEFT HERE at svt-3 (2026-09-11), with `corpus-engine-scip` and `arc-swap`
# below. The runtime recipe and the workflow-author bundle went when the app
# stopped commissioning a Runtime (svt-3b); the last thing holding the other
# two was NAMING their wire shapes — `workflow_http::{RunRequest, JobResponse,
# …}` and `mesh_http::{StatusResponse, KnownMeshDto}`, `types::{MeshStatus,
# …}` — which now live in `sovereign_contracts::daemon_wire` (both crates
# re-export them). The two reads that were not a type moved to the daemon:
# invite preview is `POST /v1/mesh/join/preview`, the node id comes from
# `GET /status`. `[thin_surfaces].may_not_reach` in quality/ARCH_LAYERS.toml
# is reachability over `cargo tree`, so a type reached through one of these
# is a red gate, not a shortcut.
# Explorer graph ops (atlas/investigation projections) — the meshapp Tauri
# commands are thin wrappers over this shared lib.
# `sovereign-cli-daemon` and `sovereign-compute` LEFT HERE at svt-2
# (2026-09-11). The desktop used to link the daemon entry as a library so
# `--daemon-child` could run the real daemon in this process, and the
# child-process supervisor so it could parent one. Both roles are gone:
# `main.rs` refuses every daemon argv form with `NOT_A_DAEMON`, and the
# daemon this app talks to is the Tauri SIDECAR, built as a separate binary
# by `scripts/stage-daemon-sidecar.sh`. Do not re-add either to reach a type
# — that is the dependency edge `cargo xtask layer-gate` exists to hold.
# `commonwealth-core` and `commonwealth-state` LEFT HERE at svt-3 chunk 3
# (2026-09-11). The Mesh Health surfaces — peer preferences and dimensional
# contributions — used to reach the in-process AppState's accessors directly,
# which meant the desktop held commonwealth's own types to spell a NodeId.
# Both now ask the daemon: `/internal/contribution/view` and
# `/internal/peer-preference/{set,clear,list}`, through `TurnClient`. The
# peer-preference route was the LAST thing holding these two.
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
# Auto-update via signed manifest. Endpoint configured in tauri.conf.json
# (`plugins.updater.endpoints`); the manifest is served from the landing
# site at svrnme.sh, which queries GitHub Releases for the latest desktop-v*
# tag. See RELEASING.md §"Auto-updates" for the keypair + secret setup.
tauri-plugin-updater = "2"
reqwest = { workspace = true, features = ["stream"] }
futures = { workspace = true }
walkdir = "2"
dirs = "6"
# Free-disk probe for the user-facing health check (commands/diagnostics.rs).
# Same major as commonwealth-discovery so no extra version enters the tree.
sysinfo = "0.35"
# Settings → Imports unzips Anthropic export archives into the
# `conversations-anthropic` canonical landing path before triggering
# install. Matches corpus-engine + sovereign-tools workspace pin —
# deflate-only mirrors the shipping zip variant Anthropic produces.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Provenance-preserving PDF export (`commands::export_answer`). Already in
# the lockfile transitively (pdf-extract) — promoted to a direct dep so the
# narrow answer+ledger PDF renderer can use it; no new crate, no system lib.
lopdf = "0.42"
# Used by `recipe_commands::corpus_import_recipe` to record a
# tamper-evident sha256 alongside each imported recipe in the
# user's local registry.
sha2 = { workspace = true }
hostname = { workspace = true }
# Used only by friendly_names.rs — entropy seed for the
# adjective+mascot generator. Workspace already pins this for
# commonwealth crates; keeping the same major.
rand = "0.10"
# Command bridge (src/command_bridge.rs) — debug-only loopback HTTP
# surface for the Playwright real-mode harness. The module is gated
# `#[cfg(debug_assertions)]` + SOVEREIGN_COMMAND_BRIDGE=1 at runtime;
# the deps compile in release but the code path is unreachable there.
axum = { workspace = true }
tower-http = { workspace = true }

[features]
# The `paddle-ocr` forward stood here and is GONE (svt-6). Its whole job was
# to make a `#[cfg(feature = "paddle-ocr")]` gate in
# src/local_corpus_commands.rs meaningful — and there is no such gate: `grep
# -rn 'cfg(feature' src-tauri/src` finds ZERO hits, and had before this
# commit. It forwarded to a dependency this crate no longer has, for a
# conditional that no longer exists. The OCR decision belongs to whoever runs
# the extractor, which is the daemon.

# The `windows-vulkan` / `windows-cuda` forwards stood here and are GONE
# (svt-7). They forwarded to `sovereign-inference`, which this crate no longer
# has — and they were selecting a GPU backend for a process that loads no
# models. The selection belongs to the build of the thing that does: the
# SIDECAR. `scripts/stage-daemon-sidecar.sh` passes them to the
# `sovereign-cli-daemon` build, and the release matrix's Windows GPU legs pass
# `SOVEREIGN_SIDECAR_FEATURES` to that script rather than
# `cargo tauri build --features windows-vulkan`.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# bootstrap.rs tests stand up a tiny axum server to assert
# `is_daemon_live` accepts an OpenAI-compatible responder and rejects
# an arbitrary HTTP server on the port; axum is now a regular dep
# (command bridge) so no dev-dep entry is needed.
# Used by enrich_commands.rs tests for isolated tempdir fixtures
# (JSONL synthesizer smoke + future filesystem-touching tests).
tempfile = "3"
# Parses the `#[tauri::command]` surface for tests/command_surface.rs, which
# generates the typed frontend bridge. Dev-only: no runtime cost, and the
# commands carry no doc-gen derives.
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"

[lints]
workspace = true
