[package]
name = "sovereign-inference"
version.workspace = true
edition.workspace = true

[dependencies]
sovereign-core = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
sysinfo = "0.34"
encoding_rs = "0.8"
tracing = { workspace = true }
tokio-stream = "0.1"
reqwest = { workspace = true, features = ["stream"] }
# Parallel logit-mask in `json_constraint::mask`. Any model with a
# large vocab (Gemma-3-E4B ≈ 262K, Qwen3 ≈ 152K, Llama-3 ≈ 128K)
# pays a per-candidate validator cost on every generated token;
# running it serially on one core was the dominant Phase-1 latency.
rayon = "1.10"

# llama.cpp's GPU backend is picked per-OS. Linux uses Vulkan because
# ROCm crashes in `ggml_cpu_extra_work_size` during Qwen3-A3B MoE
# inference on gfx1151 — a secondary CPU SEGV after a primary GPU
# memory fault. Upstream regression tracked at
# https://github.com/ggml-org/llama.cpp/issues/20176 (introduced by
# PR #20087); maintainer-acknowledged workaround in #19880 is to use
# the Vulkan backend, which is GPU-accelerated on the same hardware
# and bypasses the buggy ROCm+MoE path entirely. Revisit once #20176
# lands a fix in a llama-cpp-2 release we can pin to.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.145", features = ["metal", "llguidance"] }
# Direct dep on the -sys crate to access the `llama_flash_attn_type`
# enum constants. llama-cpp-2's `with_flash_attention_policy` takes
# `llama_cpp_sys_2::llama_flash_attn_type` as its argument type but
# doesn't re-export the enum, so callers need their own path to it.
llama-cpp-sys-2 = "0.1.145"

[target.'cfg(target_os = "linux")'.dependencies]
# NOTE: temporarily on "rocm" to keep host-side `cargo build` working
# (this shell can't enter the sovereign-vulkan toolbox where the Vulkan
# SDK lives). Flip to "vulkan" when restarting the daemon for SEP-grade
# inference workloads — see issue #20176 commentary above.
llama-cpp-2 = { version = "0.1.145", features = ["vulkan", "llguidance"] }
llama-cpp-sys-2 = "0.1.145"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "complete"

[[example]]
name = "bench_embed"

[[example]]
name = "bench_decode"

[[example]]
name = "grammar_smoke"

[[example]]
name = "sd_smoke"
