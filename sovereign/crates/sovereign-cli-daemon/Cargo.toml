[package]
name = "sovereign-cli-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Long-running daemon + setup + service install binary."

# Sibling binary that owns the daemon's lifecycle:
#   sovereign daemon start/stop/status/...   — managed daemon
#   sovereign setup                          — hardware + model planner
#   sovereign install-service                — launchd / systemd register
#   sovereign doctor                         — health check + integrity probe
#
# Since the de-embed (docs/FIVE_PROGRAMS.md §11 step 10) `daemon run`
# itself execs the `sovereign-daemon` sibling binary (src/daemon_bin.rs);
# this crate keeps the verb surface, the wizard, and the pidfile plumbing.
#
# Lives apart from sovereign-cli-dev (workspace tooling) and
# sovereign-cli-llm (model interaction) because the daemon binary
# has a very different cadence: it's the long-running host process,
# rarely-edited setup code, and a `doctor` that pokes the SCIP graph
# integrity. Cracking these out keeps the workbench binary
# (sovereign-cli-dev) free of the setup-planner + launchd glue and
# means a daemon restart doesn't force a workbench rebuild.

[[bin]]
name = "sovereign-cli-daemon"
path = "src/main.rs"

[dependencies]
sovereign-core = { workspace = true }
# OS service registration (launchd / systemd / Task Scheduler). Extracted from
# this crate so a surface can register the daemon WITHOUT linking it — the
# `sv-no-daemon-management` bar. The daemon is its first consumer, not its
# owner (ARCH §10.6).
sovereign-service = { workspace = true }
mesh-join-vocab = { workspace = true }
# The daemon crate, post-de-embed (docs/FIVE_PROGRAMS.md §11 step 10): no
# longer the in-process run body (that forked to its own `[[bin]]`, which
# `daemon_bin.rs` execs). The residue this crate still links: the pidfile
# path + rpc-worker flag parser (`startup`, `bootstrap`), and doctor's
# containment guard (`build::containment`). The wizard's join spawns the
# sibling's `join` launch (setup_cmd/terminal/join_child.rs, fp-cond2-c).
sovereign-daemon = { workspace = true, features = ["treesitter"] }
# The rented-pod modules lifted out of sovereign-mesh (domains REVIEW-audit-3);
# reached directly rather than through sovereign-mesh's shim.
# The scheduler half lifted out of sovereign-mesh (domains REVIEW-build-sched-move);
# the daemon's slot-alias resolution reaches it directly rather than through
# sovereign-mesh's shim (domains REVIEW-build-sched-repoint-daemon).
# The serving host lifted out of sovereign-mesh (domains
# REVIEW-build-serving-move-*); the daemon reached the router and the ports
# directly rather than through sovereign-mesh's shim
# (domains REVIEW-build-serving-repoint-daemon). Its tests moved with the
# inference e2e to `sovereign-daemon`, so this crate no longer links it.
sovereign-cli-shared = { workspace = true }
# Dep-history note (kept from the atlas/enrich era): `commonwealth-state`,
# `commonwealth-core` and `commonwealth-api` (now `sovereign-api`) WERE HERE
# and cw-lift rung 3b deleted all three — the coupling was eleven lines in
# two files, replaced by `kernel-types` for `NodeId` and
# `sovereign-contracts::peer`'s narrow ports. The atlas builder itself
# (`in_process_atlas_builder`) forked to `sovereign-daemon` with the run
# body at the de-embed (docs/FIVE_PROGRAMS.md §11 step 10). The
# `corpus-engine` dep that fed doctor's SovereignConfig reads was dropped
# 2026-09-21 when that config moved to `sovereign-contracts::config`;
# corpus-index/scip below stay.
corpus-index = { workspace = true }
corpus-engine-scip = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
dirs = "5"
hostname = { workspace = true }
tempfile = "3"
sovereign-contracts = { workspace = true }
# The client half of the wire: the wizard reads its join child's
# `GET /v1/mesh/venues` through `TurnClient::mesh_venues`.
sovereign-turn-client = { workspace = true }
# doctor reads cw-rails' boot unit through the per-user unit writer's
# `is-enabled` probe (pb-mesh-exit-transport). std only behind `service`.
host-kit = { workspace = true, features = ["service", "panic_hook", "memory"] }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# No Windows GPU selectors: this binary loads no model. They moved to the
# loader, sovereign-stock (forwarded through sovereign-serve), which
# `scripts/stage-daemon-sidecar.sh` builds with `SOVEREIGN_SIDECAR_FEATURES`
# beside this sidecar (pb-distribution-setup).

# Headless OCR. OFF by default: it pulls `ort` + `ndarray` + `imageproc` +
# `i_overlay` into every daemon build, and the engine additionally needs
# ~20 MB of staged assets (det.onnx + rec.onnx + dict.txt, libpdfium) that
# the standard release path does not fetch — so compiling it in without
# staging them would only move the failure from "no OCR" to "OCR fails at
# ingest".
#
# When ON, `daemon_cmd::ocr_install` installs an `OcrCtx` on the
# LocalCorpusManager at boot, which is what makes `svrn corpus watch --ocr`
# read scanned PDFs on a headless box. Without it, a scanned PDF lands in
# `WatchedFolderState.failed_files` with reason `scanned_no_text`.
#
# See sovereign/deploy/onprem/README.md and the DEFAULTS_LEDGER row.
ocr = ["sovereign-daemon/ocr"]

[lints]
workspace = true
