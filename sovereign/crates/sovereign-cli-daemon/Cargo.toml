[package]
name = "sovereign-cli-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Long-running daemon + setup + service install binary."

# Sibling binary that owns the daemon's lifecycle:
#   sovereign daemon start/stop/status/...   — managed daemon
#   sovereign setup                          — hardware + model planner
#   sovereign install-service                — launchd / systemd register
#   sovereign doctor                         — health check + integrity probe
#
# Lives apart from sovereign-cli-dev (workspace tooling) and
# sovereign-cli-llm (model interaction) because the daemon binary
# has a very different cadence: it's the long-running host process,
# rarely-edited setup code, and a `doctor` that pokes the SCIP graph
# integrity. Cracking these out keeps the workbench binary
# (sovereign-cli-dev) free of the setup-planner + launchd glue and
# means a daemon restart doesn't force a workbench rebuild.

[[bin]]
name = "sovereign-cli-daemon"
path = "src/main.rs"

[dependencies]
sovereign-core = { workspace = true }
sovereign-inference = { workspace = true }
# Compute-child process boundary (P1): the `--compute-child` re-exec arm in
# run_with_args + the daemon-side ComputeChildManager/provider facade.
sovereign-compute = { workspace = true }
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true, features = ["treesitter"] }
sovereign-gliner = { workspace = true }
sovereign-mesh = { workspace = true, features = ["treesitter"] }
# THE `Runtime` recipe (TOPOLOGY.md §10 phase 5c) — the router classifier
# stack, the turn tool registry and the enrichment lane. This is what lets
# `sovereign daemon run` be the process that assembles a Runtime rather
# than the process that has every ingredient for one. Capabilities — down.
sovereign-runtime-recipe = { workspace = true }
sovereign-workflow = { workspace = true }
sovereign-workflow-host = { workspace = true }
sovereign-work-atlas = { workspace = true }
sovereign-cli-shared = { workspace = true, features = ["scip"] }
# The atlas build orchestrator. The daemon runs `enrich build` in-process for
# an `[enrichment] type = "atlas"` recipe, because a shipped desktop bundle
# carries no `sovereign-cli` to shell out to (every such build exited 127).
#
# This was `sovereign-cli-llm` until 2026-09-01 — host to host, layer-legal but
# dragging `bench_cmd`'s grandfathered `sovereign-eval` edge into this binary
# and into the desktop bundle that embeds it. That was a NAMED substitution
# (ARCH §18.3) with a §10.1e ledger row, and the operator funded the split
# rather than keeping it. Now a capability, one layer down, and the interface
# is two names: `build_with_progress_with_embedder` and `ParsedBuild`.
sovereign-enrichment-build = { workspace = true }
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state" }
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
# Direct edge for the notes convergence recorder (order commons-fluency
# fix 9): the daemon stamps `ConvergenceRecord` from its publish sink +
# ingest poller; already transitive via sovereign-mesh, made explicit
# here because the type is named in the daemon's own bootstrap.
commonwealth-api = { path = "../../../commonwealth/crates/commonwealth-api" }
commonwealth-tdd = { workspace = true }
corpus-engine = { workspace = true, features = ["treesitter"] }
corpus-engine-notes = { workspace = true }
corpus-engine-scip = { workspace = true }
corpus-engine-watchers = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
arc-swap = { workspace = true }
dirs = "5"
chrono = { workspace = true }
sha2 = { workspace = true }
hostname = { workspace = true }
which = "7"
tempfile = "3"
# Path SSOT (`rebrand`) + the compute-child wire types. Promoted from
# dev-dependencies 2026-08-10: the daemon's own path resolution now goes
# through `rebrand`, so this is a real dependency, not a test-only one.
sovereign-contracts = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# OFF by default so the product daemon carries zero ATOS. When on, the daemon
# registers the ATOS code-intel tools (project_context, design_signals) on its
# MCP surface. The experimental ATOS subsystem is otherwise reached via the
# `sovereign-cli-dev` workbench (`sovereign atos …`).
atos = ["sovereign-tools/atos", "sovereign-mesh/atos"]

# Bench/measurement-only: see sovereign-mesh's feature of the same name.
iroh-relay-only = ["sovereign-mesh/iroh-relay-only"]

# Headless OCR. OFF by default: it pulls `ort` + `ndarray` + `imageproc` +
# `i_overlay` into every daemon build, and the engine additionally needs
# ~20 MB of staged assets (det.onnx + rec.onnx + dict.txt, libpdfium) that
# the standard release path does not fetch — so compiling it in without
# staging them would only move the failure from "no OCR" to "OCR fails at
# ingest".
#
# When ON, `daemon_cmd::ocr_install` installs an `OcrCtx` on the
# LocalCorpusManager at boot, which is what makes `svrn corpus watch --ocr`
# read scanned PDFs on a headless box. Without it, a scanned PDF lands in
# `WatchedFolderState.failed_files` with reason `scanned_no_text`.
#
# See sovereign/deploy/onprem/README.md and the DEFAULTS_LEDGER row.
ocr = ["sovereign-tools/paddle-ocr"]

[lints]
workspace = true
