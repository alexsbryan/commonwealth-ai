[package]
name = "sovereign-mesh-test-harness"
description = "Integration test harness for the Commonwealth mesh — simulated nodes, mock servers, failure injection. Consumed only by sovereign-mesh (the `dst` feature), which is why it sits beside it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
commonwealth-core = { workspace = true }
oicp-types = { workspace = true }
commonwealth-transport = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }

# The harness's `src/` meets the runtime at the OICP/contracts seam: its
# simulated node is generic over the node state, so the library names no host.
# The integration tests assemble the real host node and bind it, which is why
# `sovereign-api` is a test-only edge here — layer-gate never enforces dev
# edges (DepKind::Dev), and the production direction is unchanged.
[dev-dependencies]
commonwealth-discovery = { workspace = true }
commonwealth-state = { workspace = true }
sovereign-api = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
