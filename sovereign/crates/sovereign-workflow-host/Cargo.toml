[package]
name = "sovereign-workflow-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Daemon-runnable workflow host — assembles the standard tool registry, resolves the workflow catalog, and runs workflows in-process (sovereign-workflow engine + sovereign-tools tools + daemon-routed inference). The piece that lets the daemon run a workflow, not just the CLI."

[dependencies]
sovereign-core = { workspace = true }
sovereign-workflow = { workspace = true }
sovereign-tools = { workspace = true, features = ["treesitter", "gliner-ner"] }
sovereign-inference = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
