[package]
name = "sovereign-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tool-efficacy self-host harness — manifest dumper, oracle grader, scorer"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sovereign-eval"
path = "src/bin/main.rs"

[dependencies]
# Zero-dep leaf: canonical Unix-epoch wall-clock helpers.
sovereign-time = { workspace = true }
# Path SSOT: per-user svrnmesh paths come from `rebrand` (never hand-rolled $HOME).
sovereign-contracts = { workspace = true }
# The atlas vocabulary WITHOUT its `std::fs` read door: the claim-miner reads
# atoms.json itself and decodes it with `read::parse_atoms` (five-programs
# fp-58, [bench] leaf_budget). A path dep because `default-features = false`
# is ignored on a `workspace = true` dep whose root entry leaves it on.
understanding-vocab = { path = "../../../understanding-vocab", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.35", features = ["bundled"] }
sha2 = { workspace = true }
hex = "0.4"
anyhow = "1"
toml = { workspace = true }
rand = "0.9"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
