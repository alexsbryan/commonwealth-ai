[package]
name = "sovereign-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tool-efficacy self-host harness — manifest dumper, oracle grader, scorer"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sovereign-eval"
path = "src/bin/main.rs"

[dependencies]
# Zero-dep leaf: canonical Unix-epoch wall-clock helpers.
sovereign-time = { workspace = true }
# Path SSOT: per-user svrnmesh paths come from `rebrand` (never hand-rolled $HOME).
sovereign-contracts = { workspace = true }
corpus-engine.workspace = true
# The atlas vocabulary + its read door (`read_atlas_atoms`) — a two-crate leaf
# closure, so the flywheel's claim-miner reads atoms.json without naming the
# engine that writes it (domains dm-vocab-bypass-rest).
understanding-vocab = { workspace = true }
sovereign-authoring-harness.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.35", features = ["bundled"] }
sha2 = { workspace = true }
hex = "0.4"
anyhow = "1"
toml = { workspace = true }
rand = "0.9"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
