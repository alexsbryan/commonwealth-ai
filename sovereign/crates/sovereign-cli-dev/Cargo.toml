[package]
name = "sovereign-cli-dev"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-dev workbench binary: project lifecycle + code intelligence + MCP tool runner."

# Sibling binary to `sovereign-cli`. The workbench: project lifecycle
# (`project init/status/...`), code-intelligence helpers (`code`),
# and the MCP tool surface (`tools`).
#
# Sibling carve-outs:
#   - sovereign-cli-daemon: daemon lifecycle + setup + service install + doctor
#   - sovereign-cli-llm: bench / chat / eval / atlas / enrich / mesh / corpus

# The crate gained a `[lib]` target on 2026-08-21. It was binary-only until
# then, which is why `nc-reach` scored it 135 types / 0% exported: nothing in
# Rust can import a type out of a bin crate. `src/lib.rs` carries the whole
# module tree and the crate docs explaining the split; `src/main.rs` is a shim
# over `bin_main()`.
[lib]
name = "sovereign_cli_dev"
path = "src/lib.rs"

[[bin]]
name = "sovereign-cli-dev"
path = "src/main.rs"
# The binary IS the workbench — it cannot be built without the modules.
# `default = ["workbench"]` means this is satisfied by every ordinary build;
# the guard exists so `--no-default-features` (the dispatcher's view of this
# crate) skips the bin instead of failing to compile it.
required-features = ["workbench"]

# ── Dependency shape (2026-08-21) ────────────────────────────────────────
# Two tiers, and the line between them is load-bearing.
#
# ALWAYS-ON is what `sovereign-cli` inherits when it links this crate with
# `default-features = false`: `corpus-engine-scip` + `sovereign-cli-shared`
# (no features) and small third-party crates the dispatcher already carries.
# `InProcessCodeVerb` and everything it reaches must live inside that budget.
#
# WORKBENCH (default) is everything else — `sovereign-mesh` drags llama.cpp,
# `sovereign-tools` drags arrow + parquet + the enrichment catalog,
# `corpus-engine` drags the tree-sitter grammars. Linking those into a
# dispatcher to move a metric is the failure this split refuses.
[dependencies]
# ── Always-on: the thin, linkable surface ──
# `converge_cmd`'s entire dependency surface. Read-only SQLite over the SCIP
# graph; no grammars, no model, no daemon.
corpus-engine-scip = { workspace = true }
# Default features only — `dirs` and `tracing_init` are ungated. The heavy
# features this crate needs (`scip`, `code-index`, `mcp-client`,
# `project-model`) are requested from the `workbench` feature below so a
# `--no-default-features` consumer does not pay for them.
sovereign-cli-shared = { workspace = true }

# ── Workbench-only workspace crates ──
sovereign-core = { workspace = true, optional = true }
# oicp-client is NOT a direct dependency here any more (2026-08-20). The one
# import that wanted it — `RemoteApiProvider`, in `code_cmd.rs`'s copy of
# `build_daemon_embed_fn` — moved with the rest of `svrn code index` into
# `sovereign-cli-shared::code_index`, so it now arrives through the
# `code-index` feature below.
#
# The measurement that put it here is still worth knowing: taking the HTTP
# client directly rather than through `sovereign-inference` (which merely
# re-exports it while linking llama.cpp unconditionally) saved 3.5 KB of a
# 395 MB debug binary. llama.cpp still arrives transitively via
# `sovereign-mesh`, which depends on `sovereign-inference` unconditionally
# across 8 files of inference-serving guts. The workbench only sheds
# llama.cpp when `sovereign-mesh` leaves its default build — which needs
# `sovereign_mesh::projects` (the only thing the index path uses from it)
# extracted to a leaf crate. Do not cite the swap as the size win.
sovereign-store = { workspace = true, optional = true }
# `dev-tools` (git archaeology in BriefTool) travels with
# `sovereign-code` since the 2026-09-21 lift.
sovereign-code = { workspace = true, features = ["treesitter", "dev-tools"] }
sovereign-tools = { workspace = true, features = [
    "treesitter",
], optional = true }
sovereign-enrichment-build = { workspace = true }
sovereign-contracts = { workspace = true }
sovereign-mesh = { workspace = true, features = ["treesitter"], optional = true }
# The mesh host cluster (domains dm-daemon-mesh-edge): `project_cmd::serve`
# mounts `mcp_router`, so it rides the same `workbench` gate as the mesh dep.
sovereign-daemon = { workspace = true, optional = true }
# `project_cmd::cmd_serve` registers work-atlas claim handlers when
# the daemon comes up; pulled in directly here rather than via
# sovereign-tools so the dep is visible in this crate's tree.
sovereign-work-atlas = { workspace = true, optional = true }
corpus-engine = { workspace = true, features = ["treesitter"], optional = true }
# Read-port leaf (`EmbedFn`, `Error`, `DEFAULT_EMBED_DIM`, `CorpusIndex`) —
# same workbench gate as corpus-engine.
corpus-index = { workspace = true, optional = true }
# The code-intel package's fact base (`facts`/`facts_check`/`facts_store`),
# moved out of corpus-engine at domains REVIEW-build-code-facts. `code_cmd`
# names `code_facts::*` directly; the `treesitter`/`stores` features arrive
# through corpus-engine's feature of the same name.
code-facts = { workspace = true, optional = true }
corpus-engine-notes = { workspace = true, optional = true }
# `code_fieldglass` renders the layer-flow panel from the SAME parser/evaluator
# the layer gate uses (one decider), and the SRP co-change communities from the
# same git harvest the drift/arch temporal sections use.
arch-layers = { workspace = true, optional = true }
corpus-engine-archaeology = { workspace = true, optional = true }
corpus-engine-watchers = { workspace = true, optional = true }
# `refactor_wire` (the factory's stage-6 encoding gate) serialises fixtures
# of the kernel's id types through the ONE wire decider, `kernel_types::wire`
# (§10.6). `wire-fixture` is what turns that module on outside kernel-types'
# own tests.
kernel-types = { workspace = true, features = ["wire-fixture"], optional = true }

# ── Third-party ──
# Everything here except axum/tower-http is already a dependency of
# `sovereign-cli`, so an always-on entry costs the dispatcher nothing new.
# axum + tower-http serve the workbench's MCP HTTP surface and are gated.
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
arc-swap = { workspace = true }
dirs = "5"
chrono = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
which = "7"
hostname = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

# daemon_cmd uses libc::kill / setsid for unix process lifecycle.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# ON for every ordinary build, including the binary's own. A consumer that
# only wants the linkable surface (`sovereign-cli`) turns it off.
default = ["workbench"]
workbench = [
    "dep:sovereign-core",
    "dep:sovereign-store",
    "dep:sovereign-tools",
    "dep:sovereign-mesh",
    "dep:sovereign-daemon",
    "dep:sovereign-work-atlas",
    "dep:corpus-engine",
    "dep:corpus-index",
    "dep:code-facts",
    "dep:corpus-engine-notes",
    "dep:arch-layers",
    "dep:corpus-engine-archaeology",
    "dep:corpus-engine-watchers",
    "dep:kernel-types",
    "dep:axum",
    "dep:tower-http",
    # `svrn code index` — the workbench's `code` router serves it, and so does
    # the shipped dispatcher. One implementation lives there since 2026-08-20.
    "sovereign-cli-shared/code-index",
    "sovereign-cli-shared/scip",
    "sovereign-cli-shared/mcp-client",
    # `observation` + `project_toml` live here since 2026-08-07; `found`,
    # `phase`, `audit` and `charter amend` read the model the shipped
    # dispatcher's `project init` writes.
    "sovereign-cli-shared/project-model",
]

[lints]
workspace = true
