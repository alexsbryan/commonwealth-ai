license.workspace = true

[dependencies]
# The host's only in-repo reaches are the shared leaves (SERVING_BOUNDARY.md
# "The two tiers"): the contract vocabulary (`InferenceProvider`, `Speed`,
# `CompletionRequest`) and the published OICP language the slot pick is
# arithmetic over.
