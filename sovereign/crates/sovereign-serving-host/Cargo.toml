[package]
name = "sovereign-serving-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The host's only in-repo reaches are the shared leaves (SERVING_BOUNDARY.md
# "The two tiers"): the contract vocabulary (`InferenceProvider`, `Speed`,
# `CompletionRequest`) and the published OICP language the slot pick is
# arithmetic over.
sovereign-contracts = { workspace = true }
oicp-types = { workspace = true }
tracing = { workspace = true }
# The recording sink is the host's (SERVING_BOUNDARY.md "Corrected
# 2026-09-14", bullet 1): it serialises the scheduler's record types, mints
# decision ids, and stamps them from the tier-0 `sovereign-time` leaf.
sovereign-scheduler = { path = "../sovereign-scheduler" }
sovereign-time = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Implementing `InferenceProvider` in the tests needs the trait's async
# machinery and its stream type.
async-trait = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
