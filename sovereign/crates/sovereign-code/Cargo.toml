[package]
name = "sovereign-code"
version.workspace = true
edition.workspace = true
license.workspace = true

# `svrn code` — the LSP-for-agents program (FIVE_PROGRAMS §2). Lifted out of
# `sovereign-tools/src/code/` on 2026-09-21. It links NO other program: the
# tool ABI it needs (`Tool`, `ToolContext`, `DeclaredTool`, `error`) is read
# from `sovereign-contracts` directly rather than through `sovereign-core`'s
# aliases, which is what made the lift a path rewrite instead of a move.

[dependencies]
sovereign-contracts = { workspace = true }
sovereign-time = { workspace = true }
corpus-index = { workspace = true }
understanding-vocab = { workspace = true, features = ["read"] }
corpus-engine-scip = { workspace = true }
corpus-engine-notes = { workspace = true }
corpus-engine-archaeology = { workspace = true, optional = true }
corpus-engine-watchers = { workspace = true }
# Code's face (`face`, pb-code-daemon-exit): the lint/test watchers' yield
# signal, the work atlas it composes, the atlas store's dialer and the
# atlas identity, and the call log's session id.
corpus-engine-yield = { workspace = true }
sovereign-work-atlas = { workspace = true }
sovereign-turn-client = { workspace = true }
kernel-types = { workspace = true }
uuid = { workspace = true }
code-facts = { workspace = true, features = ["treesitter", "stores"] }
arch-layers = { workspace = true }

arc-swap = { workspace = true }
async-trait = { workspace = true }
blake3 = "1"
toml = { workspace = true }
arrow-array = { workspace = true }
futures = { workspace = true }
lancedb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# The freshness path's HTTP surface, `/v1/projects/*` (project_http.rs,
# phase-b pb-code-freshness): axum routes behind the host kit's loopback guard.
axum = { workspace = true, optional = true }
host-kit = { workspace = true, features = ["shell", "mcp", "task"], optional = true }
# SpecWatcher (spec_watcher.rs, moved from sovereign-tools with the spec gate
# it invalidates, phase-b pb-code-freshness). Same major as the reindexer's.
notify = "8"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[features]
# Mirrors sovereign-tools' axes exactly — these modules were gated there before
# the lift and the gates travel with the code, not with the old home.
default = ["treesitter"]
# Also the freshness path (the Reindexer and `/v1/projects/*`), which needs
# the watchers crate's `reindexer`, gated on that crate's `treesitter`.
treesitter = ["corpus-engine-watchers/treesitter", "dep:axum", "dep:host-kit"]
dev-tools = ["dep:corpus-engine-archaeology"]

[dev-dependencies]
tempfile = { workspace = true }
# The pattern matcher's live-wire e2e (face/pattern_observation_tests.rs)
# serves code's dispatcher behind the kit's HTTP framing.
host-kit = { workspace = true, features = ["http"] }
# project_http.rs's route tests.
reqwest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
