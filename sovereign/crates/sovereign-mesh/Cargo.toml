[package]
name = "sovereign-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Commonwealth mesh integration layer for Sovereign"

[dependencies]
# Commonwealth crates (embedded as library)
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
# Rebrand-aware path SSOT: the projects.json writer must derive the same
# path its readers (symbol_lookup, daemon re-registration) resolve.
sovereign-contracts = { workspace = true }
# `features = ["iroh"]`: the daemon's dial-by-key binding (W1 of
# TRANSPORT_MIGRATION.md) is compiled into the default build —
# runtime-gated by `[iroh] enabled`, not cfg-gated — so the shipped
# daemon actually binds an endpoint when configured. iroh is already
# in the workspace's default build via sovereign-server, so this adds
# no marginal compile cost. The heavier network e2e test stays behind
# this crate's `iroh-experimental` feature.
commonwealth-transport = { path = "../../../commonwealth/crates/commonwealth-transport", features = ["iroh"] }
commonwealth-discovery = { path = "../../../commonwealth/crates/commonwealth-discovery" }
commonwealth-api = { path = "../../../commonwealth/crates/commonwealth-api" }
# Needed because `AppState::new_with_platform_and_engine` requires
# an explicit `MeshStore` / `AppRegistry` — we construct in-memory
# variants of each when `EmbeddedDaemon` builds its state.
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state" }
commonwealth-app = { path = "../../../commonwealth/crates/commonwealth-app" }
# DST harness (FaultTransport / FaultProxy / SimulatedMesh) for the
# deterministic-simulation tests in `dst.rs` + `tests/dst_scenarios.rs`.
# Optional: only the `dst` feature (the CI fault-injection gate) pulls it in,
# so default builds don't drag the test harness into the dependency graph.
commonwealth-test-harness = { path = "../../../commonwealth/crates/commonwealth-test-harness", optional = true }
# KnowledgeSearchRequest / KnowledgeSearchResponse live in oicp-types,
# re-exported via commonwealth-inference::oicp — we POST/parse those
# bodies from the mesh knowledge client.
commonwealth-inference = { path = "../../../commonwealth/crates/commonwealth-inference" }
# `treesitter` feature dropped from the unconditional dep 2026-05-22:
# only `reindexer` + `project_http` (the SCIP-graph modules) need it,
# and those are now feature-gated by this crate's `treesitter` feature
# below. Default callers (sovereign-cli's mesh_cmd, mcp_router,
# gossip, etc.) don't pull the 5 tree-sitter grammar crates.
corpus-engine = { workspace = true }
corpus-engine-notes = { workspace = true }
# SCIP call graph + exporter dispatch. Carved out of corpus-engine
# 2026-05-23 — reindexer.rs uses ScipGraph + scip_export directly.
corpus-engine-scip = { workspace = true }

# Sovereign core (for InferenceProvider + MeshKnowledgeSource traits)
sovereign-core = { workspace = true }
# RemoteApiProvider — synthesised at request time when routing to
# a peer for federated inference.
sovereign-inference = { workspace = true }
# `mcp_surface` — the shared MCP allowlist + alias map. The
# embedded daemon's mcp_router and the standalone MCP server in
# sovereign-server share this so they advertise the same surface
# to clients without drifting.
sovereign-tools = { workspace = true }
# Work atlas — `MeshBroadcaster` adapter implements
# `sovereign_work_atlas::tools::ClaimBroadcaster` using `AppState`
# + `gossip::broadcast_now`. Lives here (not in work-atlas) so the
# trait stays free of `AppState` and the cmd_serve wire-up is the
# single place that pairs the two.
sovereign-work-atlas = { workspace = true }
# async_trait is needed to impl the (async) MeshKnowledgeSource
# trait on MeshKnowledgeClient. sovereign-core already uses it.
async-trait = { workspace = true }
# `SovereignInferenceAdapter::chat_completion_stream` forwards the
# Sovereign provider's stream, mapping its error type.
futures = { workspace = true }

# Shared
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
thiserror = { workspace = true }
# Tool-profile registry parses ~/.svrnmesh/tool_profiles.toml.
toml = { workspace = true }
# JSON-RPC request id field uses Value; explicit dep even though
# serde_json already transitively provides it.
uuid = { workspace = true }
tracing = { workspace = true }
hex = "0.4"
# Default node name for the HTTP mesh-create route when the caller
# omits `node_name` — same fallback as the CLI's `mesh create`.
hostname = { workspace = true }
# For the join-handshake client (Phase B). Added now because the
# daemon already needs it to serialise mesh_id as hex for mDNS TXT
# records; pulling reqwest once across the crate is simpler than
# threading it through Phase B piecewise.
reqwest = { workspace = true }
# Random peer selection for each gossip round. Matches the version
# already in commonwealth-discovery to keep linking simple.
rand = "0.10"
# Async↔sync bridges for the canonical-pull stream → blocking unpack
# pipeline. `io-util` exposes SyncIoBridge; `io` brings ReaderStream /
# StreamReader.
tokio-util = { version = "0.7", features = ["io", "io-util"] }
# `tokio-stream` exposes BroadcastStream — the adapter that turns a
# `tokio::sync::broadcast::Receiver` into a `futures::Stream`, so
# the MCP `GET /mcp` SSE handler can chain it with the endpoint
# event and forward server-pushed JSON-RPC notifications
# (`notifications/tools/list_changed`, Phase 5b).
tokio-stream = { version = "0.1", features = ["sync"] }
# Enumerate ALL local network interfaces so a node on both WiFi
# and Tailscale (the usual Commonwealth LAN-+-VPN topology) can
# advertise both addresses in its `MemberRecord.addresses`. The
# old UDP-connect trick only returned the default outbound IP,
# which on an AP-isolated WiFi was unreachable from peers who
# could only route via Tailscale.
if-addrs = "0.15"
# Project registry (~/.svrnmesh/projects.json) timestamps and
# default_path resolution.
chrono = { workspace = true }
dirs = "6"
# Streaming SHA-256 in `model_fetch` so the file is hashed
# while the bytes pass through — no second pass over disk.
sha2 = { workspace = true }
# Ed25519 keypair derivation in `worker_pod.rs`. `pkcs8` lets us feed
# the derived key directly to rcgen for self-signed cert generation;
# `rand_core` exposes the RNG trait we need on the verify side.
ed25519-dalek = { workspace = true }
# Self-signed TLS cert generation from a deterministic Ed25519 seed
# (pod side) — version matches commonwealth-discovery to keep one
# rcgen in the build graph.
rcgen = "0.14"
# Bootstrap blob is base64'd into Vast's `onstart` env var.
base64 = "0.23"
# HTTPS termination for the worker daemon — pod serves its
# seed-derived self-signed cert on :9742. `axum-server` is the
# cleanest path that pairs axum routers with rustls without
# hand-rolling a TLS acceptor. `tls-rustls-no-provider` lets us
# install the same `aws-lc-rs` crypto provider reqwest uses,
# avoiding the "two providers, can't pick one" error rustls 0.23
# emits when both are registered.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
# `aws_lc_rs` is the same crypto provider reqwest uses by default —
# both halves of the protocol (pod's TLS server + owner's pinned
# reqwest client) share one FIPS-aligned crypto stack. `std` is
# default in rustls 0.23 but we make it explicit here.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
# Percent-encode model file names in the peer-fetch URL so a
# filename with characters that would otherwise need encoding
# (spaces, plus signs) reaches the server intact.
urlencoding = "2"
# FS watcher primitives for the Reindexer's freshness pipeline.
# `notify` drives the kernel-level change events; `ignore` honours
# .gitignore semantics so we don't fire on target/ or node_modules/.
notify = "8"
ignore = "0.4"
# Holds the Arc<ArcSwap<ScipGraph>> in the Reindexer so rebuilds
# can atomically swap in a new graph while tool calls keep reading
# the old one.
arc-swap = { workspace = true }
# Staging directory for per-language exporter output during a
# rebuild. Also used by the integrity tests.
tempfile = "3"
# Wrapping Vec<u8> for MeshStore::set in MeshNewsworthyHost. One call
# site; explicit dep keeps the host's API surface honest.
bytes = "1"

[features]
default = []
# Deterministic-simulation mesh tests: compiles `dst.rs` (the `DstMesh` gossip
# driver + invariant pack) and `tests/dst_scenarios.rs`. Pulls the test
# harness. CI runs a fixed-seed set behind this flag; off by default so the
# production build never links the harness.
dst = ["dep:commonwealth-test-harness"]
# Tier-1 scheduler simulator (`SCHEDULER_QUALITY.md` §5): compiles
# `mesh_sim.rs` + `tests/mesh_sim_scoreboard.rs`. Pure compute — no
# extra dependencies, no network, no wall clock — but off by default
# so a production build never links a measurement harness. Run:
#   cargo test -p sovereign-mesh --features mesh-sim,treesitter --test mesh_sim_scoreboard -- --nocapture
mesh-sim = []
# Forward the ATOS served-middleware pipeline through to commonwealth-api.
# OFF by default; an atos daemon build turns it on via the feature chain.
atos = ["commonwealth-api/atos"]
# Enables `reindexer` + `project_http` — the SCIP-graph-hosting
# modules. Off by default so binaries that only use the mesh
# primitives (deep_link, EmbeddedDaemon, persist, model_fetch) don't
# drag in `corpus-engine`'s `treesitter` feature with its 5 grammar
# crates. The CLI dispatcher (sovereign-cli) skips this; the daemon
# host (sovereign-cli-atos) and desktop both enable it.
treesitter = ["corpus-engine/treesitter"]
# EXPERIMENTAL: compiles commonwealth-transport's iroh dial-by-key
# transport and the spike e2e (tests/iroh_transport_e2e.rs). Off by
# default — never part of the workspace gates. Run via:
#   cargo test -p sovereign-mesh --features iroh-experimental --test iroh_transport_e2e
iroh-experimental = ["commonwealth-transport/iroh"]

# Bench/measurement-only: lets `SOVEREIGN_IROH_RELAY_ONLY=1` pin the daemon's
# iroh endpoint to the relay path (deterministic relay-floor E2E for
# distributed inference). Both peers must run it. Never in production builds.
iroh-relay-only = ["commonwealth-transport/iroh-relay-only"]

[dev-dependencies]
tempfile = "3"
# `ServiceExt::oneshot` lets the worker_http integration tests dispatch
# a synthetic axum Request through the router without spinning up a
# TcpListener. Same pattern as commonwealth's HTTP unit tests.
tower = { workspace = true }
# `tracing-subscriber` is used in integration tests (e.g.
# `injection_order.rs`) to capture tracing events emitted by the
# library under test and assert on them. Keeping it scoped to
# dev-deps so the production binary doesn't pay the inclusion cost.
tracing-subscriber = { workspace = true }
# `sovereign-store` provides `InMemoryStateStore`, used by the
# corpus-watch integration test to stand up a `LocalCorpusManager`
# without an on-disk SQLite file. Same pattern as the
# `sovereign-tools/tests/local_corpus_e2e.rs` harness.
sovereign-store = { workspace = true }

[lints]
workspace = true
