[package]
name = "sovereign-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Commonwealth mesh integration layer for Sovereign"

# What is left after pb-mesh-dissolve moved or deleted the rest: the
# `MeshReplicatedKv` adapter and the work-atlas replication test that drives
# it. Where that test lives is an open operator decision (pb-mesh-dissolve);
# the crate goes when it is placed.

[dependencies]
# `MeshReplicatedKv` is `ReplicatedKv` over the real `MeshStore`.
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state", features = ["sqlite"] }
sovereign-contracts = { workspace = true }
kernel-types = { workspace = true }
bytes = "1"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
commonwealth-rail-core = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# `tests/main/work_atlas_store.rs` drives the atlas over `MeshReplicatedKv`
# (five-programs fp-84). A dev edge only: layer-gate exempts it, boundary-gate
# COUNTS it ([cmnwlth] -> [code]; five-programs-49, NEEDS-OPERATOR).
sovereign-work-atlas = { workspace = true }

[lints]
workspace = true
