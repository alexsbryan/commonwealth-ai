[package]
name = "sovereign-mesh"
version.workspace = true
edition.workspace = true
description = "Commonwealth mesh integration layer for Sovereign"

[dependencies]
# Commonwealth crates (embedded as library)
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
commonwealth-discovery = { path = "../../../commonwealth/crates/commonwealth-discovery" }
commonwealth-api = { path = "../../../commonwealth/crates/commonwealth-api" }
# Needed because `AppState::new_with_platform_and_engine` requires
# an explicit `MeshStore` / `AppRegistry` — we construct in-memory
# variants of each when `EmbeddedDaemon` builds its state.
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state" }
commonwealth-app = { path = "../../../commonwealth/crates/commonwealth-app" }
# KnowledgeSearchRequest / KnowledgeSearchResponse live in oicp-types,
# re-exported via commonwealth-inference::oicp — we POST/parse those
# bodies from the mesh knowledge client.
commonwealth-inference = { path = "../../../commonwealth/crates/commonwealth-inference" }
corpus-engine = { workspace = true }

# Sovereign core (for InferenceProvider + MeshKnowledgeSource traits)
sovereign-core = { workspace = true }
# RemoteApiProvider — synthesised at request time when routing to
# a peer for federated inference.
sovereign-inference = { workspace = true }
# async_trait is needed to impl the (async) MeshKnowledgeSource
# trait on MeshKnowledgeClient. sovereign-core already uses it.
async-trait = { workspace = true }
# `SovereignInferenceAdapter::chat_completion_stream` forwards the
# Sovereign provider's stream, mapping its error type.
futures = { workspace = true }

# Shared
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = "0.4"
# For the join-handshake client (Phase B). Added now because the
# daemon already needs it to serialise mesh_id as hex for mDNS TXT
# records; pulling reqwest once across the crate is simpler than
# threading it through Phase B piecewise.
reqwest = { workspace = true }
# Random peer selection for each gossip round. Matches the version
# already in commonwealth-discovery to keep linking simple.
rand = "0.9"
# Enumerate ALL local network interfaces so a node on both WiFi
# and Tailscale (the usual Commonwealth LAN-+-VPN topology) can
# advertise both addresses in its `MemberRecord.addresses`. The
# old UDP-connect trick only returned the default outbound IP,
# which on an AP-isolated WiFi was unreachable from peers who
# could only route via Tailscale.
if-addrs = "0.13"

[dev-dependencies]
tempfile = "3"
