[package]
name = "sovereign-mesh"
version.workspace = true
edition.workspace = true
description = "Commonwealth mesh integration layer for Sovereign"

[dependencies]
# Commonwealth crates (embedded as library)
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
commonwealth-discovery = { path = "../../../commonwealth/crates/commonwealth-discovery" }
commonwealth-api = { path = "../../../commonwealth/crates/commonwealth-api" }
# Needed because `AppState::new_with_platform_and_engine` requires
# an explicit `MeshStore` / `AppRegistry` — we construct in-memory
# variants of each when `EmbeddedDaemon` builds its state.
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state" }
commonwealth-app = { path = "../../../commonwealth/crates/commonwealth-app" }
# KnowledgeSearchRequest / KnowledgeSearchResponse live in oicp-types,
# re-exported via commonwealth-inference::oicp — we POST/parse those
# bodies from the mesh knowledge client.
commonwealth-inference = { path = "../../../commonwealth/crates/commonwealth-inference" }
# treesitter feature is needed for corpus_engine::NoteStore, which the
# mcp_router module uses to log tool-call outcomes. Pulls in tree-sitter
# transitively — acceptable cost since the embedded daemon already ingests
# from corpus-engine for /v1/knowledge/search.
corpus-engine = { workspace = true, features = ["treesitter"] }

# Sovereign core (for InferenceProvider + MeshKnowledgeSource traits)
sovereign-core = { workspace = true }
# RemoteApiProvider — synthesised at request time when routing to
# a peer for federated inference.
sovereign-inference = { workspace = true }
# `mcp_surface` — the shared MCP allowlist + alias map. The
# embedded daemon's mcp_router and the standalone MCP server in
# sovereign-server share this so they advertise the same surface
# to clients without drifting.
sovereign-tools = { workspace = true }
# async_trait is needed to impl the (async) MeshKnowledgeSource
# trait on MeshKnowledgeClient. sovereign-core already uses it.
async-trait = { workspace = true }
# `SovereignInferenceAdapter::chat_completion_stream` forwards the
# Sovereign provider's stream, mapping its error type.
futures = { workspace = true }

# Shared
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
thiserror = { workspace = true }
# JSON-RPC request id field uses Value; explicit dep even though
# serde_json already transitively provides it.
uuid = { workspace = true }
tracing = { workspace = true }
hex = "0.4"
# Default node name for the HTTP mesh-create route when the caller
# omits `node_name` — same fallback as the CLI's `mesh create`.
hostname = { workspace = true }
# For the join-handshake client (Phase B). Added now because the
# daemon already needs it to serialise mesh_id as hex for mDNS TXT
# records; pulling reqwest once across the crate is simpler than
# threading it through Phase B piecewise.
reqwest = { workspace = true }
# Random peer selection for each gossip round. Matches the version
# already in commonwealth-discovery to keep linking simple.
rand = "0.9"
# Async↔sync bridges for the canonical-pull stream → blocking unpack
# pipeline. `io-util` exposes SyncIoBridge; `io` brings ReaderStream /
# StreamReader.
tokio-util = { version = "0.7", features = ["io", "io-util"] }
# `tokio-stream` exposes BroadcastStream — the adapter that turns a
# `tokio::sync::broadcast::Receiver` into a `futures::Stream`, so
# the MCP `GET /mcp` SSE handler can chain it with the endpoint
# event and forward server-pushed JSON-RPC notifications
# (`notifications/tools/list_changed`, Phase 5b).
tokio-stream = { version = "0.1", features = ["sync"] }
# Enumerate ALL local network interfaces so a node on both WiFi
# and Tailscale (the usual Commonwealth LAN-+-VPN topology) can
# advertise both addresses in its `MemberRecord.addresses`. The
# old UDP-connect trick only returned the default outbound IP,
# which on an AP-isolated WiFi was unreachable from peers who
# could only route via Tailscale.
if-addrs = "0.13"
# Project registry (~/.sovereign/projects.json) timestamps and
# default_path resolution.
chrono = { workspace = true }
dirs = "6"
# FS watcher primitives for the Reindexer's freshness pipeline.
# `notify` drives the kernel-level change events; `ignore` honours
# .gitignore semantics so we don't fire on target/ or node_modules/.
notify = "8"
ignore = "0.4"
# Holds the Arc<ArcSwap<ScipGraph>> in the Reindexer so rebuilds
# can atomically swap in a new graph while tool calls keep reading
# the old one.
arc-swap = { workspace = true }
# Staging directory for per-language exporter output during a
# rebuild. Also used by the integrity tests.
tempfile = "3"

[dev-dependencies]
tempfile = "3"
