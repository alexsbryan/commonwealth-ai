[package]
name = "sovereign-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The published language the ranker is arithmetic over. Rule 1
# (ARCH_LAYERS.toml): the scheduler may name `oicp-types` and nothing else in
# this repo. `TierFloor` reads the envelope's latency class off it.
oicp-types = { workspace = true }
# The scheduler half of sovereign-mesh moved in here (domains row
# REVIEW-build-sched-move): the decision records and replay fixtures are
# serde-serialised, the sink and the ranker log through `tracing`, decision
# ids are minted from `uuid`, and `decision_log`'s clock stamps come from the
# tier-0 `sovereign-time` leaf. Verified 2026-09-15 by `grep` over the seven
# modules — none of them names `sovereign-contracts`, `futures`, `tokio` or
# `async-trait`.
serde = { workspace = true }
serde_json = { workspace = true }
sovereign-time = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
