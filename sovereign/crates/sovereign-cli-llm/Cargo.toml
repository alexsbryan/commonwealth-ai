[package]
name = "sovereign-cli-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "svrn's LLM-heavy CLI surface (chat, workflow, govern, ...) — sibling binary to sovereign."

# Sibling binary that owns the LLM-touching subcommands. Lives apart
# from `sovereign-cli` so the dispatcher (notes / status / drift /
# audit / etc.) stays lean and fast to compile.
#
# Hosted verbs (parent `sovereign` shim execs into this binary):
#   bench and eval's white-box lanes (bench judge-replay | resolver-precision,
#   eval inner-chaos; the rest of bench is sovereign-cli-bench's),
#   chat, voice, reading-diag, search-gym, knowledge-gym, newsworthy,
#   recipe-agent, maintainer, mcp, mesh, and svrn's sub-verbs of atlas, enrich
#   and corpus (the rest of those, meta-atlas, recipe, pipeline, alignment and
#   bench atlas are svrn-ingest's since pb-cli-llm-ingest-move)
#
# The REPL surface (`sovereign` with no subcommand) also lives here —
# it constructs an EmbeddedLlamaCpp + Runtime, which is the heaviest
# code path in the whole CLI and the original reason sovereign-cli
# linked llama-cpp-2 in the first place.

# The crate gained a `[lib]` target on 2026-08-21 (nc-26). It was binary-only
# until then, which is why `sovereign-cli`'s `awareness_cmd` could reach into
# `crate::enrich_cmd::inference_client` only by pretending it lived here — an
# import that stopped compiling when the 2026-05-22 slice-5 split moved
# `enrich_cmd` out and left `awareness_cmd` behind. `src/lib.rs` carries the
# whole module tree and the crate docs explaining the split; `src/main.rs` is a
# shim over `bin_main()`.
[lib]
name = "sovereign_cli_llm"
path = "src/lib.rs"

[[bin]]
name = "sovereign-cli-llm"
path = "src/main.rs"

[dependencies]
# Flag surfaces are declared as structs (`#[derive(clap::Parser)]`), not
# parsed by hand.
clap = { workspace = true }
sovereign-core = { workspace = true }
sovereign-contracts = { workspace = true }
# `bench_cmd/ablate.rs` watches the daemon's data-root lock; `shell` is the
# server shell and bundle guard `meshapp dev` serves through (pb-meshapp-apps).
host-kit = { workspace = true, features = ["shell"] }
# `svrn meshapp`: the corpus-explorer reads over svrn's corpora (a shared-leaf
# closure), the dirs `meshapp_registry` resolves, and its `tar.zst` packing.
sovereign-meshapp = { workspace = true }
sovereign-cli-base = { workspace = true, features = ["corpus-install"] }
tar = "0.4"
zstd = "0.13"
# `declare`: write this node's own origin credential to the 0600 secret
# store. One implementation of where a declaration lives, shared with the
# acceptor that reads it.
# Phase 6: the chat surface asks the daemon for a turn instead of building
# a Runtime to run one itself (TOPOLOGY §10).
sovereign-turn-client = { workspace = true }
# The OICP client every remote provider, rerank and NER dial goes through
# (a shared leaf; pb-cli-llm).
oicp-client = { workspace = true }
sovereign-time = { workspace = true }
# No sovereign-inference and no sovereign-gliner: this crate loads no model;
# its embed, rerank and NER calls dial serve (`serve_dial.rs`, pb-cli-llm).
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true, features = ["treesitter"] }
sovereign-workflow = { workspace = true }
sovereign-workflow-host = { workspace = true }
sovereign-mesh = { workspace = true, features = ["treesitter"] }
# The mesh host cluster (domains dm-daemon-mesh-edge): the assembly root, the
# route shells and the edge.
sovereign-daemon = { workspace = true }
# THE `Runtime` recipe (TOPOLOGY.md §10 phase 5c). `chat_cmd::bootstrap`
# carried its own ~450-line copy of it until 2026-08-25; what remains here
# is only what this host resolves — which daemon, which models, which data
# root. Capabilities layer — down.
sovereign-runtime-recipe = { workspace = true }
# `meshapp dev` serves a bundle + proxies the explorer ops to this shared lib.
sovereign-cli-shared = { workspace = true, features = ["mcp-client", "rail-client"] }
# The neutral kernel — `quality lane` rows are `Judgement`s, so the lane and
# the runner that reads its trailing line speak one verdict vocabulary rather
# than two (noun-convergence rung nc-10-judgement). Layer 0, edge points DOWN.
kernel-types = { workspace = true }
#
# `commonwealth-knowledge` (now `sovereign-grants`) is ABSENT since cw-lift
# 1d, and its absence is the
# claim: `svrn ring` is a ring-app client, and a ring-app client composes on
# the rail without the knowledge layer. The last thing holding that dep was a
# rustdoc link from `ring_cmd`'s module header to `Scope::Rails` — no code, no
# type, one link — and `ring dev` mints its grant over HTTP.
# `svrn job` is a client of the work plane, not a second implementation of it:
# the act codec, the unit seal and `WorkProjection::fold` all come from here, so
# the terminal, the daemon's donor loop and a lifted third-party peer are three
# readers of ONE fold and cannot disagree about who holds a lease (ARCH §10.6).
# `features = ["process"]` for the PAYLOAD TYPE, not the executor: `svrn job
# submit -- <argv>` has to spell a `process:v1` body, and spelling it as a JSON
# literal here is what shipped a unit with no `timeout_secs` that every donor
# then refused. The shape and the runner sit behind one feature today, so
# reaching the shape means enabling it; the closure cost is zero (`process =
# ["dep:tokio"]` and this crate already links tokio). If a submitter-only peer
# ever needs the shape without the runner, the cut is to ungate `ProcessPayload`
# and leave `ProcessExecutor` behind the flag.
bytes = { workspace = true }
# The atlas vocabulary leaf — the ONE `atoms.json` shape (§10.6).
understanding-vocab = { workspace = true, features = ["read"] }
# The retrieval read-port leaf: index/corpus/types/filters rows this host
# reads directly instead of via corpus-engine's historical re-exports.
corpus-index = { workspace = true }
# The atlas read leaf: governance, context bag and section rows.
corpus-engine-atlas-reader = { workspace = true }
oplog = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `stream` on top of the workspace features: `solve --watch` reads
# the daemon's SSE round events via `bytes_stream()`.
reqwest = { workspace = true, features = ["stream"] }
uuid = { workspace = true }
dirs = "5"
chrono = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
hex = "0.4"
rand = "0.9"
# ── `awareness`-only, and off in every ordinary build ──
# `awareness_cmd` moved here from `sovereign-cli` on 2026-08-21 (nc-26)
# together with the dependencies only it needs. Both are optional
# and neither is in `default`, so the sibling binary's ordinary build —
# and the dispatcher's, which links this crate only under its own
# `awareness` pass-through — is byte-for-byte what it was.
#
# Direct SQLite reads in `awareness_cmd/{entities,reset,timeline}`. Production
# paths go through StateStore; the diagnostic CLI reads the file.
rusqlite = { version = "0.35", features = ["bundled"], optional = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The heavy `svrn awareness` knowledge-view diagnostic CLI. Opt-in, and NOT in
# `default`, so the shipped sibling binary carries none of it.
#
# The feature lives on THIS crate because the code does. It lived on
# `sovereign-cli` until 2026-08-21 while the module it gated needed
# `enrich_cmd`, which lives here — a feature on the wrong crate, and the
# reason the two module gates could disagree without anything noticing.
#
# `knowledge_view::splice_extension` (which every awareness subcommand
# imports) is `#[cfg(feature = "treesitter")]` in sovereign-tools, pulled
# by the non-optional `sovereign-tools` dep above.
awareness = ["dep:rusqlite"]

[dev-dependencies]
# The local-only list `portfolio-private` must stay in (fp-87) — a leaf.
commonwealth-rail-core = { workspace = true }

[lints]
workspace = true
