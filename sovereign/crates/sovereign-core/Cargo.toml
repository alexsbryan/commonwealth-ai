[package]
name = "sovereign-core"
version.workspace = true
edition.workspace = true

[dependencies]
oicp-types = { path = "../../../oicp-types" }
corpus-engine = { workspace = true, features = ["treesitter"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tokio-util = { workspace = true }
toml = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Home-dir + platform-native config-dir resolution for setup_config.
# `default_path()` lives at `~/.sovereign/config.toml`; `legacy_default_path()`
# is the pre-consolidation XDG location used for one-shot migration.
dirs = "5"
# Tier 4 — tool-result cache hashes canonical args via SHA-256
# to derive the cache key. Workspace-version pin keeps lock-file
# coherent with the 9+ other crates that already use sha2.
sha2 = { workspace = true }
# Static-embed runtime: scope classifier + router intent + atlas
# short-query sniffs consult `ShortQueryEmbedder` when an artifact
# is configured, avoiding the GPU embed slot on routing calls.
sovereign-static-embed = { path = "../sovereign-static-embed" }

[dev-dependencies]
tokio = { workspace = true }
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true }
tempfile = "3"
