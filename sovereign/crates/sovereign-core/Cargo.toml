[package]
name = "sovereign-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oicp-types = { path = "../../../oicp-types" }
# The daemon↔package contract (error, traits, registry, tool_result_cache,
# setup_config, types) was carved out here; sovereign-core re-exports every
# item at its historical path so importers are unaffected.
sovereign-contracts = { workspace = true }
# The neutral kernel — `deep_research::icd` re-exports `Verdict` from here
# rather than re-declaring the same four variants and the same wire form
# (noun-convergence rung nc-10-judgement). Layer 0: this edge points DOWN.
kernel-types = { workspace = true }
# `treesitter` feature dropped 2026-05-22: sovereign-core's
# corpus-engine usages (FeatureStore, NoteStore, EmbedFn, etc) are
# not treesitter-gated. The only "ScipGraph" / "symbol_lookup"
# strings here are tool-name literals in intent_policy + dossier;
# no source-level dependency on the gated APIs.
corpus-engine = { workspace = true }
# `LaneSources::meta_atlas` is a CELL, not a value: the desktop fires
# `backend-ready` and warms the ~900MB index in the background, then fills it
# in an already-shared `Arc<Runtime>`. One storage, lock-free snapshot per turn.
arc-swap = { workspace = true }
corpus-engine-notes = { workspace = true }
# Read-only SCIP call-graph access for code-intelligence-in-chat: the chat
# runtime opens a code corpus's `scip_graph.db` and renders a caller/callee
# trace into the synthesis evidence block (`corpus_engine_scip::trace`). This is
# the LEAN crate — rusqlite (bundled) + prost, NO tree-sitter grammars. We
# depend on it directly rather than `corpus-engine/treesitter` precisely to keep
# the 5 grammar crates out of every sovereign-core build; the grammars stay
# confined to the indexing path that WRITES the db (CLI `enrich` + the watcher).
corpus-engine-scip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
# The egress boundary (`src/egress.rs`, order deep-research-t2a): the
# ONE construction site for clients that carry remote-model payloads
# and search-query egress. The F26 census enforces that no other file
# constructs a reqwest client.
reqwest = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
tokio-util = { workspace = true }
toml = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Home-dir + platform-native config-dir resolution for setup_config.
# `default_path()` lives at `~/.svrnmesh/config.toml`; `legacy_default_path()`
# is the pre-consolidation XDG location used for one-shot migration.
dirs = "5"
# Tier 4 — tool-result cache hashes canonical args via SHA-256
# to derive the cache key. Workspace-version pin keeps lock-file
# coherent with the 9+ other crates that already use sha2.
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
sovereign-store = { workspace = true }
sovereign-tools = { workspace = true }
tempfile = "3"
# FR-6 decorrelation driver (`tests/fr6_decorrelation.rs`, order
# deep-research-t0b): the pure-HTTP OICP client supplies the live
# InferenceProvider the measurement runs both gate strings through.
# Lean — no llama.cpp anywhere in this crate's test build.
oicp-client = { path = "../../../oicp-client" }

[lints]
workspace = true
