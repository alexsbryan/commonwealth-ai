[package]
name = "sovereign-turn-client"
description = "The client half of the turn protocol — how a surface asks a serving host for a turn"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
# The protocol vocabulary, and the entire non-leaf dependency budget. This
# crate is deliberately the mirror of `oicp-client`: protocol types plus the
# client that speaks them, nothing above the contract layer.
sovereign-contracts = { workspace = true }

futures = { workspace = true }
# Leaf, same tier as serde_json beside it: the CRUD envelopes below are
# Deserialize-only parse shapes over the wire bytes serde_json already reads.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.29"
tracing = { workspace = true }
reqwest = { workspace = true }

[features]
default = []
# Does this build ship a backend it can bring up? See `src/reach.rs` — the
# capability is NAMED here rather than smuggled in as a networking detail,
# and it is a question about the BUILD, never about the platform (ARCH principle 12).
# It gates code only: no dependency hangs off it, so enabling it cannot move
# a dependency edge and the `sv-no-daemon-management` gate is unaffected by
# a build that turns it on.
bundled-backend = []

[lints]
workspace = true
