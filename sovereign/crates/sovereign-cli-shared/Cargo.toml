[package]
name = "sovereign-cli-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neutral filesystem + SCIP helpers shared between sovereign-cli binaries."

# Tiny lib crate hosting helpers used by every sibling binary. The
# baseline (always-on) modules are filesystem + git + CLI plumbing —
# nothing heavy. The `scip` module is gated behind the `scip` feature
# so binaries that don't need the merged-graph loader (and therefore
# don't need `corpus-engine`'s `treesitter` feature with its 5 grammar
# crates) can skip the transitive cost.

[dependencies]
corpus-engine-scip = { workspace = true, optional = true }
# Bottom-layer wall-clock SSOT — `project_toml` stamps `observed_at`. Depended
# on directly rather than through `sovereign-core::time`, which re-exports the
# same function but would drag corpus-engine + tokio + dashmap into a crate
# every sibling binary links.
sovereign-time = { workspace = true, optional = true }
# `observation` probes PATH for the SCIP exporters (scip-go, scip-typescript,
# …) so init can name a missing one instead of leaving an empty call graph.
# Pinned at 7 to match all four sovereign-cli-* binaries (ARCH §8.2).
which = { version = "8", optional = true }
# Only for `mcp_client` (feature-gated) — the daemon-first path for
# the work-atlas coordination tools.
reqwest = { workspace = true, optional = true }
dirs = "6"
# The rebrand-aware path SSOT — `dirs.rs` delegates to it instead of
# mirroring `resolve_branded_dir` by hand (the mirror drifted risk).
sovereign-contracts = { workspace = true }
serde = { workspace = true }
# Only for reading the journey nightly's `latest.json` in `cli_contract_report`
# — a report the CLI must be able to quote without shelling out to jq.
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# `observation` + `project_toml` bring their own unit tests (they write and
# re-read a real `.sovereign/project.toml` under a temp root). First
# dev-dependency this crate has needed — `cargo check` never builds
# `#[cfg(test)]`, so the lint gate stayed green while `cargo test` could not
# link. Both scripts, always.
tempfile = { workspace = true }

[features]
default = []
# Enables `sovereign_cli_shared::scip` (merged SCIP graph loader).
# Points at `corpus-engine-scip` directly post-carve-out (2026-05-23).
scip = ["dep:corpus-engine-scip"]
# Enables `sovereign_cli_shared::mcp_client` (daemon-first tool calls
# for the work-atlas coordination surface). Gated so binaries that
# never proxy skip the reqwest compile cost.
mcp-client = ["dep:reqwest"]
# Enables `sovereign_cli_shared::{observation, project_toml}` — the
# project-model pair. Hoisted out of `sovereign-cli-dev` (2026-08-07) when
# `project init` moved into the shipped dispatcher: init WRITES
# `.sovereign/project.toml`, while the workbench's `found` / `phase` /
# `audit` / `charter amend` READ it, so the model can no longer live in
# either binary alone. Gated because `observation` probes for SCIP exporters
# (`corpus-engine-scip`); binaries that never touch a project skip both.
project-model = ["dep:corpus-engine-scip", "dep:sovereign-time", "dep:which"]

[lints]
workspace = true
