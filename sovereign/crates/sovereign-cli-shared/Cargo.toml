[package]
name = "sovereign-cli-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neutral filesystem + SCIP helpers shared between sovereign-cli binaries."

# Tiny lib crate hosting helpers used by every sibling binary. The
# baseline (always-on) modules are filesystem + git + CLI plumbing —
# nothing heavy. The `scip` module is gated behind the `scip` feature
# so binaries that don't need the merged-graph loader (and therefore
# don't need `corpus-engine`'s `treesitter` feature with its 5 grammar
# crates) can skip the transitive cost.

[dependencies]
corpus-engine-scip = { workspace = true, optional = true }
# Only for `mcp_client` (feature-gated) — the daemon-first path for
# the work-atlas coordination tools.
reqwest = { workspace = true, optional = true }
dirs = "6"
# The rebrand-aware path SSOT — `dirs.rs` delegates to it instead of
# mirroring `resolve_branded_dir` by hand (the mirror drifted risk).
sovereign-contracts = { workspace = true }
serde = { workspace = true }
# Only for reading the journey nightly's `latest.json` in `cli_contract_report`
# — a report the CLI must be able to quote without shelling out to jq.
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
# Enables `sovereign_cli_shared::scip` (merged SCIP graph loader).
# Points at `corpus-engine-scip` directly post-carve-out (2026-05-23).
scip = ["dep:corpus-engine-scip"]
# Enables `sovereign_cli_shared::mcp_client` (daemon-first tool calls
# for the work-atlas coordination surface). Gated so binaries that
# never proxy skip the reqwest compile cost.
mcp-client = ["dep:reqwest"]

[lints]
workspace = true
