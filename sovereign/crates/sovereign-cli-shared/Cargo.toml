[package]
name = "sovereign-cli-shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI plumbing shared between the svrn CLI binaries."

# Tiny lib crate hosting helpers used by every sibling binary. The
# baseline (always-on) modules are filesystem + git + CLI plumbing —
# nothing heavy. The project model and the `scip` re-export left with
# pb-code-cli-base (the model is the code program's, sovereign-cli-dev).

[dependencies]
dirs = "5"
# The flag-surface derive. Every `sovereign-cli-*` binary that declares its
# flags as a struct reaches `flag_surface::parse` through here, so the seam has
# ONE home rather than one per CLI crate (§10.6). ~11 transitive crates against
# the 871 `sovereign-cli` already carries.
clap = { workspace = true }
# The rebrand-aware path SSOT — `dirs.rs` delegates to it instead of
# mirroring `resolve_branded_dir` by hand (the mirror drifted risk).
sovereign-contracts = { workspace = true }
# help, dirs, dispatcher, guest_link, urls, rail, repo, prompts, deprecation,
# tracing_init, models, mcp_client, code_index — the leaf half, re-exported at
# their historical paths (FIVE_PROGRAMS fp-98, pb-code-cli-base).
sovereign-cli-base = { workspace = true }
# The neutral kernel — `NightlyPosture::judgement` maps the lane's word onto
# the four verdicts and hands off age, formatting and the staleness band, so
# `svrn contract nightly` and `svrn posture` cannot disagree about what a lane
# verdict means (noun-convergence rung nc-10-judgement). Layer 0: down.
kernel-types = { workspace = true }
serde = { workspace = true }
# Only for reading the journey nightly's `latest.json` in `cli_contract_report`
# — a report the CLI must be able to quote without shelling out to jq.
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[features]
default = ["mcp-client", "rail-client"]   # build-latency bl-member-features: same resolution the workspace build already has; scope-invariant on purpose
# Enables `sovereign_cli_shared::mcp_client` (daemon-first tool calls
# for the work-atlas coordination surface), re-exported from
# `sovereign-cli-base` (pb-code-cli-base). Gated so binaries that
# never proxy skip the reqwest compile cost.
mcp-client = ["sovereign-cli-base/mcp-client"]
# Enables `sovereign_cli_shared::rail` — the ONE operator-side rail client
# (cw-lift 5e). It was `ring_cmd`'s private pair while `ring` and `job` were
# the only callers; `svrn quality check --distribute` is a third, and it lives
# in `sovereign-cli`. Gated because most siblings never touch a ring, and
# `commonwealth-rail-core` is what defines `RailAct` — the act is typed on the way
# out, so a caller cannot spell the wire form wrong and learn about it from a
# 422 (ARCH §10.6).
rail-client = ["sovereign-cli-base/rail-client"]

[lints]
workspace = true
