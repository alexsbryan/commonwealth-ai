[package]
name = "sovereign-tools"
version.workspace = true
edition.workspace = true

# Build-time only: parse corpus-engine/src/recipe.rs to generate the
# recipe-author JSON Schema variant catalog (see build.rs + recipe_author/
# recipe_schema.rs). Keeps the author tool's grammar from drifting behind the
# real recipe types. Not linked into the runtime binary.
[build-dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
serde_json = "1"

[dependencies]
sovereign-core = { workspace = true }
# Atlas peer-advice (Phase C3) consumes `CorpusShardInfo` from
# commonwealth-core's gossip schema. One-way dep: sovereign-tools
# never re-enters commonwealth-* (path break is enforced by
# rustc, not just convention).
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
# `DriftTool` calls `sovereign_atos::approval::{find_approval,
# detect_drift, current_spec_hash}` so its verdict matches the
# daemon's approval_gate middleware exactly. The dep is one-way
# (sovereign-atos depends on sovereign-core only); no cycle.
sovereign-atos = { workspace = true }
# Work atlas — `blast` queries it to surface concurrent claims in
# the same response (§8 of the spec). One-way dep: work-atlas does
# not depend on sovereign-tools.
sovereign-work-atlas = { workspace = true }
corpus-engine = { workspace = true }
corpus-engine-archaeology = { workspace = true }
corpus-engine-notes = { workspace = true }
# SCIP call graph types — carved out of corpus-engine 2026-05-23.
# Used by code/{callers,callees,blast_radius,symbol_lookup,index_health}.
corpus-engine-scip = { workspace = true }
corpus-engine-atos = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
glob = "0.3"
quick-xml = "0.37"
flate2 = "1"
bzip2 = "0.5"
parquet = { workspace = true }
arrow = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
arc-swap = { workspace = true }
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport"], optional = true }
# Code Intelligence tools (symbol_lookup / code_search / recent_changes)
chrono = { version = "0.4", features = ["clock"] }
# Resolve `~` for `~/.sovereign/enrichment/<corpus>/config.json`
# in the watched-folder enrichment driver. Same pattern the CLI's
# enrich_cmd uses; pinning `dirs` here keeps the resolver
# colocated with its only caller.
dirs = "5"
lancedb = { workspace = true }
arrow-array = { workspace = true }
# Document parsing (RAG pipeline)
pdf-extract = "0.7"
# `pdf-extract 0.7.12` writes "unknown glyph name" / "Unicode mismatch"
# diagnostics with raw `println!` (lib.rs:461,479) — bypasses our
# tracing layer and floods launchd's `daemon.out` (5MB+ per few hours
# on a small folder). `safe_extract_pdf_text` swaps stdout to
# `/dev/null` around the call via `libc::dup2` so the noise can't
# escape. Unix-only; the daemon does not build for Windows.
libc = "0.2"
# HTML body-text extraction for `.html` / `.htm` / `.mhtml` watched
# folders. Same version as `corpus-engine`'s recipe-driven HTML
# extractor so the workspace resolves a single `scraper`.
scraper = "0.20"
# `scraper::Html.tree` is `ego_tree::Tree<Node>`; we walk it directly
# in `html_body_text` to strip `<script>`/`<style>` subtrees. Already
# a transitive dep via `scraper` — adding it explicitly so the
# tree-walk types are nameable in the signatures.
ego-tree = "0.6"
# MIME parser for `.mhtml` (single-file web archive, e.g. SingleFile
# output, Save Page As → Webpage Complete). We walk the multipart
# body, take the first `text/html` part, and route it through the
# same `html_body_text` routine as standalone HTML files.
mail-parser = "0.10"
# EPUB extractor. Apache-2.0 (workspace is MIT — compatible). Reads
# zip + OPF in memory; no on-disk extraction, preserving the
# watched-folder read-only-on-source invariant. We walk the spine,
# pull each chapter's XHTML, and route it through `html_body_text`.
# (`rbook` chosen over the GPL-3 `epub` crate for licence
# compatibility, and over `lib-epub` for maintenance.)
rbook = "0.7"
# DOCX text extractor. Read-only, minimal-deps, MIT/Apache-2.0.
# Chosen over `docx-rs` (writer-first, heavier surface) because v1
# only needs paragraph text — header/footer/footnote handling is
# deferred to v1.x.
docx-lite = "0.2"
# OCR pipeline for scanned PDFs in the folder-drop flow:
#   pdfium-render rasterizes pages to images, the tesseract sidecar
#   produces raw text, the daemon's fast slot cleans up via
#   /v1/chat/completions. See `local_corpus::ocr` for the architecture.
# pdfium-render binds to a runtime-loaded libpdfium.dylib; the desktop
# bundles it as a Tauri resource and OcrCtx.pdfium_lib_path points at
# it. `image_latest` matches the version of `image` we pull below.
pdfium-render = { version = "0.9", features = ["thread_safe"] }
image = "0.25"
# Stable, cryptographic short-hash for deriving corpus IDs from a
# canonicalised root path. Used by local_corpus::config and by the
# splice-extension module's CHARTER.md drift detector (mirroring
# sovereign-atos::approval::detect_drift without the cross-crate dep).
sha2 = { workspace = true }
# Content-derived stable keys for atlas atoms in `atlas_view`. Lets
# Phase 2's curation overlay key edits by content hash instead of the
# volatile sequential AtomId — see decision note "Atlas inspector:
# stable_key by content hash". Same major as corpus-engine's blake3
# so the workspace resolves a single version.
blake3 = "1"
# Recursive directory walking for the PreScanner; keeps hidden-dir
# filtering (`.obsidian`, `.git`) a single-call predicate.
walkdir = "2"
# Atomic config-file writes (write-to-temp + rename) in
# `local_corpus::manager`.
tempfile = { workspace = true }
# YAML parsing for Obsidian frontmatter merge (M5 write-back). Uses
# `indexmap` internally so key order round-trips.
serde_yaml = "0.9"
# KnowledgeView acquirers (SqliteAcquirer dumps rows to JSONL for the
# existing Jsonl extractor). Uses the same `bundled` feature as
# sovereign-store so both crates link against one libsqlite3.
rusqlite = { version = "0.35", features = ["bundled"] }
# `notify` drives the SpecWatcher used to invalidate the
# spec-presence cache + push MCP `notifications/tools/list_changed`
# events when `.sovereign/features/*/spec.md` or `ARCHITECTURE.md`
# changes. Same major version as sovereign-mesh's reindexer use to
# keep the lockfile single-resolved.
notify = "8"
# Gitignore-syntax parser for the watched-folder `.sovereignignore`
# file (spec §5.4 layer 2). Same version as sovereign-mesh so the
# workspace resolves a single `ignore` across both crates.
ignore = "0.4"
# Conv-tiered provider (`conv_tiered_provider`) needs SqliteStateStore
# for the conv_skeletons / conv_raptor_nodes / conv_motifs persistence
# surface. Production dep, not test-only — promoted from
# `[dev-dependencies]` 2026-05-22 when `CONV_TIERED_PORT.md` shipped.
sovereign-store = { workspace = true }
# Pure-Rust GLiNER inference for the per-chunk entity-extraction
# surface (spec CONV_TIERED_PORT.md Phase 1 — chunk_entities). Uses
# `ort` under the hood for ONNX execution; tokenizer + label-prompt
# pipeline implemented in Rust. Gated behind `gliner-ner` so
# headless daemon builds that don't need NER can skip the ~10MB ort
# binary delta. Validated 2026-05-23 against the corpus's RAPTOR
# primary_entities — ~10x denser coverage, eliminates the
# 151-Tiny-conv empty-entity gap.
gline-rs = { version = "1", optional = true }
# gline-rs re-exports `orp` (its ONNX runtime params layer) through
# `gliner::*` for most uses but the public `RuntimeParameters` type
# is in `orp::params`. Direct dep pinned to keep the path
# importable; gated behind the same feature.
orp = { version = "0.9", optional = true }
# Regex strips conv role markers (`### [date] user`, etc) before
# feeding chunk text to GliNER — otherwise "assistant" gets tagged
# as a Person in every chunk. Production dep regardless of feature
# because `regex` is small and probably needed elsewhere soon.
regex = { workspace = true }
# ── PaddleOCR engine (feature `paddle-ocr`) ──────────────────────────
# An in-process OCR engine that drives the SAME ONNX Runtime already
# linked for GLiNER (`ort`), rather than the tesseract subprocess. We
# pin `ort` to EXACTLY `=2.0.0-rc.9` to unify with orp's exact pin — a
# single onnxruntime, GLiNER untouched. This is deliberate: the GLiNER
# stack (orp/gline-rs) cannot move off rc.9 (build-verified that rc.10
# throws 4 errors and rc.12 throws 60 — SessionOutputs lifetimes,
# Session::run &mut self, ort::Error losing Send/Sync), so off-the-shelf
# PaddleOCR crates (which want rc.10+) are unusable and we drive ort
# directly at rc.9. `ndarray` feature for tensor I/O. `default-features`
# left on to match orp (linking strategy + std unify across the graph).
ort = { version = "=2.0.0-rc.9", optional = true, features = ["ndarray"] }
# Tensor construction / extraction. 0.16 matches the version ort rc.9
# resolves (the lockfile pins 0.16.1) — do NOT bump to 0.17 (rc.12 era).
ndarray = { version = "0.16", optional = true }
# DBNet detection post-processing: `find_contours` on the binarized
# probability map. Same CV lib the off-the-shelf `oar-ocr` crate uses.
imageproc = { version = "0.26", optional = true }
# Polygon offset ("unclip") for detection boxes. Already in the tree
# transitively (4.0.7); pinning `4` here resolves the single version.
i_overlay = { version = "4", optional = true }

[features]
default = []
email = ["lettre"]
treesitter = ["corpus-engine/treesitter"]
gliner-ner = ["dep:gline-rs", "dep:orp"]
# PaddleOCR (ONNX) OCR engine. Off by default so headless/default builds
# don't pull the OCR inference surface; the desktop enables it once the
# bake-off greenlights swapping it in for tesseract.
paddle-ocr = ["dep:ort", "dep:ndarray", "dep:imageproc", "dep:i_overlay"]

[dev-dependencies]
# Zip writer for hand-building minimal DOCX fixtures in
# `extract_stage` tests. Adding `docx-rs` here was rejected because
# it activates the `encoding` feature on quick-xml 0.36, which
# breaks corpus-engine's `Attribute::unescape_value()` call via
# workspace feature unification.
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
filetime = "0.2"
# axum is the HTTP stub harness for `notes::diff_extract_backend`
# tests — spins up `/v1/chat/completions` on an ephemeral port so
# we can exercise `LocalLlmBackend` without a live daemon. Production
# code does NOT depend on axum.
axum = { workspace = true }
# Levenshtein for the OCR bake-off's CER/WER scoring (examples/paddle_bakeoff).
# Already in the tree (0.11.1); dev-only since only the example uses it.
strsim = "0.11"
# Glassbox tracing for the bake-off harness — surfaces the engine's
# per-stage info!/debug! (session i/o names, box counts, shapes) so a
# reader of the run can see inside the PP-OCR pipeline. RUST_LOG-gated.
tracing-subscriber = { workspace = true }

# Examples that import treesitter-gated symbols (SymbolLookupTool,
# ScipGraphHandle, etc.) only compile when the matching crate
# feature is on. Declaring `required-features` lets `cargo test`
# / `cargo check` skip them under the default feature set instead
# of failing the workspace build.
[[example]]
name = "exercise_code_tools"
required-features = ["treesitter"]

# Tesseract-vs-PaddleOCR bake-off harness. Compiles only with the
# `paddle-ocr` feature; runs both engines on a scanned PDF and emits a
# side-by-side quality/latency comparison (+ CER/WER if a ground-truth
# .txt is supplied). See the OCR engine-swap plan.
[[example]]
name = "paddle_bakeoff"
required-features = ["paddle-ocr"]

# Headless PaddleOCR over per-case Blue Book page JPGs (UAP data-prep).
[[example]]
name = "ocr_images"
required-features = ["paddle-ocr"]

[lints]
workspace = true
