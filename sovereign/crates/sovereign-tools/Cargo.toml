[package]
name = "sovereign-tools"
version.workspace = true
edition.workspace = true

[dependencies]
sovereign-core = { workspace = true }
corpus-engine = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
glob = "0.3"
quick-xml = "0.37"
flate2 = "1"
bzip2 = "0.5"
parquet = { version = "55", default-features = false, features = ["arrow"] }
arrow = { version = "55", default-features = false, features = ["json"] }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport"], optional = true }
# Code Intelligence tools (symbol_lookup / code_search / recent_changes)
chrono = { version = "0.4", features = ["clock"] }
lancedb = "0.27"
arrow-array = "57"
# Document parsing (RAG pipeline)
pdf-extract = "0.7"

[features]
default = []
email = ["lettre"]
treesitter = ["corpus-engine/treesitter"]

[dev-dependencies]
sovereign-store = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
filetime = "0.2"
