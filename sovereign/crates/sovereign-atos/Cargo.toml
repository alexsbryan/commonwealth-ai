[package]
name = "sovereign-atos"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[dependencies]
# Stores the orchestrator operates over. `treesitter` dropped
# 2026-05-22 — sovereign-atos uses NoteStore/FeatureStore/EmbedFn,
# none of which are treesitter-gated.
corpus-engine = { workspace = true }
corpus-engine-atos = { workspace = true }
corpus-engine-notes = { workspace = true }

# Optional Fast-slot classification pass in teardown. The library
# works without an InferenceProvider — the caller passes None.
sovereign-core = { workspace = true }

# Session-state backend. Cross-workspace path dep; sovereign-atos
# reads and writes AtosSessionState / FeatureApproval rows into the
# same gossip-replicated KV store Commonwealth uses for inference
# state + mesh membership.
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state" }
commonwealth-core  = { path = "../../../commonwealth/crates/commonwealth-core" }
bytes = "1"
# SHA-256 for spec content hashing.
sha2 = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
pulldown-cmark = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
