[package]
name = "sovereign-atos"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[dependencies]
# Stores the orchestrator operates over. `treesitter` dropped
# 2026-05-22 — sovereign-atos uses NoteStore/FeatureStore/EmbedFn,
# none of which are treesitter-gated.
corpus-engine = { workspace = true }
corpus-engine-atos = { workspace = true }
corpus-engine-notes = { workspace = true }

# Optional Fast-slot classification pass in teardown. The library
# works without an InferenceProvider — the caller passes None.
# `sovereign_core::middleware` also carries the middleware seam
# (`sovereign-contracts`) and the `.sovereign/` path conventions the
# middlewares in `src/middleware/` name.
sovereign-core = { workspace = true }

# The ATOS middlewares build and inspect `ChatCompletionRequest` /
# `ToolDescriptor`; the wire vocabulary lives on the family-neutral floor.
oicp-types = { workspace = true }

# Session-state backend. Cross-workspace path dep; sovereign-atos
# reads and writes AtosSessionState / FeatureApproval rows into the
# same gossip-replicated KV store Commonwealth uses for inference
# state + mesh membership.
commonwealth-state = { workspace = true }
commonwealth-core  = { workspace = true }
bytes = "1"
# SHA-256 for spec content hashing.
sha2 = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
pulldown-cmark = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The canonical middleware test fixtures (`middleware::fixtures`), off by
# default on the leaf. The middleware test modules name them directly.
sovereign-contracts = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
