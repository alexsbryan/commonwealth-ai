[package]
name = "sovereign-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

# The assembled-host process (docs/FIVE_PROGRAMS.md §11 step 10) — the
# run path the `svrn daemon` verb `exec`s into, and the process
# launchd/systemd units point at. `treesitter` because `daemon_cmd`
# mounts `bootstrap` and `tool_registry`, both gated on the feature the
# daemon binary enables unconditionally (see lib.rs).
[[bin]]
name = "sovereign-daemon"
path = "src/bin/sovereign-daemon.rs"
required-features = ["treesitter"]

[dependencies]
# Commonwealth crates (embedded as library)
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
commonwealth-discovery = { path = "../../../commonwealth/crates/commonwealth-discovery" }
# Join-key hash + format check (fp-9): the pure leaf, not the bootstrap crate.
mesh-join-vocab = { workspace = true }
commonwealth-media = { path = "../../../commonwealth/crates/commonwealth-media" }
# The rail's VOCABULARY only (fp-54): the journals live at the serving
# process, so the daemon names the shared leaf's types (Op, Roster,
# Admission, RailAct) and dials `/v1/rail/*` through the port
# (`rails_client::RailsRingRail`) — no journal crate.
commonwealth-rail-core = { workspace = true }
# `features = ["iroh"]`: the daemon's dial-by-key binding is compiled into the
# default build — runtime-gated by `[iroh] enabled`, not cfg-gated. `fanout`
# because `media_fanout` calls the fan-out core where it lives (ARCH §8.3).
commonwealth-transport = { path = "../../../commonwealth/crates/commonwealth-transport", features = ["iroh", "fanout"] }
# Fabric's own crate — the host cluster names it for the state and the loops
# that stay behind (DC §4.1; `[[forbid]] sovereign-mesh -> sovereign-daemon`
# keeps the arrow one-way).
sovereign-mesh = { workspace = true }
# The daemon-to-daemon wire bodies the ring-sync route receives and the loops
# send; a leaf both may name (domains dm-daemon-api-edge (a)).
sovereign-peer-wire = { workspace = true }
sovereign-contracts = { workspace = true }
# The data-root lock (`daemon_cmd/boot.rs`).
host-kit = { workspace = true, features = ["shell", "http", "task", "jobs"] }
kernel-types = { workspace = true }
oicp-types = { workspace = true }
# The HTTP client to serve and to a terminal's entry node
# (`SplitInferenceProvider`, a package leaf; pb-serve-distributes repointed it
# from `sovereign_inference::remote`, which re-exported this crate).
oicp-client = { workspace = true }
sovereign-serving-host = { path = "../sovereign-serving-host" }
sovereign-core = { workspace = true }
sovereign-time = { workspace = true }
# The bearer-token compare (client_auth.rs, client_tokens.rs). Already in the
# lock through the TLS stack; named here so svrn does not reach into
# commonwealth-core for a security primitive (pb-mesh-exit-core).
subtle = "2.6"
sovereign-tools = { workspace = true }
sovereign-meshapp = { workspace = true }
sovereign-store = { workspace = true }
sovereign-authoring-harness = { workspace = true }
# The host cluster's own deps, arriving with sovereign-api's modules at
# domains `dm-daemon-api-edge` (2026-09-18): the admission policy, the grant
# store, the next-edit package crate, the HTTP body seam, the canonical-sync
# codec and the small leaves the edge reads.
serving-policy-core = { workspace = true }
sovereign-grants = { workspace = true }
code-next-edit = { path = "../../../code-next-edit" }
corpus-engine = { workspace = true, features = ["treesitter"] }
corpus-engine-scip = { workspace = true }
# Leaf items the engine re-exports (types, error, index, corpus) — spelled at their owner.
corpus-index = { workspace = true }
corpus-engine-atlas-reader = { workspace = true }
corpus-engine-yield = { workspace = true }
understanding-vocab = { workspace = true }
oplog = { workspace = true }
http-body = "1"
arc-swap = { workspace = true }
sha2 = { workspace = true }
tar = "0.4"
zstd = "0.13"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
dirs = "5"
# The composition half of `sovereign-cli-daemon`'s `daemon_cmd` (domains
# `dm-daemon-cli-composition`, DAEMON_CORE.md §4.1 row 4) reaches these
# directly now: the solve surface (`sovereign-tdd`) and the watched-folder
# workflow runtime (`sovereign-workflow`, `sovereign-workflow-host`). All at
# `capabilities`/`runtime`/`knowledge`, below this crate's `mesh-api`.
sovereign-tdd = { workspace = true }
sovereign-workflow = { workspace = true }
sovereign-workflow-host = { workspace = true }
# The run path (`daemon_cmd`) commissions the ONE Runtime through the
# shared recipe — the same one `svrn chat` uses, so the daemon cannot
# acquire a private dialect of the retrieval stack — and names the
# loopback knowledge source through the turn client. Neither depends on
# this crate (leaf/tier below `mesh-api`), so the edges stay acyclic.
sovereign-runtime-recipe = { workspace = true }
sovereign-turn-client = { workspace = true }

async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["timeout"] }
thiserror = { workspace = true }
toml = { workspace = true }
# fp-70's one-time media migration removes `[iroh] media_viewer_user` from a
# person's config.toml in place, comments kept.
toml_edit = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
# The bin's subscriber bootstrap (`init_tracing` twin) — the daemon
# verb's filter allowlist, EnvFilter-driven.
tracing-subscriber = { workspace = true }
hex = "0.4"
hostname = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tokio-stream = { version = "0.1", features = ["sync"] }
if-addrs = "0.13"
chrono = { workspace = true }
tempfile = "3"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

# `listener_watch`'s self-SIGTERM on a lost client listener (moved here with
# the composition half at domains `dm-daemon-cli-composition`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Gates `bootstrap` and `tool_registry`, and forwards to the crates whose
# tree-sitter surfaces they reach. (It enabled `project_http`, the SCIP-graph
# route shell, until that left with the code program at pb-code-daemon-exit.)
treesitter = [
    "sovereign-mesh/treesitter",
    "sovereign-tools/treesitter",
]
# The headless OCR installer. The cfg gate moved here with the composition
# half (domains `dm-daemon-cli-composition`); the binary's features forward
# to these.
ocr = ["sovereign-tools/paddle-ocr"]
# Moved with the iroh e2e tests from sovereign-mesh's test tree.
iroh-experimental = ["sovereign-mesh/iroh-experimental"]

[dev-dependencies]
# `next_edit_symbol_lane_e2e` builds a real `ScipGraph`.
arc-swap = { workspace = true }
corpus-engine-scip = { workspace = true }
# `solve_http`'s route test drives the router with `tower::ServiceExt`.
tower = { workspace = true, features = ["util"] }
# The host cluster's own integration tests, moved from sovereign-api at
# domains `dm-daemon-api-edge`: `rail_e2e` installs a real ring signer and
# the loopback-vs-remote split drives the router with `tower::oneshot`.
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
http-body-util = "0.1"
# `client_tokens_e2e` captures the admit line to prove it names the LABEL and
# not the token (bar `tg-token-revoked-alone`, clause c).
tracing-subscriber = { workspace = true }
# Moved with turn_surface.rs from sovereign-mesh's test tree.
tokio-tungstenite = "0.29"
# The tests that only slot a corpus handle hold `IngestPortDouble`
# (pb-ingest-dial-daemon-tests-slot).
corpus-index = { workspace = true, features = ["test-doubles"] }

[lints]
workspace = true
