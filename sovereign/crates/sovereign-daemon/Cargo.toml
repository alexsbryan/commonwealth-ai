[package]
name = "sovereign-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Commonwealth crates (embedded as library)
commonwealth-core = { path = "../../../commonwealth/crates/commonwealth-core" }
commonwealth-discovery = { path = "../../../commonwealth/crates/commonwealth-discovery" }
commonwealth-media = { path = "../../../commonwealth/crates/commonwealth-media" }
commonwealth-rail = { workspace = true }
commonwealth-state = { path = "../../../commonwealth/crates/commonwealth-state" }
# `features = ["iroh"]`: the daemon's dial-by-key binding is compiled into the
# default build — runtime-gated by `[iroh] enabled`, not cfg-gated. `fanout`
# because `media_fanout` calls the fan-out core where it lives (ARCH §8.3).
commonwealth-transport = { path = "../../../commonwealth/crates/commonwealth-transport", features = ["iroh", "fanout"] }
commonwealth-work = { workspace = true, features = ["process"] }
# Fabric's own crate — the host cluster names it for the state and the loops
# that stay behind (DC §4.1; `[[forbid]] sovereign-mesh -> sovereign-daemon`
# keeps the arrow one-way).
sovereign-mesh = { workspace = true }
# The daemon-to-daemon wire bodies the ring-sync route receives and the loops
# send; a leaf both may name (domains dm-daemon-api-edge (a)).
sovereign-peer-wire = { workspace = true }
sovereign-code = { workspace = true }
sovereign-contracts = { workspace = true }
kernel-types = { workspace = true }
oicp-types = { workspace = true }
sovereign-meshapp-registry = { workspace = true }
sovereign-serving-host = { path = "../sovereign-serving-host" }
sovereign-scheduler = { workspace = true }
sovereign-work-atlas = { workspace = true }
sovereign-core = { workspace = true }
sovereign-time = { workspace = true }
sovereign-inference = { workspace = true }
sovereign-gliner = { workspace = true }
sovereign-tools = { workspace = true }
sovereign-enrichment-catalog = { workspace = true }
sovereign-meshapp = { workspace = true }
sovereign-store = { workspace = true }
sovereign-authoring-harness = { workspace = true }
# The host cluster's own deps, arriving with sovereign-api's modules at
# domains `dm-daemon-api-edge` (2026-09-18): the admission policy, the grant
# store, the next-edit package crate, the HTTP body seam, the canonical-sync
# codec and the small leaves the edge reads.
serving-policy = { workspace = true }
sovereign-grants = { workspace = true }
code-next-edit = { path = "../../../code-next-edit" }
corpus-engine = { workspace = true, features = ["treesitter"] }
tree-sitter = "0.26"
corpus-engine-scip = { workspace = true }
corpus-engine-notes = { workspace = true }
corpus-engine-atos = { workspace = true, optional = true }
sovereign-atos = { path = "../sovereign-atos", optional = true }
http-body = "1"
arc-swap = { workspace = true }
sha2 = { workspace = true }
tar = "0.4"
zstd = "0.13"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
dirs = "5"
# The composition half of `sovereign-cli-daemon`'s `daemon_cmd` (domains
# `dm-daemon-cli-composition`, DAEMON_CORE.md §4.1 row 4) reaches these
# directly now: the solve surface (`sovereign-tdd`), the compute-child
# supervisor (`sovereign-compute`), the watched-folder lint/test stores
# (`corpus-engine-watchers`), the ephemeral worker pod (`sovereign-pods`), the
# watched-folder workflow runtime (`sovereign-workflow`,
# `sovereign-workflow-host`) and the in-process atlas build
# (`sovereign-enrichment-build`). All at `capabilities`/`runtime`/`knowledge`,
# below this crate's `mesh-api`.
sovereign-tdd = { workspace = true }
sovereign-compute = { workspace = true }
corpus-engine-watchers = { workspace = true }
sovereign-pods = { path = "../sovereign-pods" }
sovereign-workflow = { workspace = true }
sovereign-workflow-host = { workspace = true }
sovereign-enrichment-build = { workspace = true }

async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true, features = ["timeout"] }
thiserror = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
hex = "0.4"
hostname = { workspace = true }
reqwest = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
if-addrs = "0.13"
chrono = { workspace = true }
tempfile = "3"
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

# `listener_watch`'s self-SIGTERM on a lost client listener (moved here with
# the composition half at domains `dm-daemon-cli-composition`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Enables `project_http` — the SCIP-graph route shell, which reads
# `sovereign_mesh::reindexer` and therefore mesh's `treesitter`. Off by
# default so binaries that never serve the project surface don't drag in
# `corpus-engine`'s 5 tree-sitter grammar crates.
treesitter = ["sovereign-mesh/treesitter", "sovereign-tools/treesitter"]
# The daemon's ATOS code-intel tools on the MCP surface and the headless OCR
# installer. Both cfg gates moved here with the composition half (domains
# `dm-daemon-cli-composition`); the binary's features forward to these.
atos = ["sovereign-tools/atos", "dep:sovereign-atos", "dep:corpus-engine-atos"]
ocr = ["sovereign-tools/paddle-ocr"]

[dev-dependencies]
# `project_http`'s test module builds a `Reindexer` over a real `ScipGraph`.
arc-swap = { workspace = true }
corpus-engine-scip = { workspace = true }
# `solve_http`'s route test drives the router with `tower::ServiceExt`.
tower = { workspace = true, features = ["util"] }
# The host cluster's own integration tests, moved from sovereign-api at
# domains `dm-daemon-api-edge`: `rail_e2e` installs a real ring signer, the
# loopback-vs-remote split drives the router with `tower::oneshot`, and the
# middleware fixtures come from sovereign-contracts' `test-fixtures`.
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros"] }
http-body-util = "0.1"
sovereign-contracts = { workspace = true, features = ["test-fixtures"] }
# `client_tokens_e2e` captures the admit line to prove it names the LABEL and
# not the token (bar `tg-token-revoked-alone`, clause c).
tracing-subscriber = { workspace = true }

[lints]
workspace = true
