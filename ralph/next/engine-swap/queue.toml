# engine-swap: the embedded engine to a supervised llama-server, then delete.
# Plan: ~/dev/svrn-docs/ENGINE_SWAP_PLAN.md (milestones A-G, decisions of
# 2026-10-11 and 2026-10-12).
#
# It runs under eutropia (operator, 2026-10-23) on eutropia's queue branch,
# never main (merging to main is the operator's), on two machines: a Mac
# (macOS, 64 GB, Metal; its daemon in remote mode, no local model) and the
# Halo (Linux, 128 GB, ROCm/Vulkan; inside the `sovereign-vulkan` toolbox; it
# hosts the deployed daemon). MACHINES.md beside this file says which row needs
# which. The checks below name no host path: $HOME and SOVEREIGN_MODELS_DIR
# hold on both, and the toolbox shares the host's $HOME. The worker's
# permission contract is .eutropia/claude-settings.json (the harness reads it
# before ralph/claude-settings.json).
#
# Until 2026-10-16 it ran as ralph's pool (3 lanes, in the worktree
# commonwealth-ai-engine-swap on branch `engine-swap`); worker_bin and
# settings below are ralph's keys, which eutropia reads and does not act on.
#
# heavy.txt allows one timing row per wave; conflicts.txt keeps rows on the
# same files out of one wave. HUMAN- rows are the seat's (host grant: restart
# the daemon, 2026-09-28): the loop holds them and runs on.
label = "engine-swap"
session_timeout = 7200
audit_every = 8
# Each lane gets a copy-on-write clone of a warm target/ (eutropia design §6,
# "Lanes"): prepare builds the queue's template before this machine claims,
# setup clones it into each new lane (63 s vs 142 s for a lane check, measured
# 2026-10-23 at b18972cd0, eutropia 5199ee9).
lane_prepare = ["sh", "scripts/eutropia/cargo-target", "prepare", "--", "scripts/with-cargo-lock.sh", "cargo", "check", "--workspace", "--all-targets", "--features", "corpus-engine/treesitter,sovereign-cli/dev-tools"]
lane_setup = ["sh", "scripts/eutropia/cargo-target", "setup"]
# eutropia's own pushes (claims, heartbeats, landings) skip the pre-push hook;
# its gate runs once per landing as the land check below (eutropia D10).
push_hooks = "skip"
# Machine fit (eutropia design §8): every word a row may need. The Mac
# provides [macos, metal]; the Halo [linux, rocm, vulkan, halo-daemon, halo].
# `halo` is any Halo-only reason, the heavy timing rows included, so a binary
# that ignores heavy.txt still keeps them off the Mac.
needs = ["macos", "metal", "linux", "rocm", "vulkan", "halo-daemon", "halo"]
worker_bin = "scripts/ralph-claude-shim.sh"
settings = "ralph/claude-settings.json"

[models]
# Rows run on DeepSeek V4.1 Flash (the 1017 snapshot) through DeepInfra
# (opencode, operator 2026-10-23); a machine whose harness lacks the DeepInfra
# key fails that probe and runs Opus. Review and resolve stay on Opus.
worker = "deepinfra/deepseek-ai/DeepSeek-V4.1-Flash-1017,claude-opus-5-5"
review = "claude-opus-5-5"
resolve = "claude-opus-5-5"
variant = "medium"

[checks]
land = ["bash", "ralph/next/engine-swap/land.sh"]
# The live router e2e on build.sh's binary (target/debug/llama-server, which a
# lane's reflink-cloned target carries). Models from SOVEREIGN_MODELS_DIR when
# the host sets it, else the main checkout's sovereign/models under $HOME: the
# same tree on the Mac (/Users/...) and the Halo, where the sovereign-vulkan
# toolbox shares the host's $HOME. No host path is written here. The test is
# cfg(target_os = "linux"), so elsewhere cargo runs 0 tests and exits 0: a run
# with no passed test exits 4, never-ran rather than passed.
router-e2e = ["bash", "-c", "set -o pipefail; log=$(mktemp); SOVEREIGN_MODELS_DIR=\"${SOVEREIGN_MODELS_DIR:-$HOME/dev/commonwealth-ai/sovereign/models}\" ./scripts/with-cargo-lock.sh cargo test -p sovereign-stock --test llama_server_router_e2e -- --ignored --nocapture 2>&1 | tee \"$log\" || exit $?; grep -q '^test result: ok\\. [1-9]' \"$log\" || { echo 'router-e2e: no test ran (llama_server_router_e2e is cfg(target_os = linux)): never-ran, not passed' >&2; exit 4; }"]
# Memory available for the run's own need (headroom.py: 16 GB, one live-run
# model of at most 12 GB plus its working set; a row that loads more passes
# its GB as an argument). Linux reads MemAvailable, macOS vm_stat; memory a
# deployed daemon already holds is excluded on both, so no host's resident
# model is guessed at (the 60 GB bar of the 2026-10-09 OOM was the Halo's).
headroom = ["python3", "ralph/next/engine-swap/headroom.py"]
# No llama-server or ggml-rpc-server running without a sovereign-stock above
# it: a deployed daemon's own router (after HUMAN-es-host-flip) is not an orphan.
no-orphans = ["python3", "ralph/next/engine-swap/no_orphans.py"]
boundary = ["bash", "-c", "cargo xtask boundary-gate; cargo xtask clone-gate; true"]
