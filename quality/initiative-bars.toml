# --- E: the resource-economy bars (NATIVE_GROUNDING_ECONOMY.md) -----------
#
# Declared 2026-08-12 by order native-grounding-respec-economy, which produced
# sovereign/docs/specs/NATIVE_GROUNDING_ECONOMY.md — the plan that SUPERSEDES
# NATIVE_GROUNDING_PARITY_PLAN.md by name.
#
# WHY THESE EXIST AS SEPARATE BARS rather than as an amendment to H0's five.
# H0's clauses are the spec's destination and this plan does not re-litigate
# them (its own §0). These bars are about the ROUTE: they are falsifiable
# properties of the PLAN, not of the native stack. H0-latency says "5x better
