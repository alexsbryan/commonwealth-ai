derives_from = "NATIVE_GROUNDING_ECONOMY.md §8.2, §8.3; NATIVE_GROUNDING.md §5 H3 / §7.3 H3"
bar = "a two-sequence lockstep decode on the primary at alpha=0 (bit-identical output by construction) reports its decode throughput ratio vs the single-sequence baseline; >=0.80x schedules Phase 4A, <0.80x kills H3 for this objective on the record (Phase 4B)"
kill = "throughput < 0.80x -> H3 killed for the wall-time objective; the prose surrogates it would have replaced survive on FUNCTION and the LOC target is restated downward with the arithmetic"
declared = "2026-08-12"
evidence_note = """This bar SUPERSEDES the >=0.45x decode-throughput clause in
NATIVE_GROUNDING.md §7.3 H3 for the purposes of the wall-time objective, and the
arithmetic is in ECONOMY §8.2: taking the best measured warm run (retrieval 32.6
+ synth 25.4 + gate 21.8 = 79.8s) and granting H3 everything it promises on the
gate side, 0.45x throughput yields a 91.0s turn — WORSE than today's best turn.
0.80x yields 66.4s. The spec's declared floor fails this objective's arithmetic.

Verified before scheduling (#4): NO H3 prototype exists on any branch. An
exhaustive sweep of skunkworks/native-grounding for `contrastive`, `noctx`,
`cad`, a decoding alpha, logit-level ablation and new maskers at
ConstrainedSampler::sample returns nothing but the spec's own prose (§5 H3,
lines 217-241). The sampler gained exactly one function there: seed resolution.
H3 was never started, in any form.

The probe is nonetheless CHEAP, because the substrate was built off main:
sovereign-inference/src/k_sample.rs (~1,184 lines, branch-only, zero runtime
callers) is a working multi-sequence decoder with n_seq_max and shared-prefix
copy_kv_cache_seq fan-out that drove a 36B over 4,207 pairs x 3 arms at 0.49
pairs/s. It is independent k-way sampling, not lockstep logit combination — so
it is not H3 — but it retires the question of whether multi-sequence decode
works on this stack at all."""

  [[initiative.bar.transition]]
  on = "2026-08-12"
  to = "declared"
  by = "sovereign/docs/specs/NATIVE_GROUNDING_ECONOMY.md §8.3"
