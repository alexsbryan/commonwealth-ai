# initiative-bars.toml — WHAT AN INITIATIVE PROMISED, as data.
#
# Orders have accountability structure: a falsifiable Objective, a Lane, a
# landing verdict, a status. Initiatives had none. Sixteen orders ran under
# NATIVE_GROUNDING.md, every one passed its own bar, and the initiative's
# headline objective — parity at >=5x lower gated-turn latency (spec §1, H0)
# — was never carried by any order. One of the five mechanisms (H3,
# evidence-tilted decoding) was never ordered, never killed, never scoped.
# Both were discovered by hand, four months in.
#
# A PARENT POINTER WOULD NOT HAVE CAUGHT EITHER. Had all 16 orders carried
# `serves: native-grounding`, the tree would have rendered HEALTHIER: one
# spec, sixteen children, all closed, gates green. Linking makes performed
# work visible; performed work was never the problem. The missing view is
# the INVERSE — which declared bars have no order at all. You cannot see a
# gap in a list of things that happened. So this file declares the bars
# FIRST, independent of any order, and scripts/co-lineage.py renders bars
# (not orders) with coverage computed against them.
#
# THE FOUR VERDICTS (ARCH §18.2, the eleven's #5), at program altitude:
#   met               — a recorded evidence event says the bar cleared.
#   failed            — a recorded evidence event says it missed.
#   could-not-judge   — it was measured and the measurement does not resolve.
#   never-attempted   — NO evidence event was ever recorded against it.
#
# `never-attempted` is the verdict this file exists for, and it COUNTS AS
# OPEN in the headline. The precedent is scripts/co-mesh-drill.sh
# f-assemble fix #6 (2026-08-12): its table read "escalations needed = 1"
# while seven cases had never run. That is the same lie one scale down.
#
# COVERAGE IS A SEPARATE AXIS FROM VERDICT, deliberately. Coverage is a
# property of ORDERS (does any order's `serves:` name this bar); verdict is
# a property of EVIDENCE. An uncovered bar is necessarily never-attempted.
# A COVERED bar that is still never-attempted, whose covering orders all
# LANDED, is the single most important row in a post-mortem: work closed
# green while the bar it was supposed to move never moved. The renderer
# flags it LANDED-BUT-UNMOVED. Neither axis alone shows it.
#
# WHY DATA AND NOT CODE (ARCH §6, SICP separation): a bar is a threshold
# with a citation, and a threshold table in a .py file is a large const
# string literal wearing a hat (§6.2). Same reason quality/backlog-ruler.toml
# holds the value ruler and quality/env-flags.toml holds the flag registry.
# One decider, one name (#8): co-lineage.py is the ONLY reader.
#
# HOW BARS GET AUTHORED. From a spec that already declares them. Every bar
# below is a transcription of an existing §7.3 gate line or §1 clause with
# its section cited in `derives_from` — no bar was invented here. If an
# initiative's spec does not declare falsifiable bars, that is the finding,
# and the honest entry is the initiative with zero bars and a `notes` line
# saying so. Do not hand-author bars a spec never promised.
#
# TRANSITIONS ARE THE POST-MORTEM. H0's latency clause was never FAILED —
# no order took it and reported a miss. It was silently re-scoped in a
# planning document. A rollup that records only final states renders it
# "never-attempted" and loses WHY. Every status change therefore carries
# the artifact that caused it. Silent deferral is the failure mode; this
# makes it a recorded event rather than an inference.

version = "1"
minted = "2026-08-12"

[provenance]
v1 = """Minted 2026-08-12 by operator directive: "we need a lineage /
linking for orders ... each individual order is meaningless without the
greater objective. We should have been able to have better visibility of
how those 16 orders were actually addressing the spec they spawned from."
Order: order-lineage-coverage."""

# --- the closed sets ------------------------------------------------------
#
# ARCH §2/§9: these are the whole alphabet. co-lineage.py rejects any other
# value with a named error rather than defaulting it (#6), and its
# --self-test proves that with a negative case.

[vocabulary]
# What a bar's verdict may be. Four, not two.
verdict = ["met", "failed", "could-not-judge", "never-attempted"]

# What a transition's `to` may be. The three verdict-bearing values are the
# ones that set a bar's verdict; the rest record scope movement without
# claiming an outcome — which is the entire point of `deferred`.
transition = [
  "declared",      # the bar entered the initiative's promise set
  "deferred",      # postponed by an artifact, with no verdict claimed  <-- the H0-latency shape
  "descoped",      # deliberately removed; closes the bar by decision, not by evidence
  "re-entered",    # came back after a deferral
  "met",
  "failed",
  "could-not-judge",
]

# A bar is OPEN unless its verdict is `met` or it carries a `descoped`
# transition. Deferred stays OPEN — loudly. That is the f-assemble rule.
closes_a_bar = ["met", "descoped"]

# --- how orders attach ----------------------------------------------------
#
# Order frontmatter gains ONE field, whose vocabulary is the backlog header
# block's `Objective:` — "what standing objective, initiative or order it
# serves" (scripts/BACKLOG.md:154, keys in backlog-ruler.toml [format]).
# The low-ceremony artifact already tracked its parent; the high-ceremony
# artifact that spawns the work did not. One decider, one name (#8): this
# is the same concept, given structure, NOT a second one.
#
#     serves: <initiative-id> [<bar-id> ...]
#
# Legal states, all VISIBLE, none silent:
#   serves: native-grounding H1-routing   — attributed to initiative and bar
#   serves: native-grounding              — attributed to the initiative only
#   serves: (unattributed)                — the template default; renders in
#                                           the unattributed count, never drops
#   (field absent)                        — same as (unattributed)
# A bar id not declared here renders as `unknown bar id` and is REPORTED,
# never dropped (#6).

[format]
serves_key = "serves"
unattributed = "(unattributed)"

