# ── Not contexts (DOMAINS.md §4) — tagged so the instrument has no `unknown` ──

[[context]]
id = "kernel"
kind = "published-language"
question = "what do all contexts speak?"
owns = []
owns_exact = ["Principal"]
# `Principal` is published language, not Serving's/Admission's word: DC §3.3
# "In the registry, `Principal` leaves Serving's owned words for the published
# language", because Serving's package and Answering both key on it and neither
# may name the daemon. Exact match: the one definition is
# `sovereign_contracts::principal::Principal`
# (sovereign-contracts/src/principal.rs:59), a kernel crate, so it is exempt.
# A definition in a crate tagged `kernel` counts against NO owner (registry
# head, :19-22); the word-owners axis reads this flag, never a hardcoded id.
exempt = true
package = ""
crates = ["oicp-types", "kernel-types", "corpus-engine-vocab", "sovereign-contracts", "oicp-client", "sovereign-turn-client"]
lift = ""
applicable_as = "the shared kernel between contexts, not an eleventh"
