note = "59.4% of corpus-engine and the whole reason the crate is a god-crate. One crate at 102k re-mints the problem this campaign demolishes, so the destination is a two-tier PACKAGE, not a crate — the split is already latent (106 of 170 files name no index, no engine, no embed fn and no fs). DECOMPOSITION.md:83 spells this `corpus-engine-enrich` and estimates 40k; DOMAINS.md §6 already corrected the estimate, and ARCH_LAYERS.toml:854 says the `corpus-engine-` prefix 'is carve-out history and actively misleads'. The knot is three files: enrichment/atlas/resolution.rs (5,473), enrichment/pipeline/runner.rs (3,488), enrichment/atlas/context.rs (2,516). The re-export precedent is exact and cheap: corpus-engine-vocab left behind THREE lines (enrichment/atlas/mod.rs:31,40,58)."

