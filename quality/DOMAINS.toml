"sovereign-api -> sovereign-core" = { sites = 22, by_cluster = { host = 13, serving = 5, workbench = 3, kernel = 1 }, retires_at = "api-9", detail = "13 of 22 are cheap repoints that need no move: 1 kernel re-export (SamplingMode) at api-1, 3 workbench re-exports (JournalLine/NextEditEpisode -> sovereign-contracts/src/types/next_edit_journal.rs) at api-5, and 9 `sovereign_core::time::unix_now*` sites -> the tier-0 twin sovereign-time (admission.rs:637, routes_responses.rs:1546, routes_status.rs:202/:646/:652, server.rs:707/:737, state.rs:1238/:1283). The residual 9 are 3 rebrand::svrnmesh_root (serving; the workspace-path SSOT, its own rung) and 6 run_identity/launch (host; legal downward at tier 6)." }
"sovereign-api -> sovereign-tools" = { sites = 7, by_cluster = { host = 6, workspace = 1 }, retires_at = "api-9", detail = "workspace's one site (decision_extractor.rs:48 notes::response_mine) at api-3. The 6 host sites are routes_internal/atlas_status.rs:21 and routes_internal/corpus_ingest.rs:78,:79,:886,:905,:1053 (atlas_peer_advice, sec_edgar, atlas_postinstall) — legal downward once the host is tier 6." }
"sovereign-api -> sovereign-atos" = { sites = 14, by_cluster = { answering = 9, host = 4, serving = 1 }, retires_at = "api-9", detail = "feature-gated (atos), off in default builds. answering's 9 at api-4 via inversion; serving's 1 (routes_inference.rs:1627) at api-6; host's 4 (artifact_surface.rs:31, middleware/mod.rs:117, state.rs:817,:1747) legal downward at tier 6." }
