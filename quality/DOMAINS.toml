wave 1's — the cluster graph decides". The graph says MORE than the serving
cluster does. FOUR of wave 1's seven rungs are blocked on a sovereign-api symbol:
  dm-mesh-serving    23 refs from 4 files. SERVING_BOUNDARY rule 4 forbids the
                     package naming sovereign-api and says prompt_compactor.rs:48
                     is "the one such import today" — it is four files: 8 on
                     kernel (openai_types), 13 on host (state.rs's inference
                     contract), 2 on serving (routes_oicp::EMBEDDED_FEATURES).
  dm-mesh-workbench  4 refs (fim_adapter.rs): openai_types + state::{EditSlotStatus,
                     FimCompletionRequest, FimStreamStart}. The code-intel package's
                     leaf budget is oicp-types/sovereign-contracts/oicp-client only,
                     and the campaign forbids a new [[exception]].
  dm-mesh-ingest     14 refs (auto_ingest.rs 12, auto_resume.rs 2) on
                     sovereign-api's auto_recover + AppState + routes_internal.
  dm-mesh-host       21 refs (daemon.rs 17, tool_profile.rs 4) — resolves by
                     co-location, not by a move.
Run wave 1 first and each of those carries sovereign-api into its new home, which
is precisely the "never a new [[exception]] row" the algorithm forbids.
"""

moves = [
  # ── BEFORE wave 1's first rung — ~2,200 lines, unblocks four mesh rungs ──
  "api-0  kernel/responses_types.rs (421) -> oicp-types. Zero in-repo imports today; moves as-is.",
  "api-1  kernel/openai_types.rs (949) -> oicp-types, after two import lines repoint to the types' real homes (oicp-types/src/{requirements.rs:16, completion.rs:378}). Clears 8 of dm-mesh-serving's 23 and 1 of dm-mesh-workbench's 4.",
  "api-2  state.rs's inference contract -> sovereign-contracts (LocalInferenceService :265, RpcShardWarmer :454) + oicp-types (LocalInferenceError :208, FimCompletionRequest :109, FimStreamStart :141, EditSlotStatus :167, ResidentSlot :59, SlotPlacement :39, WorkerPlacement :52, ComputeChildStatus :83). A file SPLIT, not a cluster move. Clears 13 more of dm-mesh-serving's 23 and 3 of dm-mesh-workbench's 4, and is the port dm-api-workbench needs anyway.",
  "MESH-PRECONDITION  AppState out of sovereign-mesh's 9 fabric files (15 sites). Owned by the mesh worker; nothing past api-5 can land without it.",

  # ── wave 1 (dm-mesh-serving .. dm-mesh-small) runs here ──
  "api-3  workspace (443) -> corpus-engine-notes, after sovereign_tools::notes::response_mine moves down and the Middleware seam lifts to sovereign-contracts.",
  "api-4  answering (2,016) -> sovereign-core, after the ATOS coupling inverts to registration.",
  "api-5  workbench (6,302) -> code-next-edit (new code-intel package crate), on api-2's port.",
  "api-6  serving's package half — admission.rs + principal.rs (1,822) -> sovereign-serving-host. INTERLEAVE: this IS dm-mesh-serving, one rung, one crate. SERVING_BOUNDARY.md's crate table lists sovereign-api's admission inside sovereign-serving-host, and the admission middleware and the scheduler cross both crates.",
  "api-7  ingest/auto_recover.rs (860) -> sovereign-grants (tier 2). Unblocks dm-mesh-ingest's 15 refs.",
  "api-8  the host-bound route shell — serving's 8 route files (8,120) + fabric (2,444) + retrieval (590) + ingest/routes_oicp_ingest (292) -> sovereign-daemon. INTERLEAVE: with dm-mesh-host.",
  "api-9  host (18,930), frontdoor.rs included, whole -> sovereign-daemon. LAST. INTERLEAVE: with dm-mesh-host; the two host clusters land in ONE crate or the AppState edge just changes address. All three [[exception]] rows retire here.",
]

interleave = """
api-0/1/2 run BEFORE dm-mesh-serving.
api-6 IS dm-mesh-serving (fused).
api-8 and api-9 run WITH dm-mesh-host (fused, sovereign-api's side first — the
mesh's daemon.rs names sovereign-api and not the reverse).
api-3/4/5/7 are independent of the mesh waves and can run in any order among
themselves, one cargo-touching worker at a time.
"""

