# quality/DOMAINS.toml — the bounded-context registry.
#
# DATA, not program (ARCH principle 9): the closed set of contexts, the word
# families each owns, which [[package]] in quality/ARCH_LAYERS.toml realises it,
# the module -> context tags the instruments read, and the per-type
# dispositions Phase A executes. The instrument is scripts/domains-census.py
# (rung domains-3); the flight rules are quality/campaigns/domains.toml; the
# argument is quality/DOMAINS.md. Edit a row here and a reviewer reads the
# diff — never a constant in a script.
#
# `owns` are FAMILY HEADS: the instrument matches the word anywhere in a type
# name (`PeerFoo`, `FooPeer`, `IrohPeerPath`), not as a prefix. Rung 3's
# inventory found 21 definitions a prefix sweep misses. `owns_exact` matches
# the bare type name only — for a word whose kin mean something else (Ingest's
# `Source`: 72 kin mean "which producer"). Decided 2026-09-14, rung 4:
#   - ROLE SUFFIXES ARE NOT WORDS. Candidate, Record, View, Kind, Result, Row,
#     Dto are legal in every context; a context owns a NOUN. (`Candidate` has
#     23 kin across four contexts; owning it would rename TensionCandidate.)
#   - `kernel` and `back-of-house` tagged crates count against NO owner: the
#     published language is every context's, and back-of-house may name what
#     it observes (noun-convergence rung 3). A definition there is exempt;
#     the instrument prints exempt hits beside the value so they stay visible.
#
# `crates` is a context's HOME — the crates that ARE this context, existing or
# named-to-create. A module tagged with a context but living outside its home is
# MISFILED, and the demolition loop (quality/campaigns/domains.toml, THE
# STRATEGY) moves it there; the loop enqueues any home whose own share drops.
# `status` is "kept" or "merged-into:<id>". A merge is the §8 kill bar firing
# on purpose; it edits this row, lowers dm-contexts-liftable's target by one,
# and the commit body says which "applicable as" could not be named.

schema = "domains/v1"
declared = "2026-09-13"

# ── The census axes' subjects (rung 3) ──────────────────────────────────────
# Each axis of scripts/domains-census.py sweeps a SUBJECT. The script carries
# none of them as a constant (ARCH 8; the order's "Seams"): a word, a context
# id or a package name that an axis needs is a row here. Three are DERIVED from
# facts this registry already carries, so the fact stays single-spelled:
#   peer_word            the word the peer-outside bar retires. Fabric owns
#                        `Member` (:136) and `Peer` is the legacy word the bar
#                        removes, so no `owns` row carries it — it is declared
#                        here, not re-derived from rows the bar will rename away.
#   atom_context         the context whose vocabulary the atom-outside axis
#                        sweeps: its word is the head of that context's `owns`
#                        (`Atom`, :41) and its roots are `vocab_roots` on the
#                        same row.
#   commonwealth_package the ARCH_LAYERS `[[package]]` the peer-outside axis
#                        scopes to ("outside the commonwealth package",
#                        campaigns/domains.toml:132); the prefix is derived from
#                        that package's crates, never spelled here.
# The exempt contexts are `exempt = true` on their own `[[context]]` rows, and
# the member type is the leaf of the `member_to_candidate` [[seam]].source_type
# (:1388) — both read, neither re-spelled.

[instrument]
peer_word = "Peer"
atom_context = "understanding"
commonwealth_package = "commonwealth"

# ── Contexts (DOMAINS.md §4) ────────────────────────────────────────────────

[[context]]
id = "understanding"
kind = "core"
question = "what is this material about?"
owns = ["Atom", "Tension", "Ontology", "Seed", "Atlas", "Lacuna", "FieldModel"]
# DECIDED 2026-09-14 (rung 4, registry [[collision]] rows): `Gap` stays
# Answering's canonical (quality/CONCEPTS.toml:831-843 already said so); the
# atlas detector's `Gap` (enrichment/atlas/gaps.rs:56) becomes `Lacuna` (49
# sites / 11 files; atlas/gaps.json and its `gaps` key stay via serde rename);
# deep_research's icd `Gap` becomes `GapRow`. The atlas "domain" has NO type
# (`git grep domains.json -- '*.rs'` = 0), so Understanding does not take
# `Domain`; the plugin `Domain` becomes `FieldModel` (45 refs, 2 crates) and
# `DomainRegistry` -> `FieldModelRegistry`. `Seed`'s six homonyms rename apart
# (SeedEdit->ProbeEdit, SeededFile->ProbedFile, SeedMemory->FixtureMemory,
# SeededResponse/SeededWire->RulesAsserted*, SeedPlan->ConversationFixturePlan;
# 37 refs / 11 files); SeedError/SeedReport are Understanding's own. `Cluster`
# is never persisted under atlas/ (writer.rs has zero matches) — not a noun.
package = ""
crates = ["corpus-engine-vocab", "understanding-atlas", "understanding-host"]   # + the understanding crate wave 3 creates (DECOMPOSITION spells it corpus-engine-enrichment); until then enrichment/ is misfiled in corpus-engine
lift = ""
applicable_as = "point it at a folder, get back what the material is about — its domains, its tensions, its gaps; corpus-mcp already reads its output against a bare llama-server"
roots = ["corpus-engine/src/enrichment", "corpus-engine/src/meta_atlas", "corpus-engine/src/atlas_traversal", "corpus-engine-vocab"]
# The two roots where the ATOM vocabulary is authored — the atom-outside axis's
# scope (campaigns/domains.toml dm-atom-outside). A subset of `roots`: the atom
# read model is authored here, not in meta_atlas/ or atlas_traversal/.
vocab_roots = ["corpus-engine-vocab", "corpus-engine/src/enrichment"]
status = "kept"

[[context]]
id = "answering"
kind = "core"
question = "what is the answer, and where did it come from?"
owns = ["Turn", "Scope", "Capabilities", "Lane", "Citation", "Refusal"]
package = ""
crates = ["sovereign-core"]
lift = ""
applicable_as = "an endpoint that answers cited from an index you hand it, or declines"
roots = ["sovereign/crates/sovereign-core/src/runtime"]
# deep_research/ (25,597 lines in sovereign-core) is NOT tagged: DOMAINS §9
# left it unclassified and rung 4 decides whether it is here or an eleventh.
status = "kept"

[[context]]
id = "ingest"
kind = "supporting"
question = "how do bytes become chunks?"
owns = ["Recipe", "Extractor", "Chunk", "Acquirer"]
owns_exact = ["Source"]
# `Source` is Ingest's WORD and the kernel's TYPE: canonical is
# `kernel_types::origin::Source` (published language, exempt), and corpus-engine
# defines no `Source` at all. Exact match, because 72 kin mean "which producer".
# The other three bare `Source`s rename apart (rung 7): KeySet (6 sites),
# ItemSet (12, studio), BundleLocation (10). DOMAINS §5's "Knowledge says
# Source" is withdrawn: the peer-as-source concept is not a context — its atlas
# half is Understanding's (`RemoteAtlasView`, `AtlasPullLead`) and its
# ask-a-peer half is Retrieval's (`RemoteIndexTarget`, `RemoteIndexReply`).
package = ""
crates = ["corpus-engine"]
lift = ""
applicable_as = "a recipe-driven document pipeline"
roots = ["corpus-engine/src/extractors", "corpus-engine/src/chunkers", "corpus-engine/src/acquirers", "corpus-engine/src/filters", "corpus-engine/src/pii.rs"]
status = "kept"

[[context]]
id = "retrieval"
kind = "supporting"
question = "given a query, which chunks?"
owns = ["Index", "Shard", "Embedding", "Neighbor"]
package = ""
crates = ["corpus-engine"]
lift = ""
applicable_as = "a searchable local index — the closest of the ten to generic (DOMAINS §4), which is a reason to invest less, not to fuse it"
roots = ["corpus-engine/src/index", "corpus-engine/src/sharding.rs"]   # registry.rs is the RECIPE registry (registry.rs:25-27, zero index refs) — Ingest's; corrected 2026-09-14 by the corpus-engine census
status = "kept"

[[context]]
id = "serving"
kind = "supporting"
question = "which engine answers this, and can I prove why?"
# DECIDED 2026-09-14 (rung 4): the ranked thing is a `Venue` — zero
# definitions, one kin (`kernel_types::quality::VenueAction`,
# kernel-types/src/quality/triggers.rs:36, 18 sites / 3 files) renamed apart to
# `TriggerAction` in rung 5. `Candidate` refused (5 defs + 23 kin — a role
# suffix, not a noun); `Seat` refused as a near-synonym of `Slot`
# (oicp-types/src/slot.rs:54); `Lender` refused because guest_lender.rs:17-27
# already uses it for the pinned-grant concept and says "a lender is not a
# peer". Admission's caller is a `Principal`, and DC §3.3 decides the word is
# PUBLISHED LANGUAGE, not Admission's: `kernel` owns it `owns_exact` (registry
# :238) and its one definition lives in a kernel crate
# (sovereign-contracts/src/principal.rs:59), because Serving's package and
# Answering both key on it and neither may name the daemon. It CONVERGES with
# DAEMON_CORE.md §1's `principal -> Scope` table: zero renames. The RESOLVER is
# the daemon's edge, not the type (DC §3.3; REVIEW-mint-principal).
owns = ["Venue", "Slot", "Admission", "Replay", "Decision"]
package = "serving"   # declared by dm-serving-package-rows 2026-09-15 (ARCH_LAYERS.toml:1044); boundary-gate is red until the extraction completes, so the predicate still fails
crates = ["sovereign-scheduler", "sovereign-serving-host", "serving-policy", "sovereign-compute"]   # the first two are CREATED by dm-mesh-serving (SERVING_BOUNDARY.md); the peg sovereign-serving emptied to zero at REVIEW-build-serving-empty-peg (2026-09-15) and is deleted
lift = ""             # scripts/serving-lift.sh --sandbox writes VERDICT 1 (2026-09-16). REVIEW-build-serving-drop-inference (2026-09-15) removed the grandfathered `sovereign-serving-host -> sovereign-inference` edge and made the sandbox run on a toolchain satisfying the declared MSRV; REVIEW-build-serving-leaf-embed (2026-09-16) then removed the shared leaf's `include_str!`s of `sovereign-recipes/{registry.toml,schema/recipe_schema_descriptor.json}` — corpus-engine vendors both into its own `OUT_DIR` and the monolith injects them at the call site, so the flat-copy sandbox resolves the closure and steps 5-8 run
applicable_as = "a router in front of N OpenAI-compatible endpoints with admission control and replayable decisions"
roots = ["serving-policy"]
status = "kept"

