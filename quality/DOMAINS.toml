# quality/DOMAINS.toml — the bounded-context registry.
#
# DATA, not program (ARCH principle 9): the closed set of contexts, the word
# families each owns, which [[package]] in quality/ARCH_LAYERS.toml realises it,
# the module -> context tags the instruments read, and the per-type
# dispositions Phase A executes. The instrument is scripts/domains-census.py
# (rung domains-3); the flight rules are quality/campaigns/domains.toml; the
# argument is quality/DOMAINS.md. Edit a row here and a reviewer reads the
# diff — never a constant in a script.
#
# `owns` are FAMILY HEADS: the instrument matches the word anywhere in a type
# name (`PeerFoo`, `FooPeer`, `IrohPeerPath`), not as a prefix. Rung 3's
# inventory found 21 definitions a prefix sweep misses.
#
# `status` is "kept" or "merged-into:<id>". A merge is the §8 kill bar firing
# on purpose; it edits this row, lowers dm-contexts-liftable's target by one,
# and the commit body says which "applicable as" could not be named.

schema = "domains/v1"
declared = "2026-09-13"

# ── Contexts (DOMAINS.md §4) ────────────────────────────────────────────────

[[context]]
id = "understanding"
kind = "core"
question = "what is this material about?"
owns = ["Atom", "Tension", "Ontology", "Seed", "Atlas"]
# `Gap` is defined three ways (atlas / epistemic / deep-research) and `Domain`
# names the plugin, not the atlas noun — both are §5 shared-word calls for
# rung 4, not owned words yet. `Cluster` is never persisted under atlas/ and
# is not a published noun (measured 2026-09-13).
package = ""
lift = ""
applicable_as = "point it at a folder, get back what the material is about — its domains, its tensions, its gaps; corpus-mcp already reads its output against a bare llama-server"
roots = ["corpus-engine/src/enrichment", "corpus-engine/src/meta_atlas", "corpus-engine/src/atlas_traversal", "corpus-engine-vocab"]
status = "kept"

[[context]]
id = "answering"
kind = "core"
question = "what is the answer, and where did it come from?"
owns = ["Turn", "Scope", "Capabilities", "Lane", "Citation", "Refusal"]
package = ""
lift = ""
applicable_as = "an endpoint that answers cited from an index you hand it, or declines"
roots = ["sovereign/crates/sovereign-core/src/runtime"]
# deep_research/ (25,597 lines in sovereign-core) is NOT tagged: DOMAINS §9
# left it unclassified and rung 4 decides whether it is here or an eleventh.
status = "kept"

[[context]]
id = "ingest"
kind = "supporting"
question = "how do bytes become chunks?"
owns = ["Source", "Recipe", "Extractor", "Chunk", "Acquirer"]
# `Source` is in quality/baselines/concepts.txt's duplicate set and DOMAINS §5
# also proposed it as Knowledge's word for a peer-as-source. It is Ingest's
# (§4); Knowledge's word is a rung-4 decision and is NOT `Source`.
package = ""
lift = ""
applicable_as = "a recipe-driven document pipeline"
roots = ["corpus-engine/src/extractors", "corpus-engine/src/chunkers", "corpus-engine/src/acquirers", "corpus-engine/src/filters", "corpus-engine/src/pii.rs"]
status = "kept"

[[context]]
id = "retrieval"
kind = "supporting"
question = "given a query, which chunks?"
owns = ["Index", "Shard", "Embedding", "Neighbor"]
package = ""
lift = ""
applicable_as = "a searchable local index — the closest of the ten to generic (DOMAINS §4), which is a reason to invest less, not to fuse it"
roots = ["corpus-engine/src/index", "corpus-engine/src/sharding.rs", "corpus-engine/src/registry.rs"]
status = "kept"

[[context]]
id = "serving"
kind = "supporting"
question = "which engine answers this, and can I prove why?"
# The word for a serving-side peer is a RUNG-4 DECISION. DOMAINS §5 proposed
# `Candidate`; `converge noun Candidate` finds five first-party definitions in
# five crates (2026-09-13), so it is not exclusive and a sixth would be the
# disease. Left out of `owns` until decided; dm-word-owners reads `owns`.
owns = ["Slot", "Admission", "Replay", "Decision"]
package = ""          # rung 9 declares [[package]] serving
lift = ""             # rung 9 writes scripts/serving-lift.sh
applicable_as = "a router in front of N OpenAI-compatible endpoints with admission control and replayable decisions"
roots = ["sovereign/crates/sovereign-serving", "serving-policy"]
status = "kept"

[[context]]
id = "fabric"
kind = "supporting"
question = "who is in this group, how do I reach them, how do we agree?"
owns = ["Member", "Ring", "Roster", "Reach"]
# The canonical member type is commonwealth_core::mesh::MemberRecord
# (quality/CONCEPTS.toml:911-920). Phase A renames nothing inside this package.
package = "commonwealth"
lift = "scripts/cw-rails-lift.sh"
applicable_as = "proven: cw-rails joined a real mesh by invite and served another member's library (2026-09-11)"
roots = ["commonwealth/crates"]
status = "kept"

[[context]]
id = "compute"
kind = "supporting"
question = "whose machine runs this, and under what boundary?"
owns = ["Unit", "Offer", "Lease", "Isolation", "Donor"]
# `Donor` has ZERO first-party definitions today (converge, 2026-09-13) — the
# one proposed word that is clean.
package = "commonwealth"   # the vocabulary half, commonwealth-work, is inside the package
lift = "scripts/cw-work-lift.sh --sandbox"
applicable_as = "proven: three heterogeneous units complete outside the monorepo inside a rootless container"
roots = ["commonwealth/crates/commonwealth-work"]
status = "kept"

[[context]]
id = "workbench"
kind = "supporting"
question = "what is in this codebase?"
owns = ["Symbol", "CallGraph", "Edit", "NextEdit"]
package = "code-intel"
lift = ""             # no lift script yet; the package row is gated, not lifted
applicable_as = "a code-intelligence MCP server; next-edit is its clearest lost child (sovereign/docs/NEXT_EDIT.md)"
roots = ["corpus-engine-scip", "corpus-engine-sections", "corpus-engine/src/enrichment/code_intel"]
status = "kept"

[[context]]
id = "workspace"
kind = "supporting"
question = "what does the assistant remember about its own work?"
owns = ["Note", "Feature", "PlanItem", "DesignSignal"]
package = ""          # rung 12 declares [[package]] workspace
lift = ""
applicable_as = "a notes/decisions store any agent harness could mount"
roots = ["corpus-engine-notes", "corpus-engine-atos", "corpus-engine-archaeology"]
status = "kept"

[[context]]
id = "build-feedback"
kind = "supporting"
question = "did it compile, did the tests pass?"
owns = ["LintResult", "TestResult", "Watcher"]
package = ""
lift = ""
applicable_as = "barely — DOMAINS §4 and §8 name this the first kill-bar candidate; rung 13 runs the §2 test and either folds it into workbench or deletes it"
roots = ["corpus-engine-watchers"]
# 7 manifests depend on corpus-engine-watchers today: corpus-engine,
# corpus-engine-yield, sovereign-cli-dev, sovereign-server,
# sovereign-cli-daemon, sovereign-work-atlas, sovereign-tools.
status = "kept"

# ── Not contexts (DOMAINS.md §4) — tagged so the instrument has no `unknown` ──

[[context]]
id = "kernel"
kind = "published-language"
question = "what do all contexts speak?"
owns = []
package = ""
lift = ""
applicable_as = "the shared kernel between contexts, not an eleventh"
roots = ["oicp-types", "kernel-types", "corpus-engine-vocab", "sovereign/crates/sovereign-contracts"]
status = "kept"

[[context]]
id = "host"
kind = "composition-root"
question = "what assembles the four things DAEMON_CORE.md names?"
owns = []
package = ""
lift = ""
applicable_as = "not applicable by design — the daemon is not a domain (DOMAINS §4)"
roots = ["sovereign/crates/sovereign-cli-daemon", "sovereign/crates/sovereign-desktop", "sovereign/crates/sovereign-server"]
status = "kept"

[[context]]
id = "back-of-house"
kind = "observer"
question = "is the product measured?"
owns = []
package = ""
lift = ""
applicable_as = "not applicable by design — may observe every layer, nothing depends on it (TARGET_ARCHITECTURE §6)"
roots = ["sovereign/crates/sovereign-eval", "sovereign/crates/sovereign-cli-dev", "sovereign/crates/sovereign-agent-bench", "corpus-engine-atos", "corpus-engine-archaeology"]
status = "kept"

