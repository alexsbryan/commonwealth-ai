Two of the three retire by DIRECTION (a tier-6 host may name tier 3 and tier 4),
not by the edge disappearing. quality/ARCH_LAYERS.toml:1108 already records why
that matters — the harness row's removal condition was rewritten precisely
because "the debt disappearing from the burn-down without anyone paying it" is
not payment. State it in the ledger: sovereign-core and sovereign-atos are
LEGALISED by the host's tier, sovereign-tools likewise; only the 13 repointed
sovereign-core sites and workspace's one sovereign-tools site are actually PAID.
