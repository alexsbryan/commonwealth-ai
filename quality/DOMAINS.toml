# ═══ Cluster graph — corpus-engine 2026-09-14 (8 clusters): in-crate edges, external consumers, tier windows, destinations, move order — the loop's wave-3 input ═══
# corpus-engine in-crate cluster graph — the `domains` campaign's third god-crate node.
# Measured 2026-09-14. corpus-engine/src = 172,204 lines / 295 files / 8 contexts.
#
# METHOD (same as the mesh census): every `crate::…` reference site in every .rs is
# resolved to the module it names, that module's context row is looked up, and the
# (src_context -> dst_context) pair is counted. `super::` was checked separately at the
# one place a directory splits (enrichment/ -> code_intel/): all 11 `super::` sites in
# enrichment/code_intel/ resolve inside code_intel itself, so the workbench boundary is
# clean at that level.
#
# `external_consumers` counts `corpus_engine::<path>` sites in the 21 crates that
# actually declare `corpus-engine` in Cargo.toml, with comment lines stripped. The
# unfiltered grep also hits sovereign-contracts (t0), kernel-types (t0) and
# sovereign-turn-client (t0) — every one of those is a DOC COMMENT naming a corpus-engine
# type it mirrors (kernel-types/src/answer.rs:32,70,89;
# sovereign-contracts/src/daemon_wire/ingest.rs:6,43,84). Counting them would have
# reported a tier-0 consumer and inverted every window.
#
# `window` = the tier band the destination crate may occupy: strictly above nothing
# (own deps are t0-t1 and corpus-engine is itself t1 `knowledge`), strictly below the
# lowest-tier real consumer.

# ───────────────────────────────────────────────────────────── understanding
