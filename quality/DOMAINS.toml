# NOT generic. The genuinely generic half is index/search.rs (1,245 lines):
# cosine over a FixedSizeListArray<Float32> plus RRF fusion over LanceDB IVF-PQ
# and Tantivy — a thin wrapper any vector store would have. Everything else is
# custody, portability and merge semantics a vector store has no reason to
# carry. merge_shards (corpus-engine/src/sharding.rs:780ff) dedupes on TWO
# keys: primary content_hash, secondary (unit_id, source_doc_id) for NULL-hash
# rows, with a per-RecordBatch keep-mask; and at :760-768 a
# MutableMergePolicy::SourceDocIdNewestMtime branch reconciles divergent rows
# for one source_doc_id by newest mtime then renumbers, PROPAGATING the policy
# onto the merged canonical so later merges take the same branch — document
# identity, not storage. index/evidence.rs publishes Evidence/EvidenceSet with
# every field private, no pub fn new, the only constructor pub(crate) ("the
# load-bearing property is the door, not the struct"), so the store's answer to
# "what do you know" is a sealed capability, not rows. index/provenance.rs
# mints ChunkProvenance with custody_of/grain_of for TOPOLOGY §10 phase 9
# hazard 1, "a prompt fed by content that never passed retrieve": custody sets
# an EGRESS FLOOR, a policy obligation no vector store has. index/raptor.rs
# keeps summary embeddings in a SEPARATE table from chunks.lance on purpose so
# summary retrieval stays a distinct top-M and cannot organically displace
# leaves. snapshot.rs is a .tar.zst whose _snapshot_manifest.json is read
# BEFORE extraction and REFUSES on an embedding_model mismatch. And
# recipe.rs:295-307's dedup_by_source records a measured retrieval lift
# (76% -> 85% on the SEP eval bank). So: kept for investment, not merely for
# ownership — but the investment is in five named files and search.rs is not
# one of them, and DOMAINS §4's "closest of the ten to generic, a reason to
# invest less" should be said of search.rs rather than of the context. One edge
# to price in a later rung, not here: Evidence and ChunkProvenance are arguably
# ANSWERING's nouns (custody, egress floor) living inside Retrieval — a
