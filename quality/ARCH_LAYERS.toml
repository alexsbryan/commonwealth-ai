# The declared layer map — the workspace's dependency-direction contract.
# See ARCH_PRINCIPLES.md §8 and quality/arch-layers/src/lib.rs (the shared
# schema + evaluator).
#
# Layers are ordered bottom → top. A crate may depend (normal + build deps;
# dev-deps are reported but exempt) only on crates in the same or a LOWER
# layer. [[forbid]] expresses cross-family rules ordering can't. Every
# workspace member must match exactly one layer — the map is total.
#
# [[exception]] entries are the grandfathered-violation burn-down list:
# adding one is a reviewable policy change (do it in the same PR as the edge,
# with a reason); a STALE entry (violation fixed) fails the gate until the
# entry is deleted — removals are the celebration.
#
# Enforced two ways, one parser (quality/arch-layers):
#   cargo run -p xtask -- layer-gate     Cargo-DECLARED edges (CI, <1s)
#   sovereign code arch-report           SCIP-OBSERVED symbol references

schema_version = 3

# ── Back-of-house: the quality controls ──────────────────────────────────────
# eval, benches, judges, gates, harnesses, archaeology, ATOS. These sit OUTSIDE
# the ordered stack rather than on top of it, because their rule is sharper
# than direction: back-of-house may observe every layer, and NOTHING may depend
# on it. A bench you cannot ship without is not a bench.
#
# Declared once, here. The rule is synthesized from this list in
# quality/arch-layers (ARCH §10.6 — one decider, one name), so layer-gate and
# arch-report cannot drift on it.
#
# The test is "does the product ship without it?", and it is answered
# MECHANICALLY rather than by taste: a product crate may reach a back-of-house
# crate only through an `optional = true` dependency that `default` does not
# turn on. Eight such edges already existed as convention before this rule
# named them (sovereign-cli/dev-tools, sovereign-tools/atos,
# commonwealth-api/atos …); the rule makes them contract.
#
# ── WHAT THIS RULE CANNOT ENFORCE — read before trusting it ──────────────────
# Its unit is the CRATE. Where quality-control code shares a crate with product
# code it cannot tell which MODULE named the type, and every [[exception]]
# below leaves the back-of-house crate LINKED INTO THE PRODUCT BINARY. So an
# exception here is weaker than it looks: it does not say "this edge is fine",
# it says "the boundary is drawn in the wrong place and the crate split that
# would fix it has not been paid for". `sovereign-cli-llm` is the live example
# — `bench_cmd` (51 files, 31k lines) sits beside `chat_cmd` and `corpus_cmd`,
# so the shipped binary carries `sovereign-eval` no matter what this gate says.
# layer-gate repeats this warning whenever the rule fires; do not delete it
# from either place while an exception is outstanding.
backstage = [
    "sovereign-eval",
    "sovereign-cli-dev",
    "sovereign-agent-bench",
    "sovereign-atos",
    "corpus-engine-atos",
    "corpus-engine-archaeology",
    "xtask",
]
# NOT back-of-house, adjudicated 2026-08-20 (noun-convergence rung 3):
#   sovereign-authoring-harness — reads as a harness and is not one. It was
#     carved out of `sovereign-eval` precisely so `sovereign-desktop` could
#     consume it without dragging rusqlite/reqwest/clap into the Tauri build,
#     and the desktop's recipe-testing panel is a shipped end-user feature.
#     The product does NOT ship without it, so it stays a capability.
#   sovereign-tools — the MCP tool surface agents call at work time. Product.
#     Its ATOS and archaeology reach is optional and off by default, which is
#     the rule being satisfied, not evaded.
#   commonwealth-tdd — `scripts/nc-boundary.py` classifies it back-of-house and
#     that is WRONG; this rule caught it as a false positive on first run, from
#     `sovereign-server` and `sovereign-cli-daemon`. It backs two SHIPPED MCP
#     tools — `tdd_solve` and `tdd_bdd_cycle`, listed in `tools/list`
#     (routes_mcp.rs:469) — and the `solve` verb's daemon route
#     (daemon_cmd/solve_http.rs). The product does not ship without those.
#     The distinction that decides it: a quality control measures SOVEREIGN,
#     while this drives red-green-refactor over the USER's repo and emits their
#     code. It is a feature about tests, not a test of the product.

# ── Layers (bottom → top) ────────────────────────────────────────────────────

# Wire protocol + daemon↔package contract + the quality-policy leaf. The
# liftable crates: budgets pinned exactly in boundary-gate's allowed_leaf_deps.
# sovereign-time is the Tier-0 wall-clock leaf (zero deps by design — its own
# doc comment is the contract); it lives at the bottom so the light app crates
# can share it without pulling sovereign-core.
#
# kernel-types is the NEUTRAL kernel — identity + provenance (ContentHash,
# CorpusId, NodeId, Origin, Custody, Attribution) owned by no product domain.
# It is the second layer-0 membrane and deliberately NOT merged with
# oicp-types: oicp is what one node ADVERTISES to another, kernel-types is what
# a piece of content IS and where it came from. Minted 2026-08-20
# (noun-convergence rung nc-1-kernel) after measurement showed the 23 types all
# three product domains speak were 22-owned by corpus-engine. It may name
# nothing above it — that is the whole contract, and scripts/nc-boundary.py
# scores an edge out of it as a BACKFLOW violation.
[[layer]]
name = "contract"
crates = [
    "oicp-types",
    "kernel-types",
    "sovereign-contracts",
    "oicp-client",
    # The CLIENT half of the turn protocol, here for the same reason
    # `oicp-client` is: protocol types plus the client that speaks them. Its
    # only non-leaf dependency is `sovereign-contracts` — it cannot see a
    # Runtime, a store or a corpus, which is what lets a surface depend on it
    # without dragging a serving host's world along (TOPOLOGY §10 phase 6).
    "sovereign-turn-client",
    "arch-layers",
    "sovereign-time",
]

# The knowledge layer: corpus-engine + its carve-outs. "Self-contained by
# design — neither sovereign nor commonwealth types appear here" was the claim
# here until 2026-08-20, and it was false: four types (DetectedSection,
# SectionDetector, ChapterRegexDetector, TocAnchoredDetector) were owned by
# `sovereign-contracts` and named from `corpus-engine`. They now live in
# `corpus-engine-sections`, and the claim is enforced below rather than asserted
# here (noun-convergence rung 2).
[[layer]]
name = "knowledge"
crates = ["corpus-engine", "corpus-engine-*"]

# Commonwealth mesh internals BELOW the runtime: shared mesh types + state +
# transport + discovery + scheduling + app platform. These must stay
# consumable by sovereign-* without dragging the runtime back in.
[[layer]]
name = "mesh-foundation"
crates = [
    "commonwealth-core",
    "commonwealth-state",
    "commonwealth-transport",
    "commonwealth-discovery",
    "commonwealth-inference",
    "commonwealth-knowledge",
    "commonwealth-app",
]

# The agent substrate: runtime core, inference, persistence, and the studio
# package's engine crates (contract-only by design).
[[layer]]
name = "runtime"
crates = [
    "sovereign-core",
    "sovereign-inference",
    "sovereign-store",
    "sovereign-workflow",
    "sovereign-tools-base",
    "sovereign-recipe-author",
    # Supervised compute-child process boundary (P1). Depends on
    # sovereign-inference (same layer) + sovereign-contracts (lower).
    "sovereign-compute",
    # GLiNER NER inference (ort/gline-rs carve-out). Depends on sovereign-core
    # + sovereign-store (same layer) + corpus-engine (lower); consumed from
    # capabilities (sovereign-tools) and hosts.
    "sovereign-gliner",
]

# Capabilities over the runtime: tool implementations, work atlas, workflow
# host, ATOS, eval scorers, meshapp projections, authoring verdicts.
[[layer]]
name = "capabilities"
crates = [
    "sovereign-tools",
    # The enrichment store's layout + `config.json` schema + inventory. Sits
    # here and not with the CLI because THREE hosts read that file (the CLI,
    # the daemon's watched-folder driver via sovereign-tools, and the desktop)
    # and hosts are terminal — while the schema lived in `sovereign-cli-llm`
    # the other two could only re-derive it, and both had (rung
    # nc-16-shared-capability, 2026-08-20).
    "sovereign-enrichment-catalog",
    # The atlas `enrich build` orchestrator + its phase drivers. Here for the
    # SAME reason as the catalog above, one rung further: the catalog moved the
    # store's SCHEMA below the hosts, and this moves the thing that FILLS it.
    # Three hosts run this build — `svrn enrich build`, the daemon's in-process
    # build for an `[enrichment] type = "atlas"` recipe, and the desktop, which
    # ships no CLI to shell out to — and until 2026-09-01 the only way down was
    # `sovereign-cli-daemon -> sovereign-cli-llm`, host to host. That edge
    # carried `bench_cmd`'s grandfathered `sovereign-eval` dependency (the
    # [[exception]] below) into the daemon AND the desktop bundle, which is the
    # precise failure the back-of-house rule warns it cannot see: the boundary
    # was drawn in the wrong place, and this is the split being paid for.
    # Nothing here reaches above this layer — the `sovereign-cli-shared` edge
    # stayed up with the `cmd_*`/HELP halves, and the one `sovereign-mesh` edge
    # was a daemon-session lookup that moved up into the CLI wrapper.
    "sovereign-enrichment-build",
    # THE `Runtime` recipe — router stack, turn tool registry, enrichment
    # lane. Here rather than with the hosts for the same reason as the
    # catalog above: THREE hosts commissioned a Runtime and each carried
    # its own copy of the recipe, because the recipe needs sovereign-tools
    # (same layer) and sovereign-gliner (down) and every crate that could
    # see both was a host binary. Measured drift 2026-08-25: of eleven
    # optional slots, exactly one was wired by all three
    # (quality/TOPOLOGY.md §10 phase 5c).
    "sovereign-runtime-recipe",
    "sovereign-work-atlas",
    "sovereign-workflow-host",
    "sovereign-atos",
    "sovereign-eval",
    "sovereign-meshapp",
    "sovereign-authoring-harness",
    "commonwealth-agent-tools",
]

# Cross-family assembly: the mesh HTTP surface + harnesses + the in-process
# embed. commonwealth-api's reach into sovereign-* is the KNOWN cross-family
# debt — grandfathered below, tracked as remediation R6.
[[layer]]
name = "mesh-api"
crates = [
    "commonwealth-api",
    "commonwealth-test-harness",
    "commonwealth-tdd",
    "sovereign-mesh",
]

# Binaries and end-user surfaces. Nothing may depend on a host.
[[layer]]
name = "hosts"
crates = [
    "sovereign-cli*",
    "sovereign-server",
    "sovereign-desktop",
    "sovereign-pipeline",
    "sovereign-agent-bench",
    "sovereign-studio",
    "oicp-conformance",
    "corpus-mcp",
    "xtask",
]

# ── Cross-family rules ───────────────────────────────────────────────────────

# The two families meet only at the contract seam (SYSTEM_OVERVIEW §1: "Dep
# direction is one-way… sovereign-mesh is the only place the two upper
# projects meet"). sovereign-* reaching DOWN into mesh-foundation is layer-
# legal; commonwealth-* reaching into sovereign-* is not, except contracts.
# NOTE: commonwealth-agent-tools + commonwealth-tdd live in sovereign/crates/
# (naming predates the monorepo merge) — their sovereign deps are exempted
# here rather than grandfathered, since the crates are sovereign-side in all
# but name.
# The knowledge layer meets sovereign at the contracts seam and nowhere else.
# Layer ordering cannot say this on its own: `sovereign-contracts` is declared
# in the `contract` layer above, so every `corpus-engine-* → sovereign-*` edge
# reads as downward and legal. `nc-boundary.py` disagrees — it classifies by
# PATH, so anything under `sovereign/` is domain `sovereign` at layer 2, and a
# knowledge-layer crate naming it is BACKFLOW. This rule records which of the
# two readings binds new code: the seam is permitted, a second sovereign
# dependency is not.
#
# What crosses today, census 2026-08-20. Four TYPES stopped crossing when the
# section detectors moved to `corpus-engine-sections`
# (`nc-boundary --edge corpus-engine:sovereign`: 4 → 0). The crate dependency
# SURVIVES, on three modules that carry no types at all — which is why the type
# census never showed them (`nc-boundary.py` selects `qualified_name LIKE '%#'`,
# so free functions and consts are invisible to it):
#   rebrand::svrnmesh_root                          4 sites (+2 in examples)
#   recipe::url_template::render_template           1 site
#   recipe::schema::RECIPE_SCHEMA_DESCRIPTOR_JSON   1 site (re-exported)
# These stay deliberately. `svrnmesh_root` is the workspace path SSOT — 220 call
# sites over 15 crates, and clippy `disallowed_methods = "deny"` makes
# hand-rolling the path a build error, so it must remain ONE accessor (ARCH
# §10.6); relocating it is its own rung. The other two are agreements the engine
# and the recipe package must hold bit-for-bit, with no home below.
[[forbid]]
from = "corpus-engine*"
to = "sovereign-*"
except = ["sovereign-contracts"]
reason = "the knowledge layer must stay consumable without the agent runtime; it meets sovereign at the contracts seam only, and must never again name a sovereign-owned TYPE"

# The wire contract is the floor. `nc-boundary.py` reads the workspace as four
# systems — oicp(0) < corpus-engine/commonwealth(1) < sovereign(2) < studio(3) —
# and an `oicp-* → sovereign-*` edge is BACKFLOW under it: the crate that exists
# to decouple the systems depending on one of them. Layer ordering alone cannot
# say this, because `sovereign-contracts` is declared in the `contract` layer
# here; these rules make the direction structural instead of remembered.
# (noun-convergence rung 2, 2026-08-20.)

[[forbid]]
from = "oicp-types"
to = "sovereign-*"
reason = "the wire contract is the floor — a protocol crate that names the runtime cannot be lifted, versioned, or implemented by a third party"

# oicp-client's ONE surviving sovereign edge, with the finding that keeps it.
# Census 2026-08-20, `scripts/nc-boundary.py --edge oicp:sovereign`: 12 types /
# 103 refs, every one of them from `oicp-client/src/lib.rs`, every one defined
# in `sovereign-contracts` —
#   traits.rs            InferenceProvider, ResidentSlot
#   types/completion.rs  CompletionRequest, CompletionResponse, StreamFrame,
#                        FinishReason, StreamUsage, ProviderCapabilities
#   types/mod.rs         Speed, Depth
#   error.rs             Error, Result
# THE FINDING: the trait and the completion value types belong to oicp —
# `oicp-client` is the Open Inference Capabilities Protocol client and that IS
# the inference wire vocabulary; the home is oicp-types, and the fix is a MOVE.
# `Error`/`Result` do NOT move with them: error.rs is a 150-line sovereign
# RUNTIME error enum (Planning, Execution, Tool, ToolNotFound, Storage,
# PermissionDenied, CorpusUpdateNotAuthorised, QueueShed). Every
# `InferenceProvider` method returns it, so the move needs an oicp-owned error
# plus conversions across 79 `impl InferenceProvider for` sites — its own rung,
# not a side effect of another. Until it lands the edge is permitted HERE and
# nowhere else: oicp-client may not acquire a second sovereign dependency.
[[forbid]]
from = "oicp-client"
to = "sovereign-*"
except = ["sovereign-contracts"]
reason = "the OICP client meets the runtime at the contracts seam only; the inference vocabulary it borrows is oicp's own and moves down in its own rung"

[[forbid]]
from = "commonwealth-core"
to = "sovereign-*"
reason = "mesh foundation must stay consumable without the agent runtime"

[[forbid]]
from = "commonwealth-state"
to = "sovereign-*"
reason = "mesh foundation must stay consumable without the agent runtime"

[[forbid]]
from = "commonwealth-transport"
to = "sovereign-*"
reason = "mesh foundation must stay consumable without the agent runtime"

[[forbid]]
from = "commonwealth-discovery"
to = "sovereign-*"
reason = "mesh foundation must stay consumable without the agent runtime"

[[forbid]]
from = "commonwealth-inference"
to = "sovereign-*"
reason = "mesh foundation must stay consumable without the agent runtime"

[[forbid]]
from = "commonwealth-knowledge"
to = "sovereign-*"
reason = "mesh foundation must stay consumable without the agent runtime"

[[forbid]]
from = "commonwealth-app"
to = "sovereign-*"
reason = "mesh foundation must stay consumable without the agent runtime"

# WHAT actually crosses, so R6 has a size rather than a feeling. Census
# 2026-08-20, `scripts/nc-boundary.py --edge commonwealth:sovereign`: 11 types /
# 38 refs, all from `commonwealth-api` —
#   sovereign-contracts (5, permitted by the `except` below — the declared seam)
#     next_edit_journal.rs NextEditEpisode, JournalLine, NextEditOutcome,
#                          NextEditOutcomeLine
#     journal.rs           JournalStream
#   sovereign-tools (6, grandfathered below)
#     atlas_postinstall.rs Tier2LaunchOutcome, StructuralAtlasOutcome, TriageOutcome
#     atlas_peer_advice.rs PeerAtlasView, PeerAtlasPullCandidate
#     atlas_status.rs      AtlasStatusRow
#   sovereign-atos (grandfathered below; named from the ATOS-feature middleware,
#   which is off in default builds so the type census does not count it)
#     session.rs           ArtifactDelta, MilestonePassEvent, SessionStore
#     approval.rs          FeatureApproval, ApprovalSource
# The 5 contract types are the seam working as designed. The other 6 are the
# in-process runtime embed, and they are what R6 has to delete.
#
# Burn-down: 22/122 -> 16/98 (rung 2b moved the inference vocabulary to
# oicp-types) -> 11/38 (rung 2c family A moved the tool vocabulary — Effect,
# Scope, ToolDescriptor, Idempotency, Latency, ToolExample — to oicp-types
# too). The `except` below stays for now, and the reason is worth stating
# because the two halves of this rule measure different things: the `except`
# is CRATE-level and is already inert — no commonwealth crate carries a direct
# `sovereign-contracts` dep, so it grants nothing today. What is still live is
# the TYPE-level reach: the next-edit journal family (rung 2c/B) names
# sovereign-contracts types through `sovereign_core`'s re-exports, which the
# `commonwealth-api -> sovereign-core` exception below already covers. Dropping
# the `except` is therefore a free ratchet against a dep nobody has taken yet —
# it belongs with the family that makes the type census zero, not with this one.
# The mesh API's reach into the agent runtime is real, load-bearing debt —
# the OICP-only seam is the goal state (remediation R6). Forbidden so every
# such edge must be individually grandfathered below and burns down visibly.
[[forbid]]
from = "commonwealth-api"
to = "sovereign-*"
except = ["sovereign-contracts"]
reason = "cross-family reach — the mesh API should meet the runtime at the OICP/contracts seam (R6)"

[[forbid]]
from = "commonwealth-test-harness"
to = "sovereign-*"
except = ["sovereign-contracts"]
reason = "cross-family reach — harness should simulate against the OICP/contracts seam (R6)"

# ── Extractable packages ─────────────────────────────────────────────────────
# A PACKAGE is a crate set that must stay liftable out of this monorepo and
# buildable against nothing but the `[[package_leaf]]` set below. Enforced by
# `cargo run -p xtask -- boundary-gate` (blocking, one of the eight pre-push
# ratchets), which adds the two filesystem rules a manifest cannot express: no
# `build.rs`, and no `include_str!`/`include_bytes!` escaping the crate root.
#
# WHY THIS IS A SEPARATE RULE FROM THE LAYERS ABOVE. Layers answer "may this
# edge exist anywhere in the workspace"; a package answers "is this edge inside
# MY closure". An edge can point DOWN the stack — perfectly layer-legal — and
# still take a package out of liftable range. The overlap is deliberate and
# partial. Two further differences, both intentional: a package enforces DEV
# edges (the layer map ignores them, because a dev-dep cannot reach a shipped
# artifact — but a third party who lifts a package carries its tests), and it
# ignores direction entirely.
#
# HOW TO DECLARE A DIRTY PACKAGE. You do not have to clean a boundary before
# you can enforce it. Declare the package, run the gate, and turn the failure
# list into `[[exception]]` entries carrying `package = "<name>"`. New edges
# fail from day one, the grandfathered ones are a counted ledger, and a stale
# entry (the edge is gone) fails the gate until it is deleted — removals are
# the celebration, same as the layer exceptions below.
#
# Moved here from Rust consts in `corpus-engine/xtask/src/boundary_gate.rs`
# (2026-09-03). One policy file, one parser (`quality/arch-layers`), same as
# layer-gate and arch-report — ARCH §10.6, and "say it in TOML".

# The shared contract leaves. GLOBAL, not per-package: widening ONE widens
# every package's contract surface at once, which is why this list is short and
# each budget is pinned by hand rather than derived. What qualifies a leaf is
# its CLOSURE, not its directory — `corpus-engine-sections` crosses because its
# whole third-party budget is `regex` + `tracing`, while `corpus-engine` drags
# LanceDB, Tantivy and rusqlite.

[[package_leaf]]
name = "oicp-types"
# The wire vocabulary, a pure leaf. Empty is also enforced from above by
# `[[forbid]] oicp-types -> sovereign-*`: a protocol crate that names the
# runtime cannot be lifted, versioned, or implemented by a third party.
allow = []

[[package_leaf]]
name = "kernel-types"
# The neutral kernel — identity + provenance, layer 0 beside oicp-types. ZERO
# internal deps, and that is the contract, not an accident: a kernel that may
# name a product crate is not a kernel (noun-convergence rung nc-1-kernel).
allow = []

[[package_leaf]]
name = "corpus-engine-sections"
# The section detectors. Admitted 2026-08-20 (noun-convergence rung 2), when
# `sovereign-tools-base` amended its own budget comment to permit it and
# nothing taught the gate — so the edge stood as a violation for a week under a
# gate that had no caller. Empty BY CONTRACT: the whole reason this leaf may
# cross is that its closure is provably tiny, and one internal dep would make
# that untrue.
allow = []

[[package_leaf]]
name = "corpus-engine-vocab"
# The atlas vocabulary — atoms, edges, kind taxonomy, canonical fold. Admitted
# 2026-09-03 (enrichment-as-plugin Step 2) so a thin host can name an atom
# without linking corpus-engine. `kernel-types` is its ONE internal dep, for
# `ContentHash::of_str` in `AtomId::from_essence`, and kernel-types is itself
# an empty leaf — so the closure is two crates and stays that way.
allow = ["kernel-types"]

[[package_leaf]]
name = "sovereign-time"
# The wall clock. Admitted 2026-09-01, when clock-gate started routing every
# non-core sovereign crate at `sovereign_time::` and `sovereign-recipe-author`
# followed that instruction into a boundary violation — two gates pointing
# opposite ways, which is a defect in the allowlist and not in the crate that
# obeyed. It qualifies more strongly than any other leaf here: `[dependencies]`
# is EMPTY — not "no in-repo deps", no deps at all — so admitting it widens the
# closure by exactly three functions and zero crates.
allow = []

[[package_leaf]]
name = "sovereign-contracts"
# Where `Tool`, `ToolResult`, `Error`, `ToolRegistry`, `types` and
# `slot_policy` actually live. At 24,619 lines it is the anchor a lift has to
# reckon with: `studio/LIBRARY.md` prices the real cut at about a dozen items
# into a contract crate of a few hundred lines, re-exported at the current
# paths so no importer in the monorepo changes.
allow = ["oicp-types", "kernel-types"]

[[package_leaf]]
name = "oicp-client"
# Protocol types plus the client that speaks them. The `sovereign-contracts`
# edge is 12 types / 103 refs, all from `oicp-client/src/lib.rs`; the finding
# recorded on the `[[forbid]]` above is that the inference vocabulary is oicp's
# own and the fix is a MOVE, gated on an oicp-owned error across 79
# `impl InferenceProvider` sites.
allow = ["sovereign-contracts", "oicp-types"]

# ── The packages ─────────────────────────────────────────────────────────────

[[package]]
name = "studio"
doc = "studio/BOUNDARY.md"
# The workflow + recipe authoring package. Green and blocking since the gate
# was written; the closure was physically lifted once (2026-07-21) and built in
# 36 seconds cold with zero source edits. The one snag that lift surfaced is
# not a dependency edge at all — `sovereign-contracts` carries an `include_str!`
# escaping its crate root into `sovereign-recipes/`, so the sandbox had to
# preserve the monorepo's directory shape to compile. A green gate is not a
# proven lift; see the note in studio/BOUNDARY.md.
crates = [
    "sovereign-tools-base",
    "sovereign-workflow",
    "sovereign-workflow-host",
    "sovereign-recipe-author",
    "sovereign-studio",
]

[[package]]
name = "code-intel"
doc = "docs/CODE_TOOLING_BOUNDARY.md"
# The code intelligence package — designed 2026-07-27, registered here
# 2026-09-03 as Phase 0 of its own phase queue ("generalise boundary_gate.rs
# from one PACKAGE_SET to N named packages").
#
# THESE FIVE ARE THE CRATES THAT EXIST. The package's target shape is nine
# (CODE_TOOLING_BOUNDARY.md §2); the other four — `code-facts`, `code-enrich`,
# `code-tools`, `code-intel-cli` — are still modules inside `corpus-engine`,
# `sovereign-tools` and the CLI siblings, and arrive with Phases 2, 4 and 6.
# Registering the five that are already carved out is what stops the ~22k lines
# of finished extraction from silently re-acquiring an edge while the remaining
# 29k is being moved.
#
# The `corpus-engine-` prefix is carve-out history and actively misleads; the
# rename is Phase 5, and the crates.io names are unverified (§9 open items) —
# resolve before the rename, not after.
crates = [
    "corpus-engine-yield",
    "corpus-engine-scip",
    "corpus-engine-notes",
    "corpus-engine-watchers",
    "corpus-engine-archaeology",
]

[[package]]
name = "corpus-mcp"
doc = "corpus-mcp/README.md"
# The thin knowledge host (enrichment-as-plugin Step 5, 2026-09-03): the proof
# that a third party can search a corpus-engine index — and read what its
# enrichment produced — against a plain `llama-server`, with nothing that
# carries llama.cpp, ort or iroh. ONE crate, deliberately: the engine it reads
# with is not liftable yet (a `build.rs` that vendors recipes, tree-sitter
# queries `include_str!`'d from outside the crate root, and an optional edge to
# `corpus-engine-scip`), so putting `corpus-engine` inside the package would
# fail three filesystem rules the package cannot grandfather. Instead the edge
# corpus-mcp → corpus-engine is the single grandfathered row below, and the
# gate enforces what the binary itself may reach: the shared leaves and nothing
# else. A `sovereign-core` or `sovereign-tools` dep added to this host fails
# here on day one; the third-party half (llama.cpp / ort / iroh) is pinned by
# `corpus-mcp/tests/no_inference_stack.rs` against `cargo tree`.
#
# `sovereign-enrichment-build` joined 2026-09-04 (order ei-5a-build-cut). It is
# the atlas `enrich build` orchestrator — the crate that WRITES what this host
# reads — and it sat on `sovereign-core`, `sovereign-tools` and
# `sovereign-inference` for eight import sites, none of which turned out to be
# inference: the embedder was one `embed_query` behind a twelve-method trait,
# `fetch_manifest` was reached through a crate whose `remote` module is nothing
# but `pub use oicp_client::*`, and the rest were types that already lived in
# `sovereign-contracts` or `corpus-engine`. Its closure went 695 → 590 crates
# with llama.cpp gone. Listing it here is what stops it coming back: the gate
# refuses a `sovereign-core` / `sovereign-tools` edge on this package, and the
# third-party half is pinned by the same `cargo tree` test as the host.
# `sovereign-enrichment-catalog` joined in the same commit, and on the same
# evidence: it is the enrichment store's layout + `config.json` schema, the
# orchestrator's one way to find an atlas on disk, and its LAST non-leaf edge
# (`sovereign_core::setup_config::client_daemon_base()`, one line) was the
# eighth site this order cut. What it depends on now is `corpus-engine` and
# `sovereign-contracts` — the same two the rest of this package stands on.
crates = [
    "corpus-mcp",
    "sovereign-enrichment-build",
    "sovereign-enrichment-catalog",
]

