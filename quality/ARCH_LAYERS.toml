[[package]]
name = "commonwealth"
doc = "commonwealth/BOUNDARY.md"
# The mesh substrate — declared 2026-09-03, BEFORE the work that moves code
# into and out of it, because no gate in this repo can tell "the files moved"
# from "the boundary holds". layer-gate's "no sovereign" property is seven
# hand-enumerated [[forbid]] blocks above (:305-341); a crate added to the
# mesh-foundation layer list gets no forbid rule and prints green. ARCH §18.1.
#
# Green on the day it is declared, with zero [[exception]] rows: the four
# crates' entire internal dependency surface is commonwealth-core plus the
# kernel-types / oicp-types leaves. That is a property to hold, not one to
# reach — a new row here is a regression, not bookkeeping.
#
# WHAT IS NOT IN IT. commonwealth-{knowledge,inference,api} are applications on
# this substrate (577-690-crate closures, all three name corpus-engine), and so
# is sovereign-mesh. sovereign-mesh holds substrate-SHAPED code — a MeshStore
# replication path, a founder/joiner handshake — whose external consumers are
# ~15 of ~234 crossing refs. Extracting it as a peer of these four would fork
# the deciders this package owns: two replication paths, two orderings, two
# admission rules. §10.6 at crate scale. Substrate found elsewhere is rehomed
# HERE or deleted, never mirrored.
crates = [
    "commonwealth-core",
    "commonwealth-transport",
    "commonwealth-state",
    "commonwealth-discovery",
    # The rail, admitted 2026-09-04 at cw-lift 1b/1d. The fold (rail-core:
    # vocabulary, Ed25519 authorship, admission into one total order, the sync
    # digest, zero I/O) and the journal (rail: the JSONL log under
    # <root>/rings/<ns>/). Their whole internal surface is commonwealth-core
    # plus the `oplog` and `kernel-types` leaves, so the zero-exception
    # property above still holds — which is the ONLY reason they are in here.
    "commonwealth-rail-core",
    "commonwealth-rail",
    # The work plane, admitted 2026-09-09 at cw-lift 5c. Six crates -> seven,
    # and the zero-exception property still holds: its entire internal surface
    # is `commonwealth-core` + `commonwealth-rail-core` + the `oicp-types` and
    # `kernel-types` leaves already in this list, so the widening admits NO new
    # leaf at all -- cheaper than the `oplog` admission the rail cost.
    #
    # It is here BEFORE it has a consumer, and that is the point: cw-lift 5f
    # lifts this closure out of the monorepo and builds a third-party peer
    # against it, and every gate in the repo would be green on a
    # `sovereign-*` dep acquired the day before that lift.
    "commonwealth-work",
    # Federated media, admitted 2026-09-11 at cw-lift D1. Seven crates -> eight
    # and the zero-exception property still holds: its entire internal surface
    # is `commonwealth-core` + `commonwealth-transport`, both already members,
    # so the widening admits no new leaf at all.
    #
    # Here the day it is registered, and for the same reason the work plane
    # was: `commonwealth-rails` is being written against it, and the two
    # [[forbid]] rows above are what keep the closure liftable between now and
