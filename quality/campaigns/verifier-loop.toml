# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
# Defer/descope = edit a bar's `status`; git history is the ledger.
#
# ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is the
# committed artifact and the LADDER in campaign.md carries the rung list, so
# the plan survives without them.
id        = "verifier-loop"
objective = "Every operating point the inference verifier loop decides on is a number with a provenance chain - fitted from retained episodes, committed as data, read through one accessor, and load-bearing under perturbation - so the verification work already spread across 100 instruments and 366 verdict types pays into the answer a person reads instead of into target/"
spec      = "sovereign/docs/specs/VERIFICATION_COMMONS.md §1-§4 (the verification episode as the unit of collection; §4 the mechanism of change). Its own header says 'design study, no code' — this campaign is its first execution. Constrained by sovereign/bench/FABRICATED_QUOTE_PREREG_20260911.md ('Model strata only demote. Bytes admit.') and by sovereign/bench/VERIFIER_ECONOMY_PREREG_20260819.md (two axes never averaged)."
declared  = "2026-09-12"
status    = "active"

# ── THE PREDICATE ────────────────────────────────────────────────────────────
# Three legs, and the third is the load-bearing one. A committed calibration
# artifact that exists, and is even re-derivable, still proves nothing about
# whether the runtime consults it: `grounding_gate_threshold()` (sovereign-core/src/runtime/grounding/config.rs:56)
# returns the literal 0.9 today and would keep returning it with a perfect
# artifact sitting beside it. So the predicate requires the decision to CHANGE
# when the artifact changes.
#
# The denominator is not a list an author wrote. It is "every threshold the gate
# actually consulted on this turn", reported by the turn itself — the same shape
# as env-gate censusing env reads rather than trusting a registry by hand.
#
# Every bar below can sit at target while this sentence is false: judge calls
# per turn can halve, fabrication can stay 0, gold rows can flow, the bank can
# be live — and every threshold in force can still be a literal no artifact
# governs. That is the sv-surface failure, declared before the fact this time.
[predicate]
statement = "On one real gated longform turn: every threshold the gate consulted is named in its decision line together with the committed artifact it resolved through; re-running that artifact's fit script over the episode bank on disk reproduces it byte-for-byte; and the same turn replayed against a perturbed artifact takes a different action"
check     = "cargo test -p sovereign-core --test main verifier_loop_operating_point_roundtrip"
# NOT BUILT. The test name is declared here before the data, per §18.6, and is
# rung vl-6's deliverable - the END STATE, not the first move. Until it exists this
# predicate reads NEVER-RAN, which is the honest verdict and not a pass.
#
# LEG 3 IS NOT ALSO A BAR (reordered 2026-09-12). The perturbation leg lived as
# `vl-ruler-decides` in the first draft, which made two readers of one fact
# (ARCH principle 8). It is stated here, once, and the predicate test owns it.

# ── BARS ─────────────────────────────────────────────────────────────────────
# Ordered as the ladder runs them: cheapest and most load-bearing first. The two
# that open the campaign are net-negative or near-free in lines and both produce a
# win you can watch on day one.

