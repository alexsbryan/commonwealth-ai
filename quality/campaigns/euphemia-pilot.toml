# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
#
# CHILD of euphemia: the pilot, Stage A's closing rung and the gate into Stage
# B (svrn-docs COMMONS_BUILD_PLAN.md at e7ea8fe, "The pilot"). The operator's
# real sessions across commonwealth-ai, zoracite, ersilia and svrngs, both
# machines through the git exchange, judged on the UX north star's four
# questions and the product north star's four guardrails. Orders under it
# `serves: euphemia-pilot <bar-id ...>`.
#
# STAGED 2026-10-09. The bars were drafted in euphemia.toml the same day and
# moved here by the operator's choice of a child campaign over a cap of 12
# (the A52 precedent: new campaign files rather than rungs on a capped one).
#
# THRESHOLDS ARE OWED, AND THEY ARE THE OPERATOR'S. The plan registers the
# pilot's bars "before it runs" and the product north star says "Each guardrail
# gets a floor or a ceiling before the pilot runs"; neither gives a number, and
# none is invented here. Each bar carries no floor and no target, and its
# instrument line is commented, because co-lineage refuses an instrument with
# neither. Opening the rung is one commit, made before any pilot session is
# counted: every threshold registered, every instrument line uncommented,
# status = "active". A threshold that appears after a bar's first row is a
# result, not a bar (ARCH 7).
id        = "euphemia-pilot"
parent    = "euphemia"
objective = "The operator's real sessions say whether euphemia is worth building further: people identify the related work a brief shows, retrieve lessons another session recorded, tell rules from proposals and recover handoffs, while the brief stays precise, cheap and right about collisions, and sessions actually record"
spec      = "~/dev/svrn-docs at e7ea8fe: COMMONS_BUILD_PLAN.md 'The pilot'; COMMONS_UX_NORTH_STAR.md 'Proof by experience'; COMMONS_PRODUCT_NORTH_STAR.md (metric, inputs, guardrails, 'What would prove it wrong'). Parent brief: .sovereign/features/euphemia/campaign.md"
declared  = "2026-10-09"
status    = "staged"

[predicate]
statement = "Over the pilot's real sessions, every bar below is met at the threshold registered before the first pilot session was counted"
check     = "\"$HOME/dev/euphemia/scripts/pilot.sh\" predicate"
# pilot.sh's `predicate` read mirrors svrngs-e0's e0_demo.py: exit 0 TRUE, 1
# FALSE, 2 while any bar cannot be judged, 3 until the pilot layer exists.
# S14 owes it beside the `value` read.

# ── PILOT BARS: the UX north star's four questions ──────────────────────────
# Reported as passed / failed / could-not-judge / never-ran per question, from
# `euphemia stats` and the pilot instrument (build plan, "The pilot").

[[bar]]
id           = "eu-pilot-related-work"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-related-work" — held until its threshold is registered
# floor/target = OWED: registered at the start of the pilot rung, before any pilot session is counted
demo         = "The pilot: the operator's real sessions across the four repositories, both machines through the git exchange"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, people correctly identify the related work a brief shows (UX question 1)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 1; COMMONS_BUILD_PLAN.md 'The pilot'; COMMONS_PRODUCT_NORTH_STAR.md: related work counts as used only when this question shows people identified it correctly."
direction    = "higher_is_better"
goodhart     = "this can read high while the predicate is false if 'identified' is inferred from the record instead of asked of the person, which the product north star forbids for related work"
status       = "open"

[[bar]]
id           = "eu-pilot-lesson-retrieval"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-lesson-retrieval" — held until its threshold is registered
# floor/target = OWED: registered at the start of the pilot rung
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, people retrieve the relevant lesson recorded by a different session (UX question 2)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 2; COMMONS_BUILD_PLAN.md 'The pilot'; COMMONS_PRODUCT_NORTH_STAR.md north star metric (a lesson counts as used when the receiving session cites, confirms or corrects it)."
direction    = "higher_is_better"
goodhart     = "this can read high while the predicate is false if the retrieving session is the one that wrote the lesson; the metric counts only items carried from a different worktree, repository, machine or person"
status       = "open"

[[bar]]
id           = "eu-pilot-rules-vs-proposals"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-rules-vs-proposals" — held until its threshold is registered
# floor/target = OWED: registered at the start of the pilot rung
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, people distinguish current rules from proposals in what the brief shows (UX question 3)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 3; COMMONS_BUILD_PLAN.md 'The pilot': served by the brief's read-only canon section, with proposals made with canon directly until E8."
direction    = "higher_is_better"
goodhart     = "this can read high while the predicate is false if no proposal was pending in any target canon during the pilot, so there was nothing to tell apart; the run records how many proposals were pending"
status       = "open"

[[bar]]
id           = "eu-pilot-handoff-recovery"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-handoff-recovery" — held until its threshold is registered
# floor/target = OWED: registered at the start of the pilot rung
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, a successor session recovers a handoff: objective, state, open decisions and verification (UX question 4)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 4, and law U4 ('the handoff carries the work, not the transcript'); COMMONS_BUILD_PLAN.md 'The pilot', E5.4."
direction    = "higher_is_better"
goodhart     = "this can read high while the predicate is false if the successor resumed by re-reading the transcript or the repository rather than from the handoff (U4 refuses transcript archaeology)"
status       = "open"

# ── PILOT BARS: the product guardrail named as the stop condition ───────────

[[bar]]
id           = "eu-pilot-precision"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-precision" — held until its floor is registered
# floor = OWED: registered at the start of the pilot rung ("Each guardrail gets a floor or a ceiling before the pilot runs")
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, the share of items shown in briefs that the receiving session then used stays at or above its floor"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'Guardrails' ('Precision: the share of shown items that get used. Low precision is the campaign's stop condition') and 'What would prove it wrong'; COMMONS_BUILD_PLAN.md 'The pilot'; E5.5 (`stats` computes it)."
direction    = "higher_is_better"
goodhart     = "this can read high while the predicate is false if 'used' is inferred from the record for related work (only question 1 may count it), or if briefs showed so little that a high share means nothing; it is read beside the withheld line and capture"
status       = "open"

# ── PILOT BARS: the other three guardrails ──────────────────────────────────

[[bar]]
id           = "eu-pilot-false-collisions"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-false-collisions" — held until its ceiling is registered
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, collision warnings that named work which did not in fact overlap stay at or below their ceiling"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'Guardrails' ('False collision warnings'); COMMONS_UX_NORTH_STAR.md 'Proof by experience' (capture false collision warnings); COMMONS_BUILD_PLAN.md 'The pilot'."
direction    = "lower_is_better"
goodhart     = "this can read low while the predicate is false if overlap was rarely shown at all (warnings suppressed rather than accurate); it is read beside question 1"
status       = "open"

[[bar]]
id           = "eu-pilot-brief-cost"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-brief-cost" — held until its ceiling is registered
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, tokens per brief and the delay added at session start stay at or below their ceilings"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'Guardrails' ('Brief cost: tokens per brief, and the delay added at session start'); design §7 (the brief's budget of about 1,500 tokens, which names anything it cuts). OWED with the ceiling: whether this is one bar or two, since the guardrail names two quantities."
direction    = "lower_is_better"
goodhart     = "this can read low while the predicate is false if the brief stays cheap by cutting what sessions needed; truncation is named in the brief and read beside the four questions"
status       = "open"

[[bar]]
id           = "eu-pilot-capture-rate"
# instrument = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-capture-rate" — held until its floor is registered
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, the share of sessions that record a claim or a lesson stays at or above its floor"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'The inputs that move it' ('Capture rate ... If it stays near zero, nothing compounds') and 'What would prove it wrong' ('sessions do not capture'); COMMONS_BUILD_PLAN.md 'The pilot' (listed with the guardrails); E5.5."
direction    = "higher_is_better"
goodhart     = "this can read high while the predicate is false if hooks or agents record by rote, so captures nobody uses count; it is read beside precision"
status       = "open"
