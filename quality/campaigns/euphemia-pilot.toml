# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
#
# CHILD of euphemia: the pilot, Stage A's closing rung and the gate into Stage
# B (svrn-docs COMMONS_BUILD_PLAN.md at e7ea8fe, "The pilot"). The operator's
# real sessions across commonwealth-ai, zoracite, ersilia and svrngs, both
# machines through the git exchange, judged on the UX north star's four
# questions and the product north star's four guardrails. Orders under it
# `serves: euphemia-pilot <bar-id ...>`.
#
# STAGED 2026-10-09; the bars were drafted in euphemia.toml the same day and
# moved here by the operator's choice of a child campaign over a cap of 12.
#
# OPENED 2026-10-09, before any pilot session was counted, by the operator's
# direction: numeric floors and ceilings on these would "make something
# subjective objective", so each bar is one question asked of the operator,
# and the recorded answer is the verdict. Yes reads 1 (met), no reads 0
# (failed), unsure reads could-not-judge; floor 1.0 is structural, not a
# tuned number. The seat asks after about a week of real sessions on both
# machines, or when the operator calls it, with `euphemia stats` and the
# pilot's session count beside each question; the answer and its note are
# recorded by `pilot.sh record` and committed in ~/dev/euphemia. A question
# reworded after its first answer is a new bar, not an edit (ARCH 7).
id        = "euphemia-pilot"
parent    = "euphemia"
objective = "The operator's real sessions say whether euphemia is worth building further: people identify the related work a brief shows, retrieve lessons another session recorded, tell rules from proposals and recover handoffs, while the brief stays precise, cheap and right about collisions, and sessions actually record"
spec      = "~/dev/svrn-docs at e7ea8fe: COMMONS_BUILD_PLAN.md 'The pilot'; COMMONS_UX_NORTH_STAR.md 'Proof by experience'; COMMONS_PRODUCT_NORTH_STAR.md (metric, inputs, guardrails, 'What would prove it wrong'). Parent brief: .sovereign/features/euphemia/campaign.md"
declared  = "2026-10-09"
status    = "active"

[predicate]
statement = "Over the pilot's real sessions, the operator answers yes to every question below"
check     = "\"$HOME/dev/euphemia/scripts/pilot.sh\" predicate"
# exit 0 every bar's latest committed answer is yes, 1 any no, 2 any unsure
# or unasked.

# ── The UX north star's four questions ──────────────────────────────────────

[[bar]]
id           = "eu-pilot-related-work"
question     = "When a brief showed related work (a claim from another worktree, repository or machine), could you tell what it was and how it related to yours?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-related-work"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09: ask the questions, no numeric thresholds)"
direction    = "higher_is_better"
demo         = "The pilot: the operator's real sessions across the four repositories, both machines through the git exchange"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, people correctly identify the related work a brief shows (UX question 1)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 1; COMMONS_BUILD_PLAN.md 'The pilot'; COMMONS_PRODUCT_NORTH_STAR.md: related work counts as used only when this question shows people identified it correctly."
goodhart     = "this can read 1 while the predicate is false if the answer rests on one memorable session rather than the pilot's sessions, or if briefs showed almost no related work; the seat asks with the session count and stats' related-work lines beside it"
status       = "open"

[[bar]]
id           = "eu-pilot-lesson-retrieval"
question     = "Did a session get a relevant lesson that a different session had recorded, at the point it needed it?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-lesson-retrieval"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09)"
direction    = "higher_is_better"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, people retrieve the relevant lesson recorded by a different session (UX question 2)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 2; COMMONS_BUILD_PLAN.md 'The pilot'; COMMONS_PRODUCT_NORTH_STAR.md north star metric (a lesson counts as used when the receiving session cites, confirms or corrects it)."
goodhart     = "this can read 1 while the predicate is false if the retrieving session is the one that wrote the lesson; only a lesson carried from a different worktree, repository, machine or person counts, and stats' carried-lesson line is set beside the question"
status       = "open"

[[bar]]
id           = "eu-pilot-rules-vs-proposals"
question     = "In what briefs showed from canon, could you tell current rules from proposals?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-rules-vs-proposals"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09)"
direction    = "higher_is_better"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, people distinguish current rules from proposals in what the brief shows (UX question 3)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 3; COMMONS_BUILD_PLAN.md 'The pilot': served by the brief's read-only canon section, with proposals made with canon directly until E8."
goodhart     = "this can read 1 while the predicate is false if no proposal was pending in any canon during the pilot, so there was nothing to tell apart; then the answer is unsure, not yes"
status       = "open"

[[bar]]
id           = "eu-pilot-handoff-recovery"
question     = "Did a successor session pick up from a handoff (objective, state, open decisions, verification) without re-reading the transcript or the repository?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-handoff-recovery"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09)"
direction    = "higher_is_better"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot's real sessions, a successor session recovers a handoff: objective, state, open decisions and verification (UX question 4)"
derives_from = "COMMONS_UX_NORTH_STAR.md 'Proof by experience', question 4, and law U4 ('the handoff carries the work, not the transcript'); COMMONS_BUILD_PLAN.md 'The pilot', E5.4."
goodhart     = "this can read 1 while the predicate is false if the successor resumed from the session frame or the transcript rather than from euphemia's handoff (U4 refuses transcript archaeology)"
status       = "open"

# ── The product guardrails, asked the same way ──────────────────────────────

[[bar]]
id           = "eu-pilot-precision"
question     = "Were the items briefs showed mostly ones the session went on to use, rather than noise?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-precision"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09)"
direction    = "higher_is_better"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, what briefs show is mostly used by the receiving session (the guardrail whose failure is the campaign's stop condition)"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'Guardrails' ('Precision: the share of shown items that get used. Low precision is the campaign's stop condition') and 'What would prove it wrong'; E5.5 (`stats` computes its share, set beside the question)."
goodhart     = "this can read 1 while the predicate is false if briefs showed so little that nothing could be noise; it is asked beside stats' withheld line and the capture question"
status       = "open"

[[bar]]
id           = "eu-pilot-false-collisions"
question     = "Were the collision warnings right: none, or too few to matter, about work that did not actually overlap?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-false-collisions"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09)"
direction    = "higher_is_better"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, collision warnings that named work which did not in fact overlap are rare enough not to matter"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'Guardrails' ('False collision warnings'); COMMONS_UX_NORTH_STAR.md 'Proof by experience'; COMMONS_BUILD_PLAN.md 'The pilot'."
goodhart     = "this can read 1 while the predicate is false if overlap was rarely shown at all (warnings suppressed rather than accurate); it is asked beside the related-work question"
status       = "open"

[[bar]]
id           = "eu-pilot-brief-cost"
question     = "Was each brief cheap enough, in tokens and in the delay at session start, that you would keep it on?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-brief-cost"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09)"
direction    = "higher_is_better"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, the brief's tokens and the delay it adds at session start are worth keeping it on"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'Guardrails' ('Brief cost: tokens per brief, and the delay added at session start'); design §7 (the brief's budget of about 1,500 tokens, which names anything it cuts). One question covers both quantities."
goodhart     = "this can read 1 while the predicate is false if the brief stays cheap by cutting what sessions needed; its truncation line is set beside the question, and the four UX questions read with it"
status       = "open"

[[bar]]
id           = "eu-pilot-capture-rate"
question     = "Did sessions actually record claims and lessons, often enough for later sessions to gain from them?"
instrument   = "\"$HOME/dev/euphemia/scripts/pilot.sh\" value eu-pilot-capture-rate"
floor        = 1.0
floor_basis  = "structural: the operator's recorded answer, yes 1 and no 0 (operator 2026-10-09)"
direction    = "higher_is_better"
rung         = "a-pilot"
one_line     = "CLAIM: in the pilot, sessions record claims and lessons often enough that something compounds"
derives_from = "COMMONS_PRODUCT_NORTH_STAR.md 'The inputs that move it' ('Capture rate ... If it stays near zero, nothing compounds') and 'What would prove it wrong' ('sessions do not capture'); E5.5 (stats' capture share, set beside the question)."
goodhart     = "this can read 1 while the predicate is false if hooks or agents record by rote, so captures nobody uses count; it is asked beside the precision question"
status       = "open"
