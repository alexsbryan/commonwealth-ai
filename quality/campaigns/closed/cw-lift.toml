[[bar]]
id           = "cw-rail-closure"
one_line     = "CLAIM: the rail is a genuine primitive, not an artifact of this codebase"
derives_from = "RE-DERIVED 2026-09-04 before 1b from 1a's measurement; MEASURED at 1b (ff63884f3)"
# ── FLAT AT 42 / 43 ACROSS 1b, 1c AND 1d. Flat IS the pass: this bar's kill
# condition is a RISE, and there was none at any of the three. Re-run by the
# seat with cargo tree at each commit, not taken on report. ──
# ── MEASURED AT 1b: rail-core closure = 42, commonwealth-rail = 43. ──
# Under the 45-50 the signature stack predicted, above oplog's 28 floor.
# THE MEMBERSHIP HALF — the real claim — ALREADY HOLDS, at 1b rather than 1d:
# zero corpus-engine*, zero sovereign-*, zero commonwealth-{knowledge,
# inference,api} in either closure. Verified twice, by the worker and by the
# seat re-running cargo tree independently.
# 1d WAS RE-DERIVED AND LANDED AS SOMETHING ELSE (84e6fd1c0). Its headline
# ("SEVER rail -> corpus-engine") was already spent at 1b, and its "5 remaining
# oplog sites" was ONE site, in a CONSUMER rather than the rail — it moved in
# 1c. What 1d turned out to be: after 1c, sovereign-cli-llm's whole
# commonwealth-knowledge dependency was held by a single rustdoc link in
# ring_cmd's module header. No type, no use, no call. De-linked, dep dropped,
# and NO SOVEREIGN CRATE NAMES THE KNOWLEDGE LAYER IN A MANIFEST ANY MORE.
# NOT done, deliberately: commonwealth-knowledge -> corpus-engine. shard_manager
# names CorpusEngine/Corpus/IndexInfo/ShardInfo/ChunkRange across nine sites.
# That is the knowledge layer being itself, not a misplaced boundary; it needs a
# shard seam, which is a phase and not half a chunk.
# STILL OPEN, found at 1b and not decidable there: the rail CANNOT join the
# `commonwealth` package. commonwealth-rail-core names `oplog`, `oplog` is not
# a [[package_leaf]], and adding it needs a new grandfathered row — a declared
# campaign stop condition. So the layer map governs the rail and boundary-gate
# does not. Promote oplog to a leaf, or leave the rail outside the liftable set
# and write down why. That is a 1d/1e decision.
status       = "open"
# (was "re-derived" — RE-DERIVED 2026-09-04; still open, see below)
# ── P3 (<= 20 CRATES) WAS FALSIFIED BEFORE THE WORK IT GATES EVEN STARTED ──
#
# `commonwealth-rail-core` must contain `oplog`. `oplog`'s full closure,
# measured at 1a (33b003a2e), is 28 crates — blake3 + serde + serde_json +
# thiserror + tracing + kernel-types and their transitive set. So rail-core's
# FLOOR is 28 before it names anything of its own, and P3's <= 20 is
# arithmetically unreachable.
#
# It gets worse honestly: the rail signs. `ed25519-dalek` brings curve25519-
# dalek, digest, block-buffer, generic-array, typenum, const-oid, crypto-
# common, subtle, zeroize, ed25519, pkcs8, der, pem-rfc7468, base64ct, sha2,
# signature, rand_core, cpufeatures — roughly twenty more. Expect 45-50.
#
# P3 WAS DERIVED WITHOUT PRICING THE SIGNATURE STACK, which is not optional for
# a rail whose entire thesis is signed authorship. This is the third time in
# this workspace that a headline bar measured something adjacent to its thesis
# (nc-redundant, hpr-cheaper v1, this). Recorded rather than quietly patched: a
# floor corrected in silence teaches nobody.
#
# WHAT THE BAR SHOULD HAVE ASKED, and now does: the rail must not carry the
# KNOWLEDGE LAYER. A crate count conflates "third-party crypto" with
# "corpus-engine's 578-crate world"; the second is the defect and the first is
# the price of signing. So the real bar is a MEMBERSHIP test, not a count:
# zero corpus-engine*, zero sovereign-*, zero commonwealth-{knowledge,
# inference,api} in the closure. That is what 1d earns and what the three
# [[forbid]] blocks minted at 1a already enforce for oplog.
#
# The count is kept as a TRACKED number so a rise is visible; it is no longer
# a pass/fail. The loader has no "tracked" direction (closed set: higher /
# lower / near_zero), so the tracking is expressed as lower_is_better with the
# expected ceiling as the floor and oplog's bare closure as the target — a
# rise past 50 reads as failed, which is the visibility the prose asked for.
floor        = 50.0
floor_basis  = "expected 45-50 once the signature stack is priced (2026-09-04, the ed25519 paragraph above); 28 = oplog's full closure measured at 1a (33b003a2e)"
target       = 28.0
direction    = "lower_is_better"
instrument   = "cargo tree -p commonwealth-rail-core -e normal --prefix none | awk '{print $1}' | sort -u | wc -l"
kill         = "K1 — the canon composition forces either side to grow a dependency or a shim. The boundary is not where we think it is."

