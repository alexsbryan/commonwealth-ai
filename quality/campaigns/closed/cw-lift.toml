#
# BUT THE BAR'S PROSE CLAIM IS NOT MET, AND NOW THAT THE INSTRUMENT IS AT
# TARGET FOR THIS CLASS THAT DISAGREEMENT IS THE WHOLE STORY. The one_line
# says "a sovereign daemon can compile and boot with zero commonwealth-* and
