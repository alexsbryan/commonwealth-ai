# ── CORRECTION, SAME DAY. THE SENTENCE ABOVE ("neither instrument can see that
# and neither ever could") IS WRONG, AND THE INSTRUMENT ALREADY EXISTED. ──
#
# There are FOUR discovery feeds and I ran one before concluding none served:
#   converge census  NAME · converge roles ROLE · converge shape SHAPE
#   converge verb    JOB  · dry-report          BEHAVIOUR
# `converge shape` matches (field name, field type) sets, IDF-weighted, and
