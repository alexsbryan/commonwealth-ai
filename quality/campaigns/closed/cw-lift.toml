# A clean intra-crate cut EXISTS: 17 modules / 12,540 lines, severed by moving
# one env helper (auto_resume::env_truthy). Adding the four near-clean modules
# reaches 47 of 78 for 21 modules / 15,634 lines. **31 items stay behind
# however the cut is drawn**, and AppState is not what blocks them —
# `EmbeddedDaemon` is. Twenty-one of the thirty-one are class (c): the
# daemon's own lifecycle and HTTP composition, which is not a mesh feature and
# has nowhere else to live.
#
# SO THE SEAM DOES NOT CLOSE THE BAR. `cargo tree -p sovereign-cli-daemon -e
# normal` is 845 crates, 10 of them commonwealth-*, and `-i` on each gives the
# SAME terminal edge: every one rides sovereign-mesh, there is no second path.
# A `sovereign-local` crate leaving 31 items behind moves 15,634 lines,
# deletes ZERO dependencies, and the manifest still reads `sovereign-mesh`.
# By K2's own test that is the shim it warns against. (The seam is a real
# crate-graph improvement; it is not this bar's closeout, and it is not
# ledgered as one.)
#
# WHAT LANDED INSTEAD — the profile, and the half of it that already existed.
# §19 inventory first: mDNS and iroh already had runtime off-switches
# (`mdns_enabled_effective`, `iroh_access::resolve_enabled` + SOVEREIGN_IROH).
# What did not exist was anything answering "is this daemon local-only", so
# the two knew nothing of each other and FOUR loops had no gate at all —
# gossip (daemon.rs), auto_ingest collaborate, ring_sync, and the rail KV pump
# W2 added beside it. `sovereign_mesh::local_only::LocalOnlyProfile` is now
# that one decider (§10.6), resolved once in start_daemon from
# `[daemon] local_only` + `SOVEREIGN_LOCAL_ONLY` (honoured in BOTH directions;
# an unrecognised value warns and defers rather than reading as false, §18.3).
# The two existing gates READ it; `internal_bind_addr` reads it; the four
# loops are behind it. `local_only` + `require_encryption` is refused AT BOOT
# BY NAME — without that refusal the daemon still stops, but on WS-B's "iroh
# endpoint failed to bind", which names neither setting that disagrees.
#
# THE MESH-OF-ONE STAYS. The profile skips the NETWORK, not the model: the
# Mesh is minted, persisted and served with one member, and `/v1/models`
# answers. An `Option<Mesh>` would fork every reader of membership; the solo
# case is the honest N=1 and it is what the order's THE PRINCIPLE section
# required.
#
# CLASS 3 CLOSED WITHOUT A BRANCH. `daemon_cmd/mod.rs:1174-1186` returned 1 on
# `create_mesh` failure, and rung 3b established that its live failure modes
# include start_daemon's mDNS register/browse. Under the profile mDNS never
