# test cannot pass vacuously the day someone deletes the spawns.
#
# SHIPPED DEFAULT-OFF: sovereign/DEFAULTS_LEDGER.md carries the row, its flip
# condition (the profile graduates by being REACHED — a `--local-only` flag or
# the desktop's Local mode — not by a default flip) and a 2026-12-08 review-by.
floor        = 8.0
floor_basis  = "measured 2026-09-08: before the profile, a daemon booted with [discovery] mdns=true and [iroh] enabled=true spawned all EIGHT members of the RunningServices closed set — mdns_advertise, mdns_browse, gossip, auto_ingest_collaborate, ring_sync, rail_kv_pump, iroh_endpoint, iroh_watchdog — with no runtime posture able to stop the middle four at all. The prior instrument (blocker classes, 3c) read 2.0 here and is retired at 1.0; its final reading is in the closeout block above."
target       = 0.0
direction    = "lower_is_better"
instrument   = "./scripts/sovereign-test.sh --package sovereign-mesh --filter a_local_only_daemon_spawns_no_network_service >/dev/null 2>&1 && echo 0 || exit 4"
# The value is RunningServices under the profile, which the test asserts is 0;
# a failing run exits 4 (could-not-judge, read the log) rather than inventing 8.
timeout_s    = 900
kill         = "K2 — AppState (commonwealth-api/src/state.rs:585, 2,659 lines, 44 crossing refs) cannot be cut without a shim over ~300 lines. Then local and mesh state are genuinely fused and the honest deliverable is a RUNTIME PROFILE, not a package. Say that rather than shipping a shim and calling it a boundary."

