#
# CLASS 3 SURVIVES, AND THE ORDER'S REASONING FOR WHY IT WOULD DIE WAS WRONG.
# The order said a solo adapter that constructs infallibly makes
# `daemon_cmd/mod.rs:1182`'s mint "die for free". It does not.
# `EmbeddedDaemon::create_mesh` generates and persists node identity, builds
# the mesh record, STARTS THE DAEMON LISTENER and stamps the invite; its
# `return 1` fires on AlreadyRunning, on Config("no node in mesh"), and on
# start_daemon's mDNS register/browse failures — real failures a solo node
# hits, honestly refused (§18.3). A solo ADAPTER constructs infallibly; a solo
# NODE still needs a listener. What could honestly die is the fusion of "create
# the mesh record" with "bind the listener" inside create_mesh — surgery in
# sovereign-mesh's lifecycle that removes no commonwealth-* dep and therefore
# does not move this bar.
#
# THE INSTRUMENT COUNTS CLASSES, NOT SITES, AND NOW SAYS SO. `floor = 3.0`
# against four deps + two forcings + one mint is only coherent as three
# CLASSES; read as sites it would have been 7.0. This campaign has already
# lost one bar to an instrument that was never written down (cw-net-deletion,
# fa69be382). Naming it here rather than leaving a second one implicit.
# ── K2 FIRED — RUNTIME PROFILE. CLOSEOUT 2026-09-08 ─────────────────────────
#
# K2's own text: "if extracting drags AppState the fusion is real, and the
# honest deliverable is a RUNTIME PROFILE, not a package. Say that rather than
# shipping a shim and calling it a boundary." The fusion census answered it,
# and the answer arrives from a different number than K2 expected.
#
# THE MEASUREMENT (fusion census, HEAD 6cc8da6ed; every row names its command).
# 78 distinct `sovereign_mesh::` items reached from sovereign-cli-daemon
# (105 sites, 11 files, 29 mesh modules — rung 3c's count reproduces exactly):
#     (a) MESH-ONLY               25   peer_inference, deep_link, peer_adapter,
#                                      persist::load, mesh_http, ring_roster, …
