[[bar]]
id           = "cw-sovereign-commonwealth-edge"
one_line     = "CLAIM: the ungoverned sovereign -> commonwealth edge narrows as vocabulary is rehomed"
derives_from = "P1, re-derived 2026-09-04 at 4b from a per-crate census of the edge"
status       = "deferred"
# DEFERRED at close, 2026-09-11. The `instrument` below is a command with a
# prose parenthetical glued to it, so the measure harness execs it and bash
# dies on the `(` — every reading since declaration has been could-not-judge
# for that reason and not for anything about the edge. Stripping the prose is
# not enough either: nc-boundary.py ends on a type list, not a number, so it
# violates the instrument contract. This bar has never judged. It is deferred
# rather than descoped because the claim is still the right one to ask.
# ── P1 IS FALSIFIED AND PHASE 4 IS OVER. The claim above is kept verbatim so
# the miss stays legible; what follows is the correction, not a replacement.
#
# 4a delivered 6 types / 21 refs. 4b (2a5b63325) delivered ZERO: all 55
# references to the five types and one function it moved were already inside
# commonwealth/, so nothing it touched was ever ON this edge. Phase 4 has no
# further rungs. Against P1's 13 / ~144, Phase 4 closes at 6 / 21 — 46% of the
# type claim and 15% of the ref claim.
#
# WHY THE PREDICTION WAS WRONG: it priced the edge as VOCABULARY and the edge
# is not vocabulary. Per-crate census of the 618 refs (index 997148603):
#
#     571 refs / 100 types  sovereign-mesh
#      14 / 5  sovereign-cli-llm       9 / 2  sovereign-cli-daemon
#      13 / 2  sovereign-work-atlas    6 / 1  sovereign-tools
#       4 / 2  sovereign-server        1 / 1  sovereign-desktop
#
# 93 of the 104 types are named by sovereign-mesh AND BY NOTHING ELSE. A type
# with exactly one consumer is not shared vocabulary looking for a neutral
# home; it is one application naming another's internals, and the edge follows
# it wherever it is moved. That is why 4a worked and 4b could not: fair_sched
# was named by two non-mesh crates. It was the LAST of its kind, not the first
# of thirteen.
#
# THE REHOMING LANE'S WHOLE REMAINING HEADROOM IS 4 TYPES / 5 REFS, named:
#     Error (sovereign-work-atlas, 1)   PeerPreference (sovereign-desktop, 1)
#     Person (sovereign-cli-llm, 1)     Roster (sovereign-cli-llm, 2)
# Seven other non-mesh types — MeshStore 27 refs, CorpusShardInfo 6,
# ConvergenceRecord 3, IrohAcceptor 3, EndpointClaim / NodePubkey / RelayConfig
# 1 each — are ALSO named by sovereign-mesh, so a move relocates them and does
# not remove them. And Person/Roster are rail types 1b moved into
# commonwealth-rail-core: still commonwealth, still on the edge.
#
# SO THE TARGET BELOW IS THE CEILING OF THE CLAIM AS WORDED, not a plan. 100 is
# 104 less those 4 — everything this bar's own sentence can still buy, and it
# is not funded by any open rung. Below 100 needs a DIFFERENT mechanism:
# sovereign-mesh ceasing to hold a second substrate (Phase 2), or Phase 3,
# which is unscoped. When one of those is ordered, open a bar for it rather
# than lowering this target to a number nothing pays for.
#
# THE FLOOR ROSE, AND IT WAS NOT THIS CAMPAIGN. This bar recorded 95 / 595 at
# 83c0caebf. The same script — unchanged since 27c0fe031, 2026-08-26, verified
# an ancestor of that commit — reads 104 / 618 at 997148603. +9 types / +23
# refs from work outside cw-lift. The campaign is not losing ground; it is
# being outrun, and a floor that moves under you is worth more visible than a
# target that flatters.
# RE-MEASURED on a FRESH index at f61d8eea4 (all of Phase 1 landed):
#   sovereign -> commonwealth   618 refs / 103 types   (was 104 at 997148603)
# One type came off, from 1c/1d dropping the knowledge-layer edge. The refs did
# not move, which is consistent: 1d removed a MANIFEST dep held by a single
# rustdoc link, not references.
# 4b's OTHER prediction VALIDATED: it forecast commonwealth -> oicp would reach
# 43 types after the move. Fresh index reads 43 (over 353 refs, where it
# predicted ~392). Types exact, refs 10% high — recorded because a prediction
# that lands is as much evidence about the instrument as one that misses.
floor        = 103.0
floor_basis  = "python3 scripts/nc-boundary.py against a fresh SCIP index at f61d8eea4, 2026-09-04, after all of Phase 1: 103 types / 618 refs. Was 104/618 at 997148603 and 95/595 at 83c0caebf — the campaign-external drift in that gap is recorded above"
target       = 100.0
direction    = "lower_is_better"
instrument   = "python3 scripts/nc-boundary.py  (read the banner — it names the commit the INDEX describes, not your tree)"
