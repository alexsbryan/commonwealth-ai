#   class 3 (mesh-mint-to-boot site)                CLOSED by the paragraph
#             above.
# 2.0 -> 1.0 on the old instrument, and the one that remains is the one this
# campaign already decided not to pay for. That is why the count is not the
# instrument any more: it can only move by a decision already refused.
#
# THE NEW INSTRUMENT IS A BOOT ASSERTION, and it is falsifiable where a
# manifest count is not. `EmbeddedDaemon` records what it spawned in a
# `RunningServices` census (a closed set of eight background services, ARCH
# §2) read back by `running_services()`. The test boots with the profile ON
# and a config that asks for mDNS *and* iroh — so the assertion is a real
# differential, not a restatement of config — and counts the census.
# WATCHED RED, four sabotages, each turning exactly its own assertion:
#   four-loop gate removed  -> spawned `gossip`  [gossip, auto_ingest_
#                              collaborate, ring_sync, rail_kv_pump]
#   mDNS gate stops reading -> spawned `mdns_advertise`  [+ mdns_browse]
#   iroh gate stops reading -> spawned `iroh_endpoint`   [+ iroh_watchdog]
