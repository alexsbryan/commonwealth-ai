# ── 2026-09-09 · PHASE 5 DECLARED SEVEN BARS AND THE FILE HAD ROOM FOR TWO ───
#
# The Phase 5 plan's "Bars to add" table is seven rows, one of which is
# cw-net-deletion above — reused, not re-minted. Six were new. This file
# already carried seven bars against a cap of nine (MAX_BARS,
# scripts/co-lineage.py), and the loader raises DataError over the cap, which
# makes the campaign unreadable to co-lineage, co-drift, co-order and the
# comaintainer skill all at once. The cap's own error text is the instruction
# and it was followed: "a campaign that needs more bars needs a smaller
# campaign. Escalate; do not widen."
#
# So TWO are minted below and FOUR are pre-registered in this comment instead.
# Pre-registration in a comment is a weaker instrument than a bar, and that is
# the honest cost of the cap rather than a reason to let the claims go
# unwritten — a bar has to exist before the data or the verdict is not honest
# (§18.1).
#
# THE TWO WERE CHOSEN BY A STATED RULE so the choice is auditable rather than
# a worker's taste: this campaign's OBJECTIVE is a liftable substrate package
# and its CLAIM block names TWO LIFTS. cw-work-package-lift is lift #2 finally
# attempted, six rungs after 1f was descoped for want of a product.
# cw-work-ci-offload is the only Phase-5 claim with a real numeric floor, and
# it is PLAN.md rung 5's own demo. The four below measure the PILOT's internal
# quality, which is Phase-5 work rather than this campaign's thesis.
#
# THE FOUR NOT MINTED, at their honest readings, so a later promotion inherits
# a pre-registration rather than writing one after seeing the data:
#
#   cw-work-one-decider    one may_take, one fold, one act codec, one
#                          rail_append, one canonical writer.
#                          Instrument: a structural test that greps for a
#                          second definition of each.  1 -> 1.  First reading
#                          possible at 5c.
#                          PROMOTE THIS ONE FIRST if a slot frees. The design
#                          names THREE deliberate §10.6 deviations that must
#                          close — two lease deciders across 5c-5f, a seventh
#                          spawn-with-timeout the package cannot avoid, and
#                          Offer.accept_from beside PeerTrustLevel — and this
#                          bar is the only thing that would stop them being
#                          quietly forgotten.
#
#   cw-work-rev-pin-gate   a rev-pinned unit is refused on a stale donor, and
#                          an unpinned one on a stale donor is caught by
#                          ComputeAttribution::comparable_to.
#                          Instrument: 5e's bars (ii) and (iii), the second
#                          watched failing.  never-ran -> passed.
#
#   cw-work-no-inference   no unit in the pilot's Submits carries SlotDecodes
#                          or CorpusInstalled, and no executor in the package
#                          names a model.
#                          Instrument: a structural test over oicp_types::job
#                          and commonwealth-work.  0 -> 0.  First reading at
#                          5c.  This is the bar that keeps the operator's
#                          "anchored way too much on inference" decision from
#                          eroding one payload at a time.
#
#   cw-work-second-lift    a package-only binary <= 400 lines completes three
#                          heterogeneous units on a box with no sovereign
#                          build.
#                          Instrument: the 5f demo plus a line count.
#                          never-ran -> passed.  It lost the slot to
#                          cw-work-package-lift, which is the harder half of
#                          the same question: package-lift asks whether the
#                          closure BUILDS off the monorepo at all, and
#                          boundary-gate cannot answer that.
#
# OPEN FOR THE OPERATOR: which of the four to promote, and at whose expense.
# cw-ledger-closes-itself is descoped and still counts against the cap, so
# retiring it would free exactly one slot. That is a decision about this
# campaign rather than about Phase 5, and it is not taken here.

[[bar]]
id           = "cw-work-package-lift"
one_line     = "CLAIM: commonwealth-work and a package-only work peer BUILD and RUN outside this monorepo, with zero sovereign-*, zero corpus-engine* and zero commonwealth-{knowledge,inference,api} in the closure"
derives_from = "the CLAIM block at the top of this file, lift #2 — descoped at 1f for want of a product, re-opened 2026-09-09 with one; plus BOUNDARY.md's physical-lift discipline"
status       = "open"
# NO MEASUREMENT ROW, so this bar is OPEN — and the reason it has none changed
# on 2026-09-09. It used to be that there was nothing to run: commonwealth-work
# did not exist until 5c and the peer binary until 5f, the instrument below was
# absent, and the runner read rc 127 as could-not-judge:instrument-missing.
# Both now exist and 5f (b03cbad01) reports running the lift at exit 0, value 1.
# That is a commit body's claim, not a row this runner wrote, and a bar closes
# on a row reading `met` and never on prose here — so the reading stays absent
# rather than being written up from the ladder.
# THE INSTRUMENT STILL REFUSES TO SWALLOW ITS OWN FAILURE into an `echo 0`,
# which is what 5f's eight sabotages were written to prove: a `sovereign-core`
# dep and a hand-spelled path each drive value 0, while an unresolvable
# dependency and a missing `python3` each drive rc 3 with NO number emitted. A
# 0 written by a missing tool is a substitution (§18.3) and would be
# indistinguishable from a measured failure.
# THE BAR IS A PHYSICAL LIFT, NOT A CRATE-NAME COUNT, and 1f' is why: the
# package built standalone in 8.4s with zero source edits, which is a fact
# `cargo tree` could not have produced.
# THE kernel-types HAZARD IS CLOSED — CORRECTED 2026-09-09, and this text
# asserted the opposite for six rungs after it stopped being true. It was real
# at 1f', which failed `490 passed, 2 failed` on exactly two leaf-side tests
# that read the repo root: `requirements_registry.rs:94` through
# `CARGO_MANIFEST_DIR.parent()` and `conformance_tags.rs:80` shelling
# `git ls-files`. Both generators LEFT kernel-types on 2026-09-04 (c1116b31e,
# "the two repo-root generators leave the liftable kernel") for
# `corpus-engine/xtask/tests/`, which sits in NO declared package so no lift
# carries it. 5f's sandbox scan found no `CARGO_MANIFEST_DIR` read, no
# `git ls-files` and no `include_str!` escaping a crate root anywhere in the
# lifted closure; `oicp-types`' embed of `default_aliases.toml` is crate-local.
# No kernel-types change was necessary for the lift. Same correction in
# commonwealth/BOUNDARY.md, §"The kernel-types hazard is closed".
# THE GATE THAT MISSED IT HAS SINCE GROWN THE RULE, which is the other half
# the old text got wrong. `boundary-gate` used to grep only for `build.rs`,
# `include_str!` and `include_bytes!` — compile-time shapes — so a RUNTIME
# subprocess reach-out was invisible to it. 787eda806 (2026-09-04) added
# `scan_runtime_escapes`, which windows both shapes: a `CARGO_MANIFEST_DIR`
# read with a `.parent()`/`join("..")` climb within [-2,+8], and a `git`
# subprocess with no `current_dir(…)` within 15 lines — deliberately NOT
# flagging git run at a path the CALLER supplied, which is how
# corpus-engine-archaeology lifts fine.
# THE SECOND GATE IS BACK, and it was missing for longer than anyone knew. 5g
# (1e5418f4b) found that `boundary-gate` did NOT catch a `commonwealth-work ->
# sovereign-*` dependency EDGE — the one edge it exists to catch: adding
# `sovereign-contracts` to that manifest reported `commonwealth 7/7 crates
# present … ✓`, exit 0, twice, while `layer-gate` exited 1 on the same tree.
# a32115fc4 (2026-09-09) fixed it at the cause. The package pass decided each
# edge against the package's own crates plus ALL `[[package_leaf]]` names, and
# leaves are GLOBAL — admitting one widens every package at once — so
# `sovereign-contracts` being liftable with `studio` made it liftable with
# `commonwealth`, whose entire declared property is that it names no
# `sovereign-*`. Membership cannot express "this package, unlike the others,
# may not reach that leaf"; the `[[forbid]]` row can, and did, and the pass
# never read it. `arch_layers::forbidden_by` is now the one named decider both
# gates call (§10.6). So the guard keeping this package liftable is two gates
# again — recorded because for the whole span in which this bar's own hazard
# text was stale, it was one.
floor        = 0.0
floor_basis  = "never-ran, 2026-09-09 — 0 is the absence of a lift rather than a measured failure (§18.2); the first real reading is 5f's sandbox build"
target       = 1.0
direction    = "higher_is_better"
instrument   = "scripts/cw-work-lift.sh --sandbox"
timeout_s    = 900
kill         = "K11 — the closure cannot leave the monorepo without a shim or a new dependency. Then commonwealth-work belongs inside sovereign-mesh and the work plane is an application, not substrate."

[[bar]]
id           = "cw-work-ci-offload"
one_line     = "CLAIM: this repository's own CI runs on a node that did not submit it, and the merged verdict equals a local run at the same rev"
derives_from = "PLAN.md rung 5 and GROUND_TRUTH.md §The CI economy (hosted CI dead on a spending limit, 4,369 billed minutes audited); operator decision 2026-09-09 that the pilot is LLM-free"
status       = "open"
# THE FLOOR IS A TRUE ZERO, not an absence: every unit of this repository's CI
# runs on the box that asked for it, because no other path exists. The reading
# is could-not-judge until 5e, and today for the plainest reason: the script
# does not exist, so the runner reads rc 127 and records instrument-missing
# (verified 2026-09-09). When 5e writes it, it must exit 3 on an absent
# summary — artifact-absent — rather than printing this floor back as though
# a run had measured it. The `node` field it counts does not exist on
# quality-check/v1 rows before 5e adds it.
# EQUAL COUNTS IS HALF THE CLAIM AND IT IS THE HALF THAT CAN LIE. A split run
# that silently drops a shard reports a smaller, greener table than a local
# run, and a share-only bar would score that as a win. So the share is what is
# scored and the count equality is what gates it: the merged table must match
# `sovereign-test.sh --human` at the same rev, and a unit the cohort cannot
# place is a NeverRan row carrying its refusal, never a row that is absent.
floor        = 0.0
floor_basis  = "measured by construction, 2026-09-09: no distributed path exists, so the share of units run off the submitting node is exactly 0"
target       = 0.5
direction    = "higher_is_better"
instrument   = "scripts/cw-work-offload-share.sh"
kill         = "K12 — the split run is slower than the local one with an IDE and a daemon resident, or the merged counts cannot be made to match. Then donated CI is a demo, not a lane."

[[bar]]
id           = "cw-ledger-closes-itself"
one_line     = "CLAIM: the acceptance ledger is USED, not just built — and closure fires without a human"
derives_from = "P4; the feedback_creation_closure_loop failure mode, named verbatim"
status       = "descoped"
# DESCOPED 2026-09-04 with 1f, and the reason is worth keeping because the bar
# itself was a good one. It tested whether a created thing gets CLOSED without
# a human — this repo has four *_LEDGER.md files that rot while reading as
# authoritative. That failure mode is real and this bar was the right shape
# for it. What went away is its SUBJECT: canon x rail existed to exercise the
# substrate, the physical lift exercised it better the same day, and the
# operator confirmed there is no product pulling the ledger.
#
# THE DEBT DID NOT GO AWAY WITH THE BAR. SYSTEM_OVERVIEW §10.1c-k is ~417 lines
# of hand-written acceptance prose with no query surface, and THIS CAMPAIGN
# ADDED TO IT TODAY — four commits raised ceilings (ff63884f3, b94d399eb,
# 34d308b85, c1116b31e), roughly eight acceptance acts in one day, each with an
# actor, a reason and an implied review-by that nothing will resurface. If that
# is ever built it lands as a product on its own merits, with its own bar.
# Within one week of 1f landing the ledger holds at least the six entries this
# campaign generates (four conformance retirements from 0b, two size-gate
# --accept rows per new crate), and AT LEAST ONE HAS BEEN AUTO-WITHDRAWN by a
# Monday --tighten with no human touching it.
#
# The closure loop costs nothing: when a ratchet tightens below an accepted
# ceiling, the acceptance is provably discharged. baseline-tighten.yml already
# runs that tighten every Monday 06:00 UTC. Creation is `size-gate --accept`
# emitting an act; closure is a cron that already exists.
#
# IF CLOSURE NEVER FIRES ON ITS OWN, the loop was decorative and 1g does not
# land. That is the whole point of the bar — four *_LEDGER.md files in this
# repo already rot while reading as authoritative, and none has a closure
# trigger.
floor        = 0.0
floor_basis  = "structural — the ledger holds no live grant until 1f lands; zero is the state at declaration (2026-09-04)"
target       = 6.0
direction    = "higher_is_better"
instrument   = "the ledger's own as-of reader, counting live grants"
kill         = "K5 — the ledger cannot express §10.1j, a finding about an INSTRUMENT's blindness rather than a debt with a payer. Then it covers the easy half of §10, the prose stays, and 1g is not declared."
