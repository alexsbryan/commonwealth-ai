#   Filtering names declared in ANY workspace trait block (1,255 of them):
#   3,960 dropped, ZERO survive.
#   => THERE IS NO ZERO-CALLER DEAD CODE IN sovereign-mesh AT >= 25 LINES.
#
# WHAT THE CAMPAIGN IS ACTUALLY CHASING IS A CONCEPTUAL FORK — the same
# decision implemented twice from scratch, sharing no bytes and no embedding
# neighbourhood:
#     what orders events?      rail total order   vs  LWW, unordered
#     who may write?           roster admission   vs  nothing
#     how do peers converge?   digest a-e, 60s    vs  full snapshot, 10s
# NEITHER INSTRUMENT CAN SEE THAT AND NEITHER EVER COULD. BOUNDARY.md rule 2
# named it correctly as §10.6 at crate scale; it is not a clone.
#
# CONSEQUENCE FOR SEQUENCING: the cut that removes it is deleting the unsigned
