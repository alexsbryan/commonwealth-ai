# ── RUNG 3c CLOSEOUT, 2026-09-05: 3.0 -> 2.0, AND THE CLAIM IS NOT MET ──────
#
# CLASS 1 IS CLEARED. `sovereign-cli-daemon` has ZERO direct commonwealth-*
# deps (3a took tdd/agent-tools out by renaming what was never substrate; 3b
# took state/core/api out behind two ports). Verified by reading the manifest,
