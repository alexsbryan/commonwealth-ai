# CLASS 2 IS REFUSED FOR NOW, WITH DATA (3b, 9f1ed6692). Not "one line": the
# manifest change alone is 17 errors in 5 files, and cfg-gating
# iroh_access/iroh_watchdog/guest_tunnel adds 28 more across daemon.rs (22),
