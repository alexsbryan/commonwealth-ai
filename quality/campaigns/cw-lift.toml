# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
# Defer/descope = edit a bar's `status`; git history is the ledger.
#
# ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is the
# committed artifact and the LADDER carries the rung list, so the plan survives
# without them.
id        = "cw-lift"
objective = "Commonwealth becomes a liftable substrate package in-repo, so a sovereign daemon runs local-only and mesh is additive"
spec      = "the approved plan, 2026-09-03; commonwealth/BOUNDARY.md is its committed half"
register  = "quality/ARCH_LAYERS.toml"
declared  = "2026-09-04"
status    = "open"

# ── THE CLAIM ───────────────────────────────────────────────────────────────
#
# Mesh is not a layer above local; it is the substrate. `daemon_cmd/mod.rs:
# 1174-1186` fabricates a Mesh named "{hostname}'s Mesh" and returns 1 if that
# fails. Notes are gossip events, work-atlas claims are MeshStore rows. That is
# the "mesh of one" and it is the right RUNTIME idea. What it also does, which
# is not required by it, is make the local case unable to link, boot or persist
# without the whole mesh.
#
# THE SUBSTRATE HAS ONE HOME: commonwealth proper (core/transport/state/
# discovery) + the rail. `sovereign-mesh` is an APPLICATION on it, never a
# second substrate — its substrate-shaped names have ~15 of ~234 crossing refs,
# so extracting them would fork the deciders this package owns: two replication
# paths, two orderings, two admission rules. §10.6 at crate scale.
#
# PROVEN BY TWO LIFTS, not by a gate:
#   1. a local-only daemon compiles with zero commonwealth-* and no iroh
#   2. a SECOND application (canon x rail) composes on the substrate with zero
#      sovereign and zero corpus-engine

# ── LADDER ──────────────────────────────────────────────────────────────────
#
#   -1  instrument the boundary        b704b845d  DONE
#   0a  delete 12 dead modules         5cc9076fc  DONE   -1,892
#   0b  delete orchestrator + gossip   e9f20feec  DONE   -3,155
#   0c  ProcessKind + what it strands  cfa70611f  DONE      +34
#   4a  fair_sched -> serving-policy   e26414742  DONE     +107
#   1a  oplog -> tier-0 leaf           33b003a2e  DONE     +216
#   ── the precondition is paid; everything below is open ──
#   1b  git mv the rail into two crates
#   1c  repoint 8 consumers, drop the facade
#   1d  SEVER rail -> corpus-engine   <- the commit that earns the claim
#   1e  RingVerifier + Membership seams
#   4b  model_aliases + glob -> oicp-types
#   1f  the acceptance ledger (canon x rail)
#   2   route mesh work through the rail (measurement-gated)
#   3   triage the application layer (unscoped until 2 settles)
#   T   the twin census + an instrument that can see a twin   <- OFF-PLAN
#   R   the ratchets + the push decision                      <- OFF-PLAN
#   G   gate integrity: two gates that pass without running   <- OFF-PLAN
#
# 1b-1d SEVERING THE RAIL is the critical path. Phase 2 is the hard
# precondition for ALL sovereign-mesh work; nothing may touch that crate's
# substrate-shaped code before it lands.

[[bar]]
id           = "cw-net-deletion"
one_line     = "CLAIM: extracting a boundary can be net-DELETING, not just net-moving"
derives_from = "quality/DELETION.md — the workspace runs +622k/-179k over 90 days, 29 lines deleted per 100 added"
status       = "at-risk"
# THE ARITHMETIC HAS DRIFTED AND IT IS RECORDED HERE RATHER THAN DISCOVERED AT
# 1f. Landed, source lines from the diffs:
#
#   0a -1,892 · 0b -3,155 · 0c +34 · 4a +107        =  -4,906
#   1a +216                                          =  -4,690
#
# Phase 0 alone landed -5,013 against its own >= -4,900 floor: CLEARED.
# But 4a cost +107 against a Phase-4 budget of +50 FOR THE WHOLE PHASE, and 4b
# has not run. Projecting the plan's remaining budgets:
#
#   -4,690  landed
#     +349  1b-1e (the +565 budget less 1a's +216)
#     +550  1f, carried as its own line and not absorbed into slack
#      +30  4b (a pure move plus one manifest)
#   -------
#   -3,761  vs the floor of -3,800 -> MISSES BY ~39
#
# The floor already moved once, from -4,000 to -3,800, to pay for 1f visibly.
# Moving it a second time to absorb an overrun would be exactly the accounting
# the deletion ratchet was written to catch. Two honest outs, both pre-named in
# the plan:
#   - K4: collapse the two-crate rail split to one if 1b-1e overruns +900.
#   - 1g: collapse SYSTEM_OVERVIEW §10.1c-k to pointers, ~-417. DELIBERATELY
#     NOT COUNTED — it lands on its own evidence after the ledger has been read
#     in anger. Counting an unearned deletion is the same sin as absorbing
#     growth.
# Decide which BEFORE 1f, not after.
floor        = -4690.0
target       = -3800.0
direction    = "lower_is_better"
instrument   = "scripts/deletion-manifest.py --verify"
kill         = "K4 — Phase 1a-1e Added overruns +900, or 1f's overruns +800. The extraction is costing more than the boundary is worth."

[[bar]]
id           = "cw-sovereign-commonwealth-edge"
one_line     = "CLAIM: the ungoverned sovereign -> commonwealth edge narrows as vocabulary is rehomed"
derives_from = "measured 2026-09-04 on a fresh SCIP index at 83c0caebf"
status       = "open"
# 101 types / 616 refs at campaign start -> 95 / 595 now. 4a bought 6 types /
# 21 refs.
#
# P1 AS WRITTEN PREDICTED 13 types / ~144 refs for 4a+4b together (101/616 ->
# 88/~472). 4a delivered 6/21 and 4b is a SMALLER subject, so the remaining
# 7/~123 is not credible. RE-DERIVE AT 4b from what actually moved — before
# claiming it. Target below is the ORIGINAL prediction, deliberately left
# standing so the miss is visible rather than tidied away.
#
# The governed direction is nearly paid off and moving the WRONG WAY by one:
# commonwealth -> sovereign was 11 types / 38 refs (2026-08-20), now 12 / 39,
