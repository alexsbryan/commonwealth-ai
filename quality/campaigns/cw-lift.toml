derives_from = "RE-DERIVED 2026-09-04 before 1b from 1a's measurement; MEASURED at 1b (ff63884f3)"
# ── MEASURED AT 1b: rail-core closure = 42, commonwealth-rail = 43. ──
# Under the 45-50 the signature stack predicted, above oplog's 28 floor.
# THE MEMBERSHIP HALF — the real claim — ALREADY HOLDS, at 1b rather than 1d:
# zero corpus-engine*, zero sovereign-*, zero commonwealth-{knowledge,
# inference,api} in either closure. Verified twice, by the worker and by the
