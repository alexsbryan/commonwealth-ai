# ── THE CLAIM ───────────────────────────────────────────────────────────────
#
# Mesh is not a layer above local; it is the substrate. `daemon_cmd/mod.rs:
# 1174-1186` fabricates a Mesh named "{hostname}'s Mesh" and returns 1 if that
# fails. Notes are gossip events, work-atlas claims are MeshStore rows. That is
# the "mesh of one" and it is the right RUNTIME idea. What it also does, which
# is not required by it, is make the local case unable to link, boot or persist
# without the whole mesh.
#
# THE SUBSTRATE HAS ONE HOME: commonwealth proper (core/transport/state/
# discovery) + the rail. `sovereign-mesh` is an APPLICATION on it, never a
# second substrate — its substrate-shaped names have ~15 of ~234 crossing refs,
# so extracting them would fork the deciders this package owns: two replication
# paths, two orderings, two admission rules. §10.6 at crate scale.
#
# PROVEN BY TWO LIFTS, not by a gate:
#   1. a local-only daemon compiles with zero commonwealth-* and no iroh
#   2. a SECOND application (canon x rail) composes on the substrate with zero
#      sovereign and zero corpus-engine

# ── LADDER ──────────────────────────────────────────────────────────────────
#
#   -1  instrument the boundary        b704b845d  DONE
#   0a  delete 12 dead modules         5cc9076fc  DONE   -1,892
#   0b  delete orchestrator + gossip   e9f20feec  DONE   -3,155
#   0c  ProcessKind + what it strands  cfa70611f  DONE      +34
#   4a  fair_sched -> serving-policy   e26414742  DONE     +107
#   1a  oplog -> tier-0 leaf           33b003a2e  DONE     +216
#   ── the precondition is paid; everything below is open ──
#   1b  the rail becomes two crates      ff63884f3  DONE       +8
#   4b  model_aliases + glob -> oicp     2a5b63325  DONE      +63
#   G   gate integrity (3 commits)       4759e7b04  DONE
#   ── open ──
#   1c  repoint 8 consumers, drop the facade
#   1d  RE-DERIVE BEFORE RUNNING — 1b already severed corpus-engine
#   1e  RingVerifier + Membership seams
#   1f  the acceptance ledger (canon x rail)
#   2   route mesh work through the rail (measurement-gated)
#   3   triage the application layer (unscoped until 2 settles)
#   T   the twin census + an instrument that can see a twin   <- OFF-PLAN
#   R   the ratchets + the push decision                      <- OFF-PLAN
#   G   gate integrity: two gates that pass without running   <- OFF-PLAN
#
# G IS DONE, and it found a third gate the order did not know about.
# The pre-commit ARG_MAX kill is fixed and WATCHED: scripts/tests/
# pre-commit-argmax.sh drives the real hook at a 4.7 MB atlas, six cases, with
# a negative control asserting the OLD form dies so the other five cannot pass
# vacuously. Re-run 2026-09-04 at HEAD: 6/6.
# The rebrand.rs parallel-only race is fixed as a PARAMETER, not a mutex
# (4759e7b04) — 3 failures in 40 parallel runs before, 0 in 200 after. Its
# census found three MORE tests in that binary reading $HOME unlocked; none
# was failing, all three were passing on luck, all three now locked.
# THE THIRD GATE: three doctests in sovereign-cli-llm failed to COMPILE, so
# `./scripts/sovereign-test.sh` had been exiting 101 while its banner read
# `pass: 11830  fail: 0` (99bfde104, f22270fa2). A doctest that fails to
# compile emits `error:` and no per-test line, so that `fail: 0` was
# STRUCTURAL, not measured — §18.2, a failure present in the exit code and
# absent from the summary a human reads. Every cw-lift commit before
# 2026-09-04 landed against that red.
