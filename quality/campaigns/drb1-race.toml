flight, val, p = max(rows)
print(json.dumps({"value": val, "flight": flight, "artifact": p}))
PY'''

[[bar]]
id           = "honesty-floor"
one_line     = "Zero ungrounded claims on the flight — the weakest task is the honesty"
derives_from = "research/deep-research/notes/corroboration.md; t7a flight honesty 1.0 on 9/9"
status       = "open"
target       = 1.0
direction    = "higher_is_better"
# Zero-tolerance shape (financial-corpora F2 case law, directive 0c042797):
# NO floor, NO noise band — a floor on an honesty bar licenses occasional
# fabrication. Value = MIN task honesty over the newest flight's task runs
# (forensics-collect.py's own derivation: numeric claims not tracing to the
# evidence window). The floor is never a tuning knob (see Tuning).
instrument   = '''python3 - <<'PY'
import glob, json, subprocess, sys
mans = sorted(glob.glob("research/deep-research/drb/overall-derivation/flights/*/manifest.json"))
if not mans:
    sys.exit(3)  # no flight manifest — absent, named
dirs = json.load(open(mans[-1])).get("landed_dirs") or {}
if not dirs:
    sys.exit(3)
first = next(iter(dirs.values())).split("/")
root = "/".join(first[:-2])  # strip drb-<id>/dr-<ts> -> runs-<label>/<arm>
out = subprocess.run(["python3", "research/deep-research/arms/forensics-collect.py", root],
                     capture_output=True, text=True)
rows = [json.loads(l) for l in out.stdout.splitlines() if l.strip().startswith("{")]
h = [r["honesty"] for r in rows if r.get("honesty") is not None]
if not h:
    sys.exit(3)
print(json.dumps({"value": min(h), "tasks": len(h), "run_root": root,
                  "flight": mans[-1].split("/")[-2]}))
PY'''

[[bar]]
id           = "no-early-stop-open-gaps"
one_line     = "No task ends with round budget unused while its gap set is still growing (F4)"
derives_from = "t7a-flight-forensics.md §Taxonomy F4 (tasks 62, 78, 83; 83 = worst score 2.84)"
status       = "open"
target       = 0
floor        = 3
floor_basis  = "t7a flight 2026-08-20: 3/9 tasks ended at 2 of 3 rounds with gaps growing (manifests runs-t7a/std)"
direction    = "lower_is_better"
kill         = "if consuming the round budget on open gaps regresses the banks, the stop rule is wrong, not the banks — escalate the design, never lower the bar"
instrument   = '''python3 - <<'PY'
import glob, json, sys
MAXR = 3  # the flight card's max-rounds; a card that changes it changes this constant
mans = sorted(glob.glob("research/deep-research/drb/overall-derivation/flights/*/manifest.json"))
if not mans:
    sys.exit(3)
dirs = json.load(open(mans[-1])).get("landed_dirs") or {}
if not dirs:
    sys.exit(3)
bad = []
for tid, d in dirs.items():
    m = json.load(open(f"{d}/manifest.json"))
    rounds = m.get("rounds") or []
    if len(rounds) < MAXR and rounds and rounds[-1]["gaps_after"] > rounds[-1]["gaps_before"]:
        bad.append(tid)
print(json.dumps({"value": len(bad), "tasks": bad, "flight": mans[-1].split("/")[-2]}))
PY'''

