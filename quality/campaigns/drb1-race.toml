kill         = "a score bought by trading the honesty bar is a failed campaign, not a met bar; if every rung lands and the flight still reads below 20, the strategy is falsified — escalate with the curve, never re-fly for weather"
instrument   = '''python3 - <<'PY'
import glob, json, re, sys
rows = []
for p in glob.glob("research/deep-research/drb/overall-derivation/flights/*/*/race_result.txt"):
    m = re.search(r"Overall Score:\s*([0-9.]+)", open(p).read())
    if m:
