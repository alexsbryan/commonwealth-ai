[[bar]]
id           = "drb1-overall"
one_line     = "A pre-registered DRB-I flight's official RACE overall clears Perplexity's 40.46 with judge-noise headroom"
derives_from = "t7a-flight-forensics.md §Score; directive 49486cfc"
status       = "open"
target       = 41.0
