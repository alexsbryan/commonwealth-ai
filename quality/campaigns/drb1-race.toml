import glob, json, os, sys
cands = (glob.glob("research/deep-research/arms/score-report*.json")
         + glob.glob("research/deep-research/arms/runs-*/score*.json")
         + glob.glob("research/deep-research/arms/runs-*/GATE-VERDICT.json"))
