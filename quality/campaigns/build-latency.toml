# ── SUCCESS — one definition, no composition ────────────────────────────────
# Operator 2026-09-17: the definition of success has zero room for debate.
# It is a per-file table. For every [[probe]] file, three seconds-counts,
# each the wall clock of a fixed command sequence on this host in the
# sovereign-vulkan toolbox, after a one-statement edit in the first function
# body of that file (never a comment):
#   warm   = scoped lint (sovereign-lint.sh --human) + focused test
#            (sovereign-test.sh --human --package <crate> --filter <test>),
#            each the second of two runs (the first absorbs the previous
#            probe's restore), on the shared target/.
#   fresh  = the FIRST focused test for that crate on a target dir that has
#            only ever run the three full-workspace gates (lint --full, test,
#            build --workspace) from cold: what a session pays when it opens
#            that crate. Measured in target/fresh-probe, wiped at the start.
#   build  = cargo build --workspace after the edit, tree settled first.
# The campaign number is the SUM of each column over the files, before and
# after; the speed-up is before/after for each column and each file.
# Weights on the probes are provenance (why the file is in the list), not
# a factor in any sum. The census (quality/build-probe/2026-09-17/
# gate-census-30d.json: 181 sessions, 48.7 h on gates, 68% in runs ≥ 120 s)
# is the motivation and is never in the score.

[[bar]]
id           = "bl-noise"
one_line     = "Two warm runs on an unchanged tree agree — the ruler can tell a move from nothing"
derives_from = "ARCH_PRINCIPLES 7; measured 2026-09-17-baseline/score.aa.json: warm 229.0 vs 227.5, band 0.66%, max per-file delta 1.3 s"
status       = "met"
target       = 0.03
direction    = "lower_is_better"
kill         = "a move is banked only if the warm sum falls by more than this band; if an A/A pair ever exceeds it, stop and fix the instrument before any move"
instrument   = "scripts/build-probe/score.sh --aa"

[[bar]]
id           = "bl-warm"
one_line     = "Σ over probe files of (scoped lint + focused test) seconds, steady state"
start        = 228.3   # 2026-09-17-baseline, HEAD bf5669d3a
status       = "open"
direction    = "lower_is_better"
instrument   = "scripts/build-probe/score.sh          # .warm_s in target/build-probe/score.json"

[[bar]]
id           = "bl-fresh"
one_line     = "Σ over probe crates of the first focused test's seconds on a full-gates-only target dir"
derives_from = "quality/BUILD_LATENCY.md D1; the tail of the census"
start        = 1130.2   # 2026-09-17-baseline, HEAD bf5669d3a
status       = "open"
direction    = "lower_is_better"
instrument   = "scripts/build-probe/score.sh --fresh  # .fresh_s in target/build-probe/score.fresh.json; ~45 min; needs ~105 GB free (target/fresh-probe, removed after)"

[[bar]]
id           = "bl-build"
one_line     = "Σ over probe files of `cargo build --workspace` seconds after the edit"
start        = 210.6   # 2026-09-17-baseline, HEAD bf5669d3a
status       = "open"
direction    = "lower_is_better"
instrument   = "scripts/build-probe/score.sh --build  # .build_s in target/build-probe/score.build.json"

[[bar]]
id           = "bl-noop-floor"
one_line     = "A full check with nothing edited is the fingerprint scan and nothing else"
derives_from = "quality/BUILD_LATENCY.md D3 — 7.4 s → 0.8 s after the build.rs path fix (93eef92bf)"
status       = "met"
target       = 2.0
direction    = "lower_is_better"
instrument   = "scripts/build-probe/score.sh --noop"

# Report: scripts/build-probe/score.sh --compare <before-dir> <after-dir>
# prints the per-file table (warm / fresh / build, before → after, ×) and the
# three sums. That table IS the campaign's result; nothing else is.
# Snapshots: score.sh --snapshot quality/build-probe/<date>-<label>/

# ── MOVE SET — the only kinds of step the loop may take ─────────────────────
# One move per step, one dimension at a time (ARCH_PRINCIPLES 2). Each step
# pre-registers its predicted bl-per-edit delta from the cone model in
# BUILD_LATENCY.md BEFORE the diff, and is banked only if the measured delta
# clears bl-noise; otherwise it is reverted in the same session.
[[move]]
kind = "edge-cut"
one_line = "Remove one workspace dependency edge by moving the few items the dependent really uses below both crates"
examples = ["sovereign-tools -> sovereign-core (22 files, 5 items)", "corpus-engine -> sovereign-contracts (14 files, 11 paths)"]

[[move]]
kind = "cohesion-split"
one_line = "Split one crate along a hub so the hot half is a crate its consumers do not all depend on"
examples = ["sovereign-cli-llm by verb", "sovereign-mesh at EmbeddedDaemon", "kernel-types::quality::instruments out"]

[[move]]
kind = "build-graph"
one_line = "A change to Cargo.toml / build.rs / gate scripts with no source semantics"
examples = ["workspace-hack crate (cargo hakari)", "build.rs rerun path (done, 93eef92bf)", "lint feature resolver (done, 4f06edf82)"]

[[move]]
kind = "test-layout"
one_line = "Split an integration-test binary so a focused test compiles one area"
examples = ["sovereign-mesh/tests/main.rs (72 modules) into per-area binaries + --test <bin> in sovereign-test.sh"]

# ── LEDGER — snapshot directories under quality/build-probe/, one per
# banked move: <date>-<label>/{score.json,score.fresh.json,score.build.json,HEAD}
