title  = "warrant-3-chain: the MAC, landed with the thing that attenuates"
status = "open"
demo   = "D4"
moves  = ["wr-attenuation-holds"]
note   = "UNSCHEDULED by design — gated on sub-lending being wanted, not on the chain being designed. Until a holder attenuates, the issuer is always the verifier and offline verification answers a question nobody asks."

