status       = "open"
target       = 0
floor        = 272421
floor_basis  = "quality/baselines/deletion_manifest.tsv, frozen 2026-08-27"
direction    = "lower_is_better"
kill         = "every bar in quality/campaigns/drb1-race.toml must print a byte-identical value before and after. One differing value kills the lane."
# charter.json (each run's PRE-REGISTRATION), report.md (the finding),
# plan.json and survey-*.json are DELIBERATELY NOT in this lane. That is the
# conservative variant, chosen on 2026-08-27; the aggressive one adds ~22k
