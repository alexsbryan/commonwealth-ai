# Flight rules — read raw. Verdicts come from the instruments below, never
# from prose. Every instrument shells to scripts/deletion-manifest.py, which
# is THE decider (ARCH §10.6) of which files this campaign deletes. An agent
# that wants a different file set changes that script in a reviewed diff; it
# does not choose at the keyboard.
#
# Prose, phases, traps and the diversion register: quality/DELETION.md
id        = "deletion"
objective = "Delete the committed non-source mass and the file-granular dead code, without losing one behaviour, and leave a ratchet that holds it"
spec      = "quality/DELETION.md"
declared  = "2026-08-27"
status    = "active"

# ── The premise correction this campaign was founded on ─────────────────────
# The order was "delete 100k lines of code; there is that much fat and
# redundancy". Measured 2026-08-27 by three independent read-only surveys:
# there is NOT. Duplication ceiling ~14.4k net (two unrelated algorithms
# agreeing within 2% on cluster count); dead code ~9.8k with NINE hunted
# classes at literal zero; Rust test dedup ~8k; vestigial crates 1,320.
# Code ceiling ~40k, not 100k. What IS there is 780,853 lines of committed
# machine output. This campaign deletes that, plus the file-granular code.
# Do not re-litigate the premise; re-run the surveys if you doubt it.

[[bar]]
id           = "positive-control"
one_line     = "The manifest moves by exactly the size of one deleted file — the instrument can see deletion at all"
derives_from = "quality/HOT_PATH_REUSE.md:102 — nc-redundant was 79% blind to deletion for its entire life and burned nine waves before anyone checked"
status       = "open"
target       = 1.0
direction    = "higher_is_better"
kill         = "if the delta does not equal the file's own line count, STOP — the instrument is broken and every number below is unearned. Fix the instrument before deleting anything."
# THIS BAR GATES ENTRY TO EVERY OTHER BAR. Run it first, on a scratch commit.
instrument   = '''python3 - <<'PY'
import json, subprocess, os, sys
def total():
    d = json.loads(subprocess.run(
        ["python3", "scripts/deletion-manifest.py", "--all"],
        capture_output=True, text=True).stdout)
    return sum(v["lines"] for v in d.values())
files = subprocess.run(
    ["python3", "scripts/deletion-manifest.py", "--lane", "p0-root-junk", "--files"],
    capture_output=True, text=True).stdout.split()
if not files:
    sys.exit(3)  # lane already empty — absent, named
victim = files[0]
n = open(victim, "rb").read().count(b"\n")
before = total()
os.rename(victim, victim + ".pc-tmp")
after = total()
os.rename(victim + ".pc-tmp", victim)
moved = before - after
print(json.dumps({"value": 1.0 if moved == n else 0.0,
                  "victim": victim, "expected": n, "moved": moved}))
PY'''

[[bar]]
id           = "p0-root-junk"
one_line     = "Committed process output — root score reports, stray .log captures, the stray root baselines/ dir, and files committed both raw and gzipped"
derives_from = "quality/DELETION.md §P0; root score-report-*.json arrived in commit 8bdefaa6 'stash dr work'"
status       = "open"
target       = 0
floor        = 113934
floor_basis  = "quality/baselines/deletion_manifest.tsv, frozen 2026-08-27"
direction    = "lower_is_better"
kill         = "a file in this lane that turns out to have a reader is a MANIFEST BUG, not a reason to hand-skip it — add the spare to deletion-manifest.py with the reader cited, re-freeze, and say so"
instrument   = "python3 scripts/deletion-manifest.py --lane p0-root-junk"

[[bar]]
id           = "p1-bench-baselines"
one_line     = "Baseline snapshots the reader cannot address — flat files with no <id>/ dir, and dated snapshots that are not a latest.json target"
derives_from = "sovereign-cli-llm/src/bench_cmd/baselines.rs:39 builds every path as bench_root/<group>/baselines/<id>/ and :44 opens latest.json inside it"
status       = "open"
target       = 0
floor        = 384759
floor_basis  = "quality/baselines/deletion_manifest.tsv, frozen 2026-08-27"
direction    = "lower_is_better"
kill         = "if `svrn bench gate` changes ANY verdict across this deletion, stop and restore — the lane's whole claim is that these files are unreachable"
