[[bar]]
id           = "no-behaviour-lost"
one_line     = "Both definition-of-done gates stay green across every phase"
derives_from = "AGENTS.md §Definition of done"
status       = "open"
target       = 0
direction    = "lower_is_better"
kill         = "a red gate is not 'flaky' and is not 'unrelated'. Bisect the phase's own diff before touching anything else."
# Gate on the EXIT CODE, not the summary line. Zero-test runs exit 4,
# unattributable runs exit 5; both are failures, not passes (ARCH §18.1).
instrument   = '''bash -c '
./scripts/sovereign-lint.sh --human --full >/dev/null 2>&1; l=$?
./scripts/sovereign-test.sh --human       >/dev/null 2>&1; t=$?
python3 -c "import json,sys; print(json.dumps({\"value\": $l + $t, \"lint\": $l, \"test\": $t}))"
' '''

[[bar]]
id           = "ratchet-holds"
one_line     = "No lane ever grows — the campaign cannot lose ground while it runs"
derives_from = "August 2026 added +155,452 net first-party Rust; 100,000 lines is 19.6 days of accretion"
status       = "open"
target       = 0
direction    = "lower_is_better"
kill         = "a lane that grew means new committed output landed during the campaign. Find the commit, not a workaround."
instrument   = '''bash -c '
python3 scripts/deletion-manifest.py --verify >/dev/null 2>&1
python3 -c "import json; print(json.dumps({\"value\": $?}))"
' '''
