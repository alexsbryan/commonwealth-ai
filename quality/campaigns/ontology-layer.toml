# Flight rules — read raw. Verdicts come from measurement rows
# (~/.sovereign/comaintainer/bar-measurements.jsonl), never from prose here.
# Pre-registered 2026-10-09 BEFORE any rung ran. The only data behind these
# numbers is the baseline row (~/.svrnmesh/bench-corpora/baseline-3sys-20261009:
# frozen recipes, frozen binary, one production-path run per system). Where a
# target names the baseline row and the row is still being scored, the number
# is filled from that row and from nothing else.
#
# The three systems are instruments. The predicate is about a BLIND author's
# recipe: identity bars read the records that recipe gets through the default
# commands, against the row our own frozen recipe got on 2026-10-09.
#
# Operator 2026-10-09: the layer is built scaffold first and refined by
# extrusion inside the scaffold. A component is accepted by its contract tests
# (layer-invariants); every other bar is a tuning target read on the
# scaffold's runs, never a gate on one build step and never on one system's row.
id        = "ontology-layer"
objective = "A user with a first-principles understanding of their domain and competency in the ontology syntax writes one recipe, runs the CLI's default commands, and gets typed, cited records on unlike systems: very similar records whoever wrote the recipe, with no number measured on data and no mechanism switch in it. The test systems (crm-ward mail, uv-support issues, GVC news) are instruments, and nothing is judged on one of them. Supersedes crm-proof's Ward-first ladder; crm-proof's bars stay declared as lagging checks."
spec      = "svrn/docs/specs/ONTOLOGY_METHOD.md; svrn/docs/specs/ONTOLOGY_PRIMITIVES.md (sections 0, 4, 8); .sovereign/features/ontology-layer/campaign.md"
declared  = "2026-10-09"
status    = "active"

[predicate]
statement = "On each test system, a recipe written blind from the domain description through the five-question interview, run by the default commands, gets identity at or above the 2026-10-09 baseline row and records close to our own recipe's, and no recipe carries a measured number or a mechanism switch, and the six contracts hold on all three: layer-identity-ward, layer-identity-uv, layer-identity-gvc, layer-no-tuning, layer-default-path, layer-author-gap and layer-invariants each read met on their newest measurement row."
check     = '''python3 - <<'PY'
import json, pathlib, sys
p = pathlib.Path.home() / ".sovereign/comaintainer/bar-measurements.jsonl"
rows = [json.loads(l) for l in p.read_text().splitlines() if l.strip()] if p.exists() else []
ok = True
for bar in ("layer-identity-ward", "layer-identity-uv", "layer-identity-gvc",
            "layer-no-tuning", "layer-default-path", "layer-author-gap", "layer-invariants"):
    mine = [r for r in rows if r.get("campaign") == "ontology-layer" and r.get("bar") == bar]
    met = bool(mine) and mine[-1].get("verdict") == "met"
    print(f"{bar}: {'met' if met else 'OPEN'}")
    ok &= met
sys.exit(0 if ok else 1)
PY'''

