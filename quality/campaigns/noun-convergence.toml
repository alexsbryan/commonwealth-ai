# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
# Defer/descope = edit a bar's `status`; git history is the ledger.
#
# ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is the
# committed artifact and the LADDER carries the rung list, so the plan survives
# without them.
id        = "noun-convergence"
objective = "Four domains, four boundaries, one small contract at each — so extending one does not require reading the others"
spec      = "quality/TARGET_ARCHITECTURE.md"
register  = "quality/CONCEPTS.toml"
declared  = "2026-08-19"
status    = "active"

# ── THE SYSTEM, AS THE OPERATOR DESCRIBES IT ────────────────────────────────
#
#   BACK OF HOUSE — the quality controls
#   eval · benches · judges · code-intel · gates · atos · gym
#   May observe every layer. NOTHING may depend on it.
#   Its own nouns: Measurement, Baseline, Attribution, Verdict(the eval kind)
#   ───────────────────── observes ─────────────────────
#
#   2  sovereign        the INTERFACE layer — presents and packages the two
#                       below (operator, 2026-08-19). Owns THE TURN:
#                       Question, Answer, Judgement, Citation, Gap
#         |
#   1  corpus-engine    KNOWLEDGE. Owns Corpus, Evidence, Atom, Note, Record
#      commonwealth     FEDERATION. Owns Peer, Capability, NodeCapability
#         |
#   0  oicp + kernel    THE CONTRACT. ContentHash, CorpusId, NodeId, Origin,
#                       Custody, Attribution
#
# AGENTS.md's "commonwealth != sovereign, they are peer projects, not
# parent/child" is a GOVERNANCE claim — separate repos, separate cadence — not
# a layering one. The traffic settles it: sovereign -> commonwealth is 751 refs
# (deliberate composition), commonwealth -> sovereign is 122 (leakage).
#
# `studio` is a FIFTH system this framing does not name (44 types each way with
# sovereign). Out of scope, named so it is not mistaken for noise.

# ── MEASURED 2026-08-19 by scripts/nc-boundary.py ───────────────────────────
#
#   sovereign     -> corpus-engine  5103 refs /  337 types
#   sovereign     -> back-of-house  2374 refs /  210 types   BACKSTAGE
#   sovereign     -> commonwealth    751 refs /   92 types
#   corpus-engine -> back-of-house   376 refs /   44 types   BACKSTAGE
#   commonwealth  -> sovereign       122 refs /   22 types   BACKFLOW
#   oicp          -> sovereign       103 refs /   12 types   BACKFLOW
#   corpus-engine -> sovereign        24 refs /    4 types   BACKFLOW
#
#   SHARED KERNEL: 23 types, 22 of them owned by corpus-engine — including
#   CorpusEngine (102 methods), CorpusIndex (112 methods), and its Error and
#   Result. The domains do not talk through a contract. They talk through one
#   domain's implementation.
#
# THE FAT BOUNDARY IS FOUR UNNAMED SURFACES. The 337 types crossing into
# corpus-engine cluster by traffic:
#   atlas      AtomEnvelope 542, AtomId 217, EdgeType 141, AtomType 118,
#              EntityType 109, Entity 89, Edge 69          -> ONE noun: Atom
#   notes      NoteStore 231, NoteScope 89, NoteRow 73, NoteSource -> Note
#   retrieval  ScoredChunk 231, ChunkRef 66, EmbedFn 65    -> Evidence
#   engine     CorpusEngine 193, CorpusIndex, IndexInfo, CorpusSpec,
#              IngestProgress 94, PipelinePhase 121        -> Corpus
# Four nouns replace about thirty of the fattest crossing types.

# ── WHY THE FIRST TWO DRAFTS WERE WRONG (both 2026-08-19) ───────────────────
#
# v1 ranked by re-derivation pressure off CONCEPTS.toml. That register came
# from the D1 census — names typed in more than one crate — which is a census
# of copy-paste accidents, not a decomposition. Measured: following ONE turn
# from `handle_message_stream` crosses 205 first-party production types; the
# 27-noun register names FOUR, and at depth<=2 names ONE of fourteen. All v1
# rungs could have landed green with ~200 main-path types still unnamed — the
# "orders land, headline never moves" failure that minted initiative-bars.toml.
#
# v2 modelled sovereign and commonwealth as peers and got the layer direction
# wrong, and omitted back-of-house entirely.
#
# v3 ranks by DOMAIN BOUNDARY. A noun earns a rung when it is what one domain
# PUBLISHES to another.

# ── NOT FUNDED (stated so the omissions are choices, not oversights) ────────
#   - the seven-domain golden freeze. 10,130 passing tests ARE the golden.
#   - the replay tape, the >=0.8 level-2 agreement experiment, the non-Rust
#     portability demo.
#   - shadow mode + N-run promotion as a universal step.
#   - driving the raw census to 0 — the 221-row two-crate tail is a discovery
#     feed, not a work queue.
#   - Step/Artifact substrate: studio's domain, the fifth system.
#   - god-object splitting: deferred bar, lands as a consequence of rungs 4-7.

# ── THE MISCELLANEA HAS CATEGORIES; IT IS UNMAPPED, NOT UNCATEGORIZED ───────
#
# Measured 2026-08-19: of 5,003 first-party production types, 1,515 (30%) end
# in one of 26 recurring suffixes. They are not 1,515 concepts. They are
# instances of categories this ladder already names. A worker adjudicating a
# name uses this table: `FooOutcome` is not a new noun, it is a Judgement.
#
#   SHAPE                                        COUNT  BELONGS TO
#   *Result *Outcome *Verdict *Status              290  Judgement          (r10)
#   *Request *Response                             218  a domain boundary  (r4-8)
#   *Row *Record *Entry                            188  Record             (r5)
#   *Config *Args *Options                         161  per-crate IDIOM — mostly
#                                                       correct as-is; the register
#                                                       already dispositions Args
#   *Report *Summary                               160  back-of-house      (r3)
#   *Kind *Type                                     86  closed sets — correct as-is
#   *Store *Registry *Provider                      85  Capability         (r8)
#   *Phase *Stage *Step *Pass *Pipeline *Runner      74  THE SUBSTRATE     (r3b)
#   *Id *Ref *Hash                                  48  the kernel         (r1)
#
# The dataflow family is the one with no home until rung 3b: seven distinct
# *Phase enums (BootstrapPhase, IngestPhase, EnrichmentPhase, NarrationPhase,
# ClearKvPhase, CorpusInstallPhase, HandoffPhase), six *Runner, six *Step,
# five *Pipeline — all hand-rolling Step / Artifact / Runner, which already
# exists in studio/crates/sovereign-workflow and is wired as a product feature
# rather than as substrate. TARGET_ARCHITECTURE §3.2: "five tenants, one engine."

# ── STREAMING — DECIDED 2026-08-19, was a blocking open question ────────────
#
# The question was whether "no Answer without a Judgement" survives an
# assistant that streams tokens before any judgement exists. Reading
# runtime/streaming.rs settles it: the system ALREADY holds. Gate mode buffers
# (`held_tokens`, `gate_held_answer` :564, "buffered until the verdicts. An
# ARMED turn must hold" :1444) and the user sees a heartbeat carrying a COUNT,
# not the text. The invariant makes structural what the gate already does.
#
# The real question was un-gated turns. DECISION: `Answer` always carries a
# `Judgement`; an un-gated turn carries `Judgement::NeverRan(Reason)` — a
# variant the target type already declares, which "carries no quote BY
# CONSTRUCTION". Satisfies §18.2 (a gate that did not execute is not a gate
# that abstained), costs no architectural change, and fixes a real defect:
# today an un-gated turn is INDISTINGUISHABLE at the type level from a
# gated-and-passed one.
#
# Rejected: (B) invariant on persisted answers only — creates two classes and
# the user-facing one is the unchecked class; (C) separate StreamedText and
# Answer types — duplicates the noun, which is the disease.
#
# Tokens on the wire are NOT an Answer. They are frames; the Answer is the
# released whole. That distinction is what makes this cheap.

# ── THE THREE WIDTH BARS ARE DEFERRED — 2026-08-20, operator ────────────────
#
# `nc-boundary`, `nc-no-violation` and `nc-kernel` move from `open` to
# `deferred`. THEY ARE STILL MEASURED AND STILL CHECKABLE — `deferred` is a
# label, not a mute: only `descoped` short-circuits the verdict
# (co-lineage.py:386), so every one of them still runs its instrument, still
# writes a machine-stamped row, and still renders. `co-lineage coverage
# noun-convergence` shows them with a `[deferred]` tag beside a live number.
# Nothing below is deleted and no target is moved.
#
# WHAT CHANGED IS THEIR STANDING, and only that: they are EVIDENCE, not
# TARGETS. A rung is no longer expected to move them, and a landing verdict no
# longer has to explain why it didn't.
#
# WHY, MEASURED, NOT ASSERTED. These three count distinct TYPES CROSSING CRATE
# EDGES. Two independent measurements say those edges were already correct
# before this campaign began:
#   - `cargo xtask layer-gate` exits 0 — 54 members, 244 internal edges,
#     "every crate assigned, every edge points down or sideways, fan-in within
#     caps". Verified twice on 2026-08-20, on a clean worktree at HEAD.
#   - NOUN_CONVERGENCE §10.2: 0 of 441 load-bearing types carry an upward edge;
#     18 of 28,847 co-changing file pairs cross a crate boundary with no
#     structural reference behind them; adapter tax is 26 `impl From`.
# The defect is INSIDE crates, not between them: 42.9% of 4,998 first-party
# production types are referenced by no other file (`nc-reach`, minted
# 2026-08-20).
#
# THE EVIDENCE THAT FORCED IT. Three waves, ~30 commits: nc-boundary 478 -> 477,
# nc-no-violation 158 -> 143, nc-kernel 22 -> 23 (BACKWARDS). The same waves
# shipped a live HTML-truncation bug fix (every crawled page cut at the first
# `</script>` on three ingest paths), three user-visible desktop panics, 1,405
# deleted duplicate lines, a trust envelope that exposed ten bench banks being
# scored as fine, tool descriptors 0 -> 68% data-sourced retiring 4,137 lines of
# data spelled as code, `code index --help` exiting 1, and a config path that
# lied to shipped-binary users. NONE of it is visible in these three numbers.
#
# THE COST OF LEAVING THEM OPEN was not cosmetic and is the operator's stated
# reason: with the scoreboard pointed at a disproved hypothesis, every order and
# every landing verdict had to negotiate between what the bars said and what the
# work did. That is a standing invitation to doublespeak, paid at every turn.
#
# WHAT REPLACES THEM as the campaign's declared destination:
#   "An agent extending this codebase reaches for what exists instead of
#    re-deriving it, and what it reaches for tells the truth about its own
#    confidence."
#   -> `nc-reach`   can you reach it            42.9% -> 28%
#   -> `nc-extends` is adding a thing DATA      1/3 -> 3/3
#   -> `nc-thesis`  does a result carry its own trustworthiness  0.4 -> 1.0
#
# HOW TO REOPEN ONE, because a deferral with no reopen condition is just
# abandonment: if a rung has a specific, named reason to expect a width move —
# the clearest live candidate is DELETING commonwealth-api's four middlewares
# that open `<repo>/.sovereign/notes.db` BY PATH, which is still the only
# identified change that shrinks `nc-boundary` AND reverses `nc-kernel` — then
# flip that one bar's `status` back to `open` in the same commit as the rung,
# and say in the landing verdict what you expect it to move and by how much.
# One line, and git history is the ledger.
#
# READ BEFORE TRUSTING A DELTA ON THESE: all three read the daemon's SCIP index
# and NOT the working tree, so their rows stamp `ref_source: artifact` at
# `indexed_head`, they move when the daemon re-indexes a PEER's commits, and a
# `git worktree` does not isolate them (`nc-boundary.py:index_provenance`).

