# Flight rules — read raw. Verdicts come from measurement rows, never from
# prose here. Defer/descope = edit a bar's `status`; git history is the ledger.
#
# THE ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is
# the committed artifact, so the LADDER below carries the rung list. If the
# orders directory is lost, this file is enough to re-mint it.
id        = "noun-convergence"
objective = "An agent extending this codebase has something to reach for, so it stops building new"
spec      = "quality/TARGET_ARCHITECTURE.md"   # the end state; NOUN_CONVERGENCE.md is the argument
register  = "quality/CONCEPTS.toml"            # per-noun canonical owner + totality rule
declared  = "2026-08-19"
status    = "active"

# THE DIAGNOSIS, because it decides the order of work.
#
# The rot is not carelessness. An agent adding a feature has excellent local
# context and no cheap way to learn the concept already exists three crates
# over, so it writes a correct new one. The measured specimen:
# `sovereign-core/src/deep_research/icd.rs`, minted the week this program was
# drafted, re-derived FIVE register nouns including a `Verdict` — privately,
# because no canonical home existed to import.
#
# So the cure has two halves and both are funded here:
#   HEAL           one canonical per noun, call sites ported to it
#   STAY HEALTHY   reaching is cheaper than building, and the build fails if
#                  someone builds new anyway
#
# WHAT THIS CAMPAIGN DELIBERATELY DOES NOT FUND (cut 2026-08-19, operator
# direction — no overhead that does not reach the end state):
#   - the seven-domain golden freeze. 10,130 passing tests ARE the golden;
#     running them before/after a conversion is the differential.
#   - fingerprint-keyed Measurement as a PREREQUISITE. It is noun #10 here,
#     not a gate on the other thirteen — almost no convergence work puts a
#     model in the loop.
#   - the replay tape, the >=0.8 level-2 agreement experiment, the non-Rust
#     portability demo. Real ambitions about the harness-as-product; overhead
#     against this objective.
#   - shadow mode + N-run promotion as a universal step. Ceremony on a `From`.
#   - driving the raw census to 0. The 221-row two-crate tail is a DISCOVERY
#     FEED, not a work queue: zeroing it means renaming ~130 name coincidences
#     apart, which is churn with no architectural gain. A name is adjudicated
#     when a register noun touches it, never in a batch up front.

# ── Bars ────────────────────────────────────────────────────────────────────

[[bar]]
id           = "nc-thesis"
one_line     = "The product claim is a TYPE, not a runtime gate"
derives_from = "TARGET_ARCHITECTURE.md §1 (the thesis invariant), §7 rows 1-4"
status       = "open"
# "Nothing reaches the user that did not come from Evidence, and no Evidence
# exists without an Origin and a Custody." Binary: either rustc refuses the
# illegal construction or it does not.
target       = 1.0
direction    = "higher_is_better"
proof        = """compile-fail tests, one per illegal construction: an Answer
built with no Judgement; an Evidence built with no Origin; an Evidence built
with no Custody; a Citation that does not point into a sealed EvidenceSet; a
non-shareable Evidence composed into a peer-bound reply. A gate never observed
to fail is not a gate (ARCH §18.1) — each ships red-first."""
kill         = "if a totality rule cannot be implemented without banning a path the product legitimately needs, this bar FAILS and is re-registered with the narrower invariant — it is never quietly relaxed to keep the tick"
closes_at    = "rung 7"

[[bar]]
id           = "nc-reach"
one_line     = "Every register noun has a canonical an agent can find in one command"
derives_from = "the diagnosis above; TARGET_ARCHITECTURE.md §6 (a noun lives in the lowest tier that needs it)"
status       = "open"
# 11 of 24 in_program rows have NO definition today — the concept exists only
# as untyped data (SharingPolicy is two registry bools at ~149 sites). You
# cannot reach for what was never named.
today        = 13.0        # 2026-08-19, minted by scripts/nc-pressure.py
target       = 24.0
direction    = "higher_is_better"
instrument   = "scripts/nc-pressure.py --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({\"value\": float(d[\"reach\"])}))'"

[[bar]]
id           = "nc-pressure"
one_line     = "No register noun is defined twice, and the ratchet stops it rising"
derives_from = "the diagnosis above; NOUN_CONVERGENCE.md §3 (Register)"
status       = "open"
# EXCESS DEFINITIONS = sum(max(0, defs-1)) over in_program rows: how many
# redundant definitions of a register noun exist. Today 21, spread over six
# rows (Verdict 9, Evidence 5, Gap 5, Citation 3, Step 3, Artifact 2).
#
# `kin` is DELIBERATELY NOT in this number. It over-collects by construction —
# PartialKvVerdict is not a Verdict — so a target on kin would mean renaming
# ~130 coincidences apart, which is churn with no architectural gain. Kin is
# tracked with a FLOOR (must not rise), reported by the same instrument as
# total_pressure, and adjudicated per-noun when a rung touches it.
today        = 21.0        # 2026-08-19, minted by scripts/nc-pressure.py
target       = 0.0
direction    = "lower_is_better"
instrument   = "scripts/nc-pressure.py --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({\"value\": float(d[\"excess_definitions\"])}))'"
tracked      = "total_pressure (defs+kin) — 255 on 2026-08-19. Floor: must not rise. Not a target."
ratchet      = "`svrn code converge status` exits 0 on every landing, against quality/baselines/concepts.txt. It has already been observed to fail live (272 -> 273, 2026-08-19) catching two duplicates its own author introduced — the §18.1 red proof was earned, not staged."
kill         = "if a rung needs more rename-aparts than convergences, the register row was wrong about the noun: stop, re-disposition, do not churn to move the number"

[[bar]]
id           = "nc-god-objects"
one_line     = "The four god objects are decomposed along seams the graph already shows"
derives_from = "NOUN_CONVERGENCE.md §3 (D2); TARGET_ARCHITECTURE.md §6"
status       = "deferred"
# DEFERRED ON PURPOSE, not forgotten (operator direction 2026-08-19). Runtime
# has 130 methods across 32 files (score 4160), SqliteStateStore 125x15,
# CorpusIndex 112x7, CorpusEngine 102x6 — measured 2026-08-19. Splitting them
# FIRST prevents nothing: the rot recurs because there is nothing to reach
# for, and a file split adds no affordance. Runtime is also unsplittable while
# its 32 fields are anonymous (15 are Option<Arc<dyn ..>> assembled by 18
# with_* builders); once Capabilities and Evidence are real types the seams
# draw themselves. `svrn code suggest-seams <file>` already proposes them.
today        = 4160.0      # Runtime, methods x files, 2026-08-19
direction    = "lower_is_better"
review_by    = "when rung 9 (Capabilities) lands — re-scope as its own campaign"

# ── The ladder (rungs in landing order) ─────────────────────────────────────
# Orders live at .sovereign/features/<id>/order.md (gitignored). This list is
# the durable copy.

[[rung]]
id = "nc-0-reach"
moves = ["nc-pressure"]
one_line = "Reaching becomes cheaper than building — the anti-rot half, first"

[[rung]]
id = "nc-1-provenance"
moves = ["nc-thesis", "nc-reach"]
one_line = "Origin + Custody + SharingPolicy — the provenance leaves"

[[rung]]
id = "nc-2-evidence"
moves = ["nc-thesis", "nc-reach", "nc-pressure"]
one_line = "Evidence — the retrieval unit, 5 definitions collapse to 1"

[[rung]]
id = "nc-3-evidence-set"
moves = ["nc-thesis", "nc-reach"]
one_line = "EvidenceSet — the seal; retrieve becomes the only door"

[[rung]]
id = "nc-4-citation"
