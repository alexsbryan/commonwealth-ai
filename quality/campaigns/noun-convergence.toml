# rung nc-3-backstage) replaced v1 as the canonical instrument. v2 fixes a real
# defect: the reference loop called `domain(fp)` with no crate, so
# BACKSTAGE_CRATES matched a type's OWNER and never its REFERENCE SITE — a
# back-of-house crate naming its own type scored as a violation the
