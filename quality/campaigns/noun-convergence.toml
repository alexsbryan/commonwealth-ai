[[bar]]
id           = "nc-reach"
one_line     = "A type travels beyond the file that declares it, or it is not an abstraction"
derives_from = "NOUN_CONVERGENCE.md §10.2, minted 2026-08-20 by scripts/nc-reach.py"
# DEFERRED 2026-08-20 by the REBASELINE (operator-approved, directive 22d0841b).
# Evidence, not a target. Still measured, still checkable — only `descoped`
# mutes a verdict. The commentary below is UNCHANGED and still true; what
# changed is that this bar can no longer be the thing rungs are steered by.
#
# THE EVIDENCE THAT DEFERRED IT, both halves measured, neither argued:
#   (a) PRICE. nc-16 extracted a real shared capability — `sovereign-enrichment-
#       catalog`, three consuming crates — and moved this bar by -0.031 points
#       (42.937 -> 42.906 attributable; the raw -0.134 was mostly denominator
#       dilution from peers' work). At that rate 42.8 -> 28 is ~373 rungs, not
#       the ~25 the rung's own order predicted.
#   (b) BLINDNESS, which matters more than the price. That same rung deleted a
#       real duplicate, gave three hosts ONE config schema where one copy was a
#       self-declared mirror four fields wrong, and fixed a LIVE defect where
#       watched-folder enrichment broke under the documented SOVEREIGN_DATA_DIR
#       override. This bar scored all of that at -0.03. Wave 5 then landed three
#       more convergence rungs — 703 lines deleted, a defect class closed, `Gap`
#       6 -> 5 — and moved every declared bar by ZERO.
#   The arithmetic of why is nc-16's and it is not a matter of opinion: private
#   share is P/N, and a second consumer reduces P only for types with ZERO other
#   referencing files — but the types a second host needs are already multi-file
#   at home, which is exactly what makes them a capability instead of a local
#   helper. Extraction therefore converts local -> exported, which this headline
#   does not count. The predicted 20-40 private types crossing could only exist
#   if they all sat in ONE FILE, i.e. only if the thing extracted were a god
#   object. The prediction required the anti-pattern the campaign exists to remove.
#
# REOPEN CONDITION: a rung family whose MECHANISM moves private -> exported at
# scale rather than one type at a time. Until such a mechanism is named and
# priced, this bar reports and does not steer.
# descoped 2026-08-21: 42.9 -> 42.5 across 8 measurements. Superseded by the real finding: a closed type with NO EXTENSION POINT forces a consumer to fork it. Privacy share is a symptom, not the disease.
status       = "descoped"
# WHY THIS BAR EXISTS, stated bluntly because the alternative is arguing it in
# prose every turn. After three waves and ~30 commits the three type-counting
# bars read 477 / 143 / 23 against targets of 50 / 0 / 10 — flat, one backwards.
# In the same period the campaign shipped: a live HTML-truncation bug (every
# crawled page cut at the first `</script>` on three ingest paths), three
# user-visible desktop panics, 1,405 deleted duplicate lines, a trust envelope
# that exposed ten bench banks being scored as fine, tool descriptors 0 -> 68%
# data-sourced retiring 4,137 lines of data spelled as code, `code index --help`
# exiting 1, and a config path that lied to shipped-binary users.
#
# NOT ONE OF THOSE IS VISIBLE IN THE THREE BARS ABOVE, because they measure a
# dimension that was already healthy: `cargo xtask layer-gate` exits 0 — every
# crate edge points down or sideways — and §10.2 measures 0 of 441 load-bearing
# types carrying an upward edge. The defect is INSIDE crates, and this bar is
# where the work already being done becomes scoreable instead of narrated.
#
# MEASURED at `0f6bb56d`: 42.9% of 4,998 first-party production types are
# referenced by NO other file. The per-crate spread is the real signal — same
# authorship, same five months:
#   sovereign-cli        93 types   85% private   0% exported
#   sovereign-server     84         80%           0%
#   sovereign-desktop   213         78%           0%
#   sovereign-cli-llm   613         75%           0%   (122k production lines)
#   corpus-engine       900         28%          34%
#   sovereign-contracts 284         11%          86%
#   oicp-types           70          0%          96%
# A fivefold spread is not idiom, it is the absence of anything to reach for.
# The instrument independently reproduces §10.2's HAND figures (cli-llm 75/0,
# contracts 15/84 vs 11/86, desktop 79/0 vs 78/0) — that agreement is its
# validation (§18.4), not a coincidence.
#
# TARGET IS DERIVED, NOT GUESSED: 28% is what `corpus-engine` — the LARGEST
# first-party crate at 900 types — already achieves today. The target is
# therefore "the rest of the system reaches what our biggest domain crate has
# already demonstrated is possible", which is falsifiable and was not chosen to
# flatter any rung.
#
# NOT ALL PRIVACY IS WRONG. A one-endpoint DTO should be private, which is why
# the target is 28 and not 0. A bar driven to zero here would be actively bad
# architecture, and any rung that claims movement by making one-use types public
# is gaming it — check the SPREAD, not the mean.
today        = 42.9
target       = 28.0
direction    = "lower_is_better"
instrument   = "scripts/nc-reach.py --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({\"value\": float(d[\"value\"]), \"commit\": d[\"indexed_head\"]}))'"
kill         = "if the share falls while the per-crate spread does not narrow, the bar is being moved by publishing one-use types rather than by extracting anything — stop and re-read §10.3"

# ── THE REBASELINE, 2026-08-20 (operator-approved, directive 22d0841b) ─────
