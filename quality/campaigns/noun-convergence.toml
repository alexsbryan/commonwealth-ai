# envelope that renders, computes age, bands staleness and prints the footer
# cannot beat the do-nothing role, §10.8's first failure row has fired and the
# delete branch is the honest outcome.
#
# EXTRACT WORK, NOT SHAPE (§10.3): `Tool` carries dispatch + execution and sits
# at 52%; `Response` carries nothing and sits at 2%. Adoption is monotone in
# work carried and in nothing else.
today        = 2.94
