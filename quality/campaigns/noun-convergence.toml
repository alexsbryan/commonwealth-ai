# THE ONE BAR THAT IS ALLOWED TO FAIL AND STILL BE A SUCCESS. §10.7, operator
# direction 2026-08-20: "win by being useful and better, not through force —
# applied as a software architecture." That direction retired two proposed
# ratchets. This replaces them.
#
# THE TEST, pre-registered before the work, exactly as §10.7 states it:
#   Build the envelope in `kernel-types` and `Report` as its renderer in
#   `cli-shared`. Convert three commands — `atlas_drift_report.rs` (48
#   single-use types), `atos_cmd/run.rs` (43), `cache_audit_cmd.rs` (25).
#   THEN DO NOT MANDATE IT. No gate, no ratchet, no preflight check. Measure
#   adoption across the next N new or edited commands. If authors pick it up
#   unprompted it earned its place. If they do not, it was NOT better than what
#   they would have written, and it is DELETED rather than enforced.
#
# MEASURED FLOOR at d8af5cbf: the `Report` role is 102 types across 23 crates,
# 3 of them adopted (reaching 3+ crates) = 2.94%. The seat first typed 3.0 here
# from the rounded human table and corrected it to the minted 2.94 — a floor
