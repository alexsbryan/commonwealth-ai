moves = ["nc-thesis", "nc-reach"]
one_line = "Judgement — a Verdict with its evidence and calibration"

[[rung]]
id = "nc-7-answer"
moves = ["nc-thesis"]
one_line = "Draft -> Answer — THE THESIS CLOSES: no Answer without a Judgement"

[[rung]]
id = "nc-8-record-gap"
moves = ["nc-reach", "nc-pressure"]
one_line = "Record + Gap — Record has 0 definitions and 45 kin, the purest specimen"

[[rung]]
id = "nc-9-capabilities"
moves = ["nc-reach", "nc-god-objects"]
one_line = "Capabilities + Endpoint + Command — absence becomes a value, and Runtime becomes splittable"

[[rung]]
id = "nc-10-measurement"
moves = ["nc-reach"]
one_line = "Measurement + Baseline + Attribution — two numbers compare only if comparable"

[[rung]]
id = "nc-11-substrate"
moves = ["nc-reach", "nc-pressure"]
one_line = "Step + Artifact — one dataflow engine, five tenants"

[[rung]]
id = "nc-12-wire"
moves = ["nc-reach", "nc-pressure"]
one_line = "WireMessage — the OpenAI mirror family, 14 definitions, empty dependency gap"

[[rung]]
id = "nc-13-turn"
moves = ["nc-reach"]
one_line = "Intent + Question + Claim — the turn's own vocabulary"
