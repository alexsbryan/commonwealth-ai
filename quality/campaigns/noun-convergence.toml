# THE PRIMARY BAR OF THE REBASELINE. This is where the campaign's actual
# repeated finding shows up. The name census keys on NAMES and nc-reach keys on
# VISIBILITY; §10.6 is explicit that "the two instruments see different halves
# and the halves need different fixes" — §10.1 needs an abstraction minted,
