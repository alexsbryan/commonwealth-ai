rungs       = ["hd-4"]
promise     = "a ComplexTask step that goes through the executor runs exactly once across crash and replay"
enforced_by = "StepExecutionStore has no default method bodies, so an empty impl is E0046"
today       = "all four methods default to no-ops (sovereign-contracts/src/traits.rs:1805); 4 impls, one of them an empty MockStore"
not_covered = "six production `tool.execute(` sites never reach the executor — mcp_router.rs:579, routes_mcp.rs:378, handlers/document_op.rs:252, handlers/recipe_author.rs:336, workflow steps.rs:285, registry.rs:312"

[[ability]]
id          = "custody"
rungs       = ["hd-5", "hd-9"]
promise     = "a corpus whose recipe states no sharing policy is private"
enforced_by = "`mesh_sharing` takes serde's `default` instead of `default_true`; the policy becomes a type with no `Default` impl behind a private field and one accessor, so in-repo code that omits it is E0063 and no second reader can resolve absence its own way (rung hd-9)"
today       = "`#[serde(default = \"default_true\")]` at corpus-engine/src/recipe.rs:790; two shipped recipes and two generators state nothing; `scope` carries a doc comment claiming a structural guarantee it does not have"
not_covered = """
prompt content routed to a peer for inference reads no sharing flag (sovereign-serving-host peer_inference select_peers_ranked); indexes already installed keep the mesh_sharing stamped in their IndexMeta.
two SECOND parsers keep their own `true` default and hd-5 flips neither: `RegistryEntry.mesh_sharing` (corpus-engine/src/registry.rs:76-77, `default_true`, flowing to the desktop catalog at :321) and `CorpusDefinition.mesh_sharing` (sovereign-tools/src/corpus/registry.rs:45-51, its own private `default_mesh_sharing() -> bool { true }`, invisible to a `git grep default_true`). Whether either reaches an egress decision was NOT established by a reader census; they are hd-9's subject — "no second reader resolves absence its own way" is that rung's claim.
TOML authorship cannot be compile-enforced — a recipe is data, so absence resolves to Private through the one accessor with a named warn; refusing at parse instead is the approval-time decision.
"""

