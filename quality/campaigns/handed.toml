# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
# The ladder is the [[rung]] table (scripts/co-ladder.py schema); the rationale and
# the decisions are .sovereign/features/handed/campaign.md; the orders are
# quality/campaigns/handed/order-<n>-*.md (COMMITTED: a pool lane is a worktree and
# cannot read .sovereign/, which is gitignored).
id        = "handed"
objective = "Nothing can do anything it was not handed: the abilities that carry the product's promises are minted in one place and a violation does not compile"
# spec: §3 ("the profile is the constructor"; "capabilities are tokens, not booleans") and §3.5.
spec      = "quality/TOPOLOGY.md"
declared  = "2026-09-17"
status    = "staged"   # next up after domains; `scripts/ralph.py promote handed`

# ── THE PREDICATE ────────────────────────────────────────────────────────────
# Two halves. The first passes vacuously for a profile that holds nothing, so the
# second is the load-bearing one.
[predicate]
statement = "Every [[ability]] below is structural — the planted violation its rung names goes red, and the tree is green — and the bench serves one grounded and one generative turn in-process, pasting both verdicts and the commission trace line"
check     = "./scripts/with-cargo-lock.sh ./scripts/sovereign-lint.sh --human --full && (cd corpus-engine && ../scripts/with-cargo-lock.sh cargo xtask layer-gate) && ./scripts/with-cargo-lock.sh ./scripts/sovereign-test.sh --human"

# ── THE SCOREBOARD ───────────────────────────────────────────────────────────
# A row is structural in the commit that lands its enforced_by AND deletes the
# ambient path. Nothing here is baselined, so nothing can be re-pinned.
#
# `promise` is what the row makes true — narrowed 2026-09-17 to what its rung
# actually delivers. `not_covered` is the rest, named rather than implied
# (principle 6). Widening a promise is a ladder edit, not a wording edit.

[[ability]]
id          = "assemble"
rungs       = ["hd-2"]
promise     = "a Runtime exists only through `commission`, and `commission` names the profile it is built for"
enforced_by = "RuntimeParts requires a CommissionSeal; the seal crate's `[[forbid]]` rule excepts only sovereign-core and sovereign-runtime-recipe on the from side, so a mint anywhere else in production is E0433. Four crates take the seal under `[dev-dependencies]`, which the layer map exempts (ARCH_LAYERS.toml:6-7) — the claim is 'no production crate but those two', not 'only the recipe'"
today       = "three hosts build RuntimeParts by struct-update on common.parts; 21 RuntimeParts::new calls in 12 files (20 of them tests); `commission` exists (sovereign-runtime-recipe/src/lib.rs:385) and decides nothing"
not_covered = "sovereign-server is converted in place; whether it should exist at all is a separate decision"

[[ability]]
id          = "render"
rungs       = ["hd-1", "hd-10"]
promise     = "every released text carries a verdict from a verifier that ran on it"
enforced_by = "Complete.judgement is required and serve.rs is its only builder (E0063); every exit names a GateSurface and every surface has a verifier; Judgement's constructors are private behind a receipt only a verifier mints, so an exit cannot hand-roll a verdict (rung hd-10)"
today       = "the gate outcome rides `metadata: Option<TurnMetadata>`; MessageRefined swaps the answer text after Complete at three production sites (collaboration.rs:679,:705,:729) plus three test constructions"
not_covered = """
no user-facing surface renders the verdict: `hd-1-surfaces-print` was cut at round 2 (no plant, no test, nothing read either field), so `--format json` and the desktop `message-complete` payload still drop it, EpistemicFooter.svelte:10-21 reads the epistemic ledger instead, render.rs:281 renders provenance, and mobile renders nothing. A candidate rung, not funded here.
`could_not_judge` still ships text: a verifier that RAN and abstained is not one that never ran, and which verdicts force a rewrite is turn policy, enforced at runtime.
A THIRD MessageResponse — the desktop's own, sovereign-desktop/src-tauri/src/commands/mod.rs:13 — carries `metadata: Option<Value>` (:19), an untyped blob the compiler will NOT name when the daemon's and the server's are converted, so it ships with no verdict.
`ApprovalChannel::emit_message_refined` has a no-op default body (sovereign-contracts/src/traits.rs:2008) and only SocketApprovalChannel overrides it (turn_approval.rs:298); AutoApprovalChannel (executor.rs:235) and ServerApprovalChannel (sovereign-server/src/approval.rs:103) discard the notice, judgement and all. Deleting that default is a rung of its own — it is hd-4's defect 200 lines up the same file.
The PERSISTED refined row keeps the pre-refinement verdict: collaboration.rs:693 writes `metadata: original_metadata`, so history, a desktop reload and a json replay all show refined text under the previous turn's verdict. hd-1-refined fixes the live notice only (885/885 lines, arch-gate's no-slack band); hd-10 owns the fix.
`TurnFrame::StreamError` (sovereign-contracts/src/types/turn.rs:147-153) is a fourth terminal — the contract at :350-351 says Complete and StreamError both settle — with no judgement slot and no row touching it.
"""

[[ability]]
id          = "writers"
rungs       = ["hd-3", "hd-8"]
promise     = "a second PROCESS writing one index, atlas or config is refused by name"
enforced_by = "`table()`/`connection()` pub(crate) so an out-of-crate write is E0624; the mutating methods move behind a CorpusWriter facade that acquires the flock, so an in-crate write without it is E0599 (rung hd-8); a per-corpus flock (the `.rebuild.lock` precedent, corpus-engine-scip/src/scip_graph.rs:483-500) and a flock inside SetupConfig::save_to"
today       = "no lock on the corpus index; TOPOLOGY.toml has 4 of 7 invariants false; SetupConfig::save_to is a plain fs::write"
not_covered = """
two write paths inside ONE process share the claim by design: the `Weak` map is what lets eleven nested writes (maintain.rs:374, create.rs:854/:917, write.rs:75, mod.rs:806-807 and seven `mark_*` helpers) run at all, since RunLock refuses a second same-process acquire on one path (run_lock.rs:210-222). `two_handles_in_one_process_both_write` pins the sharing. In-process exclusion would need an owned Mutex, not a shared Weak — hd-8 makes the door compile-enforced, not exclusive.
whole-directory replace bypasses every write path, because it never calls one — canonical_pull.rs:292 (rename over `<index_dir>/<corpus>`), restore_snapshot_archive (snapshot_restore.rs:68), the desktop's import remove_dir_all (import_commands.rs:299,:695), local_corpus/writeback.rs:383, project_init/mod.rs:463. `atlas_teardown` (atlas/mod.rs:146) is the one of this class that IS covered: it is inside corpus-engine and its signature already names the corpus.
two in-crate raw meta rewrites cannot route through `write_meta`'s typed signature (both round-trip serde_json::Value to preserve unknown fields) and take the guard directly instead: engine/mod.rs:2543 in `migrate_canonical_to_partition`, sharding.rs:162 in `promote_single_shard`.
jobs interleave: the guard is per-write, not per-job, so two processes each ingesting one corpus serialize every mutation and interleave between them (TOPOLOGY.md:284-287 promises no more).
off unix the flock enforces nothing — `RunLock::is_enforced()` is `cfg!(unix)` (run_lock.rs:192); the guard logs which it got.
raw `lancedb::connect` stays nameable inside corpus-engine and sovereign-tools; closing it is a clippy rule and no gate the loop runs executes clippy.
config keeps two writers — the CLI (model_cmd.rs:378, mcp_cmd.rs:236,:283, setup_cmd/*) and the desktop (7 sites in 3 files) — both through `save_to` and so both locked; what is NOT delivered is "the desktop is not a config writer": `SetupConfig` still derives `Serialize` with a pub `default_path()` (setup_config.rs:1991), so a thin surface can serialize the file by hand, and TOPOLOGY.toml `a-process-writes-only-what-it-is-granted` :322 stays `holds = false`; `projects.json`, `mesh.json` and `join_key.secret` are in the same TOPOLOGY store (:192) and are NOT locked — only `config.toml` is.
the enrichment catalog, `scip_graph.db` and the asset CAS are separate stores and keep their current posture.
Cross-process exclusion is a runtime refusal by construction: another process is not in this compilation unit.
"""

