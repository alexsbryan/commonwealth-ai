# ── BARS ─────────────────────────────────────────────────────────────────────

# ONE bar. `hd-surfaces` was cut at round 2: co-lineage.py:435 is the only reader
# of a bar verdict and it reads recorded `bar-measurement` rows, no row recorded
# one, and `[[rung]].status` cannot produce `met` — so it would have ended
# NEVER-MEASURED (co-lineage.py:792,:947) while `is_open` counted it OPEN forever.
# It was also a 0->1 boolean identical to rung hd-7's status. Predicate half 2 is
# now carried by rung hd-7 and re-run by the final audit.
#
# The instrument below is EXECUTABLE (co-lineage measure runs it and parses the
# last stdout line), and it reads the ladder rather than a second table: an
# ability is structural when every rung in its `rungs` list is `done`, and a rung
# goes `done` only in an audit that re-ran its PLANT and checked the error code.
[[bar]]
id           = "hd-structural"
one_line     = "abilities whose enforced_by has not been watched red then green"
derives_from = "predicate half 1; TOPOLOGY.md §3 technique 4 (capabilities are tokens, not booleans); principle 5 (a gate you have not watched fail is not a gate) — principal counts until its plant runs, though its code already holds"
floor        = 6.0
floor_basis  = "2026-09-17: six ability rows, none with a watched plant"
target       = 0.0
direction    = "lower_is_better"
instrument   = '''python3 -c "import tomllib;d=tomllib.load(open('quality/campaigns/handed.toml','rb'));s={r['id']:r['status'] for r in d['rung']};print(sum(1 for a in d['ability'] if any(s.get(x)!='done' for x in a['rungs'])))"'''
goodhart     = "a PLANT can go red for the wrong reason — a typo, an unrelated error. The audit re-runs each PLANT and checks the error code the row names: E0063, E0624, E0433, E0046, E0004, E0308, E0603/E0425, and hd-8's E0599. Five of the plants assert in a TEST rather than in rustc — for those the audit checks the failing assertion is the named test's, not an unrelated one. A rung whose status is flipped without that re-run makes this bar read lower than the truth, which is the one way to cheat it"
kill         = "the seal cannot be minted without a new layer-gate key, or a row needs an adapter in both directions: stop and redraw"
status       = "open"

