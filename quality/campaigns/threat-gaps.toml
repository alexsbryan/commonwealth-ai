one_line     = "CLAIM: the tensor-split port is not reachable from the LAN by default, and distributed inference still works through the member-only tunnel"
derives_from = "measured 2026-09-20: DEFAULT_RPC_BIND = 0.0.0.0:50052 (sovereign-daemon/src/bootstrap.rs:327); the member-only encrypted tunnel already exists (RPC_ALPN, commonwealth-transport/src/iroh.rs:78; test the_rpc_alpn_admits_members_only_and_has_no_downgrade, iroh_access.rs:1470); tunnel vs direct measured on a 4B only (docs/DISTRIBUTED_PILOT_READINESS.md:533-536)"
floor        = 1.0
floor_basis  = "structural: 1.0 iff (a) with no env and no config the worker binds loopback, (b) a non-loopback bind without the acknowledgement knob is refused with a sentence and is not silently Off, (c) a two-node split completes tokens over the bridge on a direct path, not relay, (d) big-model tok/s over the bridge is reported beside direct-ip in the verdict row. Any false is 0.0."
target       = 1.0
direction    = "higher_is_better"
goodhart     = "reads 1.0 while the 0-to-1 path got slower if clause (d) is reported and nobody reads it - a material drop against direct-ip stops the order for the operator; reads 1.0 for nothing if the run sets the bind explicitly"
status       = "open"

[[bar]]
id           = "tg-token-revoked-alone"
demo         = "Mint client tokens `laptop` and `tablet`; both get 200 from another machine; revoke `laptop`: it gets 401, `tablet` stays 200, no restart. The shared token still works."
one_line     = "CLAIM: a remote client holds a credential of its own that can be revoked without rotating everyone's"
derives_from = "measured 2026-09-20 by a subworker, not re-opened by the seat: the client token is one Option<Arc<str>> fixed at construction (sovereign-daemon/src/state/node.rs:29); Principal::RemoteClient { credential } already exists (sovereign-contracts/src/principal.rs:77-83); GuestGrant is in-memory and capped at 24 h so it cannot be a durable device credential"
floor        = 1.0
floor_basis  = "structural: 1.0 iff (a) two named tokens each admit a non-loopback caller, (b) revoking one refuses it within the same daemon lifetime while the other still admits, (c) the admitting label appears in the log line, (d) the shared token admits by default and is refused under client_tokens = named-only. Any false is 0.0. DROPPED, and entry 3 re-worded instead, if the order's first row finds at most one distinct RemoteClient fingerprint over a week."
target       = 1.0
direction    = "higher_is_better"
goodhart     = "reads 1.0 on a restart if revocation only takes effect at load (clause b is same-lifetime); reads 1.0 while breaking 0-to-1 if the shared token stopped working by default (clause d)"
status       = "open"

