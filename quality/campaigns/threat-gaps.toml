# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
#
# Declared 2026-09-20 by operator decision (ralph/DECISIONS.md A58). The five
# gaps `docs/THREAT_MODEL.md` §"Known gaps — open work" disclosed with no owner
# (ledger A56 made a disclosed gap open work). Measured the same day: one is
# already closed, two are smaller than worded, one is WORSE than worded.
# Order: `.sovereign/features/threat-gaps-close/order.md` (gitignored), which
# carries premises, predictions and the twelve rows. QUEUED behind ring-guest
# and mesh-principal. No bar has an instrument yet: the order's first row
# builds `scripts/threat-gaps-demo.sh` and watches each bar FAIL before any
# product row runs; until then every bar is unmeasured, never assumed.
id        = "threat-gaps"
objective = "A stranger is refused everywhere a member is served: on the internal API, on the tensor-split port and on the mesh-app bridge; a client token can be revoked alone; and the threat model names nothing that no longer exists."
spec      = ".sovereign/features/threat-gaps-close/order.md (Demo, Assumptions, Premises, Predictions); docs/THREAT_MODEL.md §Known gaps entries 1-5; ralph/DECISIONS.md A56, A58"
declared  = "2026-09-20"
status    = "active"

[predicate]
statement = "On the room stand-in, `scripts/threat-gaps-demo.sh verdict all` reads PASSED on all five tg-* bars twice from cold, the ring-guest and rr-2 bars still read PASSED, and entries 1-5 of docs/THREAT_MODEL.md §Known gaps are each struck citing a commit or re-worded to what is still true."
check     = "scripts/threat-gaps-demo.sh verdict all"
# The instrument does not exist yet, so `check` exits non-zero today and the
# predicate reads FALSE — which is the truth.

[[bar]]
id           = "tg-stranger-refused-9742"
demo         = "From a second LAN machine, POST /internal/mesh/quiesce to a node's :9742 with no credential. Today it answers 200 and the node logs the flip. After, 401 naming what is missing; `svrn mesh join` from that machine still works."
one_line     = "CLAIM: a non-member reaches only the join route on the internal API, over plain IP and over iroh; everything else requires a verified member"
derives_from = "measured 2026-09-20: no handler under sovereign-daemon/src/routes_internal/ reads a peer address (grep ConnectInfo|is_loopback: 0 files); the internal service is the one listener built without connect-info (daemon.rs:3820-3853); default bind 0.0.0.0 (setup_config.rs:1728-1732); the internal iroh ALPN splices ANY dialer to it (sovereign-mesh/src/iroh_access.rs:421-437, which calls it a known open edge)"
floor        = 1.0
floor_basis  = "structural: 1.0 iff (a) an uncredentialed non-loopback POST to a state-changing internal route is refused 401 and the node's state did not change, (b) the same request from a non-member over the internal iroh ALPN is refused, (c) a member's gossip round and ring sync complete unchanged in the same run, (d) a fresh node joins over the same listener, (e) the set of routes exempt from the gate is exactly join and gossip, pinned by a test. Any false is 0.0."
target       = 1.0
direction    = "higher_is_better"
goodhart     = "reads 1.0 by breaking the mesh if members are refused too (clause c); reads 1.0 on one path only if the gate covers plain IP and not the iroh splice (clause b); reads 1.0 with the gate defaulted off if the instrument sets the strict knob itself - the run uses the shipped default"
status       = "open"

