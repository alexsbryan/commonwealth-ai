# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
# Defer/descope = edit a bar's `status`; git history is the ledger.
#
# ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is the
# committed artifact and the LADDER carries the rung list, so the plan survives
# without them. The registry this campaign reads and writes is
# `quality/DOMAINS.toml` (contexts, the words each owns, module tags, the
# Peer* dispositions) — DATA, so a tag or a disposition is a diff a reviewer
# reads, never a constant in an instrument (ARCH principle 9).
id        = "domains"
objective = "Ten bounded contexts, each individually applicable — someone outside this repository can take one alone and get value — so a crate's name says what it holds and one word means one thing"
spec      = "quality/DOMAINS.md"
register  = "quality/CONCEPTS.toml"
declared  = "2026-09-13"
status    = "active"

# ── THE PREDICATE ────────────────────────────────────────────────────────────
#
# DOMAINS.md §2 (operator, 2026-09-11): a context is real when someone outside
# this repository can take it alone and get value. The mechanism already
# exists and must not be duplicated — `[[package]]` in quality/ARCH_LAYERS.toml
# (four rows today: studio :821, code-intel :839, corpus-mcp :865, commonwealth
# :905), `cargo xtask boundary-gate` over them, and the two lift scripts
# (scripts/cw-work-lift.sh, scripts/cw-rails-lift.sh). The denominator below is
# cargo's dependency closure through boundary-gate, not a list an author wrote.
# The only authored part is the closed set of contexts, and that set is the
# design (§4), declared once in quality/DOMAINS.toml `[[context]]` — a context
# that merges (§8 kill bar names Build feedback first) is a row edit with a
# ledger line, not a constant edit.
#
# boundary-gate's own doc says what it cannot see: "Its unit is the CRATE"
# (corpus-engine/xtask/src/boundary_gate.rs:40). Serving is 35,000 lines of
# package-shaped code INSIDE two crates, invisible to the gate until it has a
# crate — which is why Phase C exists and why the predicate cannot be green by
# accident before it.
#
# UNTIL domains-3 lands, the check below reads could-not-judge (instrument
# missing). That is the honest reading — never-ran is not passed (§18.2).
[predicate]
statement = "Every context kept in quality/DOMAINS.toml names a [[package]] in quality/ARCH_LAYERS.toml that cargo xtask boundary-gate passes, and no crate outside the commonwealth package defines a pub type named Peer*"
check     = "python3 scripts/domains-census.py predicate && (cd corpus-engine && cargo xtask boundary-gate)"

# ── WHAT THE INVENTORY SAID BEFORE THIS WAS WRITTEN (ARCH principle 11) ─────
#
# This is the THIRD campaign on this ground, and the first two are cited so
# their lessons are structure here, not memory:
#
#   noun-convergence (quality/campaigns/noun-convergence.toml, PARKED 2026-08-22)
#     drafted `nc-8-peer-capability` ("commonwealth publishes Peer") and
#     `nc-6-atom`; nc-8 was BLOCKED on the commonwealth -> sovereign backflow.
#     Its parking note is the rule this campaign obeys: "Reopen only with an
#     instrument that has passed a positive AND a negative control first."
#     Its type-count bars were blind to the real work (nc-reach moved -0.03 on
#     a rung that deleted a live defect), so every bar below carries a
#     `goodhart` line and the ladder puts the instrument rung FIRST, watched
#     failing, the way cw-lift's rung -1 did.
#   cw-lift (quality/campaigns/cw-lift.toml) proved the §2 test twice and left
#     the lift-script shape this campaign copies for Serving.
#
# The register already settled Fabric's word: quality/CONCEPTS.toml:911-920,
# concept `Peer`, canonical `commonwealth_core::mesh::MemberRecord`, "there is
# no `pub struct Peer` anywhere in the workspace — the mesh member type is
# MemberRecord". So Phase A is NOT a rename of Fabric's type. It is the
# retirement of the Peer* types defined OUTSIDE the commonwealth package.
#
# MEASURED 2026-09-13 (hand grep, `pub (struct|enum|type|trait) Peer*`, *.rs,
# excluding target/ and studio/). DOMAINS.md §3 said 34 across 11 crates; the
# instrument below will be the one decider and this row records the drift:
#   39 distinct pub Peer* definitions across 13 crates
#   13 inside commonwealth/crates (transport 8, state 2, core 2, media 1)
#   26 OUTSIDE — sovereign-mesh 11, sovereign-api 5, sovereign-contracts 3,
#      sovereign-tools 2, desktop 1, cli-llm 1, oicp-types 1, kernel-types 1,
#      corpus-engine 1
#   Atom* pub definitions: 10 inside corpus-engine/src/enrichment/, 13 outside
#      (sovereign-mesh 6, sovereign-tools 5, sovereign-turn-client 1,
#      corpus-engine/atlas_traversal 1); `AtomSpan` is defined twice.
#   sovereign-mesh: 88,255 lines (DOMAINS.md §3 said 82,241 on 09-11; +6,014
#      in two days as sv-surface moved routes INTO it — the bar below starts
#      with its trend running the wrong way, and says so).
#   corpus-engine-vocab: 5,161 lines, recursive — DOMAINS.md §5 is right; an
#      earlier draft of this file said 2,769 off a non-recursive glob that
#      missed src/ontology/ (1,719) and atoms/tests.rs (673). Corrected, and
#      recorded because the next reader will run the same glob.
#   Serving, module by module: 44,485 lines (DOMAINS.md §4 said ~37,000) —
#      sovereign-mesh 24,307, sovereign-api 16,177, sovereign-serving 1,491,
#      serving-policy 1,241, oicp-types/src/scoring.rs 1,269; 38,665 if
#      frontdoor.rs (5,820, third-party harness prompt shaping) is Host.
#   sovereign-mesh/src/*_http.rs: 26 files / 22,017 lines (DAEMON_CORE.md §2
#      said 22 / 18,319 on 09-11) — the lane a daemon-core campaign would
#      empty is growing while this plan is written.
#   atoms.json readers: 20 sites, ZERO declare their own struct — all use
#      vocab's AtomsFile (17) or serde_json::Value (3). The Atom* count as
#      DOMAINS §8 row 2 states it would read GREEN today on a tree where
#      corpus-mcp/src/tools.rs:873 hand-rolls the reader because the door,
#      read_atlas_atoms, is at corpus-engine/src/enrichment/atlas/writer.rs:595
#      and not in vocab. Nine sites outside the context bypass it. Six of the
#      seven sibling atlas files have a write_atlas_* and no reader at all.
#
# THE WORDS COLLIDE, and the collision is measured, not feared. DOMAINS.md §5
# proposes Fabric=Member, Serving=Candidate, Compute=Donor, Admission=Caller,
# Knowledge=Source. `sovereign code converge noun <W> --corpus-id commonwealth-ai`
# on 2026-09-13:
#   Member     2 defs (sovereign-cli-dev code_capability_graph.rs:90 — a
#              workspace member crate; sovereign-tools suggest_seams.rs:63)
#   Candidate  5 defs (commonwealth-rail-core admit.rs:277, sovereign-core
#              models_manifest.rs:156 and runtime/retrieval/atom_enum.rs:308,
#              sovereign-cli-dev refactor_cmd/affinity.rs:273, sovereign-tools
#              code/dry_report.rs:132) + 23 morphological kin
#   Donor      0 defs — clean
#   Caller     1 def (corpus-engine-scip scip_graph.rs:163 — a call-graph
#              caller, a different concept)
#   Source     already in quality/baselines/concepts.txt's duplicate-name set,
#              AND DOMAINS.md §4 gives **source** to Ingest. Two contexts
#              cannot own one word (§4's own rule).
# A sixth `Candidate` would be the disease this campaign exists to remove.
# domains-4 chooses each word against this evidence; the bar `dm-word-owners`
# is what makes the choice checkable rather than remembered.
#
# ONE INSTRUMENT IS ALREADY BROKEN. scripts/daemon-route-census.py:25 still
# lists `commonwealth/crates/commonwealth-api/src` as a host; that path left
# the tree at domains-1 (904145b64, 2026-09-11). Today it reports 213 unique
# paths and never names sovereign-api, so DAEMON_CORE.md's 242 / 89-route
# baseline is silently under-counted by every route sovereign-api registers.
# Fixing the HOSTS row is domains-3's first step and is recorded here because
# a Phase D bar read off that census before the repair would be a number
# about a tree that does not exist.

# ── Bars ────────────────────────────────────────────────────────────────────

[[bar]]
id           = "dm-peer-outside-fabric"
one_line     = "No crate outside the commonwealth package defines a pub type whose name carries the word Peer"
derives_from = "DOMAINS.md §5 call 1, §8 row 1 (falsified if any crate outside Fabric defines a Peer* type) — counted as the WORD anywhere in the name, not the prefix"
status       = "open"
# THE PREFIX IS THE WRONG SWEEP. Prefix-pub reads 39/13 (26 outside the
# package). Sweeping for `Peer` ANYWHERE in the type name finds 21 more
# definitions and a fourteenth crate (commonwealth-discovery, DiscoveredPeer):
# 50 pub-ish across 14 crates, 35 of them outside commonwealth/. A prefix bar
# is passed by renaming PeerFoo to MeshPeerFoo, which moves no coupling. Two
# carve-outs are registry rows, not exceptions here: PeerStore/PeerEntry/
# PeerStoreError (C8, a replicated KV — its right word is ReplicatedKv, so a
# rename) and PeerAnswer in kernel-types (C9, egress custody — the one place
# the word is load-bearing; disposition keep, with the why on the row).
floor        = 35.0
floor_basis  = "2026-09-13 scratchpad/peer-count.sh --anywhere (pub + pub(crate)) over the registry's [[noun]] rows: 50 across 14 crates, 35 outside commonwealth/ in 9 crates (sovereign-mesh, -api, -contracts, -tools, -desktop, -cli-llm, corpus-engine, oicp-types, kernel-types); prefix-only would read 26. domains-3 re-mints with the one instrument and records any delta"
target       = 0.0
direction    = "lower_is_better"
instrument   = "python3 scripts/domains-census.py peer-outside --anywhere --json"
goodhart     = "this can hit target while the predicate is still false if the 26 are renamed Node*/Remote*/Endpoint* and still shared across contexts — the word moved and the type sharing did not; dm-shared-edges is the check"
kill         = "if retiring a Peer* type needs an `impl From` in BOTH directions with no field dropped, the two contexts were one context and the line is drawn wrong — stop and redraw, do not ship the adapter pair (nc-boundary's shim clause, one level down)"

[[bar]]
id           = "dm-shared-edges"
one_line     = "Fabric's member type reaches Serving and Compute only through a named translation"
derives_from = "DOMAINS.md §5 — 'Serving -> Fabric and Compute -> Fabric each need an anticorruption layer, and their absence is the defect'"
status       = "open"
# 13 edges enumerated by hand 2026-09-13 (registry `[[edge]]` rows, each with
# the fields the consumer actually reads). Seven originate in Fabric. Two are
# tiny: PeerHealthTracker crosses into the scheduler as TWO METHODS keyed by a
# name string and zero fields; PeerPreference crosses into routes_oicp.rs:402
# as ONE f32. Knowledge -> Fabric is a THIRD anticorruption seam §5 does not
# name, and it is the one that already works: PeerAtlasView::from_member
# (sovereign-tools/src/atlas_peer_advice.rs:67) translates five roster fields
# at one named function. That is the pattern rungs 5 and 6 copy.
floor        = 13.0
floor_basis  = "2026-09-13 hand enumeration of Peer-carrying types defined in one context's crate and consumed by a module of another (registry [[edge]] rows E1-E13); domains-3 re-mints from module tags and records any delta"
target       = 0.0
direction    = "lower_is_better"
instrument   = "python3 scripts/domains-census.py shared-edges --json"
goodhart     = "this can hit target while the predicate is still false if the translation type carries every field of MemberRecord — the anticorruption layer renamed the leak; the instrument reports translated-field count beside the edge count so a mirror is visible"
kill         = "if a Serving or Compute module needs more than ~4 fields of a member to do its job, it is doing Fabric's job — move the decision into Fabric, do not widen the translation"

[[bar]]
id           = "dm-word-owners"
one_line     = "Each context-owned word family is defined only inside its owner"
derives_from = "DOMAINS.md §4 — each context 'is named by the question it answers and by the word it owns exclusively'"
status       = "open"
# The generalisation of dm-peer-outside-fabric to every owned word in
# quality/DOMAINS.toml `[[context]].owns`. Floor minted by domains-3 after
# domains-4 fixes the words; target-only until then.
target       = 0.0
direction    = "lower_is_better"
instrument   = "python3 scripts/domains-census.py word-owners --json"
goodhart     = "this can hit target while the predicate is still false if a word is made unique by giving it a compound name nobody references — the instrument prints reference counts beside definitions, and a zero-reference owner is a folder, not a context"
kill         = "if the only exclusive word available for a context is one no reader would say aloud, the context is misnamed or is not one — DOMAINS §8 kill bar: merge it into its neighbour and say which"

[[bar]]
id           = "dm-atom-outside"
one_line     = "No consumer outside enrichment/ declares its own Atom"
derives_from = "DOMAINS.md §5 call 2, §8 row 2"
status       = "open"
# RE-SPECIFIED before the first row, not after (nc-extends' tool axis was
# re-scoped after; this is cheaper). The 13 classify as: 2 re-derivations
# (turn-client AtomsPage<T>, generic ONLY because the crate cannot name the
# vocab; atlas_traversal/spans.rs AtomSpan), 3 axum query binders (the
# ALLOW-LIST below), 7 projections that are the read model built in the wrong
# crate (five already use vocab's AtomId/AtomType/StableAtomKey), 1 duplicate
# (reading_http.rs AtomSpan). The instrument counts pub Atom* definitions
# outside corpus-engine-vocab/ and enrichment/, minus an ALLOW-LIST of named
# binders — never a path pattern: `*_http.rs` returns 9 and silently drops
# AtomSpan/AtomCard/AtomElsewhere, three types the bar exists to catch.
# Whole-tree the count is 12 (corpus-engine-archaeology adds AtomWitness and
# AtomProvenance — an atom's GIT PROVENANCE, a different concept; domains-4
# either allow-lists them or names their concept, which puts the moveable
# target at 10).
floor        = 12.0
floor_basis  = "2026-09-13, I1 grep run on 1ee406165: pub Atom* outside vocab and enrichment/, minus allow-list {AtomLimitQuery, AtomsPageQuery, AtomBrowseRequest}; the twelve are listed by file:line in the domains-8 order"
target       = 0.0
direction    = "lower_is_better"
instrument   = "python3 scripts/domains-census.py atom-outside --json"
goodhart     = "this can hit target while the predicate is still false if (a) a name is added to the allow-list — the instrument prints the allow-list digest beside the value, and a digest change with no registry diff is refused — or (b) consumers keep reading atoms.json through their own reader function typed by AtomsFile; (b) is not counted because a grep for it was drafted, measured at 65/31/5/84 against 9 real sites, and killed — it is made STRUCTURAL in domains-8 instead (AtomsFile.atoms pub(crate), reachable only through vocab::read)"
kill         = "if a consumer needs a field the vocab read model does not expose and adding it makes the model a mirror of AtomEnvelope, the model is the wrong shape — say so and stop (nc-6-atom's not-worth-continuing clause, kept verbatim in spirit)"

