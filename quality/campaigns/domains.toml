# ── The ladder ──────────────────────────────────────────────────────────────
#
# Phase 0 LANDED before this file existed: domains-1 (904145b64) and domains-2
# (cd9250aab), 2026-09-11 — six crates left commonwealth/, ledgered in
# sovereign/SYSTEM_OVERVIEW.md §5. Ordering was BIG-FIRST by operator
# direction and stays so: a small crate's destination is decided by where the
# big one lands. Numbering continues from those two.
#
# ── THE STRATEGY, re-sequenced 2026-09-14 by operator direction ─────────────
#
# God crates first. Not "names, then the read model, then a crate, then the
# rest" (DOMAINS.md §7's phase order, which sequenced by CONCERN) but by
# CRATE, biggest first: take the largest crate whose modules are not all its
# own context, keep the cluster that IS its context, move every other cluster
# to that context's home crate (creating the home when the registry says it
# does not exist yet), then loop. The phases fold in rather than disappear:
#   Phase A (the words)  -> a rename RIDES THE MOVE that touches the file;
#                           every import changes anyway, so the Peer->Venue/
#                           Donor/Member rows in the registry are applied as
#                           each cluster leaves. No rename-only rung.
#   Phase C (Serving)    -> wave 1's serving cluster leaving sovereign-mesh IS
#                           the crate; SERVING_BOUNDARY.md is its declaration.
#   Phase B (the door)   -> wave 3's first move, when the loop reaches
#                           corpus-engine and Understanding leaves it.
#   Phase D (the rest)   -> the loop's later iterations, one crate at a time.
#
# THE ALGORITHM, and it is DATA the instrument runs, not a list a person keeps:
#   queue  := crates with own-context share < 100% (registry module tags),
#             ordered by lines desc                          (dm-queue)
#   loop   := pop the head; partition its modules by context; the cluster
#             tagged with the crate's own context STAYS; every other cluster
#             gets dest := the context's `crates` in quality/DOMAINS.toml
#             (an existing crate, or a named crate to create);
#             move order within the crate := LEAF clusters first (import no
#             sibling cluster), then size desc; an edge that crosses crates
#             after the move goes through a PORT already designed (§10.3,
#             SERVING_BOUNDARY.md) or the cluster SPLITS — never a new
#             [[exception]] row; a rename rides the move; the historical
#             re-export is deleted before the rung lands;
#             each destination whose share drops below 100% is ENQUEUED —
#             that is the breadth-first half: a move can make a new god crate
#             and the loop sees it on the next pass;
#   stop   := queue empty, i.e. every crate is 100% its own context
#             (dm-queue = 0) and every kept context is a package the gate
#             passes (the predicate).
#   check  := per move, `domains-census.py plan` asserts dest tier inside the
#             cluster's window [max own-dep tier, min consumer tier],
#             layer-gate green, no new exception, the crate's own-context
#             share monotone non-decreasing.
# The first three nodes were measured 2026-09-14 (scratchpad cluster graphs,
# folded into the registry's [[cluster]] rows by rung 3): sovereign-mesh
# 88,255 (fabric 16,028 stays; ten clusters leave), sovereign-api 43,163
# (nothing stays — it dissolves), corpus-engine 172,204 (ingest + retrieval
# stay; understanding, workbench, workspace, build-feedback leave).
#
# Every rung names the state it makes unrepresentable, or is labelled
# scaffolding (TOPOLOGY §10 standing bar). Cargo-touching work is one worker at
# a time. A wave is one crate; its rungs are its leaving clusters in the plan's
# order; the wave closes on a verdict rung that reads the crate at 100%.

[[rung]]
