# Flight rules for the requirement-conformance campaign. Read raw.
#
# BARS EXIST BEFORE THE DATA OR THE VERDICT IS NOT HONEST. Every bar below was
# written before the thing it measures was built.
#
# NO TRANSITION ROWS, EVER. A bar's `status` is open | deferred | descoped and
# nothing else; the VERDICT is a machine-stamped row in bar-measurements.jsonl,
# computed by scripts/co-lineage.py from the thresholds here. A hand-written
# `status = "met"` is the exact artifact this substrate was built to delete
# (co-lineage.py:4-10 — a prose row once credited a guard that existed only on
# an unmerged branch).
#
# Sequencing and the Deletes ledger:
#   /Users/alexsbryan/.claude/plans/let-s-properly-plan-this-distributed-fairy.md
# Orders: .sovereign/features/conf-0-ci-seat … conf-4-breadth

id        = "conformance"
objective = "One runner, two tiers, reporting passed/failed/could-not-judge/never-ran over all 625 requirements, so a full internal rewrite can be judged against the same bar"
spec      = "research/clean-room/REQUIREMENTS.md"
declared  = "2026-08-31"
status    = "active"

# ── The premise, measured rather than assumed ───────────────────────────────
# 625 requirements (591 must-class, 34 should), plus 19 acceptance scenarios
# the spec already wrote (§16 "How a rebuild is judged"). NOTHING in the
# codebase referenced a requirement id before this campaign.
#
# An earlier count in the same session said 513/479 — WRONG BY 112 — because a
# regex matched only `**ID-N (MUST).**` and §8 (D6/GR, "the product's central
# claim") declares its level once in a preamble. Fifty-three requirements
# vanished and the number still read fine. That is the characteristic failure
# of this system and of this campaign's instrument alike: a plausible,
# well-formed, exit-0 result that is wrong.

# ── THIS BAR GATES ENTRY TO EVERY OTHER BAR ─────────────────────────────────
[[bar]]
id           = "positive-control"
one_line     = "Break the GR-19 decider and GR-19 goes `failed` — the instrument can see a violation at all"
derives_from = "ARCH §18.1. Three independent green-while-blind instances in one session (2026-08-31): a base rate, not an anecdote. §18.1's own cautionary case IS this campaign's foundation — the CLI journey verifier captured 2>&1, every svrn prints a deprecation banner on stderr, so `stdout_non_empty` was satisfied by ANY command (note f496d39e)."
status       = "open"
target       = 1.0
direction    = "higher_is_better"
kill         = "Stays green => STOP. The instrument is blind and every number below it is unearned. Fix it before mapping requirement #2. Instrument lands with conf-2: mutate sovereign-core/src/quote_verification.rs:238 verify_answer_against_turn_evidence (pure), read GR-19's verdict, emit 1 if it moved to failed."

[[bar]]
id           = "denominator-exact"
one_line     = "The registry carries exactly 625 in-scope requirements"
derives_from = "The 112-requirement miscount above. A range is not a denominator, so this bar is an equality dressed as a threshold: the parser panics rather than defaults, and the per-family histogram is pinned in kernel-types/tests/requirements_registry.rs."
status       = "open"
target       = 625.0
direction    = "near_zero"
kill         = "Any value but 625 => STOP. Either the spec gained requirements (regenerate and move the pin in the same commit) or the parser is losing a declaration form, which is how the GR family went missing."
instrument   = '''python3 - <<'PY'
import tomllib
d = tomllib.load(open("quality/requirements.toml", "rb"))
print(sum(1 for r in d["requirements"]
          if r["level"] != "out-of-scope" and "alias_of" not in r))
PY'''

[[bar]]
id           = "gate-has-a-seat"
one_line     = "The registry check runs in a CI job that is inside `ci-ok`'s `needs`"
derives_from = ".github/workflows/ci.yml:604-632 — the `gates:` job is commented out and has been for a burn-in month that never ended. Adding a gate to a shelf reproduces the failure this campaign exists to prevent. Its own comment (:596) says the gates ran <1s each and the cost was two jobs paying setup twice: the gates were never slow, the job setup was."
status       = "open"
target       = 1.0
direction    = "higher_is_better"
kill         = "Lands only in a shelved job => STOP."
instrument   = '''python3 - <<'PY'
import re
ci = open(".github/workflows/ci.yml").read()
# The check is a plain #[test] in a workspace member, so it rides the
# already-live workspace test step; nothing new needed a seat.
seated = "./scripts/sovereign-test.sh --human --doctests" in ci
needed  = re.search(r"needs: \[[^\]]*\btest\b[^\]]*\]", ci) is not None
print(1 if seated and needed else 0)
PY'''

[[bar]]
id           = "smoke-stays-free"
one_line     = "SMOKE completes in <= 30s wall clock with no cargo build, no daemon, no model"
derives_from = "Operator direction 2026-08-31: 'a gate has to earn the right to keep being run by being robust and quick'. Both `gates:` and `clippy` were shelved on cost, not on correctness."
status       = "open"
target       = 30.0
direction    = "lower_is_better"
kill         = "> 60s => cut scope, never the tier. A slow SMOKE gets shelved for the same reason its predecessors were. Instrument lands with conf-2."

[[bar]]
id           = "mapping-is-asserting"
one_line     = "At least 7 of 10 sampled mapped requirements die under mutation of the code they claim to cover"
derives_from = "ARCH §18.1 — a check with no failing input you can name is not a check. A mapping is worth exactly what it detects."
status       = "open"
target       = 0.7
direction    = "higher_is_better"
kill         = ">= 3 survivors => mapping is NAMING, not asserting. Stop mapping; audit what is already claimed. Instrument lands with conf-3."

[[bar]]
id           = "no-exit-only-passes"
one_line     = "Every `passed` sourced from a CLI journey is backed by AssertionStrength::Output"
derives_from = "sovereign-cli-shared/src/cli_contract.rs:457-467 — AssertionStrength is three-valued precisely because exit-0 is meaningless here. `claimed-unproven` (a declaration backed only by None/ExitOnly, or a `covers:` over an assertion-free body) is a HARD FAILURE AT ANY COUNT, never a counter: it is the cheap repair the ratchet would otherwise reward."
status       = "open"
target       = 1.0
direction    = "higher_is_better"
kill         = "One `passed` backed by ExitOnly => the schema is gameable. Fix the promotion rule before adding a tag."

[[bar]]
id           = "gr-is-model-free"
one_line     = "At least 32 of D6/GR's 53 requirements are reachable with no model at all"
derives_from = "The premise that makes a fast tier possible: 32 pure deciders + 10 scripted-provider seams, of 53. The enforceability column is a CEILING on this, not the bar — conf-3 must confirm the SEAM is reachable, not merely that the class is not `model`."
status       = "open"
target       = 32.0
direction    = "higher_is_better"
kill         = "< 25 => the ~85% model-free premise was wrong. Re-scope GR to FULL and state it; do not discover this at case 20."
instrument   = '''python3 - <<'PY'
import tomllib
e = tomllib.load(open("quality/requirements-enforceability.toml", "rb"))
print(sum(1 for k, v in e.items()
          if k.startswith("GR-") and v in ("cli", "desktop", "structural")))
PY'''

[[bar]]
id           = "the-number-is-not-farmed"
one_line     = "Mapped count and mutation-survival rate do not rise together"
derives_from = "Goodhart, and the reason no headline percentage is published anywhere. The report is FOUR NUMBERS, NEVER ONE: passed / failed / could-not-judge / never-ran, summing to 625. never-ran starts at 342 and the report leads with it. '91% conformant' is the artifact most likely to outlive its caveats."
status       = "open"
target       = 0.0
direction    = "near_zero"
kill         = "Both rising => freeze the mapped count and spend the next slice on controls only."
