title  = "week two - snapshot at seal, clientID bound to the roster key, and the doc ships by `svrn ring deploy`"
status = "open"
demo   = "D5"
moves  = []
note   = "The three things week one names and defers: a snapshot act via yrs `encodeStateAsUpdate` at seal (compaction); binding the self-asserted Yjs clientID and awareness payload to the roster key at act validation and at live-lane ingress (the one piece of code the shelf does not supply; enables trustworthy per-character attribution); and distribution through ra-10's signed registry entry instead of copying the folder. Names no bar yet - declare before drafting."
