note   = "Order ring-doc-week1. Six working days; the one daemon line on the record path (append nudges ring-sync) and one ephemeral push route are the daemon work; the page is Yjs + Tiptap + y-protocols awareness with a ~50-line adapter. Preempts the funded ra-4 by a week (operator, 2026-09-17). NOT in this rung: iroh-gossip, snapshot/compaction, the phone, the deploy verb, clientID-to-roster binding, MLS."

[[rung]]
