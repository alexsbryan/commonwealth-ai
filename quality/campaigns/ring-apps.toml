# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
#
# ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is the
# committed artifact: the `[[rung]]` table owns rung STATUS and the `[[bar]]`
# rows own the numbers. The rationale lives in campaign.md.
id        = "ring-apps"
objective = "A way to BUILD robust applications and DISTRIBUTE them on a mesh the way AWS lets a builder ship to the internet - identity, an ordered log, a doc, blobs, a live lane, a stream, discovery, availability and a deploy verb handed out as primitives the app never re-derives - such that the end user barely feels the infrastructure: an average urban person joins by one QR code with no account, lives on the ring apps for a fortnight - the feed, the album, movie night, a game, a shared doc, a jam, a call, a reshare, the offline atlas, and the expenses as the boring thing they should be - and on day fourteen does not want Instagram, Docs, Spotify and the group chat back. Organised by primitive and abstraction layer; the ladder is APPLICATION-LED with the hardest apps first, because a hard app is what bends an abstraction before it sets"
spec      = "docs/internal/RING_APPLICATIONS.md (GITIGNORED, per-host; ABSENT on the Halo as of 2026-09-17). REFRAMED 2026-09-17 by operator direction in two steps: first the AWS-shaped builder proposition + the fortnight, then the re-cut from a co-op bulletin board to social, media, play and collaborative docs, hardest first. The rationale, the fortnight by day, and the ambiguity policy live in .sovereign/features/ring-apps/campaign.md on this host; the layer and rung tables below are the committed structure, and quality/campaigns/ring-apps-shelf.md is the committed INVENTORY (ARCH 11: it outranks the plan) - every `shelf` field and every SHELF sentence below cites it, and an order under any rung reads the row there before it prices a build."
declared  = "2026-09-13"
status    = "active"

# ── THE LAYERS, bottom up ────────────────────────────────────────────────────
# L0 transport   iroh 1.0.2 endpoint, relay, TrafficClass seams. Exists; no rung.
# L1 bytes       how bytes move: journal | blob | gossip | stream. The axis a
#                substrate row RIDES.
# L2 substrate   what a builder reaches for, named by the thing they already
#                know. Each row rides one L1 primitive.
# L3 deployment  manifest + page over rails + `svrn ring deploy` + the grant.
# L4 application the reference apps. NOT rows here - they are RUNGS, because
#                an app is what a person watches and a primitive is what lands
#                underneath it.
#
# DATA, not prose (ARCH 9). Readers (co-resume/co-ladder/co-lineage) use
# .get() on rows, so these tables are inert to them (checked 2026-09-17).
# `shelf` names what we pull off the shelf for the row (verdicts and citations:
# quality/campaigns/ring-apps-shelf.md, verified 2026-09-17 - re-check before an
# order cites a version). `status` is a closed set - landed | partial | open - and is the ONLY field
# that says whether a row exists in code (journal is landed by the rail crates
# with no rung of its own). `landed_by` names the rung that lands the row;
# `pulled_by` the app rungs that force its shape. A row with status open and
# a non-empty pulled_by is a primitive an app is waiting on - the frontier.

