# ── THE PREDICATE ────────────────────────────────────────────────────────────
# TWO-SIDED since the 2026-09-17 reframe, and the BUILDER side is the one a
# program judges. The user side (the fortnight) is the demo gate in campaign.md.
# `check` today decides only the record leg - the rail's own tests, which hold
# the two refusals ra-1 depends on (a roster row resolves to its warrant; an op
# arriving over the wire moves no roster). The diff-free-build leg and the
# partition drill are OWED instruments and read could-not-judge until they
# exist; nothing here fabricates a verdict for them (ARCH 5, ARCH 6).
[predicate]
statement = "A ring app is a manifest plus a static page over the rails: a builder who is not the rail's author ships the next reference app from the docs with zero diffs under commonwealth/crates/commonwealth-rail*, distributes it with one verb, and it survives the partition drill; every surface a joined person touches renders a person, never a key; and the two ra-1 refusals hold - a roster key resolves to the signed op that introduced it and its signer, and an `Introduce` arriving over ring-sync changes no roster row"
check     = "./scripts/sovereign-test.sh --human --package commonwealth-rail --package commonwealth-rail-core"

