# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
#
# ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is the
# committed artifact: the `[[rung]]` table owns rung STATUS and the `[[bar]]`
# rows own the numbers. The rationale lives in campaign.md.
id        = "ring-apps"
objective = "A way to BUILD robust applications and DISTRIBUTE them on a mesh the way AWS lets a builder ship to the internet - identity, an ordered log, blobs, a live lane, discovery, availability and a deploy verb handed out as primitives the app never re-derives - such that the end user barely feels the infrastructure: an average urban person joins by one QR code with no account, lives on the ring apps for a fortnight, and on day fourteen does not want the old way back. The first rungs made the NAMESPACE half honest (a person traces to who vouched and on what act); the ladder now converges on the complete primitive set, sequenced by the day a person hits each thing"
spec      = "docs/internal/RING_APPLICATIONS.md (GITIGNORED, per-host) - the vision, the borrow-and-refuse table, and the substrate assessment S1-S8. Its first draft claimed rings were mesh-wide and singular; that was the exception generalised into the rule and is corrected in the doc under 'What a ring is today'. Read the CORRECTED section, not a memory of the claim. REFRAMED 2026-09-17 by operator direction (the AWS-shaped builder proposition + the fortnight); the rationale, the demo days and the ambiguity policy live in .sovereign/features/ring-apps/campaign.md on this host."
declared  = "2026-09-13"
status    = "active"

