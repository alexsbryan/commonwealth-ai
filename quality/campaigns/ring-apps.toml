instrument_note = "`svrn ring roster show --why` over a roster seeded with BOTH a same-person link and a cross-person vouch, resolved against a real admission. Distinctness is computed via `person_for`, never read off the op - the op's `person` field is what the WRITER claims and is exactly the field ARCH §18.1 says not to assert on."
goodhart     = "1.0 over a roster holding only cross-person vouches is a constant function scoring perfectly. Seed both classes. And a self-vouch (signer key == introduced key) must still render `SelfVouch`, unchanged (introduce.rs:249-253) - this bar adds a class, it does not relax one."
status       = "open"

[[bar]]
id           = "ra-recovery-names-m-people"
demo         = "Alex's phone died; the replacement key shows three housemates by name, and 'Alex' on every past expense is untouched"
rung         = "ra-5"
one_line     = "CLAIM: a key admitted as a RECOVERY carries m or more vouches that resolve to m DISTINCT PEOPLE, and a person's earlier ops fold identically before and after the recovery"
derives_from = "the largest code change in the rung, and the first draft did not acknowledge it: `Roster.vouches` is `BTreeMap<String, Vouch>` - exactly one vouch per key (lib.rs:188); `bind_key` takes `Option<Vouch>`, singular (lib.rs:206); `svrn ring roster add` takes one `--on <op-id>` (sovereign-cli-llm/src/ring_cmd/mod.rs:313-322). m-of-n needs the field to become a collection and `trace`/`trace_op` (introduce.rs:274, :310) to return per-vouch statuses. Nothing today checks that two introducers are different PEOPLE (worker finding 2026-09-17): distinctness is `person_for(by_actor)`, computed, asserted."
floor        = 1.0
floor_basis  = "structural: FRACTION of rows marked recovered whose vouches resolve, via `person_for`, to at least m distinct people, where m is the ring's declared quorum (default 1 for a house; a ring raises it in its own config). AND the reference app's balances over the same acts are byte-identical before and after the row is added - the no-re-division test (ring_cmd/templates/expenses.test.mjs:120-128) re-run unchanged with a recovery in the roster."
target       = 1.0
direction    = "higher_is_better"
# instrument   = (none yet) — owed.
instrument_note = "seed three introductions for one new key from three keys belonging to three people, and a control of three introductions from three keys belonging to ONE person (three laptops). The first resolves recovered; the second resolves to one person and does not meet m=3. A run without the control has not shown that people are counted rather than keys."
goodhart     = "three laptops of one person is one person. A quorum satisfied by keys rather than people is the Sybil hole the pasted design names as the main attack on bigger scrip systems, and known membership is only a defence if the count is over PEOPLE. Also: the derived-roster namespaces refuse `roster add` and `ring introduce` today (`refuse_derived_roster`, ring_cmd/mod.rs:149) and must refuse the recovery verb too, or ra-5 reopens the hole §7.1 closed."
status       = "open"

[[bar]]
id           = "ra-retired-key-is-refused"
demo         = "The old laptop cannot sign any more, and everything it signed before still counts"
rung         = "ra-5"
one_line     = "CLAIM: ops under a retired key at seq > retired_at are reported as a gap and never admitted, and ops at seq <= retired_at are admitted exactly as before"
derives_from = "admission holds the roster as a parameter and has `op.actor` and `op.kind.seq` in hand at the membership check (commonwealth-rail-core/src/admit.rs:339, :349) and implements no seq-bounded membership of any kind - grep for retire/revoke/expire/since finds only Seal prose. Retirement is therefore ROSTER METADATA on the row (retired_at seq), operator-written like every roster fact, consulted by admit - and NOT an op: an act that changes what admission admits is the rail learning meaning, which introduce.rs:33-38 refuses, and it makes membership a function of the log, which lib.rs:151-160 refuses and the no-re-division test pins. NOT `Seal` either: a seal retires the signer's OWN history BEFORE its seq and cannot name another key (lib.rs:265-282, sync.rs:115-122) - the opposite direction on both axes."
floor        = 0.0
floor_basis  = "structural: COUNT of ops admitted whose actor is retired in the roster and whose seq exceeds that key's retired_at. Zero, as a new `RailGap` variant (name it `RetiredSigner`; `Retire` and `Recovery` are free nouns, converge-checked 2026-09-17) - membership and authenticity are the rail's half of the cut (lib.rs module docs) so a gap variant is legitimate where an act variant is not."
target       = 0.0
direction    = "near_zero"
# instrument   = (none yet) — owed.
instrument_note = "one actor, two ops: seq 3 before retirement and seq 4 after, retired_at = 3. The run must show seq 3 ADMITTED and seq 4 in the gap list under the new variant, with the test watched failing before the variant exists (ARCH 5). Then `compact`/sealed floors re-run unchanged, because retirement must not move where hole-reporting begins (admit.rs:404-416)."
goodhart     = "zero is the expected good result and proves nothing alone (ARCH 5): a retired key that never signed anything scores zero perfectly. The same run must carry the positive control - the pre-retirement op admitted and folded. And a retirement that also dropped the key's EARLIER ops would re-divide history, which is the exact failure the roster/op-set separation exists to prevent."
status       = "open"

