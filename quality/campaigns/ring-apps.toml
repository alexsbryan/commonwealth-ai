# declares one row; the campaign converges when every row a reference app needs
# has a rung that landed. DATA, not prose (ARCH 9): adding a primitive is a diff
# a reviewer reads. Readers use .get() on rows, so this table is inert to
# co-resume/co-ladder/co-lineage (checked 2026-09-17).
