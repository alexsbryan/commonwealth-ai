# ── THE PREDICATE ────────────────────────────────────────────────────────────
# TWO-SIDED since the 2026-09-17 reframe, and the BUILDER side is the one a
# program judges. The user side (the fortnight) is the demo gate in campaign.md.
# `check` today decides only the record leg - the rail's own tests, which hold
# the two refusals ra-1 depends on (a roster row resolves to its warrant; an op
# arriving over the wire moves no roster). The diff-free-build leg and the
# partition drill are OWED instruments and read could-not-judge until they
# exist; nothing here fabricates a verdict for them (ARCH 5, ARCH 6).
[predicate]
statement = "A ring app is a manifest plus a static page over the rails: a builder who is not the rail's author ships the next reference app from the docs with zero diffs under commonwealth/crates/commonwealth-rail*, distributes it with one verb, and it survives the partition drill; every surface a joined person touches renders a person, never a key; and the two ra-1 refusals hold - a roster key resolves to the signed op that introduced it and its signer, and an `Introduce` arriving over ring-sync changes no roster row"
check     = "./scripts/sovereign-test.sh --human --package commonwealth-rail --package commonwealth-rail-core"

# ── BARS ─────────────────────────────────────────────────────────────────────

[[bar]]
id           = "ra-introduction-is-traceable"
demo         = "Ask why Alex is in this ring and get a name, an op id and a date"
rung         = "ra-1"
one_line     = "CLAIM: every roster row added through the introduction path resolves to a signed op by a member the ring already claimed"
derives_from = "`Roster` is `BTreeMap<Person, Vec<String>>` (commonwealth-rail-core/src/lib.rs:160) - a name and some keys, with no record of who vouched, on what, or when. A key is in the ring because somebody typed `svrn ring roster add`, and the reason lives in that person's memory. SPKI/SDSI (Rivest and Lampson, 1996) is the formalism this restores: linked local names, resolved by following local bindings, with no global registry."
floor        = 1.0
floor_basis  = "structural: FRACTION of roster rows written through the new path whose warrant names an op id that (a) exists in that ring's journal, (b) verifies under a key the roster already claimed at the time, and (c) is an `Introduce`. All three, or the row is untraceable and counts against."
target       = 1.0
direction    = "higher_is_better"
# instrument   = (none yet) — co-lineage EXECS this field, so prose here would be
#   run as bash. Absent is the honest state: `could-not-judge reason=instrument-missing`,
#   not a fabricated verdict. Owed: a verdict-emitting command in the shape of
#   ra-4's `scripts/ring-offers-demo.sh verdict <bar-id>`.
instrument_note = "a test that writes an introduction, admits a key on it, and resolves the row back to the op and the signer. Plus the back-compat leg: a `roster.json` written before this rung has rows with NO warrant, and those must read as warrant-unknown rather than failing to parse - a migration that turns every existing ring into a parse error is not back-compatible, it is an outage."
goodhart     = "1.0 over one row proves nothing, and 1.0 is also what you measure when the warrant field is present but the op id resolves to nothing - the check must RESOLVE the op, not merely find a string. A verdict citing only the affirmative leg is reporting half the predicate; ra-roster-stays-independent must be at target in the same run."
status       = "open"

[[bar]]
id           = "ra-roster-stays-independent"
demo         = "A peer sends an introduction and nothing in my ring changes until I say so"
rung         = "ra-1"
one_line     = "CLAIM: roster mutations caused by an arriving op = 0, and the pinned no-re-division property still holds"
derives_from = "two refusals already in the code. `sovereign-mesh/src/ring_roster.rs` module docs: 'The roster is written from here and is not reachable from the rail at all. There is no roster route, so a deployed app cannot add a key to the ring - including its own.' And `rail-core/src/lib.rs:152-159`: the roster is deliberately NOT a function of the op set, pinned by a test in the reference app, because a roster that moved with the log would re-divide every past expense the day a housemate moves in."
floor        = 0.0
floor_basis  = "structural: COUNT of roster rows added, removed or changed as a consequence of an op being admitted, gossiped or synced. Zero, and it is a property of the route set rather than of a check somebody remembered - there is no roster route, and this rung must not create one."
target       = 0.0
direction    = "near_zero"
# instrument   = (none yet) — co-lineage EXECS this field, so prose here would be
#   run as bash. Absent is the honest state: `could-not-judge reason=instrument-missing`,
#   not a fabricated verdict. Owed: a verdict-emitting command in the shape of
#   ra-4's `scripts/ring-offers-demo.sh verdict <bar-id>`.
instrument_note = "the negative leg is the load-bearing one and it must be watched failing: a peer appends an `Introduce` naming a key nobody claims, ring-sync carries it, and the receiving node's `roster.json` is byte-identical afterwards. Plus the reference app's existing no-re-division test, re-run unchanged."
goodhart     = "zero is the expected good result and proves nothing alone (ARCH 5, 72b3ab47 - a zero count is not a positive control). The same run must show the introduction ARRIVING and being READABLE, or the bar has only demonstrated that nothing happened. An `Introduce` that no peer ever sent scores zero perfectly."
status       = "open"

[[bar]]
id           = "ra-offers-catalogue-computed"
demo         = "One command, and the neighbours who did not answer are named rather than missing"
rung         = "ra-4"
one_line     = "CLAIM: on a two-node mesh a caller holding no credential gets a SERVED row from the peer's offer origin and a NEVER_ASKED row naming a node that publishes none, in the same response"
derives_from = "`origin_fanout` is already generic over the kind - `POST /v1/mesh/fanout` takes it and the media route is the same handler with the field defaulted (sovereign-mesh/src/origin_fanout.rs:33-39). `OriginKind` (oicp-types/src/origin.rs:26) is the closed set that must gain a third variant, and it carries noun/viewer_verb/how_to_offer per variant so the refusals read correctly - the 2026-09-12 defect where every app refusal said `media origin` is what that shape exists to prevent."
floor        = 1.0
floor_basis  = "structural: BOTH rows present in one response, or the bar is not met. A served row proves the origin is reachable; a never_asked row carrying the refusal proves the catalogue reports its own incompleteness, which is the property no marketplace has and the whole reason for the rung."
target       = 1.0
direction    = "higher_is_better"
instrument   = "scripts/ring-offers-demo.sh verdict ra-offers-catalogue-computed"
timeout_s    = 420
instrument_note = "FOUR throwaway daemons on one host, one mesh, real iroh, no credential on the caller - the house-mesh predicate's shape. It reads the FANOUT ROWS out of `svrn mesh offers --json`, never a reachability probe: `hm-no-shared-credentials` records that `library.py check` passed against an UNAUTHENTICATED path while every catalogue fetch 401'd. Value is 1.0 only when the SAME response carries a served 2xx row AND a never_asked row whose reason names an OFFER origin and whose node id is a real member - a row about nobody, which is what naming a peer that does not exist produces, does not count."
goodhart     = "a never_asked row is trivially produced by naming a peer that does not exist, and a served row by an origin that answers 200 to anything. The pair must be the SAME response over REAL nodes: one that published an offer origin and one that did not. A caller that is also the seller proves nothing - `origin_fanout` never asks this node (origin_fanout.rs:22-25), so a catalogue can only come from a peer."
status       = "open"

[[bar]]
id           = "ra-seller-carries-their-vouch"
demo         = "Ask who these sellers are and get the person who vouched for each"
rung         = "ra-4"
one_line     = "CLAIM: every seller row resolves to its roster vouch or renders warrant-unknown - never blank, never substituted"
derives_from = "the ra-1 join. `Roster.vouches` and `trace` landed 2026-09-13 (commonwealth-rail-core/src/introduce.rs:274); this is the first surface that READS them for somebody other than the operator, and it is the sentence no marketplace can say."
floor        = 1.0
floor_basis  = "structural: FRACTION of seller rows in a catalogue rendering either a resolved vouch (person, op id, date) or an explicit warrant-unknown. Blank is a failure and a substituted local answer is a worse one."
target       = 1.0
direction    = "higher_is_better"
instrument   = "scripts/ring-offers-demo.sh verdict ra-seller-carries-their-vouch"
timeout_s    = 420
instrument_note = "The same four daemons, `svrn mesh offers --why`. ONE run containing BOTH a seller whose vouch resolves to a named person and an op, and a seller whose row predates the vouch field and renders unknown - the harness seeds exactly that mixture, because a uniform run cannot distinguish a working join from a stuck one. Value is the fraction of seller rows carrying a vouch line that is either resolved or an explicit warrant-unknown; a BLANK line counts against. The goodhart guard is in the instrument: a run with ZERO resolved rows scores 0.0 however tidy it looks."
goodhart     = "1.0 with every row reading `unknown` is a perfect score for a join that never ran. At least one row must name a person and an op id. And per the ra-1 worker's finding, a caller must never fall back to its OWN roster file for a remote seller's warrant - that is the substitution ARCH 6 refuses, and `ring roster show` already guards the local version of it by warning and exiting 1."
status       = "open"

[[bar]]
id           = "ra-linked-device-is-legible"
demo         = "Alex's second laptop reads as Alex's, linked by Alex - not vouched for by a stranger"
rung         = "ra-5"
one_line     = "CLAIM: every roster row whose introducer is the same PERSON renders 'linked device', and every row whose introducer is another person renders 'vouched by <name>' - never the wrong one, never blank"
derives_from = "the mechanism already exists and is pinned: a key in the roster introducing a second key for the same person resolves to `Traced` today (commonwealth-rail-core/src/introduce.rs:191-193, asserted at tests_introduce.rs:256-259). What is missing is the SURFACE: the roster has no per-key metadata beyond one vouch (lib.rs:170, :188), and nothing computes whether `by_actor` belongs to the row's own person - `trace_op` compares keys only (introduce.rs:338), so same-person vs other-person is a distinction no reader makes today (verified 2026-09-17)."
floor        = 1.0
floor_basis  = "structural: FRACTION of roster rows with a resolved vouch whose rendering matches `roster.person_for(by_actor) == row.person` - 'linked device' when equal, 'vouched by' when not. Both classes seeded in one run, because a run with only one class cannot tell a working classifier from a constant."
target       = 1.0
direction    = "higher_is_better"
# instrument   = (none yet) — owed in the shape of ra-4's `scripts/ring-offers-demo.sh verdict <bar-id>`.
instrument_note = "`svrn ring roster show --why` over a roster seeded with BOTH a same-person link and a cross-person vouch, resolved against a real admission. Distinctness is computed via `person_for`, never read off the op - the op's `person` field is what the WRITER claims and is exactly the field ARCH §18.1 says not to assert on."
goodhart     = "1.0 over a roster holding only cross-person vouches is a constant function scoring perfectly. Seed both classes. And a self-vouch (signer key == introduced key) must still render `SelfVouch`, unchanged (introduce.rs:249-253) - this bar adds a class, it does not relax one."
status       = "open"

[[bar]]
id           = "ra-recovery-names-m-people"
demo         = "Alex's phone died; the replacement key shows three housemates by name, and 'Alex' on every past expense is untouched"
rung         = "ra-5"
one_line     = "CLAIM: a key admitted as a RECOVERY carries m or more vouches that resolve to m DISTINCT PEOPLE, and a person's earlier ops fold identically before and after the recovery"
derives_from = "the largest code change in the rung, and the first draft did not acknowledge it: `Roster.vouches` is `BTreeMap<String, Vouch>` - exactly one vouch per key (lib.rs:188); `bind_key` takes `Option<Vouch>`, singular (lib.rs:206); `svrn ring roster add` takes one `--on <op-id>` (sovereign-cli-llm/src/ring_cmd/mod.rs:313-322). m-of-n needs the field to become a collection and `trace`/`trace_op` (introduce.rs:274, :310) to return per-vouch statuses. Nothing today checks that two introducers are different PEOPLE (worker finding 2026-09-17): distinctness is `person_for(by_actor)`, computed, asserted."
floor        = 1.0
floor_basis  = "structural: FRACTION of rows marked recovered whose vouches resolve, via `person_for`, to at least m distinct people, where m is the ring's declared quorum (default 1 for a house; a ring raises it in its own config). AND the reference app's balances over the same acts are byte-identical before and after the row is added - the no-re-division test (ring_cmd/templates/expenses.test.mjs:120-128) re-run unchanged with a recovery in the roster."
target       = 1.0
direction    = "higher_is_better"
# instrument   = (none yet) — owed.
instrument_note = "seed three introductions for one new key from three keys belonging to three people, and a control of three introductions from three keys belonging to ONE person (three laptops). The first resolves recovered; the second resolves to one person and does not meet m=3. A run without the control has not shown that people are counted rather than keys."
goodhart     = "three laptops of one person is one person. A quorum satisfied by keys rather than people is the Sybil hole the pasted design names as the main attack on bigger scrip systems, and known membership is only a defence if the count is over PEOPLE. Also: the derived-roster namespaces refuse `roster add` and `ring introduce` today (`refuse_derived_roster`, ring_cmd/mod.rs:149) and must refuse the recovery verb too, or ra-5 reopens the hole §7.1 closed."
status       = "open"

[[bar]]
id           = "ra-retired-key-is-refused"
demo         = "The old laptop cannot sign any more, and everything it signed before still counts"
rung         = "ra-5"
one_line     = "CLAIM: ops under a retired key at seq > retired_at are reported as a gap and never admitted, and ops at seq <= retired_at are admitted exactly as before"
derives_from = "admission holds the roster as a parameter and has `op.actor` and `op.kind.seq` in hand at the membership check (commonwealth-rail-core/src/admit.rs:339, :349) and implements no seq-bounded membership of any kind - grep for retire/revoke/expire/since finds only Seal prose. Retirement is therefore ROSTER METADATA on the row (retired_at seq), operator-written like every roster fact, consulted by admit - and NOT an op: an act that changes what admission admits is the rail learning meaning, which introduce.rs:33-38 refuses, and it makes membership a function of the log, which lib.rs:151-160 refuses and the no-re-division test pins. NOT `Seal` either: a seal retires the signer's OWN history BEFORE its seq and cannot name another key (lib.rs:265-282, sync.rs:115-122) - the opposite direction on both axes."
floor        = 0.0
floor_basis  = "structural: COUNT of ops admitted whose actor is retired in the roster and whose seq exceeds that key's retired_at. Zero, as a new `RailGap` variant (name it `RetiredSigner`; `Retire` and `Recovery` are free nouns, converge-checked 2026-09-17) - membership and authenticity are the rail's half of the cut (lib.rs module docs) so a gap variant is legitimate where an act variant is not."
target       = 0.0
direction    = "near_zero"
# instrument   = (none yet) — owed.
instrument_note = "one actor, two ops: seq 3 before retirement and seq 4 after, retired_at = 3. The run must show seq 3 ADMITTED and seq 4 in the gap list under the new variant, with the test watched failing before the variant exists (ARCH 5). Then `compact`/sealed floors re-run unchanged, because retirement must not move where hole-reporting begins (admit.rs:404-416)."
goodhart     = "zero is the expected good result and proves nothing alone (ARCH 5): a retired key that never signed anything scores zero perfectly. The same run must carry the positive control - the pre-retirement op admitted and folded. And a retirement that also dropped the key's EARLIER ops would re-divide history, which is the exact failure the roster/op-set separation exists to prevent."
status       = "open"

# ── THE LADDER ───────────────────────────────────────────────────────────────

[[rung]]
id     = "ra-1"
primitive = "identity"
title  = "ring-1-introduce: a roster row carries its warrant, and an act is the evidence"
status = "open"
demo   = "D1"
moves  = ["ra-introduction-is-traceable", "ra-roster-stays-independent"]
note   = "S1 + S2 from RING_APPLICATIONS.md, landed together: provenance with nothing to populate it is a field nobody fills, and an act with nowhere to land is a payload nobody reads. SAME-RING ONLY — cross-ring introduction needs S3 and the Carry vocabulary."

[[rung]]
id     = "ra-4"
primitive = "discovery"
title  = "an Offer origin kind, the computed catalogue, and the vouch join"
status = "open"
demo   = "D4"
moves  = ["ra-offers-catalogue-computed", "ra-seller-carries-their-vouch"]
note   = "S6, FUNDED 2026-09-13 and lands NEXT despite the id — ids are identity, not position. Promoted ahead of ra-2 because ra-1's worker found the campaign's byproduct stop condition unmet: an Introduce cannot ride a transaction when no transaction act exists, so `svrn ring introduce` is the separate civic act the spec named as the PGP failure mode. This rung builds the first transaction vocabulary, which is what an introduction can later be a byproduct OF. Building Carry (ra-2) on an attestation nobody writes would be building on the rot."

[[rung]]
id     = "ra-5"
primitive = "identity"
title  = "your keys survive your devices - linked devices legible, recovery by m people, retired keys refused"
status = "open"
demo   = "D5"
moves  = ["ra-linked-device-is-legible", "ra-recovery-names-m-people", "ra-retired-key-is-refused"]
note   = "The pick on 2026-09-17 for what an END USER feels most: a house on this for a year loses a laptop with certainty, and 'no password reset' is the failure that makes key-based systems unusable by ordinary people; every local-first tool that solves it does so with a server holding the recovery. Sequenced after ra-4 because it reuses the trace join. Three corrections from the citation pass shape it: linking is landed and only needs a surface; recovery needs `vouches` to become a collection; retirement is roster metadata read by admit, never an op and never Seal."

[[rung]]
id     = "ra-2"
primitive = "membership"
title  = "standalone op verification, and Carry across rings"
status = "open"
demo   = "D2"
moves  = []
note   = "S3. DEFERRED behind ra-4, see that rung's note. Verify a foreign op's signature and derived id without holding the foreign roster, then Carry it into this ring under the carrier's own key. Names no bar yet — declare one before drafting the order."

[[rung]]
id     = "ra-3"
primitive = "content"
title  = "blob distribution - encrypt, code k-of-n, tier hot copies, audit by range; the bytes an act references"
status = "open"
demo   = "D3"
moves  = []
note   = "S5. Independent of ra-1/ra-2/ra-5 and can run in parallel with a different pair of hands. Inventory 2026-09-17 says the earlier note was understated: a photo cannot be referenced by a ring act AT ALL today - the rail has no blob/attachment noun, `Payload` is capped at 64 KiB precisely to refuse files (rail-core/src/payload.rs:55-61), `iroh-blobs` is absent from Cargo.lock, and no erasure code exists anywhere. NEW, on existing seams: `TrafficClass::ModelTransfer` is the declared iroh-blobs slot (TRANSPORT_MIGRATION.md:393, :530 - for GGUFs, a different question, reusable as the transport seam) and model_files.rs already parses RFC-7233 ranges and serves 206 with a whole-file X-Sha256 (:189-195, :273-308) - a RANGED verification hash is the genuinely new part. Recipe: encrypt on device before coding (coding is not secrecy - k-1 shares leak); one share per member; hot full copies on keepers, more for recent items; repair only after a member has been absent past a stated window. k is MEASURED from the worst observed hour, not the average, and no presence history exists today (MemberRecord.last_seen is a single LWW scalar, commonwealth-core/src/mesh/mod.rs:207) - a sampler is owed BEFORE k can be declared; until then the guarantees sheet renders k as could-not-judge. NOUN: `Share` sits inside the shared-model kin family (SharedModelFleet etc.) - converge a different word. Names no bar yet; the first to declare is the negative leg: with n-k members offline the blob still fetches, and with n-k+1 it reports NOT HELD rather than hanging."

[[rung]]
id     = "ra-6"
primitive = "live"
title  = "the live lane - presence and chat delivery in under a second, nothing durable on it"
status = "open"
demo   = "D6"
moves  = []
note   = "The rail syncs by digest with a 60s ceiling on idleness (sovereign-mesh/src/ring_sync.rs:87, :19-24) and cannot carry chat. The old 10s full-snapshot push is GONE (deleted at cw-lift 2e; gossip.rs:22-37) and `/internal/ring/sync` is pinned as the ONE sender of replicated state by tests/main/replication_sender_census.rs - so a live lane must be PROVABLY non-durable or it trips that census, which is the structural version of the line this rung draws: gossip is ephemeral, the rail is the record. NEW: `iroh-gossip` is absent (the one hit is a test mock, commonwealth-transport/src/routed.rs:312); nearest existing thing is the `TrafficClass::Gossip` seam plus `announce_presence_change`'s event-driven push-to-all (gossip.rs:925-970), which carries DURABLE membership and is not pub-sub. One topic per ring; message HISTORY is ordinary rail acts of kind `message`. `Presence` bare noun is free (kin: PresenceChange). Ahead of ra-3 because chat is what a person touches every hour. Names no bar yet - the negative leg to declare first: a message that only ever rode gossip is NOT in the history, and the census stays green."

[[rung]]
id     = "ra-7"
primitive = "availability"
title  = "the keeper role - an always-on member that holds the journal and blobs and never authors"
status = "open"
demo   = "D7"
moves  = []
