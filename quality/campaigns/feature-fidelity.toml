# Flight rules — read raw. Verdicts come from measurement rows
# (~/.sovereign/comaintainer/bar-measurements.jsonl), never from prose here.
# The ladder, loop tiers and sequencing live in the campaign doc named by `spec`.
id        = "feature-fidelity"
objective = "RAPTOR, GLiNER and the declared ontology each either win on the question class they exist for, implemented faithfully to their reference and checked cheapest-first, or ship default-off with their claims withdrawn"
spec      = ".sovereign/features/feature-fidelity/campaign.md (Loop tiers, Ladder, Sequencing); research/ontology-retrieval/PRE-REG-custom-ontology-and-raptor-2026-09-17.md (study 1, whose method this supersedes)"
declared  = "2026-10-02"
status    = "active"

[predicate]
statement = "Each of fi-raptor-whole-work, fi-ontology-list and fi-gliner-declared-labels reads met on its newest measurement row, or DEFAULTS_LEDGER.md carries a row whose ### heading names that bar id (the feature shipped default-off). A mention in prose is not a row: until 2026-10-03 any substring counted, and a paragraph naming fi-ontology-list as an owed measurement read as ledgered."
check     = '''python3 - <<'PY'
import json, pathlib, sys
rows = [json.loads(l) for l in (pathlib.Path.home() / ".sovereign/comaintainer/bar-measurements.jsonl").read_text().splitlines() if l.strip()]
heads = [l for l in pathlib.Path("docs/DEFAULTS_LEDGER.md").read_text().splitlines() if l.startswith("### ")]
ok = True
for bar in ("fi-raptor-whole-work", "fi-ontology-list", "fi-gliner-declared-labels"):
    mine = [r for r in rows if r.get("campaign") == "feature-fidelity" and r.get("bar") == bar]
    met = bool(mine) and mine[-1].get("verdict") == "met"
    row = any(f"`{bar}`" in h for h in heads)
    print(f"{bar}: {'met' if met else 'ledger' if row else 'OPEN'}")
    ok &= met or row
sys.exit(0 if ok else 1)
PY'''

