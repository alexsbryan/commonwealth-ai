one_line     = "The corpus states what it cannot answer, and coverage grows by evidence"
derives_from = "FINANCIAL_CORPORA.md §4 F5"
status       = "open"
# RATIFIED 2026-08-17 (directive 0c042797): the 24/503 mapped-ratio was
# DROPPED as the wrong measurement (~70% of the 479 unmapped tags are >34-char
# footnote minutiae; dimensional tags are unattainable by construction). This
# instruments the bar's FIRST clause, structurally: the corpus STATES what it
# cannot answer — the coverage block the M3 card derives from is present, its
# counts are consistent (covered + unmapped == total), and the
# consolidated_only source limit is disclosed. Boolean: 1.0 or 0.0.
# DELIBERATELY PROVISIONAL: the real F5 is the second clause — fixable misses
# over total asks, trending to zero, consolidated_only misses EXCLUDED from
# the denominator (a source limit to disclose, never a gap to close). That
# needs the demand-side miss count (resolve_concept, Rust) and is folded into
# order sec-filings-ship; the cheapest form parses the existing UnmappedConcept
# tracing from logs a run already produced — no new store, no new cadence.
target       = 1.0
direction    = "higher_is_better"
instrument   = '''python3 - <<'PY'
import json, os, sys
p = os.path.expanduser("~/.svrnmesh/indexes/sec-cik0000320193/sec_facts.json")
if not os.path.exists(p):
    sys.exit(3)  # artifact absent, named by exit code
c = json.load(open(p)).get("coverage") or {}
ok = (all(k in c for k in ("filer_tags_total", "covered_tags",
                           "unmapped_tags", "consolidated_only"))
      and c["covered_tags"] + c["unmapped_tags"] == c["filer_tags_total"])
print(json.dumps({"value": 1.0 if ok else 0.0, "artifact": p}))
PY'''

