# ── THE COMMAND CENSUS — measured 2026-09-09, and it resizes the project ────
#
# 263 `#[tauri::command]` in sovereign-desktop (authoritative list:
# src/lib/commands.generated.ts, which command_surface.rs generates):
#
#     74  WIRE-BACKED           already call the daemon
#     37  APP-LOCAL sanctioned  in the closed set declared above
