# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
# Defer/descope = edit a bar's `status`; git history is the ledger.
#
# ORDERS ARE GITIGNORED (`.sovereign/features/` is per-host). This file is the
# committed artifact and the LADDER carries the rung list, so the plan survives
# without them.
id        = "sv-surface"
objective = "Sovereign's surfaces become projections over one serving stack - the desktop attaches as a pure client, the CLI is the same client in a terminal, the phone is the same client over the wire - so any capability they expose is answered by one decider, proven by the attach boot, a surface-parity sweep, and censuses that go red on a planted twin"
spec      = "the converged plan, 2026-09-08; quality/TOPOLOGY.md 3.5 + Phase 6 (the one-DRIVER bar) govern the turn half and are NOT restated here"
register  = "quality/CONCEPTS.toml"
declared  = "2026-09-08"
status    = "active"

# ── THE PREDICATE ────────────────────────────────────────────────────────────
# Added 2026-09-11, retro-fitted deliberately: this campaign IS the case that
# minted the mechanism. Every bar below was at or near target — is_attach_mode
# forks 15->0, capability twins 6->0 "HOLDING at 0", the construction census
# 14->12 — and the objective was false the whole time, because the desktop
# names sovereign-cli-daemon and sovereign-mesh directly in [dependencies].
#
# The bars are countable because an author listed the needles. The file says so
# itself at sv-attach-pure-client: "The needle list cannot see an UNLISTED new
# construction." A denominator the worker writes is a map. This denominator is
# cargo's.
#
# DIRECT EDGES ONLY, and stated so rather than discovered later: the five names
# below are what sovereign-desktop declares. The transitive closure (53 crates,
# six of which bind a listener) collapses when these go, so the direct form is
# the honest cheap check, not a weaker one wearing the same sentence.
[predicate]
statement = "sovereign-desktop depends on no crate that can assemble or host a daemon — it names none of sovereign-mesh, sovereign-cli-daemon, sovereign-compute, sovereign-workflow-host, sovereign-tools in [dependencies]"
check = "! grep -qE '^(sovereign-mesh|sovereign-cli-daemon|sovereign-compute|sovereign-workflow-host|sovereign-tools) *=' sovereign/crates/sovereign-desktop/src-tauri/Cargo.toml"


# ── THE CLAIM ───────────────────────────────────────────────────────────────
#
# Turns already landed the destination shape: ONE driver (`serve_turn`), with
# `TurnSink` for in-process hosts and `sovereign-turn-client` for
# out-of-process ones (`TURN_EXECUTION_SITES` 18 -> 6, TOPOLOGY Phase 6 waves
# 1-3). The defect that remains is CAPABILITY-shaped: deciders the CLI and the
# desktop each carry a private copy of, and an attach-mode desktop that
# assembles a full private stack (`state.rs` constructs a CorpusEngine, a
# Runtime over `build_attach_provider`'s remote provider, a store handle, a
# LocalCorpusManager...) so the same question can answer differently depending
# on which surface and which boot asked it.
#
# This campaign is NOT: retiring the embedded sink (sanctioned - "nothing
# requires a host to speak HTTP", TOPOLOGY Phase 6 wave 2); deciding
# sovereign-server's tenant-front fate (TOPOLOGY's open question - mobile
# rides its wire COMPATIBILITY, Phase 5c: "a client cannot tell which it
# reached"); or converting the six bench-gated harness turn-sites (18.6,
# pre-registered re-baselines, not builds).
#
# PROVEN BY THREE CONSTRUCTIONS, not by prose:
#   1. THE ATTACH BOOT - attach mode constructs zero local deciders and the
#      desktop surface suite runs green against an externally-booted daemon.
#   2. SURFACE PARITY - one fixture, both surfaces, identical answers per
#      family; mobile parity is BY CONSTRUCTION once it consumes the one
#      client family.
#   3. TWIN CENSUSES - per family, a planted second implementation turns the
#      family census red.
#
# ── THE REALIGNMENT — 2026-09-09, three operator directives ─────────────────
#
# Recorded verbatim, because each one changed the work and none is derivable
# from the code:
#
#   1. "the goal is to make the desktop, cli, and mobile all equally thin
#      clients to the same backend"
#   2. "We will accept absolutely no feature loss. We must figure out how to
#      move all existing functionality to the wire."
#   3. "This whole initiative MUST reduce code by the end"
#
# WHAT (1) CHANGES. The `is_attach_mode()` fork is not a design choice to
# weigh — it is the obstacle. There are 15 fork sites today
# (insight_commands.rs:114,145,166,184 · state.rs:295,825,1605 ·
# commands/reading.rs:226,272,363,404 · commands/conversation.rs:250,404,688,
# 714) and every rung so far ADDED to them. A branch beside a retained local
# path is additive by construction: nothing is deleted, only forked around.
# STOP ADDING FORKS. The end state is ONE path in both boot modes, where
# "Local" means the daemon happens to be in-process.
#
# MEASURED, and it reframes rung 6: `send_message_stream`
# (commands/chat.rs:100) opens with `require_runtime!` and has NO attach fork
# at all. Chat is served by the desktop's own `Runtime` in BOTH modes; attach
# differs only in that the inference provider is remote
# (state/builders/inference.rs:368). So C2 is not unwinding a fork — it is the
# FIRST conversion of the turn, and the 15 forks are all periphery.
#
# WHAT (2) CHANGES — THE ORDER. Wire coverage comes FIRST, fork removal
# SECOND. No in-process path is deleted until the capability it serves has a
# wire form. The GAP LEDGER below is that list, and it is the gate: a fork
# may come out only when its row reads DONE. The rule is structural, not
# remembered — see the `sv-no-feature-loss` bar.
#
# WHAT (3) COSTS, honestly. Directives 2 and 3 pull against each other and the
# tension is NOT yet resolved. Measured 2026-09-09 over the commits this file
# cites: +5,391 / -1,168 = NET +4,223 Rust. Only two of thirteen are negative.
# The three largest adds are all daemon-side wire being BUILT — conversation
# CRUD (+1,172), workflows (+986), the attach-boot routes (+902) — whose
# payback is entirely in the collapse that has not happened. Wire growth is
# bounded by the gap ledger; deletion is bounded by ~3,006 lines of desktop
# construction spine (state.rs + state/builders/) plus whatever the 10,764
# lines of commands shed once they stop branching. Which side wins is not
# knowable until the ledger is closed, and a session that reports a number
# before then is guessing.
#
# ── THE PROTOCOL SHAPE — two shapes, not nine ───────────────────────────────
#
# The reflex when adding nine capabilities to a wire is nine frame/reply
# pairs. Measured, they are TWO shapes. `ApprovalChannel`
# (sovereign-contracts/src/traits.rs) has six methods and `RoutingEventSink`
# (sovereign-desktop/src-tauri/src/routing_events.rs:50) has three:
#
#   PROMPT  — show a thing, PARK the executor, resolve by key:
#             request_approval -> bool · ask_user -> String ·
#             request_information -> Option<String> · clarification-request
#   NOTICE  — show a thing, return nothing:
#             emit_progress · emit_message_refined · emit_lesson_proposed ·
#             turn-narration · interpretation-proposed
#
# So the wire wants two outbound variants and one inbound, not nine pairs:
#
#   TurnFrame::Prompt  { id, prompt: Prompt }   host asks; MUST be answered
#   TurnFrame::Notice  { notice: Notice }       host tells; no answer
#   TurnRequest::Answer { id, answer: Answer }  client answers a Prompt
#
# `Prompt`/`Answer`/`Notice` are CLOSED enums over payload types that already
# exist and already derive serde (ActionPreview, InformationRequest,
# MessageRefinedPayload, LessonProposedPayload) — never a `serde_json::Value`
# with a string discriminator, which is ARCH §2's smell.
#
# THE ABSTRACTION IS NOT BEING INVENTED — it is being let out of the crate it
# already lives in. `ApprovalDesk`'s private `Pending` enum IS the Prompt/Answer
# pairing, one to one:
#     Pending::Approval(Sender<bool>)           <-> Prompt::Approval    / Answer::Approved
#     Pending::Input(Sender<String>)            <-> Prompt::UserInput   / Answer::Text
#     Pending::Information(Sender<Option<..>>)  <-> Prompt::Information / Answer::Information
# and its `resolve()` is ALREADY the single closure-owning decider — the three
# `resolve_approval`/`resolve_input`/`resolve_information` wrappers are thin
# adapters over it, and collapse to `resolve(key, Answer)`. All four hosts sit
# on the desk as of d82eaba96. The Prompt half needs NO new machinery.
#
# Verified fits, six for six, every payload already in sovereign-contracts and
# already deriving serde: ActionPreview, InformationRequest (incl.
# AcquisitionRoute), MessageRefinedPayload, LessonProposedPayload. ZERO DTO
# work. `emit_progress`'s SYNC constraint is satisfied by construction —
# `UnboundedSender::send` is sync and never blocks.
#
# TWO ADDITIONS the sketch needed:
#   * `Notice::ResolveAck { id, outcome }` — `submit_*` returns a bool today and
#     `Answer` is one-way. `ResolveOutcome` already exists as a closed enum with
#     the exact three cases and its doc already says why the bool was wrong
#     ("cannot tell 'accepted' from 'never arrived'", §18.3). It needs
#     Serialize+Deserialize. That is the whole change. It also replaces
#     `has_pending_information` with an honest after-the-fact answer.
#   * `WrongKind` SURVIVES a typed Answer — a client can still aim
#     `Answer::Approved` at a parked Information. `resolve()`'s
#     restore-on-mismatch stays exactly as it is.
#
# THREE NAMED EXCEPTIONS — ship these rather than forcing a uniform mould:
#   E1  `Notice` IS NOT INTRA-TURN. StepDone fires during the turn;
#       MessageRefined and LessonProposed fire AFTER the terminal Complete
#       (post-stream refinement; a detached capture spawn). Document Notice as
#       "on this socket, until it closes" — NOT "during the turn". Load-bearing:
#       a missing message-refined leaves the UI stuck on "Refining your answer"
#       forever (collaboration.rs records the repro). See G13.
#   E2  THE HANGUP POLICY IS PER-PROMPT-KIND. A closed socket CANCELS an
#       Approval (granting on a vanished user's behalf is the substitution C1
#       removed) but must read as SKIP for Information. `Pending::Information`'s
#       own doc already encodes this — the abstraction knows, it just has to
#       travel. Prompt needs a per-variant hangup policy, not a global one.
#   E3  LEAVE `TurnFrame::Narration` WHERE IT IS. It is the one variant with
#       real readers today (TurnObserver::on_narration, drain_turn, and
#       mobile's mirror). Folding it into Notice is a wire break for no gain.
#       Put the desktop's OTHER two routing events in as Notice variants.
#       Asymmetric, and non-breaking.
#
# WHAT THE COLLAPSE DELETES, counted: ~200 of the 264 lines in the desktop's
# approval.rs (five payload mirrors, three submit_* + has_pending_information,
# the whole impl ApprovalChannel), +30 in conversation.rs, plus ~64 lines of
# TypeScript. Concepts: three key formats -> one host-minted id; three Tauri
# submit commands -> one; SIX Tauri event names -> TWO; three resolve_* -> one;
# and the `task_id` slot itself, which exists only to stamp keys.
# sovereign-server's ExecutorEvent is a fourth mirror of the same three
# questions and converges on the payload types too.
#
# WHAT IT COLLAPSES on the desktop: three Tauri submit commands
# (submit_approval / submit_input / submit_information_response), three
# payload structs each carrying its own `key`, and three key formats become
# one id and one answer. That is the best candidate found for making
# directive (3) true.
#
# TIME-SENSITIVE, and the consumer census is COMPLETE: `TurnFrame::
# {ApprovalRequest, UserInputRequest}` (f8fcf4775) FOLD INTO `Prompt`. Every
# consumer: an ignore arm in core's serve.rs, an ignore arm in the desktop's
# chat.rs, a deliberate error in the turn client, and the byte-pin test (which
# moves with the change). NOTHING RENDERS THEM. sovereign-mobile is safe by
# construction — its mirror carries only Token/Complete/StreamError/Narration
# plus `#[serde(other)] Ignored`, so it has neither variant AND its catch-all
# makes any reshape forward-compatible. Changing them is free NOW and stops
# being free the moment C2 wires them.
#
