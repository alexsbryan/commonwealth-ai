[[bar]]
id           = "sv-no-daemon-management"
one_line     = "CLAIM: the desktop cannot BECOME a daemon - it does not link the crates that assemble one, and reachability belongs to the client package, not the app"
derives_from = "operator, 2026-09-11: 'DoD of this initiative is most fundamentally that we do away with the desktop app managing a daemon (the thinness purity moment)'"
status       = "open"
# ── REVISED 2026-09-11, SAME DAY, BY THE OPERATOR — read this first ────────
#
# The bar first read "cannot spawn one, cannot become one, and does not link
# the crates that would let it". The middle clause was wrong, and the
# correction is the architecture rather than a wording fix.
#
#   "The daemon is the daemon and the desktop client is the client. If
#    there's a small moment where the client has to spawn something that's
#    the kind of integration surface we actually can tolerate."
#
# WHAT IS ACTUALLY BEING SEPARATED is ownership of identity, not who calls
# spawn. The daemon owns the data root, the RunLock, the weights and the
# serving. A binary that LINKS `sovereign-cli-daemon` and re-enters itself
# (main.rs:136-138) is a daemon wearing a UI whatever the process tree looks
# like at runtime — and an attach-needle count reaches zero with the whole
# backend still compiled in. So the operative test is the DEPENDENCY EDGE.
# `Command::new(path).spawn()` links nothing and is not the failure.
#
# AND THE APP SHOULD NOT HOLD EVEN THAT. The better decomposition is the one
# an API client package already shows: an application calls the client and
# moves on; establishing reachability is the CLIENT's concern the way
# connection setup is `libpq`'s and not the caller's. So "ensure a backend is
# reachable" belongs to the client family (`sovereign-turn-client`), where
# retry, readiness and backoff live once and every surface — desktop, CLI,
# phone — inherits the same behaviour. The desktop then holds ZERO daemon
# code, not a little, and the parity claim pays out instead of being argued.
# The honest precedent is a language server or an embedded database driver,
# NOT an API client (libpq does not start Postgres) — so the capability is
# NAMED on the client, never smuggled in as a networking detail.
#
# THE CAPABILITY IS CAPABILITY-SHAPED, NOT PLATFORM-SHAPED. A first draft of
# this revision proposed making "mobile cannot spawn" structural by omitting
# the feature from mobile's build. That encodes TODAY'S DEPLOYMENT as an
# invariant and boxes out on-device inference on a phone — a bonsai or 1-bit
# model — which the operator caught. The flag asks "does this build ship a
# backend it can bring up", and a phone flips it the day a model fits, with
# no architecture change: this file's own sentence already covers it, because
# "Local" is just the boot where the daemon happens to be in-process. A phone
# running on-device is a client whose daemon is COLOCATED, not an exception.
#
# WHICH IS WHY IN-PROCESS HOSTING SURVIVES. iOS forbids fork/exec for App
# Store apps, so on a phone an embedded backend cannot be a sidecar process —
# it must be in-process, exactly the thing being removed from the desktop.
# The embedded sink was already sanctioned at the top of this file ("nothing
# requires a host to speak HTTP"); THIS is the case it was sanctioned for.
# What dies is the DESKTOP assembling a daemon as a side effect of being a
# UI. What lives is in-process hosting as a DECLARED mode with a named owner.
#
# THE INSTRUMENT NEEDS TWO HALVES, and the first one alone is how this rots.
# A dependency-edge gate passes clean through someone adding a retry, then a
# backoff, then a health check, then a restart policy — nobody re-supervises
# in one commit. So the bar is the dependency edge PLUS a census that no
# surface retains a process handle or tracks a lifecycle. Same lesson the
# attach floor already taught: a count that cannot move under real regression
# does not measure it (§18.4).
#
# A CORRECTION TO THIS FILE'S OWN PRODUCT TRADE. An earlier revision said a
# service-managed daemon "keeps ~28 GB resident after the window closes" and
# treated quitting as a way to free it. A user never wants the daemon DOWN;
# they want not to pay for idle, and that is the daemon's own policy, which
# already exists: `[daemon] primary_idle_secs` defaults to 300 and
# `extras_idle_secs` to 0, applied in daemon_cmd/build/inference.rs:293,347.
# The real gap is that the fast and embed slots have NO idle monitor at all.
# That is a daemon-side fix in the place that should be deciding, not an
# argument about lifecycle.
#
# WHERE fe5a85cc3 LANDS AFTER THIS. `sovereign-service` and the Windows
# Scheduled Task are NOT the desktop's path — they are the CLI / headless /
# server path, for operators who want a daemon that outlives a session. That
# is a user-choice feature, which is why per-platform backends are the right
# price there and would have been the wrong tax on the desktop.
#
# ── AMENDED 2026-09-11, LATER THE SAME DAY, BY THE OPERATOR ────────────────
#
# THE PARAGRAPH ABOVE IS WRONG ABOUT WHOSE PATH THE SERVICE IS, and the
# correction is the product, not the wording:
#
#   "Even when you're not interacting with the app you ought to still be
#    available to contribute to the mesh (that is a core part of this
#    system)."
#
# So the service is the DESKTOP's path too, installed by DEFAULT. It is not
# a convenience for operators who dislike relaunching; availability is a
# property of the NODE. A node that exists only while someone has a window
# open is not a mesh member, it is a client that occasionally appears — and
# the per-platform backends are therefore the right price for the app as
# well, not a tax on it. The session that drafted this file argued the
# service on thin grounds (fewer relaunches, user preference) and reached
# the right answer for a weak reason; the reason is membership.
#
# WHICH MAKES THE OPT-OUT A MEMBERSHIP SETTING, NOT A LIFECYCLE ONE. "Don't
# run when I'm not using the app" means "don't contribute while I'm away",
# and it belongs in the contribution settings where it says so, never in a
# service checkbox where it reads as login-items hygiene and quietly removes
# the node from the mesh. Two preferences ARE coherent and cost nothing:
# "don't register an autostart entry in my account" (the client brings the
# backend up by path instead — `sovereign_turn_client::reach`, 523ae2fb5),
# and "don't lend this machine" (a contribution setting). What is NOT
# coherent is "no daemon": every capability the app has is served by it.
#
# AND IT FORBIDS AN IDLE-EXIT POLICY. A daemon that exits when nobody is
# looking cannot answer a peer. The resident-RAM answer is therefore the
# idle-UNLOAD policy this file already named and nothing else: hold close to
# nothing while nobody is asking, load on demand for a peer or a user. That
# moves `[daemon] extras_idle_secs` + the missing fast/embed monitors
# (daemon_cmd/build/inference.rs:293,347) from a nicety to a REQUIREMENT of
# always-on: until they exist, "always available" and "tens of GB pinned"
# are the same sentence, which is what makes users ask to turn the daemon
# off in the first place.
#
# RECOVERY IS THE OS's JOB, AND `attach_watch` MAY NOT RE-SPAWN. Settled
# 2026-09-11 after the question was put to the operator. The falsifiable
# line, and what the census half checks: A CLIENT MAY BRING A BACKEND UP AT
# A MOMENT A USER ACTION ASKS FOR ONE, AND NEVER ON A TIMER OR A HEALTH
# SIGNAL. Four reasons, the last one decisive:
#   * THE TRIGGER IS UNFIT. `attach_watch` declares Down after 3 missed
#     probes at 5s = ~15s. The daemon's own readiness budget is 120s
#     (`parse_ready_timeout`, daemon_cmd/lifecycle.rs:883) and the service
#     managers wait 10s / 10s / 60s before relaunching, so Down routinely
#     means STARTING. Spawning on it loses the RunLock race or races a start
#     already underway. Making the signal fit means teaching the client
#     about pids, locks and load phases — a neighbour learning the daemon's
#     internals forever (ARCH principle 12).
#   * IT CREATES A SECOND RESTARTER. launchd `KeepAlive.SuccessfulExit=false`
#     (ThrottleInterval ~10s), systemd `Restart=on-failure` +
#     `StartLimitBurst=5`/600s, Task Scheduler `RestartOnFailure` 5 × PT1M
#     already own this (ARCH principle 8). Worse, an app-driven kickstart
#     routes around systemd's burst brake — the one platform with a
#     crash-loop limiter loses it.
#   * IT HIDES A CRASH LOOP. A backend that died four times in two minutes
#     is something the user needs to see, not a flickering banner (ARCH
#     principle 6).
#   * AND THE CASE THAT MOST NEEDS AUTO-RECOVERY IS ONE THE APP CANNOT SERVE
#     BY CONSTRUCTION: a crash at 3am with the app closed. An app-side retry
#     covers only the case where a human is already present to press a
#     button. Recovery for an unattended node is the service manager's job
#     or nobody's.
# What the desktop does instead: reachability rides the next user-initiated
# action (`ServingHost::ensure_reachable` — one shot, no handle, no policy),
# and the existing `attach_restart_daemon` button stays as the explicit
# path. This is the sequence this file already predicted — "a retry, then a
# backoff, then a health check, then a restart policy" — refused at step
# one, deliberately, so the census has standing to refuse steps two and
# three.
#
# THE PLATFORM CEILING, NAMED RATHER THAN DISCOVERED LATER. All three
# backends are SESSION-scoped: the launchd agent loads into `gui/<uid>`, the
# Windows task is logon-triggered, the systemd unit is a user unit
# (`WantedBy=default.target`) and NOTHING enables lingering — `grep -ri
# linger sovereign/crates/sovereign-service sovereign/contrib` returns zero
# hits as of this amendment. So a Linux node leaves the mesh at logout and
# does not return until someone logs in, and macOS/Windows come back at
# login rather than at boot. On the machine most worth having in the mesh —
# the one in the corner with the GPU — that is absence during exactly the
# window that matters. `loginctl enable-linger` closes it on Linux; macOS
# and Windows would need a system-level daemon, which K1's grain argument
# already rejected, so the honest claim there is "contributes while you are
# logged in" and it must be stated rather than assumed.
#
# THIS BAR OUTRANKS sv-attach-pure-client AND SUBSUMES IT. That bar counts
# needles inside a mode ("attach constructs zero local deciders"), which
# presupposes both modes exist and measures a lagging count. This one asks
# the coarser, honest question: is the daemon something this app owns? If
# the crate is not linked, the spine cannot be constructed, the census stops
# being needed rather than being driven to zero, and the parity claim
# (desktop = cli = mobile) becomes structural rather than argued.
#
# WHY SUPERVISED-CHILD IS NOT THE DESTINATION. It looks like the answer and
# is not. `main.rs:136-138` is `Launch::Daemon =>
# std::process::exit(sovereign_cli_daemon::daemon_child_main())`: the "child
# daemon" is THIS BINARY re-entering itself (`current_exe() --daemon-child`,
# supervisor_setup.rs:134-149). So the desktop must LINK the whole backend to
# be able to become one - 21 workspace crates in src-tauri/Cargo.toml
# including sovereign-cli-daemon, sovereign-mesh, sovereign-runtime-recipe,
# corpus-engine+treesitter, gliner, inference, commonwealth-core/state.
# Debug binaries: sovereign-desktop 661 MB, sovereign-cli-daemon 614 MB - the
# app is LARGER than the daemon it supervises, because it is the daemon plus
# a UI. `svrn chat` links sovereign-turn-client and speaks HTTP; mobile
# consumes the one client family; the desktop contains the backend. That is
# the parity gap, and no attach-needle count reaches it.
# Supervised-child (W1 flip, 2026-07-18) bought CRASH ISOLATION and is worth
# keeping as a product property - it just delivered it by making the app able
# to BE a daemon instead of by having one it does not own.
#
# MEASURED 2026-09-11 (three read-only surveys, file:line in each finding):
#   * 1,990 production Rust lines in sovereign-desktop exist for daemon
#     lifecycle; ~271 survive an OS-managed daemon. Buckets: child supervision
#     645, in-process EmbeddedDaemon + RunLock 365 (state.rs), bootstrap
#     Attach/Local decision 280 (collapses to a ~40-line readiness wait),
#     smoketest crash-isolation subprocess 302 (belongs in the daemon, which
#     is what loads models), mobile-host supervision 90, crash-log
#     consumption 37. Plus sovereign-compute/src/supervisor.rs 1,082 - but
#     see below, that module STAYS.
#   * THE REPLACEMENT IS ALREADY WRITTEN. `kickstart_daemon`
#     (config_setup.rs:256-298) shells `launchctl kickstart -k
#     gui/<uid>/com.svrnmesh.daemon` and `systemctl --user restart svrnmesh`
#     today, exposed as `attach_restart_daemon`. `install-service` writes a
#     launchd LaunchAgent (KeepAlive.SuccessfulExit=false) and a systemd user
#     unit (Restart=on-failure, StartLimitBurst=5). `attach_watch.rs` (101
#     lines) already polls an EXTERNALLY owned daemon and drives the
#     ReconnectBanner's attach-down state. The OS-managed topology is the
#     path the desktop already takes when it finds a daemon running.
#   * THE SHARED SUPERVISOR IS NOT DELETED, only its desktop caller.
#     `sovereign_compute::supervisor` is consumed by sovereign-cli-daemon
#     (daemon_cmd/bootstrap.rs:592, discovery_policy.rs:24) for its own
#     compute children. A daemon supervising its compute children is right;
#     a desktop supervising a daemon is not.
#   * FIRST LAUNCH ALREADY NEEDS NONE OF IT, on the default path. The wizard
#     runs with every AppState slot None; `maybe_start` refuses to engage
#     without a CliSetup config (supervisor_setup.rs:174-179) and config.toml
#     does not exist until step 5, so steps 1-5 have no daemon BY
#     CONSTRUCTION - and none of them needs one: hardware detect, bundled
#     catalog resolution, mkdir, the three GGUF downloads, validation, the
#     config writes. All weight-free. Everything that genuinely requires this
#     process to hold weights/store/Runtime hangs off
#     state::bootstrap_with_progress (setup_flow.rs:447), and on the DEFAULT
#     path step 5d returns before ever reaching it: it writes the first-run
#     marker, spawns a fresh current_exe() and exits
#     (maybe_restart_into_supervised, supervisor_setup.rs:327-356). Under an
#     OS service that whole relaunch DELETES - write config, install+start
#     the service, attach. Strictly simpler than what ships.
#   * THE FORCE_LOCAL JOURNEY IS NOT EVIDENCE AGAINST THIS.
#     first-launch-setup.journey.spec.ts:84-86 sets SOVEREIGN_FORCE_LOCAL=1
#     to suppress the relaunch, and GUEST_QA_DESIGN.md:31-40 already says what
#     that costs: "The highest-stakes journey exercises the one branch real
#     users never take." The default path is covered by
#     scripts/wizard-verify.sh, which unsets the flag (:107).
#
# THE ONE HARD BLOCKER IS WINDOWS, and it is real. No service backend exists
# at all - no unit template, no contrib/windows/, no prebuilt Windows CLI,
# and `install_service` hard-errors on the platform (service_install.rs:46-54).
# The desktop DOES ship Windows (scripts/build-desktop-windows.sh, NSIS), and
# sovereign-compute's supervisor is platform-neutral (one cfg(unix) in 1,082
# lines), so supervised-child is currently the ONLY way a Windows user gets a
# daemon. Deleting it without a Windows story breaks the platform outright.
# The bar therefore lands per-platform: move the daemon-hosting crates to
# [target.'cfg(windows)'.dependencies], green on macOS+Linux, and Windows is
# a DECLARED exception with a DEFAULTS_LEDGER row and a review-by - never a
# silent one (K1's rule).
#
# THE PRODUCT TRADE, named rather than discovered later: today quitting the
# app kills the child and frees the weights. Under a service they stay
# resident - a 35B Q6 is ~28 GB pinned across app restarts (state/config.rs
# :155-157), and the idle monitor only reclaims the PRIMARY slot after
# primary_idle_secs (default 300s); fast+embed stay loaded indefinitely
# (builders/inference.rs:275-280). The mitigation belongs to the daemon, not
# the app: extend the idle policy to every slot, or a release HINT the daemon
# may honour. A desktop that stops the service on quit is managing a daemon
# again and fails this bar.
#
# TWO DEFECTS THE SURVEY TURNED UP, unrelated to the bar but not to be lost:
# the mobile-host `sovereign-server` child is NOT stopped on quit
# (stop_daemon_child takes only state.supervisor, main.rs:979) and is
# orphaned by _exit - the exact hazard Launch::Server's own doc records
# (launch.rs:99-112); and `setup-restarting` is emitted with a 600ms paint
# sleep to NO listener (supervisor_setup.rs:339-344).
floor        = 21.0
floor_basis  = "workspace crates in sovereign-desktop/src-tauri/Cargo.toml at 2df562caa, 2026-09-11; the daemon-hosting subset is sovereign-cli-daemon, sovereign-mesh, sovereign-runtime-recipe, corpus-engine, sovereign-gliner, sovereign-inference, sovereign-tools, commonwealth-core, commonwealth-state. Lifecycle code: 1,990 production lines, ~271 of which survive"
target       = 0.0
direction    = "lower_is_better"
instrument   = "TWO HALVES, and either alone is a green gate enforcing nothing. (1) cargo tree -p sovereign-desktop --edges normal --depth 1 carries no daemon-assembling crate, gated by cargo xtask layer-gate over quality/ARCH_LAYERS.toml. (2) a census that no surface retains a process handle or tracks a lifecycle - no Child, no supervisor, no stop-on-exit - because a dependency gate passes clean through supervision re-added one small commit at a time"
goodhart     = "a surface can stop MANAGING a daemon while still LINKING one — the management calls go and the crate edge stays, which is exactly the state the predicate caught on 2026-09-11"
kill         = "K3 - in-process hosting is a DECLARED capability, not a fallback: a build that brings up a backend says so by name, with an owner and a reason. iOS is the standing case (no fork/exec, so a sidecar is impossible), and it is why the embedded sink is not retired. Anything else that cannot be served by a daemon the app does not own goes to the operator as a declared exception with a DEFAULTS_LEDGER row and a review-by date - never a silent in-process path."

[[bar]]
id           = "sv-attach-pure-client"
one_line     = "CLAIM: attach mode constructs zero local deciders - the desktop is a client, like svrn chat"
derives_from = "TOPOLOGY 3.5 'one process assembles; everything else is a surface', refined by Phase 6 wave 2 to one-DRIVER; attach is the boot where client-only is provable"
status       = "open"
# The floor is the measured needle inventory of the attach-reachable
# construction spine (bootstrap_with_progress runs for BOTH modes; only the
# EmbeddedDaemon commission and RunLock are Local-only). Counted by the
# census test below, 2026-09-08: 13 needles in state.rs + the attach
