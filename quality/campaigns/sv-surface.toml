#
# ── THE COMMAND CENSUS — measured 2026-09-09, and it resizes the project ────
#
# 263 `#[tauri::command]` in sovereign-desktop (authoritative list:
# src/lib/commands.generated.ts, which command_surface.rs generates):
#
#     74  WIRE-BACKED           already call the daemon
#     37  APP-LOCAL sanctioned  in the closed set declared above
#    144  GAP                   in-process state, no daemon equivalent
#      3  UNCLEAR               named below; operator calls
#
# ~3,570 lines of GAP command body. But the mass is CONCENTRATED, and this is
# the finding that makes the work tractable:
#
#   *** SEVEN OBJECT MIGRATIONS ACCOUNT FOR 117 OF THE 144 GAPS. ***
#
#     LocalCorpusManager ............ 17 commands
#     MeshApp corpus reads .......... 17 (all via state.corpus_engine)
#     Atlas browse .................. 14 (corpus_engine + sqlite_store)
#     state.store conv/doc CRUD ..... 16 + 8 document-asset
#     Governance oplog .............. 9
#     NoteStore + RecipeProjectStore  11 (7 recipe-author + 4 lessons)
#     Deep-research run registry .... 7
#     MCP client config ............. 6
#
# The 79 sub-20-line gaps are thin `require_manager!` / `require_store!` /
# `notes_handle` wrappers — `lc_cancel` is 4 lines, `governance_seed` 5,
# `submit_approval` 7. THEY RETIRE IN BULK WHEN THEIR OBJECT MOVES, not one
# at a time. Plan by OBJECT, never by command; a 144-row task list is the
# wrong unit and will read as impossible.
#
# TEN CHEAPEST — a route ALREADY EXISTS and the command simply is not wired
# to it. Start here; each is a repoint, not a design:
#   create_conversation -> POST /v1/conversations
#   get_conversation -> GET /v1/conversations/{id}
#   delete_conversation -> DELETE /v1/conversations/{id}
#   finalize_inner_work_conversation -> POST /v1/conversations/{id}/end
#   list_conversations -> GET /v1/conversations (needs surface scoping —
#     the one hole rung 6's D-remainder already named)
#   warmup_primary_slot -> POST /internal/inference/warmup
#   get_corpus_progress -> GET /internal/corpus/status (the local map is
#     already FED by that route — it is a cache of it)
#   submit_approval / submit_input / submit_information_response -> the WS
#     turn stream (STREAM-shaped, not REST: the answer must return on the
#     socket that owns the turn — this is G11/R2)
#
# FOUR HEAVYWEIGHTS, all STREAM-shaped, which is why they are heavy:
#   ask_document 297 · submit_information_search 266 · dr_start 204 ·
#   lc_ingest 173. Size them as their own rungs.
#
# THE WIRE STYLE ALREADY IN USE, read off the 74 wired sites — follow it:
# a per-call reqwest client with an explicit timeout; `format!("{base}/…")`;
# `!status.is_success()` -> a named Err carrying route + status + body; and
# response types IMPORTED from the serving crate, never mirrored (that is the
# rung-4 lesson and the strongest precedent for new routes). The PORT SPLIT is
# load-bearing: mutation/admin on internal_base_url (9742), corpus-read + watch
# + workflow + reading on client_base_url (9741), because commonwealth-api
# deliberately keeps expensive operator routes off the peer-reachable port.
#
# ── WHAT GENUINELY CANNOT CROSS — the only exceptions, and they are three ───
#
# Everything else on the 144 is crossable. These are not:
#
#   X1  `detect_bootstrap` — "is there a daemon, and on which ports?" cannot
#       be answered BY the daemon; asking presupposes the answer. Already
#       sanctioned.
#   X2  TAURI WINDOW HANDLES, and this one is subtle enough to state fully.
#       Every meshapp_* bridge command authorizes on `webview.label()`, which
#       the host assigns at window creation and which is unspoofable from
#       inside the sandbox. THE LABEL IS THE AUTH TOKEN AND IT EXISTS ONLY
#       BECAUSE THE WINDOW IS IN THIS PROCESS. A daemon route serving the same
#       data would have to invent a different caller identity. This is exactly
#       why the split inside the meshapp family is right: the AUTHORIZATION
#       half stays (8 sanctioned commands), the 17 DATA READS move. Also here:
#       WebviewWindowBuilder, app.exit(0), app.restart().
#   X3  LIVE CHILD-PROCESS HANDLES. The desktop is the PARENT of the
#       mobile-host child and the supervised daemon; a daemon cannot signal a
#       child it did not spawn, nor restart itself through its own route.
#
# Deliberately NOT exceptions, though they look like them: hardware detection
# (the daemon links the same detector and runs on the same machine), watched
# folders (no watcher is bound to the desktop process — that family is already
# an HTTP proxy), GGUF/GliNER downloads (plain fetches to disk), and
# user-picked paths. That last group is SAME-HOST-ASSUMING, not uncrossable —
# if attach is ever allowed to reach a non-loopback daemon they break, which
# is a scope decision to take deliberately rather than discover.
#
# THREE UNCLEAR, operator calls: `governance_export_write` and
# `lc_validate_path` (pure save-dialog / path-validation against the USER's
# filesystem — client-side by nature, or a defect?) and
# `mesh_preview_join_link` (the daemon parses the same link on /v1/mesh/join,
# so this may be a decider twin or a legitimate client-side preview).
#
# SILENT DEGRADATIONS FOUND — attach mode already lies in four places, and
# these are §18.3 defects independent of the collapse:
#   mesh_is_running returns Ok(true) BY ASSUMPTION without asking the daemon ·
#   mesh_list_peer_preferences returns an empty Vec silently ·
#   mesh_diagnostics returns an empty peer list + true ·
#   insight get_sink_status has no attach branch beside its four wired
#   siblings.
#
# ── STRUCTURAL BLOCKERS — close before any collapse SHIPS ───────────────────
#
#   B0  SCOPE + B1's ANSWER (operator, 2026-09-09): "Just align the cli +
#       desktop; ensure initial user can get a snappy experience -- not too
#       complicated of a decision."
#
#       TWO SURFACES, NOT THREE, for this pass. Mobile (M-1/M-2) rides the
#       wire-compat it already gets and is not gated on this work; it stays on
#       the ladder, off the critical path.
#
#       AND B1 IS NOT AN ARCHITECTURE FORK. Do not design an elaborate offline
#       or no-daemon path. THE DESKTOP STARTS A DAEMON AT BOOT, the way
#       `daemon_cmd.rs` already auto-creates a solo mesh for the CLI — that is
#       the existing answer, in-tree, and it is the one to copy. `start_daemon`
#       stops being gated on a mesh existing.
#
#       "SNAPPY" IS THE ACCEPTANCE TEST and it is a real bar, not a vibe: a
#       first-run user must not sit behind the measured 5.9-7.7s bind. So the
#       readiness signal becomes an honest probe of the port (the daemon's own
#       GET /v1/models, the shape supervisor_setup already uses), `backend-ready`
#       fires on the first successful probe rather than on bootstrap returning,
#       and the client retries a connect into that window instead of erroring.
#       The UI must never block on the bind, and a bind FAILURE must surface
#       rather than warn-and-return (B3). Measure first-turn latency on a cold
#       first run before and after — there is no existing in-process-vs-loopback
#       measurement (see §6 of the investigation), so this pass mints it.
#
#   B1  A FRESH-INSTALL DESKTOP BINDS NO PORT. This is the largest item in the
#       whole collapse and nobody had costed it. start_daemon is the only
#       thing that binds, and it is reachable only via try_resume /
#       create_mesh / join_mesh. try_resume returns Ok(false) without binding
#       when there is no mesh.json on disk. A user who has never created or
#       joined a mesh therefore has NO LISTENER — and chats fine today,
#       because chat is in-process. Making the desktop a client turns that
#       into a total outage on every first run. The turn surface must be
#       decoupled from mesh resumption; the CLI daemon already auto-creates a
#       solo mesh at boot and the desktop has no equivalent.
#   B2  COLD START. Measured 5.9-7.7s between spawn and bind (supervisor_setup
#       records it from a boot-loop incident, two 0.6B slots, CPU-only). The
#       readiness gate is `state.runtime.is_some()`, a Runtime check, NOT a
#       port probe, and nothing probes 127.0.0.1:9741 before enabling chat.
#       Needs: readiness becomes the daemon's own /v1/models probe;
#       backend-ready fires on first successful probe; client-side retry so a
#       turn issued into the window queues rather than errors.
#   B3  BIND FAILURE IS BEST-EFFORT. daemon.rs logs a warn! and returns from
#       the serve task. Harmless today (chat is in-process); a silent total
#       outage in an always-client world. Must become surfaced and fatal.
#   B4  RUN-LOCK REFUSAL commissions NO daemon, deliberately, and state.rs
#       says so: "Every desktop surface that does not need the mesh keeps
#       working." Chat is one of those surfaces today. It will not be.
#
# ── DEFECTS FOUND ON THE WAY (verified 2026-09-09, independent of this work) ─
#
#   D1  ATTACH SPAWNS A SECOND COMPACTION WORKER. state.rs:966 comments
#       "attach-mode leaves the worker None (the daemon at the other end runs
#       its own)". Only the CONFIG falls back (unwrap_or_default); the
#       CompactionWorker::spawn at state.rs:1569 and `compaction: Some(..)` at
#       state.rs:1647 are UNCONDITIONAL. Attach mode runs a second compaction
