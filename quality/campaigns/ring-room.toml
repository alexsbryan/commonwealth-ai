# Flight rules — read raw. Verdicts come from measurement rows, never prose here.
#
# CHILD of ring-apps, the second after ring-doc. THE mesh demo in one sitting
# on three machines: D13 (an answer that names the machine it depended on),
# D5 (the doc, landed by ring-doc, now attributed from MEMBERSHIP), D3 (a film
# from another machine's library) and the CONVERSION - a person in the room
# joins by one scan and all three legs see them. Orders under it
# `serves: ring-room <bar-id ...>`.
id        = "ring-room"
parent    = "ring-apps"
objective = "Three machines, one sitting, one person watching: ask the house AI and the citation names the machine the passage lives on; edit the shared doc and your name is on the other screens without anyone having typed a roster; open a member's library from the Library rail and start a film on the projector; then someone in the room scans one QR and within a minute their name is on the doc, their library is in the rail and their corpus answers - and across the whole walk nobody typed an address, a port, a URL, a config line or a credential. Everything generalized: the member set is read from `svrn mesh status`, never from a list, so the people in the room can plug their own machines in"
spec      = "quality/campaigns/ring-apps.toml demos D13 (rungs ra-9, ra-12), D5 (ra-13, landed by ring-doc rd-1), D3 (ra-18, ra-7) and D1's join (ra-11); quality/campaigns/ring-apps-shelf.md; .sovereign/features/ring-room/campaign.md (the brief: every leg's file:line anchors from the three scouts of 2026-09-18, and the two operator decisions - membership IS the mesh; scopes shown fluently on the media leg only). The DEMO SCRIPT is in .sovereign/features/ring-room-week1/order.md and is the definition of done."
declared  = "2026-09-18"
status    = "active"

# ── THE PREDICATE ────────────────────────────────────────────────────────────
# Two-sided. The affirmative half is the four legs at N=3 and again at N=4
# after a join mid-run. The negative half is the census: nothing typed, and
# the rail still learned nothing.
[predicate]
statement = "From three daemons on one mesh where A holds no copy of B's corpus, `scripts/ring-room-demo.sh verdict all` reads PASSED on every bar at N=3 and again at N=4 after a fourth member joined by one invite link during the run, with the member set read from `svrn mesh status` on every leg; the driver's typed-string log names zero addresses, ports, URLs, config lines or credentials; and `git diff --stat origin/main -- commonwealth/crates/commonwealth-rail commonwealth/crates/commonwealth-rail-core` (the ring rail; `commonwealth-rails` is the rails daemon, outside this clause) names ONLY the roster-door hunk in commonwealth-rail/src/lib.rs (the default RosterSource, operator 2026-09-18) - the rail learned nothing about any app's payload"
check     = "./scripts/sovereign-test.sh --human --package sovereign-api --package sovereign-mesh --package commonwealth-media"
# `check` decides only the code legs (fan-out attribution, derived roster,
# media admit). The three-node run is `scripts/ring-room-demo.sh verdict all`,
# OWED by rr-1-instrument; until it exists every bar below reads
# could-not-judge, never a fabricated verdict (ARCH 5, ARCH 6).

# ── THE CAP ──────────────────────────────────────────────────────────────────
# Default is 9 (co-lineage.py MAX_BARS). The operator accepted 11 here; the
# loader refuses this table unless `ledger` names an OPERATOR entry.
[cap]
accepted = 11
ledger   = "A56"
why      = "rr-1's five demo bars and rr-2's six room bars are one sitting on one wall; splitting them would make two campaigns share one instrument and one run."

