note   = "Declared 2026-09-19 (operator: the Halo will not be on the room's WiFi; only one mesh machine is in the room). JELLYFIN POSTURE (operator, same day): the holder surfaces the library READ-ONLY and decides WHEN it is offered - `offer` / `withdraw` are the holder's two verbs, and a library the holder is watching reads 'in use' on every rail and is not contended, the same availability shape the inference layer already gossips (`NodeCapabilities.inference_availability`, written by ActivityReporter, sovereign-server/src/activity.rs:59; docs/MESH_LOAD_AWARENESS.md). Queue: ralph/next/ring-room-rr2/STATE.md. TOPOLOGY: BeefyMac (M-series) is the one member present, on the room's WiFi, driving the wall; it mints guest grants, serves the guest page, signs guest acts, and is the scheduler for every guest ask. RuggedFox (the Halo) is a member on a different network, reached over iroh (relayed when no direct path holds): it hosts the corpus the answer leg cites and catches up as keeper. LittleMac is a member elsewhere on the mesh and holds Jellyfin. Phones are guests: no daemon, a bearer scoped to one ring + the models, TTL within the sitting - the posture THREAT_MODEL.md already grants guests, not widened. What week one deferred lands here: the QR render (`svrn mesh invite --qr`, generalized to render whatever the caller minted - a guest grant on the wall, the member invite for a laptop), Jellyfin behind the member's identity (the census's one excluded credential goes to zero), and the four legs across real machines. NEW SURFACE, named before drafting (ARCH 11 inventory in each bar's derives_from): the guest page BeefyMac serves over the room's WiFi to bearer holders (page-over-rails, ra-10 M4 - `svrn ring dev` binds loopback today and stays so; the guest page is its own listener under client_auth), and ONE app-level rule in ring-doc: a payload that names a guest renders '<guest>, guest of <signer>'. NOT in rr-2: any change under the ring rail; a guest role on the roster; the phone as a node (ra-11's measurement first); widening any window - the CPU-node ask (docs/RING_ROOM_DEMO.md part two) is the scheduler's row and runs beside this rung, and a guest never meets it because a guest has no node. PRECONDITIONS the instrument names: BeefyMac reads `retired` and LittleMac `offline` in `svrn mesh status` on 2026-09-19; both rejoin before any row; the room's WiFi must not be the tailnet."
