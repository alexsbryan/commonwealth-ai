note   = "Order ring-room-week1. Moves D13, D3 and D1's join beside the landed D5. Six working days. Daemon work: derived roster as the app default (registry of exceptions), peer_name first-class on the passage and the citation, the media offer verb with an admit narrowing, a Tauri offers command + Library section. Instrument: scripts/ring-room-demo.sh REUSING ring-doc-demo.sh's node door and podman backend, N from mesh status. NOT in this rung: a QR renderer (rr-2), identity pass-through to Jellyfin, the phone, `svrn ring deploy`, any change under commonwealth-rail* beyond the roster-door default (lib.rs:130-205, operator 2026-09-18)."

