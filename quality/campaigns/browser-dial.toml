floor_basis  = "structural: 1.0 iff (a) the probe is reproduced under `target/` (never committed) at iroh =1.0.2 with the Cargo.toml preserved and the outcome verbatim, (b) the DECISIONS correction entry carries the Mac outcome verbatim BESIDE the Halo reproduction with host, toolchain, target-std and C-compiler named for each — the old record is never replaced, the delta is the finding, (c) the entry names what would falsify it (a host whose clang cannot target wasm reproducing the Mac refusal, verbatim), (d) git diff over sovereign/crates and commonwealth/crates for this row is empty. Any false is 0.0."
target       = 1.0
direction    = "higher_is_better"
goodhart     = "reads 1.0 on a bare `Finished` line if the conditions are not named — a build fact without its instrument is a premise again (clause (b) is the point); reads 1.0 while erasing the Mac record (never silently substitute)"
