derives_from = "the handoff session's probes (2026-09-22): iroh =1.0.2 and =1.2.0 both `Finished dev profile` for wasm32-unknown-unknown with ring v0.17.14 in the tree, rustc 1.95.0, target std installed, inside the sovereign-vulkan toolbox; the Mac's verbatim failure (`ring v0.17.14 … 'No available targets are compatible with triple \"wasm32-unknown-unknown\"`) is ring's cc-mapping refusal — ring needs a C compiler even for wasm (ARCH 7: one run is not a measurement; the correction names both instruments)"
