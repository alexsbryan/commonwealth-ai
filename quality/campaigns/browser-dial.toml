objective = "A plain browser on a network the daemon has never seen — no shared LAN, no domain, no tunnel, no tailnet of ours — dials the node over iroh's relay with the guest link's fragment and makes one grant-scoped call. This campaign MEASURES that moment; wiring it into the demo is a follow-on order that only a WORKED verdict opens."
