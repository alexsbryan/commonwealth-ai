# Flight rules — read raw. Verdicts come from measurement rows
# (~/.sovereign/comaintainer/bar-measurements.jsonl), never from prose here.
# Pre-registered 2026-10-03 BEFORE any score: the gold was still being drafted
# and no pipeline output had been compared to it.
id        = "crm-proof"
objective = "A small business gets people, companies, contacts' accounts, deals, stages and commitments from its mailbox as typed records with citations, read directly from the atlas, at a cost that fits a 50k-message mailbox in a day of GPU. Re-scoped 2026-10-05 (operator): this campaign is the first CHECK of the ontology and extraction layer (svrn/docs/specs/ONTOLOGY_METHOD.md), beside uv-support (research/ontology-apps/support/GOLD_SPEC.md); the layer is the job, the mailbox an example"
spec      = "svrn-docs ontology-apps/README.md (The story; Where it converges: one gold set); research/ontology-apps/ward/GOLD_SPEC.md (the gold)"
declared  = "2026-10-03"
status    = "active"

# All bars are scored by research/ontology-apps/ward/score.py over the ten
# customer folders of research/ontology-apps/ward/prepare.py's sample (286
# messages), gold drafted per GOLD_SPEC v1 by a different model family than the
# extractor and reviewed by the operator. A pipeline record matches a gold record
# only through the evidence it cites: the same message file, plus the key named
# per bar. No judge model. Tuning runs on the 50 smoke sections
# (research/ontology-apps/ward/smoke_sections.txt), so every bar is READ on the
# gold messages outside them; the full 286 is reported beside.

[predicate]
statement = "crm-people, crm-deals, crm-stage and crm-cost each read met on their newest measurement row."
check     = '''python3 - <<'PY'
import json, pathlib, sys
rows = [json.loads(l) for l in (pathlib.Path.home() / ".sovereign/comaintainer/bar-measurements.jsonl").read_text().splitlines() if l.strip()]
ok = True
for bar in ("crm-people", "crm-deals", "crm-stage", "crm-cost"):
    mine = [r for r in rows if r.get("campaign") == "crm-proof" and r.get("bar") == bar]
    met = bool(mine) and mine[-1].get("verdict") == "met"
    print(f"{bar}: {'met' if met else 'OPEN'}")
    ok &= met
sys.exit(0 if ok else 1)
PY'''

[[bar]]
id           = "crm-people"
derives_from = "README 'Identity: no model for most of it' — address keys the person; GOLD_SPEC people"
one_line     = "Share of gold people with an email that the atlas holds as ONE person atom carrying that email"
status       = "open"
direction    = "higher_is_better"
floor        = 0.584
floor_basis  = "baseline 2026-10-03, current pipeline, holdout: 156/267; 24 emails split across atoms; 101 person atoms match no gold person"
target       = 0.9
goodhart     = "hits target while the contact list fills with junk — person atoms matching no gold person are reported beside it, and an email split across atoms counts as a miss"
instrument   = "python3 research/ontology-apps/ward/score.py --bar crm-people"
timeout_s    = 300

[[bar]]
id           = "crm-companies"
derives_from = "README 'domain keys the company (minus freemail)'; GOLD_SPEC companies"
one_line     = "Share of gold companies the atlas holds as a company atom, matched by a gold domain or the folded name"
status       = "open"
direction    = "higher_is_better"
floor        = 0.681
floor_basis  = "baseline 2026-10-03 atlas, current pipeline, holdout: 62/91 under score.company_resolver's written-forms rule (684e92a9b); 56/91 = 0.615 under the exact folded-name rule it was registered with"
target       = 0.8
goodhart     = "company atoms matching no gold company are reported beside it"
instrument   = "python3 research/ontology-apps/ward/score.py --bar crm-companies"
timeout_s    = 300

[[bar]]
id           = "crm-contacts"
derives_from = "Demo D2 'employer resolved'; ONTOLOGY_METHOD.md 'a role is a JOIN on stable keys'; GOLD_SPEC people.company"
one_line     = "Share of external gold people (an email and a company) whose one person atom names an employer resolving to their gold company"
status       = "open"
direction    = "higher_is_better"
floor        = 0.169
floor_basis  = "registered 2026-10-05 before any change aimed at it: baseline 2026-10-03 atlas, current pipeline, 14/83 (people carry no file, so holdout = all); 3 person atoms name a wrong account. First registered as 14/87: 4 gold people whose company is None (loaded as '<folder>:None') sat in the denominator and could never match"
target       = 0.8
goodhart     = "hits target by giving everyone their address's domain as employer, an ISP or a consultant's domain included — person atoms naming a wrong account are reported beside it (contacts_wrong_account)"
instrument   = "python3 research/ontology-apps/ward/score.py --bar crm-contacts"
timeout_s    = 300

[[bar]]
id           = "crm-deals"
derives_from = "README 'deals ... typed in a schema the business chose' — the half that is the differentiator"
one_line     = "Share of gold transaction deals matched by a deal atom whose evidence cites one of the deal's messages and whose counterparty resolves to the gold counterparty"
status       = "open"
direction    = "higher_is_better"
floor        = 0.072
floor_basis  = "baseline 2026-10-03 atlas, current pipeline, holdout: 5/69 under the written-forms rule (684e92a9b); 2/69 = 0.029 as registered; 22 deal atoms for 79 gold transactions, 11 with a company counterparty"
target       = 0.6
goodhart     = "a deal atom citing many messages could match many gold deals — each atom matches at most one gold deal, and deal atoms matching none are reported"
instrument   = "python3 research/ontology-apps/ward/score.py --bar crm-deals"
timeout_s    = 300

[[bar]]
id           = "crm-stage"
derives_from = "README 'A deal's current stage is its latest cited stage_update'; decision 3aae4695 (2026-10-08): the CRM shows the stage the atlas SERVES, with the message it came from"
one_line     = "Share of gold deals with a current stage whose matched deal record serves that stage (the recipe's deal_stage protocol fold), every deciding message one gold places that deal at that stage"
status       = "open"
direction    = "higher_is_better"
floor        = 0.0
floor_basis  = "re-registered 2026-10-08 under ward-score-v3, the instrument no longer folding a stage itself: holdout 0/97 on crm-ward's cached reads with the committed recipe, 80 gold deals with no matched deal record and 17 matched records pending (the legacy reader gives no claim field evidence, so the fold refuses all 162 records). Under ward-score-v2 (per-update, registered 2026-10-03 at .01) the same reads give 3/208 = .014, kept beside as `stage`"
target       = 0.6
goodhart     = "hits target by serving a stage on every deal: served stages that are wrong or cite a message gold does not place are counted beside it (stage_served_missed), stage_update claims on messages gold left unlabelled are reported as made-up and must not rise, and per-update reading accuracy (`stage`) is reported beside"
instrument   = "python3 research/ontology-apps/ward/score.py --bar crm-stage"
timeout_s    = 300

[[bar]]
id           = "crm-commitments"
derives_from = "README 'Commitments are who promised what, by when'"
one_line     = "Share of gold commitments matched by a commitment claim citing the same message whose subject is the committing person (by email, else name)"
status       = "open"
direction    = "higher_is_better"
floor        = 0.125
floor_basis  = "baseline 2026-10-03, current pipeline, holdout: 11/88; 31 of 102 gold commitments have no claim on the message"
target       = 0.5
goodhart     = "commitment claims on messages gold left without one are reported as made-up"
instrument   = "python3 research/ontology-apps/ward/score.py --bar crm-commitments"
timeout_s    = 300

[[bar]]
id           = "crm-cost"
derives_from = "README 'Why cost is the blocker for this market' — a 50k mailbox in a day is 1.7 s per message"
one_line     = "Wall seconds of the atlas build's LLM phases per message over the 286 gold messages"
status       = "open"
direction    = "lower_is_better"
floor        = 17.86
floor_basis  = "baseline 2026-10-03, current pipeline, holdout: 6,395 s of Phase 1 over 358 messages in the 220 extracted sections (smoke 1,273 s + rest 5,123 s; 220 calls, 703k prompt + 217k completion tokens); registered as 25.5 s per SECTION, re-stated per message, the bar's unit"
target       = 1.7
goodhart     = "hits target by extracting less — it is read only beside crm-people, crm-deals and crm-stage on the same run, and a cut that loses any of them below its floor voids the read"
instrument   = "python3 research/ontology-apps/ward/score.py --bar crm-cost"
timeout_s    = 300
