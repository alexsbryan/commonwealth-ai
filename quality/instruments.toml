# ── The six sampled lanes ───────────────────────────────────────────
#
# These already existed and already ran. What they never did was SAY a
# verdict: `bench all` exits 1 for regressed, stale AND missing-baseline;
# `knowledge-gym` exits 3 for "below 0.9"; `chaos-monkey` exits 4 for
# "measured nothing". So each is wrapped by `quality lane bench`, which runs
# the verb UNCHANGED and reads the report it writes.
#
# `{report}` is the file the wrapper tells the verb to write; `{ids:<subset>}`
# expands to the ids `sovereign/bench/smoke.toml` declares, each repeated after
# the flag before it, so a curated list never lives in two files.
#
# HARD ON CATASTROPHE ONLY. At six probes and ten questions a one-item flip is
# 12-20 points and a tolerance band is noise (RUNBOOK §6), so the scores are
# tracked with no band and the gating rows are the ones no sample size makes
# ambiguous: an errored item, an empty answer, an all-zero tally, an abstention
# on an answerable probe, a confabulation on an absent one. Drift is the
# nightly's question — `scripts/sovereign-ci-bench.sh` runs the full banks
# against committed per-lane baselines.

[[instrument]]
id = "routing"
kind = "bench"
claim = "invariant"
command = "svrn quality lane bench --id routing"
argv = [
  "svrn", "quality", "lane", "bench", "--id", "routing", "--reader", "bench-all", "--",
  "svrn", "bench", "all",
  "--bench-root", "sovereign/bench",
  "--routing-only",
  "--filter", "routing/cells_v1",
  "--smoke-subset", "routing-v1",
  "--report", "{report}",
]
cost_secs = 38.0
est_secs = 80
enforcement = "hard"
fidelity = "F3"
verdict = "judgement-line"
preconditions = ["port-listening:9741", "slot-decodes:primary"]
baseline = { kind = "none" }
bank = "sovereign/bench/routing/cells_v1.toml"
negative_control = "none"
runs_in = ["check"]
doc = "sovereign/bench/README.md"

