# The one hook assertion that is HARD and runs at prepush, deliberately apart
# from `hook-selftests` below. That suite is advisory, runs only in ci:suites,
# and sits behind 16 known failures — it could not have caught this and did
# not, eight times. The finding it gates is a settings.json entry deleted from
# main seven times since 2026-05-10 and returned eight, always by merge union,
# never by a deliberate edit. The failure it produces is a dead UserPromptSubmit
# turn the moment a session's cwd is not the repo root.
[[instrument]]
id = "hook-wiring"
kind = "gate"
claim = "invariant"
command = "bash .claude/hooks/tests/settings-wiring.sh"
cost_secs = 0.3
enforcement = "hard"
fidelity = "F0"
baseline = { kind = "none" }
negative_control = "settings-wiring-self-test"
runs_in = ["prepush"]
doc = ".claude/hooks/tests/settings-wiring.sh"

# The negative control for the gate above. It EXISTED before it was
# registered — `settings-wiring.sh --self-test` has always planted the
# historical blob and watched the check reject it — but the gate's
# `negative_control` carried a DESCRIPTION of it rather than its id, which
# is the one thing that field may not be (line 142: a sabotage mutant id, or
# the id of a control instrument). So the registry's own test read it as
# naming nothing, and `xtask::instrument_registry` went red on a control
# that was real. Measured 0.09s: it plants a relative + duplicated
# UserPromptSubmit command, asserts BOTH findings, then asserts a correctly
# wired blob still passes — so it pins the detector in both directions
# rather than only the failing one.
[[instrument]]
id = "settings-wiring-self-test"
kind = "control"
claim = "invariant"
command = "bash .claude/hooks/tests/settings-wiring.sh --self-test"
cost_secs = 0.1
enforcement = "hard"
fidelity = "F0"
baseline = { kind = "none" }
negative_control = "none"
runs_in = ["ci:suites", "by-hand"]
doc = ".claude/hooks/tests/settings-wiring.sh (--self-test)"

