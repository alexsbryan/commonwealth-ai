# ── The two scripts that are the local gate ──────────────────────────

[[instrument]]
id = "sovereign-lint"
kind = "gate"
claim = "invariant"
command = "./scripts/sovereign-lint.sh --human --full"
cost_secs = 27.0
enforcement = "hard"
fidelity = "F0"
preconditions = ["container:sovereign-vulkan"]
baseline = { kind = "none" }
negative_control = "none"
runs_in = ["smoke:0", "by-hand"]
# Exit 3 = the check could not RUN on this host: a third-party build script
# failed and no first-party diagnostic was emitted, so nothing in the diff
# can fix it (the native deps live in the dev toolbox). The script decides
# that — it owns the raw log — and pre-push used to re-derive it from
# outside by grepping that same file (ARCH §10.6).
could_not_judge_exits = [3]
doc = "AGENTS.md §Compilation and test feedback"
load_bearing = [
  { flag = "--full", why = "without it the run scopes to the crates owning uncommitted changes plus direct dependents; the banner names the scope, so a scoped clean run cannot be read as a repo-wide guarantee" },
  { flag = "--all-targets (always on since 2026-08-07)", why = "compiles #[cfg(test)] code, so a test module that does not build fails here rather than minutes later in the test run" },
]

# The SCOPED twin, and it is a different instrument because it checks less.
# `pre-push.sh` never ran the full-workspace form: it exported
# SOVEREIGN_CHANGED_PATHS and let the script resolve the crates owning the
# diff plus their direct dependents, which is the only reason a compile fits
# inside a one-minute budget. Registering the two as one row would have let a
# scoped green be read as a workspace green — the banner in the script says
# the scope for exactly that reason, and the registry now says it too.
[[instrument]]
id = "sovereign-lint-scoped"
kind = "gate"
claim = "invariant"
command = "./scripts/sovereign-lint.sh --human"
# 22.0 was measured on the macOS peer (see "Compilation and test feedback" in
# AGENTS.md: "Warm on the macOS peer: ~22s plain, ~27s with test targets").
# This host, warm and quiet, 2026-09-10: 44.6s ± 2.1 over a 33-file diff that
# resolved to the whole workspace (44.2 / 42.7 / 46.8, n=3), 48s over a
# 10-file diff resolving to 12 crates, 58s full workspace under memory
# pressure (jobs 5).
#
# ONE SCALAR CANNOT DESCRIBE THIS INSTRUMENT and that is the finding, not the
# number. `scripts/pre-push.sh`'s own header says so: "the compile's range is
# the DIFF's, not this file's: 16s over 4 crates, 67s over the 34 a merge
# touched. It is the only term that scales with what you are pushing, and on a
# big merge it IS the budget." A reservation of 22 against a 60s budget makes
# the runner start work it cannot finish — watched, on 2026-09-10, at "total
# 68s of a 60s budget".
#
# Set to the median of what was actually measured here rather than the low
# end, because `reservation_secs()` uses this when no `est_secs` is declared
# and a reservation that rounds down is a reservation that starves. If this
# proves wrong for the peer, declare `est_secs` on the row — it wins over the
# measurement, and separating "what it costs" from "what to hold open" is
# what that field is for.
cost_secs = 44.6
enforcement = "hard"
fidelity = "F0"
baseline = { kind = "none" }
negative_control = "none"
runs_in = ["prepush"]
when_changed = "(\\.rs$|(^|/)Cargo\\.toml$|^Cargo\\.lock$|^rust-toolchain\\.toml$|^\\.cargo/|^vendor/|^scripts/sovereign-test\\.sh$|^scripts/lib/|^sovereign/crates/sovereign-tools/src/code/test_adapters/|^sovereign/docs/cli-contract\\.toml$|^sovereign/scripts/cli-journey-.*\\.sh$|^sovereign/scripts/tests/)"
# Exit 3 = the check could not RUN on this host: a third-party build script
# failed and no first-party diagnostic was emitted, so nothing in the diff
# can fix it (the native deps live in the dev toolbox). The script decides
# that — it owns the raw log — and pre-push used to re-derive it from
# outside by grepping that same file (ARCH §10.6).
could_not_judge_exits = [3]
doc = "scripts/pre-push.sh (header — why the compile runs alongside the ratchets)"
load_bearing = [
  { flag = "SOVEREIGN_CHANGED_PATHS", why = "without it the script resolves the WHOLE workspace and the push costs minutes instead of ~22s. The venue exports it from the push range" },
]

[[instrument]]
id = "sovereign-test"
kind = "suite"
claim = "invariant"
command = "./scripts/sovereign-test.sh --human"
cost_secs = 45.0
enforcement = "hard"
fidelity = "F0"
preconditions = ["container:sovereign-vulkan"]
baseline = { kind = "none" }
negative_control = "dst-fe137-no-split-brain"
runs_in = ["ci:test", "smoke:0", "by-hand"]
doc = "AGENTS.md §Compilation and test feedback"
load_bearing = [
  { flag = "--allow-empty", why = "a run matching zero tests exits 4, not 0. Pass it only when you genuinely expect an empty scope — a filtered run that matched nothing verified nothing" },
  { flag = "--filter <whole test name>", why = "the filter sets the BUILD scope too: the script git-greps the literal through *.rs, so a broad substring silently degrades to a full-workspace build (measured 280s vs 37.5s)" },
]

