id = "daemon-concurrency-soak-control"
kind = "control"
claim = "invariant"
command = "scripts/daemon-concurrency-soak.py --minutes 6 --inject-death sigkill --inject-at 10 --expect-death crash"
cost_secs = 283.1
enforcement = "tracked"
fidelity = "F3"
preconditions = ["port-listening:9741", "corpus-installed:sep"]
baseline = { kind = "none" }
negative_control = "none"
runs_in = ["run-if-stale"]
doc = "sovereign/docs/specs/DAEMON_RESILIENCE.md"
load_bearing = [
  { flag = "it RESTORES the daemon it killed", why = "launchd here declares `KeepAlive { SuccessfulExit = false }` and did NOT relaunch after an injected SIGKILL, so a control that does not put the daemon back leaves the operator's box without one — and a negative control nobody dares schedule is one that never runs. `--no-restore` opts out for a deliberate teardown" },
]

