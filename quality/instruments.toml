# ── The concurrency lane (product-defects-batch entry 3) ─────────────
#
# The one soak-family row that carries all three of what the family was
# missing: a measured cost, a negative control watched both ways, and a venue
# that fires without a human remembering. `daemon-soak.sh` cycles a daemon
# that is otherwise ALONE — none of its seven cases is a concurrency case —
# and two in-flight turns is the smallest multi-user shape there is.

[[instrument]]
id = "daemon-concurrency-soak"
kind = "gate"
claim = "invariant"
command = "scripts/daemon-concurrency-soak.py --minutes 30"
cost_secs = 1831.8
enforcement = "tracked"
fidelity = "F3"
preconditions = ["port-listening:9741", "corpus-installed:sep"]
baseline = { kind = "none" }
negative_control = "daemon-concurrency-soak-control"
could_not_judge_exits = [2]
runs_in = ["run-if-stale"]
doc = "sovereign/docs/specs/DAEMON_RESILIENCE.md"
load_bearing = [
  { flag = "NO host-quiet precondition", why = "contention is the condition to measure under, not one to wait out. The 1-minute load is recorded per turn and reported as a covariate; a soak that only runs on a quiet box measures a state that never occurs in use" },
  { flag = "the kernel corroboration on the jetsam class", why = "`log_shutdown_context` calls any SIGTERM above 24 GiB peak RSS a possible jetsam, and this daemon carries ~36 GiB three minutes after boot with `inference.resident = []` — so the daemon's own verdict fires on every operator stop here. Without `os_confirms_memory_kill` this lane scores a peer's `daemon stop` as the defect it was built to catch (ARCH §18.1: a guard asserting on a field the subject supplies)" },
  { flag = "`could_not_judge_exits = [2]`", why = "a death this run cannot pin on the load is `sigterm_unattributed` and exits 2. Read as a FAIL it manufactures findings; read as a PASS it hides an outage. It is the fourth verdict and the registry has to know that" },
  { flag = "three death detectors, not one", why = "the injected-SIGKILL control left `daemon_pid_at_start == daemon_pid_at_end` with ZERO pid transitions — the pidfile names a corpse until a replacement boots — and only the not-alive sampler caught it. The `/v1/models` probe is the third and the only one that can reach `listener_lost`; there is no `/healthz` on :9741 and the obvious `curl && ` probe reads its 404 as healthy" },
]

# The mutant. Breaks the daemon on purpose and requires the lane above to
# notice AND to name the class right — `--expect-death crash` is a
# pre-registration, so a detector that saw nothing fails the control rather
# than passing it quietly.
