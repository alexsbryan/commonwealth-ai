# instruments.toml — the DECLARED registry of everything that verifies this repo.
#
# WHY IT EXISTS. Until 2026-09-04 the quality surface was ELEVEN private lists
# that never read each other: `scripts/pre-push.sh` (a budget ledger in
# comments), `scripts/pre-commit.sh`, `corpus-engine/xtask/src/quality_cmd.rs`
# (a Rust table of nine gates), the CI `gates` job (a shell loop of eight),
# `.github/workflows/weekly.yml`, `scripts/sovereign-ci-bench.sh`,
# `scripts/desktop-smoke.sh` (seven phases), `scripts/run-if-stale.sh`,
# `sovereign-cli/src/posture_cmd.rs` (eight hand-written rows), the desktop
# `package.json` (34 scripts), and the layer table in
# `sovereign/crates/sovereign-desktop/QUALITY_SURFACE.md`. None of them could
# answer "what verifies this repo", so none could answer the question that
# actually costs money: what verifies it NOWHERE.
#
# That doc's own postmortem is the case: `wizard-verify.sh` — the ONLY coverage
# of the packaged boot chain — sat referenced by prose and by nothing
# executable from 2026-07-18 to 2026-07-28, having caught a ship-blocking bug
# on its first run. Registering one instrument used to cost ~130 lines across a
# bash phase and a doc table, and still left it off posture and off CI.
#
# Every other open set in this repo is already a registry (`env-flags.toml`,
# `operational-anchors.toml`, `backlog-ruler.toml`, `arch-probes.toml`,
# `requirements.toml`). This was the last one in prose.
# ARCH §4: closed sets are enums, open sets are registries.
#
# `quality/check-lanes.toml` was the TWELFTH list, and the only one that was
# already a registry — which made it the worst of them, because two tables
# answering "what runs here" is ARCH §10.6's violation with a straight face.
# It was merged into this file and DELETED on 2026-09-07; the five field
# collisions and how each was decided are recorded above the eight lane rows.
#
# ── The closure loop ────────────────────────────────────────────────
#
# `cargo xtask instrument-gate` censuses the surfaces below and fails on any
# command they reach that is neither an `[[instrument]]` here nor a declared
# `[[not_instrument]]`. Wired into `cargo xtask quality` and the CI `gates`
# job. A registry with no gate is inventory; this one has the gate, and the
# gate was watched red on `wizard-verify.sh`, `daemon-soak.sh`,
# `daemon-supervised.sh` and `mesh-soak.sh` before it was watched green
# (ARCH §18.1).
#
# WHAT IS NOT HERE, so the next reader does not go looking. The lint/test
# WATCHERS were an `[[instrument]]` with `runs_in = []` until 2026-09-07. They
# are a DECLARED OPT-OUT, not a gap — `.sovereign/sovereign.toml` sets
# `[watchers] enabled = false` (2026-05-31: the parallel cargo fan OOM'd the
# daemon under a resident big model) — and a healthy absence read as the same
# finding as four real soaks nothing schedules (ARCH §18.3). They are also not
# a command any censused surface invokes, so an exemption for them matched
# nothing and this gate said so. `sovereign doctor` reports the opt-out as
# Passed and AGENTS.md tells sessions not to diagnose it; the gate for compile
# and test feedback is the two `scripts/sovereign-*.sh` wrappers, both
# registered below.
#
# Censused surfaces: `.github/workflows/{ci,weekly}.yml`,
# `scripts/{pre-push,pre-commit,desktop-smoke,run-if-stale}.sh`, and
# `sovereign/crates/sovereign-desktop/package.json`.
#
# ── Fields ──────────────────────────────────────────────────────────
#
#   id               stable id — identity from essence (ARCH §7.5), never a
#                    position in this file (required)
#   kind             gate | suite | bench | probe | control | check (required)
#                      gate    pass/fail on the repo as it stands
#                      suite   a body of tests run together
#                      bench   numbers, against a baseline or a band
#                      probe   observes and reports; no verdict to fail on
#                      control NEGATIVE control — breaks something on purpose
#                              and requires the instrument above it to notice
#                      check   a composed lane runner with its own lane table
#   claim            invariant | judged (required) — what KIND of claim the
#                    verdict is: a ceiling, a route, an absence (nothing a
#                    model decided), or a verdict a model produced part of.
#                    ORTHOGONAL to `kind`, which is the shape. This was
#                    `check-lanes.toml`'s `kind`; the two axes collided on one
#                    name and both are load-bearing, so neither was collapsed
#   command          the literal command a human types (required). ALSO the
#                    census key: the closure gate matches observed invocations
#                    against these strings
#   argv             optional; the exact argv to execute when it differs from
#                    splitting `command` on whitespace. The eight check lanes
#                    need it (`--` separators, `{report}` placeholders);
#                    everything else splits
#   cost_secs        MEASURED seconds, or the string "unmeasured" (required —
#                    an untimed instrument SAYS so, it does not omit the field)
#   est_secs         optional; the seconds a venue budget RESERVES. Different
#                    claim from `cost_secs`: a reservation may deliberately
#                    sit above the highest observed actual, because
#                    under-reserving starves an instrument that would have
#                    finished. Absent, the reservation comes from the
#                    measurement rounded UP; with neither it is a declared
#                    placeholder, never zero. The rule is
#                    `Instrument::reservation_secs` — in code, so it cannot
#                    drift from this paragraph
#   verdict          optional; exit-code (default) | judgement-line. The eight
#                    check lanes SAY their verdict on their last stdout line,
#                    because an exit code cannot express could-not-judge and
#                    `bench all` exits 1 for regressed, stale AND
#                    missing-baseline. Everything else is read on its exit code
#   could_not_judge_exits
#                    optional; exit codes that mean COULD-NOT-JUDGE rather
#                    than failed. Declared, never inferred: `concept-gate`
#                    exits 3 and 4 when the graph cannot judge the commit,
#                    `sovereign-test.sh` exits 4 on zero tests and 5 on an
#                    unattributable run — every one a distinct convention a
#                    guessed range would get wrong somewhere
#   when_changed     optional; a regex over changed paths. When a venue
#                    supplies a change set and none of it matches, the
#                    instrument is not SELECTED — selection printed by name,
#                    never a verdict substituted for one
#   bank             optional; the question bank, repo-relative. Hashed into
#                    the run fingerprint: change the questions and last week's
#                    numbers stop being comparable
#   enforcement      hard | advisory | tracked (required). `check-lanes.toml`
#                    spelled `advisory` as `soft`; one concept under two names,
#                    converged on this file's word 2026-09-07
#   fidelity         F0..F5 (required) — how far this sits from what a user
#                    runs, generalised from QUALITY_SURFACE.md's desktop table:
#                      F0 unit · F1 mocked backend · F2 real binary + fixture
#                      daemon · F3 real daemon + models · F4 supervised child ·
#                      F5 the packaged boot chain
#   preconditions    optional; a CLOSED set, argument included:
#                    `port-listening:<port>`, `slot-decodes:<slot>`,
#                    `corpus-installed:<id>`, `binary:<name>`,
#                    `container:<name>`. One set,
#                    `kernel_types::quality::Precondition`, read by both the
#                    lane runner and the shell harnesses (ARCH §10.6).
#                    EVERY ONE ASSERTS THE SUBJECT EXISTS — none asserts that
#                    the world is convenient (ARCH §18.2). A sixth spelling
#                    bounding the 1-minute load average was here until
#                    2026-09-08 and is deleted, not retuned — it fired on most
#                    runs of the host that runs the check, so wall-clock rows
#                    abstained instead of judging. Load is now recorded per row
#                    in `summary.json` as a covariate and gates nothing. The
#                    evidence and the rule are on
#                    `kernel_types::quality::Precondition`
#   baseline         { kind = "count" | "metrics" | "fingerprint" | "none",
#                    path = "..." } (required; `none` carries no path).
#                    `fingerprint` is `check-lanes.toml`'s `baseline_dir`:
#                    `<path>/<fingerprint>/latest.json` is the baseline for
#                    the stack this run is against. One field, four kinds —
#                    not two fields answering one question (ARCH §10.6)
#   negative_control a `quality/sabotage/*.toml` mutant id, the id of a
#                    `control`-kind instrument here, or the literal "none"
#                    (required — "none" is a word so the row gets COUNTED;
#                    the count is what `svrn posture` prints)
#   runs_in          every venue that runs it (required; `[]` is legal and is
#                    the finding this registry exists to surface):
#                    prepush | precommit | ci:<job> | weekly:<job> |
#                    smoke:<phase> | check | nightly | run-if-stale | by-hand
#   doc              the owning section a reader opens for the why (required)
#   load_bearing     optional [{ flag, why }] — flags whose absence silently
#                    weakens the instrument. This is the half no schema held
#                    before, and it is why QUALITY_SURFACE.md's flags table
#                    could be deleted rather than merely moved
#
# The human view is `svrn quality map` (renders the four tables
# QUALITY_SURFACE.md used to carry by hand; a golden test diffs the render
# against `quality/quality-map.golden.md` so the doc cannot drift from here).

schema_version = 1

# The files `cargo xtask instrument-gate` censuses. Declared HERE, not
# hardcoded in the gate: how far a closure loop reaches is policy, and policy
# in this repo is data (ARCH §6). It is also the field to check when you want
# to know whether a surface is actually covered.
#
# The three .md entries are here because of the postmortem this registry is
# named after: `wizard-verify.sh` was referenced by DAEMON_RESILIENCE.md and by
# nothing executable. Being NAMED by a quality-bearing doc is how an instrument
# "exists", so a doc reference is a census hit and the registry answers with
# the truth — `runs_in = []` when nothing runs it.
censused_surfaces = [
  ".github/workflows",
  "scripts/pre-push.sh",
  "scripts/pre-commit.sh",
  "scripts/desktop-smoke.sh",
  "scripts/run-if-stale.sh",
  "sovereign/crates/sovereign-desktop/package.json",
  "sovereign/crates/sovereign-desktop/QUALITY_SURFACE.md",
  "sovereign/docs/TESTING_SURFACE.md",
  "sovereign/docs/specs/DAEMON_RESILIENCE.md",
]

