# ── The eight lanes of `svrn quality check` ──────────────────────────
#
# MERGED FROM `quality/check-lanes.toml` on 2026-09-07, which is now deleted.
# Two tables answering "what runs here" was the ARCH §10.6 violation this
# section closes; five collisions were DECIDED rather than papered over, and
# each decision is recorded in the field docs at the top of this file:
#
#   kind          two orthogonal axes, both kept. `kind` stays the SHAPE
#                 (gate|suite|bench|probe|control|check); the lanes' own
#                 `kind` (invariant|judged) became `claim`, which every row in
#                 this file now carries.
#   enforcement   `advisory` and `soft` were one concept under two names.
#                 Converged on ADVISORY — this file's word, and `xtask
#                 quality_cmd::Enforcement`'s. All eight lanes were `hard`, so
#                 the merge cost zero data edits; the renamed variant is
#                 `quality_check_cmd::LaneEnforcement::Soft -> Advisory`.
#   cost          BOTH kept, because they are different claims. `cost_secs` is
#                 a MEASURED actual (or the word `unmeasured`); `est_secs` is
#                 a RESERVATION a budget holds open, deliberately above the
#                 highest observed actual because under-reserving starves a
#                 lane that would have finished. Where `est_secs` is absent
#                 the reservation comes from the measurement, rounded up —
#                 the rule is `Instrument::reservation_secs`, in code, so it
#                 cannot drift from this paragraph.
#   baseline      the lanes' `baseline_dir` is a fourth BaselineKind,
#                 `fingerprint`: `<path>/<fingerprint>/latest.json`. One
#                 field, four kinds, rather than two fields answering one
#                 question.
#   preconditions the superset closed set was already pre-registered in this
#                 file's own header. `container:<name>` is the shell
#                 harnesses' spelling the lane runner lacked; it is now in
#                 `kernel_types::quality::Precondition`, which both read.
#
# `verdict = "judgement-line"` is what separates these eight from every other
# row: a lane SAYS its verdict on its last stdout line, because exit codes
# cannot express could-not-judge and `bench all` exits 1 for regressed, stale
# AND missing-baseline. Everything else in this file is read on its exit code.
#
# The `est_secs` values were re-set 2026-09-04 and again 2026-09-05 from
# measured runs on this host; the actuals are in `cost_secs` beside them.
# ONE run is not a measurement (ARCH §18.5) — read these as first actuals.

