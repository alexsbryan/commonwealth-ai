# ── [[trigger]] — how each VENUE runs its selection ──────────────────
#
# `runs_in` says WHERE an instrument runs. It does not say how, and the
# difference is not decoration: a naive "run everything tagged `prepush`, in
# declared order" is THREE TIMES SLOWER than the shell it replaced, because
# `scripts/pre-push.sh` carried two facts that such a selection throws away.
# Both are properties of the venue, not of any instrument, so both are
# declared here (the code is `kernel_types::quality::Trigger`).
#
#   budget_secs         wall budget for the whole selection.
#   concurrency         how many instruments may be in flight. `pre-push.sh`
#                       launched the workspace compile at :380 and waited at
#                       :565 so it overlapped the ratchets; serial, the
#                       one-minute budget is gone before the gates start. The
#                       runner schedules longest-reservation-first, which is
#                       what makes two slots behave the way the hand-written
#                       launch-then-wait did.
#   min_runway_secs     below this much budget left, an instrument is not
#                       STARTED — it would be killed mid-flight and report a
#                       cap that says nothing about the code. Per venue
#                       because the scale differs by three orders of
#                       magnitude: a check lane wants 60 s of runway, a
#                       0.04 s ratchet does not.
#   on_fail             what a FAILED instrument does to the venue's exit
#                       code. Distinct from `enforcement`, which is the
#                       instrument's half: enforcement says "may this row
#                       fail a run", this says "and does the venue then
#                       stop". `pre-commit` runs real checks and still exits
#                       0 — advisory by operator directive 2026-08-06 — so
#                       collapsing the two would make that venue unstateable.
#   on_could_not_judge  the same for a could-not-judge. Separate because
#                       `pre-push` blocks on a gate that said no and only
#                       WARNS on one that could not run here — its UNVERIFIED
#                       list, "nothing in this push can fix a native
#                       toolchain that isn't installed". Defaults to
#                       `on_fail` (the stricter direction).
#   [[trigger.prepare]] a step run ONCE before the selection, and the argv
#                       prefix rewrite it buys. `pre-push.sh:299` built the
#                       xtask binary before the gates, "hoisted out of the
#                       gate function", precisely so eleven `cargo xtask …`
#                       invocations would not queue on the cargo lock — the
#                       file says it twice (:96, :367): "the concurrency
#                       silently becomes a queue". The rewrite is why the
#                       build is worth anything, so it is declared beside it:
#                       `command` stays the literal string a human types
#                       (it is also the closure gate's census key) while the
#                       runner executes `target/debug/xtask <gate>`.
#
# A trigger whose venue no instrument declares in `runs_in` is REFUSED: it
# would run nothing and report green, which is the failure mode this whole
# registry exists to end (ARCH §18.1).

[[trigger]]
id = "prepush"
budget_secs = 60
concurrency = 2
min_runway_secs = 1
# THE BUDGET IS A REPORT HERE, NOT A KILL, and this is the field that says so.
# `pre-push.sh`'s own header: "the verdict line prints the elapsed total every
# run, so a gate that creeps past the budget shows up as a number rather than
# as a habit of skipping." The first selection-driven run of this trigger
# proved why it matters — it killed the workspace compile at 59 s of the 60 s
# budget and recorded could-not-judge, turning the gate that matters most into
# an abstention over five seconds. An abstention you have not earned is not
# rigor (ARCH §18.2). The budget is enforced by not adding gates.
overrun = "report"
on_fail = "block"
on_could_not_judge = "report"

[[trigger.prepare]]
command = ["cargo", "build", "--quiet", "-p", "xtask"]
substitute_from = ["cargo", "xtask"]
substitute_to = ["target/debug/xtask"]

[[trigger]]
id = "check"
budget_secs = 1800
concurrency = 1
# Verbatim from ci-bench's `run_lane`: under a minute of runway is not a lane,
# it is a lane that will be killed and report a TIMEOUT saying nothing about
# the code.
min_runway_secs = 60
# The check DOES kill: a lane held past a 30-minute budget is a lane nobody is
# waiting for, and could-not-judge is honest for one that was stopped. This is
# the behaviour the runner already had, now stated rather than assumed.
overrun = "kill"
on_fail = "block"
# A HARD lane goes red on could-not-judge too: "suddenly nothing to judge" on
# a gated surface is a regression signal, not a pass.
on_could_not_judge = "block"

[[trigger]]
id = "run-if-stale"
# Four hours. These are the login-triggered maintenance lanes and one of them
# is a full CLI-journey nightly; the guard fires them at most once per 20-hour
# window, so the budget is a ceiling on a runaway, not a schedule.
budget_secs = 14400
# ONE at a time. `scripts/run-if-stale.sh` is invoked per lane by launchd and
# keeps a staleness marker per lane, so a lane's own invocation is the unit —
# this venue never runs two together and declaring 2 here would be a lie about
# what the guard does.
concurrency = 1
min_runway_secs = 60
overrun = "kill"
on_fail = "block"
on_could_not_judge = "block"

