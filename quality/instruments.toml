# The negative control for the hook above, and the only thing that has ever
# exercised its fail-closed branch. `git diff` FAILING and "this push changes
# nothing" are different facts, and conflating them passes the gate green, in
# silence, exactly when it is least sure of itself. This drives the REAL hook
# in a mktemp repo with an unknown sha on stdin and pins all four directions:
# an undiffable range gates every tracked file, a valid empty range gates
# nothing, a valid range gates exactly its own diff.
