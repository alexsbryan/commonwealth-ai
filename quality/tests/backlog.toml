observable = """BLOCKED 2026-09-02 — the mechanism ships, the INSTRUMENT does
not. Surgery itself is live and default-ON (`SOVEREIGN_SURGICAL_REWRITE`, one
production reader at `grounding/config.rs`), and three of the longform ladder's
