note = "3035f3a4"
found = "2026-08-10"
class = "silent-substitute"
tier = 1
surface = "rust-functional"
target = "sovereign-core/src/runtime/retrieval/mod.rs::prompt_admission"
failure = """RAPTOR late-inject summaries never reached the production deep
prompt. They were injected into the retrieval pool after the pipeline had
already run, so they landed past the point where the prompt is assembled. The
turn answered normally and nothing anywhere reported that the summaries were
absent — it was a hypothesis for weeks before a new `prompt_admission`
retrieval_audit event settled it."""
