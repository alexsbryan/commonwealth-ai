No such lane exists. `scripts/sovereign-ci-bench.sh` has no surgery lane, and
its baseline machinery is this-run-vs-committed-past-baseline, a different
relation. `sovereign/bench/` names surgery only in `CI_GATE_HANDOFF.md` prose
and inside result artifacts. The only surgery A/B is two DATED one-off
launchers (`sovereign-desktop/tests/e2e/scripts/launch-surgical-{calibration,
recalib}.py`) whose arm pairing is incidental to running both in one process.

The one same-run paired-arm lane in the tree, `bench promote` (Lane 7), already
satisfies the generic discipline STRUCTURALLY: `decide(&baseline_arm,
&candidate_arm)` takes both and a failed baseline arm returns early, so no path
emits a candidate delta without its null. Its `--param` surface is `rerank.*`;
`ScaffoldingParam` has no grounding variant, so surgery cannot ride it."""
mutation = """Unwatched, and not watchable yet. The named mutation — let the
lane emit a surgery figure with the baseline absent — has no lane to apply it
to. At `bench promote`, where a paired lane does exist, the pairing is a TYPE
SIGNATURE, so the mutation is a compile break: a false red, which this ledger
names as could-not-judge, never covered.

Unblocks when a surgery arm becomes drivable — a `ScaffoldingParam` grounding
variant, or a durable lane in `sovereign-ci-bench.sh`. The invariant then
transfers to whatever reports the delta."""

