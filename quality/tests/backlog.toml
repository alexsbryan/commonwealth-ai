# answer a command the app never invokes on the path under test, moving the
# count without covering anything. So — delete the new spec, re-run
# `npm run report:coverage`, and the module must fall BACK to its recorded
# count. If it does not, the spec did not reach what it appeared to.
# ─────────────────────────────────────────────────────────────────────────

