# Functional-coverage records drawn from the working notes.
#
# READ quality/TEST_LEDGER.md FIRST — it is 190 lines and it carries the rules
# these records depend on. The three that matter most here:
#
#   1. A record is OPEN if and only if its `mutation` still SURVIVES. Coverage
#      is never stored. Apply the edit, run the suite; nothing red means the
#      failure is uncovered.
#   2. `close` must name WHICH test reddened, and it must be the one this
#      record names. A mutation that reddens something else is
#      could-not-judge, never covered.
#   3. Every record traces to a witnessed incident. `note` is an id in
#      ~/.svrnmesh/notes.db and `found` is the date it happened. A record with
#      no witnessed failure belongs in quality/conformance-specs.toml, which is
#      the registry for promises. This one is the registry for damage.
#
# CLOSING A RECORD. Apply the `mutation`, watch the suite, and name the test
# that went red in a `landed` field on the record — `<junit classname>::<test
# path>`, the same spelling `quality/conformance-specs.toml` uses. That field
# is the ONLY thing `scripts/test-queue.py` reads to drop a record from the
# queue, and it is admissible only for a mutation actually WATCHED red: a
# `landed` written from reading the tree is the opinion-versus-mutation trap
# TEST_LEDGER.md §Closure names, wearing the burndown's own clothes. The test
# it names must be the test the record names (interlock 5).
#
# `failure`, `observable` and `mutation` are written to be SELF-CONTAINED. An
# agent picking up a record should never need to open the note — the notes
# average 2,451 characters and that read will either be paid or skipped, and
# both are failures.
#
# FIELDS
#   id          family + ordinal. Families are areas, not requirement families.
#   note        witness in the notes store (8-char prefix, unique)
#   found       the date the failure was observed, not the date it was written
#   class       one of the nine in TEST_LEDGER.md §The nine classes
#   tier        1 = operator's ranking (mesh, inference, setup, desktop,
#               ingest, enrich, bench, grounding, reasoning); 3 = dev tooling
#   surface     rust-unit | rust-functional | cli-journey | playwright |
#               vitest | shell
#   target      file::symbol. NO line numbers — spans rot, symbols do not.
#   seam        "needed" when the decision is not reachable without an
#               extraction first. Costs roughly double. Do not take three in
#               one order.
#
# COUNT: 111 records. None written. Nothing here is claimed as covered.


# ─────────────────────────────────────────────────────────────────────────
# GR — grounding and the answer path
# ─────────────────────────────────────────────────────────────────────────

