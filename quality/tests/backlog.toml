# tree, not a promise copied out of a spec, which is the distinction interlock 3
# exists to hold.
#
# WHAT THE NUMBER IS. The synthetic tier impersonates `__TAURI_INTERNALS__`
# (tests/e2e/fixtures/tauri-shim.js), so "reached" means the FRONTEND invoked
# the command and a JS handler answered — the Rust body never runs. 94/260 is
