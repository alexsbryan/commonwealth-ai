`prompt_admission` audit event for that turn. Assert on the audit event, not on
the pool: the pool held them the whole time, which is why this was invisible."""
mutation = """Drop the late-inject arm from prompt assembly so injected
summaries are collected but never admitted. The test must redden. If the turn
still answers and nothing goes red, that is the original defect."""

