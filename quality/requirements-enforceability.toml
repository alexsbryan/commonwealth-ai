# Enforceability of each requirement — THE ONE HAND-AUTHORED COLUMN.
#
# `quality/requirements.toml` is generated from the specification and carries
# what the spec SAYS. This file carries what no parser can decide: how a
# requirement can be settled mechanically, if at all. It lives apart precisely
# so regenerating the registry cannot clobber it.
#
# `assert_every_column_resolves` in kernel-types/tests/requirements_registry.rs
# asserts the two id sets are EQUAL, so a requirement cannot arrive
# unclassified and a class cannot outlive its requirement.
#
#   cli        black-box command + an assertion on its output
#   desktop    needs the app surface or a chat turn
#   model      needs live weights — answer quality, calibration, routing
#   structural a type, a lint, or a source-scanning test; no process started
#   review     no automated check can settle it; never counted covered OR failing
#
# 582 of 625 are reachable with NO MODEL AT ALL: 311 cli + 11 desktop + 260
# structural. Of those, 571 need no running application either (cli +
# structural) — that narrower number is the one a headless CI tier can reach.
# 9 need live weights and 34 no automated check can settle. That split is what
# makes a fast tier possible, so 582 is PINNED in the test, not printed.


