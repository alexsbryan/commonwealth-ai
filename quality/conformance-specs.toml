# The next 100 conformance specs — what to write, and what only needs a tag.
#
# Surveyed 2026-09-02 by three read-only agents across FE, IN/ST/EV, UI/EN/GR.
# Each entry was judged by READING the candidate test's body, never by matching
# clause words to test names — that name-matching is exactly the Goodhart the
# operator ruled out, and it is what produced the retracted "mesh is a WRITING
# job" conclusion (see quality/conformance-worklist.toml).
#
# HEADLINE: of 100, only 24 need a test written. 75 already have a test that
# genuinely asserts the clause and merely lacks a `covers:` tag, and 1 is a
# standing conflict between the spec and a deliberate code decision.
#
# 2026-09-02: ALL 24 GAPS ARE WRITTEN (`status = "landed"`, `landed` names the
# test). Twenty of them mint a claim; four have no route to one and are the
# only outstanding work from this pass:
#
#   UI-9, UI-10   vitest. `tests/e2e/scripts/conformance-tags.mjs` scans
#                 PLAYWRIGHT specs only, and the desktop's vitest config
#                 emits no JUnit report for `svrn conformance` to join.
#   EV-25         `scripts/sabotage.py --self-test`. Python; no route.
#   EV-33         `scripts/tests/pre-push-fail-closed.sh`. Shell; no route.
#
# Three gaps needed the CAPABILITY built before a test could exist, and that
# is what took the time:
#   EN-16  `oplog::reverse_merge` — undo that reads the merge's inputs OFF THE
#          LOG. `split_atom` took a caller-supplied `into` list and its only
#          call site was its own test.
#   FE-139 `Orchestrator::{announce,complete}_departure` — GracefulDeparture
#          was unit-tested and constructed by nothing; `stop_all`, commented
#          "graceful departure", SIGKILLed every child. `ManagedProcess::stop`
#          now sends SIGTERM and honours `SpawnConfig::stop_timeout`.
#          FaultDetector is STILL unwired — named, not fixed.
#   UI-22  `daemon::resolve_client_bind_posture` — the loopback/token posture
#          extracted out of a ~4700-line async fn.
#
# Six more needed a seam extracted so the decision was reachable at all:
# GR-4 `audit_window`, EN-20 `dead_law_chunk_ids`/`drop_dead_law_chunks`,
# FE-22 `first_vendor_with_gpus`, ST-15 `parse_prune_days`/`parse_keep_versions`,
# EV-25 `adjudicate`/`mark_stale`, UI-10 `completionAnnouncer`.
#
# STATUS
#   gap             — no test asserts this clause. Write one. `asserts` and
#                     `catches` are filled in; `target` is the production site.
#   exists-untagged — a real test asserts it. Add `/// covers: <ID>` above the
#                     #[test], then regenerate. Cheap — but 6 of 13 previously
#                     hand-written claims were overclaims, so each still owes
#                     its mutation (scripts/sabotage.py) before it counts.
#   CONFLICT        — the code deliberately does the opposite. Operator call.
#
# MINTING, in this order and no other:
#   1. add the tag
#   2. UPDATE_CONFORMANCE_TAGS=1 cargo test -p kernel-types --test conformance_tags
#   3. a FULL ./scripts/sovereign-test.sh --human  (a filtered run makes every
#      other claim never-ran; svrn conformance refuses a claim whose source
#      changed after the report, and adding the tag IS that change)
#
# The tag generator refuses a body with zero falsifiable exits. It counts
# assert!/assert_eq!/assert_ne!/assert_matches!/panic!/unreachable!/.expect(/
# .unwrap_err( and #[should_panic]. NOTE: plain .unwrap() does NOT count.
#
# THREE ENTRIES ARE MORE THAN MISSING TESTS — capability the spec requires that
# no located code implements: FE-139 (graceful-departure state machine),
# EN-16 (reversing a merge from the oplog), UI-10 (the announcement seam).
# Confirm the mechanism exists before writing a test against it.



