# backlog-ruler.toml — THE VALUE RULER, as data.
#
# One decider, one name (ARCH §10.6). Before 2026-08-09 the ruler existed
# twice: as prose in the doc header of scripts/co-backlog.py, and as Python
# constants forty lines below it (AXES, AXIS_NAMES, COST_CHUNKS,
# VALUE_RANGE). Two copies of one scorer is the smell §10.6 names. This
# file is now the only copy: the renderer reads it, the `svrn backlog add`
# scorer sends it to the model as its system prompt, and co-backlog.py's
# --self-test reddens if the rendered page and this file disagree.
#
# The axis and scoring text below is the operator's, VERBATIM. It moved
# from the docstring; it was not rewritten in the move. Future re-scoring
# argues with these statements, not with vibes.
#
# Config-as-data, in the quality/ registry beside env-flags.toml and
# ARCH_LAYERS.toml, for the reason ARCH §6 gives: a ruler is a threshold
# table, and a threshold table in a .rs (or .py) file is a large const
# string literal wearing a hat (§6.2).
#
# EDITING THIS FILE RE-SCORES THE BACKLOG. That is deliberate and free —
# the backlog is a derive-at-read heap (order backlog-insert-system), so
# ordering is computed fresh at every --open/--pull from live items. There
# is nothing cached to invalidate. Bump `version` when the axis set or the
# scoring scale changes, and say who directed it in [provenance].

version = "2"
minted = "2026-08-09"

[provenance]
v1 = """Synthesized from the operator's mission statements, session
91fc15b1, 2026-08-09."""
v2 = """Axis F added 2026-08-09 by operator directive ee29b86d, minted
from this backlog's own first migration: 62% of the 79 migrated items
scored on axis E and 44% scored Value 1-2, because v1's five axes are all
ANSWER-QUALITY axes and had no room for a product that a new user cannot
reach at all. See docs/BACKLOG_MIGRATION_2026-08-09.md for the evidence
that earned it. F scores on the same scale as A-D, not as a modifier."""
extracted = """Moved verbatim out of the scripts/co-backlog.py doc header
into this file 2026-08-09, order backlog-insert-system deliverable 1."""

# --- the axes -------------------------------------------------------------
#
# A CLOSED SET (ARCH §2/§9): these letters are the whole alphabet of the
# ruler. co-backlog.py's parser rejects any other capital letter in a
# `Value:` line, and its self-test proves that with a negative case.
# Adding an axis here adds it everywhere, including the model's prompt.

[[axis]]
letter = "A"
name = "Grounded"
yardstick = """Grounded — "does not hallucinate": reduces fabricated or
wrongly-accepted content reaching a user (yardsticks: honesty-when-absent
0.91 baseline, 13.1% parametric leak, incumbent 2/7 wrong-accepts)."""

[[axis]]
letter = "B"
name = "Responsive"
yardstick = """Responsive — "doesn't over abstain... the model does
respond": recovers answers wrongly declined (yardstick:
competence-when-present 0.71/0.80)."""

[[axis]]
letter = "C"
name = "Well-cited"
yardstick = """Well-cited — "useful, well cited answers... only holding
correct and applicable sources": visible provenance, better holdings
(yardsticks: segment coverage, claims-with-addresses)."""

[[axis]]
letter = "D"
name = "One sweep"
yardstick = """One sweep — "end users had to wait a very long time... does
its job in one sweep": cuts felt latency or recheck loops (yardsticks:
decline p50, judge-calls-per-turn, retry eliminations)."""

[[axis]]
letter = "E"
name = "Clean handoffs"
yardstick = """Clean handoffs — "more correct at each step... separated
responsibilities... clean input to the next step": typed stage outputs,
deleted control machinery (yardsticks: LOC deleted, responsibilities
removed from release)."""

[[axis]]
letter = "F"
name = "Viable"
yardstick = """Viable — "a new user can reach the value proposition at
all": install, onboarding, and lifecycle defects that gate everything
else. A user who cannot complete setup, cannot tell whether a peer is
usable, or whose daemon dies never reaches A-D at all, so a defect here is
not "debt that protects the above" — it is the precondition for the
above."""

# --- the scale ------------------------------------------------------------

[scoring]
# Verbatim, one string per level, highest first.
scale = [
  "5 = directly moves A-D with a measurement attached",
  "4 = directly moves A-D, falsifiable not yet measured",
  "3 = moves E or enables an A-D item one hop away",
  "2 = protects the above (debt, gates, flakes)",
  "1 = everything else",
]
blocks_rule = """Blocks rule: an item carrying "Blocks: <order/step>"
inherits the value of what it blocks."""
roi = """ROI = Value / Cost (S=1, M=2, L=3). v1 deliberately has no age
term."""
axis_f = """Scoring F: F scores EXACTLY as A-D do — 5 = directly moves F
with a measurement attached, 4 = directly moves F, falsifiable not yet
measured. It is an axis, not a modifier, and it does not change the
meaning of 3, 2 or 1 (3 still means "moves E or enables an A-D item one
hop away"; an item one hop from an F item scores 3 the same way). The
boundary that keeps F honest: F is "the user cannot get there", not "this
is important infrastructure". Test flakes and build gates stay at 2 on
axis E — they protect delivery, they do not gate a user."""

[value]
min = 1
max = 5

# --- the item format ------------------------------------------------------
#
# A backlog item IS a notes-store todo (related_entity=backlog) whose body
# opens with a header block, terminated by the first blank line. These are
# the recognized keys and nothing else — an unrecognized key makes the
# item malformed and the page SAYS SO.
#
# This list lives here, not in the parser, because the writer and the
# reader are in different languages: `svrn backlog add` (Rust) emits the
# header, scripts/co-backlog.py (Python) parses it. Two copies of a key
# list drift the moment either side gains a field, and the drift shows up
# as "malformed item" on a page rather than as a compile error.
#
# `Title` is what a person reads first: a short human name for the item,
# drafted by the same model call that scores it. It exists because the
# page's card headers were 8-hex note-id prefixes — `6c9fadea` tells a
# reader nothing, and a backlog you cannot skim is a backlog nobody
# prioritizes. The ref hash is still on the card, demoted to metadata,
# because it is what you type to talk about an item. An item with no
# Title (hand-written, or filed before this key existed) falls back to
# the first sentence of its own discovery text — never to the hash.
#
# Meaning of the three producer keys, which only machine producers set:
#   Producer  — what filed it (`svrn backlog add`, a CI lane, a person).
#   Scored-by — the model id that drafted the score. Its PRESENCE makes
#               the item unvetted and unpullable, whatever else the header
#               says; a human clears it as the act of review.
#   Key       — producer identity, from essence (ARCH §7.5): a repeat
#               filing under the same Key UPDATES that item instead of
#               filing a duplicate. Never a counter, a row id or an
#               address.

#   Verified-at — when a PERSON last confirmed this item still reproduces
#               at HEAD, as an ISO date. Optional, and it is a display
#               fact, never a gate: see [liveness] below for why an
#               absent or expired stamp does not block anything.

[format]
header_keys = [
  "Title", "Objective", "Value", "Cost", "Approach", "Chunks-with", "Blocks",
  "Done-when", "Evidence", "Producer", "Scored-by", "Key", "Verified-at",
]

# --- liveness -------------------------------------------------------------
#
# VETTED HAS NEVER MEANT "STILL TRUE". Everything the vetting rule checks
# — a clean header, a Done-when, an Evidence, a stated Approach — is a
# property of the ITEM. None of it is a property of the CODE. So an item
# stays vetted, ranked and pullable long after the defect it names was
# fixed. Measured 2026-08-12: three of the top four vetted items were
# already closed, two by a commit that landed three days BEFORE the item
# was filed (seat finding 14e2bcb3).
#
# The window below is the only threshold in the loop, and it lives here
# rather than as a constant in a script for the reason ARCH §6.2 gives.
# One implementation reads it: `co-backlog.py: liveness_of()` (§10.6).
#
# WHAT THE WINDOW DOES AND DOES NOT DO. It decides what the heap SHOWS
# ("verified 3d ago" vs "liveness last verified 19d ago — stale") and it
# decides which items `--pull` re-verifies in the moment. It does NOT
# block a pull, ever. An item whose stamp expired is re-verified at the
# point of trust and handed out with the result stated; if the engine is
# down, it is handed out with the staleness stated. A gate that stops the
# operator because a nightly did not run is the pre-push hook this design
# exists to not be (operator constraint, 2026-08-12).
#
# The cost of a pull is therefore proportional to WHAT IS BEING PULLED,
# never to how long the loop was skipped. Thirty silent days and zero
# silent days cost the same run.

[liveness]
staleness_days = 14
# A pull walks the heap top-down and verifies each candidate it is about
# to trust, stopping at the first one that survives. This bounds ONE pull
# on a pathological heap (every item dead); it is not a cursor and there
# is no overflow to carry — the next pull starts from the top and re-asks
# the same level-triggered question. Contrast co-sweep.sh's CAP=20, which
# defers what it did not reach and has been behind for six nights.
max_pull_verifications = 8
verifier = "scripts/co_liveness.py — level-triggered: it asks only whether the item reproduces at HEAD, and consults no mark, cursor or commit range."

# --- cost -----------------------------------------------------------------
#
# Cost is stated in session-chunks, and it must FOLLOW from the item's
# Approach line (operator directive 341884f5): an S/M/L with no stated
# approach is a number with nothing behind it, and co-backlog.py treats it
# as one.

[cost.chunks]
S = 1
M = 2
L = 3
