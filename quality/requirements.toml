spec_hash = "db3e95631b19f6b044a0020c5c9e0f6f490aa33ae6786fdfec27527881a90fa2"
spec_lines = 3572

[[requirements]]
id = "CI-1"
family = "CI"
n = 1
level = "must"
spec_line = 2711
text = "A compiler-resolved symbol and call graph MUST be maintained, answering at minimum: define a symbol; who calls it; what it calls; transitive blast radius; concept search."

[[requirements]]
id = "CI-2"
family = "CI"
n = 2
level = "must"
spec_line = 2715
text = "Graph queries MUST be exact where the language permits, and MUST catch dispatch that text search misses."

[[requirements]]
id = "CI-3"
family = "CI"
n = 3
level = "must"
spec_line = 2718
text = "Where a stored classification field is unreliable, the **one decider** MUST derive classification from the field that is reliably populated, and the unreliable fields MUST be documented as not-to-be-read (X-SD-1)."

[[requirements]]
id = "CI-4"
family = "CI"
n = 4
level = "must"
spec_line = 2722
text = "The graph MUST be **live**: the query tools and the updater MUST share one handle, so an update is visible without a restart."

[[requirements]]
id = "CI-5"
family = "CI"
n = 5
level = "must"
spec_line = 2725
text = "Freshness MUST be two-tier: a cheap, embed-free, syntax-level overlay on every save giving fresh definitions in milliseconds, and a heavy whole-workspace export that is **demoted** — never blocking, rate-limited, quiescence-gated with a starvation cap, and de-prioritised at the operating-system level so it yields to interactive work."

[[requirements]]
id = "CI-6"
family = "CI"
n = 6
level = "invariant"
spec_line = 2731
text = "A cooldown MUST be stamped at the **end** of the run it gates, by a guard covering every exit path including panic, and MUST exceed the slowest measured run."

[[requirements]]
id = "CI-7"
family = "CI"
n = 7
level = "invariant"
spec_line = 2738
text = "A freshness stamp MUST **travel with the rows** it describes, forward-only."

[[requirements]]
id = "CI-8"
family = "CI"
n = 8
level = "must"
spec_line = 2747
text = "The export MUST be **one-writer and guarded**: staged then atomically renamed, under a cross-process lock, refusing to replace a populated graph with an empty one — so a query in flight always sees a complete graph and a restart mid-export cannot empty it."

[[requirements]]
id = "CI-9"
family = "CI"
n = 9
level = "must"
spec_line = 2752
text = "Follow-up passes MUST run under the **same** permit as the pass that scheduled them, with a bounded count; a wall-clock watchdog and a scope guard MUST clear both the worker flag and the claim on hang or panic, record the failure, and log loudly."

[[requirements]]
id = "CI-10"
family = "CI"
n = 10
level = "must"
spec_line = 2759
text = "A refresh command MUST **verify**: nudge, poll to a named verdict (completed / failed / crashed / wedged / unreachable), and print an explicit result — with a local fallback through the **same** lock, exiting with an error rather than racing."

[[requirements]]
id = "CI-11"
family = "CI"
n = 11
level = "invariant"
spec_line = 2764
text = "**One project owns one workspace.** Registration MUST refuse a root that is an ancestor or descendant of a registered root, naming the conflict, with an explicit override."

[[requirements]]
id = "CI-12"
family = "CI"
n = 12
level = "must"
spec_line = 2772
text = "Index posture MUST be **in-band**: every query result MUST carry a health trailer, and a degraded or aging index MUST NOT be able to masquerade as \"no matches\" (X-DG-3)."

[[requirements]]
id = "CI-13"
family = "CI"
n = 13
level = "must"
spec_line = 2776
text = "Staleness MUST carry calibrated confidence levels, not a boolean."

[[requirements]]
id = "CI-14"
family = "CI"
n = 14
level = "must"
spec_line = 2779
text = "External analysis tool resolution MUST have **one decider**: the invoking process's environment first, then well-known per-user toolchain locations. Resolution MUST return the **absolute path**, and the child MUST be spawned with an augmented environment — both halves are required, because these tools shell out to their own runtimes."

[[requirements]]
id = "CI-15"
family = "CI"
n = 15
level = "should"
spec_line = 2792
text = "The system SHOULD derive *what the codebase does* from its own call graph — clustering entry points that share a reachable spine into **capabilities** — and reconcile those against the prose documentation, producing **corroborated / undocumented / drifted** findings."

[[requirements]]
id = "CI-16"
family = "CI"
n = 16
level = "must"
spec_line = 2797
text = "Drift judgement MUST be biased hard toward precision: one phantom contradiction destroys trust."
conditional_on = "CI-15"

[[requirements]]
id = "CI-17"
family = "CI"
n = 17
level = "must"
spec_line = 2800
text = "The **deterministic floor** of the reconciliation MUST run in public continuous integration: every repository path a governing document cites MUST resolve, and machine-local citations MUST fail the build. Model-dependent layers stay out of the critical path."

[[requirements]]
id = "CI-18"
family = "CI"
n = 18
level = "should"
spec_line = 2805
text = "Duplication SHOULD be detectable along four independent axes, each with its own instrument, because they find different things: - **identity** — one name defined in more than one place; - **role** — one purpose under many names; - **shape** — one concept with the same field structure under different names; - **behaviour** — one algorithm written twice."

[[requirements]]
id = "CI-19"
family = "CI"
n = 19
level = "invariant"
spec_line = 2812
text = "An identity collision counts **only when at least two definitions are each reachable by another component**. A collision whose every definition is private has nothing to import, so no amount of adoption retires it."

[[requirements]]
id = "CI-20"
family = "CI"
n = 20
level = "must"
spec_line = 2819
text = "Shape matching MUST compare **no names at any step** — field names and field types only — with inverse-document-frequency weighting so ubiquitous fields score near zero, and a symmetric score so containment does not score perfectly for any small structure swallowed by a large one. It MUST have a pinned positive control and a measured precision with a confidence interval."

[[requirements]]
id = "CI-21"
family = "CI"
n = 21
level = "must"
spec_line = 2825
text = "These instruments MUST be **mirrors, not gates**: no threshold, no exit code, nothing to ratchet — feeding dispositions into a human-owned register."

[[requirements]]
id = "CI-22"
family = "CI"
n = 22
level = "must"
spec_line = 2829
text = "A **concept register** MUST declare one canonical owner per domain noun, with a ratchet baseline. Minting a new type MUST be preceded by a cheap read-only query answering \"does this concept already exist and who owns it\"."

[[requirements]]
id = "CI-23"
family = "CI"
n = 23
level = "must"
spec_line = 2834
text = "A baseline re-minted after a counting-rule change is **not comparable** to one stamped before it, and this MUST be recorded at the mint."

[[requirements]]
id = "CI-24"
family = "CI"
n = 24
level = "must"
spec_line = 2839
text = "A **decision record store** MUST exist, queryable, replicated across peers, holding decisions, invariants, todos, and failed attempts — written at the moment, not at session end."

[[requirements]]
id = "CI-25"
family = "CI"
n = 25
level = "must"
spec_line = 2843
text = "A **work atlas** MUST give cross-machine awareness of what other agents and humans are doing, with two grades of signal: explicit **declarations** (scope, intent, time-to-live) and passive **observations** derived from edit activity, aged out."

[[requirements]]
id = "CI-26"
family = "CI"
n = 26
level = "invariant"
spec_line = 2848
text = "A released declaration is **gone** — no surface records it. Peers see live state, not a log of everything ever attempted."

[[requirements]]
id = "CI-27"
family = "CI"
n = 27
level = "must"
spec_line = 2851
text = "The intent field is load-bearing: a colleague must be able to read it and immediately know whether their work overlaps."

[[requirements]]
id = "CI-28"
family = "CI"
n = 28
level = "must"
spec_line = 2854
text = "Blast-radius queries MUST surface overlapping peer claims inline, treated as a collision warning rather than an informational note."

[[requirements]]
id = "CI-29"
family = "CI"
n = 29
level = "should"
spec_line = 2857
text = "A **session continuity** surface SHOULD exist: distil a session transcript into a structured frame, index frames for selection by branch match, prompt overlap, and recency, and inject the relevant frame at session start. Reads MUST be pure filesystem reads, so handoff survives a dead service."

[[requirements]]
id = "CI-30"
family = "CI"
n = 30
level = "must"
spec_line = 2862
text = "Context spend MUST be auditable — where the budget went, by file and by session, with counterfactual pricing of the levers that would change it."

[[requirements]]
id = "CI-31"
family = "CI"
n = 31
level = "must"
spec_line = 2868
text = "Compilation and test feedback MUST be available through a wrapped gate that: resolves the project's real build configuration; reports build-script, feature, and link failures as failures (X-DG-1); refuses a zero-test run (X-EH-3); and refuses unattributable results (X-DG-2)."

[[requirements]]
id = "CI-32"
family = "CI"
n = 32
level = "must"
spec_line = 2873
text = "Watcher liveness MUST be heartbeat-driven and self-healing, and every status response MUST carry a liveness object. When the watcher is not live, the result is **orphaned** and MUST be reported as such — never as fresh."

[[requirements]]
id = "CI-33"
family = "CI"
n = 33
level = "must"
spec_line = 2877
text = "A configured-but-dead watcher MUST be detectable by a probe of the same signal; a configuration-presence check cannot see it."

[[requirements]]
id = "CI-34"
family = "CI"
n = 34
level = "must"
spec_line = 2880
text = "A **posture** command MUST aggregate the freshness and verdict of every quality subsystem into one table, each row naming its own refresh command."

[[requirements]]
id = "CI-35"
family = "CI"
n = 35
level = "should"
spec_line = 2885
text = "An architecture-health **evidence surface** SHOULD render one deterministic self-contained page: a stable-layout map of every source file, with layer violations, duplication, co-change communities, churn, and agent read/write heat painted on it as drill-downs. It MUST render **evidence only** — no scores, no gates — and MUST carry an honesty footer stating what the picture cannot see, including the age of every input."

[[requirements]]
id = "CI-36"
family = "CI"
n = 36
level = "must"
spec_line = 2892
text = "An increment mode MUST recompute **activity** measurements over a window while **structure** stays full-history on the same stable layout, written to its own artefact so the default baseline is never touched."

[[requirements]]
id = "CI-37"
family = "CI"
n = 37
level = "should"
spec_line = 2898
text = "Large mechanical refactors SHOULD be **priceable before anything is applied**: an entry gate per item, a seed edit, a compile, and deterministic classification into *ruled* versus *residue*, with four per-unit verdicts. It MUST be read-only, with a restore guard enrolling every file before writing it."

[[requirements]]
id = "CI-38"
family = "CI"
n = 38
level = "invariant"
spec_line = 2904
text = "The refactor ledger MUST have **no database and no stored progress**. A holding is open *if and only if* its detector still fires on it, so closing re-runs the instrument and nothing can be marked done by hand. A dead worker session is then a no-op needing no reconciliation."

[[requirements]]
id = "CI-39"
family = "CI"
n = 39
level = "must"
spec_line = 2909
text = "Every ledger run MUST carry a **negative control**; a detector whose control site went silent is *could-not-judge* and closes nothing."

[[requirements]]
id = "CI-40"
family = "CI"
n = 40
level = "invariant"
spec_line = 2913
text = "Scoping MUST be a **post-filter**, never a narrowed input, wherever a predicate is population-relative — narrowing the input makes such a predicate wrong, not cheap."

[[requirements]]
id = "CI-41"
family = "CI"
n = 41
level = "must"
spec_line = 2917
text = "Judgement keys MUST carry no coordinates, so a judgement survives its subject moving; a rename is the one lossy case and MUST surface as a named orphan."

[[requirements]]
id = "CI-42"
family = "CI"
n = 42
level = "must"
spec_line = 2921
text = "A **wire differ** MUST prove that adopting a typed value at an untyped site does not change the emitted bytes, with one implementation of that question used by every consumer, and a negative control kept deliberately failing."

[[requirements]]
id = "CI-43"
family = "CI"
n = 43
level = "should"
spec_line = 2928
text = "A **canonical agent-tool surface** SHOULD exist: a small set of primitives (inspect a working directory polymorphically over file / directory / find / grep; write a file; patch a file; replace a function; build; smoke test; declare done; declare a plan; hand off between roles) that every external runner translates to and from — so runners are compared on judgment, not on tool vocabulary."

[[requirements]]
id = "CI-44"
family = "CI"
n = 44
level = "should"
spec_line = 2935
text = "A **role layer** SHOULD operate over the same model weights via different prompts, tool subsets, and forced first tools — at minimum planner, implementer, and evaluator. Role profiles MUST be data (X-EX-4) shared with the synthesis role layer (RT-64), not a second definition."

[[requirements]]
id = "CI-45"
family = "CI"
n = 45
level = "should"
spec_line = 2940
text = "A **graded coding battery** SHOULD measure end-to-end coding agents, runner- and model-agnostic, across several languages, judged on an ordinal scale against anchor rubrics on several dimensions per problem, dispatched through a runner registry."

[[requirements]]
id = "CI-46"
family = "CI"
n = 46
level = "should"
spec_line = 2945
text = "A **unified solver loop** SHOULD exist for any test-driven-development-shaped workflow: one entry taking a trial and returning a result, with an explicit **polarity** (maximise passing tests, or generate one failing test), and an observed variant emitting per-round progress. A verbless goal entry MUST dispatch by observed state — failing tests present → fix; none → pin-then-green — with explicit verbs available."

[[requirements]]
id = "CI-47"
family = "CI"
n = 47
level = "must"
spec_line = 2952
text = "The solver MUST be hosted as an **asynchronous job API**: submit (returning immediately with the detected framework, test command, and model), poll state and rounds, stream round events, and cancel. It MUST be local-only, with a concurrency cap per working directory and globally, and MUST use the host's own inference endpoint as its backend."
conditional_on = "CI-46"

[[requirements]]
id = "CI-48"
family = "CI"
n = 48
level = "invariant"
spec_line = 2958
text = "A client-supplied test command reaches a shell. Any route accepting one MUST be in the **privilege** removability group (UI-24), regardless of whether it sits behind the authentication layer."

[[requirements]]
id = "EN-1"
family = "EN"
n = 1
level = "must"
spec_line = 862
text = "The system MUST support more than one enrichment strategy, selected per corpus by declaration, and MUST have one document reconciling all of them so that \"enrichment\" is never assumed to mean one thing. At minimum three strategies must coexist:"

[[requirements]]
id = "EN-2"
family = "EN"
n = 2
level = "must"
spec_line = 879
text = "Enrichment providers that would create a dependency cycle MUST be injected through a seam rather than depended on directly."

[[requirements]]
id = "EN-3"
family = "EN"
n = 3
level = "must"
spec_line = 884
text = "Each cached enrichment phase MUST record the model that produced it, and MUST decline to reuse a phase produced by a different model. A model swap MUST force recomputation rather than silently mixing outputs from two models in one graph."

[[requirements]]
id = "EN-4"
family = "EN"
n = 4
level = "must"
spec_line = 889
text = "There MUST be exactly one helper constructing this cache identity, so every read and write carries the same notion of identity."

[[requirements]]
id = "EN-5"
family = "EN"
n = 5
level = "must"
spec_line = 894
text = "A dedicated span-typed entity extractor MUST be available, generation-agnostic behind a seam so alternative implementations share one persistence, deduplication, and provenance path."

[[requirements]]
id = "EN-6"
family = "EN"
n = 6
level = "must"
spec_line = 898
text = "The extractor that actually ran MUST be recorded per corpus, with its model identity, threshold, and label set."

[[requirements]]
id = "EN-7"
family = "EN"
n = 7
level = "must"
spec_line = 901
text = "Where an alternative implementation is measured and rejected, the selection knob MUST remain as the documented way to re-test it, and the rejection MUST be recorded with its measurement (X-CF-2)."

[[requirements]]
id = "EN-8"
family = "EN"
n = 8
level = "must"
spec_line = 907
text = "A hierarchical summary tier MUST be retrofittable onto an already-installed corpus *additively*, reusing existing passage embeddings, with document-level resume."

[[requirements]]
id = "EN-9"
family = "EN"
n = 9
level = "must"
spec_line = 911
text = "Clustering thresholds MUST be **corpus-shape aware**. A threshold tuned for one content shape MUST NOT be applied to another."

[[requirements]]
id = "EN-10"
family = "EN"
n = 10
level = "must"
spec_line = 916
text = "Query-time use of summary nodes MUST be served by a derived index with a freshness gate and an exhaustive fallback."

[[requirements]]
id = "EN-11"
family = "EN"
n = 11
level = "must"
spec_line = 919
text = "An injected summary passage MUST carry a provenance handle back to the evidence it summarises, and MUST be rendered to the synthesis step under a label that identifies it as a derived summary — never under a label implying it is a primary source."

[[requirements]]
id = "EN-12"
family = "EN"
n = 12
level = "must"
spec_line = 928
text = "A multi-origin merge primitive MUST exist, operating on typed entity records with provenance, producing a **reversible** operation log."

[[requirements]]
id = "EN-13"
family = "EN"
n = 13
level = "invariant"
spec_line = 931
text = "Merge signals MUST be **identity-grade only** — exact name folding, nickname and initial-surname forms, exact shared contact identifiers or aliases, organisation-plus-role. Fuzzy cross-attribute matching and bare-name aliasing MUST NOT be used."

[[requirements]]
id = "EN-14"
family = "EN"
n = 14
level = "must"
spec_line = 937
text = "The candidate-pair scan MUST be blocked so it is sub-linear in practice, not a full quadratic comparison."

[[requirements]]
id = "EN-15"
family = "EN"
n = 15
level = "must"
spec_line = 940
text = "A glassbox diagnostic MUST exist that explains, for any merge decision, which signal fired and on what evidence."

[[requirements]]
id = "EN-16"
family = "EN"
n = 16
level = "must"
spec_line = 943
text = "A reversible operation MUST actually be reversible. Where an operation log claims to support undo, the log envelope MUST carry the identity, version, actor, and timestamp needed to find the matching forward operation."

[[requirements]]
id = "EN-17"
family = "EN"
n = 17
level = "must"
spec_line = 949
text = "Where several append-only logs exist, they MUST share one envelope carrying provenance, with each tenant contributing only its own act."

[[requirements]]
id = "EN-18"
family = "EN"
n = 18
level = "should"
spec_line = 954
text = "The system SHOULD support an event-sourced governance capability over a corpus of rules: detecting tensions between rules, presenting ranked open conflicts with both texts, and recording adjudications (resolve, accept, or explicitly *not-a-conflict* — a distinct act from accepting)."

[[requirements]]
id = "EN-19"
family = "EN"
n = 19
level = "must"
spec_line = 959
text = "Adjudications MUST survive a rebuild that renumbers graph identifiers. They MUST therefore record their endpoint *rule pair*, not only an edge identifier, and MUST resolve **mootness** — a conflict whose rule has been superseded is not open. Only a genuinely dangling decision (whose rule text was edited away) MUST surface as an issue."
conditional_on = "EN-18"

[[requirements]]
id = "EN-20"
family = "EN"
n = 20
level = "must"
spec_line = 965
text = "Retrieval MUST drop passages from superseded rules — **no dead law** — and the answer path MUST run the same cite-or-abstain discipline as every other grounded surface."
conditional_on = "EN-18"

[[requirements]]
id = "EN-21"
family = "EN"
n = 21
level = "should"
spec_line = 971
text = "A deterministic strategy SHOULD lift an indexed source-code corpus into the same typed graph — content-hash nodes, generated summaries as descriptions, bounded function and call edges — so that code becomes queryable (multi-hop call chains) and patchable (incremental delta rebuild) through the same surfaces as prose."

[[requirements]]
id = "EV-1"
family = "EV"
n = 1
level = "must"
spec_line = 2971
text = "Retrieval, routing, synthesis, enrichment, grounding, honesty, and scheduling MUST each be measurable, and there MUST be **one composed suite** that spans the whole chain by *composing* the individual harnesses, not by reinventing them."

[[requirements]]
id = "EV-2"
family = "EV"
n = 2
level = "must"
spec_line = 2976
text = "The composed suite MUST be the front-line regression check. The individual harnesses are for drilling into a lane the suite flags."

[[requirements]]
id = "EV-3"
family = "EV"
n = 3
level = "must"
spec_line = 2979
text = "Lanes MUST carry an explicit tier, and the tier MUST be read before the number: - **hard** — deterministic, baseline-diffed, build-breaking; - **soft** — judge-mediated; variance must not flake the build; - **tracked** — advisory; an absolute verdict is a finding about the current system, not a regression — each paired with a **hard** gate that re-scores the same artefact and fails only on regression against a committed baseline."

[[requirements]]
id = "EV-4"
family = "EV"
n = 4
level = "must"
spec_line = 2987
text = "Gate logic MUST be one shared metric/direction/tolerance primitive across all lanes (X-SD-1). A first run MUST pass."

[[requirements]]
id = "EV-5"
family = "EV"
n = 5
level = "must"
spec_line = 2990
text = "Two run modes MUST exist: a lean pre-push tier down-sampling slow lanes to a stratified whole-unit subset, and a full release tier."

[[requirements]]
id = "EV-6"
family = "EV"
n = 6
level = "invariant"
spec_line = 2993
text = "**A sampled lane's baseline is cap-specific.** It covers a different subset than the full run, so changing a sample size requires re-capturing that lane's baseline or its gate false-fires against a stale one."

[[requirements]]
id = "EV-7"
family = "EV"
n = 7
level = "must"
spec_line = 2997
text = "Baselines MUST record the **concrete artefact** that produced them — resolving any alias to the specific model — and MUST stamp that identity into every transcript row. An alias is worthless the moment it is re-pointed."

[[requirements]]
id = "EV-8"
family = "EV"
n = 8
level = "must"
spec_line = 3001
text = "A durable per-model report tree MUST be derivable from suite-keyed baselines, grouping variants under one heading while keeping each on its own row, and **surfacing unattributed legacy baselines rather than folding them in**."

[[requirements]]
id = "EV-9"
family = "EV"
n = 9
level = "must"
spec_line = 3006
text = "Noise bands MUST be documented per lane type, with baseline-age semantics and a legitimate re-mint path, so \"is this real?\" is answerable without guessing."

[[requirements]]
id = "EV-10"
family = "EV"
n = 10
level = "must"
spec_line = 3012
text = "Any judge MUST be **forced-choice** with evidence quotes and **could-not-judge first-class** (X-EH-2)."

[[requirements]]
id = "EV-11"
family = "EV"
n = 11
level = "must"
spec_line = 3015
text = "A judge MUST pass a **calibration gate** against a hand-labelled bank, with stated sensitivity and specificity floors, before its verdicts are used."

[[requirements]]
id = "EV-12"
family = "EV"
n = 12
level = "must"
spec_line = 3019
text = "Reporting MUST use confidence intervals, and a difference MUST be marked significant only when the intervals are **disjoint**."

[[requirements]]
id = "EV-13"
family = "EV"
n = 13
level = "must"
spec_line = 3022
text = "Where several lanes judge per criterion, the apparatus MUST be shared: one forced-choice judge, one calibration gate, one weighted scorer, one reporting formula. A lane binds to it and owns no private copy."

[[requirements]]
id = "EV-14"
family = "EV"
n = 14
level = "must"
spec_line = 3026
text = "A criterion vocabulary MUST be a closed, auditable set, and a comparison across vocabulary versions MUST be **refused**."

[[requirements]]
id = "EV-15"
family = "EV"
n = 15
level = "must"
spec_line = 3029
text = "Where criteria are selected, they MUST be selected by **question type, never by probe content**, so no corpus vocabulary can reach a criterion and the teach-to-the-test audit surface is the closed vocabulary rather than the generated criteria."

[[requirements]]
id = "EV-16"
family = "EV"
n = 16
level = "must"
spec_line = 3036
text = "A benchmark MUST exist that measures the product's central claim: **answer capably and cited when the facts are present; abstain honestly when they are not; unfooled by distractors.**"

[[requirements]]
id = "EV-17"
family = "EV"
n = 17
level = "invariant"
spec_line = 3040
text = "The bank MUST enforce a **fairness contract at load**: answerable items must ship a witness; absent items must not."

[[requirements]]
id = "EV-18"
family = "EV"
n = 18
level = "invariant"
spec_line = 3043
text = "The scorer MUST have **two red lines** and MUST NEVER blend competence-when-present with honesty-when-absent — so neither a hallucinator nor a blanket-abstainer can game it."

[[requirements]]
id = "EV-19"
family = "EV"
n = 19
level = "must"
spec_line = 3047
text = "It MUST drive the **live production path**, sealed to one corpus, with the corpus installing machine-stably from a committed specification, so the gate reproduces across machines."

[[requirements]]
id = "EV-20"
family = "EV"
n = 20
level = "should"
spec_line = 3051
text = "A **process** layer SHOULD sit over the outcome layer, scoring *which situated behaviour* failed — grounding citation, gap naming, actionable abstention, outside-knowledge restraint — by re-scoring the transcripts the outcome benchmark already produced, so there is no benchmark-local loop for a benchmark-only scaffold to live in."

[[requirements]]
id = "EV-21"
family = "EV"
n = 21
level = "should"
spec_line = 3057
text = "A **metamorphic** benchmark SHOULD test whether a frozen model reasons from a causal mechanism or a memorised label, using a forced-choice probability distribution in one forward pass, a provably-blind negative control, and anytime-valid early stopping to a go/no-go verdict — distilling a per-model characterisation that is read free per query and invalidated by fingerprint."

[[requirements]]
id = "EV-22"
family = "EV"
n = 22
level = "should"
spec_line = 3063
text = "A **safety** benchmark SHOULD score any wellbeing-adjacent lane with **two-tier, never-averaged** scoring: a safety number (proportion of turns with zero red lines, which must reach effectively 100%) and a quality composite over the safe turns only. A hand-labelled calibration bank MUST gate any rubric change on breach sensitivity."

[[requirements]]
id = "EV-23"
family = "EV"
n = 23
level = "must"
spec_line = 3069
text = "A deterministic pre-routing wellbeing gate MUST exist where such a lane exists, and any change to it MUST re-pass the adversarial suite."

[[requirements]]
id = "EV-24"
family = "EV"
n = 24
level = "must"
spec_line = 3074
text = "A test suite MUST prove it **can fail**. Every other measure (spec counts, coverage, fixture liveness) describes what tests *reached*. Negative controls break the product on purpose and require the tests claiming that coverage to go red."

[[requirements]]
id = "EV-25"
family = "EV"
n = 25
level = "must"
spec_line = 3079
text = "Negative controls MUST have two layers: staged broken conditions against the real-mode invariant pack, and declared source mutations reported as **caught / survived / stale**. A *survived* verdict is a bug report about the suite."

[[requirements]]
id = "EV-26"
family = "EV"
n = 26
level = "must"
spec_line = 3084
text = "Negative controls MUST gate. A suite whose negative controls are advisory is a suite nobody has checked."

[[requirements]]
id = "EV-27"
family = "EV"
n = 27
level = "must"
spec_line = 3089
text = "A **use-case contract** MUST declare, as data: the command surface, the sequenced journeys, the promises those journeys serve, and the ledger of commands belonging to no journey."

[[requirements]]
id = "EV-28"
family = "EV"
n = 28
level = "invariant"
spec_line = 3093
text = "**A step that asserts an exit code asserts nothing**, because tools of this kind exit successfully when they find nothing. Every step a lane runs MUST assert **output** — read inline, or proven by a later step."

[[requirements]]
id = "EV-29"
family = "EV"
n = 29
level = "must"
spec_line = 3097
text = "The census MUST split steps **a lane runs** from steps **nothing runs**, because a step in a never-run journey is a written intention, and adding an exit-code assertion to it satisfies a ratchet without adding evidence."

[[requirements]]
id = "EV-30"
family = "EV"
n = 30
level = "must"
spec_line = 3102
text = "At least three gates MUST be **hard zeros**: every live step asserts something; every live read step asserts output; every live journey asserts output somewhere. Never-run debt MUST be capped and shrink-only."

[[requirements]]
id = "EV-31"
family = "EV"
n = 31
level = "must"
spec_line = 3106
text = "The reported number and the enforced number MUST come from one renderer (X-SD-1)."

[[requirements]]
id = "EV-32"
family = "EV"
n = 32
level = "must"
spec_line = 3109
text = "Journeys needing state a throwaway sandbox cannot have MUST declare that need, and a second read-only lane MUST run exactly the remainder against a real environment, so nothing is dropped by both lanes."

[[requirements]]
id = "EV-33"
family = "EV"
n = 33
level = "must"
spec_line = 3115
text = "The **primary** correctness gate MUST be local (a pre-push hook), version-controlled so it updates with a pull rather than drifting per-machine, **failing closed** when it cannot determine what changed."

[[requirements]]
id = "EV-34"
family = "EV"
n = 34
level = "must"
spec_line = 3122
text = "Hosted continuous integration MUST confirm the same thing on a clean checkout and MUST invoke the *same* gate script, so both share one definition of \"the tests pass\"."

[[requirements]]
id = "EV-35"
family = "EV"
n = 35
level = "must"
spec_line = 3126
text = "Test executors MAY differ for speed but MUST NOT differ in coverage. Where an alternative executor cannot run a class of tests, that class MUST be appended unconditionally. An explicit executor request MUST error rather than silently downgrade."

[[requirements]]
id = "EV-36"
family = "EV"
n = 36
level = "must"
spec_line = 3131
text = "Scoping levers MUST have documented **reach**, and a lever that cannot narrow the build MUST say so. A scope derived from a filter pattern MUST **over-approximate**, and the over-approximation MUST be verified."

[[requirements]]
id = "EV-37"
family = "EV"
n = 37
level = "must"
spec_line = 3135
text = "A non-crate path or an unresolvable scope MUST fall back **loudly** to the full scope. The gate must never silently under-cover."

[[requirements]]
id = "EV-38"
family = "EV"
n = 38
level = "must"
spec_line = 3138
text = "Tests MUST require no accelerator, no network, and no model weights. Deterministic inference stubs, in-memory storage with real text search, and a deterministic simulated fleet MUST cover the functional surface."

[[requirements]]
id = "FE-1"
family = "FE"
n = 1
level = "must"
spec_line = 1774
text = "Every node runs identical software. There is no master, no coordinator, and no central service."

[[requirements]]
id = "FE-2"
family = "FE"
n = 2
level = "must"
spec_line = 1777
text = "In one sentence: the federation translates *\"complete this request with model X\"* into a plan that runs the work on one or more nodes, holds a standard API endpoint open, and keeps the plan healthy as nodes come and go."

[[requirements]]
id = "FE-3"
family = "FE"
n = 3
level = "must"
spec_line = 1783
text = "Every node MUST persist a durable asymmetric keypair. The identity MUST be **mesh-independent**: it survives leaving, joining, and switching, so a node is the same node in every trust ring it belongs to."

[[requirements]]
id = "FE-4"
family = "FE"
n = 4
level = "must"
spec_line = 1787
text = "Joining MUST be by a short human-transcribable key. The receiving side MUST store only a hash and discard the plaintext."

[[requirements]]
id = "FE-5"
family = "FE"
n = 5
level = "must"
spec_line = 1790
text = "Join MUST include proof-of-possession of the node's identity key; a bad proof MUST be rejected."

[[requirements]]
id = "FE-6"
family = "FE"
n = 6
level = "must"
spec_line = 1793
text = "Identity keys MUST be protected by an anti-downgrade rule: a relayed record without the key MUST NOT strip a known one."

[[requirements]]
id = "FE-7"
family = "FE"
n = 7
level = "must"
spec_line = 1796
text = "A node MUST be able to belong to **many** trust rings and be active in exactly one. Parked memberships MUST retain their full roster and credentials, so returning to one is a **resume** — no handshake, no key redeemed."

[[requirements]]
id = "FE-8"
family = "FE"
n = 8
level = "invariant"
spec_line = 1800
text = "**Writing a membership does not make it active.** The save operation MUST touch only that membership's own storage. Activation MUST be a separate step used only by the two operations that *establish* a membership, plus the explicit switch."

[[requirements]]
id = "FE-9"
family = "FE"
n = 9
level = "must"
spec_line = 1808
text = "File-then-pointer ordering MUST hold, so the active marker never names a location with no membership in it."

[[requirements]]
id = "FE-10"
family = "FE"
n = 10
level = "must"
spec_line = 1811
text = "Leaving MUST clear the pointer *and* remove the departed membership. Leaving a pointer naming deleted state reads as healthy at boot while making that membership permanently unforgettable."

[[requirements]]
id = "FE-11"
family = "FE"
n = 11
level = "invariant"
spec_line = 1815
text = "A ring MUST carry **two separate credentials**: one that authorises ongoing participation and never rotates, and one that admits new joiners and rotates freely."

[[requirements]]
id = "FE-12"
family = "FE"
n = 12
level = "must"
spec_line = 1821
text = "Invitation expiry MUST live on the ring, not in per-node memory, or it dies on restart and is never armed on any member that did not personally mint it."

[[requirements]]
id = "FE-13"
family = "FE"
n = 13
level = "must"
spec_line = 1825
text = "The participation credential SHOULD NOT ride the wire between upgraded peers. A round SHOULD carry a keyed proof bound to the **sender** and to a short time window, so a captured proof is neither transferable nor durable."

[[requirements]]
id = "FE-14"
family = "FE"
n = 14
level = "must"
spec_line = 1829
text = "The authorisation result MUST report **which predicate won** as a typed value. An *offered* proof that fails MUST be a hard refusal, never a fall-through — otherwise stripping the proof buys the weaker predicate."

[[requirements]]
id = "FE-15"
family = "FE"
n = 15
level = "must"
spec_line = 1833
text = "Credential rotation MUST be refused while the fleet is mixed, and the refusal MUST distinguish **two populations** with different remedies: a peer that authorises on the legacy predicate needs *upgrading*; a peer simply not yet observed since start-up needs one *round*. Collapsing them tells operators their fleet is un-migrated when it is not."

[[requirements]]
id = "FE-16"
family = "FE"
n = 16
level = "invariant"
spec_line = 1839
text = "**The confirmation is local observation, never a peer's claim.** An upgraded peer deliberately withholds the credential, so a zeroed field stopped being evidence of an old build; reading it as one made two upgraded nodes report each other as legacy and block rotation on both sides."

[[requirements]]
id = "FE-17"
family = "FE"
n = 17
level = "must"
spec_line = 1844
text = "Because that observation is in memory, the rotation refusal MUST run at least one round before it is willing to refuse. **It must never report a verdict from an instrument it has not run.**"

[[requirements]]
id = "FE-18"
family = "FE"
n = 18
level = "must"
spec_line = 1850
text = "Local discovery MUST work on a LAN with no configuration, and membership MUST work transitively over a private overlay network."

[[requirements]]
id = "FE-19"
family = "FE"
n = 19
level = "must"
spec_line = 1853
text = "Shared state MUST converge by epidemic replication: a periodic round to a small random peer sample, three-phase digest/delta/response, last- writer-wins on timestamp."

[[requirements]]
id = "FE-20"
family = "FE"
n = 20
level = "must"
spec_line = 1857
text = "Replicated payloads MUST include at minimum member state, inference plans, knowledge plans, ledger entries, and ring configuration."

[[requirements]]
id = "FE-21"
family = "FE"
n = 21
level = "must"
spec_line = 1860
text = "Round-trip latency between members MUST be measured periodically and shared, as a smoothed estimate."

[[requirements]]
id = "FE-22"
family = "FE"
n = 22
level = "must"
spec_line = 1863
text = "Hardware capability MUST be detected, not configured, with a fallback chain across accelerator vendors."

[[requirements]]
id = "FE-23"
family = "FE"
n = 23
level = "must"
spec_line = 1866
text = "Reachability information a peer publishes MUST be **signed per-node with a monotonic version**, so an attacker past the admission gate cannot force a peer unreachable or downgrade its transport."

[[requirements]]
id = "FE-24"
family = "FE"
n = 24
level = "must"
spec_line = 1870
text = "Policy that must only ever tighten (such as an encryption requirement) MUST merge **stricter-wins**, not last-writer-wins."

[[requirements]]
id = "FE-25"
family = "FE"
n = 25
level = "must"
spec_line = 1875
text = "*How this node reaches a peer* MUST be decided in exactly one place: a seam resolving **(peer, traffic class) → ordered candidate endpoints**. Call sites keep their own clients and timeouts and append route paths."

[[requirements]]
id = "FE-26"
family = "FE"
n = 26
level = "must"
spec_line = 1879
text = "At least two transports MUST be supportable behind that seam: a conventional address-based one, and a **key-addressed encrypted** one that dials a peer by its public key with no address, bridging to the ordinary local listeners."

[[requirements]]
id = "FE-27"
family = "FE"
n = 27
level = "must"
spec_line = 1884
text = "A routing transport MUST concatenate a chosen transport's candidates ahead of a default, so a failed or absent dial degrades to the fallback **on the same request**, automatically. Success feedback MUST route back to the producing transport."

[[requirements]]
id = "FE-28"
family = "FE"
n = 28
level = "must"
spec_line = 1889
text = "Migration order between transports MUST be encoded by traffic class, not by configuration flags: control plane first, bulk transfer next, inference streaming last."

[[requirements]]
id = "FE-29"
family = "FE"
n = 29
level = "must"
spec_line = 1893
text = "Enablement MUST have three states — automatic (on only when the node is in a ring, so a solo node never contacts third-party infrastructure), explicitly on, and a kill switch."

[[requirements]]
id = "FE-30"
family = "FE"
n = 30
level = "must"
spec_line = 1897
text = "A self-hosted relay configuration MUST be possible, and a \"no third-party services at all\" posture MUST be achievable — noting that configuring one's own relay alone does not achieve it if name resolution still uses a third party. The honest posture MUST be documented per service."

[[requirements]]
id = "FE-31"
family = "FE"
n = 31
level = "must"
spec_line = 1902
text = "The transport MUST survive networks that block direct connections, by relaying over a common port, through an authenticating proxy if one is configured."

[[requirements]]
id = "FE-32"
family = "FE"
n = 32
level = "must"
spec_line = 1906
text = "What is **not** covered by the encrypted transport MUST be stated. Where raw traffic between compute processes stays outside the seam, the system MUST NOT claim blanket end-to-end encryption, and a surface-by-surface posture document MUST enumerate every listener, its default binding, its authentication, and the honest gaps."

[[requirements]]
id = "FE-33"
family = "FE"
n = 33
level = "must"
spec_line = 1914
text = "There MUST be exactly two listeners with two trust domains: a **client** surface reachable by peers and remote callers, and an **internal** surface carrying control-plane traffic."

[[requirements]]
id = "FE-34"
family = "FE"
n = 34
level = "invariant"
spec_line = 1918
text = "**Holding a dial string is not a credential.** A key-addressed endpoint accepts anyone, and the dial string is public — it rides in every invitation and is replicated as part of membership. What the handshake *does* prove is the dialer's key. The acceptor MUST therefore route on **(protocol selector, dialer identity)**, never on the protocol selector alone."

[[requirements]]
id = "FE-35"
family = "FE"
n = 35
level = "invariant"
spec_line = 1927
text = "**Which listener serves a route is the guard; \"is the caller local\" is not.** A bridging acceptor forwards by connecting to the local interface, so on every listener it feeds, a local peer address proves nothing."

[[requirements]]
id = "FE-36"
family = "FE"
n = 36
level = "must"
spec_line = 1936
text = "The client router MUST therefore be bound **more than once**, as distinct surfaces with distinct policies, at minimum:"

[[requirements]]
id = "FE-37"
family = "FE"
n = 37
level = "must"
spec_line = 1947
text = "A protocol selector that authenticates nothing MUST be **refused** for strangers rather than downgraded — there is no safe downgrade."

[[requirements]]
id = "FE-38"
family = "FE"
n = 38
level = "must"
spec_line = 1950
text = "Where a selector must remain open to non-members (because joining is how one becomes a member), that MUST be a stated, bounded, documented open edge with the sensitive routes guarded by their own predicates."

[[requirements]]
id = "FE-39"
family = "FE"
n = 39
level = "must"
spec_line = 1954
text = "A **guest grant** MUST be supported: short-lived, revocable, bound to a closed scope enumeration whose path list is the **only** route allow-list there is. A guest is not a member: no participation credential, no replication, no ability to mint further grants — because no scope variant names the control plane."

[[requirements]]
id = "FE-40"
family = "FE"
n = 40
level = "must"
spec_line = 1960
text = "The authorisation layer MUST NOT match on scope variants. It MUST ask the grant whether it permits the path, so adding a scope is a variant plus its path list and touches neither authorisation nor the wire (X-EX-5)."

[[requirements]]
id = "FE-41"
family = "FE"
n = 41
level = "invariant"
spec_line = 1964
text = "**A guest grant cannot be tested over the local interface**, and every such test passes for the wrong reason, because the local caller is admitted before any bearer is read. Guest-path acceptance MUST be proven on a genuine two-machine path."

[[requirements]]
id = "FE-42"
family = "FE"
n = 42
level = "must"
spec_line = 1969
text = "Grant minting MUST be available only on the operator surface. The internal surface has no per-request authentication, so a mint route there would let any peer forge guest credentials."

[[requirements]]
id = "FE-43"
family = "FE"
n = 43
level = "must"
spec_line = 1973
text = "Control-plane and administrative routes MUST be local-only, defended in **three layers**: router middleware, per-handler check, and a pinned test asserting the guard under the *production listener shape*."

[[requirements]]
id = "FE-44"
family = "FE"
n = 44
level = "must"
spec_line = 1982
text = "The client API MUST expose a chat-completion endpoint conforming to the prevailing third-party convention — the request and response shape unmodified third-party clients already speak — plus an embeddings endpoint, a model listing, a status summary, and a capability manifest. The choice of *which* convention is a compatibility requirement, not a design choice: pick the one the ecosystem's clients emit."

[[requirements]]
id = "FE-45"
family = "FE"
n = 45
level = "must"
spec_line = 1989
text = "The model listing MUST enumerate **names this node can dispatch by name**, built from the same source the name resolver uses — so a listed identifier resolves and an omitted one does not. It MUST carry residency and which nodes advertise each name."

[[requirements]]
id = "FE-46"
family = "FE"
n = 46
level = "should"
spec_line = 1996
text = "Compatibility shims for other prevailing client conventions SHOULD be provided as **pure translation** over the same handlers, with their current limitations documented in place."

[[requirements]]
id = "FE-47"
family = "FE"
n = 47
level = "must"
spec_line = 2000
text = "A knowledge search endpoint MUST determine target corpora, fan out, merge, and rerank."

[[requirements]]
id = "FE-48"
family = "FE"
n = 48
level = "must"
spec_line = 2003
text = "Requests carrying a local-only privacy requirement MUST be rejected at the federated endpoint rather than served remotely."

[[requirements]]
id = "FE-49"
family = "FE"
n = 49
level = "must"
spec_line = 2008
text = "The decision topology MUST be explicit and enumerable, with exactly one mechanism per decision:"

[[requirements]]
id = "FE-50"
family = "FE"
n = 50
level = "invariant"
spec_line = 2021
text = "A **hard** named target is a constraint: unknown MUST be an error, never a substitution. A **soft** configured preference is a preference: unknown MUST fall through to ranked selection with local as the last rung, and the fall-through MUST be recorded."

[[requirements]]
id = "FE-51"
family = "FE"
n = 51
level = "must"
spec_line = 2026
text = "A peer route that **fails** is not the same as an unknown name. Where the local node holds the same identifier and merely lost a tiebreak, a peer failure MUST be served locally. Where the peer was the sole holder, it MUST fail loudly. Serving the named identifier locally is *honouring* the name, not substituting for it."

[[requirements]]
id = "FE-52"
family = "FE"
n = 52
level = "must"
spec_line = 2032
text = "Every entry point MUST resolve through **one** route cascade; per-method code may build only the terminus."

[[requirements]]
id = "FE-53"
family = "FE"
n = 53
level = "must"
spec_line = 2038
text = "A resolved identifier MUST go on the wire, so a strictly- resolving peer cannot refuse the turn into a silent local substitution."

[[requirements]]
id = "FE-54"
family = "FE"
n = 54
level = "must"
spec_line = 2043
text = "Routing decisions MUST be **measurable**, not merely plumbed."

[[requirements]]
id = "FE-55"
family = "FE"
n = 55
level = "invariant"
spec_line = 2048
text = "**A product of dimensionless multipliers ranks; it does not predict.** No scoreboard is definable over it, and it cannot decline a hop that costs more than it buys. An objective with **units** — predicted time to answer, as named addends — can."

[[requirements]]
id = "FE-56"
family = "FE"
n = 56
level = "must"
spec_line = 2053
text = "Instrumentation MUST record one decision per decision point carrying: the whole candidate set, each score breakdown, **each input stamped with its provenance and age**, every candidate excluded before scoring and why, and the verdict — joined by identity to one outcome record per completion."

[[requirements]]
id = "FE-57"
family = "FE"
n = 57
level = "must"
spec_line = 2058
text = "Replay MUST group records by decision identity, **never by adjacency** — a live log interleaves requests — and MUST report a join rate to gate on."

[[requirements]]
id = "FE-58"
family = "FE"
n = 58
level = "must"
spec_line = 2062
text = "The decision MUST be extractable as a **pure total function** over a snapshot of what a decider believes, with time passed in rather than read. Asynchronous gathering above the line, deciding below it."

[[requirements]]
id = "FE-59"
family = "FE"
n = 59
level = "must"
spec_line = 2066
text = "A seeded discrete-event simulator SHOULD exist over that pure function, with independent random streams per concern so switching arms cannot perturb the world the arms are compared in, and with fidelity knobs defaulting inert so prior results still reproduce."

[[requirements]]
id = "FE-60"
family = "FE"
n = 60
level = "must"
spec_line = 2071
text = "Replay MUST split **scorer agreement** from **policy agreement**, running off independent inputs so one defect cannot cascade into the other. Both ratios MUST return zero on an empty denominator, never a vacuous one."

[[requirements]]
id = "FE-61"
family = "FE"
n = 61
level = "must"
spec_line = 2076
text = "A predictive objective MUST return either named addends or a typed **unpredictable** reason. It MUST NEVER default a rate: a guessed rate is a fabricated fact with a unit attached."

[[requirements]]
id = "FE-62"
family = "FE"
n = 62
level = "must"
spec_line = 2080
text = "*Unpredictable local* (therefore no hop) and *infeasible local* (therefore any feasible peer wins) MUST be distinct. Collapsing them points the decision in opposite directions."

[[requirements]]
id = "FE-63"
family = "FE"
n = 63
level = "must"
spec_line = 2084
text = "Capability MUST be a **filter, not a scoring term**. Candidates MUST be banded by a *relative* edge derived at runtime from what the decider currently knows — never an absolute threshold and never a table of model names — and a normal request MUST be served from the top band."

[[requirements]]
id = "FE-64"
family = "FE"
n = 64
level = "must"
spec_line = 2089
text = "Two quality hazards MUST be counted separately: a **downgrade** (served below the requester's own local capability — a real regression) and a **declined upgrade** (a stronger node was feasible). Both MUST be computable from decision records alone, so the identical function scores a production capture."

[[requirements]]
id = "FE-65"
family = "FE"
n = 65
level = "invariant"
spec_line = 2095
text = "**A ranking objective with no ties herds.** Once a filter makes candidates homogeneous, a deterministic objective sends everything to one node. A tie-breaking sampler over candidates **whose predictions are within noise** is a prerequisite, not a refinement — and what makes \"within noise\" expressible is that predictions have units."

[[requirements]]
id = "FE-66"
family = "FE"
n = 66
level = "invariant"
spec_line = 2101
text = "**A signal that can only describe peers you already chose cannot fix a cost that lives in the peers you did not.** Response-carried freshness measured at 4–7% coverage against a mechanism worth 9–22% at full coverage; coverage is a property of traffic density, not of wiring."

[[requirements]]
id = "FE-67"
family = "FE"
n = 67
level = "invariant"
spec_line = 2106
text = "**Do not wire a probe whose measurement does not describe the thing being scored.** A throughput probe run against a small model, then extrapolated to a large candidate on a linear size law, is a *measured regression* — decode is bandwidth-bound, the law is false, and a one-sided clamp means the error can only push large models down."

[[requirements]]
id = "FE-68"
family = "FE"
n = 68
level = "must"
spec_line = 2112
text = "A per-model measurement facility MUST exist for the human deciding whether to add a machine, and it MUST deliberately **not** feed the ranked dispatch. Same number, different consumer; the record must say so, so a later reader \"completing the wiring\" does not ship the regression."

[[requirements]]
id = "FE-69"
family = "FE"
n = 69
level = "must"
spec_line = 2117
text = "Where production is blind to a signal, the dead producers MUST be **deleted**, so the blindness is by construction rather than by accident, and so the as-shipped baseline measures the shipped system rather than a state it happens to be in."

[[requirements]]
id = "FE-70"
family = "FE"
n = 70
level = "must"
spec_line = 2124
text = "Where a model exceeds one node, the placement policy MUST apportion each device a **contiguous** range whose **bytes** — not unit count — are proportional to its memory."

[[requirements]]
id = "FE-71"
family = "FE"
n = 71
level = "must"
spec_line = 2131
text = "Ranges MUST stay contiguous, so single-stream decoding keeps its minimum hop count and a unit's parts are never scattered."

[[requirements]]
id = "FE-72"
family = "FE"
n = 72
level = "must"
spec_line = 2134
text = "The split the preview shows and the split the load executes MUST be **one function** (X-SD-1)."

[[requirements]]
id = "FE-73"
family = "FE"
n = 73
level = "must"
spec_line = 2137
text = "A pre-flight planner MUST exist that answers \"does this fit this fleet\" from metadata alone — no model load, no accelerator — reporting per device bytes held and whether each device *individually* fits."

[[requirements]]
id = "FE-74"
family = "FE"
n = 74
level = "must"
spec_line = 2141
text = "Per-device fit MUST be one decider used by both the preview and the load. Aggregate pooled memory is **not** sufficient: a cluster clearing the aggregate gate can still hand one device more than it has."

[[requirements]]
id = "FE-75"
family = "FE"
n = 75
level = "must"
spec_line = 2145
text = "The fit result MUST return **one row per device, fitting rows included** — a pass/fail return forces the preview to keep its own traversal, and a second traversal is the drift being removed."

[[requirements]]
id = "FE-76"
family = "FE"
n = 76
level = "must"
spec_line = 2149
text = "*Cannot judge* MUST be distinct from *pass* (X-EH-2): an unread metadata table would otherwise clear every device on the strength of zeros."

[[requirements]]
id = "FE-77"
family = "FE"
n = 77
level = "must"
spec_line = 2153
text = "An overflow refusal MUST be a **new** typed variant, not a reuse of \"insufficient cluster\" — pooling more memory does not fix an overflow, and the wrong message sends the operator looking for a peer that is already there. The refusal MUST advise *lowering* the headroom factor and MUST name the one legitimate override."

[[requirements]]
id = "FE-78"
family = "FE"
n = 78
level = "must"
spec_line = 2159
text = "An overflow MUST **park** rather than retry: it is not time-fixable, and the existing participant-change event is the only thing that could change the answer."

[[requirements]]
id = "FE-79"
family = "FE"
n = 79
level = "must"
spec_line = 2163
text = "The headroom factor MUST be operator-set through one resolution order, and the preview MUST default to that same resolution — so the preview's headroom is the one the load executes with."

[[requirements]]
id = "FE-80"
family = "FE"
n = 80
level = "must"
spec_line = 2167
text = "Liveness of a participant already resolved MUST be read from **membership**, not from a probe over the link that participant's own bulk traffic is saturating. Only unknown participants pay the full probe."

[[requirements]]
id = "FE-81"
family = "FE"
n = 81
level = "must"
spec_line = 2171
text = "A bridged endpoint's local port MUST be **stable across a peer's reachability change** — retarget in place, never rebuild — because that port *is* the participant's identity in the compute layer's device list."

[[requirements]]
id = "FE-82"
family = "FE"
n = 82
level = "must"
spec_line = 2179
text = "A measurement facility MUST **measure the configuration that is loaded and never load the one it wants to measure.** There must be no slot argument, therefore no slot to get wrong. An optional model argument is an **assertion**, verified against the resident configuration, failing loudly on mismatch."

[[requirements]]
id = "FE-83"
family = "FE"
n = 83
level = "must"
spec_line = 2185
text = "It MUST time real streamed responses at the frame level, so the number includes the actual distribution and transport path. Steady-state rate and time-to-first-token MUST be reported separately, never smeared."

[[requirements]]
id = "FE-84"
family = "FE"
n = 84
level = "must"
spec_line = 2189
text = "A rate the server does not report MUST render as *not available* — never estimated from character counts."

[[requirements]]
id = "FE-85"
family = "FE"
n = 85
level = "must"
spec_line = 2192
text = "The probe MUST be **fixed and versioned**. There MUST be no knob whose adjustment invalidates comparison against every prior record while looking like harmless tuning."

[[requirements]]
id = "FE-86"
family = "FE"
n = 86
level = "must"
spec_line = 2196
text = "Validity guards MUST exist and each MUST be earned by an observed false result. At minimum: which slot served it; per-frame timing; placement re-read after the run; participant liveness before **and** after; a warm-up; host survival; a minimum frame count; an inter-trial spread ceiling; and a terminal-reason check."

[[requirements]]
id = "FE-87"
family = "FE"
n = 87
level = "invariant"
spec_line = 2202
text = "**The obvious served-slot guard does nothing.** A response's model field is typically a verbatim echo of what the client requested. The real check MUST understand every hosting mode, including one where the in-process view reports the model as *not resident* for a perfectly healthy externally-hosted instance. States that mean \"something else is answering\" MUST NOT count as serving."

[[requirements]]
id = "FE-88"
family = "FE"
n = 88
level = "must"
spec_line = 2212
text = "A run tripping a guard MUST still be **written** — a discarded failure teaches nobody and makes the tool retry-until-lucky — but MUST never be returned by lookup."

[[requirements]]
id = "FE-89"
family = "FE"
n = 89
level = "must"
spec_line = 2216
text = "The key a record files under MUST be constructible identically by every consumer, derived from the same facts (only participants holding work; topology, not a mode string), or every record is unfindable."

[[requirements]]
id = "FE-90"
family = "FE"
n = 90
level = "must"
spec_line = 2220
text = "A record MUST carry the **pre-image of its own key**, so a reader can say what the number was *for*. The pre-image MUST be **checkable**: recomputing the key from the stored fields, with a mismatch treated as *absent* rather than quoted."

[[requirements]]
id = "FE-91"
family = "FE"
n = 91
level = "must"
spec_line = 2225
text = "A record MUST carry the **conditions** it met — co-resident work, memory before and after, uptime, wall-clock span — and these MUST sit **beside** the key and never in it. Keying on them gives every run a unique unmatched key and makes the variance the field exists to expose structurally invisible."

[[requirements]]
id = "FE-92"
family = "FE"
n = 92
level = "must"
spec_line = 2231
text = "An empty co-resident list MUST render as the *finding* \"nothing else was resident\", not as silence. An older record MUST say \"not recorded\", never imply a quiet machine."

[[requirements]]
id = "FE-93"
family = "FE"
n = 93
level = "should"
spec_line = 2235
text = "Measurements SHOULD travel between peers, because a measurement is worth most to the machine that did not take it. Three constraints make travel safe: - **Peer records never enter the local store.** Lookup answers only \"what did *this* machine measure\"; a peer's number is offered *beside* the local answer, never as it. - **Invalid runs do not travel.** A failure is diagnostic material for the operator who caused it and noise — or a mis-read capability claim — to everyone else. - **Origin comes from the transport envelope, not the payload.** A node must not be able to claim to be someone else by writing a name into bytes it controls."

[[requirements]]
id = "FE-94"
family = "FE"
n = 94
level = "must"
spec_line = 2247
text = "Values entering a content-derived key MUST be quantised to a precision the serialisation round-trip preserves, or the same run computes two keys and leaves an orphan the conflict resolution can never overwrite."

[[requirements]]
id = "FE-95"
family = "FE"
n = 95
level = "must"
spec_line = 2251
text = "Durable local write MUST precede publication, so the facility works with no daemon and a failed publish reads as \"not shared yet\", never as a lost record. Republication at start-up MUST restore the durable history, or every node's history evaporates one restart at a time while looking intact locally."

[[requirements]]
id = "FE-96"
family = "FE"
n = 96
level = "must"
spec_line = 2258
text = "Peer requests MUST pass an admission gate; local requests MUST admit unconditionally. Refusal MUST be a standard busy response with a retry hint."

[[requirements]]
id = "FE-97"
family = "FE"
n = 97
level = "must"
spec_line = 2262
text = "The gate MUST implement a runtime-mutable global ceiling (including zero = reject all) **plus a per-origin concurrency cap**, so one peer cannot consume the pool."

[[requirements]]
id = "FE-98"
family = "FE"
n = 98
level = "must"
spec_line = 2266
text = "Caps SHOULD be **reciprocity-scaled** from the contribution ledger: a contributor's effective cap rises toward the ceiling."

[[requirements]]
id = "FE-99"
family = "FE"
n = 99
level = "must"
spec_line = 2269
text = "There MUST be exactly one canonical wire form for an origin identifier, and exactly one parser. A display form MUST never be accepted as a wire form. A present-but-malformed value MUST still be gated and tallied, and the status surface MUST name the rejected raw value, when it was last seen, and the expected form."

[[requirements]]
id = "FE-100"
family = "FE"
n = 100
level = "must"
spec_line = 2275
text = "Traffic that names an origin and traffic that does not MUST be gated by **disjoint** mechanisms — one returning early when the other applies — so a request meets exactly one and is never double-gated."

[[requirements]]
id = "FE-101"
family = "FE"
n = 101
level = "must"
spec_line = 2279
text = "Principal resolution for unnamed traffic MUST have exactly one resolver: presented credential → credential fingerprint; else a declared identity from a local caller; else anonymous."

[[requirements]]
id = "FE-102"
family = "FE"
n = 102
level = "must"
spec_line = 2283
text = "The client-fairness share rule MUST take **no weight argument**, so weight-ordering unfairness is *unexpressible* rather than merely avoided. A single caller alone on the host MUST be untouched."

[[requirements]]
id = "FE-103"
family = "FE"
n = 103
level = "must"
spec_line = 2287
text = "The client-fairness gate MUST NOT be able to refuse on depth — that decision belongs to exactly one shedding mechanism — and MUST leave no waiter parked."

[[requirements]]
id = "FE-104"
family = "FE"
n = 104
level = "invariant"
spec_line = 2291
text = "**A gate keyed on the presence of an identifier is dark until every path stamps it.** Measured: four concurrent peer requests served with the in-flight counter never leaving zero, because federated inference never stamped the header. Pause, yield, and ceiling were all inoperative."

[[requirements]]
id = "FE-105"
family = "FE"
n = 105
level = "must"
spec_line = 2296
text = "A refusal produced by *this* gate MUST be exempted from peer health tracking — a busy response is a healthy peer declining, and booking it as a fault quarantines that peer."

[[requirements]]
id = "FE-106"
family = "FE"
n = 106
level = "must"
spec_line = 2300
text = "A peer that refuses with a stated retry delay MUST be excluded from candidacy for that delay, capped, and cleared by any success — **before** any manifest fetch, so a yielding peer costs nothing rather than a cheaper something."

[[requirements]]
id = "FE-107"
family = "FE"
n = 107
level = "must"
spec_line = 2308
text = "What a node **advertises** and what it **enforces** MUST come from one writer consulting the same predicates."

[[requirements]]
id = "FE-108"
family = "FE"
n = 108
level = "must"
spec_line = 2313
text = "Foreground yield MUST be bounded (X-ST-4). Every consumer parking on a level predicate MUST pair it with a deferral budget, and the override MUST be announced from inside the shared helper so no checkpoint can adopt the bound and forget to report it. The exit MUST be typed, so \"resuming — foreground idle\" cannot be printed after a cap override."

[[requirements]]
id = "FE-109"
family = "FE"
n = 109
level = "must"
spec_line = 2321
text = "A **contribution ledger** MUST be an append-only event log with pure aggregation into per-node totals. It MUST have **no balance, no exchange rate, and no ranking** — the units are incommensurable and MUST NOT be folded into one number."

[[requirements]]
id = "FE-110"
family = "FE"
n = 110
level = "must"
spec_line = 2326
text = "A pull-side transfer MUST be credited to the node that shipped the bytes, with the origin explicit in the schema."

[[requirements]]
id = "FE-111"
family = "FE"
n = 111
level = "must"
spec_line = 2329
text = "A separate **activity ledger** MUST answer \"what is *my* node doing, even as a ring of one\", recording resource work that never crosses a peer boundary, and MUST be **excluded from replication** (X-PV-5)."

[[requirements]]
id = "FE-112"
family = "FE"
n = 112
level = "must"
spec_line = 2333
text = "Where a surface does its work in-process and never crosses an accounting boundary, its slice MUST be **derived** from provenance already persisted, not written by a new path."

[[requirements]]
id = "FE-113"
family = "FE"
n = 113
level = "should"
spec_line = 2337
text = "Peer preferences (local-only, non-replicated affinity multipliers) SHOULD let a node de-prioritise a peer, applied at manifest advertisement so the peer's own scorer naturally routes elsewhere."

[[requirements]]
id = "FE-114"
family = "FE"
n = 114
level = "should"
spec_line = 2343
text = "Peers SHOULD be able to share the compute cost of building a corpus, partitioned into storage-proportional contiguous blocks over peers with compatible embedding capability, skipping zero-storage peers."

[[requirements]]
id = "FE-115"
family = "FE"
n = 115
level = "must"
spec_line = 2347
text = "A per-node storage budget MUST be enforced at exactly one place — the point where capacity is published — by clamping the advertised free capacity. Every scheduler then reads one value and the clamp self-enforces for both local installs and peer-driven distribution."

[[requirements]]
id = "FE-116"
family = "FE"
n = 116
level = "must"
spec_line = 2352
text = "Personal-scope sources MUST require an explicit grant (X-PV-8), gated by a **grantability marker** set only by the source builders that genuinely produce assistable content, so structurally-similar sources stay un-assistable."

[[requirements]]
id = "FE-117"
family = "FE"
n = 117
level = "must"
spec_line = 2357
text = "The allow-list MUST be enforced at **two** points: at enrolment and at each work-unit handout."

[[requirements]]
id = "FE-118"
family = "FE"
n = 118
level = "must"
spec_line = 2360
text = "After merge, a sample MUST be re-computed locally and compared against the peer-produced result, with the check reported in user-visible terms."

[[requirements]]
id = "FE-119"
family = "FE"
n = 119
level = "must"
spec_line = 2366
text = "A replicated namespaced key-value store MUST exist with last-writer-wins resolution, per-namespace isolation, and time-to-live garbage collection. Namespaces MUST be excludable from replication."

[[requirements]]
id = "FE-120"
family = "FE"
n = 120
level = "should"
spec_line = 2370
text = "A sandboxed application platform SHOULD exist over that store: a replicated manifest, a declared permission set, lifecycle management, and a reverse proxy."

[[requirements]]
id = "FE-121"
family = "FE"
n = 121
level = "must"
spec_line = 2374
text = "Application authorisation MUST derive the application identity from a host-set property the sandboxed code cannot spoof, checked fail-closed against the granted subset."
conditional_on = "FE-120"

[[requirements]]
id = "FE-122"
family = "FE"
n = 122
level = "must"
spec_line = 2378
text = "Application-facing operations MUST be **deterministic and read-only** where they present figures: no model may originate a number on this surface either (GR-22)."

[[requirements]]
id = "FE-123"
family = "FE"
n = 123
level = "must"
spec_line = 2382
text = "Application-facing data operations MUST be **backend-agnostic**, projecting different underlying representations into one data contract, so a new backend is an adapter and not a host change."

[[requirements]]
id = "FE-124"
family = "FE"
n = 124
level = "must"
spec_line = 2386
text = "The operations' **logic** MUST live in a host-independent library shared by the sandboxed host and any development server, so there is one source of truth."

[[requirements]]
id = "FE-125"
family = "FE"
n = 125
level = "must"
spec_line = 2390
text = "Where a precomputed artefact is served, it MUST be folded deterministically and MUST pass a **verbatim-citation audit** before it is served: every cited passage must resolve, every embedded quotation must be a verbatim substring of its passage. A failing artefact MUST NOT be served."

[[requirements]]
id = "FE-126"
family = "FE"
n = 126
level = "must"
spec_line = 2395
text = "Artefact caching MUST be keyed on a content fingerprint, with a schema version that forces a rebuild when a computation change must reach existing installs."

[[requirements]]
id = "FE-127"
family = "FE"
n = 127
level = "must"
spec_line = 2399
text = "Typed cards with absent data MUST produce absent cards, and **unknown card types MUST be skipped** — the forward-compatibility seam."

[[requirements]]
id = "FE-128"
family = "FE"
n = 128
level = "invariant"
spec_line = 2402
text = "Where a parsed structure is a **subset** of its source, that MUST be documented at the type and honoured: anything reasoning about *shape* must read the complete unit list, not the parsed subset."

[[requirements]]
id = "FE-129"
family = "FE"
n = 129
level = "must"
spec_line = 2410
text = "Where several presentations show a clock, the offset MUST be inferred **once per build** and handed to every presentation. Two inferring separately is two chances to disagree in front of the reader — which shipped."

[[requirements]]
id = "FE-130"
family = "FE"
n = 130
level = "must"
spec_line = 2414
text = "Distribution MUST be self-contained artefacts with integrity verification refusing tampering, plus curation. Trust = integrity + curation."

[[requirements]]
id = "FE-131"
family = "FE"
n = 131
level = "must"
spec_line = 2417
text = "Where the sandbox platform cannot gate host operations per-window, this MUST be stated as an **isolation caveat** and untrusted third-party applications MUST NOT be admitted until a genuine isolation boundary exists."

[[requirements]]
id = "FE-132"
family = "FE"
n = 132
level = "must"
spec_line = 2424
text = "Peers MUST be able to transfer model artefacts and corpus shards directly, in both push and pull directions, with range requests supported so a participant can fetch only the portion it needs."

[[requirements]]
id = "FE-133"
family = "FE"
n = 133
level = "must"
spec_line = 2428
text = "A host preparing a distributed load MUST be able to ask a participant to seed its portion **before** the load begins, and MUST distribute only to participants that pass an eligibility profile — a settling period plus quarantine on instability, surfaced to the operator."

[[requirements]]
id = "FE-134"
family = "FE"
n = 134
level = "must"
spec_line = 2433
text = "Because a participant fault aborts the whole computation, distributed inference MUST require host supervision. This MUST be stated, not assumed."

[[requirements]]
id = "FE-135"
family = "FE"
n = 135
level = "must"
spec_line = 2437
text = "Where a topology stratifies into anchors (holding the split) and consumers, anchors MUST advertise their anchor profile, and the candidate filter MUST exclude non-anchors so a casual peer never joins the split. Anchors MUST get the stricter eligibility profile."

[[requirements]]
id = "FE-136"
family = "FE"
n = 136
level = "must"
spec_line = 2442
text = "A participant **leaving** MUST trigger an immediate re-plan (prune before the compute layer aborts), while pure additions keep a debounce. Shrink-fast, grow-slow."

[[requirements]]
id = "FE-137"
family = "FE"
n = 137
level = "must"
spec_line = 2446
text = "Host election MUST be re-evaluated each cycle over replicated membership, with a pinned host winning while eligible, and the elected host MUST be published so a soak test can assert a **no-split-brain** invariant."

[[requirements]]
id = "FE-138"
family = "FE"
n = 138
level = "must"
spec_line = 2450
text = "Split-brain during convergence MUST be bounded by the eligibility settle plus a quorum gate, with consumers falling back locally."

[[requirements]]
id = "FE-139"
family = "FE"
n = 139
level = "must"
spec_line = 2453
text = "Managed subordinate processes MUST have an explicit lifecycle state machine (starting / running / unhealthy / failed / stopped), graceful termination with a timeout before forced termination, periodic health polling with a sampled latency window and an unresponsive threshold, a **graceful departure** countdown state machine (announced → rebalancing → draining → complete), and a fault detector collapsing health changes into events."

[[requirements]]
id = "FE-140"
family = "FE"
n = 140
level = "must"
spec_line = 2460
text = "A deterministic in-process test harness MUST be able to orchestrate many simulated nodes, each with its own state and listeners, with a fluent hardware-profile builder and a mock model server that counts requests. Integration coverage MUST include formation, convergence, assignment, end-to-end inference, fault recovery, graceful pause and resume, capability routing, multi-model portfolios, knowledge fan-out, and ledger accuracy — with **deterministic timing and no real waits**."

[[requirements]]
id = "FE-141"
family = "FE"
n = 141
level = "should"
spec_line = 2468
text = "Rented or ephemeral compute pods SHOULD be able to join as inference participants scored by the same balancer, under a **separate trust model**: not replicated, owner-private, transport-pinned, and authenticated by their own credential."

[[requirements]]
id = "GR-1"
family = "GR"
n = 1
level = "must"
spec_line = 1511
text = "A grounded answer path MUST verify the draft's claims before release."

[[requirements]]
id = "GR-2"
family = "GR"
n = 2
level = "invariant"
spec_line = 1513
text = "**The evidence universe is the load-bearing design decision.** Verification MUST run against the *sealed corpus* — per-claim search over the source of record — not merely against the prompt's snapshot of it. Failed claims' corrective passages MUST feed the repair, replacing rather than deleting."

[[requirements]]
id = "GR-3"
family = "GR"
n = 3
level = "invariant"
spec_line = 1521
text = "**The widening must be complete.** Every mechanism inside the gate MUST see the same evidence universe the drafter saw. One universe built once, then narrowed differently for three consumers, is non-conforming."

[[requirements]]
id = "GR-4"
family = "GR"
n = 4
level = "must"
spec_line = 1531
text = "Any window bound inside the gate MUST be *derived* from the retrieved set, not a constant. Where a constant no longer governs anything, it MUST be removed rather than left as a knob."

[[requirements]]
id = "GR-5"
family = "GR"
n = 5
level = "must"
spec_line = 1535
text = "The gate MUST be a ladder with named stages: hold → verify → short-answer corrective retry, or per-claim audit → **mark** for long form → grounded abstention. It MUST fail open on judge failure, and the fail-open MUST be recorded."

[[requirements]]
id = "GR-6"
family = "GR"
n = 6
level = "invariant"
spec_line = 1540
text = "**Marking discharges the grounding function completely.** A long-form draft whose audit found failures MAY be released with those claims marked, because *nothing is regenerated*: the released text is the audited draft, and each failed claim rides out as a holding that flips the turn's epistemic verdict. Re-synthesis discharges a presentation preference, at a measured cost of tens of seconds per repaired turn."

[[requirements]]
id = "GR-7"
family = "GR"
n = 7
level = "must"
spec_line = 1547
text = "Where a repair path and its re-audit are both disabled, they MUST be one switch. A configuration reaching \"rewrite on, re-audit off\" MUST be unreachable."

[[requirements]]
id = "GR-8"
family = "GR"
n = 8
level = "must"
spec_line = 1553
text = "A disabled path that fires MUST be **visible in the product**, not inferred from a flag: the stage record MUST reflect the branch actually taken (X-OB-4)."

[[requirements]]
id = "GR-9"
family = "GR"
n = 9
level = "must"
spec_line = 1557
text = "Judge prompts MUST be byte-pinned to the calibration harness, so a calibrated operating point transfers."

[[requirements]]
id = "GR-10"
family = "GR"
n = 10
level = "must"
spec_line = 1560
text = "The claim-search interface MUST be structurally unable to widen *corpus* scope. It may widen within the seal; it may never leave it."

[[requirements]]
id = "GR-11"
family = "GR"
n = 11
level = "must"
spec_line = 1565
text = "A released citation MUST name where its quote came from at structural granularity (ST-23)."

[[requirements]]
id = "GR-12"
family = "GR"
n = 12
level = "invariant"
spec_line = 1568
text = "**Only an exact match may carry a location, and it must release the source's own characters, not the model's copy of them.** Handing back the source span makes \"a labelled quote survives the strict re-check\" structural rather than re-derived: a substring of a passage cannot be demoted by a check that looks for substrings of passages (X-PR-7)."

[[requirements]]
id = "GR-13"
family = "GR"
n = 13
level = "must"
spec_line = 1574
text = "A partial or cross-passage match MUST still ground and MUST still release the model's span — it just ships without a location."

[[requirements]]
id = "GR-14"
family = "GR"
n = 14
level = "must"
spec_line = 1577
text = "Location labels MUST sit **outside** the quotation marks, because the post-hoc verifier reads what is between them as source text."

[[requirements]]
id = "GR-15"
family = "GR"
n = 15
level = "must"
spec_line = 1580
text = "Location labels MUST NOT be folded into whatever set the citation-attribution check counts as grounded. Adding them there quietly loosens a fabrication guard."

[[requirements]]
id = "GR-16"
family = "GR"
n = 16
level = "must"
spec_line = 1584
text = "Locations MUST be computed inside the same filtering and reordering that produces the evidence list, never resolved at a call site — a misaligned location names the wrong place with full confidence."

[[requirements]]
id = "GR-17"
family = "GR"
n = 17
level = "must"
spec_line = 1588
text = "Citation minting SHOULD go through one door that refuses a quote the sealed member does not hold verbatim, and refuses a quote whose granularity may not be quoted (X-PR-2). A drop MUST be a named refusal value, not a silent filter."

[[requirements]]
id = "GR-18"
family = "GR"
n = 18
level = "must"
spec_line = 1593
text = "The set of emitted citation records MUST be **projected from** the released answer, not maintained as a second list that agrees by hand (X-SD-1)."

[[requirements]]
id = "GR-19"
family = "GR"
n = 19
level = "invariant"
spec_line = 1598
text = "**The post-synthesis guard verifies the turn's evidence, not the prompt's rendering of it.** The verifier MUST receive the untruncated passages *in addition to* whatever the prompt contained, so the source set is a strict superset and the change can only remove false demotions."

[[requirements]]
id = "GR-20"
family = "GR"
n = 20
level = "must"
spec_line = 1610
text = "The prompt budget constant MUST NOT be raised to \"fix\" this class. It is a decision about how much of each passage the synthesis model reads, and it re-prices every turn."

[[requirements]]
id = "GR-21"
family = "GR"
n = 21
level = "must"
spec_line = 1614
text = "The composite-quote catch MUST be preserved: a spliced quote is non-contiguous in any passage under any normalisation."

[[requirements]]
id = "GR-22"
family = "GR"
n = 22
level = "invariant"
spec_line = 1619
text = "**The model never originates a number.** Where a corpus declares an authoritative typed source, this MUST be enforced three ways: the model narrates only compact figures the tool emitted; any derivation is appended **verbatim as rendered by the system**, not by the model; and a deterministic audit value-matches every figure in the prose against the tool's outputs."

[[requirements]]
id = "GR-23"
family = "GR"
n = 23
level = "must"
spec_line = 1625
text = "The audit MUST cover bare numerals, not only currency and percentage forms, where the domain produces them — declared as an opt-in on the tool's own output with an explicit allowed-token set."

[[requirements]]
id = "GR-24"
family = "GR"
n = 24
level = "must"
spec_line = 1629
text = "The audit MUST also run on **refusal** turns: a model reciting a figure from parametric memory over a refusal must be caught."

[[requirements]]
id = "GR-25"
family = "GR"
n = 25
level = "must"
spec_line = 1632
text = "On violation the narration MUST be **withheld** and replaced by the tool's own verbatim rendering, naming each untraceable numeral. Zero unattributable numerals by construction, not by model compliance (X-ST-2)."

[[requirements]]
id = "GR-26"
family = "GR"
n = 26
level = "must"
spec_line = 1636
text = "A user-facing export MUST exist that writes the underlying figures so a third party can independently re-derive the totals."

[[requirements]]
id = "GR-27"
family = "GR"
n = 27
level = "invariant"
spec_line = 1641
text = "**The audit MUST bind to the answer exit on every dispatch surface, not to a routing decision.** Arming MUST be corpus-granular, derived from tools' own declarations of the domains they are authoritative for, and triggered by the retrieved-evidence pool intersecting a declared domain."

[[requirements]]
id = "GR-28"
family = "GR"
n = 28
level = "must"
spec_line = 1646
text = "The allowed basis for an armed turn MUST be: figures the tool emitted, ∪ numerals inside verified verbatim spans, ∪ numerals the user's own question contained."

[[requirements]]
id = "GR-29"
family = "GR"
n = 29
level = "must"
spec_line = 1650
text = "An armed streaming turn MUST force hold mode, so no token is released before the audit, and MUST skip any post-stream refinement rewrite."

[[requirements]]
id = "GR-30"
family = "GR"
n = 30
level = "must"
spec_line = 1653
text = "Corpora declaring nothing MUST be structurally untouched: empty intersection, no metadata, byte-identical delivery."

[[requirements]]
id = "GR-31"
family = "GR"
n = 31
level = "invariant"
spec_line = 1656
text = "**The same emptiness that is a no-op per corpus is a DEFECT per surface.** Arming reads the tool registry of the process serving the turn. A surface that can *install* an authoritative corpus but does not *register* the tool declaring authority over it will never arm and will answer ungrounded — while every gate stays green, because the gates run in processes that do register it."

[[requirements]]
id = "GR-32"
family = "GR"
n = 32
level = "must"
spec_line = 1666
text = "Registration on an install-capable surface MUST therefore be **unconditional** — never gated on user tool configuration — and pinned by a source census."

[[requirements]]
id = "GR-33"
family = "GR"
n = 33
level = "must"
spec_line = 1670
text = "Coverage MUST be **code**: an exhaustive per-intent table with three dispositions (covered / no-op by construction / excluded by decision), pinned by test, with non-intent-keyed exits dispositioned explicitly."

[[requirements]]
id = "GR-34"
family = "GR"
n = 34
level = "must"
spec_line = 1674
text = "Which corpora a tool is authoritative *for* MUST have exactly one implementation, keyed on the corpus's own declaration plus the presence of the typed source — **never on the identifier's spelling** (X-SD-3). The tool's claim index and any user-facing coverage surface MUST resolve through it, so a corpus cannot be answerable by one and invisible to the other."

[[requirements]]
id = "GR-35"
family = "GR"
n = 35
level = "must"
spec_line = 1682
text = "A user-facing **coverage card** MUST derive, from the same source the tool answers from: what the corpus answers, over what period, as of which version, and its named structural limits."

[[requirements]]
id = "GR-36"
family = "GR"
n = 36
level = "invariant"
spec_line = 1686
text = "Three properties MUST be structural rather than remembered: - the card type MUST carry no coverage ratio, and MUST NOT carry the counts from which one could be computed; - a declared limit MUST carry no severity field, so no renderer can style a refusal as a fault; - capability and boundary MUST share one presentation rule, so neither can be demoted to fine print without visibly demoting the other."

[[requirements]]
id = "GR-37"
family = "GR"
n = 37
level = "must"
spec_line = 1695
text = "Nothing in the derivation or the presentation may name a specific subject, so a second installed instance renders truthfully with no new copy written."

[[requirements]]
id = "GR-38"
family = "GR"
n = 38
level = "must"
spec_line = 1699
text = "The demand-side question — *of the things people actually ask for, how many miss for a reason we could fix* — SHOULD be answerable from logs a run already produced, with **no new store and no cadence**. It MUST be emitted from the single covering entry point rather than from individual outcome branches, because that is what makes the *denominator* answerable at all."

[[requirements]]
id = "GR-39"
family = "GR"
n = 39
level = "must"
spec_line = 1705
text = "A miss MUST count as fixable only under a declared membership test against the corpus's own coverage sidecar; everything else reports *unclassified* and never enters the numerator. A store-level source limitation cannot classify an individual ask."

[[requirements]]
id = "GR-40"
family = "GR"
n = 40
level = "must"
spec_line = 1710
text = "Zero asks MUST exit with a named reason, never score zero (X-EH-3)."

[[requirements]]
id = "GR-41"
family = "GR"
n = 41
level = "must"
spec_line = 1712
text = "A cross-language log contract MUST be pinned on **both** sides: the emitter by a grep-able anchor, and the reader by a test that renders a real event through a real formatter and parses it."

[[requirements]]
id = "GR-42"
family = "GR"
n = 42
level = "must"
spec_line = 1720
text = "On streaming surfaces the gate MUST narrate itself — check start, per-claim verdict, revision start, check complete — over a channel that **drops on full and never applies backpressure**."

[[requirements]]
id = "GR-43"
family = "GR"
n = 43
level = "must"
spec_line = 1724
text = "Every narration element MUST be frame-driven. The interface MUST NOT invent progress, and retrieval-only signal MUST be provisional: the moment tokens stream with no gate signal, the display MUST yield."

[[requirements]]
id = "GR-44"
family = "GR"
n = 44
level = "must"
spec_line = 1728
text = "A quiet **verification receipt** MUST persist on the delivered message, for release actions only, never for fail-open verdicts."

[[requirements]]
id = "GR-45"
family = "GR"
n = 45
level = "must"
spec_line = 1731
text = "Persisted metadata MUST be returned verbatim across every surface boundary, so a live answer carries the same provenance a reloaded one does."

[[requirements]]
id = "GR-46"
family = "GR"
n = 46
level = "must"
spec_line = 1736
text = "An answer MUST be a typed object carrying per-claim provenance, an overall verdict, and — where the answer is incomplete — a conjecture about what is missing and how it could be acquired."

[[requirements]]
id = "GR-47"
family = "GR"
n = 47
level = "must"
spec_line = 1740
text = "A turn with marked claims MUST carry a **mixed** verdict, rendered under the answer."

[[requirements]]
id = "GR-48"
family = "GR"
n = 48
level = "must"
spec_line = 1743
text = "There MUST be exactly one judge of \"did we answer\". A second judge MUST NOT be minted."

[[requirements]]
id = "GR-49"
family = "GR"
n = 49
level = "must"
spec_line = 1748
text = "Where two mechanisms (an incumbent and a replacement) both run, the system MUST be able to say **which one spent the turn**, per stage, with a closed set of owners including a *shared* owner for work belonging to neither."

[[requirements]]
id = "GR-50"
family = "GR"
n = 50
level = "must"
spec_line = 1752
text = "Per-**call** attribution MUST be available where per-stage is insufficient, through **one funnel every model call in the region passes**, tagged with a closed mechanism set, enforced structurally (X-ST-3)."

[[requirements]]
id = "GR-51"
family = "GR"
n = 51
level = "must"
spec_line = 1756
text = "Per-call rows MUST NOT be folded into the per-stage ledger — doing so would saturate the unattributed residual to zero and destroy the detector (X-OB-3)."

[[requirements]]
id = "GR-52"
family = "GR"
n = 52
level = "must"
spec_line = 1760
text = "An empty call list MUST be resolved by comparing summed durations against the stage's own wall clock, never read as a free turn."

[[requirements]]
id = "GR-53"
family = "GR"
n = 53
level = "must"
spec_line = 1763
text = "Test runs MUST NOT append to the production record stream. The record MUST still be *built* under test; only the write is suppressed."

[[requirements]]
id = "IN-1"
family = "IN"
n = 1
level = "must"
spec_line = 983
text = "The system MUST host local models in named **residency slots** by role — at minimum a fast/low-latency slot, a primary/high-capability slot, a code slot, and an embedding slot — with lazy loading."

[[requirements]]
id = "IN-2"
family = "IN"
n = 2
level = "must"
spec_line = 987
text = "Slots MUST be able to alias one another so a single resident copy serves several roles, and the resolution order for an alias MUST have one decider."

[[requirements]]
id = "IN-3"
family = "IN"
n = 3
level = "must"
spec_line = 991
text = "Remote and hybrid providers MUST be supported behind the same interface as local ones, so a deployment can mix local and remote capacity, with failover."

[[requirements]]
id = "IN-4"
family = "IN"
n = 4
level = "must"
spec_line = 995
text = "Model selection per hardware class MUST be data (X-EX-4)."

[[requirements]]
id = "IN-5"
family = "IN"
n = 5
level = "must"
spec_line = 997
text = "The system MUST report, per slot: which model is resident, whether it is resident or cold, and whether it is running in a degraded substitute form. **Cold is not an outage** and MUST be reported distinctly."

[[requirements]]
id = "IN-6"
family = "IN"
n = 6
level = "should"
spec_line = 1003
text = "The system SHOULD serve models exceeding accelerator memory by placing selected tensors on host memory."

[[requirements]]
id = "IN-7"
family = "IN"
n = 7
level = "must"
spec_line = 1006
text = "The local-fit gate MUST NOT charge for bytes that never reach the accelerator. It MUST obtain the host-resident byte count from the engine's own projection, and MUST NOT condition that discount on a related-but-different setting."
conditional_on = "IN-6"

[[requirements]]
id = "IN-8"
family = "IN"
n = 8
level = "must"
spec_line = 1014
text = "A placement that happens to work because of an unsupported-operation fallback is an **accident, not a declaration**. It MUST be recorded as such, with the lever that would make it structural named and its enabling condition ledgered (X-CF-2)."
conditional_on = "IN-6"

[[requirements]]
id = "IN-9"
family = "IN"
n = 9
level = "should"
spec_line = 1019
text = "Where an architecture's prefill cost is bounded by a per-token constant rather than by batch width, this MUST be established by pre-registered sweeps before effort is spent optimising the wrong axis, and the negative result MUST be recorded so it is not re-attempted."

[[requirements]]
id = "IN-10"
family = "IN"
n = 10
level = "should"
spec_line = 1026
text = "The system SHOULD support running a slot's computation in a supervised child process, so that a fatal fault in the numerical engine kills only the child while the host keeps serving its control plane, gossip, and status surfaces, and observes the exit as an event it re-plans around."

[[requirements]]
id = "IN-11"
family = "IN"
n = 11
level = "must"
spec_line = 1031
text = "The value of the process boundary is **crash isolation and the distributed case, not throughput.** A measured result MUST be recorded: for a model that fits one accelerator, N process replicas *lose* to in-process multi-sequence batching. The replica-pool path MUST NOT be presented as a parallelism strategy."
conditional_on = "IN-10"

[[requirements]]
id = "IN-12"
family = "IN"
n = 12
level = "must"
spec_line = 1037
text = "The child MUST speak a lossless native protocol carrying the request verbatim, so constrained generation, sampling modes, and allow-lists survive the boundary. A lossy translation is non-conforming."
conditional_on = "IN-10"

[[requirements]]
id = "IN-13"
family = "IN"
n = 13
level = "must"
spec_line = 1042
text = "Where a distributed model is hosted in a child, the host MUST withhold the model entirely from any in-process path, so nothing can lazily load a second copy."

[[requirements]]
id = "IN-14"
family = "IN"
n = 14
level = "must"
spec_line = 1046
text = "Where a host plans a distribution and a child executes it, the **plan** MUST be shipped, not merely the participant list. A child that re-plans against post-warm resource state will cut the work differently, miss every warm cache, and fall back to bulk transfer."

[[requirements]]
id = "IN-15"
family = "IN"
n = 15
level = "must"
spec_line = 1051
text = "A change in the participant set MUST be handled by kill-and- respawn, not by in-place reload, unless in-place reload is proven safe against the fault it exists to survive."

[[requirements]]
id = "IN-16"
family = "IN"
n = 16
level = "must"
spec_line = 1055
text = "While a distributed cluster is re-forming, requests for distributed-class work MUST fail fast with a typed unavailability and cascade to alternatives — never silently fall back to a local load of a model far too large for the machine."

[[requirements]]
id = "IN-17"
family = "IN"
n = 17
level = "must"
spec_line = 1064
text = "Where a model architecture is known to fault on a given compute backend, the system MUST detect this **before loading weights** — from model metadata alone — and MUST substitute a safe alternative discovered alongside it, surfacing a non-fatal notice. Where no safe alternative exists, start-up MUST fail with a clear in-application message rather than a native crash."

[[requirements]]
id = "IN-18"
family = "IN"
n = 18
level = "must"
spec_line = 1071
text = "A pre-load smoke test in a subprocess MUST guard the remaining path, and a native crash MUST produce a durable, user-submittable record."

[[requirements]]
id = "IN-19"
family = "IN"
n = 19
level = "must"
spec_line = 1074
text = "Crash records MUST be local-first and never auto-uploaded (X-PV-6), with a redacted export the user can review and send deliberately."

[[requirements]]
id = "IN-20"
family = "IN"
n = 20
level = "should"
spec_line = 1079
text = "The system SHOULD serve inline code completion (fill-in-the- middle ghost text) and **next-edit prediction** (after repeated similar edits, propose the remaining sites as a tab-through queue)."

[[requirements]]
id = "IN-21"
family = "IN"
n = 21
level = "must"
spec_line = 1083
text = "These are **two lanes on one slot**. A failed capability probe for one lane MUST withhold only that lane, leaving the other served."
conditional_on = "IN-20"

[[requirements]]
id = "IN-22"
family = "IN"
n = 22
level = "must"
spec_line = 1089
text = "Next-edit prediction MUST have a **deterministic rule lane** (pure induction from observed edits, no model) as well as any model lane. Rule kinds MUST render through one shared representation so that site finding, the already-applied exclusion, thresholds, and the queue are shared — new inductions, not new pipelines."

[[requirements]]
id = "IN-23"
family = "IN"
n = 23
level = "must"
spec_line = 1095
text = "The objective MUST be **\"most useful at each level of wrong\"**, not \"maximise useful fires\". A user does not accept a wrong edit. Any metric that counts partial successes in full is rewarding fan-out and MUST be paired with a precision metric over the individual proposals."

[[requirements]]
id = "IN-24"
family = "IN"
n = 24
level = "must"
spec_line = 1100
text = "Site selection heuristics that are proven on some languages MUST be an explicit allow-list, and adding a language MUST require a measurement."

[[requirements]]
id = "IN-25"
family = "IN"
n = 25
level = "must"
spec_line = 1106
text = "All policy MUST live on the serving side, so editor integrations stay thin."

[[requirements]]
id = "IN-26"
family = "IN"
n = 26
level = "must"
spec_line = 1109
text = "An episode MUST be recordable as **metadata only** (X-PV-7), joined to what the developer actually did with the suggestion — accepted, dismissed, diverged, superseded. **Diverged MUST NOT be folded into dismissed**, and an unreported episode MUST count as *unknown*, never as a dismissal (X-EH-2)."

[[requirements]]
id = "IN-27"
family = "IN"
n = 27
level = "must"
spec_line = 1115
text = "Outcome reporting MUST add zero user-visible surface: fire-and-forget, short deadline, every failure swallowed including an older-server rejection."

[[requirements]]
id = "IN-28"
family = "IN"
n = 28
level = "must"
spec_line = 1119
text = "The local record layer MUST be feature-agnostic: file layout, rotation, size cap, retention, and a multi-level off-switch MUST live in one generic mechanism with one enabling decider. A second record stream MUST be a declaration plus types, touching no dispatch on stream names."

[[requirements]]
id = "IN-29"
family = "IN"
n = 29
level = "must"
spec_line = 1126
text = "A model MUST publish one **capability claim** per kind of work it does well, carrying at minimum a work-kind tag, an affinity, and a latency class. The tag vocabulary MUST be standardised at its core with an open extension namespace (X-EX-2)."

[[requirements]]
id = "IN-30"
family = "IN"
n = 30
level = "must"
spec_line = 1131
text = "Schedulers MUST score requests against claims using one shared composed scoring function with protocol-level and per-scheduler operational adjustments. There MUST be exactly one implementation of the composition (X-SD-1)."

[[requirements]]
id = "IN-31"
family = "IN"
n = 31
level = "must"
spec_line = 1136
text = "Call sites MUST declare a **workload requirement bundle**, not a slot literal. Fast-versus-primary MUST be an emergent scoring outcome, with the local node treated as the degenerate one-node fleet."

[[requirements]]
id = "KA-1"
family = "KA"
n = 1
level = "must"
spec_line = 506
text = "The system MUST provide a staged acquisition pipeline with, at minimum, these separable stages: **acquire** (obtain bytes), **extract** (bytes → documents), **filter** (drop documents by predicate), **segment** (documents → retrievable passages), **embed** (passages → vectors), **index** (persist for retrieval)."

[[requirements]]
id = "KA-2"
family = "KA"
n = 2
level = "must"
spec_line = 512
text = "Each stage MUST be an extension point (X-EX-2) with a registry, so a new acquirer, extractor, filter, or segmenter is an implementation plus a declaration."

[[requirements]]
id = "KA-3"
family = "KA"
n = 3
level = "must"
spec_line = 516
text = "A whole pipeline MUST be configurable by a single declarative **source specification** (X-EX-4) that names the stage implementations and their parameters. The specification MUST be authorable by a domain expert with no programming knowledge."

[[requirements]]
id = "KA-4"
family = "KA"
n = 4
level = "must"
spec_line = 521
text = "The pipeline MUST NOT itself embed text or run a generative model. Both capabilities MUST be *injected* by the caller as opaque functions, so the acquisition layer has no dependency on any inference runtime and can be driven by a local engine, a remote endpoint, or a test stub without modification."

[[requirements]]
id = "KA-5"
family = "KA"
n = 5
level = "must"
spec_line = 527
text = "Built-in acquirers MUST cover at minimum: bulk archive download, dataset-repository fetch, local file and directory, parameterised REST API, and web crawl. A runtime-registered custom acquirer seam MUST exist for sources needing bespoke logic (multi-step resolution, authentication, format negotiation)."

[[requirements]]
id = "KA-6"
family = "KA"
n = 6
level = "must"
spec_line = 533
text = "Built-in extractors MUST cover at minimum: structured markup archives, line-delimited and nested JSON, markup documents with and without section detection, delimited text, columnar binary formats, plain text, source code, electronic mail with attachments, conversational exports from at least two major assistant vendors, and a dispatcher for binary payloads that routes by content type to sub-extractors."

[[requirements]]
id = "KA-7"
family = "KA"
n = 7
level = "must"
spec_line = 540
text = "Filters MUST be composable with explicit any/all semantics."

[[requirements]]
id = "KA-8"
family = "KA"
n = 8
level = "must"
spec_line = 542
text = "Segmenters MUST cover at minimum: paragraph, sentence, fixed-size, semantically-clustered, whole-document pass-through, and at least one turn-aware segmenter for conversational content."

[[requirements]]
id = "KA-9"
family = "KA"
n = 9
level = "must"
spec_line = 546
text = "At least one extractor MUST be **deterministic and typed**: producing structured entity records from structured input (tabular, columnar) with no model in the loop, so that a class of corpora exists whose facts are never model-originated."

[[requirements]]
id = "KA-10"
family = "KA"
n = 10
level = "must"
spec_line = 553
text = "The specification schema MUST be open. A domain expert MUST be able to author a specification for a new source, test it, and publish it, without touching the system's code."

[[requirements]]
id = "KA-11"
family = "KA"
n = 11
level = "must"
spec_line = 557
text = "Specifications MUST support declared **parameters** (typed, with defaults and required flags) resolved and validated at install time — so one specification serves many instances (one per company, per jurisdiction, per dataset slice)."

[[requirements]]
id = "KA-12"
family = "KA"
n = 12
level = "must"
spec_line = 562
text = "Where a specification produces one installed instance at a time, installing a second MUST refuse or replace *explicitly*, naming both, and MUST record which instance is resident. Two paths that can produce instances of the same family MUST use disjoint identifier namespaces."

[[requirements]]
id = "KA-13"
family = "KA"
n = 13
level = "must"
spec_line = 567
text = "The parameterised REST acquirer MUST support URL templating, several pagination strategies, following document links discovered in responses with bounded concurrency, and rate limiting."

[[requirements]]
id = "KA-14"
family = "KA"
n = 14
level = "must"
spec_line = 571
text = "Section-extracting extractors MUST emit a **miss report** sidecar naming what they expected and did not find, so a specification author can debug a source they cannot see."

[[requirements]]
id = "KA-15"
family = "KA"
n = 15
level = "must"
spec_line = 575
text = "The system MUST provide a specification **catalogue** with: a bundled offline snapshot (so the system works with no network), an optional live refresh, integrity verification of fetched entries, and a resolution order of local override → remote → bundled. There MUST be exactly one authoritative copy of the catalogue in the source tree."

[[requirements]]
id = "KA-16"
family = "KA"
n = 16
level = "must"
spec_line = 581
text = "A specification lifecycle surface MUST exist: validate, test, publish, list."

[[requirements]]
id = "KA-17"
family = "KA"
n = 17
level = "must"
spec_line = 584
text = "A **verdict ladder** MUST separate judgment-free stage observation from pass/fail policy, so the observation layer is reusable and the policy layer is the only place a bar lives."

[[requirements]]
id = "KA-18"
family = "KA"
n = 18
level = "should"
spec_line = 588
text = "An assisted authoring loop SHOULD exist in which a model drafts and iterates a specification against real fetched data, with checkpoints, a decision log, and the ability to run trials."

[[requirements]]
id = "KA-19"
family = "KA"
n = 19
level = "must"
spec_line = 594
text = "Crawl safety MUST be hardcoded, not per-specification configurable: robots directives honoured, a per-domain rate limit, an identifying user agent, crawl scope enforced against the seed domain, and a warning when a download materially exceeds its estimate."

[[requirements]]
id = "KA-20"
family = "KA"
n = 20
level = "must"
spec_line = 599
text = "Ingestion MUST be resumable. A long ingest MUST checkpoint progress and resume without re-doing completed work."

[[requirements]]
id = "KA-21"
family = "KA"
n = 21
level = "must"
spec_line = 602
text = "Incremental update MUST be supported: a per-document revision manifest, a diff producing additions/updates/deletions, a three-phase apply (delete, then update, then add), and resumable progress."

[[requirements]]
id = "KA-22"
family = "KA"
n = 22
level = "must"
spec_line = 606
text = "Scope expansion MUST be possible in place: relax the filter set, ingest only the newly-admitted documents, and rebuild derived indexes — without re-acquiring or re-embedding what is already present. The filter set and its signature MUST be recorded with the corpus so expandability is decidable."

[[requirements]]
id = "KA-23"
family = "KA"
n = 23
level = "must"
spec_line = 611
text = "Content-addressed binary payloads MUST be stored once, keyed by content hash, with optional typed parsed-form caches beside the raw bytes and an append-only ledger of what was stored. Every future binary-bearing vertical MUST inherit this substrate unchanged rather than growing its own."

[[requirements]]
id = "KA-24"
family = "KA"
n = 24
level = "must"
spec_line = 618
text = "Personal sources (a user's notes vault, a watched folder, a document library) MUST be structurally local-scope and non-shareable by default (X-PV-3)."

[[requirements]]
id = "KA-25"
family = "KA"
n = 25
level = "must"
spec_line = 622
text = "Watched sources MUST be **read-only at the source**. The system MUST NOT write into a directory a user has asked it to observe."

[[requirements]]
id = "KA-26"
family = "KA"
n = 26
level = "must"
spec_line = 625
text = "Multi-root sources MUST deduplicate by content, not by path."

[[requirements]]
id = "KA-27"
family = "KA"
n = 27
level = "must"
spec_line = 627
text = "Optional scanned-document text recovery MUST be available in every deployment shape, not only the graphical one."

[[requirements]]
id = "NF-1"
family = "NF"
n = 1
level = "bar"
spec_line = 3272
text = "Per-turn retrieval wall time MUST be flat, within noise, across at least a 10× range of installed corpus count (ST-32)."

[[requirements]]
id = "NF-2"
family = "NF"
n = 2
level = "bar"
spec_line = 3275
text = "Conversation context carried forward MUST be constant with respect to thread length (RT-51)."

[[requirements]]
id = "NF-3"
family = "NF"
n = 3
level = "bar"
spec_line = 3278
text = "A grounded turn's verification cost MUST be bounded by the drafter's already-budgeted evidence, and the verification prompt MUST be strictly smaller than the drafting prompt (GR-4)."

[[requirements]]
id = "NF-4"
family = "NF"
n = 4
level = "bar"
spec_line = 3282
text = "Start-up MUST NOT require embedding static classifier exemplars (RT-28). **BAR:** first launch on a compute-only embedding path must not add minutes."

[[requirements]]
id = "NF-5"
family = "NF"
n = 5
level = "bar"
spec_line = 3286
text = "The build-correctness gate MUST complete in tens of seconds warm for a full workspace. A gate slow enough to skip is a gate nobody runs."

[[requirements]]
id = "NF-6"
family = "NF"
n = 6
level = "bar"
spec_line = 3289
text = "The composed quality suite's lean tier MUST finish in well under an hour; the full tier is a release gate."

[[requirements]]
id = "NF-7"
family = "NF"
n = 7
level = "bar"
spec_line = 3292
text = "Index maintenance MUST cost only a metadata read per corpus per cycle in the common case (ST-13)."

[[requirements]]
id = "NF-8"
family = "NF"
n = 8
level = "bar"
spec_line = 3295
text = "A pre-flight placement plan MUST be instant even for a hundreds-of-gigabytes model, because it reads metadata only (FE-73)."

[[requirements]]
id = "NF-9"
family = "NF"
n = 9
level = "should"
spec_line = 3298
text = "Editor-facing prediction MUST be fast enough not to be noticed. **BAR:** p95 well under the typical inter-keystroke interval for the deterministic lane."

[[requirements]]
id = "NF-10"
family = "NF"
n = 10
level = "must"
spec_line = 3304
text = "Thousands of installed corpora on one node."

[[requirements]]
id = "NF-11"
family = "NF"
n = 11
level = "must"
spec_line = 3305
text = "Hundreds of concurrent principals on one multi-tenant host, fairly scheduled."

[[requirements]]
id = "NF-12"
family = "NF"
n = 12
level = "must"
spec_line = 3307
text = "Tens of federation members with epidemic convergence."

[[requirements]]
id = "NF-13"
family = "NF"
n = 13
level = "must"
spec_line = 3308
text = "Models several times larger than any single node's accelerator."

[[requirements]]
id = "NF-14"
family = "NF"
n = 14
level = "must"
spec_line = 3312
text = "At least three desktop operating systems and two mobile platforms, with graceful degradation where an accelerator is absent."

[[requirements]]
id = "NF-15"
family = "NF"
n = 15
level = "must"
spec_line = 3314
text = "No test may require an accelerator, network, or model weights (EV-38)."

[[requirements]]
id = "NF-16"
family = "NF"
n = 16
level = "must"
spec_line = 3316
text = "Deterministic components MUST produce identical output across platforms."

[[requirements]]
id = "NF-17"
family = "NF"
n = 17
level = "must"
spec_line = 3321
text = "A written threat model MUST enumerate every listener, its default binding, its authentication, and the honest gaps — and MUST be updated in the same change that alters any of them."

[[requirements]]
id = "NF-18"
family = "NF"
n = 18
level = "must"
spec_line = 3324
text = "No credential may be logged, and no credential may be reconstructible from a diagnostic report."

[[requirements]]
id = "NF-19"
family = "NF"
n = 19
level = "must"
spec_line = 3326
text = "Every trust decision MUST be re-derivable from what the receiving side can *prove*, never from what the sending side *claims* (FE-16, FE-93)."

[[requirements]]
id = "NF-20"
family = "NF"
n = 20
level = "must"
spec_line = 3332
text = "The system MUST maintain a document stating what IS, separate from a document recording how it came to be. The former is a contract: every claim must be verifiable against the code at the commit it appears in, and a subsystem change MUST update its entry in the same change."

[[requirements]]
id = "NF-21"
family = "NF"
n = 21
level = "must"
spec_line = 3336
text = "A deterministic gate MUST verify that every path the governing documents cite resolves (CI-17)."

[[requirements]]
id = "NF-22"
family = "NF"
n = 22
level = "must"
spec_line = 3338
text = "Deferred work MUST be **ledgered**, so the next engineer inherits a to-do list rather than a surprise. A large file or a documented gap without an entry is a defect; with an entry it is sequenced work."

[[requirements]]
id = "NF-23"
family = "NF"
n = 23
level = "must"
spec_line = 3341
text = "Completed entries MUST move to the history record and be dropped from the ledger, so the ledger holds only live deferrals."

[[requirements]]
id = "OP-1"
family = "OP"
n = 1
level = "must"
spec_line = 3148
text = "Configuration and mutable state MUST live on a small number of well-defined roots with a documented purpose each, at minimum: - **per-checkout** — project identity, per-repository posture, working notes; - **per-user** — the user's configuration, indexes, artefacts, sessions, logs; - **platform data** — the machine's federation identity, deliberately platform-native so a graphical application and a command-line tool share it; - **committed contracts** — versioned, reviewed declarations (layer policy, knob registry, ratchet baselines, concept register, use-case contract, model selection, source catalogue, lint budgets), each with a stated writer (human or machine only) and a stated enforcer."

[[requirements]]
id = "OP-2"
family = "OP"
n = 2
level = "must"
spec_line = 3159
text = "Ratchet baselines MUST be **machine-written only**, updated through an explicit command, never edited by hand."

[[requirements]]
id = "OP-3"
family = "OP"
n = 3
level = "must"
spec_line = 3162
text = "A machine identity MUST be independent of any membership and MUST survive every membership change (FE-3)."

[[requirements]]
id = "OP-4"
family = "OP"
n = 4
level = "must"
spec_line = 3165
text = "A property of the **machine** (\"this node serves remote callers\") MUST NOT be stored per-membership, because it is decided before any membership exists."

[[requirements]]
id = "OP-5"
family = "OP"
n = 5
level = "must"
spec_line = 3169
text = "Legacy layouts MUST be migrated on first start, idempotently."

[[requirements]]
id = "OP-6"
family = "OP"
n = 6
level = "must"
spec_line = 3173
text = "The background service MUST be installable as a supervised system service on each supported platform."

[[requirements]]
id = "OP-7"
family = "OP"
n = 7
level = "must"
spec_line = 3176
text = "The graphical application MUST be able to run the service as a **supervised child process** rather than in-process, so a fatal fault in the numerical layer leaves a recoverable interface (X-DG-6)."

[[requirements]]
id = "OP-8"
family = "OP"
n = 8
level = "must"
spec_line = 3180
text = "The child SHOULD be the same executable re-entered with an argument, so there is no second artefact to keep in sync and no extra bytes in the bundle."

[[requirements]]
id = "OP-9"
family = "OP"
n = 9
level = "must"
spec_line = 3184
text = "Falling back to the in-process mode MUST be surfaced as an event the interface renders, never silent, with a user-reachable reconnect."

[[requirements]]
id = "OP-10"
family = "OP"
n = 10
level = "invariant"
spec_line = 3187
text = "**Shutdown must be explicit, not incidental.** The exit path MUST signal the child and **await** its reaping within a bounded budget before the parent leaves."

[[requirements]]
id = "OP-11"
family = "OP"
n = 11
level = "must"
spec_line = 3199
text = "Every start-up fallback path MUST stop the child before returning, so \"unsupervised\" cannot mean \"still running and racing for the port\"."

[[requirements]]
id = "OP-12"
family = "OP"
n = 12
level = "must"
spec_line = 3202
text = "First-run setup MUST end in the supervised configuration, so a fresh install is supervised from its first post-setup minute."

[[requirements]]
id = "OP-13"
family = "OP"
n = 13
level = "must"
spec_line = 3205
text = "A partial configuration reload MUST rebuild only what changed, with a declared table of field → action, and MUST report `restart required` for fields it cannot swap. Where a restart is required, the surface SHOULD perform it through the platform service manager."

[[requirements]]
id = "OP-14"
family = "OP"
n = 14
level = "must"
spec_line = 3212
text = "Where a graphical application and a background service both want the same port, the application MUST **probe** at start-up and, on success, attach: inference through a remote provider, mutations over the control plane, and configuration changes pushed as a reload."

[[requirements]]
id = "OP-15"
family = "OP"
n = 15
level = "invariant"
spec_line = 3217
text = "In attach mode the application MUST read **its own** configured state root. It MUST NOT adopt another process's data location at boot."

[[requirements]]
id = "OP-16"
family = "OP"
n = 16
level = "must"
spec_line = 3224
text = "A first-stop diagnostic command MUST exist covering, at minimum: engine, model, federation, peers, knowledge, disk, and stability — with an unreachable probe rendering **unknown** (X-EH-2)."

[[requirements]]
id = "OP-17"
family = "OP"
n = 17
level = "must"
spec_line = 3228
text = "A liveness endpoint's actual path MUST be documented, and any health check MUST distinguish a not-found response from a healthy one. A shell idiom that treats any response as success is non-conforming."

[[requirements]]
id = "OP-18"
family = "OP"
n = 18
level = "must"
spec_line = 3232
text = "Custom diagnostic channels MUST be enrolled in the deployed service's filter, or they are dark. Enrolment MUST be pinned by a test that renders a real event through a real subscriber."

[[requirements]]
id = "OP-19"
family = "OP"
n = 19
level = "must"
spec_line = 3236
text = "Long jobs MUST be observable from outside the process that started them."

[[requirements]]
id = "OP-20"
family = "OP"
n = 20
level = "must"
spec_line = 3241
text = "A memory ceiling that terminates the process MUST default off and be opt-in for supervised deployments; a soft warning stays on."

[[requirements]]
id = "OP-21"
family = "OP"
n = 21
level = "must"
spec_line = 3244
text = "Background work MUST yield to foreground work, bounded (X-ST-4)."

[[requirements]]
id = "OP-22"
family = "OP"
n = 22
level = "must"
spec_line = 3247
text = "Where a shared resource can be contended (a build lock, a single rebuild permit, an accelerator), acquisition MUST be visible and hangs MUST be detected by a watchdog with a loud record."

[[requirements]]
id = "OP-23"
family = "OP"
n = 23
level = "must"
spec_line = 3253
text = "A shared air-gapped deployment MUST be supported with: written rationale, an operator-facing brief, a **line-by-line audit of every outbound call and its kill switch**, hand-written configuration files, service units, a route allow-list, and separate packaging, installation, and acceptance scripts."

[[requirements]]
id = "OP-24"
family = "OP"
n = 24
level = "must"
spec_line = 3258
text = "The egress audit MUST be read before any claim that the system makes no outbound connections (X-PV-2)."

[[requirements]]
id = "OS-1"
family = "OS"
n = 1
level = "out-of-scope"
spec_line = 3459
text = "Model training or fine-tuning."

[[requirements]]
id = "OS-2"
family = "OS"
n = 2
level = "out-of-scope"
spec_line = 3460
text = "Any hosted or centrally-operated component; accounts; billing."

[[requirements]]
id = "OS-3"
family = "OS"
n = 3
level = "out-of-scope"
spec_line = 3461
text = "True isolation of untrusted third-party sandboxed applications (FE-131) — deferred pending a non-privileged bridge."

[[requirements]]
id = "OS-4"
family = "OS"
n = 4
level = "out-of-scope"
spec_line = 3463
text = "End-to-end encryption of raw inter-process compute traffic between distributed compute participants (FE-32). It requires a shared network and MUST NOT be claimed as encrypted."

[[requirements]]
id = "OS-5"
family = "OS"
n = 5
level = "out-of-scope"
spec_line = 3466
text = "Heterogeneous ports across federation members: the reference system assumes uniform ports and states the assumption."

[[requirements]]
id = "OS-6"
family = "OS"
n = 6
level = "out-of-scope"
spec_line = 3468
text = "Multi-model dispatch on the embedding endpoint; batched embedding."

[[requirements]]
id = "OS-7"
family = "OS"
n = 7
level = "out-of-scope"
spec_line = 3469
text = "Per-turn quality prediction from a throughput rate card — filed as a **measured regression**, not as unfinished work (FE-67)."

[[requirements]]
id = "OS-8"
family = "OS"
n = 8
level = "out-of-scope"
spec_line = 3471
text = "A ranking objective with units in production — blocked on the missing signal it needs, not on the switch (FE-61, FE-69)."

[[requirements]]
id = "OS-9"
family = "OS"
n = 9
level = "out-of-scope"
spec_line = 3473
text = "Span-level provenance demotion in the user interface where the admission signal is unavailable — the claim-level ledger is what ships."

[[requirements]]
id = "OS-10"
family = "OS"
n = 10
level = "out-of-scope"
spec_line = 3475
text = "A curation overlay surviving re-extraction on the graph inspector; forward-compatible fields exist."

[[requirements]]
id = "RT-1"
family = "RT"
n = 1
level = "must"
spec_line = 1146
text = "A turn MUST proceed: classify → decide policy → begin a cancellable session → dispatch by classified intent → record provenance → extract durable memory at conversation end."

[[requirements]]
id = "RT-2"
family = "RT"
n = 2
level = "invariant"
spec_line = 1150
text = "*The classifier emits facts; the runtime applies policy.* Classification MUST be testable without a model, and thresholds MUST be calibratable without touching the classification interface."

[[requirements]]
id = "RT-3"
family = "RT"
n = 3
level = "must"
spec_line = 1154
text = "Policy decision MUST be a pure function of the classification and a threshold set, producing a tier and a **move kind** — commit, propose, or ask."

[[requirements]]
id = "RT-4"
family = "RT"
n = 4
level = "must"
spec_line = 1158
text = "Every per-intent attribute MUST be a column of one total record (X-SD-5): recorded name, wire slug, user-facing phrasings, trace label, default capability and latency class, retrieval budget with and without evidence, output budget floor, operation binding, and tool-catalogue filter. Adding an intent MUST be a member, a row, and exemplars — and MUST fail to build if any column is omitted."

[[requirements]]
id = "RT-5"
family = "RT"
n = 5
level = "must"
spec_line = 1165
text = "Handler *dispatch* over the closed intent set MUST remain explicit control flow (X-EX-1); only the *attributes* move to data."

[[requirements]]
id = "RT-6"
family = "RT"
n = 6
level = "must"
spec_line = 1170
text = "Classification MUST be a **stack**: cheap learned pre-checks first, then a coarse model pass, then a refining pass. The stack MUST be assembled by exactly one wiring path that every surface calls, with an automated assertion that every axis is wired."

[[requirements]]
id = "RT-7"
family = "RT"
n = 7
level = "must"
spec_line = 1177
text = "Classifier exemplars MUST be embedded in the deployed artefact, so the stack works regardless of working directory or packaging layout, with override paths for development."

[[requirements]]
id = "RT-8"
family = "RT"
n = 8
level = "invariant"
spec_line = 1181
text = "*An axis's embedding instruction must match what the axis discriminates BY.* An axis separating **speech acts** (what the speaker is doing) MUST use an instruction that encodes the act and discards the topic. An axis separating **subject matter** (personal versus external; this thread versus past threads; time-sensitive versus evergreen) MUST use a topical instruction. Mixing them is not mis-tuning; it is inexpressible — no threshold pair exists."

[[requirements]]
id = "RT-9"
family = "RT"
n = 9
level = "must"
spec_line = 1195
text = "Where axes occupy different spaces, the per-turn embedding cost MUST NOT grow: axes sharing a space MUST share one vector, and there MUST be one decider mapping axis → space that returns *unknown* for an axis it does not know, so calibration skips rather than guessing."

[[requirements]]
id = "RT-10"
family = "RT"
n = 10
level = "must"
spec_line = 1200
text = "Thresholds are comparable **only within a space**. Moving an axis between spaces MUST re-calibrate it; carrying a constant across is non-conforming."

[[requirements]]
id = "RT-11"
family = "RT"
n = 11
level = "must"
spec_line = 1204
text = "Coarse-pass parsing MUST recover a truncated verdict rather than silently falling through to a default, and MUST do so only when the recovery is unambiguous (exactly one label shares the prefix). A degrade MUST print on a channel the harness enables."

[[requirements]]
id = "RT-12"
family = "RT"
n = 12
level = "must"
spec_line = 1212
text = "Where a pre-check hard-commits a route above another pre-check built to catch an adjacent case, the higher one MUST reject the adjacent shape itself — the lower one can never see what the higher one claims."

[[requirements]]
id = "RT-13"
family = "RT"
n = 13
level = "must"
spec_line = 1216
text = "A pre-check that commits a route MUST also commit any dependent scope, or the intent alone will search the wrong universe."

[[requirements]]
id = "RT-14"
family = "RT"
n = 14
level = "must"
spec_line = 1221
text = "Scoring MUST be separated from gating on every axis, so a threshold sweep is pure arithmetic over one embedding pass."

[[requirements]]
id = "RT-15"
family = "RT"
n = 15
level = "must"
spec_line = 1224
text = "A calibration tool MUST sweep exhaustively with candidate thresholds at **midpoints between observed scores** — never a random or linear sample, and never a threshold placed *on* an observation (floating-point subtraction moves the boundary, not the comparison)."

[[requirements]]
id = "RT-16"
family = "RT"
n = 16
level = "must"
spec_line = 1229
text = "The calibration bank MUST be authored to **fail somewhere**, and MUST contain abstention cases. A bank with no abstention cases cannot measure the failure mode that matters."

[[requirements]]
id = "RT-17"
family = "RT"
n = 17
level = "must"
spec_line = 1233
text = "A margin floor MUST be clamped non-negative. An unconstrained fit will happily propose a gate that fires when the *negative* class won."

[[requirements]]
id = "RT-18"
family = "RT"
n = 18
level = "must"
spec_line = 1236
text = "The tool MUST flag an axis with too few cases in either class and print \"read the shipped numbers, not the fitted gate\". Reporting a headline on the same cases the gate was tuned on is non-conforming."

[[requirements]]
id = "RT-19"
family = "RT"
n = 19
level = "must"
spec_line = 1240
text = "**The calibration tool MUST write no constant.** It names the constant and the file and stops."

[[requirements]]
id = "RT-20"
family = "RT"
n = 20
level = "must"
spec_line = 1243
text = "Per-case attribution MUST exist: a confusion count is never enough, because the next question is always *which ones*. The bucketing rule MUST have one implementation shared by the counter and the namer, so the listing can never contradict the totals."

[[requirements]]
id = "RT-21"
family = "RT"
n = 21
level = "must"
spec_line = 1248
text = "A missed case MUST be able to name **what it lost to**. Where a score is a one-versus-rest maximum, the identity of the winner MUST be carried through to the report and to the production diagnostic log. Where the positive class is a centroid and no single exemplar is responsible, the field MUST be honestly empty."

[[requirements]]
id = "RT-22"
family = "RT"
n = 22
level = "invariant"
spec_line = 1254
text = "*Grow the bank before moving the constant.* A fit against a small bank can look strictly dominant and be wrong in both directions at once. Any proposed constant move MUST be re-scored against a bank grown with cases chosen to **break** it, not to confirm it."

[[requirements]]
id = "RT-23"
family = "RT"
n = 23
level = "invariant"
spec_line = 1259
text = "*After re-filing exemplars between classes, re-check the abstain cases, not just the positives.* Consolidating two classes that shared a neighbourhood inflates the margin of everything in it — margin is relative, and the absorbed class was the runner-up holding it down. This can *create* a false positive rather than relabel a pre-existing one."

[[requirements]]
id = "RT-24"
family = "RT"
n = 24
level = "must"
spec_line = 1265
text = "Where an axis's ceiling is a property of the representation rather than of the threshold, this MUST be established by controlled refutation and recorded, with the control case kept so the refutation stays measurable."

[[requirements]]
id = "RT-25"
family = "RT"
n = 25
level = "must"
spec_line = 1272
text = "Score-distribution **drift** MUST be tracked: a dated snapshot of the fitted state, and later runs diffing cushions and separation against it. A regression MUST be *claimed* only when the encoder and the bank are both unchanged (both recorded, the bank by content digest); otherwise deltas print as evidence with a stated reason they are not attributable."

[[requirements]]
id = "RT-26"
family = "RT"
n = 26
level = "must"
spec_line = 1278
text = "The comparability key for a drift baseline MUST be the exact model artefact. Two quantisations of one model can be interchangeable *for decisions* and still differ by several times the drift epsilon."

[[requirements]]
id = "RT-27"
family = "RT"
n = 27
level = "must"
spec_line = 1282
text = "Where an accuracy metric has saturated, the reporting MUST add what accuracy hides: **layer attribution** (which decisions the cheap layer owned versus which woke an expensive call), per-class precision/recall, and ranked confusions. Abstention MUST be measured where it exists — at the individual gates — and MUST NOT be reported at a layer where it is unobservable."

[[requirements]]
id = "RT-28"
family = "RT"
n = 28
level = "must"
spec_line = 1288
text = "Start-up embedding of static exemplars MUST be avoidable via a pre-computed cache shipped with the artefact, validated against the live model by a sentinel probe, with a pure no-inference freshness gate and a regeneration command wired into the release process."

[[requirements]]
id = "RT-29"
family = "RT"
n = 29
level = "must"
spec_line = 1295
text = "A plan MUST be a directed acyclic graph of typed steps, with at minimum: reason, tool call, user input, branch, reason-with-tools, await-user-information, and delegate."

[[requirements]]
id = "RT-30"
family = "RT"
n = 30
level = "must"
spec_line = 1299
text = "The one textual grammar shared between planner and executor (step-output references) MUST be owned end-to-end by one component — emitter, parser, and a test that the prompt describing it stays in sync."

[[requirements]]
id = "RT-31"
family = "RT"
n = 31
level = "must"
spec_line = 1303
text = "The planner MUST be **masked to the tool surface**, not merely shown it. Structured output MUST pin the tool identifier per branch and bind that branch's parameters to the tool's own schema **verbatim**. Copying the schema is a second decider (X-SD-2)."

[[requirements]]
id = "RT-32"
family = "RT"
n = 32
level = "must"
spec_line = 1310
text = "A tool whose parameters are not a typed object MUST be **refused** from the masked surface, never widened back to a free-form parameter bag — a widened shape compiles, masks nothing, and leaves a plan looking constrained while its arguments stay free."

[[requirements]]
id = "RT-33"
family = "RT"
n = 33
level = "invariant"
spec_line = 1315
text = "*The mask makes fabrication impossible, not honesty automatic.* Closing an in-vocabulary hole sharpens the out-of-vocabulary one: the masked planner picks the nearest *legal* identifier. Every such substitution hazard MUST have its own guard at the execution seam."

[[requirements]]
id = "RT-34"
family = "RT"
n = 34
level = "must"
spec_line = 1320
text = "Declared enumerations MUST be rendered into the planning prompt **in full and never truncated**. A partial list biases the planner to the head of it while the tool still rejects everything below the cut."

[[requirements]]
id = "RT-35"
family = "RT"
n = 35
level = "must"
spec_line = 1324
text = "A bad parameter MUST be an *ok-valued refusal* carrying its reason, not an error."

[[requirements]]
id = "RT-36"
family = "RT"
n = 36
level = "must"
spec_line = 1331
text = "Before a non-idempotent tool step runs, the executor MUST write a durable *started* record keyed by a **content-derived** idempotency key, flipping it to *completed* after the effect returns."

[[requirements]]
id = "RT-37"
family = "RT"
n = 37
level = "must"
spec_line = 1335
text = "On resume: a *completed* record MUST cause the step to be skipped with its recorded result; a *started-but-not-completed* record MUST halt and surface for review rather than blind-replaying a side effect."

[[requirements]]
id = "RT-38"
family = "RT"
n = 38
level = "must"
spec_line = 1339
text = "The idempotency key MUST be content-derived, not (task, step-identifier) — so it matches across a replan that reissues the same action under a new step identifier. Exactly-once MUST be proven in both directions by test."

[[requirements]]
id = "RT-39"
family = "RT"
n = 39
level = "must"
spec_line = 1344
text = "A **delegate** step MUST run a scoped tool loop in its own context, with only a typed contract flowing back to the orchestrator — the declared return fields plus an always-present anomalies channel. Raw observations MUST stay in the worker's transcript. The firewall MUST be proven by test."

[[requirements]]
id = "RT-40"
family = "RT"
n = 40
level = "must"
spec_line = 1350
text = "Where two tool-invocation loops exist for different shapes, the parser and schema projection MUST be shared (X-SD-1)."

[[requirements]]
id = "RT-41"
family = "RT"
n = 41
level = "must"
spec_line = 1353
text = "Execution MUST support best-of-N sampling with pluggable selection, evaluation passes, and per-step permission and approval gating."

[[requirements]]
id = "RT-42"
family = "RT"
n = 42
level = "must"
spec_line = 1358
text = "The system MUST provide, at minimum, tools for: local hybrid search with coverage assessment; web search and single-URL fetch (both behind X-PV-2 removability); direct corpus query; enriched-graph retrieval; map-reduce document summarisation and analysis; shell, file, mail, and calendar actions behind sandboxing and approval."

[[requirements]]
id = "RT-43"
family = "RT"
n = 43
level = "must"
spec_line = 1364
text = "External tool servers MUST be integrable over at least two transports, configured in one place, loaded by one shared loader that **every** conversational surface calls."

[[requirements]]
id = "RT-44"
family = "RT"
n = 44
level = "must"
spec_line = 1368
text = "An adapted external tool's descriptor MUST be enriched with a synthesised example call derived from its input schema, so the planner reliably emits a tool step rather than a reasoning step."

[[requirements]]
id = "RT-45"
family = "RT"
n = 45
level = "must"
spec_line = 1372
text = "An external tool's **effect** and **idempotency** MUST be inferred where undeclared, from its verb, so that a mutating call picks up the approval gate and the replay ledger while a read does not."

[[requirements]]
id = "RT-46"
family = "RT"
n = 46
level = "must"
spec_line = 1376
text = "The **declared half of a tool** — identity, behavioural properties, parameter schema, worked examples, required permissions — MUST be data (X-EX-4), with exactly one decider per tool. A declaration plus a handler MUST be sufficient to register a tool with no boilerplate, and a declaration delegating to an already-registered tool with defaults MUST need no code at all."

[[requirements]]
id = "RT-47"
family = "RT"
n = 47
level = "must"
spec_line = 1382
text = "Tools whose descriptors are genuinely computed (from what is installed, from a closed constant set, from an external asset) MAY keep coded descriptors, and the exceptions MUST be enumerable."

[[requirements]]
id = "RT-48"
family = "RT"
n = 48
level = "must"
spec_line = 1386
text = "Parameter validation MUST be derived from the declaration, not hand-written per tool."

[[requirements]]
id = "RT-49"
family = "RT"
n = 49
level = "must"
spec_line = 1389
text = "A file attached for a tool's use MUST be distinguishable from a document attached for retrieval. The former binds a path to the turn; the latter is ingested and the path discarded."

[[requirements]]
id = "RT-50"
family = "RT"
n = 50
level = "must"
spec_line = 1395
text = "**Working memory** MUST be compressed every message into a small bounded structure (current goal, facts, active documents)."

[[requirements]]
id = "RT-51"
family = "RT"
n = 51
level = "must"
spec_line = 1398
text = "What a long thread carries forward MUST be **constant-capacity and independent of conversation length**, composed of at minimum: a rolling visible window; a structured **conversation frame** with named sections; and retrieval over dropped history. **BAR:** total carried context must not grow with thread length."

[[requirements]]
id = "RT-52"
family = "RT"
n = 52
level = "invariant"
spec_line = 1404
text = "The frame MUST be **structured, not a prose blob**. Two reasons, only one of which is cost: a blob must be rewritten to be updated, and re-narration is where named entities get dropped; and a blob is not *renderable* — \"what do you remember about this conversation?\" must be answerable from sections."

[[requirements]]
id = "RT-53"
family = "RT"
n = 53
level = "must"
spec_line = 1410
text = "Both memory channels MUST narrate themselves — memory being read (with indices and best similarity) and memory being written — and recall MUST be recorded in turn provenance so a verified recall is distinguishable from a lucky parametric guess."

[[requirements]]
id = "RT-54"
family = "RT"
n = 54
level = "must"
spec_line = 1415
text = "**Long-term memory** MUST be extracted at conversation end, each item carrying confidence, creation time, and last use, with decay and pruning below a threshold."

[[requirements]]
id = "RT-55"
family = "RT"
n = 55
level = "must"
spec_line = 1419
text = "Memory embeddings MUST be persistent, computed on write, with a model-swap guard: a stored embedding whose model identity differs from the current provider's MUST be recomputed."

[[requirements]]
id = "RT-56"
family = "RT"
n = 56
level = "should"
spec_line = 1423
text = "A hierarchical memory tier SHOULD exist with incremental maintenance — descend, then attach / re-summarise / split / rebuild under statistical triggers — with every trigger emitting a glassbox trace. Scope keys MUST prevent a summary node from spanning two privacy scopes."

[[requirements]]
id = "RT-57"
family = "RT"
n = 57
level = "must"
spec_line = 1428
text = "Where recall runs before routing, it MUST gate on a mode-derived signal, never on a per-turn classification that is not yet available."

[[requirements]]
id = "RT-58"
family = "RT"
n = 58
level = "must"
spec_line = 1432
text = "Routing corrections MUST be remembered and fed back into classification as negative examples."

[[requirements]]
id = "RT-59"
family = "RT"
n = 59
level = "must"
spec_line = 1437
text = "A **skill** MUST be a declarative bundle merging routing hints, planning templates, prompt overrides, memory rules, and capability requirements into the runtime."

[[requirements]]
id = "RT-60"
family = "RT"
n = 60
level = "must"
spec_line = 1441
text = "Skills MUST carry a signature and a derived trust level, and a skill declaring local-only privacy MUST short-circuit every remote path."

[[requirements]]
id = "RT-61"
family = "RT"
n = 61
level = "should"
spec_line = 1444
text = "The system SHOULD let a user teach durative behaviour in conversation (\"keep answers shorter from now on\"), compiling the intent **deterministically** to the cheapest enforcement rung available (parameter → transform → prompt) and offering it as a consent card. Dismissal MUST store nothing."

[[requirements]]
id = "RT-62"
family = "RT"
n = 62
level = "invariant"
spec_line = 1450
text = "**No taught behaviour may touch the grounding machinery.** Facts are scored by evidence provenance, never by preference. Enforcement rungs MUST be structurally unable to alter citations or grounding verdicts."
conditional_on = "RT-61"

[[requirements]]
id = "RT-63"
family = "RT"
n = 63
level = "must"
spec_line = 1455
text = "Every influenced turn MUST record which lessons applied. There MUST be at most one active lesson per rung, with saving superseding and retiring the prior one, and a settings surface where a user can see and remove what was learned."
conditional_on = "RT-61"

[[requirements]]
id = "RT-64"
family = "RT"
n = 64
level = "must"
spec_line = 1462
text = "The synthesis path MUST be organised as data-defined roles — at minimum a **router**, a **synthesiser**, and a **critic** — each carrying its own verification predicate. *The predicate defines correctness; the benchmark measures it.*"

[[requirements]]
id = "RT-65"
family = "RT"
n = 65
level = "must"
spec_line = 1467
text = "There MUST be exactly one prompt-body builder that every synthesis site calls, and exactly one traced route resolution with a typed reason. Both MUST be pinned by equivalence tests."

[[requirements]]
id = "RT-66"
family = "RT"
n = 66
level = "must"
spec_line = 1474
text = "Durable state MUST sit behind one interface with at least three implementations: an embedded single-file store (the default), a networked store (for a shared host), and an in-memory store (for tests). Functional tests MUST run against real text search, not a stub."

[[requirements]]
id = "RT-67"
family = "RT"
n = 67
level = "must"
spec_line = 1479
text = "The interface MUST be **decomposed by concern**, so a caller narrows its dependency to what it actually uses rather than taking a general-purpose handle on everything."

[[requirements]]
id = "RT-68"
family = "RT"
n = 68
level = "must"
spec_line = 1488
text = "Every record MUST carry a monotonic logical **version**, and every deletable record MUST be soft-deletable, such that **two independently evolved stores can be union-merged without a schema migration.**"

[[requirements]]
id = "RT-69"
family = "RT"
n = 69
level = "must"
spec_line = 1492
text = "Message history MUST be full-text searchable."

[[requirements]]
id = "RT-70"
family = "RT"
n = 70
level = "must"
spec_line = 1494
text = "State covered MUST include at minimum: conversations and messages, tasks, memories, documents and document assets, per-corpus state, routing history, search budget, permissions, and the per-attempt execution ledger (RT-36)."

[[requirements]]
id = "RT-71"
family = "RT"
n = 71
level = "must"
spec_line = 1499
text = "Ledger methods MUST default to no-ops on implementations that do not need durability, so a non-durable test double is unaffected by their existence."

[[requirements]]
id = "ST-1"
family = "ST"
n = 1
level = "must"
spec_line = 639
text = "Retrieval MUST be hybrid: dense vector similarity *and* lexical keyword search over the same passages, fused into one ranking."

[[requirements]]
id = "ST-2"
family = "ST"
n = 2
level = "must"
spec_line = 642
text = "One corpus MUST occupy one self-describing on-disk location with authoritative metadata recorded alongside the data."

[[requirements]]
id = "ST-3"
family = "ST"
n = 3
level = "must"
spec_line = 645
text = "The on-disk layout MUST have exactly one decider (X-SD-1) and a mechanical ratchet preventing hand-spelled layout knowledge from re-accumulating."

[[requirements]]
id = "ST-4"
family = "ST"
n = 4
level = "must"
spec_line = 649
text = "A **shard** — an index holding a contiguous identifier range — MUST be structurally identical to a whole index. Search MUST NOT be able to tell the difference. Three shard operations MUST exist: report statistics, extract a range into a new index, merge N indexes into one."

[[requirements]]
id = "ST-5"
family = "ST"
n = 5
level = "invariant"
spec_line = 654
text = "The pair *(corpus identifier, passage identifier)* is the citation handle and MUST be globally unique. Enumeration of installed corpora MUST deduplicate deterministically and MUST exclude out-of-band directories."

[[requirements]]
id = "ST-6"
family = "ST"
n = 6
level = "must"
spec_line = 658
text = "**A directory is not an installed corpus.** Readiness MUST be decided by a positive completion signal from the index itself, at the canonical location, by one decider shared by every reader (X-SD-1). In-flight ingests MUST write to a distinct location that no reader mistakes for an installed corpus."

[[requirements]]
id = "ST-7"
family = "ST"
n = 7
level = "must"
spec_line = 666
text = "Readiness MUST be a three-or-more-valued answer (**ready**, **building**, **absent**, and any further distinguishable states), never a boolean."

[[requirements]]
id = "ST-8"
family = "ST"
n = 8
level = "invariant"
spec_line = 672
text = "The embedding model is a cross-node interoperability contract. A corpus MUST record the model, dimensionality, pooling, and normalisation used to build it. Opening with an incompatible model MUST fail loudly, never coerce."

[[requirements]]
id = "ST-9"
family = "ST"
n = 9
level = "must"
spec_line = 677
text = "Nodes sharing a corpus MUST produce bit-compatible vectors. Any operation that mixes vectors from two models MUST be impossible."

[[requirements]]
id = "ST-10"
family = "ST"
n = 10
level = "must"
spec_line = 680
text = "Any cache of embeddings MUST key the *instruction* used to produce them into its identity, not only the model. A model fingerprint cannot see an instruction change, and a cache that reports fresh while holding vectors from a different semantic space is worse than a cold cache."

[[requirements]]
id = "ST-11"
family = "ST"
n = 11
level = "must"
spec_line = 687
text = "The system MUST detect and remediate the retrieval-quality decay that accumulates in an incrementally-appended index."

[[requirements]]
id = "ST-12"
family = "ST"
n = 12
level = "must"
spec_line = 697
text = "Maintenance MUST have one implementation with two surfaces: an operator-invoked command reporting before/after state, and an automatic background sweep. The background sweep is the one that matters, because the user who most needs a healthy index will never open a terminal."

[[requirements]]
id = "ST-13"
family = "ST"
n = 13
level = "must"
spec_line = 702
text = "The sweep MUST be **cheap-check, rare-act**: every cycle performs only a metadata read per corpus, and does real work only past a stated floor."

[[requirements]]
id = "ST-14"
family = "ST"
n = 14
level = "invariant"
spec_line = 706
text = "Index rebuilding is **not idempotent**. Unconditional repeated rebuilds add versions and remove none, degrading a healthy corpus. The rebuild phase MUST therefore be gated on positive evidence that work is needed. Ungated on a cadence, the healer is the leak."

[[requirements]]
id = "ST-15"
family = "ST"
n = 15
level = "invariant"
spec_line = 711
text = "Compaction is non-destructive, so storage grows until pruning. Pruning is destructive and irreversible: the operator surface MUST have no default and MUST refuse a zero-retention prune; the automatic sweep MUST use a retention window far outside any plausible in-flight reader."

[[requirements]]
id = "ST-16"
family = "ST"
n = 16
level = "must"
spec_line = 718
text = "Stated as X-PR-1; applies here in full."
alias_of = "X-PR-1"

[[requirements]]
id = "ST-17"
family = "ST"
n = 17
level = "must"
spec_line = 718
text = "Stated as X-PR-2; applies here in full."
alias_of = "X-PR-2"

[[requirements]]
id = "ST-18"
family = "ST"
n = 18
level = "must"
spec_line = 718
text = "Stated as X-PR-3; applies here in full."
alias_of = "X-PR-3"

[[requirements]]
id = "ST-19"
family = "ST"
n = 19
level = "must"
spec_line = 718
text = "Stated as X-PR-4; applies here in full."
alias_of = "X-PR-4"

[[requirements]]
id = "ST-20"
family = "ST"
n = 20
level = "must"
spec_line = 718
text = "Stated as X-PR-5; applies here in full."
alias_of = "X-PR-5"

[[requirements]]
id = "ST-21"
family = "ST"
n = 21
level = "must"
spec_line = 721
text = "Reading provenance MUST distinguish \"what class is this\" (with an explicit refusing value for unknown) from \"did any door record a class at all\" (with an explicit *nobody-stamped* value). A pool in which nothing is stamped MUST leave provenance machinery *off*, not refuse the turn."

[[requirements]]
id = "ST-22"
family = "ST"
n = 22
level = "must"
spec_line = 726
text = "The set of things the system itself manufactures MUST be enumerable and pinned by an automated check. Every manufacturer MUST be content the process genuinely builds."

[[requirements]]
id = "ST-23"
family = "ST"
n = 23
level = "must"
spec_line = 732
text = "Where a source declares internal structure (chapters, sections, articles), the system MUST maintain an explicit **join** from stored passages to the structural unit each came from. This join is what allows a citation to name a location rather than a document."

[[requirements]]
id = "ST-24"
family = "ST"
n = 24
level = "must"
spec_line = 737
text = "The join MUST be computed by locating each stored passage within its source document. Because stored passage text is rarely a verbatim slice of the source (ingestion prepends titles and reflows whitespace), the locator MUST attempt several normalisations and MUST **reject ambiguity rather than resolve it by taking the first match**. Unlocatable passages MUST be reported, not dropped (X-EH-1)."

[[requirements]]
id = "ST-25"
family = "ST"
n = 25
level = "must"
spec_line = 744
text = "Join status MUST be three-valued: **no structure declared**, **structure declared but join missing**, **join present**. Conflating the first two is what allows this to rot invisibly — no caller can distinguish a broken corpus from a flat one."

[[requirements]]
id = "ST-26"
family = "ST"
n = 26
level = "must"
spec_line = 753
text = "A repair path MUST exist to backfill the join on existing corpora, resolving both the case where a corpus owns its passages and the case where passages live in a parent corpus."

[[requirements]]
id = "ST-27"
family = "ST"
n = 27
level = "must"
spec_line = 757
text = "Publishing a corpus bundle MUST refuse an unjoined bundle (X-CO-3). A corpus that declares structure and joins none MUST fail publication, naming the offending corpora and the repair. A partial join is legitimate; an override MUST print the same facts rather than taking a quieter path."

[[requirements]]
id = "ST-28"
family = "ST"
n = 28
level = "must"
spec_line = 764
text = "Retrieval orchestration MUST be **data**: an ordered list of named steps executed by one runner, with one diagnostic event per step carrying the passage count before, after, and the delta."

[[requirements]]
id = "ST-29"
family = "ST"
n = 29
level = "invariant"
spec_line = 768
text = "*The intent decides HOW to answer — model tier, expansion, synthesis shape. It never decides WHERE knowledge lives.* Which knowledge sources exist is a property of the installation, not of the request's classification. Every retrieval composition MUST therefore share one evidence-gathering head."

[[requirements]]
id = "ST-30"
family = "ST"
n = 30
level = "must"
spec_line = 774
text = "Step lists MUST be pinned by tests, so reordering is an explicit reviewed act rather than an accident."

[[requirements]]
id = "ST-31"
family = "ST"
n = 31
level = "must"
spec_line = 777
text = "Per-request variation MUST ride shared state, not divergent code paths."

[[requirements]]
id = "ST-32"
family = "ST"
n = 32
level = "must"
spec_line = 780
text = "Retrieval cost MUST NOT be linear in the number of installed corpora more than once per turn. A turn issuing several fan-outs MUST scope every fan-out after the first to the sources that the first one *ranked* well. **BAR:** per-turn retrieval wall time must be flat, within measurement noise, across at least a 10× range of installed corpus count."

[[requirements]]
id = "ST-33"
family = "ST"
n = 33
level = "invariant"
spec_line = 786
text = "*A scope drawn from presence rather than from ranking is vacuous.* A per-source fan-out with no score floor returns something from every readable source, so \"produced a hit\" means \"the index opened\". Any scoping, gating, or admission decision MUST key on a *relevance* signal, and MUST run at a position in the pipeline where that signal exists."

[[requirements]]
id = "ST-34"
family = "ST"
n = 34
level = "invariant"
spec_line = 796
text = "*Fix the position of a selector, not its predicate.* A selector running before the ranking signal exists cannot be repaired by adding a relevance predicate; two attempts to do so measured byte-identical results."

[[requirements]]
id = "ST-35"
family = "ST"
n = 35
level = "must"
spec_line = 800
text = "Where a step is permitted to inject content *after* the noise floor (because what it injects has no lexical overlap the floor would survive), that exemption MUST be paired with an explicit topical gate, because nothing downstream can reject the injected content."

[[requirements]]
id = "ST-36"
family = "ST"
n = 36
level = "must"
spec_line = 807
text = "Retrieval can lose a source in at least two ways — locally (not built, no vector index, incompatible embedding) and remotely (peer refused or unreachable). Both MUST produce a typed record naming the source and a closed enumerated reason."

[[requirements]]
id = "ST-37"
family = "ST"
n = 37
level = "must"
spec_line = 812
text = "The readiness predicate that *drops* a source and the disclosure that *reports* it MUST be one implementation (X-SD-1)."

[[requirements]]
id = "ST-38"
family = "ST"
n = 38
level = "must"
spec_line = 815
text = "The disclosure MUST be narrowed by the same sensitivity, allow-list, and tenant-ceiling filters the surviving sources passed, so a disclosure can never name a source the user disabled or another tenant's."

[[requirements]]
id = "ST-39"
family = "ST"
n = 39
level = "must"
spec_line = 819
text = "The marker MUST be appended **by code**, as a pure function of the loss list, at the answer exit — not by asking the model to relay guidance."

[[requirements]]
id = "ST-40"
family = "ST"
n = 40
level = "bar"
spec_line = 822
text = "A turn that lost nothing MUST render byte-for-byte identically to a build without the feature."

[[requirements]]
id = "ST-41"
family = "ST"
n = 41
level = "must"
spec_line = 827
text = "Per-document recency MUST be **source-agnostic and emergent from indexing**: one sidecar mapping document identity → last-indexed time, stamped at the single point where every re-index path converges. Any source that re-indexes content — a freshness updater, a watched-folder edit, an incremental delta — MUST therefore make that content \"fresh\" with **no per-source code**."

[[requirements]]
id = "ST-42"
family = "ST"
n = 42
level = "must"
spec_line = 833
text = "The recency join key MUST ride on the retrievable unit, so derived structures (graph nodes, summaries) can sort fresh-first without a second lookup."

[[requirements]]
id = "ST-43"
family = "ST"
n = 43
level = "must"
spec_line = 837
text = "A corpus MAY be indexed as **one** searchable body while being enriched **per member** (per article, per document), producing many sibling member-scoped derived structures under one parent."

[[requirements]]
id = "ST-44"
family = "ST"
n = 44
level = "invariant"
spec_line = 841
text = "Where such a corpus exists, exploration surfaces MUST enumerate members carrying non-empty derived structure, and explorability MUST be gated on **content count, never on the presence of a directory**."

[[requirements]]
id = "ST-45"
family = "ST"
n = 45
level = "must"
spec_line = 847
text = "Where nothing on disk carries a member's human title, a derived title MUST be generated from its identifier rather than presenting the raw identifier."

[[requirements]]
id = "ST-46"
family = "ST"
n = 46
level = "must"
spec_line = 851
text = "A corpus MUST be able to declare presentation metadata (category, icon) that flows through its authoritative metadata onto the retrieval summary — so a consumer reads category off the index without re-resolving the source specification."

[[requirements]]
id = "UI-1"
family = "UI"
n = 1
level = "must"
spec_line = 2479
text = "All surfaces MUST run against the same reasoning runtime. A capability MUST NOT exist on one surface only."

[[requirements]]
id = "UI-2"
family = "UI"
n = 2
level = "must"
spec_line = 2482
text = "The commissioning of a runtime MUST be **one recipe** below every host, with hosts supplying only their own inputs. There MUST be an automated census asserting no host carries its own copy."

[[requirements]]
id = "UI-3"
family = "UI"
n = 3
level = "must"
spec_line = 2488
text = "The client half of the turn protocol MUST have one implementation, so a surface can drive a turn without holding a runtime — and without ending by reading the store, which only works from inside the process that owns it."

[[requirements]]
id = "UI-4"
family = "UI"
n = 4
level = "must"
spec_line = 2495
text = "The graphical application MUST be organised around **user intent**, not around system structure. A workable top-level shape is: **Ask** (grounded conversation, the landing surface), **Library** (knowledge home), **Workshop** (making things), **Reflect** (personal/wellbeing lane), and **Settings**."

[[requirements]]
id = "UI-5"
family = "UI"
n = 5
level = "must"
spec_line = 2501
text = "Library MUST present knowledge as a shelf of **notebooks**, each with its own conversation and exploration surfaces, and one add path covering catalogue installs, folders, vaults, and imports."

[[requirements]]
id = "UI-6"
family = "UI"
n = 6
level = "must"
spec_line = 2505
text = "Scope MUST be stated in plain language on the asking surface (\"Asking ‹notebook›\"), and per-notebook conversation history MUST resume."

[[requirements]]
id = "UI-7"
family = "UI"
n = 7
level = "must"
spec_line = 2508
text = "Layout MUST be **token-driven**, with a small set of global primitives for the scroll container, the content measure, and the header band."

[[requirements]]
id = "UI-8"
family = "UI"
n = 8
level = "must"
spec_line = 2516
text = "A live turn MUST survive a conversation switch. Stream events MUST be keyed by conversation and collected by a registry independent of which conversation is displayed, with re-attach on return restoring the affordance and the partial text."

[[requirements]]
id = "UI-9"
family = "UI"
n = 9
level = "must"
spec_line = 2526
text = "Chat dispatch MUST be single-flight, with the in-flight user message preserved across binding transitions."

[[requirements]]
id = "UI-10"
family = "UI"
n = 10
level = "must"
spec_line = 2529
text = "Accessibility seams MUST be shared across surfaces: per-turn completion announcement (announced on completion, never per token) and modal focus trapping with restore. Dynamic accessibility behaviour MUST be verified by assistive-technology testing, not only by automated scanning."

[[requirements]]
id = "UI-11"
family = "UI"
n = 11
level = "must"
spec_line = 2536
text = "The command-line surface MUST be one user-facing verb space, however it is implemented internally. The list of verbs MUST have one authoritative declaration, pinned by test."

[[requirements]]
id = "UI-12"
family = "UI"
n = 12
level = "must"
spec_line = 2540
text = "The verbs a first-time user needs MUST work in the *shipped* artefact. A verb MUST NOT be un-gated before its implementation ships, because un-gating first converts a clear \"not in this build\" into a worse \"cannot find component\"."

[[requirements]]
id = "UI-13"
family = "UI"
n = 13
level = "must"
spec_line = 2547
text = "Where a shipped build cannot serve a verb, the refusal MUST name what the build *can* do, never point at a build step the user cannot run."

[[requirements]]
id = "UI-14"
family = "UI"
n = 14
level = "must"
spec_line = 2550
text = "A known workflow MUST be roughly three commands. If it is not, the friction is a defect in the surface, not something to wrap ceremony around."

[[requirements]]
id = "UI-15"
family = "UI"
n = 15
level = "must"
spec_line = 2553
text = "Every command MUST do real work. Aspirational placeholders that print an intention and exit successfully are non-conforming."

[[requirements]]
id = "UI-16"
family = "UI"
n = 16
level = "must"
spec_line = 2556
text = "Exit codes MUST be meaningful and documented per command, with distinct codes for \"did not fit\", \"bad arguments\", \"assertion failed\", \"nothing measurable\", and \"backend unreachable\"."

[[requirements]]
id = "UI-17"
family = "UI"
n = 17
level = "must"
spec_line = 2560
text = "A status command MUST write its answer to standard output."

[[requirements]]
id = "UI-18"
family = "UI"
n = 18
level = "must"
spec_line = 2562
text = "Long-running background services MUST rotate their own logs by copy-truncate (preserving the file identity held by service supervisors), with a size cap, a backup count, and a sweep."

[[requirements]]
id = "UI-19"
family = "UI"
n = 19
level = "must"
spec_line = 2568
text = "An HTTP surface MUST offer REST plus streaming, with per-tenant isolation on knowledge and uploaded documents, and a server-side approval channel."

[[requirements]]
id = "UI-20"
family = "UI"
n = 20
level = "must"
spec_line = 2572
text = "Per-turn streaming MUST go down the requesting connection, and MUST NOT share a **type** with any broadcast fan-out, so a cross-tenant leak does not compile (X-ST-5)."

[[requirements]]
id = "UI-21"
family = "UI"
n = 21
level = "must"
spec_line = 2576
text = "A fair scheduler MUST bound concurrent turns with a weighted queue, per-origin cap, live queue position over the streaming channel, and shedding with a retry hint over REST — sharing one policy core with the peer admission gate, so both are fair by identical rules."

[[requirements]]
id = "UI-22"
family = "UI"
n = 22
level = "must"
spec_line = 2581
text = "Secure by default: bind to the loopback interface, and refuse at start-up a non-loopback bind with authentication disabled, with an explicit opt-out."

[[requirements]]
id = "UI-23"
family = "UI"
n = 23
level = "must"
spec_line = 2585
text = "**A configuration that enables authentication with an empty credential set MUST NOT serve unauthenticated traffic.** Authentication engaging only when a mode *and* a non-empty credential set are both present is a gap the exposure guard does not close."

[[requirements]]
id = "UI-24"
family = "UI"
n = 24
level = "must"
spec_line = 2590
text = "Capabilities whose safety rests on \"one operator owns this box\" MUST be removable at build time (X-PV-2), grouped by what they grant: **privilege** (anything reaching a shell, ingesting a server-side path, or mounted after the authentication layer) and **egress** (anything reaching the public network)."

[[requirements]]
id = "UI-25"
family = "UI"
n = 25
level = "must"
spec_line = 2596
text = "A route registered *after* the authentication layer and guarded only by a local-address check is **not** protected: a same-host reverse proxy satisfies it for every remote caller."

[[requirements]]
id = "UI-26"
family = "UI"
n = 26
level = "must"
spec_line = 2602
text = "A thin client MUST be supportable with **no** local inference, runtime, or knowledge: transport, a display cache, and a fail-closed connectivity monitor."

[[requirements]]
id = "UI-27"
family = "UI"
n = 27
level = "must"
spec_line = 2606
text = "Long context MUST be host-side: the client sends only the new turn and a conversation identifier, never re-uploads history and never embeds."

[[requirements]]
id = "UI-28"
family = "UI"
n = 28
level = "must"
spec_line = 2609
text = "The client MUST re-emit the same stream events the shared rendering layer consumes, so one rendering implementation serves both."

[[requirements]]
id = "UI-29"
family = "UI"
n = 29
level = "must"
spec_line = 2612
text = "Local-only sources MUST be privacy-badged on the client."

[[requirements]]
id = "UI-30"
family = "UI"
n = 30
level = "must"
spec_line = 2616
text = "A three-layer support surface MUST exist, in the order a person hits them: 1. **Fix it yourself** — a health panel running a fixed check set over gathered facts, with a pure evaluation function, a terminal-free repair hint on every non-OK check, and **unknown** rendered for an unreachable probe (never a fabricated verdict). 2. **Report the machine** — a diagnostic report file for **any** reason, not only a crash, with an unknown reason degrading to *other* (a user trying to report a problem must never be blocked by an enumeration). 3. **Report one answer** — a per-turn report for the complaint that machine state cannot explain, assembled from the delivered message's **persisted** metadata rather than from in-memory state."

[[requirements]]
id = "UI-31"
family = "UI"
n = 31
level = "must"
spec_line = 2629
text = "Each report MUST carry a short speakable **reference code** derived from the message identity by a **pinned** function — a wire format, not an implementation detail (X-CO-2)."

[[requirements]]
id = "UI-32"
family = "UI"
n = 32
level = "must"
spec_line = 2633
text = "Source text in a report MUST be opt-in per report, defaulted off, with the gate enforced by the renderer rather than trusted to the caller."

[[requirements]]
id = "UI-33"
family = "UI"
n = 33
level = "must"
spec_line = 2636
text = "Every report MUST be a file the user reads before sending, and MUST **state its own contents**, derived from what is actually in the file (X-PV-6)."

[[requirements]]
id = "UI-34"
family = "UI"
n = 34
level = "must"
spec_line = 2640
text = "Documentation MUST exist in two registers: a no-terminal guide for end users and a maintainer guide, with the maintainer guide pointing at the user one."

[[requirements]]
id = "UI-35"
family = "UI"
n = 35
level = "should"
spec_line = 2646
text = "The application SHOULD register a custom URL scheme for create/join flows, carrying reachability hints, plus a system tray with status and a pause control."

[[requirements]]
id = "WF-1"
family = "WF"
n = 1
level = "should"
spec_line = 2656
text = "A typed dataflow **workflow** capability SHOULD exist — steps producing artefacts, run by a runner, over local model steps — with a content-addressed cache and collection mapping."

[[requirements]]
id = "WF-2"
family = "WF"
n = 2
level = "must"
spec_line = 2660
text = "The step-kind catalogue MUST be the single source from which any authoring schema is derived (X-SD-4)."
conditional_on = "WF-1"

[[requirements]]
id = "WF-3"
family = "WF"
n = 3
level = "must"
spec_line = 2663
text = "Two run entry points MUST exist: one building its own provider (for command-line and automatic triggers) and one taking an **injected** provider plus an optional per-step observer (for a graphical host streaming progress)."

[[requirements]]
id = "WF-4"
family = "WF"
n = 4
level = "must"
spec_line = 2667
text = "A workflow MUST be diffable byte-for-byte against the production pipeline stage it claims to replicate, or the claim is unproven."

[[requirements]]
id = "WF-5"
family = "WF"
n = 5
level = "should"
spec_line = 2670
text = "Natural-language workflow authoring SHOULD mirror source- specification authoring: a constrained structured author, validation, and test."

[[requirements]]
id = "WF-6"
family = "WF"
n = 6
level = "must"
spec_line = 2673
text = "The authoring project model MUST carry an artefact **kind**, so one checkpoint, decision-log, and workspace machinery backs every artefact type."

[[requirements]]
id = "WF-7"
family = "WF"
n = 7
level = "should"
spec_line = 2678
text = "The authoring surface SHOULD be **liftable**: buildable against only the protocol contracts, with no dependency on the reasoning runtime, the knowledge substrate, or the federation layer — enforced by an automated boundary gate against a written contract."

[[requirements]]
id = "WF-8"
family = "WF"
n = 8
level = "must"
spec_line = 2683
text = "A headless authoring client MUST exist that authors and tests against any conforming endpoint — the proof the package is independently usable."
conditional_on = "WF-7"

[[requirements]]
id = "WF-9"
family = "WF"
n = 9
level = "must"
spec_line = 2687
text = "Where a shared vocabulary is needed by both the authoring package and the knowledge substrate, it MUST be carved into a leaf both reach **downward** to. The upper layer must never reach up."

[[requirements]]
id = "WF-10"
family = "WF"
n = 10
level = "must"
spec_line = 2693
text = "The system MUST be pointable-at by unmodified third-party tools, and MUST publish task-oriented recipes per socket plus a statement of which surfaces are contracts and which are not."

[[requirements]]
id = "WF-11"
family = "WF"
n = 11
level = "must"
spec_line = 2697
text = "A conformance tester for the capability protocol SHOULD ship standalone, with minimal dependencies, so a third party can certify their own implementation."

[[requirements]]
id = "X-CF-1"
family = "X-CF"
n = 1
level = "must"
spec_line = 459
text = "Every configuration knob MUST be declared in one registry carrying its name, default, purpose, and lifecycle status. An undeclared knob MUST fail an automated check."

[[requirements]]
id = "X-CF-2"
family = "X-CF"
n = 2
level = "must"
spec_line = 463
text = "Every capability shipped disabled or dark MUST carry a ledger entry stating the falsifiable condition that would enable it and a review-by date. Shipping dark without that entry is non-conforming."

[[requirements]]
id = "X-CF-3"
family = "X-CF"
n = 3
level = "must"
spec_line = 469
text = "Path and location derivations MUST come from single accessors, with hand-rolled derivations mechanically banned."

[[requirements]]
id = "X-CF-4"
family = "X-CF"
n = 4
level = "must"
spec_line = 472
text = "A configuration field and the runtime state it purports to describe MUST NOT be allowed to diverge silently. Where a runtime policy can override a configured value, any consumer asking \"what is in effect\" MUST read the effective value, never the configured one."

[[requirements]]
id = "X-CO-1"
family = "X-CO"
n = 1
level = "must"
spec_line = 482
text = "Artefacts authored outside the repository — user-written source specifications, third-party integrations, published data bundles — MUST keep loading indefinitely. The compatibility discipline MUST include: new fields default; renamed fields keep aliases; removed alternatives get a deprecation path that names the replacement; a schema version gates only changes readers must opt into; and a regression fixture suite pins old forms."

[[requirements]]
id = "X-CO-2"
family = "X-CO"
n = 2
level = "must"
spec_line = 489
text = "Any value a third party can observe and depend on — a reference code shown to a user, a wire field name, a public identifier — is a contract. Changing it MUST be treated as a breaking change."

[[requirements]]
id = "X-CO-3"
family = "X-CO"
n = 3
level = "must"
spec_line = 493
text = "Where a capability's data is published for others to download, the publish operation MUST refuse a bundle with a defect the downloader cannot repair. Publish is the last point at which such a defect is still the publisher's."

[[requirements]]
id = "X-DG-1"
family = "X-DG"
n = 1
level = "must"
spec_line = 342
text = "A build failure, a link failure, a bad configuration, and a crashed subprocess MUST all be reported as failures by any gate that claims to have checked the thing they prevented. A gate that counts only one class of diagnostic and reports the rest as clean is non-conforming."

[[requirements]]
id = "X-DG-2"
family = "X-DG"
n = 2
level = "must"
spec_line = 347
text = "Results that cannot be attributed to the run that requested them MUST be reported as unattributable, not returned. Where a shared artifact can be overwritten by a concurrent run, the reader MUST detect this and refuse."

[[requirements]]
id = "X-DG-3"
family = "X-DG"
n = 3
level = "must"
spec_line = 351
text = "A stale artifact MUST NOT be able to masquerade as a fresh one. Any cached, exported, or reported artifact MUST carry a freshness stamp, and the reader MUST report age. Where an artifact is regenerated, the previous one MUST be removed *before* the run, so that \"no artifact\" unambiguously means \"this run produced nothing\"."

[[requirements]]
id = "X-DG-4"
family = "X-DG"
n = 4
level = "must"
spec_line = 357
text = "Fail-closed by default at trust boundaries; fail-open only where a stated analysis shows failing closed is worse, and then only with the degradation surfaced to the user."

[[requirements]]
id = "X-DG-5"
family = "X-DG"
n = 5
level = "must"
spec_line = 361
text = "A degraded mode MUST be visible in the product, not inferable from a configuration file. When a capability is running in a reduced form, the surface using it MUST say so."

[[requirements]]
id = "X-DG-6"
family = "X-DG"
n = 6
level = "must"
spec_line = 365
text = "Recovery MUST be a user-reachable state, not a restart. A crashed subordinate process MUST leave the interface alive and offer a reconnect, rather than taking the interface with it."

[[requirements]]
id = "X-DG-7"
family = "X-DG"
n = 7
level = "must"
spec_line = 369
text = "Retry and restart policies MUST count *consecutive* failures and reset only on positive evidence of health (a generation that survived a stated duration). A sliding wall-clock window is non-conforming: it is unreachable for any subordinate whose failure cycle is longer than the window."

[[requirements]]
id = "X-DG-8"
family = "X-DG"
n = 8
level = "must"
spec_line = 378
text = "Backoff MUST be floored at the previous generation's *measured* start-up cost, so an expensive subordinate can never re-enter start-up back-to-back."

[[requirements]]
id = "X-EH-1"
family = "X-EH"
n = 1
level = "must"
spec_line = 142
text = "Absence MUST be reported, never defaulted. When a value is unavailable, the system MUST propagate a typed *absence* distinguishable from every legitimate value. It MUST NOT substitute a plausible default, a zero, an empty collection, or a neutral score."

[[requirements]]
id = "X-EH-2"
family = "X-EH"
n = 2
level = "must"
spec_line = 150
text = "A check MUST have four possible verdicts, not two: **passed**, **failed**, **could-not-judge**, **never-ran**. Any surface reporting the health of a check MUST be able to express all four. Collapsing *could-not-judge* or *never-ran* into either *passed* or *failed* is non-conforming."

[[requirements]]
id = "X-EH-3"
family = "X-EH"
n = 3
level = "must"
spec_line = 158
text = "A zero-work run MUST NOT report success. A test selection that matched nothing, a scan that examined nothing, a fan-out that reached nothing, and an evaluation over an empty set MUST each exit with a distinct non-success status naming the empty scope."

[[requirements]]
id = "X-EH-4"
family = "X-EH"
n = 4
level = "must"
spec_line = 163
text = "Where the system substitutes one thing for another — a different model, a different source, a fallback path — it MUST either refuse, or name the substitution in its own output. Silent substitution is non-conforming."

[[requirements]]
id = "X-EH-5"
family = "X-EH"
n = 5
level = "must"
spec_line = 168
text = "An empty \"what was lost\" report MUST mean *nothing was lost*, and MUST NOT be reachable by a path that failed to look. Every loss detection site MUST record what it was asked for even when it cannot report what happened to it."

[[requirements]]
id = "X-EH-6"
family = "X-EH"
n = 6
level = "must"
spec_line = 176
text = "A single observation MUST NOT be reported as a measurement. Any claim of the form \"X is faster/better than Y\" MUST be accompanied by the number of trials, the spread, and the conditions; a difference within the measured noise band MUST be reported as *not distinguishable*, not as a win."

[[requirements]]
id = "X-EH-7"
family = "X-EH"
n = 7
level = "must"
spec_line = 181
text = "An instrument MUST be validated before its result is believed. An arm of an experiment MUST first be proven *connected* — shown able to move the number at all — before a null result from it is reported."

[[requirements]]
id = "X-EH-8"
family = "X-EH"
n = 8
level = "must"
spec_line = 185
text = "A change to a judge, scorer, threshold, or veto MUST be reported in **both** directions: the cases it newly catches and the cases it newly lets through. Reporting only the direction the change was designed to fix is non-conforming."

[[requirements]]
id = "X-EH-9"
family = "X-EH"
n = 9
level = "must"
spec_line = 190
text = "Where the system declines or refuses, it MUST name the reason as a typed value, not as prose, and the reason MUST be distinguishable by machine. Distinct refusal causes MUST NOT collapse into one."

[[requirements]]
id = "X-EX-1"
family = "X-EX"
n = 1
level = "must"
spec_line = 384
text = "A closed set of alternatives MUST be represented as an exhaustive typed set with no catch-all, such that adding a member fails to build until every site handles it. Control flow over a closed set MUST NOT be driven by string comparison."

[[requirements]]
id = "X-EX-2"
family = "X-EX"
n = 2
level = "must"
spec_line = 389
text = "An open set of alternatives (extensions, plugins, user-authored sources, third-party tools) MUST be a runtime registry with an explicit unknown-member policy, and the unknown-member behaviour MUST be specified and tested — not left as whatever the dispatch happens to do."

[[requirements]]
id = "X-EX-3"
family = "X-EX"
n = 3
level = "must"
spec_line = 394
text = "Open natural-language classification MUST NOT be performed by keyword lists. It MUST use a learned representation with a calibrated decision boundary and a measurable abstention rate."

[[requirements]]
id = "X-EX-4"
family = "X-EX"
n = 4
level = "must"
spec_line = 398
text = "Configuration that describes *what*, rather than *how*, MUST be data — declarative, external, versioned, and loadable — not code. The set of things that must be data includes at minimum: source ingestion specifications, tool declarations, retrieval pipeline composition, role profiles, model selection per hardware class, and layer/dependency policy."

[[requirements]]
id = "X-EX-5"
family = "X-EX"
n = 5
level = "must"
spec_line = 404
text = "Where a new extension type is added, the cost MUST be one declaration plus one implementation, with no edits to any dispatch site. If adding an extension requires editing a switch, the extension point is mis-shaped."

[[requirements]]
id = "X-EX-6"
family = "X-EX"
n = 6
level = "should"
spec_line = 409
text = "Every extension point SHOULD ship a template that is itself validated by an automated check, so the scaffold cannot rot into a wrong example. A paragraph of documentation does not reduce the cost of reaching for a shared surface; a working block already wired to it does."

[[requirements]]
id = "X-OB-1"
family = "X-OB"
n = 1
level = "must"
spec_line = 240
text = "Every decision that changes what the user receives MUST be visible at a diagnostic verbosity level, without a rebuild and without a code change. A branch of production code with no diagnostic event is non-conforming."

[[requirements]]
id = "X-OB-2"
family = "X-OB"
n = 2
level = "must"
spec_line = 244
text = "Diagnostic output MUST reach the operator in every deployment shape, including a detached background service with no attached terminal. A diagnostic channel that works only in the foreground is not a diagnostic channel."

[[requirements]]
id = "X-OB-3"
family = "X-OB"
n = 3
level = "must"
spec_line = 252
text = "Where a process is composed of stages, the system MUST be able to attribute its own wall-clock time across those stages, and MUST emit a **residual** — time claimed by no stage — including when the residual is zero. An unattributed stage MUST therefore surface as unexplained seconds rather than disappear."

[[requirements]]
id = "X-OB-4"
family = "X-OB"
n = 4
level = "must"
spec_line = 258
text = "Attribution MUST be recorded from *observed execution*, never inferred from configuration. Recording \"the fast path was enabled\" is not recording that the fast path ran."

[[requirements]]
id = "X-OB-5"
family = "X-OB"
n = 5
level = "must"
spec_line = 262
text = "Where the system defers, waits, retries, or declines, it MUST emit an event at the moment it does so, carrying enough state to reconstruct why. A silent wait is non-conforming."

[[requirements]]
id = "X-OB-6"
family = "X-OB"
n = 6
level = "should"
spec_line = 266
text = "Any expensive repeated operation SHOULD carry a mechanism to answer \"did this reuse prior work?\" by comparing identities, not by observing that a duration was short."

[[requirements]]
id = "X-PR-1"
family = "X-PR"
n = 1
level = "must"
spec_line = 199
text = "Every retrievable unit of content MUST carry, as a required non-defaultable property, (a) whether it was **acquired** from a source the system indexed or **manufactured** by the system itself, and (b) its **granularity** — whether it is verbatim source text or a derived summary."

[[requirements]]
id = "X-PR-2"
family = "X-PR"
n = 2
level = "must"
spec_line = 204
text = "Manufactured content MUST NOT be quotable as a citation. It MAY orient an answer; it MUST NOT ground one."

[[requirements]]
id = "X-PR-3"
family = "X-PR"
n = 3
level = "must"
spec_line = 207
text = "The acquired classification MUST have no public constructor. It MUST be stampable only by a small, enumerable set of **doors** — the specific code paths that genuinely observe the fact — and that door set MUST be pinned by an automated check that fails when a new door appears."

[[requirements]]
id = "X-PR-4"
family = "X-PR"
n = 4
level = "must"
spec_line = 215
text = "When content crosses a trust boundary, its custody class MUST be joined with the receiving node's own fact about that boundary at maximum restrictiveness. A peer MUST NOT be able to talk its own content down to a looser class, and a missing granularity from a peer MUST read as the *refusing* value."

[[requirements]]
id = "X-PR-5"
family = "X-PR"
n = 5
level = "must"
spec_line = 221
text = "An answer MUST record, per turn: which route was taken, which sources were consulted, which were unreachable, which model served it, which verification steps ran, and what each concluded. This record MUST survive persistence and be re-readable after a restart."

[[requirements]]
id = "X-PR-6"
family = "X-PR"
n = 6
level = "must"
spec_line = 226
text = "A citation MUST identify *where* in a source it came from at the finest granularity the source structure supports — not merely which document. Where a source declares internal structure, the citation MUST name the structural unit."

[[requirements]]
id = "X-PR-7"
family = "X-PR"
n = 7
level = "must"
spec_line = 231
text = "Any two mechanisms that decide whether a quotation is verbatim MUST agree, or one of them MUST be removed. Where a strict and a tolerant check both exist, the strict one MUST govern what is *labelled*."

[[requirements]]
id = "X-PV-1"
family = "X-PV"
n = 1
level = "must"
spec_line = 416
text = "No content leaves the machine except through channels the user has enabled. The complete set of outbound channels MUST be enumerable by the system itself and each MUST be individually disableable."

[[requirements]]
id = "X-PV-2"
family = "X-PV"
n = 2
level = "must"
spec_line = 420
text = "Outbound capability MUST be removable at build time, not only switchable at runtime, so an air-gapped deployment can be *audited* rather than *trusted*."

[[requirements]]
id = "X-PV-3"
family = "X-PV"
n = 3
level = "invariant"
spec_line = 428
text = "Content classified as personal or local-scope MUST NOT be shareable to peers by any path. This MUST be enforced at more than one layer — at minimum: at the source declaration, at ingestion, and at every egress seam — so that no single mistake is sufficient to leak."

[[requirements]]
id = "X-PV-4"
family = "X-PV"
n = 4
level = "must"
spec_line = 433
text = "Sources marked sensitive MUST be excluded from ambient (unrequested) retrieval while remaining explicitly askable."

[[requirements]]
id = "X-PV-5"
family = "X-PV"
n = 5
level = "must"
spec_line = 436
text = "A user's own usage telemetry MUST NOT be replicated to peers. Contribution accounting (what I did *for others*) and activity accounting (what I did *for myself*) MUST be separate stores with different replication policies."

[[requirements]]
id = "X-PV-6"
family = "X-PV"
n = 6
level = "must"
spec_line = 441
text = "Diagnostic reports MUST be local files the user reads before sending. No automatic upload of any diagnostic, crash record, or usage record. A report MUST state its own contents, derived from what is actually in it."

[[requirements]]
id = "X-PV-7"
family = "X-PV"
n = 7
level = "must"
spec_line = 445
text = "Where the system records behavioural telemetry locally, the record type MUST be structurally incapable of carrying content — no free-form field, no untyped value — so that no document text, path, or user input has a channel into the file. The consent surface MUST be able to print the complete field list of the file it writes, collected from the written bytes rather than from a maintained list."

[[requirements]]
id = "X-PV-8"
family = "X-PV"
n = 8
level = "must"
spec_line = 452
text = "Where content is temporarily entrusted to a peer for processing, the grant MUST be explicit, scoped to named peers, time-limited, revocable, and MUST NOT mutate the content's standing sharing posture. Teardown MUST be verified by at least two independent paths."

[[requirements]]
id = "X-SD-1"
family = "X-SD"
n = 1
level = "invariant"
spec_line = 272
text = "Every threshold, formula, schema, storage layout, identity key, readiness predicate, and eligibility rule MUST have exactly one implementation. Two implementations of one rule is a defect regardless of whether they currently agree."

[[requirements]]
id = "X-SD-2"
family = "X-SD"
n = 2
level = "must"
spec_line = 284
text = "Where a decision must be visible in two places (a preview and its execution; a filter and its disclosure; a producer and its consumer), both MUST call the same implementation. Copying a schema, even verbatim, creates a second decider that will drift."

[[requirements]]
id = "X-SD-3"
family = "X-SD"
n = 3
level = "must"
spec_line = 289
text = "Identity MUST derive from essence, never from an address, a counter, a row number, a sequence number, or a name prefix. Two things that are the same MUST compute the same identity from different machines at different times."

[[requirements]]
id = "X-SD-4"
family = "X-SD"
n = 4
level = "must"
spec_line = 294
text = "Where a declared property (a tool's parameters, a source's schema, a capability's shape) is both *presented* to a component and *enforced* against it, the presented form MUST be derived from the enforced form, not authored beside it."

[[requirements]]
id = "X-SD-5"
family = "X-SD"
n = 5
level = "must"
spec_line = 299
text = "A per-item attribute set MUST be a total record with no default. Adding a new item MUST fail to build until every attribute is supplied."

[[requirements]]
id = "X-ST-1"
family = "X-ST"
n = 1
level = "must"
spec_line = 308
text = "An invariant MUST be encoded so it cannot be forgotten. The acceptable mechanisms, in order of preference: make the illegal state unrepresentable; make the illegal construction fail to compile; make the illegal state fail an automated check on every run. A comment, a convention, a review checklist, or a note in documentation is not an enforcement mechanism."

[[requirements]]
id = "X-ST-2"
family = "X-ST"
n = 2
level = "must"
spec_line = 314
text = "A generative model MUST NOT be asked to guarantee a behaviour that code can enforce. Where a prompt asks a model not to do something, and the consequence of it doing so is a correctness failure, a deterministic guard MUST exist at the exit seam regardless. Asking is not a guarantee."

[[requirements]]
id = "X-ST-3"
family = "X-ST"
n = 3
level = "must"
spec_line = 322
text = "Where a set of code paths must all route through one funnel, that constraint MUST be checked mechanically — for example by a build-time assertion that no member of a region reaches the underlying primitive directly."

[[requirements]]
id = "X-ST-4"
family = "X-ST"
n = 4
level = "must"
spec_line = 327
text = "A liveness bound MUST NOT be a configuration option. A timeout, deferral cap, or budget that exists to prevent an indefinite wait MUST be compiled in, and configuration MUST be able only to tighten it, never to weaken or remove it."

[[requirements]]
id = "X-ST-5"
family = "X-ST"
n = 5
level = "must"
spec_line = 336
text = "Where two channels must not be confused (per-request output versus broadcast output; two trust surfaces of the same API), they MUST NOT share a type. The confusion must fail to compile, not fail a review."

[[scenarios]]
id = "A-1"
suite = "16.1 The honesty acceptance suite"
line = 3355
text = "For every requirement in §2.1 (X-EH), the rebuild MUST demonstrate a **failing case before the guard and a passing case after** — the failure must have been watched to fail."
