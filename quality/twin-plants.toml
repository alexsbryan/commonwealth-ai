# ── sovereign-mesh ─────────────────────────────────────────────────────────
#
# The parity suite's twin is a ROUTER wired without the loopback guard, not a
# source-text needle — so the plant strips the middleware from `mesh_router`
# and the suite must fail closed. Two things about this family are known and
# are the runner's job to report, not mine to assert:
#
#   * `loopback_parity.rs` is `#![cfg(feature = "treesitter")]`, and I
#     predicted a package-scoped run would compile it out and report zero
#     tests. MEASURED 2026-09-10: WRONG. `resolve_features` emits
#     `sovereign-mesh/treesitter` when sovereign-mesh is itself the selected
#     package, so the file compiles and the test runs. The prediction is kept
#     here rather than deleted because it is the kind of guess §18.2 warns
#     about: an abstention reasoned about in advance, which the run refuted.
#   * the crate's test harness is under active edit by a peer, which is why
#     `tests/main.rs` is a guard path: a green measured against someone
#     else's uncommitted work judges nothing.

[[family]]
# Replaces `mesh-loopback-parity` and `mesh-loopback-spoof`, both of which came
# back NOT-A-GATE on 2026-09-10 (f6a633519) and were re-confirmed NOT-A-GATE on
# the sv-surface mesh rung. Their tests could not see the plant because
# `mesh_status` extracts ConnectInfo and calls `enforce_localhost` itself: the
# spoofed LAN caller was 403'd by the HANDLER and the ConnectInfo-less caller
# 500'd in the extractor, so both assertions were over-determined. The two
# guards also answer with the same body (`{"error":"local-only"}`, one
# decider), so no body assertion separated them either.
#
# The fix is an assertion no handler can satisfy because no handler runs:
# `every_router_refuses_a_request_no_handler_of_ours_can_refuse` drives a
# method the path does not serve, which lands on axum's MethodRouter fallback
# — layered like every other endpoint, so `loopback_only` still sees it. With
# the guard: 403. Without it: 405. Watched red on this tree.
#
# The two retired entries are NOT kept as standing NOT-A-GATE rows: a census
# whose verdict never changes teaches people to skim the table. The finding
# lives in loopback_parity.rs's own module doc, beside the tests it is about.
id          = "mesh-loopback-layer"
crate       = "sovereign-mesh"
census      = "sovereign/crates/sovereign-mesh/tests/main/loopback_parity.rs"
mustFail    = ["every_router_refuses_a_request_no_handler_of_ours_can_refuse"]
breaks      = "a loopback-only router wired without the guard middleware — the LAN-reachable admin surface"
target      = "sovereign/crates/sovereign-daemon/src/mesh_http.rs"
guard_paths = [
    "sovereign/crates/sovereign-mesh/tests/main.rs",
    "sovereign/crates/sovereign-mesh/tests/main/common/mod.rs",
]
expect_red  = "only the router's `loopback_only` layer can refuse it"
# Re-planted 2026-09-10: the old `find` occurred 0x. d9e2577d5 folded the two
# repeated `.layer(...)` calls into `LoopbackRouter::localhost_only_with`, and
# the per-handler guard into the `LocalOnly` extractor — so the guard is now
# ONE call, and stripping that call is the same twin with a shorter diff. The
# dead `planted_sealed_nothing` keeps the `LoopbackRouter` import in use, so
# the plant removes the GUARD and nothing else.
find        = '''        .localhost_only_with(daemon)
}'''
replace     = '''        // TWIN-CENSUS PLANT (scripts/twin-census.py) — the router-level
        // loopback guard, removed. The per-handler `LocalOnly` extractors
        // stay, which is exactly the half-defended state the parity suite
        // exists to catch.
        .layer(Extension(daemon))
}

/// TWIN-CENSUS PLANT (scripts/twin-census.py) — holds the `LoopbackRouter`
/// import in use so the plant above changes the guard and nothing else.
#[allow(dead_code)]
fn planted_sealed_nothing() -> Router {
    Router::new().localhost_only()
}'''

