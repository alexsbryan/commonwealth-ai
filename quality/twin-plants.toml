# `tests/*.rs` cannot name `AppState`, `new_with_mode` needs a real
# `AppHandle`, and the spine needs a real GGUF at `slots.fast`. Recorded
# there rather than hidden: the census reads the command files as text, and
# the plant re-adds the local primitive to the file it was retired from.
#
# Watched red 2026-09-10 on this tree with three simultaneous plants — the
# built-in catalogue read back in `corpus.rs`, `diagnose_corpus` deleted
# instead of repointed, and the in-process `CorpusEngine::ingest` back in
