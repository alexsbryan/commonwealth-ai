# ── sovereign-mesh ─────────────────────────────────────────────────────────
#
# The parity suite's twin is a ROUTER wired without the loopback guard, not a
# source-text needle — so the plant strips the middleware from `mesh_router`
# and the suite must fail closed. Two things about this family are known and
# are the runner's job to report, not mine to assert:
#
#   * `loopback_parity.rs` is `#![cfg(feature = "treesitter")]`, and I
#     predicted a package-scoped run would compile it out and report zero
#     tests. MEASURED 2026-09-10: WRONG. `resolve_features` emits
#     `sovereign-mesh/treesitter` when sovereign-mesh is itself the selected
#     package, so the file compiles and the test runs. The prediction is kept
#     here rather than deleted because it is the kind of guess §18.2 warns
#     about: an abstention reasoned about in advance, which the run refuted.
#   * the crate's test harness is under active edit by a peer, which is why
#     `tests/main.rs` is a guard path: a green measured against someone
#     else's uncommitted work judges nothing.

[[family]]
id          = "mesh-loopback-parity"
crate       = "sovereign-mesh"
census      = "sovereign/crates/sovereign-mesh/tests/main/loopback_parity.rs"
mustFail    = ["every_router_fails_closed_when_connect_info_absent"]
breaks      = "a loopback-only router wired without the guard middleware — the LAN-reachable admin surface"
target      = "sovereign/crates/sovereign-mesh/src/mesh_http.rs"
guard_paths = [
    "sovereign/crates/sovereign-mesh/tests/main.rs",
    "sovereign/crates/sovereign-mesh/tests/main/common/mod.rs",
]
expect_red  = "must fail closed (500) when ConnectInfo is absent"
find        = '''        .layer(axum::middleware::from_fn(
            crate::loopback_guard::loopback_only,
        ))
        .layer(Extension(daemon))'''
replace     = '''        // TWIN-CENSUS PLANT (scripts/twin-census.py) — the router-level
        // loopback guard, removed. The per-handler `enforce_localhost`
        // checks stay, which is exactly the half-defended state the parity
        // suite exists to catch.
        .layer(Extension(daemon))'''

# The SECOND test in the same parity file, same plant. Registered after
# `mesh-loopback-parity` came back NOT-A-GATE (2026-09-10), because "one test
# in the family is blind" and "the family is blind" are different findings and
# only a run tells them apart (§18.1 — do not reason about what a test would
# have caught).

[[family]]
id          = "mesh-loopback-spoof"
crate       = "sovereign-mesh"
census      = "sovereign/crates/sovereign-mesh/tests/main/loopback_parity.rs"
mustFail    = ["mesh_http_rejects_non_loopback_via_mesh_status"]
breaks      = "a loopback-only router wired without the guard middleware — the LAN-reachable admin surface"
target      = "sovereign/crates/sovereign-mesh/src/mesh_http.rs"
guard_paths = [
    "sovereign/crates/sovereign-mesh/tests/main.rs",
    "sovereign/crates/sovereign-mesh/tests/main/common/mod.rs",
]
expect_red  = "mesh_http loopback guard slipped"
find        = '''        .layer(axum::middleware::from_fn(
            crate::loopback_guard::loopback_only,
        ))
        .layer(Extension(daemon))'''
replace     = '''        // TWIN-CENSUS PLANT (scripts/twin-census.py) — the router-level
        // loopback guard, removed.
        .layer(Extension(daemon))'''
