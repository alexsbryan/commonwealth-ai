#    UNCONSTRUCTIBLE — NOT BECAUSE THE CENSUS STOPPED MATTERING ────────────────
#
# Read this before adding any of them back. The first measurement of
# sv-surface's sv-twin-census bar (2026-09-13) came back proved-red 7 /
# could-not-judge 13: ten plants NO LONGER COMPILED and three had a `find`
# anchor occurring 0x. The cause is sv-surface itself — svt-3, svt-6 and svt-7
# deleted the crates, the AppState members and the constructors these plants
# use to write their twin. A plant cannot plant what the crate graph will not
# let anyone write.
#
# WHAT ACTUALLY GUARDS THESE FAMILIES NOW, and why it is STRONGER than a plant:
# `[thin_surfaces]` in quality/ARCH_LAYERS.toml is an ALLOWLIST —
#   may_reach = oicp-types, kernel-types, sovereign-contracts, oicp-client,
#              sovereign-turn-client, sovereign-time, sovereign-tools-base
# and its own comment says "every workspace crate a surface reaches outside
# this list is a violation, HOWEVER IT REACHES IT". Every crate below is
# outside it. `cargo xtask layer-gate` decides that over Cargo's own graph,
# transitively, so it fires on the DEPENDENCY EDGE — before anyone could write
# the call a census would have had to spot. A census plant proves one detector
# catches one spelling in one file (the needle-list weakness this bar's
# `goodhart` field records); the allowlist proves the crate cannot be reached
# at all. That is ARCH principle 10 (structural, not remembered) and principle
# 12 (each side owns what it owns): the census owned "is a twin written here",
# the crate graph now owns "can this crate be reached", and the second subsumes
# the first. The allowlist half was WATCHED RED on 2026-09-13 — 0 on a clean
# tree, 1 against a copy of ARCH_LAYERS.toml carrying one planted
# `from = "sovereign-desktop"` exception row.
