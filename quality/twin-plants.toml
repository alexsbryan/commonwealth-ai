# TWIN PLANTS — the failing input for every family census.
#
# sv-surface's third construction: "per family, a planted second
# implementation turns the family census red." ARCH §18.1 — a gate you have
# not WATCHED fail is not a gate — and every census in this list already
# claims in its own header that it was "sabotage-verified at landing". That
# claim was a reviewer's word. This file makes it a run.
#
# `scripts/twin-census.py` reads this registry and, per family:
#   1. runs the census on the clean tree (red-before-planting is
#      could-not-judge, never proof);
#   2. applies `find` -> `replace` in `target` — a REAL second
#      implementation, not a weakened assertion;
#   3. runs the census again and requires it to FAIL *naming* `expect_red`;
#   4. restores the file byte-for-byte and verifies the restore.
#
# THE SCHEMA IS NOT NEW (ARCH §19, the inventory outranks the plan). It is
# `quality/sabotage/*.toml`'s, field for field — `target` / `find` / `replace`
# / `mustFail` / `breaks` — which is in turn `tests/e2e/sabotage-bank.mjs`'s.
# A plant therefore lifts between `scripts/sabotage.py` (whole-workspace
# adjudicator, richer verdicts) and this runner (scoped, message-checking)
# without translation. `expect_red` is the ONE field neither of them has, and
# the reason this runner exists at all — see its module docstring for the full
# accounting of why sabotage.py could not serve.
#
# WRITING A PLANT:
#
#   find        a substring occurring EXACTLY ONCE in `target`. The
#               runner reports STALE (could-not-judge) when that stops being
#               true, which is the anti-rot mechanism: a plant that silently
#               stops applying is worse than no plant, because the table
#               keeps printing proved-red.
#   replace     must still COMPILE. A plant that breaks the build proves
#               nothing about the census — the run goes red for the wrong
#               reason, and the runner calls that could-not-judge, not
#               proof. Dead code carries `#[allow(dead_code)]` for the same
#               reason.
#   expect_red  a substring of the assertion message the census is supposed
#               to print. "It failed" is not enough: a census that goes red
#               on an unrelated assertion has not been shown to detect THIS
#               twin.
#   guard_paths files that must be clean in `git status --porcelain` before
#               the runner will plant. Always includes `target` (the
#               restore is `git checkout --`, which would eat a peer's
#               uncommitted work) and `census`; add the test harness when a
#               peer is likely to be mid-edit in it.
#
# The plant is a MUTATION OF PRODUCTION SOURCE, applied and reverted inside
# one runner invocation. Nothing here is ever committed into the tree.

[meta]
id      = "twin-censuses"
claim   = "quality/campaigns/sv-surface.toml — THE CLAIM, construction 3"
runner  = "scripts/twin-census.py"
minted  = "2026-09-10"

