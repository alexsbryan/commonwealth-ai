#
# The CONSUMER census, not the construction floor. `attach_construction_
# census.rs` counts what the boot spine BUILDS; this family counts what the
# command surface still READS out of those builds. 65b92cd15 measured the
# gap and it is the one that matters: a needle deleted while a read of it
