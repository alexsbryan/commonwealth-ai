# check-lanes.toml — the lane table `svrn quality check` runs.
#
# CONFIG AS DATA (ARCH §6). The runner
# (sovereign/crates/sovereign-cli/src/quality_check_cmd.rs) holds the
# four-verdict rule, the budget rule and the fingerprint; WHICH lanes exist,
# what each costs and what each needs are declared here, beside
# `env-flags.toml`, so adding a lane is an edit to a table rather than to a
# runner.
#
# Fields, all required unless noted:
#   id            stable lane id — the `--lane <id>` argument, the key in
#                 summary.json, the `subject` the lane must name in its
#                 verdict line. Identity from essence (ARCH §7.5): never a
#                 position in this file.
#   kind          `invariant` (a ceiling, a route, an absence — nothing a
#                 model decided) or `judged` (a model produced part of the
#                 verdict). Carried into summary.json so a reader can tell
#                 which kind of claim a green is.
#   enforcement   `hard` (not-passed fails the run), `soft` (recorded, never
#                 gates), `tracked` (recorded, no band exists yet).
#   est_secs      what the lane costs, and what the budget rule reserves for
#                 it: a lane whose est does not fit the remaining runway is
#                 SKIP(budget) = could-not-judge, so an est that lies in
#                 either direction is a bug here. Every value below was
#                 re-set on 2026-09-04 from ONE measured run of that lane on
#                 this host — one run is not a measurement (ARCH §18.5), so
#                 read them as first actuals, not as settled figures. The
#                 order's opening estimates were 300/150/120/90/30/240/180/
#                 180; chaos-monkey came in at 799 s against 240 and synth at
#                 546 against 180, which is the whole reason the measured
#                 `secs` in summary.json is persisted.
#   command       argv. `svrn` / `sovereign` / `sovereign-cli` resolve to the
#                 RUNNING dispatcher, never to PATH.
#   preconditions optional; a CLOSED set (quality_check_cmd::Precondition):
#                 `port-listening:<port>`, `slot-decodes:<slot>`,
#                 `corpus-installed:<id>`, `binary:<name>`,
#                 `host-quiet:<max 1-min load>`. An unmet one is
#                 could-not-judge NAMING it, and the lane does not run.
#   baseline_dir  optional; `<dir>/<fingerprint>/latest.json` is this lane's
#                 baseline for the current stack. A lane with none compares
#                 against nothing and says so.
#   bank          optional; hashed into the run fingerprint. Change the
#                 questions and last week's numbers stop being comparable —
#                 which is the point, not an inconvenience.
#
# THE LANE PROTOCOL. The runner passes each lane:
#   SOVEREIGN_QUALITY_FINGERPRINT   the stack fingerprint hex
#   SOVEREIGN_QUALITY_OUT_DIR       target/quality-check/<stamp>
#   SOVEREIGN_QUALITY_BUDGET_SECS   seconds this lane may take
#   SOVEREIGN_QUALITY_BASELINE_DIR  absolute `baseline_dir`, when declared
#   SOVEREIGN_QUALITY_MINT          "1" only under `--mint`
# and reads back ONE thing: a `Judgement` on the lane's LAST stdout line
# (sovereign_cli_shared::lane_verdict). A lane that prints no such line is
# `never-ran` — never a pass.

schema_version = 1

# ── The focus lane ──────────────────────────────────────────────────
# Issue #57's turn, run against a corpus the lane ingests from source each
# time. The ingest IS the document-ingest lane the operator asked for: chunk
# count, search hit and readiness are asserted before a question is asked.

[[lane]]
id = "chat-ask"
kind = "judged"
enforcement = "hard"
est_secs = 300
command = ["svrn", "quality", "lane", "chat-ask"]
preconditions = [
    "port-listening:9741",
    "slot-decodes:primary",
    "binary:sovereign-cli-llm",
]
baseline_dir = "sovereign/bench/quality-check/baselines/chat-ask"
bank = "sovereign/bench/quality-check/chat-ask.toml"

# ── The throughput lane ─────────────────────────────────────────────
# Wraps `scripts/throughput_probe.py --json`, whose only caller today
# compares it against a gitignored baseline dir that does not exist — so it
# has never compared anything.

[[lane]]
id = "throughput"
kind = "invariant"
enforcement = "hard"
est_secs = 150
command = ["svrn", "quality", "lane", "throughput"]
preconditions = [
    "port-listening:9741",
    "slot-decodes:primary",
    "slot-decodes:fast",
    "binary:python3",
    # EVERY row of this lane is wall-clock (TTFT, decode tok/s), so the whole
    # lane is could-not-judge on a contended host rather than failed. Run 1
    # measured 17.8 tok/s against a 50 tok/s bar at load 32 and called it a
    # FAILURE; the bar was fine and the machine was busy (note d596639c).
    # chat-ask declares the same rule at ROW level, in its own bank, because
    # only one of its seventeen rows is wall-clock.
    "host-quiet:4",
]
baseline_dir = "sovereign/bench/quality-check/baselines/throughput"
bank = "sovereign/bench/quality-check/throughput.toml"

# ── The six sampled lanes ───────────────────────────────────────────
#
# These already existed and already ran. What they never did was SAY a
# verdict: `bench all` exits 1 for regressed, stale AND missing-baseline;
# `knowledge-gym` exits 3 for "below 0.9"; `chaos-monkey` exits 4 for
# "measured nothing". So each is wrapped by `quality lane bench`, which runs
# the verb UNCHANGED and reads the report it writes.
#
# The whole inner command line lives here, as data. `{report}` is the file
# the wrapper tells the verb to write; `{ids:<subset_id>}` expands to the ids
# `sovereign/bench/smoke.toml` declares, each repeated after the flag before
# it, so a curated list never lives in two files.
#
# WHICH items each runs is `sovereign/bench/smoke.toml` — one file, reviewed
# in one place, and its `subset_id`s are in the run fingerprint.
#
# HARD on CATASTROPHE ONLY. At six probes and ten questions a one-item flip
# is 12-20 points and a tolerance band is noise (RUNBOOK §6), so the scores
# are tracked with no band and the gating rows are the ones no sample size
# makes ambiguous: an errored item, an empty answer, an all-zero tally, an
# abstention on an answerable probe, a confabulation on an absent one. Drift
# is the nightly's question — `scripts/sovereign-ci-bench.sh` runs the full
# banks against committed per-lane baselines.

[[lane]]
id = "routing"
kind = "invariant"
enforcement = "hard"
est_secs = 90
command = [
    "svrn", "quality", "lane", "bench", "--id", "routing", "--reader", "bench-all", "--",
    "svrn", "bench", "all",
    "--bench-root", "sovereign/bench",
    "--routing-only",
    "--filter", "routing/cells_v1",
    "--smoke-subset", "routing-v1",
    "--report", "{report}",
]
preconditions = ["port-listening:9741", "slot-decodes:primary"]
bank = "sovereign/bench/routing/cells_v1.toml"

# Two commands, because no single `--filter` selects sep AND wikipedia and
# inventing a filter language to make it one would be a worse trade than
# running the verb twice.
[[lane]]
id = "retrieval-prod"
kind = "invariant"
enforcement = "hard"
est_secs = 110
command = [
    "svrn", "quality", "lane", "bench", "--id", "retrieval-prod", "--reader", "bench-all", "--",
    "svrn", "bench", "all",
    "--bench-root", "sovereign/bench",
    "--filter", "sep/questions",
    "--prod-pipeline", "--isolate",
    "--smoke-subset", "retrieval-prod-v1",
    "--report", "{report}",
    "--",
    "svrn", "bench", "all",
    "--bench-root", "sovereign/bench",
    "--filter", "wikipedia/questions",
    "--prod-pipeline", "--isolate",
    "--smoke-subset", "retrieval-prod-v1",
    "--report", "{report}",
]
preconditions = [
    "port-listening:9741",
    "slot-decodes:primary",
    "corpus-installed:sep",
    "corpus-installed:wikipedia",
]
bank = "sovereign/bench/sep/questions.toml"

# In-process: this one reads the corpus's own atoms.json and runs no model,
# which is why a full golden costs 30 s rather than minutes.
[[lane]]
id = "enrichment-f1"
kind = "invariant"
enforcement = "hard"
est_secs = 20
command = [
    "svrn", "quality", "lane", "bench", "--id", "enrichment-f1", "--reader", "bench-all", "--",
    "svrn", "bench", "all",
    "--bench-root", "sovereign/bench",
    "--filter", "literary/bk-book-1",
    "--smoke-subset", "enrichment-f1-v1",
    "--report", "{report}",
]
preconditions = ["corpus-installed:brothers-karamazov-book-1"]
bank = "sovereign/bench/literary/bk-book-1.toml"

[[lane]]
id = "chaos-monkey"
kind = "judged"
enforcement = "hard"
est_secs = 500
command = [
    "svrn", "quality", "lane", "bench", "--id", "chaos-monkey", "--reader", "chaos-monkey", "--",
    "svrn", "bench", "chaos-monkey", "run",
    "--bank", "sovereign/bench/chaos_monkey/secret_agent.toml",
    "--manifest", "sovereign/bench/chaos_monkey/manifest.toml",
    "--corpus", "chaos-secret-agent",
    "--smoke-subset", "chaos-monkey-v2",
    "--out", "{report}",
]
preconditions = [
    "port-listening:9741",
    "slot-decodes:primary",
    "corpus-installed:chaos-secret-agent",
]
bank = "sovereign/bench/chaos_monkey/secret_agent.toml"

# The one lane of the six that ALREADY selected by id (`--fixture <slug>`,
# repeatable), so it gets no new flag — `{ids:…}` expands the declared slugs
# into that existing door.
[[lane]]
id = "knowledge-gym"
kind = "judged"
enforcement = "hard"
est_secs = 60
command = [
    "svrn", "quality", "lane", "bench", "--id", "knowledge-gym", "--reader", "knowledge-gym", "--",
    "svrn", "knowledge-gym", "run", "--json",
    "--fixture", "{ids:knowledge-gym-v1}",
]
preconditions = ["port-listening:9741", "slot-decodes:primary"]

[[lane]]
id = "synth"
kind = "judged"
enforcement = "hard"
est_secs = 430
command = [
    "svrn", "quality", "lane", "bench", "--id", "synth", "--reader", "bench-all", "--",
    "svrn", "bench", "all",
    "--bench-root", "sovereign/bench",
    "--synth",
    "--filter", "sep/questions",
    "--smoke-subset", "synth-v2",
    "--report", "{report}",
]
preconditions = [
    "port-listening:9741",
    "slot-decodes:primary",
    "corpus-installed:sep",
]
bank = "sovereign/bench/sep/questions.toml"
