# The top-level-programs move (2026-10-02): every directory and file it moved,
# old path -> new path, in the order the commits moved them. Data, not program:
# the one table a path-keyed instrument consults when it meets both spellings —
# git history before the move, or a code-intel index older than the tree.
#
# Read it only through scripts/lib/top_level_moves.py (one reader, ARCH §8):
#   back(path)     the pre-move spelling. nc-boundary and nc-congestion classify
#                  by the families they were calibrated on (sovereign/,
#                  corpus-engine, commonwealth/, studio/).
#   forward(path)  the current spelling. domains-census congestion tags history
#                  against a registry that describes the current tree.
#
# Rows are whole path segments; the longest matching prefix wins. No row's `to`
# is moved again by a later row, so either direction is one hop.

