[[mutant]]
id = "dst-fe19-convergence"
requirement = "FE-19"
target = "sovereign/crates/sovereign-mesh/src/dst.rs"
find = "fn check(&self, snap: &MeshSnapshot) -> Result<(), Violation> {\n        let mut iter = snap.views.iter();\n        let Some(first) = iter.next() else {\n            return Ok(());\n        };\n        let key0: BTreeSet<NodeId> = first.members.keys().copied().collect();\n        for v in iter {\n            let key: BTreeSet<NodeId> = v.members.keys().copied().collect();\n            if key != key0 {\n                return Err(Violation {\n                    invariant: \"convergence\",\n                    detail: format!(\n                        \"node {} knows {:?}; node {} knows {:?}\",\n                        first.self_id, key0, v.self_id, key\n                    ),\n                });\n            }\n        }\n        Ok(())\n    }"
replace = "fn check(&self, snap: &MeshSnapshot) -> Result<(), Violation> {\n        let _ = snap;\n        Ok(())\n    }"
mustFail = ["convergence_falsifier_two_nodes_know_different_member_sets"]
breaks = "Shared state MUST converge by epidemic replication: a periodic round to a small random peer sample, three-phase digest/delta/response, last-writer-wins on timestamp."
expected = "CAUGHT"

[[mutant]]
id = "dst-fe96-admission-safety"
requirement = "FE-96"
target = "sovereign/crates/sovereign-mesh/src/dst.rs"
find = "fn check(&self, snap: &MeshSnapshot) -> Result<(), Violation> {\n        for v in &snap.views {\n            if v.peer_inflight > v.inflight_ceiling {\n                return Err(Violation {\n                    invariant: \"admission_safety\",\n                    detail: format!(\n                        \"node {}: peer_inflight {} > ceiling {}\",\n                        v.self_id, v.peer_inflight, v.inflight_ceiling\n                    ),\n                });\n            }\n            if v.peer_inflight != 0 {\n                return Err(Violation {\n                    invariant: \"admission_safety\",\n                    detail: format!(\n                        \"node {}: peer_inflight {} != 0 at quiescence (guard leak?)\",\n                        v.self_id, v.peer_inflight\n                    ),\n                });\n            }\n        }\n        Ok(())\n    }"
replace = "fn check(&self, snap: &MeshSnapshot) -> Result<(), Violation> {\n        let _ = snap;\n        Ok(())\n    }"
mustFail = ["admission_safety_falsifier_inflight_over_the_ceiling", "admission_safety_falsifier_a_leaked_guard_at_quiescence"]
breaks = "Peer requests MUST pass an admission gate; local requests MUST admit unconditionally. Refusal MUST be a standard busy response with a retry hint."
expected = "CAUGHT"

[[mutant]]
