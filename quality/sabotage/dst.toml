# DST invariant pack — hand-authored, NOT model-generated.
#
# The six invariants in sovereign-mesh/src/dst.rs each already carry a
# falsifier test (`every_invariant_in_the_pack_has_a_falsifier` enforces that).
# These mutants ask the next question: is the falsifier LOAD-BEARING? Each one
# stubs an invariant's `check` to return Ok(()) — the invariant stops detecting
# its own violation — and names the falsifier that must then go red.
#
# WHY THESE TESTS WERE INVISIBLE UNTIL NOW. `dst` is a non-default feature.
# sabotage.py hardcoded `corpus-engine/treesitter,sovereign-cli/dev-tools`
# while scripts/lib/cargo-scope.sh (what the actual gate resolves) also carries
# `sovereign-mesh/dst` and `sovereign-mesh/mesh-sim`. Every test in this file
# was absent from the adjudicator's report and would have resolved
# COULD-NOT-JUDGE as "not a test in this workspace". Fixed 2026-09-01 by
# deriving FEATURES from that one helper (ARCH §10.6).
#
# MAPPINGS REJECTED, and why — the inherited frame proposed twelve FE clauses
# for these invariants and five were word-collisions, not spirit matches:
#   FE-60  "replay MUST split scorer agreement from policy agreement" — the
#          word "split", not split-brain. Different subsystem entirely.
#   FE-72  "the split the preview shows and the split the load executes MUST
#          be one function" — same word-collision.
#   FE-135 anchor advertisement + candidate filtering for eligibility; the
#          invariant checks leader agreement, not who is eligible to lead.
#   FE-86  bench validity guards ("earned by an observed false result").
#   FE-23  signed per-node reachability with a monotonic version; admission
#          safety here is an in-flight ceiling, not signature verification.
# Kept as partial and marked so: FE-138 (the invariant defends "no split brain
# once converged", not the eligibility-settle/quorum BOUND the clause names),
# FE-96 (the ceiling-and-leak half, not "local admits unconditionally" or the
# busy-response shape), FE-80 (liveness as a membership property, not the
# "do not probe a saturated link" half).
#
# no_ghost_members has NO FE clause. It is a real invariant defending nothing
# the requirements register asks for — a spec gap, not a mutant.


[[mutant]]
id = "dst-fe137-no-split-brain"
requirement = "FE-137"
target = "sovereign/crates/sovereign-mesh/src/dst.rs"
find = "fn check(&self, snap: &MeshSnapshot) -> Result<(), Violation> {\n        let mut leader: Option<Option<NodeId>> = None;\n        let mut owner: Option<Option<NodeId>> = None;\n        for v in &snap.views {\n            let live: Vec<NodeId> = v\n                .members\n                .iter()\n                .filter(|(_, m)| m.live)\n                .map(|(k, _)| *k)\n                .collect();\n            let l = partition::elect_leader(&live);\n            let o = partition::rendezvous_owner(\"dst-probe\", &live);\n            match leader {\n                None => leader = Some(l),\n                Some(prev) if prev != l => {\n                    return Err(Violation {\n                        invariant: \"no_split_brain\",\n                        detail: format!(\n                            \"leader disagreement: {prev:?} vs {l:?} (node {})\",\n                            v.self_id\n                        ),\n                    });\n                }\n                _ => {}\n            }\n            match owner {\n                None => owner = Some(o),\n                Some(prev) if prev != o => {\n                    return Err(Violation {\n                        invariant: \"no_split_brain\",\n                        detail: format!(\n                            \"owner disagreement: {prev:?} vs {o:?} (node {})\",\n                            v.self_id\n                        ),\n                    });\n                }\n                _ => {}\n            }\n        }\n        Ok(())\n    }"
replace = "fn check(&self, snap: &MeshSnapshot) -> Result<(), Violation> {\n        let _ = snap;\n        Ok(())\n    }"
mustFail = ["no_split_brain_falsifier_disjoint_live_sets_elect_different_leaders"]
breaks = "Host election MUST be re-evaluated each cycle over replicated membership, with a pinned host winning while eligible, and the elected host MUST be published so a soak test can assert a no-split-brain invariant."
expected = "CAUGHT"

