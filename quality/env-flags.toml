[[flag]]
name = "SOVEREIGN_NEXT_EDIT_FALLBACK"
cluster = "inference"
default = "off"
status = "experiment"
purpose = "=1/true serves the next-edit lane (POST /v1/edit_predictions) off the already-resident FAST slot when NO [models.edit] is configured, instead of serving nothing (install_fallback_next_edit_slot). Next-edit needs only a prompt dialect, not FIM marker tokens, so an ordinary chat model can serve it. MEASURED AND IT DID NOT HOLD (2026-08-07): the flag resolves through fast_path(), so on a box with an explicit [models].fast the answering model is the fast slot — a 4B there scored 14/30 useful (GM4 FAIL) at p95 2194ms, against 21/30 for the 35B-A3B chat primary and 19/30 / 828ms for a 1.5B specialist, same 60-case gym/next-edit/gen bank. Safe but not useful: 0 wrong edits in 17 fires. A bench number does not transfer down a model class. Marks the slot degraded=true, which drives the advice nudge on /status.inference.edit. An explicit [models.edit] always wins. STAYS OFF — opt-in only; users are pointed at `svrn setup --fim`. Ledger row: sovereign/DEFAULTS_LEDGER.md."

[[flag]]
name = "SOVEREIGN_JOURNAL"
cluster = "inference"
default = "on"
status = "guard"
purpose = "=off/0/false stops EVERY local journal stream in this process. A journal is one feature's append-only metadata-only record of how it behaved on the developer's real work, under ~/.svrnmesh/journal/<stream>-<date>.jsonl (today: next-edit; the layer is feature-agnostic — sovereign-contracts/src/types/journal.rs). This is the CI/harness switch; the developer-facing opt-out is `svrn journal off`, which drops a DISABLED marker needing no daemon restart. Global env, global marker, per-stream env and per-stream marker are all read by ONE decider, JournalStream::enabled. Local write is default-ON and sending is NEVER: no network path exists in the module, and `svrn journal bundle` writes a file plus a manifest of every field in it. Ledger row: sovereign/DEFAULTS_LEDGER.md."

[[flag]]
name = "SOVEREIGN_NEXT_EDIT_JOURNAL"
cluster = "inference"
default = "on"
status = "guard"
purpose = "=off/0/false stops the NEXT-EDIT journal stream only, leaving other streams recording (one record per POST /v1/edit_predictions, plus the editor's outcome report). Per-stream twin of SOVEREIGN_JOURNAL; the marker-file equivalent is `svrn journal next-edit off`. Every stream declares its own such var via JournalStream::disable_env."

[[flag]]
name = "SOVEREIGN_GROUNDING_JOURNAL"
cluster = "inference"
default = "on"
status = "guard"
purpose = "=off/0/false stops the GROUNDING journal stream only, leaving other streams recording (one decision line per gated answer: verdict, score, tau, action, and (corpus, chunk-id) evidence handles — never claim/answer/chunk text; VERIFIER_V0.md §6.1 phase 0). Per-stream twin of SOVEREIGN_JOURNAL; the marker-file equivalent is `svrn journal grounding off`. Every stream declares its own such var via JournalStream::disable_env."

