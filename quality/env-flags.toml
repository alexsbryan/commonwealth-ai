# env-flags.toml — the DECLARED registry of the env-knob plane.
#
# One [[flag]] per env var. This is declaration, not plumbing: the
# `std::env::var` read sites stay where they are; `cargo run -p xtask --
# env-gate` censuses the workspace (Rust literals, the `svrnmesh_env`
# wrapper, `${SOVEREIGN_*}` in scripts/ + .claude/hooks/) and fails on any
# NEW name missing from this file. Pre-registry debt rides the shrink-only
# baseline `quality/baselines/env_unregistered.txt`.
#
# Names use the canonical `SOVEREIGN_` prefix; every var is mirrored to
# `SVRNMESH_*` by sovereign-contracts/src/rebrand.rs, so the census
# canonicalizes both spellings to one name.
#
# Fields:
#   name     canonical env-var name (required)
#   cluster  subsystem grouping for the generated doc (required)
#   default  human-readable default — "on", "off", a number (required)
#   purpose  one line a stranger can act on (required)
#   status   guard | shipped | experiment | deprecated (required)
#            guard = safety/kill-switch; shipped = default-on product
#            behavior; experiment = A/B lever; deprecated = scheduled removal
#   alias_of optional — this name duplicates another registered knob
#   shadows  optional — the SetupConfig field this env var duplicates
#            (declared debt: precedence chains to be unified later)
#
# Two in-code tables remain the runtime-facing SSOT for their subsystems and
# are pin-tested to appear here: `retrieval_pipeline_flags()`
# (sovereign-core/src/runtime/retrieval_pipeline.rs) and
# `grounding_gate_flags()` (sovereign-core/src/runtime/grounding/config.rs).
#
# The generated human view is docs/ENV_FLAGS.md
# (cargo run -p xtask -- env-gate --update-doc).

schema_version = 1

# Env names the census may observe that are owned by third-party software
# (none yet — standard vars like HOME/PATH are outside the censused prefix).
third_party_allowlist = []

# ── grounding ───────────────────────────────────────────────────────

[[flag]]
name = "SOVEREIGN_NATIVE_GROUNDING"
cluster = "grounding"
default = "on"
status = "shipped"
purpose = "The native grounding path — DEFAULT ON since 2026-08-11 (operator directive 7aa64f29); this knob is now the OPT-OUT. Off-form: SOVEREIGN_NATIVE_GROUNDING=0 (also false/off, trimmed + case-insensitive); every other value, including unset and unrecognised, leaves it ON. What is on is DISPLAY, per the P1 composition (sovereign/docs/specs/NATIVE_GROUNDING_PARITY_PLAN.md §4.1): typed answer segments (metadata.answer_segments) plus H1's calibrated answerability recorded as telemetry (every admission event carries enforced=false). It decides NOTHING and the promotion did not change that: the early-decline instrument at handlers/knowledge_query.rs is the incumbent cosine floor on both arms, and there is no native decline branch to take — the arm was deleted, not guarded, so this knob cannot change a turn's route or gate action. Admission-as-gate was measured and rejected separately (−0.48 turn competence, sovereign/bench/calibration/ab/FINDINGS.md); that rejection stands and is about gating, not display. Opted out = every path byte-identical, no segments, no verdict; read in exactly one place (native_grounding::admission::native_grounding_enabled). Promotion evidence + reversal condition: sovereign/DEFAULTS_LEDGER.md."

[[flag]]
name = "SOVEREIGN_GROUNDING_GATE"
cluster = "grounding"
default = "on"
status = "shipped"
purpose = "Global on/off for the hold→verify→retry→abstain gate on answer-producing surfaces (the Grounded-Everywhere contract). =0/false disables (naked benches, latency debugging)."

[[flag]]
name = "SOVEREIGN_GROUNDING_GATE_<SURFACE>"
cluster = "grounding"
default = "unset"
status = "shipped"
purpose = "Per-surface override (=1 force on, =0 force off); SURFACE ∈ {KNOWLEDGE_QUERY, DEEP_QUERY, ATTACHED_DOC, COMPLEX_TASK, SIMPLE_QUERY, REFINEMENT, GOVERNANCE, PROXY_ARGUMENT}. Read dynamically (never appears in the census)."

[[flag]]
name = "SOVEREIGN_GV_THRESHOLD"
cluster = "grounding"
default = "0.9"
status = "shipped"
purpose = "Violation-probability threshold τ for the external grounding verifier — ONE default for the production gate and the chaos bench (grounding_gate_threshold(); bench override: --gv-threshold)."

[[flag]]
name = "SOVEREIGN_CORPUS_MAINTENANCE_INTERVAL_MINS"
cluster = "corpus"
default = "60"
status = "shipped"
purpose = "Minutes between self-healing corpus maintenance sweeps in the daemon (crate::corpus_maintenance). Each cycle asks every corpus how many rows sit OUTSIDE its indexes — a metadata read — and compacts/folds only those past the floor. Exists because lancedb serves a query by running the index over indexed data AND flat-scanning everything appended since, which is silent, correct and progressively slower: wikipedia reached 3,955 manifest versions and 2218ms per search while the static sep stayed at 100ms. 0 disables the sweep, which lets appended corpora decay again."

[[flag]]
name = "SOVEREIGN_CORPUS_MAINTENANCE_UNINDEXED_FLOOR"
cluster = "corpus"
default = "5000"
status = "shipped"
purpose = "Rows-outside-the-index a corpus must exceed before the daemon's maintenance sweep rewrites it. Not zero: folding an index costs seconds-to-minutes on a large corpus and a few hundred straggler rows are genuinely cheap to flat-scan; the cost only becomes visible in the thousands."

[[flag]]
name = "SOVEREIGN_CORPUS_MAINTENANCE_PRUNE_DAYS"
cluster = "corpus"
default = "7"
status = "shipped"
purpose = "Age below which superseded dataset versions are KEPT by the maintenance sweep. Compaction is non-destructive — superseded fragments stay readable under old manifests — so without pruning the directory grows without bound, which on a desktop install is its own product failure. Seven days is far outside any in-flight reader while still bounding growth. 0 disables pruning and retains every version."

[[flag]]
name = "SOVEREIGN_GATE_CLAIM_SEARCH_LADDER"
cluster = "grounding"
default = "off"
status = "experiment"
purpose = "Two-stage claim audit: judge each claim against the prompt window FIRST and issue the per-claim corpus fan-out only for claims that fail without it. Targets the fan-out measured at 25% of wall-clock on `bench sep/summarize --synth` (one hybrid search per allowed corpus per claim; 2218ms per wikipedia call). Lossless for rescues BY CONSTRUCTION — a rescue is by definition a claim that fails without re-search and passes with it, so every rescue has stage-1 vp >= tau and always reaches stage 2; measured 7/7 rescues kept while searching 11 of 18 claims on `summary_cosmological_argument` (2026-08-05). Named behaviour change: a re-searched hit can currently dilute a claim the prompt window alone supported (the longform judge scores all passages in ONE joint forced-choice — no per-chunk max, no rescue floor), and the ladder releases such claims on stage 1 instead; measured newly_failed=0 on the specimen. Default OFF pending the multi-question confirmation and a net wall-clock number."

[[flag]]
name = "SOVEREIGN_GATE_CLAIM_SEARCH_SHADOW"
cluster = "grounding"
default = "off"
status = "experiment"
purpose = "Shadow-measure the per-claim corpus re-search without changing any answer (same pattern as SOVEREIGN_GATE_BATCH_SHADOW). Emits `claim_search_shadow` per claim: the production verdict WITH re-searched hits, plus the counterfactual vp on the prompt chunks alone, plus best-extra vs best-chunk support. Both come from the same judge pass — the only added inference is scoring past the 0.95 early break, which shadow mode relaxes for data while still returning the value production would have stopped at. Purpose: get the (vp_production, vp_chunks_only) pairs that say WHICH claims the fan-out actually rescues, so it can fire selectively instead of on every claim."

[[flag]]
name = "SOVEREIGN_GATE_AUDIT_FORENSICS"
cluster = "grounding"
default = "unset"
status = "experiment"
purpose = "Diagnostic JSONL dump of the per-claim audit's own decisions, written to the named path. One `audit` record per pass carries the evidence window (leaf + summary chunks, labels, the extracted claim list, tau, budget); one `claim` record per decision names the MECHANISM that made it (per_claim_judge / batched / deterministic_veto / specifics_scan / identifier_sweep / exempt_self_referential), its violation probability, and any claim-conditioned passages that widened the window; one `audit_result` record closes the pass with audited/failed/ratio/zero_failure. Exists because the audit's failure verdicts were never inspectable — `dbg()` printed the claim and its vp but never the evidence it was judged against, so 'is this failure real?' could not be answered from outside the process (ARCH §18.4, validate the instrument before the result). Default unset: the records carry verbatim corpus text and the model's draft."

[[flag]]
name = "SOVEREIGN_GATE_CLAIM_SEARCH"
cluster = "grounding"
default = "on"
status = "guard"
purpose = "Per-claim corpus re-search that widens the audit's evidence beyond the prompt chunks (ClaimSearcher::search_corpus). Set =0 to audit against the prompt chunks alone — the documented no-searcher fallback, not a new behaviour. Exists to price the fan-out against its value: it runs one hybrid search per ALLOWED CORPUS per CLAIM and keeps only CLAIM_SEARCH_K=4 chunks in total. Measured 2026-08-05 on `bench sep/summarize --synth` at HEAD d3c5261d: 753 searches inside the gate window costing 608.9s over 14 questions, of which wikipedia alone was 247 calls at 2218ms = 547.9s — 25% of total run wall-clock, against a 33.8s median draft phase."

[[flag]]
name = "SOVEREIGN_GATE_EXCLUDE_RAPTOR"
cluster = "grounding"
default = "on"
status = "guard"
purpose = "Exclude RAPTOR summary chunks from the gate's evidence view (a summary is not verbatim source). =0 includes them."

[[flag]]
name = "SOVEREIGN_CITATION_GROUNDING"
cluster = "grounding"
default = "on"
status = "shipped"
purpose = "Quote-first citation grounding on entity-anchored fact queries: the model copies a verbatim supporting sentence before answering (7x confab reduction, 2026-06-24). =0 to A/B off."

[[flag]]
name = "SOVEREIGN_CITATION_BROAD"
cluster = "grounding"
default = "on"
status = "shipped"
purpose = "Run quote-first citation grounding on ALL gated factual answers, not just entity-anchored ones (entity_anchored alone tripped 0 times on the chaos stream). =0 to A/B off."

[[flag]]
name = "SOVEREIGN_CITATION_MULTIQUOTE"
cluster = "grounding"
default = "on"
status = "shipped"
purpose = "Multi-quote citation contract: ground a COMPOUND question one verified quote per sub-question and NAME the parts the passages do not answer. The single-sentence contract grounds 0/14 compound probes (measured 2x n=7, 2026-08-04) because no one sentence answers a two-part question. Flipped ON 2026-08-05 on a matched control (saltgrass_compound n=7, same HEAD/day/topology, 0 extraction failures both arms): citation releases 0->3, competence-when-present 0.14->0.43, gate-attributed misses 4->2, blatant-confab-rate 0.00 unchanged. =0 for the control arm."

[[flag]]
name = "SOVEREIGN_CITATION_LOCATOR"
cluster = "grounding"
default = "on"
status = "shipped"
purpose = "Name the SECTION a released quote came from (\"CHAPTER VII — \\\"…\\\"\"), resolved through the corpus's chunk→section join. Purely additive: a locator appears only where the WHOLE quote is one contiguous span of one chunk AND the join can attribute that chunk, so a corpus without section structure, without a populated join, or a quote that matched only as a partial run releases exactly the text it always did. Display-only and outside the quote marks, so it can never make a claim pass a check. =0 is the CONTROL arm for the situated lane's `cites_a_source` criterion, which was 0/7 in both arms of arm C because the answer path had nothing per-passage to name (2026-08-05)."

[[flag]]
name = "SOVEREIGN_SPECIFICS_SCAN"
cluster = "grounding"
default = "on"
status = "shipped"
purpose = "Long-form holistic specifics scan inside gate_longform: one judge pass over the whole answer vs full evidence, catching fabricated specifics the per-claim audit misses. =0 disables."

[[flag]]
name = "SOVEREIGN_SHORT_SPECIFICS_SCAN"
cluster = "grounding"
default = "off"
status = "experiment"
purpose = "SHELVED short-path second-opinion specifics scan on released single-claim answers; dormant pending clean-evidence validation (target category proved ~90% measurement artifact)."

[[flag]]
name = "SOVEREIGN_SURGICAL_MAX_FAILED_RATIO"
cluster = "grounding"
default = "0.5"
status = "guard"
purpose = "The share of a longform draft's AUDITED claims that may fail and still be repaired by targeted surgery instead of a full 35B re-synthesis. 0.5 is derived, not tuned: the rule is 'surgery unless MOST claims fail', and a majority is more than half. Replaces SOVEREIGN_SURGICAL_MAX_FAILURES (absolute count, default 3) on 2026-08-13 — claim_budget scales the audited count with answer length, so an absolute cap inverted with length and structurally excluded longform (measured 51.2s fallback on a real desktop turn vs 1.7-2.7s when surgery engaged; NATIVE_GROUNDING_ECONOMY.md 7.3.1). Read in exactly one place (grounding/mod.rs surgical_max_failed_ratio); 0.0 forces full re-synthesis, 1.0 forces surgery, and those are the two positions the surgical calibration harness uses. Unparseable or out-of-range values warn and fall back to 0.5. Measured yield of the change over 8 warm desktop turns: 0 ms — it makes the code agree with its rationale, it did not make the query faster (ECONOMY 7.3.2)."

