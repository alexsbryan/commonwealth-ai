disposition = "converge (the gate's claim vocabulary); the atlas Claim ATOM is a distinct, correctly-named concept and stays"
totality   = "One assertion extracted from a Draft — the unit the gate judges. It names no evidence: an assertion plus, at most, where in the draft it came from. That is what lets it sit at layer 0 beside Draft and Judgement."
gloss      = '''one assertion extracted from a `Draft`; the unit the gate judges.'''
status     = "target"
home       = "planned"
in_program = true
phase      = 4
verified_at = "differential"
measure    = "D1 count for name Claim + private claim records outside the kernel (today: GateClaim)"
today      = "2026-08-24: the noun DOES NOT EXIST and this row said it held. `sovereign_core::runtime::grounding::Claim` has never been defined; the gate carries `pub(crate) struct GateClaim` (grounding/mod.rs:828), which is not this noun — it is a claim ALREADY JOINED to its judgement (text + supported + violation_prob + address). The 2026-08-17 snapshot cited a converging mirror pair in enrich_cmd (spec_intel.rs / spec_reconcile.rs); both files are gone, so that adjudication no longer describes anything. One `pub struct Claim` remains workspace-wide — the atlas atom (atoms.rs:557), a knowledge act in a corpus, distinct and correctly named. Home is the kernel because the decomposition is already kernel vocabulary: the assertion is text, `supported` is a Verdict, the address is a Locator. GateClaim then becomes Claim + Judgement + Option<Locator> rather than a fourth private record."

