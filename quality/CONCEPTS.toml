today      = "2026-08-24: the concept holds; the row named a type that does not exist. There is no `pub struct Peer` anywhere in the workspace — the mesh member type is `MemberRecord` (commonwealth-core/mesh.rs:35) and it carries the whole totality: node_id, name, invited_by, joined_at, last_seen, status, capabilities, addresses, node_pubkey (the Ed25519 identity), iroh relay. No split was needed: the IDENTITY half is already the kernel's NodeId, which MemberRecord holds by value rather than re-deriving. Renaming the type to Peer is a separate decision with its own blast radius; this row records where the noun lives, not what it should be called."

