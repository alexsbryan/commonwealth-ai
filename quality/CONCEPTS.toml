[[concept]]
name        = "Origin"
canonical   = "kernel_types::origin::Origin"
disposition = "converge"
totality    = """
Every field non-optional, and the SOURCE IS A CLOSED SUM — Corpus{corpus,
document, locator} | Web{url, fetched_at} | Attachment{asset, locator} |
ToolOutput{tool, call_hash} — plus served_by: Local | Peer(node, name),
and grain: Leaf | Summary. Without the sum, 'retrieve is the only door' is
false on day one: web search, attached documents and tool output already
reach the model. Without the grain, what a chunk may GROUND stays a string
compare. NodeId's home must be Tier 0/1 — contracts cannot import the mesh
crate."""
gloss      = '''where a piece of knowledge came from.'''
shape      = '''
pub struct Origin {
    pub source:    Source,    // the CLOSED sum — see below
    pub served_by: Server,    // Local | Peer(NodeId, PeerName)
    pub grain:     Grain,     // Leaf | Summary — what this may ground
}

pub enum Source {
    Corpus     { corpus: CorpusId, document: DocumentId, locator: Locator },
    Web        { url: Url, fetched_at: Timestamp },
    Attachment { asset: AssetId, locator: Locator },
    ToolOutput { tool: ToolId, call_hash: ContentHash },
}
'''
