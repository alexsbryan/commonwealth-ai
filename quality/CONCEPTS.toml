[[concept]]
name        = "Measurement"
canonical   = "sovereign_eval::measurement::Measurement"
disposition = "converge"
totality    = """
The comparability fingerprint IS the key — lane, corpus, model attribution,
prompt version, sample cap, scorer version, every field required. Two
measurements with different fingerprints are not comparable and the gate
does not attempt it: it reports NoBaseline(fingerprint) — a distinct,
posture-visible verdict, NEVER a silent pass. A fingerprint change disarms
every gate at once; the re-arm is an explicit baseline re-mint (RUNBOOK §6),
not a green tick nobody earned. (v1 said 'first run, pass' — that shape lets
any refactor of the bench green-light itself, which contradicts the
four-verdict rule this row exists to serve.)"""
gloss      = '''one comparable observation.'''
shape      = '''
pub struct Measurement {
    pub fingerprint: Fingerprint,   // THE KEY, not metadata
    pub metrics:     BTreeMap<MetricName, f64>,
    pub artifact:    ArtifactRef,
}

pub struct Fingerprint {            // every field required
    pub lane:           LaneId,
    pub corpus:         CorpusId,
    pub model:          ModelAttribution,
    pub prompt_version: PromptVersion,
    pub sample_cap:     SampleCap,     // absent entirely from today's baseline
    pub scorer_version: ScorerVersion,
}
'''
status      = "target"
home        = "planned"
in_program  = true
phase       = 1
verified_at = "differential"
measure     = "fields of the live baseline key that are Option or absent (today: read LaneBaseline; after: compile-time — every Fingerprint field required)"
today       = "2026-08-16: LaneBaseline (bench_cmd/lane_baseline.rs:96) carries corpus, model, model_attribution, prompt_version, artifact_mtime — all Option — and the sample cap is not a field at all, despite being the condition the operating manual warns about hardest."

