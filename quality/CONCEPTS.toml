# The concept register — one canonical owner per noun.
#
# THIS FILE IS THE SOURCE OF TRUTH for the noun-convergence program.
# `NOUN_CONVERGENCE.md` (the program) and `TARGET_ARCHITECTURE.md` (the
# destination) reference these rows; they do not restate them. When the
# generator lands (phase 5), both documents render from this file.
#
# Read by:
#   cargo xtask concept-gate      — the ratchet (a registered concept name
#                                   may not be defined outside its owner)
#   svrn converge status          — the metric
#
# THE METRIC: concepts defined as a type in more than one crate.
#   baseline 278, measured 2026-08-16 against the live SCIP graph
#   (227,327 symbols / 1,265,301 refs). Only allowed down.
#
# Fields
#   name        REQUIRED. the concept, as it appears in the census.
#   canonical   REQUIRED. the one owning path. `crate::module::Type`.
#   totality    REQUIRED. what must ALWAYS be true of it — the thing that
#               makes an illegal state unrepresentable. This is the design
#               decision; everything else is bookkeeping.
#   status      holds | partial | target
#   in_program  true if the program does work on it. false = architectural
#               completeness only (already coherent, listed so the noun set
#               reads as a whole).
#   phase       which phase lands it. omit when in_program = false.
#   verified_at freeze | differential | journey  (see NOUN_CONVERGENCE §5)
#   duplicates  measured count of type definitions today, across crates.
#   today       one line on the current shape, with a citation. Evidence
#               lives HERE, not in three prose documents.

schema_version = 1
baseline = 278
measured_at = "2026-08-16"
graph = "~/.svrnmesh/indexes/commonwealth-ai/scip_graph.db"

# ─────────────────────────────────────────────────────────────────────
# PHASE 1 — the instrument. Nothing downstream is trustworthy until this
# lands: a program that cannot tell whether it broke something is not a
# program. (ARCH_PRINCIPLES §18.4)
# ─────────────────────────────────────────────────────────────────────

[[concept]]
name        = "Measurement"
canonical   = "sovereign_eval::measurement::Measurement"
totality    = """
The comparability fingerprint IS the key — lane, corpus, model attribution,
prompt version, sample cap, scorer version, every field required. Two
measurements with different fingerprints are not comparable and the gate
does not attempt it: it reports no-baseline-for-this-fingerprint, first run,
pass."""
status      = "target"
in_program  = true
phase       = 1
verified_at = "differential"
duplicates  = 1
today       = "LaneBaseline (bench_cmd/lane_baseline.rs:96) carries corpus, model, model_attribution, prompt_version, artifact_mtime — all Option — and the sample cap is not a field at all, despite being the condition the operating manual warns about hardest."

[[concept]]
name        = "Baseline"
canonical   = "sovereign_eval::measurement::Baseline"
totality    = "Stored under its fingerprint. A changed condition changes the key, so a stale baseline cannot silently false-fire."
status      = "partial"
in_program  = true
phase       = 1
verified_at = "differential"
duplicates  = 1
today       = "Keyed by lane id; comparability is operator memory. `model_mismatch: Option<(String,String)>` detects exactly one comparability violation, after the fact, as a diff field."

# ─────────────────────────────────────────────────────────────────────
# PHASE 2 — one verifier. Five uncalibrated judges is a product risk, not
# untidiness. Also the held-out replay experiment (NOUN_CONVERGENCE §6.3).
# ─────────────────────────────────────────────────────────────────────

[[concept]]
name        = "Verdict"
canonical   = "sovereign_contracts::verdict::Verdict"
totality    = """
Four states, one definition, workspace-wide: Passed | Failed(Reason) |
CouldNotJudge(Reason) | NeverRan(Reason). ARCH_PRINCIPLES §18.2 becomes a
type instead of a rule people remember. NeverRan is distinct from
CouldNotJudge — a gate that did not execute is not a gate that abstained."""
status      = "target"
in_program  = true
phase       = 2
verified_at = "differential"
duplicates  = 10
today       = "Ten types named Verdict across corpus-engine, corpus-engine-archaeology, sovereign-authoring-harness and others; 253 variant references spanning 6 crates."

[[concept]]
name        = "Judgement"
canonical   = "sovereign_eval::rubric::Judgement"
totality    = """
One implementation of 'does this text follow from this evidence?', with one
calibration gate (sensitivity/specificity floors at 0.85). Carries the
register fingerprint — which judge, which build, which prompt. Lanes bind as
tenants; none owns a private copy (ARCH_PRINCIPLES §10.6)."""
status      = "target"
in_program  = true
phase       = 2
verified_at = "differential"
duplicates  = 5
today       = "Five implementations, ~5,900 lines: runtime/grounding/judge.rs (2,716), bench_cmd/rubric/ (1,948), sovereign-eval/judge.rs (504), sovereign-eval/faithfulness.rs (392), pipeline/judge.rs (360). The rubric core has the right design and two tenants. NOT mechanically mergeable — the runtime judge is per-claim and streaming-aware, the rubric judge per-criterion and batch."

