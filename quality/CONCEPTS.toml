# The concept register — one canonical owner per noun.
#
# THIS FILE IS THE SOURCE OF TRUTH for the noun-convergence program.
# `NOUN_CONVERGENCE.md` (the program) and `TARGET_ARCHITECTURE.md` (the
# destination) reference these rows; they do not restate them. When the
# generator lands (phase 5), both documents render from this file.
#
# Read by:
#   cargo xtask concept-gate      — the ratchet (a registered concept name
#                                   may not be defined outside its owner, in
#                                   PRODUCTION code — #[cfg(test)] items,
#                                   tests/, examples/, benches/ are out of
#                                   scope by construction, or a test helper
#                                   named `Evidence` breaks the build)
#   svrn code converge status     — the metric, re-run live per row
#
# THE METRIC — two levels, and numbers are MINTED, not typed (2026-08-17):
#   headline   the register burn-down: rows converged / rows in_program.
#              Every order's landing verdict re-runs its row's `measure`
#              method at land time and reports before/after.
#   feed       the D1 census (`svrn code converge census`): names defined as a
#              type in more than one FIRST-PARTY PRODUCTION crate, idiom
#              patterns excluded. It DISCOVERS candidates and ranks them;
#              every hit gets a `disposition`. Its raw count is not the
#              score: adjudication (2026-08-17, n=55 random sample plus a
#              full read of every >=3-crate cluster) found roughly half
#              the two-crate tail is name coincidence, not duplication.
#   The frozen baseline is minted by order nc-t0b, with its filters declared
#   inside the artifact it produces — never a constant in this file. The 278
#   of 2026-08-16 was the discovery snapshot that started the program; one
#   day later the same query read 292 raw / 272 first-party-production. That
#   drift is a design input, not an embarrassment: prose carries methods and
#   dates, tools carry numbers.
#   2026-08-20 (nc-0-reach, the instrument-validation rung): 272 -> 279. Not
#   drift and not new duplication — a defect in the census's OWN scope filter.
#   `SourceScope`'s exclusions were SUBSTRING matches, so `"research/"`,
#   written for the top-level spike tree, also hid
#   `sovereign-core/src/deep_research/` — the module this program cites as the
#   reason it exists. Repaired as whole-SEGMENT matching (six of the ten
#   patterns had the same shape; `research` was the only one whose behaviour
#   changed on today's tree). 86 type definitions in 12 files entered scope and
#   seven names became visibly duplicated: BudgetEntry, ClaimVerdict, Draft,
#   Event, MockBackendImpl, TriageConfig, TriageOutcome.
#
# Fields
#   name        REQUIRED. the concept, as it appears in the census.
#   canonical   REQUIRED. the one owning path, `crate::module::Type`. For a
#               `target` row this is where it WILL live. The tier rule
#               (TARGET_ARCHITECTURE §6) decides the home: the lowest tier
#               that needs the noun owns it — which is why Judgement moved
#               to sovereign-contracts in v2 (Answer, Tier 1, embeds it; a
#               Tier-3 canonical would force an upward dependency).
#   disposition REQUIRED for census-surfaced rows. What the program does
#               with the name's twins:
#                 converge        one canonical; the others migrate (six steps)
#                 distinct        same name, different concepts — rename apart;
#                                 the tape records why; the census allowlists
#                                 the renamed result
#                 idiom           per-crate convention (error/Result aliases,
#                                 clap Args, per-binary AppState) — excluded
#                                 by PATTERN in the census, never per-row
#                 external-mirror deliberate mirror of a foreign schema — ONE
#                                 mirror module re-exported everywhere, never
#                                 N private partial copies
#                 layered         same noun at two altitudes on purpose (an
#                                 in-process wrapper vs a wire struct) — keep
#                                 both, add the missing From + a golden
#                                 equivalence test (ARCH §10.6)
#               Rows may compose ("converge the gate family, distinct the
#               rest") — `today` says which twins take which path. A metric
#               decrement MUST name its disposition in the landing verdict;
#               a rename that poses as a convergence is the gamed metric
#               this field exists to prevent.
#   totality    REQUIRED. what must ALWAYS be true of it — the thing that
#               makes an illegal state unrepresentable. This is the design
#               decision; everything else is bookkeeping.
#   gloss       REQUIRED. one line: what the noun IS, for a reader who has
#               never seen it. Moved here 2026-08-20 (nc-15-generate) from
#               TARGET_ARCHITECTURE.md §2, where 27 of them were hand-typed
#               beside a status marker this file already owned — and where one
#               noun (`Question`) was described for a register row that does
#               not exist. The document renders this field; it no longer
#               restates it.
#   shape       OPTIONAL. the type sketch, as Rust, for rows whose totality is
#               easier read as a declaration than as a sentence. Nine rows
#               carry one. Same move, same reason: the sketch was in the
#               document and the document was hand-maintained.
#   home        REQUIRED. minted | planned — does the canonical path EXIST?
#               This is not `status` and conflating the two is what broke the
#               register. `status` is how far the MIGRATION has got; `home` is
#               whether there is anywhere to migrate TO. Seven rows were
#               `status = target` with a home that had existed for four days
#               (nc-1-kernel / nc-10-judgement / nc-4-evidence landed the types
#               in kernel-types and only nc-11-answer's own three rows were
#               updated), so nothing distinguished them from rows whose home
#               was genuinely unbuilt — and `canonical` is what the refactor
#               ledger copies into every label's `dest`.
#                 minted   a worker can `use` this path today.
#                 planned  nothing is there yet.
#               Enforced both directions by `svrn code refactor status` against
#               the WORKING TREE: a `minted` row that stops resolving fails, and
#               a `planned` row that starts resolving fails too — the second is
#               the drift that actually happened, and it is silent without this.
#   status      holds | partial | target
#   in_program  true if the program does work on it. false = architectural
#               completeness only.
#   phase       which phase lands it. omit when in_program = false.
#   verified_at freeze | differential | journey  (see NOUN_CONVERGENCE §5)
#   measure     the row's live metric as a one-line method (a query or
#               command). `svrn code converge status` re-runs it; the landing
#               verdict re-runs it; nobody recalls it.
#   today       DATED snapshot of the current shape, with citations. Evidence
#               lives here — and it decays: the 2026-08-17 verification pass
#               found six rows of the v1 register materially stale within one
#               day of writing. Re-measure before acting (ARCH §11.1); trust
#               `measure`, not `today`.
#
# (v2 removes the bare `duplicates` integer — a number with no method
# attached is exactly the brittleness this program exists to end; `measure`
# replaces it.)

