# CLA Assistant — gate PRs on a signed Contributor License Agreement.
#
# What it does: on every PR (and when someone comments the sign phrase), the
# contributor-assistant action checks whether each PR author has signed the CLA
# in `CLA.md`. If not, it posts a comment; the author signs by replying with the
# exact phrase below, and the action records the signature (GitHub id + PR +
# timestamp) into a JSON file on a dedicated `cla-signatures` branch. A signed
# author sails through on all future PRs. See CONTRIBUTING.md → Licensing.
#
# ONE-TIME SETUP before this enforces anything (the workflow no-ops until then):
#   1. Create a Personal Access Token (classic, `repo` scope, or a fine-grained
#      token with Contents read/write on this repo). This is what lets the
#      action commit signatures to the cla-signatures branch. The default
#      GITHUB_TOKEN is intentionally NOT used for the signature store so the
#      record can't be rewritten by ordinary workflow permissions.
#   2. Add it as a repository secret named `CLA_ACCESS_TOKEN`
#      (Settings → Secrets and variables → Actions → New repository secret).
#      Secret names can't start with GITHUB_, hence the CLA_ prefix; it's mapped
#      to the action's PERSONAL_ACCESS_TOKEN env var below.
#   3. That's it — the branch and JSON file are created automatically on the
#      first signature. Nothing to pre-commit.
#
# To revoke everyone's signatures (e.g. the CLA text changes materially), delete
# the JSON file on the cla-signatures branch; everyone re-signs on their next PR.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Maps the repo secret (step 2 above) to the token the action uses to
          # write the signature file. Until CLA_ACCESS_TOKEN exists, the action
          # errors out visibly rather than silently skipping the gate.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        with:
          # Where signatures are stored (on the `branch` below, in THIS repo).
          path-to-signatures: 'signatures/version1/cla.json'
          # The document contributors are agreeing to.
          path-to-document: 'https://github.com/alexsbryan/commonwealth-ai/blob/main/CLA.md'
          branch: 'cla-signatures'
          # People/bots exempt from signing: the maintainer and automation.
          allowlist: alexsbryan,dependabot[bot],github-actions[bot]
          # The exact phrase a contributor comments to sign. Keep it in sync
          # with the `if:` condition above and the wording in CONTRIBUTING.md.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, we need you to
            sign the [Contributor License Agreement](https://github.com/alexsbryan/commonwealth-ai/blob/main/CLA.md).
            You keep your copyright; the project stays open source. It takes one
            reply and covers all your future contributions.


            **To sign, comment on this PR with exactly:**


            > I have read the CLA Document and I hereby sign the CLA


            Contributing on behalf of a company? Have it sign the Entity
            agreement in the same document instead. Already signed and still
            seeing this? Comment `recheck`.
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thank you.
