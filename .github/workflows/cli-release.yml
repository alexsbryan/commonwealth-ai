name: CLI release

# Tag-driven release for the Sovereign CLI — the three product binaries a user
# installs (`sovereign-cli` dispatcher + `sovereign-cli-daemon` +
# `sovereign-cli-llm`). NOT `sovereign-cli-dev` (the developer workbench, gated
# behind --features dev-tools).
#
# Trigger:
#   git tag cli-v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2) && git push --tags
#   (the tag version MUST match the workspace [workspace.package] version —
#    the "Verify version matches the tag" step enforces it. Today: cli-v0.1.18.)
#
# What it does:
#   1. Build the 3 binaries per platform, with `cargo build --release --locked`.
#   2. Package them as sovereign-<target>.tar.gz + a .sha256 sidecar.
#   3. Upload everything to a DRAFT GitHub Release (+ a combined SHA256SUMS),
#      which `landing/install.sh` downloads and verifies.
#
# Code signing / notarization are OFF in v1. A CLI tarball downloaded with curl
# and run from the terminal is NOT quarantined by Gatekeeper, so notarization
# isn't needed for this path (the desktop .app is a separate, signed path).

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the release to (e.g. cli-v0.1.0). Blank = workflow ref."
        required: false
  # Callable by the manual "Release (manual)" orchestrator (release.yml) so one
  # button ships CLI + desktop together. `inputs.tag` is populated for both
  # workflow_dispatch and workflow_call; on a plain tag push it's empty and the
  # version-check / resolve-tag steps fall back to GITHUB_REF.
  workflow_call:
    inputs:
      tag:
        description: "Tag to attach the release to (e.g. cli-v0.1.0)."
        required: false
        type: string
        default: ""

permissions:
  contents: write # create / upload to a GitHub Release

jobs:
  build:
    name: build / ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux x86_64 + native macOS Intel (self-hosted) are enabled. GitHub's
          # hosted `macos-13` (Intel) hangs forever on "Waiting for a runner", so
          # Intel runs on the SAME self-hosted Intel Mac as desktop-release.yml
          # (labels self-hosted/macOS/X64). Manual-start: `./run.sh` before
          # tagging. `release` is decoupled (`if: !cancelled()`) so a down runner
          # can't block the Linux tarball. Runner setup lives in the desktop
          # RELEASING.md "macOS Intel (x86_64) — self-hosted runner" section.
          #
          - name: linux-x86_64
            runner: ubuntu-22.04 # older glibc → runs on newer distros too
            target: x86_64-unknown-linux-gnu
          - name: macos-x86_64
            runner: [self-hosted, macOS, X64] # native Intel; start ./run.sh before tagging
            target: x86_64-apple-darwin
          # Enabled 2026-07-02: landing/install.sh already maps M-series Macs
          # to this target, so its ABSENCE 404'd every Apple Silicon install.
          # The old "validate locally first" note is retired by proxy —
          # desktop-release has been building the same dep stack natively on
          # this exact macos-14 image for weeks. `fail-fast: false` + the
          # decoupled release job mean a failure here can't sink the other
          # legs; validate with one workflow_dispatch run before tagging.
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          # - name: windows-x86_64
          #   runner: windows-2022
          #   target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          # When called by release.yml AFTER its bump job pushed the tag, the
          # run's own SHA predates the bump — build the TAG, not the dispatch
          # SHA, or the version check below sees the old Cargo.toml. Empty on
          # tag-push triggers → default (the tag's commit) — unchanged.
          ref: ${{ inputs.tag }}

      - name: Verify version matches the tag
        # The CLI binaries report the workspace version (root Cargo.toml
        # [workspace.package]). Refuse to spend a build on a cli-vX.Y.Z tag
        # whose version disagrees, so `sovereign --version` matches the release
        # name. Mirrors desktop-release.yml's check-desktop-version.sh discipline.
        shell: bash
        run: |
          ref="${{ inputs.tag }}"
          [ -n "$ref" ] || ref="${GITHUB_REF#refs/tags/}"
          case "$ref" in
            cli-v*)
              expected="${ref#cli-v}"
              actual="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
              if [ "$expected" != "$actual" ]; then
                echo "::error::tag $ref expects version $expected but Cargo.toml [workspace.package] is $actual" >&2
                exit 1
              fi
              echo "version check ok: $actual" ;;
            *) echo "not a cli-v* tag ($ref) — skipping version check" ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # CACHE REF-SCOPING (why tag-only releasing is always cold): GitHub
      # Actions caches are restorable only from the run's own ref or the
      # DEFAULT branch. A `cli-v*` tag run saves its cache scoped to that
      # tag, which the next tag's run cannot see — so back-to-back tag
      # releases never warm each other. Releasing via the manual
      # "Release (manual)" orchestrator (release.yml, dispatched on main)
      # runs this workflow on the MAIN ref, so its cache save is
      # main-scoped and every future release — tag or button — restores
      # it. One button-release seeds the cache for good.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "." # single workspace at the repo root
          key: cli-release-${{ matrix.platform.target }}
          # Seed even when a release attempt fails mid-build.
          cache-on-failure: true
      # See ci.yml's test job for the full story: rust-cache's cleanup
      # deletes target/llama-cmake-cache while keeping the sys crate's
      # fingerprint (poisoned cache → link failure). Cache the tree
      # separately; the C++ is CMAKE_BUILD_TYPE=Release regardless of cargo
      # profile, so this key is SHARED with CI — a release restores the
      # C++ built by main's CI runs. (Windows uses a LOCALAPPDATA path
      # instead of this dir; the steps are harmless no-ops there.)
      - name: Cache llama.cpp CMake tree
        uses: actions/cache@v4
        with:
          path: target/llama-cmake-cache
          key: llama-cmake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Guard llama fingerprint vs missing CMake tree
        shell: bash
        run: |
          if ! ls target/llama-cmake-cache/*/lib*/libllama.* >/dev/null 2>&1; then
            rm -rf target/*/.fingerprint/llama-cpp-sys-4-* 2>/dev/null || true
          fi

      - name: Linux build deps
        if: runner.os == 'Linux'
        # protoc + libprotobuf: lance-encoding prost-build. cmake: llama.cpp.
        # mold + clang: pinned as the Linux linker by .cargo/config.toml.
        # LunarG Vulkan SDK: Linux hardcodes llama-cpp-4's `vulkan` feature,
        # so ggml builds with GGML_VULKAN=ON and needs glslc/spirv/libvulkan.
        # (Mirrors desktop-release.yml — keep in sync. No gtk: CLI bins only.)
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          curl -fsSL "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list" \
            | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler libprotobuf-dev cmake mold clang \
            libvulkan-dev vulkan-headers spirv-headers spirv-tools shaderc

      - name: macOS build deps
        if: runner.os == 'macOS'
        env:
          # Don't let brew's 30-day auto-cleanup fire mid-install — on a
          # self-hosted Mac it can trip over pre-existing root-owned files under
          # /usr/local (observed 2026-06-20).
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          # Self-hosted runners launched via ./run.sh inherit a minimal PATH that
          # may lack Homebrew. Source its shellenv and persist the bin dir to
          # later steps. No-op on a hosted runner (brew already global).
          if [ -x /usr/local/bin/brew ]; then
            eval "$(/usr/local/bin/brew shellenv)"
            echo "/usr/local/bin" >> "$GITHUB_PATH"
            echo "/usr/local/sbin" >> "$GITHUB_PATH"
          elif [ -x /opt/homebrew/bin/brew ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          fi
          # lld: .cargo/config.toml's *-apple-darwin rustflags pass `-fuse-ld=lld`
          # (the CLI binaries link llama-cpp-sys-4 the same as the desktop does).
          # protobuf: lance-encoding's prost-build. cmake: llama.cpp's build.
          brew install lld protobuf cmake
          # SDKROOT: llama-cpp-sys-4's bindgen resolves system headers via the SDK.
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build CLI binaries
        run: >
          cargo build --release --locked --target ${{ matrix.platform.target }}
          -p sovereign-cli -p sovereign-cli-daemon -p sovereign-cli-llm

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          triple="${{ matrix.platform.target }}"
          bindir="target/$triple/release"
          stage="dist/sovereign-$triple"
          mkdir -p "$stage"
          for b in sovereign-cli sovereign-cli-daemon sovereign-cli-llm; do
            cp "$bindir/$b" "$stage/"
            strip "$stage/$b" || true   # best-effort; trims the llama.cpp debug info
          done
          tar -czf "dist/sovereign-$triple.tar.gz" -C dist "sovereign-$triple"
          ( cd dist && shasum -a 256 "sovereign-$triple.tar.gz" > "sovereign-$triple.tar.gz.sha256" )
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sovereign-${{ matrix.platform.target }}
          path: |
            dist/sovereign-${{ matrix.platform.target }}.tar.gz
            dist/sovereign-${{ matrix.platform.target }}.tar.gz.sha256

  release:
    name: publish draft release
    needs: build
    # Decoupled from per-leg success: a FAILED leg (e.g. the self-hosted Intel
    # runner is down) still ships the platforms that built, instead of blocking
    # the whole release. The "Combine checksums" step fails loudly (set -e on an
    # empty `*.sha256` glob) if NO leg produced a tarball, so a total failure
    # can't publish an empty draft.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true # flatten all platform artifacts into dist/

      - name: Combine checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"; cat SHA256SUMS

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          # No tag input + branch ref = supported BUILD-ONLY run (cache
          # seeding / leg validation): skip publishing instead of failing —
          # or worse, the old behavior, which would have tried to publish a
          # release literally tagged "refs/heads/main". Malformed tags stay
          # hard errors.
          t="${{ inputs.tag }}"
          if [ -z "$t" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) t="${GITHUB_REF#refs/tags/}" ;;
              *)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "::notice::No tag input and ref is not a tag ($GITHUB_REF) — build-only run; skipping the GitHub Release. Tarballs are attached to this workflow run."
                echo "### Build-only run — no Release published (no tag input; ref $GITHUB_REF). Artifacts are on this run's page." >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac
          fi
          case "$t" in
            cli-v*) ;;
            *) echo "::error::Tag '$t' does not match cli-v* pattern." >&2; exit 1 ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      - name: Publish draft release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true # publish manually after a smoke test, per desktop-release
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
