# Nightly multi-process mesh soak — Layer 2 of the mesh QA plan
# (commonwealth/docs/MESH_QA.md). Spins real `sovereign daemon` subprocesses,
# forms a mesh, and drives a seeded fault+load schedule while asserting the mesh
# invariants via `sovereign mesh check-invariants`. Advisory until proven stable
# on the runner; flip `continue-on-error` off once it's reliably green.
#
# Uses the LOCAL-subprocess backend (no podman/GPU needed) for CI. The podman
# backend (real partitions + cgroup OOM) is for the operator's nightly box —
# see scripts/mesh-soak.sh.
name: Mesh Soak (nightly)

on:
  schedule:
    # WEEKLY, not nightly (2026-07-24 economy pass). At 122 billed minutes over
    # 24 days this was not a major line item, but it is a soak: it looks for
    # slow-accumulating faults, and a weekly sample finds those about as well
    # as a nightly one while costing a seventh as much. It is also `continue-
    # on-error: true`, so nobody was reading six of every seven results anyway.
    # Restore the nightly cadence (`0 7 * * *`) when the mesh is under active
    # change and the extra samples are actually being read.
    - cron: "0 7 * * 6" # Saturdays 07:00 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soak duration (minutes)"
        default: "10"
      nodes:
        description: "Node count"
        default: "3"

jobs:
  soak:
    name: Multi-process mesh soak (local backend)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until reliably green
    timeout-minutes: 30
    env:
      # Match ci.yml: no debuginfo (disk headroom + cache size).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      # Same disk headroom problem as ci.yml's test job — see its comment.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          # The hosted runner has a second, mostly-empty ~65 GB scratch disk
          # at /mnt. Bind-mount target/ onto it (caches still work — tar sees
          # a plain dir) and point TMPDIR there too, so neither the build tree
          # nor compiler scratch can fill the root disk again.
          sudo mkdir -p /mnt/target /mnt/tmp
          sudo chown "$(id -u):$(id -g)" /mnt/target /mnt/tmp
          mkdir -p target
          sudo mount --bind /mnt/target target
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"
          df -h / /mnt | tail -2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Read the CI test job's dependency cache; nightly never writes it.
          shared-key: workspace
          save-if: false
      # See ci.yml's test job: the CMake tree is cached separately from
      # rust-cache (whose cleanup would delete it); the guard forces a
      # rebuild instead of a link failure if the tree is missing.
      - name: Cache llama.cpp CMake tree
        uses: actions/cache@v6
        with:
          path: target/llama-cmake-cache
          key: llama-cmake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Guard llama fingerprint vs missing CMake tree
        shell: bash
        run: |
          if ! ls target/llama-cmake-cache/*/lib*/libllama.* >/dev/null 2>&1; then
            rm -rf target/*/.fingerprint/llama-cpp-sys-4-* 2>/dev/null || true
          fi
      # Full Linux native stack (mirrors ci.yml's check+test job — keep in sync):
      # mold/clang are the pinned linker, the LunarG Vulkan SDK is a build
      # dep of ggml (Linux hardcodes llama-cpp-4/vulkan), and `--bins`
      # includes the Tauri desktop binary → webkit2gtk.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          curl -fsSL "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list" \
            | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler libprotobuf-dev cmake mold clang \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libvulkan-dev vulkan-headers spirv-headers spirv-tools shaderc
      - name: Build CLI
        run: cargo build --bins
      - name: Soak
        run: |
          scripts/mesh-soak.sh \
            --nodes "${{ github.event.inputs.nodes || '3' }}" \
            --minutes "${{ github.event.inputs.minutes || '10' }}" \
            --seed "${{ github.run_number }}"
      - name: SLO gate (advisory until a baseline is committed)
        if: always()
        run: |
          ./target/debug/sovereign-cli mesh soak-gate mesh-soak-findings.jsonl \
            --baseline .github/mesh-slo-baseline.json || true
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mesh-soak-findings
          path: mesh-soak-findings.jsonl
