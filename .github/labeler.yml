# Config for the PR auto-labeler (.github/workflows/labeler.yml).
# Path globs -> labels, so incoming PRs sort themselves by area and you're not
# hand-labeling every one. Uses the actions/labeler v5 schema.
# Missing labels are created automatically on first use.

# The two areas below were directories before the top-level-programs move
# (`corpus-engine*/`, `sovereign/`); the globs list where each one's contents
# went (quality/top-level-moves.toml), so a label covers what it covered.
"area: corpus-engine":
  - changed-files:
      - any-glob-to-any-file:
          - "code/crates/corpus-engine-archaeology/**"
          - "code/crates/corpus-engine-notes/**"
          - "code/crates/corpus-engine-watchers/**"
          - "ingest/crates/corpus-engine/**"
          - "quality/xtask/**"
          - "shared/crates/corpus-engine-atlas-reader/**"
          - "shared/crates/corpus-engine-scip/**"
          - "shared/crates/corpus-engine-sections/**"
          - "shared/crates/corpus-engine-yield/**"

